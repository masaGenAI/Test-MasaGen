name: Deploy nova-app to GitHub Pages

# nova-app（Vite + vite-plugin-singlefile）をビルドし、生成物 dist/ を
# GitHub Pages に公開する。これにより PC・他端末の各ブラウザから
# 同一の固定 URL でアプリにアクセスできる。
# 公開するのは「公開版」（npm run build:public）。Book-Summary の中身は入れない（理由と切り替え方は docs/publication-scope.md）。
# 注意: 学習進捗はブラウザの localStorage に保存されるため端末間では同期しない
# （アプリ内の「バックアップ（書き出し/読み込み）」で手動移行は可能）。

on:
  push:
    branches: ["claude/app-usage-question-1rkdar"]
    paths:
      - "nova-app/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

# Pages へのデプロイに必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行を1本に制限（進行中のデプロイはキャンセルしない）
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nova-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nova-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (public edition, without Book-Summary content)
        run: npm run build:public

      # 全ハブを実際に開いて、実行時エラーが無いかを見る。まず様子を見る段階なので、失敗しても公開は続ける
      # （結果はこのステップのログと、実行結果の一覧の警告に出る）。
      - name: Smoke test (open every hub; does not block the deploy)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$CHROME" ]; then echo "::warning::Chrome が見つからないので、画面の確認を飛ばしました"; exit 0; fi
          npm install --no-save --no-audit --no-fund playwright-core
          cd ..
          if ! CHROMIUM_PATH="$CHROME" node .claude/skills/nova-consistency-audit/scripts/smoke.mjs; then
            echo "::warning::画面の確認で実行時エラーが見つかりました（このステップのログを見てください）"
            exit 1
          fi

      - name: Configure Pages (auto-enable if needed)
        uses: actions/configure-pages@v5
        with:
          # リポジトリで Pages 未設定でもワークフローの token で自動有効化を試みる
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: nova-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Pages 側のステータス反映が遅い日があるため、既定10分→30分に延長
          timeout: 1800000
