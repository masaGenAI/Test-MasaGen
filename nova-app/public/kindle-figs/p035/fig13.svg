span row" x="0" y="1em" dy="1.1em"><tspan font-style="normal" class="text-inner-tspan" font-weight="normal">空気を読む対応</tspan><tspan font-style="normal" class="text-inner-tspan" font-weight="normal"> 責任を伴う決定</tspan></tspan></text></g></g></g><g class="node default" id="my-svg-flowchart-p-6" data-look="neo" transform="translate(186.7109375, 560.8343772888184)"><rect class="basic label-container" style="" x="-162.8203125" y="-29.700000762939453" width="325.640625" height="59.400001525878906"/><g class="label" style="" transform="translate(0, -17.700000762939453)"><rect/><g><rect class="background" style="stroke: none"/><text y="-10.1" style=""><tspan class="text-outer-tspan row" x="0" y="-0.1em" dy="1.1em"><tspan font-style="normal" class="text-inner-tspan" font-weight="normal">共存3原則</tspan><tspan font-style="normal" class="text-inner-tspan" font-weight="normal"> 人が指示を与える</tspan><tspan font-style="normal" class="text-inner-tspan" font-weight="normal"> 人がチェックする</tspan></tspan><tspan class="text-outer-tspan row" x="0" y="1em" dy="1.1em"><tspan font-style="normal" class="text-inner-tspan" font-weight="normal">人が定義したフローに従わせる</tspan></tspan></text></g></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>