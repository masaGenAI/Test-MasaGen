<title>学習ロードマップ トラッカー</title>
<style>
:root{ color-scheme: light; --accent:#2563eb; --accent-d:#1e40af; --ink:#0f172a; }
*{ box-sizing:border-box; }
body{ margin:0; background:#f4f7fb; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif; font-size:14px; line-height:1.5; }
.wrap{ max-width:1600px; width:96%; margin:0 auto; padding:18px 16px 60px; }
h1{ font-size:19px; margin:0 0 2px; font-weight:700; color:var(--accent-d); }
.sub{ color:#64748b; font-size:12px; margin-bottom:14px; } .sub b{ color:#334155; font-weight:600; } .updating{ color:var(--accent); }
.tabs{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px; }
.tab{ border:1px solid #d6e0ee; background:#fff; border-radius:9px; padding:7px 13px; font-size:13px; cursor:pointer; font-weight:600; color:#475569; }
.tab:hover{ background:#eaf1fb; } .tab.on{ color:#fff; border-color:transparent; }
.cards{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:20px; }
@media(max-width:680px){ .cards{ grid-template-columns:repeat(2,1fr);} }
.card{ background:#fff; border:1px solid #e3ebf5; border-radius:12px; padding:12px 13px; }
.card .ttl{ font-size:12.5px; font-weight:700; display:flex; align-items:center; gap:6px; }
.card .dot{ width:9px; height:9px; border-radius:50%; display:inline-block; }
.card .big{ font-size:22px; font-weight:700; margin-top:6px; } .card .big span{ font-size:12px; font-weight:500; color:#94a3b8; }
.bar{ height:6px; border-radius:99px; background:#e8eef6; overflow:hidden; margin-top:8px; } .bar>i{ display:block; height:100%; border-radius:99px; }
.card .mini{ font-size:11px; color:#94a3b8; margin-top:6px; }
.monthnav{ display:flex; align-items:center; justify-content:center; gap:14px; margin:6px 0 14px; }
.monthnav button{ border:1px solid #d6e0ee; background:#fff; border-radius:8px; width:34px; height:34px; font-size:16px; cursor:pointer; color:#475569; }
.monthnav button:hover{ background:#eaf1fb; }
.monthnav .label{ font-size:17px; font-weight:700; min-width:150px; text-align:center; color:var(--accent-d); }
.todaybtn{ width:auto !important; padding:0 12px; font-size:13px !important; }
.legend{ text-align:center; font-size:11.5px; color:#94a3b8; margin:-4px 0 18px; }
.legend span{ margin:0 7px; white-space:nowrap; } .legend i{ display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:3px; vertical-align:middle; }
.cat{ margin-bottom:18px; }
.cat h2{ font-size:14px; margin:0 0 8px; display:flex; align-items:center; gap:7px; font-weight:700; }
.cat h2 .dot{ width:10px; height:10px; border-radius:50%; } .cat h2 .cnt{ font-size:11.5px; color:#94a3b8; font-weight:500; }
.items{ display:flex; flex-direction:column; gap:6px; }
.item{ background:#fff; border:1px solid #e3ebf5; border-left-width:3px; border-radius:9px; padding:9px 12px; display:flex; align-items:center; gap:10px; }
.item .name{ flex:1; font-size:13px; min-width:0; }
.item .date{ font-size:11.5px; color:#94a3b8; white-space:nowrap; font-variant-numeric:tabular-nums; }
.empty{ color:#b6c2d4; font-size:12.5px; padding:6px 2px; }
.badge{ font-size:11px; font-weight:600; padding:2px 9px; border-radius:99px; white-space:nowrap; }
.b-done{ background:#dbeafe; color:#1d4ed8; } .b-prog{ background:#fef3c7; color:#b45309; } .b-todo{ background:#eef2f7; color:#64748b; } .b-hold{ background:#fee2e2; color:#b91c1c; }
.viz{ display:flex; gap:18px; align-items:center; background:#fff; border:1px solid #e3ebf5; border-radius:12px; padding:14px 16px; margin-bottom:14px; flex-wrap:wrap; }
.viz .donut{ flex:0 0 auto; aspect-ratio:1/1; display:block; } .viz .vinfo{ flex:1; min-width:200px; }
.viz .vinfo .hl{ font-size:24px; font-weight:700; } .viz .vinfo .hl span{ font-size:13px; font-weight:500; color:#94a3b8; }
.viz .vinfo .cap{ font-size:12.5px; color:#64748b; margin-bottom:8px; }
.statlist{ display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:4px; }
.statlist .s{ font-size:12px; color:#475569; display:flex; align-items:center; gap:5px; } .statlist .s i{ width:9px; height:9px; border-radius:2px; display:inline-block; }
.addbar{ margin-bottom:10px; }
.addbtn{ border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:8px; padding:7px 14px; font-size:12.5px; font-weight:700; cursor:pointer; }
.addbtn:hover{ background:var(--accent-d); }
.tblwrap{ background:#fff; border:1px solid #e3ebf5; border-radius:12px; overflow-x:auto; overflow-y:visible; }
th.actcol,td.actcol{ width:56px; text-align:center; white-space:nowrap; background:#f7f9fe; padding:4px 4px; }
td.actcol .rowcolorbtn,td.actcol .delrow{ margin:0 3px; }
table{ border-collapse:collapse; width:100%; font-size:11.5px; margin:0 auto; }
th,td{ text-align:left; padding:4px 7px; border-bottom:1px solid #eef2f7; white-space:nowrap; }
th{ background:#eaf1fb; font-weight:700; color:#334155; cursor:pointer; position:sticky; top:0; user-select:none; font-size:11.5px; z-index:1; }
th:hover{ background:#dceafe; } th:active{ background:#cfe0fb; } th .ar{ color:#9fb2cc; font-size:10px; margin-left:3px; }
td.name{ white-space:normal; min-width:220px; max-width:380px; }
tr:hover td{ background:#f8fbff; } td.c{ text-align:center; }
.chip{ font-size:11px; padding:1px 8px; border-radius:6px; background:#eef2f9; color:#475569; }
.catchip{ color:#fff; font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:6px; white-space:nowrap; }
.stsel{ font-size:11px; font-weight:600; padding:3px 22px 3px 10px; border-radius:99px; border:1px solid rgba(0,0,0,.06); cursor:pointer; -webkit-appearance:none; appearance:none; text-align:left; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M2 3.5l3 3 3-3' fill='none' stroke='%23888' stroke-width='1.4'/></svg>"); background-repeat:no-repeat; background-position:right 7px center; }
.einp,.memo,.dinp{ width:100%; min-width:90px; border:1px solid #dbe4f0; border-radius:5px; padding:3px 6px; font-size:11px; font-family:inherit; background:#fff; color:#0f172a; }
.einp:focus,.memo:focus,.dinp:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 2px #dbeafe; }
.einp::placeholder,.memo::placeholder{ color:#aab6c8; }
td.name .einp{ min-width:200px; }
.memo{ min-width:140px; }
.dinp{ min-width:130px; }
.ulink{ font-size:12px; color:var(--accent); text-decoration:none; margin-left:6px; white-space:nowrap; }
.ulink:hover{ text-decoration:underline; }
.nlink{ color:var(--accent); text-decoration:none; font-size:11px; margin-left:4px; } .nlink:hover{ text-decoration:underline; }
tr.rdone td{ background:#e9edf2; color:#9aa6b5; }
tr.rdone .einp,tr.rdone .memo,tr.rdone .dinp{ color:#9aa6b5; background:#e9edf2; border-color:#dde3ea; }
tr.rdone .chip{ opacity:.5; } tr.rdone .stsel{ opacity:.9; }
tr.rdone td.name input{ text-decoration:line-through; }
.urlcell{ cursor:pointer; } .urlcell.muted{ color:#c2cee0; text-decoration:none; }
th[draggable]{ cursor:grab; } th.dragover{ box-shadow: inset 3px 0 0 var(--accent); background:#dceafe !important; }
.colorbtn{ cursor:pointer; margin-left:7px; font-size:12px; position:relative; z-index:3; }
.colorbtn:hover{ color:var(--accent); }
.colormenu{ position:fixed; z-index:80; background:#fff; border:1px solid #d6e0ee; border-radius:8px; box-shadow:0 6px 20px rgba(30,64,175,.18); padding:6px; display:flex; gap:5px; }
.colormenu button{ width:24px; height:24px; border:1px solid #d6e0ee; border-radius:5px; cursor:pointer; font-size:11px; color:#94a3b8; }
.colormenu button:hover{ border-color:var(--accent); }
#toast{ position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#0f172a; color:#fff; font-size:12px; padding:8px 16px; border-radius:8px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:60; }
#toast.show{ opacity:1; } #toast.err{ background:#c0392b; }
.filterbar{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px; }
.filterbar .flabel{ font-size:11.5px; color:#94a3b8; margin-right:2px; font-weight:600; }
.fdrop{ position:relative; display:inline-block; }
.fdrop>summary{ list-style:none; cursor:pointer; border:1px solid #d6e0ee; background:#fff; border-radius:8px; padding:6px 11px; font-size:12px; font-weight:600; color:#475569; white-space:nowrap; }
.fdrop>summary::-webkit-details-marker{ display:none; } .fdrop[open]>summary{ border-color:var(--accent); color:var(--accent); }
.fdrop .fpanel{ position:absolute; z-index:20; top:112%; left:0; background:#fff; border:1px solid #d6e0ee; border-radius:10px; box-shadow:0 6px 20px rgba(30,64,175,.15); padding:8px; min-width:180px; max-height:300px; overflow:auto; }
.fpanel label{ display:flex; align-items:center; gap:7px; padding:4px 6px; font-size:12px; border-radius:6px; cursor:pointer; white-space:nowrap; } .fpanel label:hover{ background:#eaf1fb; }
.fpanel .fbtns{ display:flex; gap:6px; border-top:1px solid #eef2f7; margin-top:6px; padding-top:6px; position:sticky; bottom:-8px; background:#fff; }
.fpanel .fbtns button{ flex:1; font-size:11px; border:1px solid #d6e0ee; background:#fff; border-radius:6px; padding:5px; cursor:pointer; color:#475569; } .fpanel .fbtns button:hover{ background:#eaf1fb; }
.fclear{ border:none; background:none; color:var(--accent); font-size:12px; cursor:pointer; text-decoration:underline; margin-left:2px; }
.fcount{ background:var(--accent); color:#fff; border-radius:99px; font-size:10px; padding:0 5px; margin-left:4px; }
.hint{ font-size:11.5px; color:#94a3b8; margin:0 0 8px; }
.foot{ text-align:center; color:#b6c2d4; font-size:11px; margin-top:24px; }
.undated{ text-align:center; margin-top:8px; } .undated button{ background:none; border:none; color:var(--accent); font-size:12px; cursor:pointer; text-decoration:underline; }
.banner{ background:#eff6ff; border:1px solid #bfdbfe; color:#1e40af; font-size:12px; padding:8px 12px; border-radius:8px; margin-bottom:14px; display:none; }
.hidden{ display:none !important; }
#ov{ position:fixed; inset:0; background:rgba(244,247,251,.93); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; z-index:50; }
#ov .sp{ width:30px; height:30px; border:3px solid #d6e0ee; border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg);} } #ov .t{ font-size:13px; color:#64748b; }

td{ overflow:hidden; text-overflow:ellipsis; }
.einp,.memo,.dinp{ min-width:0 !important; }
td.name{ min-width:0 !important; max-width:none !important; white-space:nowrap; }
.resz{ position:absolute; top:0; right:-1px; width:8px; height:100%; cursor:col-resize; z-index:2; }
.resz:hover{ background:rgba(37,99,235,.35); }
.dblno{ cursor:cell; display:inline-block; min-width:18px; }
.dblno:hover{ text-decoration:underline dotted; color:var(--accent); }
.delrow{ color:#d6deea; cursor:pointer; margin-left:8px; font-size:11px; opacity:0; }
.rowcolorbtn{ cursor:pointer; margin-left:7px; font-size:11px; opacity:0; }
tr:hover .rowcolorbtn{ opacity:1; }
tr:hover .delrow{ opacity:1; } .delrow:hover{ color:#c0392b; }
#rowtools{ position:fixed; display:none; gap:6px; z-index:55; background:#fff; border:1px solid #e3ebf5; border-radius:8px; box-shadow:0 2px 10px rgba(30,64,175,.18); padding:3px 7px; }
#rowtools.show{ display:flex; }
#rowtools span{ cursor:pointer; font-size:13px; line-height:20px; }
.viz{ display:flex; gap:36px; align-items:flex-start; flex-wrap:nowrap; justify-content:center; overflow-x:auto; }
.vhalf{ flex:0 1 auto; display:flex; align-items:flex-start; justify-content:center; gap:16px; padding:4px 8px; }
.vsep{ border-left:1px solid #eef2f7; padding-left:36px; }
.filterbtn{ cursor:pointer; margin-left:6px; color:#7f93b3; position:relative; z-index:3; display:inline-block; }
.filterbtn:hover{ color:var(--accent); } .filterbtn.on{ color:var(--accent); }
.filtermenu{ position:fixed; z-index:80; background:#fff; border:1px solid #d6e0ee; border-radius:8px; box-shadow:0 6px 20px rgba(30,64,175,.18); padding:8px; min-width:180px; max-height:320px; overflow:auto; }
.filtermenu label{ display:flex; align-items:center; gap:7px; padding:4px 6px; font-size:12px; border-radius:6px; cursor:pointer; white-space:nowrap; }
.filtermenu label:hover{ background:#eaf1fb; }
.filtermenu .fbtns{ display:flex; gap:6px; border-top:1px solid #eef2f7; margin-top:6px; padding-top:6px; position:sticky; bottom:-8px; background:#fff; }
.filtermenu .fbtns button{ flex:1; font-size:11px; border:1px solid #d6e0ee; background:#fff; border-radius:6px; padding:5px; cursor:pointer; color:#475569; }
.sortbtn{ cursor:pointer; }
.sortmenu{ position:fixed; z-index:80; background:#fff; border:1px solid #d6e0ee; border-radius:8px; box-shadow:0 6px 20px rgba(30,64,175,.18); padding:5px; display:flex; flex-direction:column; gap:2px; }
.sortmenu button{ text-align:left; border:none; background:none; font-size:12.5px; padding:6px 12px; cursor:pointer; border-radius:6px; color:#334155; white-space:nowrap; }
.sortmenu button:hover{ background:#eaf1fb; }
</style>
</head>

function donut(segs,size,top,bot){

  return `<svg class="donut" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#e8eef6" stroke-width="11"/>${arcs}<text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">${top}</text><text x="${cx}" y="${cy+15}" text-anchor="middle" font-size="10" fill="#94a3b8">${bot}</text></svg>`;
}

function setMeta(x){ document.getElementById("meta").innerHTML=`全${DATA.length}件 ${x||""}`; }

function buildDatalists(){
  let h="";
  Object.keys(OPTIONS).forEach(k=>{ Object.keys(OPTIONS[k]).forEach(prop=>{
    h+=`<datalist id="dl_${k}_${prop}">`+OPTIONS[k][prop].map(o=>`<option value="${esc(o)}"></option>`).join("")+`</datalist>`;
  }); });
  document.getElementById("datalists").innerHTML=h;
}

document.getElementById("prev").onclick=()=>{ cursor=shiftMonth(cursor,-1); renderBoard(); };
document.getElementById("next").onclick=()=>{ cursor=shiftMonth(cursor,1); renderBoard(); };
document.getElementById("today").onclick=()=>{ cursor=todayYM(); renderBoard(); };
document.getElementById("undatedBtn").onclick=renderUndated;

/* ---- background Notion id sync (enables editing without per-row lookup) ---- */
async function syncNotion(){
  try{
    const ids=await discoverIds();
    const pages=await fetchPages(ids,(n,t)=>{ setMeta(`<span class="updating">· Notion照合中 ${n}/${t}</span>`); });
    let matched=0; pages.forEach(pg=>{ const it=findItem(pg.key,pg.name); if(it){ matched++; it.id=pg.id; } });
    saveCache(); const now=new Date(); setMeta(`· Notion照合済 ${now.getHours()}:${String(now.getMinutes()).padStart(2,"0")}（${matched}件）`);
  }catch(e){ setMeta(`<span style="color:#c00">· Notion照合に失敗（編集時に個別照合します）</span>`); }
}

/* ---- boot ---- */
const COLCOLOR={};
function loadColColor(){ try{ var c=JSON.parse(localStorage.getItem("lt_colcolor_v1")||"null"); if(c)Object.assign(COLCOLOR,c); }catch(e){} }
function saveColColor(){ try{ localStorage.setItem("lt_colcolor_v1",JSON.stringify(COLCOLOR)); }catch(e){} }
function setColColor(k,ci,col){ if(!COLCOLOR[k])COLCOLOR[k]={}; if(col)COLCOLOR[k][ci]=col; else delete COLCOLOR[k][ci]; saveColColor(); renderTable(k); }
function closeColorMenu(){ var m=document.querySelector(".colormenu"); if(m)m.remove(); }
function showColorMenu(k,ci,anchor){ closeColorMenu(); var menu=document.createElement("div"); menu.className="colormenu";
  var colors=[["なし",""],["イエロー","#fef9c3"],["ブルー","#dbeafe"],["グリーン","#dcfce7"],["ピンク","#fce7f3"],["オレンジ","#ffedd5"],["パープル","#ede9fe"]];
  colors.forEach(function(p){ var b=document.createElement("button"); b.title=p[0]; if(p[1])b.style.background=p[1]; else b.textContent="✕"; b.onclick=function(e){ e.stopPropagation(); setColColor(k,ci,p[1]); closeColorMenu(); }; menu.appendChild(b); });
  var hb=document.createElement("button"); hb.title="この列を非表示にする"; hb.textContent="🗑"; hb.style.color="#c0392b"; hb.onclick=function(e){ e.stopPropagation(); hideCol(k,ci); closeColorMenu(); }; menu.appendChild(hb);
  document.body.appendChild(menu); var r=anchor.getBoundingClientRect(); var left=r.left; if(left+220>window.innerWidth)left=window.innerWidth-228; menu.style.left=Math.max(8,left)+"px"; menu.style.top=(r.bottom+4)+"px";
  setTimeout(function(){ document.addEventListener("click",closeColorMenu,{once:true}); },0);
}
var rtItem=null, rtTimer=null;
function positionRowTools(tr,it){ rtItem=it; var rt=document.getElementById("rowtools"); var r=tr.getBoundingClientRect(); rt.style.top=(r.top + r.height/2 - 14)+"px"; rt.style.left=Math.max(2,(r.left-54))+"px"; rt.classList.add("show"); clearTimeout(rtTimer); }
function hideRowToolsSoon(){ rtTimer=setTimeout(function(){ var rt=document.getElementById("rowtools"); if(rt)rt.classList.remove("show"); }, 240); }
function setupRowTools(){ var rt=document.getElementById("rowtools"); if(!rt)return; rt.addEventListener("mouseenter",function(){ clearTimeout(rtTimer); }); rt.addEventListener("mouseleave", hideRowToolsSoon); rt.querySelector(".rt-color").onclick=function(e){ e.stopPropagation(); if(rtItem)showRowColorMenu(rtItem,this); }; rt.querySelector(".rt-hide").onclick=function(e){ e.stopPropagation(); if(rtItem)onDeleteRow(rtItem); }; }
var ROWCOLOR={};
function loadRowColor(){ try{ var r=JSON.parse(localStorage.getItem("lt_rowcolor_v1")||"null"); if(r)ROWCOLOR=r; }catch(e){} }
function saveRowColor(){ try{ localStorage.setItem("lt_rowcolor_v1",JSON.stringify(ROWCOLOR)); }catch(e){} }
function setRowColor(it,col){ if(!it)return; var key=delKey(it); if(col)ROWCOLOR[key]=col; else delete ROWCOLOR[key]; saveRowColor(); renderTable(tab); }
function showRowColorMenu(it,anchor){ closeColorMenu(); var menu=document.createElement("div"); menu.className="colormenu";
  var colors=[["なし",""],["レッド","#fee2e2"],["イエロー","#fef9c3"],["オレンジ","#ffedd5"],["グリーン","#dcfce7"],["ブルー","#dbeafe"],["ピンク","#fce7f3"],["パープル","#ede9fe"]];
  colors.forEach(function(p){ var b=document.createElement("button"); b.title=p[0]; if(p[1])b.style.background=p[1]; else b.textContent="✕"; b.onclick=function(e){ e.stopPropagation(); setRowColor(it,p[1]); closeColorMenu(); }; menu.appendChild(b); });
  document.body.appendChild(menu); var r=anchor.getBoundingClientRect(); var left=r.left; if(left+250>window.innerWidth)left=window.innerWidth-258; menu.style.left=Math.max(8,left)+"px"; menu.style.top=(r.bottom+4)+"px";
  setTimeout(function(){ document.addEventListener("click",closeColorMenu,{once:true}); },0);
}
var DELETED=[]; var HIDDEN={};
function loadDelHid(){ try{ var d=JSON.parse(localStorage.getItem("lt_deleted_v1")||"null"); if(d)DELETED=d; }catch(e){} try{ var h=JSON.parse(localStorage.getItem("lt_hidden_v1")||"null"); if(h)HIDDEN=h; }catch(e){} }
function saveDeleted(){ try{ localStorage.setItem("lt_deleted_v1",JSON.stringify(DELETED)); }catch(e){} }
function saveHidden(){ try{ localStorage.setItem("lt_hidden_v1",JSON.stringify(HIDDEN)); }catch(e){} }
function delKey(it){ return it.key+"||"+norm(it.name); }
function applyDeleted(){ if(!DELETED.length)return; var set={}; DELETED.forEach(function(x){set[x]=1;}); DATA=DATA.filter(function(it){ if(set[delKey(it)]){ delete idxByKeyTitle[delKey(it)]; return false; } return true; }); }
function onDeleteRow(it){ DELETED.push(delKey(it)); saveDeleted(); DATA=DATA.filter(function(d){return d!==it;}); delete idxByKeyTitle[delKey(it)]; renderViz(tab); renderTable(tab); renderCards(); toast("行を非表示にしました"); }
function hideCol(k,ci){ if(!HIDDEN[k])HIDDEN[k]=[]; if(HIDDEN[k].indexOf(ci)<0)HIDDEN[k].push(ci); saveHidden(); renderTable(k); }
function showAllCols(k){ delete HIDDEN[k]; saveHidden(); renderTable(k); }
function restoreDeleted(){ DELETED=[]; saveDeleted(); buildFromExcel(); overlayFromCache(); applyDeleted(); renderCurrent(); updateRestore(); toast("行を再表示しました"); }
function updateRestore(){ var el=document.getElementById("restorebar"); if(!el)return; var parts=[]; if(DELETED.length)parts.push('非表示の行 '+DELETED.length+'件 <button class="fclear" id="rstbtn">行を再表示</button>'); var hc=(HIDDEN[tab]||[]).length; if(hc)parts.push('非表示の列 '+hc+'個 <button class="fclear" id="colbtn">列を全表示</button>'); if(CUSTOMW[tab]&&Object.keys(CUSTOMW[tab]).length)parts.push('列幅を変更中 <button class="fclear" id="cwbtn">幅を初期化</button>'); el.innerHTML=parts.join('　｜　'); var b=document.getElementById("rstbtn"); if(b)b.onclick=restoreDeleted; var c=document.getElementById("colbtn"); if(c)c.onclick=function(){ showAllCols(tab); }; var cw=document.getElementById("cwbtn"); if(cw)cw.onclick=function(){ delete CUSTOMW[tab]; saveCustomW(); renderTable(tab); }; }
function boot(){
  cursor=todayYM(); loadWidths(); loadColColor(); loadColOrder(); loadRowColor(); loadCustomW(); loadColFilter(); loadDelHid(); buildDatalists(); buildFromExcel(); overlayFromCache(); applyDeleted(); buildTabs(); setTab("all"); setMeta("");
  setupRowTools(); document.getElementById("ov").style.display="none"; syncNotion();
}
document.addEventListener("click",function(e){ document.querySelectorAll("details.fdrop[open]").forEach(function(d){ if(!d.contains(e.target)) d.removeAttribute("open"); }); });
boot();
</script>
