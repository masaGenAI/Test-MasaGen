巻末にある署名"]},{"f":"空海は香川県の満濃池の修築を指揮したと伝わる。この池は今も、日本最大級の農業用ため池として使われている。","q":"空海が修築を指揮したと伝わる土木事業はどれか。","a":"讃岐国の満濃池の修築","w":["京都の鴨川の堤防の築造","大和の平城京の水路の整備","近江の瀬田川の橋の架設"]},{"f":"空海と最澄は同じ804年の遣唐使で唐へ渡ったが、乗った船は別だった。最澄は短期の還学僧、空海は長期の留学僧という立場だった。","q":"804年の遣唐使で、空海と最澄はどのように唐へ渡ったか。","a":"別々の船に乗り、空海は留学僧、最澄は短期の還学僧だった","w":["同じ船に乗り、ともに留学僧として長期の滞在を命じられた","最澄が先に渡り、空海は数年後に別の使節で渡った","空海は商人の船で密かに渡り、公式の使節には加わらなかった"]}],"related":["最澄","恵果","真言宗","密教","高野山","遣唐使","弘法大師"],"look":{"hair":"bald","hc":"#3A3430","face":"normal","beard":"none","collar":"kimono","cloth":"#7A5C3A"}},{"id":"norinaga","name":"本居宣長","full":"本居宣長","en":"Motoori Norinaga","region":"日本","born":1730,"died":1801,"country":"日本（伊勢国松阪）","era":"近世","tagline":"『古事記伝』を著し、日本古来の心を探った国学の大成者","works":[{"t":"『古事記伝』","n":"約35年をかけて『古事記』を読み解いた注釈書。全44巻、1798年に完成した。"},{"t":"もののあはれ論","n":"『源氏物語』の本質を、もののあはれを知ることに見る文学論を展開した。"},{"t":"漢意の批判","n":"中国の思想の影響を受けた物の見方「漢意」を離れ、古代の心を探ろうとした。"},{"t":"『玉勝間』","n":"学問や考証、日々の随想を記した随筆集。学ぶ姿勢を自由に述べた。"}],"anecdotes":["1763年、伊勢参りの途中で松阪を訪れた賀茂真淵と対面した。「松阪の一夜」と呼ばれ、宣長はこれを機に入門したとされる。","本業は町医者で、小児科を得意とした。診療のかたわら、夜に古典を講じ、研究を続けた。","書斎を「鈴屋」と名づけ、鈴を好んだ。柱に掛けた鈴を鳴らして心を整え、古典に向かったと伝わる。"],"trivia":[{"f":"『古事記』は難解な表記のため読む人が少なかったが、宣長が『古事記伝』で読み方を示したことで、広く読まれるようになった。","q":"『古事記伝』が果たした役割はどれか。","a":"難解な古事記の訓みを示し、広く読まれる基礎をつくった","w":["散逸した古事記の本文を、各地の写本から復元した","古事記を漢文に書き改め、中国の学者にも読めるようにした","古事記と日本書紀の記述の矛盾を、すべて解消した"]},{"f":"宣長は山桜を愛して数多くの歌に詠み、遺言で墓の周りに山桜を植えるよう細かく指示したとされる。","q":"宣長が遺言で、墓の周りに植えるよう望んだとされる木はどれか。","a":"山に自生する山桜の木","w":["庭先に咲く梅の木","墓の目印となる松の木","紅葉が美しい楓の木"]},{"f":"それまで『源氏物語』は、儒教や仏教に沿った教訓の書として読まれることが多かった。宣長は、もののあはれを知る物語だと読み直した。","q":"宣長が『源氏物語』の本質とした見方はどれか。","a":"教訓ではなく、もののあはれを知ることが核心だとした","w":["仏教の因果応報を説く、勧善懲悪の物語だとして読んだ","当時の政治を風刺した、権力批判の書だとした","中国の史書を手本にした、宮廷の記録だとした"]}],"related":["『古事記伝』","『古事記』","賀茂真淵","松阪","『源氏物語』","漢意","国学","「もののあはれ」"],"look":{"hair":"bun","hc":"#5A5A5A","face":"normal","beard":"none","collar":"kimono","cloth":"#4B4A55"}},{"id":"fukuzawa","name":"福沢諭吉","full":"福沢諭吉","en":"Fukuzawa Yukichi","region":"日本","born":1835,"died":1901,"country":"日本（大坂生まれ、中津藩出身）","era":"近代","tagline":"『学問のすすめ』で独立自尊を説き、慶應義塾を開いた啓蒙思想家","works":[{"t":"『学問のすすめ』","n":"1872年から書き継がれ、学問で身を立てる独立の大切さを平易に説いた啓蒙書。"},{"t":"『西洋事情』","n":"欧米の制度や文化を紹介し、幕末から明治初期の知識人に大きな影響を与えた。"},{"t":"『文明論之概略』","n":"1875年刊。西洋と日本を比べ、文明を進歩させる精神のあり方を論じた。"},{"t":"慶應義塾","n":"江戸の蘭学塾を発展させ、のちの慶應義塾大学につながる学塾をつくった。"},{"t":"『福翁自伝』","n":"晩年に語った半生の自伝。率直で軽妙な語り口で、今も読まれている。"}],"anecdotes":["1860年、咸臨丸で渡米し、サンフランシスコの写真館で現地の少女と並んで写真に収まった。この写真が今も残る。","1859年、横浜の外国人居留地を訪れると、学んだオランダ語がほとんど通じなかった。衝撃を受け、英語の独学を始めたとされる。","明治政府から何度も出仕を求められたが断り、生涯、官職に就かず、民間の立場で言論活動を続けた。"],"trivia":[{"f":"『学問のすすめ』は、初編だけで20万部ほどが売れたとされる。当時の日本の人口は約3,500万人で、空前のベストセラーだった。","q":"『学問のすすめ』初編の発行部数として伝わる数はどれか。","a":"20万部ほど","w":["2千部ほど","2万部ほど","200万部ほど"]},{"f":"福沢は英語の「speech」の訳語に「演説」を用い、人前で意見を述べる習慣を広めようとした。「討論」の語も、彼が用いたとされる。","q":"福沢諭吉が「speech」の訳語として用いたとされる言葉はどれか。","a":"演説","w":["講釈","訓示","弁舌"]},{"f":"「慶應義塾」の名は、1868年に塾を江戸の新銭座へ移した際、当時の年号「慶応」にちなんで付けられた。","q":"「慶應義塾」の名は何にちなんでつけられたか。","a":"塾を移転した1868年の年号","w":["創設者の郷里である中津の古い地名","幕府が授けた学問所の称号","緒方洪庵が示した塾の標語"]}],"related":["『学問のすすめ』","『西洋事情』","『文明論之概略』","慶應義塾","咸臨丸","独立自尊"],"look":{"hair":"short","hc":"#3A3430","face":"normal","beard":"none","sb":1,"collar":"kimono","cloth":"#3A3A44"}},{"id":"nishida","name":"西田幾多郎","full":"西田幾多郎","en":"Nishida Kitaro","region":"日本","born":1870,"died":1945,"country":"日本（石川県）","era":"近代","tagline":"『善の研究』で独自の哲学を築いた、京都学派の中心人物","works":[{"t":"『善の研究』","n":"1911年刊。純粋経験を出発点に、実在や善、宗教を一つの体系で論じた最初の著作。"},{"t":"純粋経験","n":"主観と客観が分かれる前の、ありのままの経験を実在の根本と考えた。"},{"t":"場所の論理","n":"後期に、あらゆるものを包む「場所」の立場から、存在や意識を論じた。"},{"t":"絶対無","n":"有と無の対立をも包む究極の場所として、絶対無の考えを深めた。"},{"t":"京都学派の形成","n":"京都帝国大学で多くの弟子を育て、京都学派と呼ばれる哲学者の集まりの中心となった。"}],"anecdotes":["京都帝国大学の教授となり、疏水沿いの道を歩きながら思索した。この道は、のちに「哲学の道」と呼ばれるようになったと伝わる。","石川県の出身で、同郷の鈴木大拙とは学生時代からの友人だった。二人は生涯にわたり交流を続けた。","若い頃から参禅を続け、京都の寺で坐禅に打ち込んだ。その体験が、純粋経験の考えに影響したとされる。"],"trivia":[{"f":"西田幾多郎は東京帝国大学で正規の本科生ではなく、選科生として学んだ。当時の選科生は、図書館の利用などで待遇が低かったとされる。","q":"西田幾多郎が東京帝国大学で学んだときの身分はどれか。","a":"本科でなく、待遇に差のある選科生","w":["外国人留学生として特別に受け入れられた聴講生","官費で派遣された給費生","首席卒業者に与えられる特待生"]},{"f":"『善の研究』は、西田が金沢の第四高等学校などで教えながら書き継いだ原稿をもとに、1911年に刊行された。","q":"『善の研究』の原稿の成り立ちはどれか。","a":"高校で教えながら書き継いだ原稿が一冊にまとまった","w":["留学先のドイツの大学の講義録をそのまま書籍にした","弟子たちが聞き書きした講義を師が校閲した","新聞に連載した評論を後から単行本にまとめた"]}],"related":["『善の研究』","純粋経験","場所の論理","京都学派","鈴木大拙","哲学の道","禅"],"look":{"hair":"short","hc":"#8C8C8C","face":"normal","beard":"none","glasses":"round","collar":"kimono","cloth":"#3A3A44"}},{"id":"watsuji","name":"和辻哲郎","full":"和辻哲郎","en":"Watsuji Tetsuro","region":"日本","born":1889,"died":1960,"country":"日本（兵庫県）","era":"近代","tagline":"『風土』と『倫理学』で、人間を風土と「間柄」から捉えた哲学者","works":[{"t":"『古寺巡礼』","n":"1919年刊。奈良の古寺と仏像を訪ね、美術として味わう視点を広めた紀行的な書。"},{"t":"『風土』","n":"1935年刊。気候や地形が人間の生き方を形づくるとして、三つの型を示した。"},{"t":"『倫理学』","n":"人間を孤立した個人でなく、人と人との「間柄」のなかに捉える倫理学を築いた。"},{"t":"『日本倫理思想史』","n":"古代から近代までの日本の倫理思想を通して見渡した大著。"}],"anecdotes":["1927年から翌年にかけてドイツに留学し、ハイデガーの『存在と時間』を読んで刺激を受けたとされる。『風土』は、その応答として書かれた。","留学の船旅でインド洋や地中海を通り、各地の気候の違いを肌で感じたことが、『風土』の着想につながったとされる。","学生時代は文学青年で、夏目漱石の木曜会に出入りした。ニーチェやキルケゴールを論じる著作で、若くして世に出た。"],"trivia":[{"f":"『古寺巡礼』は、仏像を信仰の対象としてだけでなく、美術として味わう視点を広めた。刊行以来、版を重ねて今も読まれている。","q":"『古寺巡礼』が広めた新しい視点はどれか。","a":"仏像を美術としても味わう見方","w":["寺の経済的な役割を重く見る見方","仏像の作者の出自を調べる系譜学の見方","寺を国防の拠点として評価する見方"]},{"f":"『風土』で和辻は、世界の風土をモンスーン・砂漠・牧場の三つの型に分けた。日本は、台風の性格も併せもつと論じた。","q":"『風土』で和辻が示した三つの型に含まれないものはどれか。","a":"熱帯雨林","w":["モンスーン","砂漠","牧場"]},{"f":"和辻は、日本語の「人間」がもとは「人の世、世間」を意味したことに注目し、人を個人でなく関係のなかの存在と捉える根拠にした。","q":"和辻が「人間」という語から読み取った意味はどれか。","a":"もとは世間を指し、関係のなかの人を表す","w":["もとは神に対して人を指し、被造物を表す","もとは武士に対して庶民を指し、身分を表す","もとは自然に対して人を指し、理性を表す"]}],"related":["『風土』","『古寺巡礼』","『倫理学』","間柄","ハイデガー","西田幾多郎","京都学派"],"look":{"hair":"short","hc":"#4A4A4A","face":"round","beard":"none","glasses":"round","collar":"collar","cloth":"#3A3A44"}}],"items":[{"id":"idea","name":"イデア論","full":"プラトンのイデア論","en":"Theory of Forms","region":"海外","category":"思想・学派","when":"紀元前4世紀ごろ","where":"古代ギリシア（アテネ）","era":"古代","tagline":"目に見える世界の背後に、永遠で完全な真の実在があるとする考え","facts":[{"t":"感覚の世界と知性の世界","n":"目に見える個物は移ろい不完全で、変わらない完全な型がイデアとして実在すると考えた。"},{"t":"善のイデア","n":"イデアの頂点には善のイデアがあり、あらゆるものに存在と認識の根拠を与えるとされた。"},{"t":"想起説","n":"魂は生まれる前にイデアを見ており、学ぶこととは思い出すことだと説明した。"}],"famous":[{"t":"洞窟の比喩","n":"壁の影を現実と思う囚人が、外の太陽の下の本物を知るまでの過程でイデアの認識を描く。"},{"t":"数学の例","n":"どんなに正確に描いても図の円は不完全で、数学が扱う完全な円がイデアの例とされる。"},{"t":"アリストテレスの批判","n":"弟子のアリストテレスは、イデアが個物から離れて存在するという点を批判した。"}],"anecdotes":["犬儒派のディオゲネスは、机や杯は見えるが、机そのものや杯そのものは見えないと皮肉ったと伝わる。","後期の対話篇『パルメニデス』では、プラトン自身が、イデア論の難点を登場人物に厳しく検討させている。","イデアという語は、ギリシア語の「見る」に関わる語に由来し、もとは「姿・形」を意味した。"],"trivia":[{"f":"「アイデア」の語源はギリシア語のイデアだが、プラトンのイデアは頭の中の思いつきではなく、心の外に実在する完全な型のことだった。","q":"プラトンのイデアは、現代の「アイデア（思いつき）」とどう違ったか。","a":"人間の心の外に実在する、完全で永遠の型","w":["各人の頭に浮かんだ、その人だけの思いつき","時代ごとに作り変えられる、社会の約束事","感覚を通じて集めた経験を整理した、記憶の像"]},{"f":"ラファエロの壁画『アテネの学堂』では、中央のプラトンが指を立てて天を指し、アリストテレスが手のひらを地に向けている。師と弟子の立場の違いを表すと解釈される。","q":"『アテネの学堂』で、プラトンの仕草として描かれたものはどれか。","a":"指を立てて天を指している","w":["手のひらを地面に向けている","両腕を組んで床を見つめている","書物を広げて机に向かっている"]}],"people":["プラトン","ソクラテス","アリストテレス"],"related":["洞窟の比喩","『国家』","アカデメイア","哲人王","形而上学"]},{"id":"cogito","name":"我思う、ゆえに我あり","full":"コギト・エルゴ・スム","en":"Cogito, ergo sum","region":"海外","category":"概念","when":"1637年に初出","where":"オランダ（デカルトの著作）","era":"近代","tagline":"すべてを疑っても、疑っている自分の存在だけは疑えないという出発点","facts":[{"t":"初出","n":"1637年の『方法序説』にフランス語で現れ、1644年の『哲学原理』でラテン語の形で示された。"},{"t":"方法的懐疑の到達点","n":"感覚も夢も数学も疑ったすえに、疑っている自分だけは疑えないという点に行き着いた。"},{"t":"近代哲学の出発点","n":"神や世界でなく、考える自我を知の土台に置き、近代の主体中心の哲学を開いたとされる。"}],"famous":[{"t":"『方法序説』","n":"この命題が最初に現れる書。理性を正しく導く方法を、自伝的に語る。"},{"t":"『省察』","n":"疑う私の存在が確実だという結論を、より詳しく論じた書。"},{"t":"後世の批判","n":"ニーチェらは、思考する「私」が存在すると決めつける点を疑った。"}],"anecdotes":["デカルトの同時代の学者が、5世紀のアウグスティヌスにも似た議論があると指摘した。誤ることがあっても、誤る自分は存在するという議論である。","デカルトは学校で学んだ学問に満足できず、書物でなく世の中の経験から学ぼうとして、若くオランダの軍に加わったと伝わる。"],"trivia":[{"f":"この命題は、有名なラテン語の形より前に、まず『方法序説』にフランス語で書かれた。ラテン語の形が出るのは、1644年の『哲学原理』である。","q":"「我思う、ゆえに我あり」が最初に書かれた言語はどれか。","a":"学者の言葉のラテン語でなく、フランス語","w":["古代の哲学者たちが使っていたギリシア語","当時の商人の言葉であったオランダ語","教会の公用語であるイタリア語"]},{"f":"デカルト自身は、この命題を三段論法のような推論ではなく、心が一目で見抜く直観だと説明した。","q":"デカルトは、この命題をどのように位置づけたか。","a":"推論の結論でなく、一目で見抜く直観","w":["三段論法で導かれる、厳密な証明の結論","神の啓示によって与えられた、信仰の命題","経験を積み重ねて得た、帰納的な一般法則"]}],"people":["デカルト"],"related":["方法的懐疑","『方法序説』","『省察』","心身二元論","アウグスティヌス","ニーチェ"]},{"id":"teigen","name":"定言命法","full":"定言命法（カントの道徳法則）","en":"Categorical imperative","region":"海外","category":"概念","when":"1785年","where":"プロイセン（ケーニヒスベルク）","era":"近代","tagline":"結果や好みに関わらず、無条件に従うべき道徳の命令","facts":[{"t":"仮言命法との違い","n":"「幸せになりたいなら〜せよ」という条件つきの命令でなく、条件を問わず従うべき命令。"},{"t":"普遍化可能性","n":"自分の行動の原則が、誰もが従う普遍的な法則になっても矛盾しないかを問う。"},{"t":"人格の尊重","n":"人を単なる手段としてでなく、同時に目的としても扱えという形でも表される。"},{"t":"善意志","n":"結果でなく、義務にもとづく意志の善さが、道徳の価値を決めるとした。"}],"famous":[{"t":"『道徳形而上学の基礎づけ』","n":"1785年刊の書で、定言命法がいくつかの定式で示される。"},{"t":"『実践理性批判』","n":"1788年刊。道徳法則と自由の関係を論じ、倫理学の基礎を述べる。"},{"t":"偽りの約束の例","n":"返す気のない借金の約束は、普遍化すると約束の制度が成り立たなくなる例で説いた。"}],"anecdotes":["カントは、人を殺そうと追う者に友人の居場所を聞かれても嘘をついてはならないという立場をとり、後世に大きな議論を呼んだ。","詩人シラーは、義務を厳格に重んじるカントの倫理を、人情に欠けると皮肉る短い詩を作ったと伝わる。"],"trivia":[{"f":"定言命法は、「自分がされたくないことを人にするな」という黄金律とは別物とされる。カント自身が、黄金律は普遍的な原理になりえないと退けた。","q":"カントが黄金律についてとった態度はどれか。","a":"普遍的な原則にはなりえないとして退けた","w":["定言命法の別名として全面的に採用した","聖書の教えであり哲学とは無関係だと避けた","人間の義務のうち最も重要なものとして称えた"]},{"f":"人を単なる手段としてだけでなく目的として扱えという定式は、人間の尊厳という考えに影響を与え、現代の人権論でもよく引かれる。","q":"この定式が現代の議論に影響を与えた考えはどれか。","a":"人間の尊厳を土台にした人権の考え方","w":["経済活動を自由にする市場競争の原理","国家を最優先にする全体主義の原理","結果の総量で善悪を測る功利の原理"]}],"people":["カント"],"related":["『道徳形而上学の基礎づけ』","『実践理性批判』","善意志","功利主義","啓蒙"]},{"id":"jitsuzon","name":"実存主義","full":"実存主義（エグジスタンシャリスム）","en":"Existentialism","region":"海外","category":"思想・学派","when":"19世紀から20世紀半ば","where":"ヨーロッパ（特にフランス・ドイツ）","era":"現代","tagline":"抽象的な人間一般でなく、いま生きる「わたし」の存在から考える立場","facts":[{"t":"先駆者","n":"19世紀のキルケゴールとニーチェが先駆とされ、個人の生き方を問う姿勢を示した。"},{"t":"実存は本質に先立つ","n":"人はまず存在し、その後の選択で自分が何者かを作っていくという、サルトルの考え。"},{"t":"自由と責任","n":"人は自らの選択に責任を負う自由な存在であり、その重さが不安として現れるとした。"},{"t":"戦後の流行","n":"第二次大戦後のパリを中心に流行し、文学・演劇・映画にも影響を与えた。"}],"famous":[{"t":"サルトルとボーヴォワール","n":"サルトルが『存在と無』で理論を、ボーヴォワールが女性の問題などで実践を広げた。"},{"t":"ハイデガー","n":"『存在と時間』で、人間を自分の死に向き合う存在として分析した。"},{"t":"キルケゴール","n":"信仰を一人で引き受ける「単独者」という生き方を重んじた。"}],"anecdotes":["ハイデガーやカミュは実存主義者と呼ばれることを拒み、サルトルも当初はこの呼び名をためらったと伝わる。","戦後のサン・ジェルマン・デ・プレには、黒い服で夜通し議論する若者が集まり、「実存主義者」の装いが一種の流行になった。"],"trivia":[{"f":"1945年10月のサルトルの講演『実存主義はヒューマニズムである』には聴衆が詰めかけ、椅子が壊れ、気を失う人も出たと伝わる。","q":"1945年の講演で、会場に起きたと伝わることはどれか。","a":"聴衆が詰めかけ、椅子が壊れて気を失う人も出た","w":["講演が政府に禁止され、途中で中止となった","聴衆がほとんど集まらず、主催者が延期した","反対派が会場に乱入し、警察が出動して中止になった"]},{"f":"1948年、カトリック教会はサルトルの著作全体を禁書目録に入れた。実存主義の影響の大きさを示す出来事である。","q":"1948年にサルトルの著作全体が入れられた目録はどれか。","a":"カトリック教会の禁書目録","w":["フランス政府の発禁図書目録","ソ連作家同盟の推薦図書目録","大学図書館協会の閲覧制限目録"]}],"people":["サルトル","ニーチェ"],"related":["キルケゴール","ハイデガー","ボーヴォワール","アンガージュマン","『存在と無』","『嘔吐』"]},{"id":"kouri","name":"功利主義","full":"功利主義（ベンサムとミル）","en":"Utilitarianism","region":"海外","category":"思想・学派","when":"18世紀末から19世紀","where":"イギリス","era":"近代","tagline":"行為の善悪を、社会全体の幸福を増やすかどうかで判断する考え","facts":[{"t":"ベンサムの体系化","n":"1789年刊の著作で、快楽の量を比べて善悪を測る考えを体系にまとめた。"},{"t":"快楽と苦痛","n":"人間は快楽と苦痛に支配されると見て、快楽を増やし苦痛を減らす行為を善とした。"},{"t":"ミルの修正","n":"ミルは快楽に質の差があるとし、量だけでなく質も重んじる修正を加えた。"},{"t":"制度への応用","n":"法や政治の改革に使われ、刑罰の見直しや選挙権拡大の議論を支えた。"}],"famous":[{"t":"ベンサム","n":"「最大多数の最大幸福」を掲げ、法や制度の改革を論じた思想家。"},{"t":"ミル","n":"『自由論』と『功利主義』で、個人の自由と功利の両立を論じた。"},{"t":"パノプティコン","n":"ベンサムが構想した、中央の塔から全体を見渡せる円形の監獄の設計案。"}],"anecdotes":["ミルは3歳でギリシア語を学び始めるなど、父の厳しい英才教育を受けた。20歳のころに心の危機に陥ったと、自伝に記している。","1867年、下院議員だったミルは、選挙権を女性にも認める修正案を提出した。否決されたが、女性参政権運動に影響を与えた。","ベンサムは、動物にとって大切なのは理性や言葉の有無でなく、苦しみを感じるかどうかだと述べ、動物への配慮を論じた。"],"trivia":[{"f":"ベンサムは遺言により、遺体が保存されて服を着せられ、ロンドンのユニバーシティ・カレッジに今も置かれている。「オート・アイコン」と呼ばれる。","q":"ベンサムが遺言で託した、自分の遺体の扱いはどれか。","a":"保存して服を着せ、大学に置くこと","w":["火葬して遺灰を海に撒くこと","解剖の教材として医学校へ寄贈すること","故郷の墓地に石像を建てること"]},{"f":"有名な「トロッコ問題」は、功利主義の考え方を試す思考実験として知られる。最初に示したのは、イギリスの哲学者フィリッパ・フットとされる。","q":"トロッコ問題を最初に示したとされる哲学者は誰か。","a":"イギリスの哲学者フィリッパ・フット","w":["アメリカの哲学者ジョン・ロールズ","ドイツの哲学者ハンナ・アーレント","イギリスの哲学者バーナード・ウィリアムズ"]},{"f":"「最大多数の最大幸福」に近い表現は、ベンサムの発明ではない。18世紀前半にスコットランドの哲学者ハチソンが、すでに似た言い方をしていた。","q":"「最大多数の最大幸福」に近い表現を、ベンサムより先に使ったとされる人物は誰か。","a":"スコットランドの哲学者ハチソン","w":["フランスの思想家モンテスキュー","ドイツの哲学者ライプニッツ","イギリスの経済学者アダム・スミス"]}],"people":[],"related":["最大多数の最大幸福","ベンサム","ミル","定言命法","善意志","プラグマティズム"]},{"id":"benshoho","name":"弁証法","full":"弁証法（ディアレクティケー）","en":"Dialectic","region":"海外","category":"概念","when":"古代ギリシアから19世紀","where":"ギリシア・ドイツ","era":"近代","tagline":"対立や矛盾を通して、より高い認識や現実へ進む考え方","facts":[{"t":"語源","n":"ギリシア語の「対話の技術」に由来し、ソクラテスやプラトンの問答法に始まる。"},{"t":"ヘーゲル","n":"矛盾を否定しつつ高い段階で保つ止揚により、精神が歴史のなかで発展すると考えた。"},{"t":"マルクス","n":"ヘーゲルの弁証法を唯物論の立場に作り変え、社会の発展を階級の対立から説明した。"},{"t":"正・反・合","n":"この図式で語られがちだが、ヘーゲル自身の中心的な用語ではないとされる。"}],"famous":[{"t":"ソクラテスの問答","n":"相手の考えの矛盾を示し、より確かな考えへ導く対話の方法。"},{"t":"ヘーゲル","n":"『精神現象学』などで、意識が矛盾を経て発展する過程を描いた。"},{"t":"マルクス","n":"弁証法を社会の分析に用い、歴史を階級闘争の展開と捉えた。"}],"anecdotes":["ヘーゲルは、イエナに入城したナポレオンを見て、歴史を動かす力の現れだと友人への手紙で感嘆したと伝わる。","マルクスは、ヘーゲルの弁証法は頭で立っていると評し、これを足で立たせ直す必要があると述べた。","エレアのゼノンは、足の速いアキレスが先に出た亀に追いつけないという逆説で、運動の概念に潜む矛盾を示そうとしたと伝わる。"],"trivia":[{"f":"「正・反・合」の図式はヘーゲル弁証法の定番として知られるが、ヘーゲル自身は中心的な言葉として使わなかったとされる。","q":"「正・反・合」について、研究者が指摘していることはどれか。","a":"ヘーゲル自身の用語としては中心でない","w":["古代ギリシアで定式化された論理学の用語である","マルクスが初めて作り出した新語である","カントが『純粋理性批判』で定義した"]},{"f":"ソクラテスの母は産婆で、ソクラテスは自分の問答を、相手が自ら真理を産むのを助けるお産の手伝いにたとえたとされる。","q":"ソクラテスが自分の問答法にたとえたとされる職業はどれか。","a":"お産を助ける産婆","w":["船を造る船大工","鉄を鍛える鍛冶屋","羊を導く羊飼い"]},{"f":"ヘーゲルの「止揚」は、ドイツ語のアウフヘーベンの訳である。この語は「取り去る」と「保存する」の両方の意味をもつ。","q":"ドイツ語のアウフヘーベンがもつ意味はどれか。","a":"取り去ることと保存することの両方","w":["引き上げることと引き下げることの両方","分けることと結び合わせることの両方","問うことと答えることの両方"]}],"people":["ソクラテス","プラトン"],"related":["ヘーゲル","マルクス","止揚","問答法","ソクラテス"]},{"id":"pragmatism","name":"プラグマティズム","full":"プラグマティズム（実用主義）","en":"Pragmatism","region":"海外","category":"思想・学派","when":"1870年代から20世紀初め","where":"アメリカ","era":"近代","tagline":"考えの意味や真理を、実際の行動や結果から捉えるアメリカ生まれの哲学","facts":[{"t":"語源と成立","n":"ギリシア語で行為を意味する語に由来する。1870年代にパースが論じ、のちジェイムズが広めた。"},{"t":"意味の確定","n":"ある観念の意味は、それが実際にもたらす結果を考えることで明らかになるとした。"},{"t":"真理の見方","n":"ジェイムズは、実際にうまく働き、役に立つ考えを真理と見る立場を示した。"},{"t":"教育と民主主義","n":"デューイは、経験から学ぶ教育と、民主主義の考え方を深めた。"}],"famous":[{"t":"パース","n":"論理学者。考えの意味を結果から明らかにする方法を示し、創始者とされる。"},{"t":"ジェイムズ","n":"心理学者・哲学者。『プラグマティズム』(1907)でこの立場を一般に広めた。"},{"t":"デューイ","n":"哲学者・教育学者。実験学校を開き、学校と社会のあり方を論じた。"}],"anecdotes":["1870年代初め、マサチューセッツ州ケンブリッジで、パースやジェイムズらが「形而上学クラブ」という談話会を開いた。短命だったが、この立場の出発点とされる。","ジェイムズは医学を学んだのち、ハーバード大学で心理学を教えた。1890年の『心理学原理』は、この分野の古典とされる。","デューイは1919年に来日して東京帝国大学などで講義し、その後中国に渡って約2年滞在し、各地で講演を行った。"],"trivia":[{"f":"創始者パースは、ジェイムズらの広め方に不満をもち、1905年に自分の立場を「プラグマティシズム」と呼び直して区別しようとした。","q":"ジェイムズが広めたプラグマティズムを見て、パースがとった態度はどれか。","a":"自分の立場を別の名で呼び、区別した","w":["ジェイムズの説を引き継ぎ、共著で体系化した","広まったことを喜び、自分の教授職を譲った","論争を避け、哲学の世界から完全に引退した"]},{"f":"デューイはシカゴ大学に実験学校を開き、実際にやってみる経験を通して学ぶ教育を試みた。「為すことによって学ぶ」という方針で知られる。","q":"デューイがシカゴ大学付属の実験学校で重んじた学び方はどれか。","a":"実際にやってみる経験を通した学び","w":["教師の講義を暗唱する学び","古典の原典を一字ずつ読み込む学び","試験の成績を競い合う学び"]},{"f":"哲学者ウィリアム・ジェイムズの弟は、小説家のヘンリー・ジェイムズである。兄弟はともにアメリカの知の世界を代表した。","q":"ウィリアム・ジェイムズの弟として知られる人物は誰か。","a":"小説家のヘンリー・ジェイムズ","w":["歴史家のヘンリー・アダムズ","思想家のラルフ・ワルド・エマソン","作家のマーク・トウェイン"]}],"people":[],"related":["パース","ジェイムズ","デューイ","形而上学クラブ","功利主義"]},{"id":"renaissance","name":"ルネサンスと人文主義","full":"ルネサンスと人文主義（ヒューマニズム）","en":"Renaissance and Humanism","region":"海外","category":"思想・学派","when":"14世紀から16世紀","where":"イタリアから西ヨーロッパへ","era":"中世・ルネサンス","tagline":"古典古代の学びに立ち返り、人間の可能性を見直した文化運動","facts":[{"t":"ルネサンス","n":"フランス語で「再生」を意味し、古代ギリシア・ローマの文化の復興を指す。"},{"t":"人文主義","n":"古典の言語や文学を学び、人間らしい教養を重んじる姿勢。ラテン語のフマニタスに由来する。"},{"t":"広がり","n":"14世紀のイタリアで始まり、15〜16世紀にヨーロッパ各地へ広がった。"},{"t":"技術の後押し","n":"活版印刷の普及が、古典や人文主義者の著作の流通を後押しした。"}],"famous":[{"t":"ペトラルカ","n":"古典の写本を探し集め、古代の作家への敬意を示した詩人。人文主義の父と呼ばれる。"},{"t":"エラスムス","n":"『愚神礼賛』(1511)で教会や学者を風刺した、オランダの人文主義者。"},{"t":"フィレンツェ","n":"メディチ家などの保護のもと、芸術家や学者が集まった都市。"}],"anecdotes":["ペトラルカは1341年、ローマで桂冠詩人の冠を授けられた。古代以来の栄誉を復活させる出来事として注目された。","1453年にコンスタンティノープルが陥落すると、ギリシア語に通じた学者がイタリアへ移り、ギリシア古典の研究が進んだとされる。","エラスムスは『愚神礼賛』を、友人トマス・モアの家に滞在中に書いたとされる。題名はモアの名にかけたしゃれと言われる。"],"trivia":[{"f":"ルネサンスの時代像を広めたのは、スイスの歴史家ブルクハルトの1860年の著作『イタリア・ルネサンスの文化』である。この書が、ルネサンスを一つの時代として描く見方を定着させた。","q":"ルネサンス像を広めた1860年の著作の著者は誰か。","a":"スイスの歴史家ブルクハルト","w":["フランスの哲学者ヴォルテール","ドイツの哲学者ヘーゲル","イギリスの歴史家ギボン"]},{"f":"「中世」という時代の区切りは、古代の復興をめざした人文主義者たちが、古代と自分たちの間の時代を指して使い始めたとされる。","q":"「中世」という見方を生んだとされる人々はどれか。","a":"古代の復興をめざした人文主義者","w":["宗教改革を進めたプロテスタントの神学者","啓蒙の世紀に登場した百科全書派の学者","産業革命期に台頭した近代の経済学者"]},{"f":"15世紀の人文主義者ロレンツォ・ヴァッラは、言語の分析によって『コンスタンティヌスの寄進状』が偽文書であることを示した。","q":"ヴァッラが偽文書だと論証した文書はどれか。","a":"コンスタンティヌスの寄進状","w":["マグナ・カルタの原本","古代バビロニアのハンムラビ法典の写し","十二表法の石板"]}],"people":[],"related":["ペトラルカ","エラスムス","フィレンツェ","活版印刷","古典古代"]},{"id":"kiki","name":"古事記と日本書紀","full":"古事記（712年）と日本書紀（720年）","en":"Kojiki and Nihon Shoki","region":"日本","category":"書物・制度","when":"712年と720年","where":"大和朝廷（奈良時代）","era":"古代・中世","tagline":"神話から古代の天皇までを記した、日本最古級の二つの歴史書","facts":[{"t":"古事記","n":"712年に太安万侶が編んで献上。上・中・下の三巻で、神話から推古天皇までを記す。"},{"t":"日本書紀","n":"720年に完成。舎人親王らが編んだ、漢文の年代記で、神代から持統天皇までを記す。"},{"t":"二つの違い","n":"古事記は物語的で国内向け、日本書紀は漢文の正史で対外的な性格をもつとされる。"},{"t":"総称","n":"二つを合わせて「記紀」と呼び、日本神話の主な資料となっている。"}],"famous":[{"t":"国生み","n":"イザナキとイザナミの二神が、日本の島々を次々に生み出す神話。"},{"t":"天岩戸","n":"天照大神が岩屋に隠れ、神々が祭りを開いて外へ導く話。"},{"t":"ヤマタノオロチ","n":"スサノヲが八つの頭をもつ大蛇を退治する話。"}],"anecdotes":["古事記の序文によれば、稗田阿礼は一度見聞きしたことを忘れない記憶力の持ち主で、天武天皇が語り伝えを誦み習わせたとされる。","平安時代の朝廷では、日本書紀を学者が講義する「日本紀講」が、数度にわたって開かれた。","古事記は長く読む人が少なく、江戸時代に本居宣長が『古事記伝』で読み解くまで、日本書紀ほど注目されなかった。"],"trivia":[{"f":"古事記は、漢字の音を借りて日本語を書き表す方法と、漢字の意味を使う書き方を混ぜて、日本語の語をできるだけ残そうとした。","q":"古事記の表記の特徴はどれか。","a":"漢字の音と意味を使い分けて日本語を書き表した","w":["仮名文字だけで、平易な口語体に書かれた","純粋な漢文で、日本語の語を一切用いずに書かれた","梵字と漢字を交えて、仏典の形式で書かれた"]},{"f":"『日本書紀』には、聖徳太子が十人の訴えを同時に聞いても聞き誤らなかったという話が載り、「豊聡耳」の名の由来とされる。","q":"『日本書紀』の聖徳太子の伝承で、名の由来とされる逸話はどれか。","a":"十人の訴えを同時に聞き分けた","w":["一夜で十の経典を暗誦した","十人の師に同時に教えを受けた","十の都を一代で造営した"]},{"f":"『日本書紀』は、神話の本文のあとに「一書に曰く」として別の伝えを載せる。異なる説をそのまま並べる編集が特徴的である。","q":"『日本書紀』の神話の編集の特徴はどれか。","a":"異なる伝えを別の説として並べて載せた","w":["異説をすべて省き、一つの説に統一した","朝廷の公式の説だけを残し、他は削除した","神話を省いて、人の世の出来事だけを記した"]}],"people":["本居宣長"],"related":["『古事記』","『日本書紀』","稗田阿礼","太安万侶","天照大神","『古事記伝』","国学"]},{"id":"kokugaku","name":"国学","full":"国学（和学）","en":"Kokugaku (National Learning)","region":"日本","category":"思想・学派","when":"江戸時代中期から後期","where":"日本（京・江戸・伊勢）","era":"近世","tagline":"古典の研究から、儒教や仏教に染まる前の日本古来の心を探った学問","facts":[{"t":"先駆","n":"17世紀末、契沖の『万葉集』研究が土台となり、荷田春満らが古典研究を広げた。"},{"t":"四大人","n":"荷田春満、賀茂真淵、本居宣長、平田篤胤の四人を、国学の四大人と呼ぶ。"},{"t":"方法","n":"古い言葉を文献学的に調べ、後世の解釈を離れて原典を読み直した。"},{"t":"影響","n":"のちに復古神道や尊王の思想とも結びつき、幕末の思想にも影響した。"}],"famous":[{"t":"賀茂真淵","n":"『万葉集』の研究で知られ、宣長の師となった国学者。"},{"t":"本居宣長","n":"『古事記伝』を著して古事記研究を大成し、国学の中心となった。"},{"t":"平田篤胤","n":"宣長の没後の門人を自称し、神道色の強い国学を広めた。"}],"anecdotes":["「国学」という語は、古代の律令制で国ごとに置かれた学校の名でもあった。江戸時代には、儒学に対する日本の学問の意味で使われた。","宣長が真淵に直接会ったのは1763年の一夜だけとされる。その後は手紙で質問を重ね、教えを受けた。","平田篤胤は、直接会ったことのない宣長を師と仰ぎ、没後の門人を自称して、その学問を広めた。"],"trivia":[{"f":"国学の先駆者契沖は真言宗の僧侶で、水戸の徳川光圀の依頼を受けて、『万葉集』の注釈書『万葉代匠記』を著した。","q":"国学の先駆者契沖の身分はどれか。","a":"真言宗の僧侶","w":["伊勢神宮の神官","水戸藩の儒学者","幕府の医官"]},{"f":"賀茂真淵は、将軍家の一族である田安宗武に仕え、和歌や古典を教えた。江戸で多くの門人を育てた。","q":"賀茂真淵が仕えた主君はどの人物か。","a":"徳川吉宗の子の田安宗武","w":["紀州藩主だった徳川治宝","水戸藩主の徳川光圀","将軍の徳川綱吉"]}],"people":["本居宣長"],"related":["契沖","賀茂真淵","平田篤胤","『万葉集』","漢意","『古事記伝』","「もののあはれ」"]},{"id":"shushi","name":"朱子学と陽明学","full":"朱子学と陽明学（宋明の儒学）","en":"Neo-Confucianism: Zhu Xi and Wang Yangming","region":"日本","category":"思想・学派","when":"南宋・明で成立、江戸期に受容","where":"中国から日本へ","era":"近世","tagline":"宋と明で生まれ、江戸の武士の学問と倫理を形づくった儒学の二大潮流","facts":[{"t":"朱子学","n":"南宋の朱熹が大成。理と気で世界を説明し、学問を積んで人格を磨くことを説く。"},{"t":"陽明学","n":"明の王陽明が唱えた。心そのものが理であるとし、知ることと行うことは一体だとした。"},{"t":"幕府と朱子学","n":"幕府は朱子学を重んじ、林羅山を登用した。1790年の寛政異学の禁で、朱子学が正学とされた。"},{"t":"日本の陽明学","n":"中江藤樹が日本の陽明学の祖とされ、のち熊沢蕃山や大塩平八郎らに受け継がれた。"}],"famous":[{"t":"林羅山","n":"家康以来、将軍に仕えた朱子学者。幕府の学問の基礎をつくった。"},{"t":"中江藤樹","n":"近江で教えた陽明学の祖。「近江聖人」と慕われた。"},{"t":"大塩平八郎","n":"陽明学を学んだ元与力。1837年、飢饉のなかで大坂で挙兵した。"}],"anecdotes":["朱熹は晩年、政争のなかでその学問を「偽学」として弾圧されたが、死後に名誉が回復され、やがて官学となった。","林羅山は、家康、秀忠、家光、家綱の4代の将軍に仕え、幕府の儀礼や文書の整備にも関わったとされる。","1837年、天保の飢饉のなか、元与力の大塩平八郎は大坂で挙兵した。陽明学を学んでいたことから、知行合一の実践とも評された。"],"trivia":[{"f":"王陽明は若い頃、庭の竹の「理」を究めようと七日間見つめ続けて病に倒れ、朱子学の方法に疑いをもったと伝わる。","q":"王陽明が朱子学に疑いをもつきっかけとして伝わる出来事はどれか。","a":"庭の竹を七日間見つめ続けて病に倒れたこと","w":["科挙の試験に三度続けて落ちたこと","戦地で朱熹の著作をすべて失ったこと","皇帝に朱子学の誤りを進言して流されたこと"]},{"f":"中江藤樹は、老いた母に孝を尽くすため藩を辞して故郷の近江に帰ったと伝わり、「近江聖人」と慕われた。","q":"中江藤樹が「近江聖人」と呼ばれた背景として伝わる出来事はどれか。","a":"老いた母に孝を尽くすため、藩を去って故郷に帰った","w":["藩の財政を立て直し、領民に慕われた","幕府の学問所で教え、将軍に講義した","近江の湖を渡る舟の安全を祈り、旅人を助けて回り続けた"]},{"f":"1837年の大塩平八郎の乱では、挙兵した一行が、民を救う意を示す「救民」と記した旗を掲げたと伝わる。","q":"大塩平八郎が挙兵の際に掲げたと伝わる旗に記された言葉はどれか。","a":"救民","w":["尊王","攘夷","一揆"]}],"people":[],"related":["朱熹","王陽明","知行合一","林羅山","中江藤樹","大塩平八郎","寛政異学の禁"]},{"id":"bushido","name":"武士道","full":"武士道（士道）","en":"Bushido","region":"日本","category":"概念","when":"江戸時代に論じられ、近代に広まる","where":"日本","era":"近世","tagline":"武士の生き方を律する徳目の総称として、江戸期に整い近代に広まった","facts":[{"t":"成立","n":"戦国期にも武士の心得はあったが、体系的な倫理は、泰平の江戸時代に儒学の影響で整った。"},{"t":"江戸の論","n":"山鹿素行は武士が社会の模範となる士道を説き、『葉隠』は死の覚悟を軸に心得を語った。"},{"t":"新渡戸稲造","n":"1900年、英語で『武士道』を刊行し、日本の倫理を海外に紹介した。"},{"t":"近代の変化","n":"明治以降は国民道徳や軍人の教育にも用いられ、その意味は時代ごとに変わった。"}],"famous":[{"t":"『葉隠』","n":"佐賀藩士・山本常朝の語りを、田代陣基が書き留めた書。"},{"t":"『五輪書』","n":"剣豪の宮本武蔵が、晩年に自らの兵法と心得をまとめた書。"},{"t":"新渡戸の『武士道』","n":"義・勇・仁・礼・誠・名誉・忠義などの徳目で、武士道を説明した。"}],"anecdotes":["新渡戸稲造は『武士道』を、外国人から日本の宗教教育のあり方を尋ねられたことをきっかけに書いたとされる。","「武士道」という語は、江戸初期にまとめられた軍学書『甲陽軍鑑』に見られるとされる。","『葉隠』は、書かれた当時は広く読まれず、佐賀藩のなかで伝わったとされる。近代に入ってから武士道の古典として注目された。"],"trivia":[{"f":"新渡戸稲造の『武士道』を読んで感銘を受けたとされる海外の指導者に、アメリカ大統領セオドア・ルーズベルトがいる。周囲に配って薦めたと伝わる。","q":"新渡戸の『武士道』に感銘を受けたとされる海外の指導者は誰か。","a":"アメリカ大統領のセオドア・ルーズベルト","w":["フランス首相のジョルジュ・クレマンソー","イギリス首相のウィンストン・チャーチル","ドイツ宰相のオットー・ビスマルク"]},{"f":"『葉隠』は、隠居した山本常朝の語りを、若い藩士の田代陣基が約7年にわたり聞き書きして、1716年ごろにまとめたとされる。","q":"『葉隠』の成り立ちはどれか。","a":"隠居した武士の語りを、若い藩士が聞き書きした","w":["藩主が家臣のために自ら書き下ろした","藩の奉行所が公式の記録として長年かけて編纂した","剣術の師範が道場の門人に配布した"]},{"f":"宮本武蔵は晩年、熊本の洞窟「霊巌洞」にこもって、『五輪書』を書き始めたと伝わる。","q":"宮本武蔵が『五輪書』を書き始めたと伝わる場所はどこか。","a":"熊本の洞窟、霊巌洞","w":["京都の鞍馬山の洞窟","奈良の吉野山の庵","江戸の道場の離れ"]}],"people":[],"related":["『葉隠』","『五輪書』","新渡戸稲造","山鹿素行","朱子学と陽明学","禅"]},{"id":"mono","name":"「もののあはれ」","full":"もののあはれ（物の哀れ）","en":"Mono no aware","region":"日本","category":"概念","when":"平安時代に育ち、江戸時代に論じられる","where":"日本","era":"古代・中世","tagline":"ものごとに触れて心が動く、しみじみとした情感を大切にする美意識","facts":[{"t":"語の意味","n":"『源氏物語』などの平安文学にみえる語で、見聞きしたものに深く心を動かされることを指す。"},{"t":"宣長の論","n":"宣長が『源氏物語玉の小櫛』(1796)で、物語の本質は、もののあはれを知ることだと論じた。"},{"t":"あはれ","n":"喜びも悲しみも含め、心が深く動くさまを広く表す言葉だった。"},{"t":"美意識","n":"桜の散る姿を惜しむ感覚など、日本の美意識を語る言葉として広く使われる。"}],"famous":[{"t":"『源氏物語』","n":"平安時代の長編物語で、宣長がもののあはれの文学の代表と見た。"},{"t":"紫式部","n":"一条天皇の中宮彰子に仕え、『源氏物語』を書いたとされる。"}],"anecdotes":["『源氏物語』の本文にもこの語は出てくる。ただ、文学の理念として定式化したのは、江戸時代の宣長である。","宣長は『源氏物語』の講義を、松阪で門人たちに向けて、生涯にわたり繰り返し行ったと伝わる。"],"trivia":[{"f":"「あはれ」は、感動したときに思わず出る「ああ」という感嘆の声に由来する言葉だとされる。喜びにも悲しみにも使われた。","q":"「あはれ」の語のもとになったとされるものはどれか。","a":"感動したときに思わず発する感嘆の声","w":["雨上がりの空を指す天候の言葉","宮廷の楽人が宴の席で奏した舞楽の曲名","人の死を弔う葬礼の儀式の名"]},{"f":"紫式部の「紫」は、物語の登場人物・紫の上に由来する呼び名とされる。本名は伝わっていない。","q":"紫式部の呼び名の由来とされるものはどれか。","a":"物語の登場人物、紫の上","w":["仕えた中宮の衣の色","父の官職名の一字","住んだ京都の地名の紫野"]}],"people":["本居宣長"],"related":["『源氏物語』","紫式部","国学","漢意","無常観","賀茂真淵"]},{"id":"mujo","name":"無常観","full":"無常観（諸行無常）","en":"Impermanence (mujo)","region":"日本","category":"概念","when":"仏教伝来以降、中世に広まる","where":"日本","era":"古代・中世","tagline":"すべては移り変わるという仏教の見方が、文学や美意識にしみ込んだ感覚","facts":[{"t":"仏教の教え","n":"万物は常に変化し、とどまるものはないという、諸行無常の教えにもとづく。"},{"t":"中世の文学","n":"平安末から鎌倉にかけて、戦乱や災害が続くなかで、無常観が文学に強く表れた。"},{"t":"代表作","n":"『平家物語』『方丈記』『徒然草』が、中世の無常観を代表する作品とされる。"},{"t":"美意識","n":"桜の盛りを惜しむ感覚など、はかなさを美と見る感覚につながった。"}],"famous":[{"t":"『方丈記』","n":"鴨長明が、都の大火や飢饉、地震を記し、世の無常を語った。"},{"t":"『平家物語』","n":"冒頭に祇園精舎の鐘の音が登場し、平家一門の盛衰を語る軍記物語。"},{"t":"『徒然草』","n":"吉田兼好が、移ろう世のありさまを随筆に綴った。"}],"anecdotes":["鴨長明は下鴨神社に連なる家に生まれたが、後継をめぐる争いに敗れて出家し、一丈四方ほどの小さな庵で暮らした。","『平家物語』は、盲目の琵琶法師が節をつけて語り、文字を読まない人々にも各地へ広めたとされる。","「いろは歌」は、涅槃経の無常の教えにもとづくとする説があり、無常観を表す歌として解釈されてきた。"],"trivia":[{"f":"『平家物語』冒頭の祇園精舎の鐘は、病の僧が亡くなるときに自然に鳴り、無常を告げたという伝承にもとづくと伝わる。","q":"『平家物語』冒頭の祇園精舎の鐘にまつわる伝承はどれか。","a":"病の僧が亡くなるときに自然に鳴ったと伝わる","w":["戦の勝利を告げるために毎朝打ち鳴らされた","天皇の即位に合わせて新しく鋳造された","火災を知らせるために夜通し鳴らし続けられた"]},{"f":"鴨長明の「方丈」の庵は約3メートル四方で、解体して車で運べる組み立て式だったと、『方丈記』に記されている。","q":"『方丈記』に記される長明の庵の特徴はどれか。","a":"解体して車に載せて運べる組み立て式","w":["岩山の洞窟を掘り広げて住まいに造り替えた","川に浮かべて移動できる舟の形","村人が共同で建てた大きな二階建て"]}],"people":[],"related":["『方丈記』","『平家物語』","『徒然草』","鴨長明","諸行無常","祇園精舎","「もののあはれ」","禅"]},{"id":"zen","name":"禅","full":"禅（臨済宗と曹洞宗）","en":"Zen","region":"日本","category":"思想・学派","when":"鎌倉時代に日本で宗派として確立","where":"中国から日本へ","era":"古代・中世","tagline":"坐禅で心を調え、言葉を超えた悟りをめざす仏教の一派","facts":[{"t":"起源","n":"5〜6世紀ごろに中国へ来たとされる達磨を祖とし、中国で発展して日本へ伝わった。"},{"t":"日本への伝来","n":"鎌倉時代に、栄西が臨済宗を、道元が曹洞宗を、宋から伝えた。"},{"t":"二つの宗風","n":"臨済宗は公案を、曹洞宗はただ座る只管打坐を重んじるとされる。"},{"t":"文化への影響","n":"武家の保護を受け、水墨画、茶の湯、庭園など中世の文化に影響した。"}],"famous":[{"t":"栄西","n":"『喫茶養生記』を著し、茶の効用を広めたと伝わる臨済宗の祖。"},{"t":"道元","n":"越前に永平寺を開き、『正法眼蔵』を著した曹洞宗の祖。"},{"t":"龍安寺の石庭","n":"白砂に15個の石を配した枯山水。どこから見ても全部は見渡せないと言われる。"}],"anecdotes":["栄西は、将軍源実朝が二日酔いのときに茶を勧めたと伝わる。茶の効用を記した書もあわせて献上したとされる。","道元は宋で、台所の務めを担う老僧と出会い、日常の務めもそのまま修行だという考えを学んだ。のちに、その心得を書き残した。"],"trivia":[{"f":"「禅」の字は、サンスクリット語で瞑想を表す語の音を中国で写した「禅那」の略だとされる。","q":"「禅」の字の由来として正しいのはどれか。","a":"サンスクリット語の瞑想を表す語の音写","w":["中国語で静けさを表す古い詩語","日本語の「善」と発音が通じたこと","仏の教えを記した経典の名を略した呼び名"]},{"f":"縁起物の達磨は手足のない丸い姿をしているが、これは達磨が九年も壁に向かって坐禅を続けたという伝説にちなむと言われる。","q":"縁起物の達磨の形の由来として言われることはどれか。","a":"九年も壁に向かって坐禅を続けたという伝説","w":["九年も山中を托鉢して歩き続けたという伝説","海を越えて九度日本へ渡ったという伝説","九つの寺を一夜で建てたという伝説"]},{"f":"龍安寺の石庭には15個の石が置かれているが、どの位置から見ても全部は一度に見えない配置になっていると言われる。","q":"龍安寺の石庭にあると言われる特徴はどれか。","a":"どこから見ても石を全部は見渡せない","w":["季節ごとに石の位置が入れ替わる","石の下に池の水路がいくつも隠されている","すべての石が一直線に並んでいる"]}],"people":["西田幾多郎"],"related":["栄西","道元","達磨","臨済宗","曹洞宗","龍安寺"]}],"glossary":[{"t":"アテネ","kind":"place","d":"古代ギリシアを代表する都市国家。ソクラテス、プラトン、アリストテレスがこの地で活動し、哲学の中心となった。","en":"Athens"},{"t":"無知の知","kind":"term","d":"自分が大切なことを知らないと自覚していることこそ、知への出発点とする考え。ソクラテスの立場として知られる。"},{"t":"問答法","kind":"term","d":"対話で相手の考えを吟味し、矛盾をあらわにして真理に近づく方法。ソクラテスが街の人々との議論で用いた。","en":"Socratic method"},{"t":"ソクラテスの裁判","kind":"event","d":"紀元前399年、神々を信じず青年に害を与えたとして訴えられ、死刑となった裁判。ソクラテスの最期を決めた。","en":"Trial of Socrates"},{"t":"『ソクラテスの弁明』","kind":"work","d":"プラトンが著した、裁判でのソクラテスの弁論を描く作品。師の生き方と考えを知る基本の資料。","en":"Apology"},{"t":"『国家』","kind":"work","d":"プラトンの主著の一つ。正義とは何かを問い、理想の国のあり方を論じる。洞窟の比喩やイデアの話が登場する。","en":"Republic"},{"t":"アカデメイア","kind":"place","d":"プラトンがアテネ郊外に開いた学園。アリストテレスも学び、「アカデミー」という語のもとになった。","en":"Academy"},{"t":"洞窟の比喩","kind":"term","d":"壁に映る影を現実と思い込む囚人のたとえ話。『国家』に登場し、イデアを知ることの意味を説明する。","en":"Allegory of the cave"},{"t":"哲人王","kind":"term","d":"理想の国は、真理を知る哲学者が統治すべきだというプラトンの考え。『国家』で論じられる。","en":"philosopher king"},{"t":"三段論法","kind":"term","d":"二つの前提から結論を導く推論の形式。アリストテレスが整理し、論理学の基礎を築いた。","en":"syllogism"},{"t":"『ニコマコス倫理学』","kind":"work","d":"アリストテレスの倫理学書。幸福を善い活動と考え、徳は両極端を避けた中庸にあると論じる。","en":"Nicomachean Ethics"},{"t":"中庸","kind":"term","d":"多すぎも少なすぎもしない、ほどよい状態。アリストテレスは勇気などの徳を、無謀と臆病の間に見いだした。","en":"the mean"},{"t":"形而上学","kind":"term","d":"存在そのものや世界の根本原理を問う学問。アリストテレスの同名の著作が、この分野の源流とされる。","en":"metaphysics"},{"t":"リュケイオン","kind":"place","d":"アリストテレスがアテネに開いた学園。遊歩道を歩きながら教えたことから、弟子は逍遥学派と呼ばれた。","en":"Lyceum"},{"t":"アレクサンドロス大王","kind":"person","d":"紀元前4世紀のマケドニアの王。若い頃にアリストテレスの教えを受け、のち東方へ大遠征を行った。","en":"Alexander the Great"},{"t":"『方法序説』","kind":"work","d":"デカルトが1637年に発表した書。理性を正しく用いる方法を述べ、疑いえない真理に至る道筋を示す。","en":"Discourse on the Method"},{"t":"『省察』","kind":"work","d":"デカルトが1641年に刊行した書。徹底した懐疑から出発し、神の存在や心と物体の区別を六つの省察で論じる。","en":"Meditations"},{"t":"方法的懐疑","kind":"term","d":"少しでも疑える物事をすべて退け、疑えない確実な土台を探すデカルトの方法。","en":"methodic doubt"},{"t":"心身二元論","kind":"term","d":"精神と物体を別々の実体と見る考え。デカルトが唱え、のちの哲学や科学に大きな影響を与えた。","en":"mind-body dualism"},{"t":"解析幾何学","kind":"term","d":"図形を座標と方程式で扱う数学。デカルトが創始者の一人で、直交座標はデカルト座標とも呼ばれる。","en":"analytic geometry"},{"t":"『純粋理性批判』","kind":"work","d":"カントが1781年に刊行した主著。人間の理性が何をどこまで認識できるかを吟味した。","en":"Critique of Pure Reason"},{"t":"『実践理性批判』","kind":"work","d":"カントが1788年に刊行した書。道徳法則と自由、義務を論じ、倫理学の基礎を述べる。","en":"Critique of Practical Reason"},{"t":"ケーニヒスベルク","kind":"place","d":"東プロイセンの都市で、現在はロシア領のカリーニングラード。カントが生涯の大半を過ごした。","en":"Konigsberg"},{"t":"啓蒙","kind":"term","d":"人間が理性を用いて、無知や偏見、権威への盲従から抜け出そうとする、18世紀ヨーロッパの思潮。カントも論じた。","en":"Enlightenment"},{"t":"善意志","kind":"term","d":"結果の善し悪しにかかわらず、それ自体で善いとされる意志。カントは道徳の出発点に置いた。","en":"good will"},{"t":"『道徳形而上学の基礎づけ』","kind":"work","d":"カントが1785年に刊行した倫理学の書。定言命法を示し、道徳の原理を理性から導こうとした。","en":"Groundwork of the Metaphysics of Morals"},{"t":"ワーグナー","kind":"person","d":"19世紀ドイツの作曲家。ニーチェは若い頃に親しく交わったが、のちに決別して厳しく批判した。","en":"Richard Wagner"},{"t":"神の死","kind":"term","d":"近代にキリスト教的な価値が支えを失ったという、ニーチェの診断。『悦ばしき知識』などに現れる。","en":"death of God"},{"t":"超人","kind":"term","d":"既成の価値を乗り越え、自ら新しい価値を創る人間像。ニーチェが『ツァラトゥストラ』で語った。","en":"Ubermensch"},{"t":"永遠回帰","kind":"term","d":"世界の出来事が同じ形で無限に繰り返されるという考え。ニーチェが、人生の肯定を試す思想として示した。","en":"eternal recurrence"},{"t":"ルサンチマン","kind":"term","d":"強い者に対する弱い者の恨みや妬みの感情。ニーチェは、道徳の成り立ちを説明する際にこの語を用いた。","en":"ressentiment"},{"t":"『ツァラトゥストラはこう語った』","kind":"work","d":"ニーチェが1880年代に書いた代表作。預言者の姿を借りて、超人や永遠回帰を詩的な文体で語る。","en":"Thus Spoke Zarathustra"},{"t":"『存在と無』","kind":"work","d":"サルトルが1943年に刊行した主著。人間の意識のあり方を分析した、実存主義の代表的な哲学書。","en":"Being and Nothingness"},{"t":"『嘔吐』","kind":"work","d":"サルトルが1938年に発表した小説。存在が偶然であることに吐き気を覚える主人公を描く。","en":"Nausea"},{"t":"アンガージュマン","kind":"term","d":"社会の問題に自ら関わり、行動で責任を引き受けること。サルトルが作家や知識人の務めとして重んじた。","en":"engagement"},{"t":"ボーヴォワール","kind":"person","d":"フランスの作家・哲学者。『第二の性』で知られ、サルトルとは生涯にわたって思想を交わした。","en":"Simone de Beauvoir"},{"t":"ノーベル文学賞","kind":"term","d":"スウェーデンの文学賞。サルトルは1964年の受賞者に選ばれたが、辞退した。","en":"Nobel Prize in Literature"},{"t":"ハイデガー","kind":"person","d":"ドイツの哲学者。『存在と時間』(1927)で人間のあり方を分析し、サルトルや和辻哲郎に影響を与えた。","en":"Martin Heidegger"},{"t":"キルケゴール","kind":"person","d":"19世紀デンマークの思想家。個人が自分の生を引き受けることを重んじ、実存主義の先駆とされる。","en":"Soren Kierkegaard"},{"t":"『論理哲学論考』","kind":"work","d":"ウィトゲンシュタインが1921年に発表した前期の主著。言語と世界の関係を、番号つきの短い命題で論じる。","en":"Tractatus Logico-Philosophicus"},{"t":"『哲学探究』","kind":"work","d":"ウィトゲンシュタインの後期の主著。没後の1953年に刊行され、言語ゲームの考えを展開する。","en":"Philosophical Investigations"},{"t":"言語ゲーム","kind":"term","d":"言葉の意味は使われ方で決まると見て、言語の使用を規則のある活動にたとえた概念。後期ウィトゲンシュタインの中心語。","en":"language game"},{"t":"ラッセル","kind":"person","d":"イギリスの哲学者・論理学者。ケンブリッジでウィトゲンシュタインを指導し、その才能に早くから注目した。","en":"Bertrand Russell"},{"t":"ケンブリッジ","kind":"place","d":"イギリスの大学都市。ウィトゲンシュタインは若い日にここで学び、のち教授となった。","en":"Cambridge"},{"t":"分析哲学","kind":"term","d":"言語や論理を分析して哲学の問題を明らかにしようとする20世紀の潮流。ウィトゲンシュタインが大きな影響を与えた。","en":"analytic philosophy"},{"t":"アウグスティヌス","kind":"person","d":"古代末期のキリスト教の思想家。誤ることがあっても自分の存在は疑えないという議論が、デカルトに先立つ例とされる。","en":"Augustine"},{"t":"最大多数の最大幸福","kind":"term","d":"社会全体の幸福の量をできるだけ大きくすることを善とする、功利主義の標語。ベンサムの名とともに知られる。","en":"greatest happiness principle"},{"t":"ベンサム","kind":"person","d":"18〜19世紀イギリスの哲学者・法学者。功利主義を体系化し、法や制度の改革を論じた。","en":"Jeremy Bentham"},{"t":"ミル","kind":"person","d":"19世紀イギリスの思想家。『自由論』『功利主義』を著し、ベンサムの考えを質の面から修正した。","en":"John Stuart Mill"},{"t":"ヘーゲル","kind":"person","d":"ドイツの哲学者(1770〜1831)。矛盾を通じて精神が発展するという弁証法を、歴史や論理の体系にまとめた。","en":"Hegel"},{"t":"マルクス","kind":"person","d":"19世紀ドイツ生まれの思想家。ヘーゲルの弁証法を引き継ぎ、社会の発展を物質的な条件から説明した。","en":"Karl Marx"},{"t":"止揚","kind":"term","d":"ドイツ語アウフヘーベンの訳。対立するものを否定しつつ、その要素を保って、より高い段階に進むこと。","en":"Aufhebung"},{"t":"パース","kind":"person","d":"アメリカの哲学者・論理学者。1870年代に、考えの意味を結果から明らかにする方法を示し、プラグマティズムを創始した。","en":"Charles S. Peirce"},{"t":"ジェイムズ","kind":"person","d":"アメリカの心理学者・哲学者。パースの考えを広め、『プラグマティズム』(1907)で一般に知らせた。","en":"William James"},{"t":"デューイ","kind":"person","d":"アメリカの哲学者・教育学者。経験から学ぶ教育を唱え、民主主義と教育の関係を論じた。","en":"John Dewey"},{"t":"形而上学クラブ","kind":"event","d":"1870年代初めにマサチューセッツ州ケンブリッジで開かれた談話会。パースやジェイムズらが集い、プラグマティズムの出発点とされる。","en":"Metaphysical Club"},{"t":"ペトラルカ","kind":"person","d":"14世紀イタリアの詩人・学者。古典の写本を探して研究し、人文主義の父と呼ばれる。","en":"Petrarch"},{"t":"エラスムス","kind":"person","d":"オランダの人文主義者。『愚神礼賛』や聖書の校訂で知られ、ルネサンス期の北ヨーロッパを代表する学者。","en":"Erasmus"},{"t":"フィレンツェ","kind":"place","d":"イタリア中部の都市。メディチ家の保護のもと、芸術家や学者が集まり、ルネサンス文化の中心となった。","en":"Florence"},{"t":"活版印刷","kind":"term","d":"金属の活字を組んで印刷する技術。15世紀半ばにグーテンベルクが実用化し、書物の普及を支えた。","en":"movable-type printing"},{"t":"古典古代","kind":"term","d":"古代ギリシアとローマの文化と時代。ルネサンスの人文主義者が、学びと芸術の模範とした。","en":"classical antiquity"},{"t":"最澄","kind":"person","d":"平安時代の僧で天台宗の開祖。空海と同じ804年の遣唐使で唐へ渡り、のち交流したが、やがて距離ができた。","en":"Saicho"},{"t":"恵果","kind":"person","d":"唐の長安の青龍寺にいた密教の高僧。空海に教えを授けた師で、空海が帰国する前に亡くなった。","en":"Huiguo"},{"t":"真言宗","kind":"term","d":"空海が唐から伝えた密教にもとづく仏教の宗派。高野山と京都の東寺を拠点にしてきた。","en":"Shingon"},{"t":"密教","kind":"term","d":"秘密の教えと儀礼を重んじる仏教の流れ。空海が唐から日本に伝え、真言宗の教えの基礎となった。","en":"esoteric Buddhism"},{"t":"高野山","kind":"place","d":"和歌山県にある真言宗の聖地。空海が816年に修行の場として開き、奥の院には今も信仰が集まる。","en":"Koyasan"},{"t":"遣唐使","kind":"term","d":"日本が唐に送った公式の使節。7世紀から9世紀に派遣され、空海や最澄も804年の使節で唐へ渡った。","en":"Kentoshi"},{"t":"弘法大師","kind":"term","d":"空海に贈られた称号。921年に朝廷から贈られたとされ、各地に多くの伝説が残る。","en":"Kobo Daishi"},{"t":"『古事記伝』","kind":"work","d":"本居宣長が約35年かけて著した『古事記』の注釈書。全44巻で、1798年に完成した。","en":"Kojikiden"},{"t":"『古事記』","kind":"work","d":"712年に太安万侶が編んだ、日本最古級の歴史書。神話から推古天皇までを記す。三巻からなる。","en":"Kojiki"},{"t":"賀茂真淵","kind":"person","d":"江戸時代の国学者。『万葉集』の研究で知られ、本居宣長が入門した師である。","en":"Kamo no Mabuchi"},{"t":"松阪","kind":"place","d":"現在の三重県松阪市。伊勢商人の町で、本居宣長が生まれ育ち、医者として暮らした。","en":"Matsusaka"},{"t":"『源氏物語』","kind":"work","d":"紫式部が書いた平安時代の長編物語。宣長はこれを、もののあはれを知る物語として読み解いた。","en":"The Tale of Genji"},{"t":"漢意","kind":"term","d":"漢字や中国の思想に染まった物の見方を指す語。宣長はこれを離れて、古代の日本人の心を知ろうとした。","en":"karagokoro"},{"t":"『学問のすすめ』","kind":"work","d":"福沢諭吉が1872年から書き継いだ啓蒙書。学問によって独立した人間になることの大切さを平易に説いた。","en":"An Encouragement of Learning"},{"t":"『西洋事情』","kind":"work","d":"福沢諭吉が欧米の制度や文化を紹介した書。1866年に初編が出て、幕末から明治初期に広く読まれた。","en":"Seiyo jijo"},{"t":"『文明論之概略』","kind":"work","d":"福沢諭吉が1875年に刊行した文明論。西洋と日本を比べ、文明を進歩させる精神のあり方を論じた。","en":"An Outline of a Theory of Civilization"},{"t":"慶應義塾","kind":"place","d":"福沢諭吉が江戸に開いた蘭学塾に始まる学塾。1868年に慶應義塾と名づけられ、のち大学となった。","en":"Keio Gijuku"},{"t":"咸臨丸","kind":"term","d":"1860年に太平洋を渡った幕府の軍艦。日米修好通商条約の使節に随行し、福沢諭吉も乗り込んだ。","en":"Kanrin Maru"},{"t":"独立自尊","kind":"term","d":"他人に頼らず、自分の力で立ち、自らの尊厳を保つこと。福沢諭吉が重んじた考えとして知られる。","en":"independence and self-respect"},{"t":"『善の研究』","kind":"work","d":"西田幾多郎が1911年に刊行した最初の著作。純粋経験を軸に、実在や善、宗教を論じた。","en":"An Inquiry into the Good"},{"t":"純粋経験","kind":"term","d":"主観と客観が分かれる前の、ありのままの経験。西田幾多郎が『善の研究』で哲学の出発点に置いた。","en":"pure experience"},{"t":"場所の論理","kind":"term","d":"あらゆるものを包む「場所」から存在や意識を捉え直す、西田幾多郎の後期の立場。","en":"logic of place"},{"t":"京都学派","kind":"term","d":"西田幾多郎や田辺元ら、京都帝国大学の哲学者たちの総称。和辻哲郎を含めて呼ぶこともある。","en":"Kyoto School"},{"t":"鈴木大拙","kind":"person","d":"禅を英語で世界に紹介した仏教学者。西田幾多郎と同じ石川県の出身で、学生時代からの友人だった。","en":"D. T. Suzuki"},{"t":"哲学の道","kind":"place","d":"京都の疏水沿いの散歩道。西田幾多郎が思索にふけりながら歩いたと伝わる。","en":"Philosopher's Path"},{"t":"『風土』","kind":"work","d":"和辻哲郎が1935年に刊行した書。気候や地形が人間のあり方を形づくるとして、風土を三つの型で論じた。","en":"Fudo"},{"t":"『古寺巡礼』","kind":"work","d":"和辻哲郎が奈良の古寺と仏像を訪ねた記録。1919年に刊行され、仏像を美術として味わう視点を広めた。","en":"Koji junrei"},{"t":"『倫理学』","kind":"work","d":"和辻哲郎の主著。人間を孤立した個人でなく、人と人の関係のなかで捉える倫理学を築いた。","en":"Rinrigaku"},{"t":"間柄","kind":"term","d":"人と人との関係。和辻哲郎は、人間を個人でなく間柄のなかの存在と見る倫理学の中心に据えた。","en":"aidagara"},{"t":"『日本書紀』","kind":"work","d":"720年に完成した、舎人親王らが編んだ歴史書。漢文で、神代から持統天皇までを年代順に記す。","en":"Nihon Shoki"},{"t":"稗田阿礼","kind":"person","d":"天武天皇に仕えたとされる舎人。優れた記憶力で、『古事記』のもとになる語りを誦み習ったと伝わる。","en":"Hieda no Are"},{"t":"太安万侶","kind":"person","d":"奈良時代の官人。稗田阿礼の語りを書きとめ、712年に『古事記』を編んで献上した。","en":"O no Yasumaro"},{"t":"天照大神","kind":"term","d":"太陽の女神で、皇室の祖先神とされる。『古事記』『日本書紀』の神話の中心に位置する。","en":"Amaterasu"},{"t":"契沖","kind":"person","d":"江戸前期の真言宗の僧で国学者。『万葉集』の注釈書を著し、国学の先駆者と評される。","en":"Keichu"},{"t":"平田篤胤","kind":"person","d":"江戸後期の国学者。本居宣長の没後の門人を自称し、神道色の強い学問を広めた。","en":"Hirata Atsutane"},{"t":"『万葉集』","kind":"work","d":"奈良時代にまとめられた日本最古の歌集。国学者が古代の人々の心を知る手がかりとして研究した。","en":"Man'yoshu"},{"t":"朱熹","kind":"person","d":"南宋の儒学者。朱子学を大成し、『四書』を重んじた。その学問は江戸幕府が重んじる学問の基礎となった。","en":"Zhu Xi"},{"t":"王陽明","kind":"person","d":"明の儒学者。心こそが理であると説いて陽明学を唱え、知ることと行うことの一体を重んじた。","en":"Wang Yangming"},{"t":"知行合一","kind":"term","d":"知ることと行うことは一体だという陽明学の教え。大塩平八郎のような実践的な学徒に影響したとされる。","en":"unity of knowledge and action"},{"t":"林羅山","kind":"person","d":"江戸初期の朱子学者。徳川家康以来、将軍に仕え、幕府の学問の基礎をつくった。","en":"Hayashi Razan"},{"t":"中江藤樹","kind":"person","d":"江戸初期の儒者。日本の陽明学の祖とされ、近江の地で教え、「近江聖人」と慕われた。","en":"Nakae Toju"},{"t":"大塩平八郎","kind":"person","d":"江戸後期の大坂町奉行所の元与力。陽明学を学び、1837年に飢饉の救済を求めて挙兵した。","en":"Oshio Heihachiro"},{"t":"寛政異学の禁","kind":"event","d":"1790年、幕府が昌平坂学問所で朱子学以外の講義を禁じた政策。老中松平定信のもとで行われた。","en":"Kansei Prohibition of Heterodoxy"},{"t":"『葉隠』","kind":"work","d":"佐賀藩士・山本常朝の語りを田代陣基が書き留めた書。武士の心構えを、死の覚悟を軸に語る。","en":"Hagakure"},{"t":"『五輪書』","kind":"work","d":"剣豪・宮本武蔵が晩年に記した兵法書。地・水・火・風・空の五巻からなる。","en":"The Book of Five Rings"},{"t":"新渡戸稲造","kind":"person","d":"教育者・思想家。1900年に英語で『武士道』を著し、日本人の倫理を海外に紹介した。","en":"Nitobe Inazo"},{"t":"山鹿素行","kind":"person","d":"江戸前期の儒学者・兵学者。武士のあるべき姿を士道として論じ、のちの武士道論に影響を与えた。","en":"Yamaga Soko"},{"t":"紫式部","kind":"person","d":"平安中期の女性作家。一条天皇の中宮彰子に仕え、『源氏物語』を書いたとされる。","en":"Murasaki Shikibu"},{"t":"『方丈記』","kind":"work","d":"鴨長明が1212年ごろに書いた随筆。大火や地震を記し、世の無常と簡素な暮らしを語る。","en":"Hojoki"},{"t":"『平家物語』","kind":"work","d":"平家一門の栄えと滅びを語る軍記物語。琵琶法師が語り広め、無常観を伝える代表作とされる。","en":"The Tale of the Heike"},{"t":"『徒然草』","kind":"work","d":"吉田兼好が14世紀前半に著した随筆。世の移ろいやものの見方を、短い章で自由に綴る。","en":"Tsurezuregusa"},{"t":"鴨長明","kind":"person","d":"鎌倉初期の歌人・随筆家。下鴨神社に連なる家に生まれ、出家して『方丈記』を著した。","en":"Kamo no Chomei"},{"t":"諸行無常","kind":"term","d":"すべてのものは絶えず移り変わり、とどまらないという仏教の教え。日本の無常観の根になった。","en":"impermanence"},{"t":"祇園精舎","kind":"place","d":"古代インドにあった、釈迦の説法の場とされる寺院。『平家物語』の冒頭に登場し、無常を象徴する。","en":"Jetavana"},{"t":"栄西","kind":"person","d":"鎌倉初期の僧で、日本の臨済宗の開祖。宋から禅と茶の種を持ち帰ったと伝わる。","en":"Eisai"},{"t":"道元","kind":"person","d":"鎌倉初期の僧で、曹洞宗の開祖。宋で学び、越前に永平寺を開き、『正法眼蔵』を著した。","en":"Dogen"},{"t":"達磨","kind":"person","d":"5〜6世紀ごろに中国で禅を伝えたとされる僧。九年間壁に向かって坐禅をしたという伝説で知られる。","en":"Bodhidharma"},{"t":"臨済宗","kind":"term","d":"禅宗の一派で、栄西が日本に伝えた。師が与える問いである公案に取り組む修行を特色とする。","en":"Rinzai"},{"t":"曹洞宗","kind":"term","d":"禅宗の一派で、道元が日本に伝えた。ただひたすら坐禅に打ち込む修行を重んじる。","en":"Soto"},{"t":"龍安寺","kind":"place","d":"京都にある臨済宗の寺。白砂に15個の石を配した枯山水の石庭で知られる。","en":"Ryoanji"}]},"social":{"people":[{"id":"adam_smith", ,"w":["英語","イタリア語","日本語"]},{"f":"第2巻と第3巻は、マルクスの草稿をエンゲルスが読み解いて整理し、1885年と1894年に刊行した。","q":"『資本論』の第2・3巻を編集して刊行した人物は？","a":"エンゲルス","w":["レーニン","カウツキー","ベーベル"]}],"people":["マルクス"],"related":["マルクス","剰余価値","プロレタリアート","ブルジョワジー","唯物史観","エンゲルス","共産党宣言"]},{"id":"bureaucracy","name":"官僚制と合理化","full":"官僚制と合理化（ウェーバーの近代社会論）","en":"Bureaucracy and rationalization","region":"海外","category":"社会学・政治学","when":"20世紀初頭","where":"ドイツ","era":"社会科学の確立","tagline":"規則と専門性で動く組織が社会を覆っていく近代の姿を描いた、ウェーバーの理論。","facts":[{"t":"官僚制の特徴","n":"明確な規則、職務の分担、上下の階層、文書による記録、専門知識による任用が特徴。"},{"t":"合理化","n":"計算や規則による効率を重んじる考えが、経済や行政、生活の隅々に広がる過程。"},{"t":"長所と代償","n":"正確さと公平さをもたらす一方、人が歯車になり自由を失う面もあると見た。"},{"t":"支配の型","n":"官僚制は、規則への信頼に基づく「合法的支配」のもっとも純粋な型とされた。"}],"famous":[{"t":"近代の組織","n":"大企業や役所、軍隊などが、官僚制的な組織の典型例とされる。"},{"t":"鉄の檻","n":"合理化が進んだ社会が、人を逃れにくい仕組みに閉じ込めるさまを表す比喩。"}],"anecdotes":["「鉄の檻」の語は、『プロ倫』を英訳したパーソンズの訳語で広まった。原文は鋼のように硬い殻に近い語感だとされる。","ウェーバーは官僚制の技術的な効率を認めつつ、議会の力で官僚を統制する必要を論じた。"],"trivia":[{"f":"「鉄の檻」という訳語は、米国の社会学者パーソンズが1930年に『プロ倫』を英訳した際のものとされる。","q":"「鉄の檻」の語を広めた英訳者は？","a":"タルコット・パーソンズ","w":["ロバート・マートン","C・ライト・ミルズ","ダニエル・ベル"]},{"f":"ウェーバーは官僚制を「合法的支配」の典型とし、伝統的支配やカリスマ的支配と区別した。","q":"ウェーバーが官僚制を位置づけた支配の型は？","a":"合法的支配","w":["伝統的支配","カリスマ的支配","軍事的支配"]}],"people":["ウェーバー"],"related":["ウェーバー","支配の三類型","理念型","カリスマ","鉄の檻","プロテスタンティズムの倫理と資本主義の精神"]},{"id":"anomie","name":"アノミー","full":"アノミー（無規範状態）","en":"Anomie","region":"海外","category":"社会学・政治学","when":"1893年から1897年","where":"フランス","era":"社会科学の確立","tagline":"社会の規範がゆるみ、人の欲求が歯止めを失った状態を指す社会学の概念。","facts":[{"t":"語源","n":"規則（ノモス）を欠くという意味のギリシャ語に由来し、無規範・無秩序を指す。"},{"t":"提唱","n":"デュルケームが『社会分業論』と『自殺論』で用い、社会の急激な変化と結びつけた。"},{"t":"自殺の類型","n":"『自殺論』は自殺を、自己本位的、集団本位的、アノミー的、宿命的の4つに分けた。"},{"t":"発展","n":"マートンが1938年に、目標と手段のずれから逸脱を説明する理論に発展させた。"}],"famous":[{"t":"経済の急変","n":"不況だけでなく急な好況でも、欲望の歯止めが失われて自殺が増えうると見た。"},{"t":"マートンの類型","n":"同調、革新、儀礼主義、逃避主義、反抗の5つの適応様式に整理した。"}],"anecdotes":["アノミーという語は古くからあるが、デュルケームが社会学の用語として定着させた。","デュルケームは、社会の結びつきが弱いほど自殺が多いと見て、自殺を個人の心の問題でなく社会の現象として扱った。"],"trivia":[{"f":"アメリカの社会学者マートンは、1938年の論文でアノミー論を、目標と手段のずれから逸脱を説明する理論に作り替えた。","q":"アノミー論を逸脱の理論に発展させたのは？","a":"ロバート・マートン","w":["タルコット・パーソンズ","ポール・ラザースフェルド","アーヴィング・ゴッフマン"]},{"f":"『自殺論』は自殺を4つに分け、その一つに「宿命的自殺」を置いた。","q":"『自殺論』の自殺の類型として正しいものは？","a":"宿命的自殺","w":["衝動的自殺","感傷的自殺","計画的自殺"]}],"people":["デュルケーム"],"related":["デュルケーム","自殺論","社会的事実","社会分業論","機械的連帯と有機的連帯","マートン"]},{"id":"effective_demand","name":"有効需要","full":"有効需要の原理","en":"Effective demand","region":"海外","category":"経済学","when":"1936年（一般理論）","where":"イギリス","era":"社会科学の確立","tagline":"社会全体の需要の大きさが生産と雇用を決めるとする、ケインズ経済学の中心概念。","facts":[{"t":"主張","n":"財やサービスへの需要の総量が、生産量と雇用量を決める。需要が足りないと失業が続く。"},{"t":"古典派との対立","n":"供給が自らの需要を生むというセイの法則を退け、不況が長引く理由を説明した。"},{"t":"政策","n":"民間の需要が足りないとき、政府が公共投資や減税で支えることを正当化した。"},{"t":"乗数効果","n":"追加の支出が所得を通じて連鎖し、何倍もの需要を生む。"}],"famous":[{"t":"一般理論（1936）","n":"世界恐慌後の失業問題に応え、有効需要の原理を体系化した。"},{"t":"ケインズ革命","n":"戦後の先進国で、財政政策で景気を調整する考えが広まったことをこう呼ぶ。"}],"anecdotes":["世界恐慌で失業が長引くなか、放っておけば市場が回復するという古典派の見方に疑問を投げかけて世に出た。","ケインズの教え子のカーンが乗数効果を1931年に論じ、有効需要の理論の下地を作った。"],"trivia":[{"f":"乗数効果の考えを1931年に先に論文で示したのは、ケインズの教え子のリチャード・カーンだった。","q":"乗数効果を1931年に論じたケインズの教え子は？","a":"リチャード・カーン","w":["ジョーン・ロビンソン","ピエロ・スラッファ","ニコラス・カルドア"]},{"f":"ケインズは、供給が自らの需要を生むというセイの法則を、不況の現実を説明できないと批判した。","q":"ケインズが批判した古典派の法則は？","a":"セイの法則","w":["グレシャムの法則","ワルラスの法則","ペティ＝クラークの法則"]}],"people":["ケインズ"],"related":["ケインズ","雇用・利子および貨幣の一般理論","セイの法則","乗数効果","世界恐慌","市場の失敗","ブレトンウッズ体制"]},{"id":"market_failure","name":"市場の失敗","full":"市場の失敗","en":"Market failure","region":"海外","category":"経済学","when":"20世紀半ばに理論として整理","where":"イギリス・アメリカ","era":"現代","tagline":"市場に任せるだけでは、資源の配分が望ましくならない場合があるという考え。","facts":[{"t":"主な原因","n":"外部性、公共財、情報の非対称性、独占などで、市場が効率的な配分に至らなくなる。"},{"t":"外部性","n":"公害のように、取引の当事者でない人に費用や便益が及び、価格に反映されない。"},{"t":"政策","n":"課税や補助金、規制、公共サービスで補う根拠とされる。"},{"t":"限界","n":"政府も失敗しうるため、政府の失敗との比較が必要だという指摘もある。"}],"famous":[{"t":"ピグー税","n":"外部不経済の費用に見合う税を課して、価格に織り込ませる提案。"},{"t":"中古車市場","n":"アカロフが1970年に示した、品質を買い手が見分けにくいと市場が縮む例。"},{"t":"共有地の悲劇","n":"誰もが使える資源が、過剰に使われて荒れる現象。ハーディンが1968年に論じた。"}],"anecdotes":["灯台は公共財の典型として教科書に登場するが、経済学者コースは、英国で灯台が民間の事業者によって運営された例があることを示した。","アカロフは情報の非対称性の研究で、2001年にスペンス、スティグリッツとともにノーベル経済学賞を受けた。"],"trivia":[{"f":"公共財の典型とされた灯台は、英国で民間の所有者が料金を取って運営した例があると、コースが示した。","q":"コースが、公共財の典型だが民間運営の例もあると論じた施設は？","a":"灯台","w":["消防署","水道","公園"]},{"f":"アカロフは2001年に、スペンス、スティグリッツとともに、情報の経済学の功績でノーベル経済学賞を受けた。","q":"2001年のノーベル経済学賞の共同受賞者の組は？","a":"スペンスとスティグリッツ","w":["クルーグマンとマンデル","フリードマンとスティグラー","サミュエルソンとソロー"]}],"people":[],"related":["外部性","公共財","情報の非対称性","ピグー税","共有地の悲劇","見えざる手","有効需要"]},{"id":"social_contract","name":"社会契約","full":"社会契約（社会契約論）","en":"Social contract","region":"海外","category":"社会学・政治学","when":"17世紀から18世紀","where":"イギリス・フランス","era":"古典派・近代の成立","tagline":"国家や法の正統性を、人々の合意（契約）に求める近代政治思想の考え方。","facts":[{"t":"基本の発想","n":"国家ができる前の自然状態を仮定し、合意によって政府がつくられたと考える。"},{"t":"ホッブズ","n":"『リヴァイアサン』（1651）で、争いを避けるため主権者に権力を委ねる契約を論じた。"},{"t":"ロック","n":"17世紀末の『統治二論』で、政府は人々の信託に基づき、権利を侵せば抵抗できると論じた。"},{"t":"ルソー","n":"『社会契約論』（1762）で、共同体の一般意志に基づく政治を構想した。"}],"famous":[{"t":"アメリカ独立宣言（1776）","n":"政府の正統性は人々の同意に由来するとされ、ロックらの影響が指摘される。"},{"t":"フランス革命（1789）","n":"人権宣言などに、ルソーらの思想の影響が見られるとされる。"}],"anecdotes":["ホッブズは、スペイン無敵艦隊が迫った1588年、知らせに驚いた母が早産して生まれたと伝わる。","ルソーの『社会契約論』は、1762年に『エミール』とともに発禁処分を受け、ルソーは各地を転々とした。","ロックの『統治二論』は、名誉革命（1688）を正当化する書としても読まれた。"],"trivia":[{"f":"ホッブズは、スペイン無敵艦隊が英国に迫った1588年に、母が驚いて早産して生まれたと伝わる。","q":"ホッブズが生まれた年のイギリスの出来事は？","a":"スペイン無敵艦隊の来襲","w":["名誉革命","ロンドンの大火","ピューリタン革命"]},{"f":"ルソーの『社会契約論』と『エミール』は、1762年に出版直後に発禁処分を受けた。","q":"『社会契約論』と同じ年に出て、ともに発禁になったルソーの著作は？","a":"エミール","w":["人間不平等起源論","告白","新エロイーズ"]}],"people":[],"related":["ホッブズ","ロック","ルソー","リヴァイアサン","自然状態","一般意志","名誉革命"]},{"id":"rongo_soroban","name":"論語と算盤","full":"論語と算盤（道徳経済合一説）","en":"The Analects and the Abacus","region":"日本","category":"経済学","when":"1916年（大正5年）","where":"日本","era":"近代","tagline":"利益を追う実業と道徳は両立する、という渋沢栄一の経営思想。","facts":[{"t":"書名の意味","n":"『論語』が道徳、『算盤』が利益を表し、両者は対立せず一致すべきだと説く。"},{"t":"刊行","n":"渋沢の講話などをまとめ、1916年に刊行された。"},{"t":"道徳経済合一","n":"道理にかなった利益こそが長く続き、社会も豊かにすると考えた。"},{"t":"合本主義","n":"広く人と資金を集め、公益を目的に事業を営む考え方も、渋沢の事業観の柱とされる。"}],"famous":[{"t":"第一国立銀行","n":"1873年に設立された日本初の銀行。渋沢が経営に当たった。"},{"t":"東京養育院","n":"渋沢が長く関わった福祉施設。事業と社会貢献を両立させる姿勢を表す。"},{"t":"企業の社会的責任","n":"今日の社会的責任や、多様な関係者を重んじる経営の源流として語られる。"}],"anecdotes":["渋沢は少年のころ、従兄の尾高惇忠から論語などを学び、実業家となってからも座右の書とした。","儒学が利益を軽んじてきたと見て、利益の追求は道理にかなう限り否定されるべきでないと説いた。"],"trivia":[{"f":"渋沢に論語などを教えた従兄の尾高惇忠は、のちに富岡製糸場の初代場長を務めた。","q":"渋沢の従兄で、のち富岡製糸場の初代場長となったのは？","a":"尾高惇忠","w":["渋沢喜作","杉浦譲","福地源一郎"]},{"f":"渋沢は約500の企業に関わる一方、東京養育院の運営にも長く携わった。","q":"渋沢が長く運営に関わった福祉施設は？","a":"東京養育院","w":["小石川養生所","日本赤十字社病院","済生会病院"]}],"people":["渋沢栄一"],"related":["渋沢栄一","合本主義","道徳経済合一説","尾高惇忠","第一国立銀行","東京養育院","富岡製糸場"]},{"id":"minponshugi","name":"民本主義","full":"民本主義（吉野作造の民主政論）","en":"Minponshugi","region":"日本","category":"社会学・政治学","when":"1916年（大正5年）","where":"日本","era":"近代","tagline":"主権の所在は問わず、政治は民衆の利益と意向に基づくべきだとする政治論。","facts":[{"t":"提唱","n":"吉野作造が1916年に雑誌『中央公論』で論じ、大正デモクラシーの理論的な支えになった。"},{"t":"主張","n":"政治の目的は民衆の幸福にあり、政策の決定は民衆の意向に基づくべきだとした。"},{"t":"民主主義との違い","n":"主権が天皇にある憲法のもとでも成り立つよう、主権の所在を問題にしなかった。"},{"t":"具体策","n":"普通選挙の実現と、議会の多数党が組閣する政党内閣を求めた。"}],"famous":[{"t":"大正デモクラシー","n":"護憲運動や普通選挙運動など、大正期の民主的な風潮と運動の総称。"},{"t":"天皇機関説","n":"美濃部達吉の憲法学説。議会政治を支える理論として、同時期に影響を持った。"},{"t":"普通選挙法（1925）","n":"満25歳以上の男子に選挙権を与えた。女性は含まれなかった。"}],"anecdotes":["発表の場の『中央公論』は当時を代表する総合雑誌で、論文は広く読まれ、学生にも影響を与えた。","吉野は主権在民をはっきり主張しなかったため、のちの研究では、制度の枠内で民主政治を進めようとした現実的な戦略と見られることもある。"],"trivia":[{"f":"1925年の普通選挙法で選挙権を得たのは、満25歳以上の男子で、女性には認められなかった。","q":"1925年の普通選挙法で選挙権を得た人は？","a":"満25歳以上の男子","w":["満20歳以上の男女","満25歳以上の男女","満30歳以上の男子"]},{"f":"吉野作造の影響を受けた東京帝国大学の学生たちは、1918年に学生団体の新人会を結成した。","q":"1918年に東京帝国大学の学生が結成した団体は？","a":"新人会","w":["黎明会","友愛会","憲政会"]}],"people":["吉野作造"],"related":["吉野作造","大正デモクラシー","黎明会","美濃部達吉","普通選挙","政党内閣","新人会"]},{"id":"jomin","name":"常民（民俗学）","full":"常民と民俗学（柳田国男の方法）","en":"Jomin and Japanese folklore studies","region":"日本","category":"社会学・政治学","when":"明治末から昭和（20世紀前半）","where":"日本","era":"近代","tagline":"文字を残さない普通の人々の暮らしから歴史を探る、柳田民俗学の鍵概念。","facts":[{"t":"常民","n":"貴族や英雄でなく、日々の暮らしを営む普通の人々のこと。柳田が学問の中心に据えた。"},{"t":"方法","n":"各地の言い伝え、祭り、方言、道具などを集めて比べ、暮らしの変化をたどる。"},{"t":"目的","n":"文字の史料に残りにくい庶民の歴史を明らかにし、今の暮らしを理解すること。"},{"t":"組織化","n":"1935年に民間伝承の会がつくられ、各地の研究者が結びついた。"}],"famous":[{"t":"遠野物語（1910）","n":"岩手県遠野の話を記録した、日本民俗学の出発点とされる書。"},{"t":"アチック・ミューゼアム","n":"渋沢敬三が自宅の屋根裏で始めた、民具の収集と研究の場。"},{"t":"折口信夫","n":"柳田に学び、来訪する神「まれびと」に注目した独自の民俗学を築いた。"}],"anecdotes":["柳田は農政の官僚として全国の農村を歩いた経験から、農民の暮らしを記録する必要を感じ、民俗学へ進んだとされる。","渋沢栄一の孫の渋沢敬三は、民具の研究を進めるとともに、柳田らの民俗学の研究を支援した。"],"trivia":[{"f":"民具の収集と研究を進めたアチック・ミューゼアムを開いた渋沢敬三は、渋沢栄一の孫にあたる。","q":"渋沢敬三は、渋沢栄一の何にあたるか？","a":"孫にあたる","w":["養子にあたる","甥にあたる","弟にあたる"]},{"f":"柳田国男は1908年に宮崎県の山村、椎葉村を訪れ、狩りの習わしを聞き書きして『後狩詞記』にまとめた。","q":"柳田が1908年に訪れ、狩りの習わしを聞き書きした山村は？","a":"椎葉村（宮崎県）","w":["白川郷（岐阜県）","秋山郷（長野県）","祖谷（徳島県）"]}],"people":["柳田国男"],"related":["柳田国男","民俗学","遠野物語","佐々木喜善","折口信夫","渋沢敬三","アチック・ミューゼアム","海上の道"]},{"id":"high_growth","name":"高度経済成長","full":"高度経済成長（日本の高度成長期）","en":"High economic growth period","region":"日本","category":"指標・制度","when":"1950年代半ばから1973年","where":"日本","era":"戦後","tagline":"1950年代半ばから1973年ごろまで、日本経済が年平均で1割近く成長した時期。","facts":[{"t":"期間","n":"1950年代半ばに始まり、1973年の第一次石油危機で終わったとされる。"},{"t":"成長率","n":"実質の国民総生産が年平均で9〜10%ほど伸び、1968年に資本主義国で第2位となった。"},{"t":"背景","n":"豊富な労働力、旺盛な設備投資、輸出の拡大、安い石油などが重なった。"},{"t":"副作用","n":"公害や都市への人口集中、農村の過疎化などの問題も生んだ。"}],"famous":[{"t":"所得倍増計画（1960）","n":"池田勇人内閣が打ち出した、10年で国民所得を倍にする計画。"},{"t":"東海道新幹線（1964）","n":"東京オリンピックに合わせて開業し、高度成長の象徴となった。"},{"t":"三種の神器","n":"白黒テレビ、電気洗濯機、電気冷蔵庫。家庭に広まった家電を指す。"},{"t":"四大公害病","n":"水俣病、新潟水俣病、イタイイタイ病、四日市ぜんそくの総称。"}],"anecdotes":["1956年度の経済白書は、戦後の復興は終わったという趣旨の結びで話題となり、流行語にもなった。","所得倍増計画は10年で国民所得を倍にする目標だったが、成長が上回り、予定より早く達成されたとされる。","東海道新幹線は、東京オリンピックの開幕直前の1964年10月1日に開業した。"],"trivia":[{"f":"東海道新幹線は、東京オリンピック開会式の10日ほど前、1964年10月1日に開業した。","q":"東海道新幹線の開業は、東京オリンピック開会式のいつごろか？","a":"開会の約10日前","w":["開会の約2か月前","開会の約1年前","閉会の約10日後"]},{"f":"1968年、日本の国民総生産は西ドイツを抜き、資本主義国で第2位になった。","q":"1968年に日本の国民総生産が抜いた国は？","a":"西ドイツ","w":["イギリス","フランス","イタリア"]}],"people":["宇沢弘文"],"related":["所得倍増計画","東海道新幹線","東京オリンピック","石油危機","三種の神器","四大公害病","宇沢弘文"]},{"id":"social_common_capital","name":"社会的共通資本","full":"社会的共通資本（宇沢弘文の理論）","en":"Social common capital","region":"日本","category":"経済学","when":"1970年代から提唱","where":"日本","era":"戦後","tagline":"自然・インフラ・制度を社会の共有財産として、市場に任せず守り育てる考え方。","facts":[{"t":"三つの範疇","n":"自然環境、社会的インフラ、制度資本の3つで構成され、教育や医療も含まれる。"},{"t":"管理の原則","n":"利潤を目的とする市場に委ねず、専門家が職業的な規律のもとで管理する。"},{"t":"目的","n":"すべての人が人間らしく暮らせる豊かな社会を、持続させること。"},{"t":"広まり","n":"2000年の岩波新書『社会的共通資本』で、一般の読者にも広まった。"}],"famous":[{"t":"森林や河川","n":"自然環境の例。市場の価格では測りにくい価値を持つとされる。"},{"t":"道路・上下水道","n":"社会的インフラの例。誰もが使える基盤として社会が守る。"},{"t":"教育・医療","n":"制度資本の例。利益だけで運営すると、社会が損なわれる分野とされる。"}],"anecdotes":["宇沢は、米国の経済学者ヴェブレンの制度主義に学んだとされる。","宇沢は1974年の『自動車の社会的費用』で市民が負担する見えにくい費用を問題にし、これがのちの考えにつながったと語られる。"],"trivia":[{"f":"『社会的共通資本』は2000年に岩波新書として刊行され、宇沢の考えを一般の読者に広めた。","q":"2000年に『社会的共通資本』が刊行された叢書は？","a":"岩波新書","w":["中公新書","講談社現代新書","ちくま新書"]},{"f":"宇沢は、国ごとの一人当たり所得に比例した炭素税を提案し、環境問題にも社会的共通資本の考えを当てはめた。","q":"宇沢が提案した地球温暖化対策は？","a":"比例的炭素税","w":["排出量取引","原子力発電への転換","自動車の総量規制"]}],"people":["宇沢弘文"],"related":["宇沢弘文","制度資本","ヴェブレン","自動車の社会的費用","公共財","外部性","二部門成長モデル"]}],"glossary":[{"t":"国富論","kind":"work","d":"1776年にスミスが著した経済学の古典。分業と市場の働きを論じ、近代経済学の出発点とされる。","en":"The Wealth of Nations"},{"t":"道徳感情論","kind":"work","d":"1759年刊。人は他人への共感を通じて道徳を判断すると論じた、スミスの最初の主著。","en":"The Theory of Moral Sentiments"},{"t":"分業","kind":"term","d":"作業を分けて分担させる仕組み。スミスは国富論でピン工場を例に、生産性が大きく上がると示した。","en":"Division of labor"},{"t":"重商主義","kind":"term","d":"金銀の蓄積や貿易黒字を国の富とみなす、近世ヨーロッパの考えと政策。スミスが批判した。","en":"Mercantilism"},{"t":"ヒューム","kind":"person","d":"スコットランドの哲学者（1711年から1776年）。スミスの親友で、スコットランド啓蒙を代表する。","en":"David Hume"},{"t":"労働価値説","kind":"term","d":"商品の価値は、それを作るのに投じられた労働の量で決まるとする考え。リカードやマルクスが展開した。","en":"Labor theory of value"},{"t":"穀物法","kind":"event","d":"1815年にイギリスが定めた穀物の輸入制限法（1846年廃止）。リカードは自由貿易の立場から批判した。","en":"Corn Laws"},{"t":"経済学および課税の原理","kind":"work","d":"1817年刊のリカードの主著。地代・賃金・利潤の分配を論じ、比較優位の理論も示した。","en":"On the Principles of Political Economy and Taxation"},{"t":"マルサス","kind":"person","d":"イギリスの経済学者（1766年から1834年）。『人口論』の著者で、穀物法をめぐりリカードと論争した。","en":"Thomas Malthus"},{"t":"自由貿易","kind":"term","d":"関税や輸入制限を設けず、国どうしが自由に取引すること。比較優位の理論がその根拠とされる。","en":"Free trade"},{"t":"機会費用","kind":"term","d":"ある選択をしたために、あきらめた他の選択肢の中で最も価値の高いもの。比較優位を支える考え方。","en":"Opportunity cost"},{"t":"ポール・サミュエルソン","kind":"person","d":"アメリカの経済学者（1915年から2009年）。1970年にノーベル賞。比較優位をめぐる逸話で知られる。","en":"Paul Samuelson"},{"t":"共産党宣言","kind":"work","d":"1848年にマルクスとエンゲルスが発表した小冊子。歴史を階級闘争の歴史として描いた。","en":"The Communist Manifesto"},{"t":"エンゲルス","kind":"person","d":"ドイツの思想家（1820年から1895年）。マルクスの盟友で、資本論の第2・3巻を遺稿から編集した。","en":"Friedrich Engels"},{"t":"剰余価値","kind":"term","d":"労働者が生み出した価値のうち、賃金を超える部分。マルクスは資本家の利潤の源泉と考えた。","en":"Surplus value"},{"t":"プロレタリアート","kind":"term","d":"生産手段を持たず、労働力を売って暮らす賃金労働者の階級。マルクスの階級論の用語。","en":"Proletariat"},{"t":"ブルジョワジー","kind":"term","d":"生産手段を所有する資本家の階級。マルクスの階級論で、労働者階級と対をなす語。","en":"Bourgeoisie"},{"t":"唯物史観","kind":"term","d":"物質的な生産のあり方が、社会の制度や思想のあり方を規定するという、マルクスらの歴史観。","en":"Historical materialism"},{"t":"大英博物館","kind":"place","d":"ロンドンの博物館。付属の図書閲覧室で、マルクスが資本論のための資料を調べた。","en":"British Museum"},{"t":"プロテスタンティズムの倫理と資本主義の精神","kind":"work","d":"1904年から05年に発表されたウェーバーの論文。禁欲的な職業倫理が資本主義の精神を育んだと論じた。","en":"The Protestant Ethic and the Spirit of Capitalism"},{"t":"職業としての学問","kind":"work","d":"1917年のウェーバーの講演。学問を職業とする者の心構えと、学問の意味を論じた。","en":"Science as a Vocation"},{"t":"職業としての政治","kind":"work","d":"1919年のウェーバーの講演。政治を職業とする者に求められる資質と責任倫理を論じた。","en":"Politics as a Vocation"},{"t":"支配の三類型","kind":"term","d":"ウェーバーが示した、正統とされる支配の型。伝統的支配、カリスマ的支配、合法的支配の3つ。","en":"Three types of authority"},{"t":"カリスマ","kind":"term","d":"非日常的な資質を備えるとされる人への帰依に基づく権威。ウェーバーが社会学の用語にした。","en":"Charisma"},{"t":"理念型","kind":"term","d":"現実を整理するために、特徴を純化して作る分析用のモデル。ウェーバーの方法論の中心。","en":"Ideal type"},{"t":"鉄の檻","kind":"term","d":"合理化が進んだ近代社会が、人を逃れにくい仕組みに閉じ込めるさまを表す比喩。ウェーバーに由来する。","en":"Iron cage"},{"t":"自殺論","kind":"work","d":"1897年刊のデュルケームの著書。統計を用い、自殺の多さを社会の状態から説明した。","en":"Suicide"},{"t":"社会的事実","kind":"term","d":"個人の外にあって個人を拘束する、集団の慣習や規範など。デュルケームが社会学の対象とした。","en":"Social fact"},{"t":"社会分業論","kind":"work","d":"1893年刊。分業が社会の連帯をどう支えるかを論じた、デュルケームの博士論文。","en":"The Division of Labour in Society"},{"t":"機械的連帯と有機的連帯","kind":"term","d":"同質性による結びつきと、分業による相互依存の結びつき。デュルケームが区別した。","en":"Mechanical and organic solidarity"},{"t":"マートン","kind":"person","d":"アメリカの社会学者（1910年から2003年）。アノミー論を発展させ、逸脱の類型を示した。","en":"Robert K. Merton"},{"t":"雇用・利子および貨幣の一般理論","kind":"work","d":"1936年刊のケインズの主著。有効需要の原理で、失業が続く理由を説明した。","en":"The General Theory of Employment, Interest and Money"},{"t":"世界恐慌","kind":"event","d":"1929年の米国の株価暴落に始まり、1930年代に世界へ広がった大不況。ケインズ理論の背景となった。","en":"Great Depression"},{"t":"セイの法則","kind":"term","d":"供給はそれ自体の需要を生むとする、古典派の考え。ケインズが批判の対象とした。","en":"Say's law"},{"t":"乗数効果","kind":"term","d":"最初の支出が所得と支出を連鎖的に生み、全体の需要が何倍にもふくらむ効果。","en":"Multiplier effect"},{"t":"ブレトンウッズ体制","kind":"event","d":"1944年の会議で合意された、ドルを軸とする戦後の国際通貨体制。ケインズは英国の代表として参加した。","en":"Bretton Woods system"},{"t":"ブルームズベリー・グループ","kind":"term","d":"20世紀初頭のロンドンで交流した知識人や芸術家の集まり。ケインズもその一員だった。","en":"Bloomsbury Group"},{"t":"隷属への道","kind":"work","d":"1944年刊のハイエクの著書。計画経済が自由を損なうと警告し、広く読まれた。","en":"The Road to Serfdom"},{"t":"自生的秩序","kind":"term","d":"誰かが設計したのでなく、個々の行動の積み重ねから生まれる秩序。ハイエクの用語。","en":"Spontaneous order"},{"t":"新自由主義","kind":"term","d":"市場の自由と小さな政府を重んじる考え。1970年代以降に影響を広げ、ハイエクらの思想が背景にある。","en":"Neoliberalism"},{"t":"ミルトン・フリードマン","kind":"person","d":"アメリカの経済学者（1912年から2006年）。市場を重んじる立場で、ハイエクと並び称される。","en":"Milton Friedman"},{"t":"ウィトゲンシュタイン","kind":"person","d":"オーストリア出身の哲学者（1889年から1951年）。ハイエクの遠縁にあたる。","en":"Ludwig Wittgenstein"},{"t":"ミュルダール","kind":"person","d":"スウェーデンの経済学者（1898年から1987年）。1974年にハイエクとノーベル経済学賞を共同受賞した。","en":"Gunnar Myrdal"},{"t":"現代の経営","kind":"work","d":"1954年刊のドラッカーの著書。目標による管理など、経営の基本を体系的に論じた。","en":"The Practice of Management"},{"t":"マネジメント","kind":"work","d":"1973年刊のドラッカーの大著。経営者の仕事と責任を体系的に整理した。","en":"Management: Tasks, Responsibilities, Practices"},{"t":"企業とは何か","kind":"work","d":"1946年刊のドラッカーの著書。ゼネラル・モーターズの調査をもとに、大企業の組織と役割を論じた。","en":"Concept of the Corporation"},{"t":"知識労働者","kind":"term","d":"知識や情報を主な元手として働く人。ドラッカーが1950年代末に使い始めた語。","en":"Knowledge worker"},{"t":"目標管理","kind":"term","d":"目標を自ら設定し、その達成度で成果を測る管理の方法。ドラッカーが広めたとされる。","en":"Management by objectives"},{"t":"ゼネラル・モーターズ","kind":"term","d":"米国の自動車大手。ドラッカーが内部を調べ、1946年の『企業とは何か』にまとめた。","en":"General Motors"},{"t":"シュンペーター","kind":"person","d":"オーストリア出身の経済学者（1883年から1950年）。イノベーションの理論で知られ、ドラッカーとも縁があった。","en":"Joseph Schumpeter"},{"t":"外部性","kind":"term","d":"ある経済活動が取引の当事者以外に及ぼす、価格に表れない利益や損害。公害が典型例。","en":"Externality"},{"t":"公共財","kind":"term","d":"対価を払わない人を排除しにくく、誰もが同時に使える財。国防や灯台が例とされる。","en":"Public good"},{"t":"情報の非対称性","kind":"term","d":"取引の当事者の間で、持っている情報に差があること。中古車市場の例で知られる。","en":"Asymmetric information"},{"t":"ピグー税","kind":"term","d":"外部不経済の費用を課税で価格に織り込む考え方。経済学者ピグーが提唱した。","en":"Pigouvian tax"},{"t":"共有地の悲劇","kind":"term","d":"誰でも使える資源が、各人の利益追求により過剰に使われて荒れる現象。1968年にハーディンが論じた。","en":"Tragedy of the commons"},{"t":"ホッブズ","kind":"person","d":"イギリスの哲学者（1588年から1679年）。『リヴァイアサン』で、契約による国家の成立を論じた。","en":"Thomas Hobbes"},{"t":"ロック","kind":"person","d":"イギリスの哲学者（1632年から1704年）。『統治二論』で、政府の信託と抵抗権を論じた。","en":"John Locke"},{"t":"ルソー","kind":"person","d":"ジュネーヴ生まれの思想家（1712年から1778年）。『社会契約論』で、一般意志に基づく政治を論じた。","en":"Jean-Jacques Rousseau"},{"t":"リヴァイアサン","kind":"work","d":"1651年刊のホッブズの著書。国家を巨大な怪物にたとえ、強い主権の必要を論じた。","en":"Leviathan"},{"t":"自然状態","kind":"term","d":"国家や法ができる前に、人間が置かれているとする仮定上の状態。社会契約論の出発点。","en":"State of nature"},{"t":"一般意志","kind":"term","d":"共同体全体の利益をめざす意志。ルソーが示し、個々人の私的な意志の総和とは区別した。","en":"General will"},{"t":"名誉革命","kind":"event","d":"1688年から89年のイギリスの政変。議会の権利を確立し、ロックの政治思想の背景となった。","en":"Glorious Revolution"},{"t":"第一国立銀行","kind":"term","d":"1873年に渋沢栄一らが東京に設立した、日本初の銀行。渋沢はその経営に当たった。","en":"First National Bank"},{"t":"合本主義","kind":"term","d":"人材と資本を広く集めて事業を行う考え方。渋沢栄一の事業観の核とされる。","en":"Gappon-shugi"},{
