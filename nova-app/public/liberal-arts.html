る味わいの白になる。"},{"t":"ジョージアのクヴェヴリ","n":"地中に埋めた大きな壺で醸す伝統製法が、ユネスコの無形文化遺産に登録された。"}],"anecdotes":["古代ギリシャでは、ワインを水で割って飲むのがふつうで、薄めずに飲むのは粗野なことだとされた。","19世紀後半、害虫フィロキセラがヨーロッパのブドウ畑を襲い、北米産の台木に接ぎ木して立て直した。","日本では明治期にワイン造りが本格化し、山梨県の甲州ブドウが在来の代表種として知られる。"],"trivia":[{"f":"黒ブドウも、果皮を除いて果汁だけを発酵させれば白ワインになる。黒ブドウだけで造る白をブラン・ド・ノワールと呼ぶ。","q":"黒ブドウだけから果皮を除いて造る白ワインを、何と呼ぶか。","a":"ブラン・ド・ノワール","w":["ブラン・ド・ブラン","ロゼ・ド・セニエ","ヴァン・ジョーヌ"]},{"f":"ジョージアには、地中に埋めた壺で醸す伝統があり、この製法はユネスコの無形文化遺産に登録されている。","q":"ジョージアで、地中に埋めて醸造に使う伝統の壺は何か。","a":"クヴェヴリ","w":["バリック","ソレラ","カラフェ"]}],"people":["パスツール"],"related":["ボルドーとブルゴーニュ","シャンパーニュ","テロワールとヴィンテージ","カベルネ・ソーヴィニヨン","シャルドネ","クヴェヴリ"]},{"id":"whisky","name":"ウイスキー","full":"ウイスキー（スコッチ・バーボン）","en":"Whisky / Whiskey","region":"海外","category":"酒の種類","when":"15世紀末に記録（スコットランド）","where":"スコットランド・米国ほか","era":"近世まで","tagline":"穀物を発酵・蒸留し、樽で寝かせる琥珀色の蒸留酒","facts":[{"t":"製法","n":"穀物を麦芽で糖化して発酵させ、蒸留して樽で熟成する。琥珀色は主に樽に由来する。"},{"t":"スコッチ","n":"スコットランドで造られ、オーク樽で3年以上熟成させる決まりがある。"},{"t":"バーボン","n":"米国産で、トウモロコシを51%以上使い、内側を焦がした新樽で熟成させる。"},{"t":"綴りの違い","n":"スコットランドや日本は「whisky」、アイルランドと米国は「whiskey」が一般的。"}],"famous":[{"t":"シングルモルト","n":"一つの蒸留所の麦芽原酒だけで造る。アイラ島の煙のような香りの酒などが知られる。"},{"t":"ブレンデッド","n":"モルトとグレーンの原酒を混ぜ、安定した味に仕上げる。流通の中心。"},{"t":"ケンタッキー州","n":"バーボンの主産地。石灰岩の層でろ過された水が良いとされる。"}],"anecdotes":["1494年のスコットランドの財務記録に、修道士ジョン・コーへ麦芽を渡して「命の水」を造らせたとあり、最古級の記録として知られる。","ゲール語で「命の水」を意味する語が縮まって、ウイスキーという名になったとされる。","禁酒法の時代（1920〜33年）の米国では、国外から運ばれる酒の密輸が盛んになったと言われる。"],"trivia":[{"f":"ウイスキー造りを示す最古級の公的記録は、1494年のスコットランドの財務記録に残る、修道士に麦芽を渡して「命の水」を造らせたという記述だ。","q":"ウイスキー造りを示す最古級の記録が残る、スコットランドの財務記録の年はいつか。","a":"1494年","w":["1707年","1603年","1823年"]},{"f":"バーボンは、内側を焦がした新品のオーク樽で熟成させる決まりがある。使い終えた樽は、スコッチなど他の酒の熟成に回されることが多い。","q":"バーボンの熟成に使う樽の条件は何か。","a":"内側を焦がした新品のオーク樽","w":["シェリー酒を詰めていた古いオーク樽","焦がさず乾燥させただけの栗の新樽","ワインを寝かせた後の赤く染まった樽"]}],"people":[],"related":["スコッチ","バーボン","シングルモルト","ブレンデッド","ポットスチル","蒸留と熟成","麦芽"]},{"id":"beer","name":"ビール","full":"ビール","en":"Beer","region":"海外","category":"酒の種類","when":"古代メソポタミアに始まる","where":"世界各地（チェコ・ドイツ・英国など）","era":"","tagline":"大麦麦芽とホップで造る、世界で最も飲まれる醸造酒の一つ","facts":[{"t":"原料","n":"麦芽・ホップ・水・酵母が基本。ホップが香りと苦みを与え、保存性も高める。"},{"t":"上面と下面","n":"エールは上面発酵、ラガーは下面発酵で低温。現在の世界の主流はラガー。"},{"t":"ピルスナー","n":"1842年、ボヘミアのピルゼンで生まれた淡い金色のラガーが世界へ広まった。"},{"t":"純粋令","n":"1516年、バイエルンで原料を大麦・ホップ・水に限る法令が出された。"}],"famous":[{"t":"ピルスナー・ウルケル","n":"ピルゼンで1842年に始まった、ピルスナーの元祖とされる銘柄。"},{"t":"エールの例","n":"英国のペールエールやスタウトなど。ベルギーには修道院ビールの伝統もある。"},{"t":"ヴァイツェン","n":"ドイツ南部の小麦を使うビール。華やかな香りと白く濁った見た目が特徴。"}],"anecdotes":["紀元前1800年ごろのシュメールの粘土板には、ビールの女神ニンカシを称える詩が残り、作り方も読み取れる。","中世ヨーロッパでは、修道院が醸造を担い、水の代わりに飲まれる大切な飲み物として発展した。","ミュンヘンのオクトーバーフェストは、1810年のバイエルン皇太子の結婚祝いの催しが起源とされる。"],"trivia":[{"f":"1516年のバイエルンの純粋令は、ビールの原料を大麦・ホップ・水に限った。酵母の存在が知られる前の法令なので、酵母は書かれていない。","q":"1516年のビール純粋令が、原料として挙げたものは何か。","a":"水・大麦・ホップ","w":["水・小麦・ホップ","水・大麦・酵母","水・大麦・ライ麦"]},{"f":"世界で最も広く飲まれる淡い金色のビール「ピルスナー」は、1842年に現在のチェコのピルゼンで生まれた。","q":"淡い金色のラガー「ピルスナー」の発祥の地はどこか。","a":"チェコのピルゼン","w":["ドイツのミュンヘン","ベルギーのブリュッセル","オーストリアのウィーン"]}],"people":["アーサー・ギネス","パスツール"],"related":["エール","ラガー","ピルスナー","ホップ","麦芽","純粋令"]},{"id":"cognac","name":"ブランデーとコニャック","full":"ブランデーとコニャック","en":"Brandy and Cognac","region":"海外","category":"酒の種類","when":"17世紀に発展","where":"フランス西部コニャック地方","era":"近世まで","tagline":"ワインを蒸留して樽で寝かせる酒。最高峰がコニャック","facts":[{"t":"ブランデー","n":"ブドウなどの果実酒を蒸留した酒の総称。語源はオランダ語の「焼いたワイン」。"},{"t":"コニャック","n":"フランス西部のコニャック地方で、主にユニ・ブランを蒸留し、樽で熟成させる。"},{"t":"製法","n":"銅製の単式蒸留器で2回蒸留し、オーク樽で2年以上熟成させる。"},{"t":"年数の表示","n":"VS、VSOP、XOの順に熟成が長い。VSは2年以上、VSOPは4年以上。"}],"famous":[{"t":"アルマニャック","n":"ガスコーニュ地方のブランデー。コニャックより素朴とされ、蒸留は基本1回。"},{"t":"カルヴァドス","n":"ノルマンディー地方で造る、リンゴの酒を蒸留したブランデー。"},{"t":"大手の生産者","n":"ヘネシー、レミーマルタン、マーテル、クルボアジェがよく知られる。"}],"anecdotes":["17世紀、オランダの商人がワインを運ぶ手間や税を減らすために蒸留して運んだのが、始まりと伝わる。","19世紀後半のフィロキセラ禍でブドウが不足し、欧州でウイスキーが広まる好機になったとされる。","コニャックの「ナポレオン」の語は、長く寝かせた上等な品を示す表示として使われてきた。"],"trivia":[{"f":"ブランデーの語は、オランダ語の「ブランデウェイン（焼いたワイン）」に由来し、加熱して蒸留する様子を表す。","q":"ブランデーの語源とされるオランダ語は、何を意味するか。","a":"焼いたワイン","w":["ブドウの魂を集めた酒","琥珀色に輝く雫","神に捧げる命の水"]},{"f":"コニャックの伝統的な蒸留は、シャラント式と呼ばれる銅製の単式蒸留器を使い、2回に分けて行う。","q":"コニャックの伝統的な蒸留の方法は何か。","a":"銅製の単式蒸留器で2回","w":["銅製の単式蒸留器で3回","ステンレスの連続式蒸留機で1回","素焼きの大きな甕で5回"]}],"people":[],"related":["アルマニャック","カルヴァドス","ユニ・ブラン","蒸留と熟成","ワイン","ポットスチル"]},{"id":"champagne","name":"シャンパーニュ","full":"シャンパーニュ（フランスの発泡ワイン）","en":"Champagne","region":"海外","category":"産地・地理","when":"17世紀後半から発展","where":"フランス北東部シャンパーニュ地方","era":"近世まで","tagline":"地方の名を冠した、瓶の中で泡が生まれる特別なスパークリングワイン","facts":[{"t":"名称","n":"シャンパーニュ地方で、決められた製法を守って造ったものだけが名乗れる。"},{"t":"製法","n":"瓶内二次発酵で泡を生む。酵母と糖を加えて瓶を密閉し、瓶の中でもう一度発酵させる。"},{"t":"品種","n":"主な品種はシャルドネ、ピノ・ノワール、ピノ・ムニエの3つ。"},{"t":"貯蔵","n":"中心都市はランスとエペルネ。地下のチョーク質の洞窟が貯蔵庫になる。"}],"famous":[{"t":"ドン・ペリニヨン","n":"モエ・エ・シャンドンの最高級銘柄に名が残り、品質の象徴になった。"},{"t":"ヴーヴ・クリコ","n":"未亡人のクリコ夫人が、澱を瓶口に集める動瓶の手法を広めたとされる。"}],"anecdotes":["1662年、英国の学者メレットが、ワインに糖を加えると泡立つ仕組みを王立協会に報告している。ドン・ペリニヨンより前から泡は知られていた。","ナポレオン軍の騎兵が祝いの席でサーベルで瓶の首を切り飛ばしたのが、サバラージュの始まりと伝わる。","2015年、シャンパーニュの丘陵とメゾン、地下のカーヴが、ユネスコの世界遺産に登録された。"],"trivia":[{"f":"ワインに糖を加えると泡立つことは、ドン・ペリニヨンの存命中の1662年に英国のメレットが王立協会へ報告しており、泡の発明者は彼ではない。","q":"1662年に、ワインに糖を加えると泡立つことを王立協会へ報告した英国人は誰か。","a":"クリストファー・メレット","w":["ジョン・イーヴリン","ロバート・ボイル","クリストファー・レン"]},{"f":"サーベルで瓶の首を切り飛ばして開ける作法をサバラージュと呼び、ナポレオン軍の騎兵が始めたと伝わる。","q":"サーベルでシャンパーニュの瓶の首を切り開ける作法を、何と呼ぶか。","a":"サバラージュ","w":["ルミュアージュ","ドザージュ","デゴルジュマン"]}],"people":["ドン・ペリニヨン"],"related":["ワイン","瓶内二次発酵","シャルドネ","ピノ・ノワール","ルミュアージュ","サバラージュ","モエ・エ・シャンドン"]},{"id":"bordeaux","name":"ボルドーとブルゴーニュ","full":"ボルドーとブルゴーニュ","en":"Bordeaux and Burgundy","region":"海外","category":"産地・地理","when":"中世から。格付けは1855年","where":"フランス南西部・東部","era":"近代","tagline":"ブレンドで魅せるボルドーと、畑と単一品種で魅せるブルゴーニュ","facts":[{"t":"ボルドー","n":"南西部の大産地。赤は主にカベルネ・ソーヴィニヨンとメルローを混ぜて造る。"},{"t":"ブルゴーニュ","n":"東部の産地。赤はピノ・ノワール、白はシャルドネの単一品種が基本。"},{"t":"格付けの違い","n":"ボルドーは生産者（シャトー）、ブルゴーニュは畑ごとに等級が付く。"},{"t":"1855年の格付け","n":"ナポレオン3世の時代、パリ万博に合わせてメドックの赤などが五つの等級に分けられた。"}],"famous":[{"t":"第一級","n":"当初の第一級は、ラフィット、ラトゥール、マルゴー、オー・ブリオンの4つ。"},{"t":"ムートン","n":"1973年に第二級から第一級へ昇格した、格上げのほぼ唯一の例。"},{"t":"ロマネ・コンティ","n":"ブルゴーニュの特級畑で、世界で最も高価なワインの一つとして知られる。"}],"anecdotes":["1152年にアキテーヌ公女がイングランド王ヘンリー2世と結婚し、ボルドーは約300年英国王家の領土となって、ワインが盛んに輸出された。","英国ではボルドーの赤ワインを昔からクラレットと呼び、貴族に好まれる飲み物として親しまれた。","ブルゴーニュの畑は、中世の修道院が長い年月をかけて区画ごとの味の違いを見極めてきた歴史を持つ。"],"trivia":[{"f":"1855年のボルドー格付けは、皇帝ナポレオン3世の求めで、パリ万国博覧会に出すワインを選ぶために作られた。","q":"1855年のボルドーの格付けは、何に出品するワインを選ぶために作られたか。","a":"パリ万国博覧会","w":["ロンドン万国博覧会","皇帝の戴冠記念の晩餐会","ウィーン万国博覧会"]},{"f":"1855年の格付けはほとんど変わらず、1973年にムートン・ロートシルトが第二級から第一級へ昇格したのが大きな変更だった。","q":"1973年に第二級から第一級へ昇格したシャトーはどこか。","a":"シャトー・ムートン・ロートシルト","w":["シャトー・コス・デストゥルネル","シャトー・ピション・ロングヴィル","シャトー・レオヴィル・ラス・カーズ"]}],"people":[],"related":["カベルネ・ソーヴィニヨン","メルロー","ピノ・ノワール","クリマ","ロマネ・コンティ","1855年の格付け"]},{"id":"terroir","name":"テロワールとヴィンテージ","full":"テロワールとヴィンテージ","en":"Terroir and Vintage","region":"海外","category":"製法・用語","when":"AOC制度は1930年代に整備","where":"フランスを中心に世界のワイン産地","era":"","tagline":"産地の土・気候・人の営みと、収穫年の差が味を決めるという考え方","facts":[{"t":"テロワール","n":"土壌・気候・地形など、畑の個性を生む条件の総体。語源はフランス語の「土地」。"},{"t":"ヴィンテージ","n":"ブドウを収穫した年。天候で出来が変わるため、同じ銘柄でも年ごとに味が違う。"},{"t":"ノン・ヴィンテージ","n":"複数年のワインを混ぜ、毎年同じ味に整えたもの。シャンパーニュに多い。"},{"t":"AOC","n":"フランスの原産地呼称統制は、産地・品種・収量などを法で定め、1930年代に整った。"}],"famous":[{"t":"クリマ","n":"ブルゴーニュの区画「クリマ」は、2015年に世界遺産に登録された。"},{"t":"モーゼルの急斜面","n":"ドイツのモーゼル川沿いの急斜面の畑は、日照を求めた土地の工夫を示す。"},{"t":"パリスの審判","n":"1976年のパリの試飲会でカリフォルニア産が首位に立ち、テロワール論に一石を投じた。"}],"anecdotes":["1976年のパリの試飲会では、フランスの審査員が目隠しで選び、白も赤もカリフォルニア産が首位に立った。","同じ畑でも、収穫年の天候でブドウの出来が大きく変わり、ワインの価格にも差が出る。","ノン・ヴィンテージのシャンパーニュは、天候に左右されず毎年同じ味を保つための、ブレンドの技の見せ所でもある。"],"trivia":[{"f":"1976年のパリの目隠し試飲会では、白も赤もアメリカのカリフォルニア産が首位に立ち、フランスの関係者に衝撃を与えた。","q":"1976年のパリの目隠し試飲会で、白と赤の両部門で首位になった産地はどこか。","a":"アメリカのカリフォルニア","w":["オーストラリアのバロッサ","チリのマイポ","イタリアのトスカーナ"]},{"f":"ノン・ヴィンテージのシャンパーニュは、年ごとの出来の差をならすため、複数年の原酒を混ぜて同じ味に整える。","q":"シャンパーニュのノン・ヴィンテージが複数年の原酒を混ぜる主な狙いは何か。","a":"年ごとの違いをならし味を保つ","w":["古い原酒を安く処分して在庫を減らす","法で定められた最低熟成の年数を満たす","不作の年でもブドウの色を濃くする"]}],"people":[],"related":["AOC","クリマ","パリスの審判","ボルドーとブルゴーニュ","シャンパーニュ","ワイン"]},{"id":"distill","name":"蒸留と熟成","full":"蒸留と熟成","en":"Distillation and Aging","region":"海外","category":"製法・用語","when":"古代に始まり中世に普及","where":"世界各地","era":"","tagline":"加熱でアルコールを集める蒸留と、樽で寝かせる熟成の組み合わせ","facts":[{"t":"原理","n":"アルコールの沸点は水より低い（約78℃）。加熱して蒸気を冷やし集めると濃くなる。"},{"t":"蒸留器の種類","n":"単式蒸留器は原料の個性が残り、連続式は雑味の少ない高純度の酒になる。"},{"t":"連続式の登場","n":"19世紀前半にコフィーが連続式蒸留機の特許を得て、大量生産が可能になった。"},{"t":"熟成","n":"木樽で寝かせると、色と香りが付き、荒い味が丸くなる。"}],"famous":[{"t":"ポットスチル","n":"銅製の単式蒸留器。モルトウイスキーやコニャックで使われる。"},{"t":"コフィー式","n":"1830年ごろ、アイルランドのコフィーが特許を得た連続式蒸留機。"},{"t":"オーク樽","n":"ウイスキー、ブランデー、ワインなど多くの酒の熟成に使われる。"}],"anecdotes":["蒸留の技術は錬金術の道具として発達し、蒸留器を指すアレンビックの語はアラビア語に由来する。","中世ヨーロッパの修道院では、蒸留した酒を「命の水」と呼び、病を和らげる薬として扱った。","熟成中に樽からは毎年わずかに酒が蒸発し、その失われる分をユーモアを込めて「天使の分け前」と呼ぶ。"],"trivia":[{"f":"熟成中に樽から少しずつ蒸発して失われる酒を、洒落た言い方で「天使の分け前」と呼ぶ。","q":"熟成中に樽から蒸発して失われる分を、酒の世界では何と呼ぶか。","a":"天使の分け前","w":["樽職人の取り分","修道士の分け前","海風の贈り物"]},{"f":"連続式蒸留機は、1830年にアイルランドのイーニアス・コフィーが特許を得て、酒の大量生産を可能にした。","q":"1830年に連続式蒸留機の特許を得た人物は誰か。","a":"イーニアス・コフィー","w":["ジェームズ・ワット","ジョージ・スチーブンソン","ジョサイア・ウェッジウッド"]}],"people":[],"related":["ポットスチル","連続式蒸留機","エンジェルズ・シェア","オーク樽","ウイスキー","ブランデーとコニャック"]},{"id":"spirits","name":"ジン・ラム・テキーラ・ウォッカ","full":"ジン・ラム・テキーラ・ウォッカ","en":"Gin, Rum, Tequila, Vodka","region":"海外","category":"酒の種類","when":"中世〜17世紀ごろに成立","where":"オランダ・英国・カリブ海・メキシコ・東欧","era":"近世まで","tagline":"原料と香りの違いで分かれる、世界の主要な蒸留酒（スピリッツ）","facts":[{"t":"ジン","n":"穀物の蒸留酒にジュニパーベリーで香りを付ける。原型はオランダのジェニーバ。"},{"t":"ラム","n":"サトウキビの搾り汁や糖蜜から造る。カリブ海の島々が主産地。"},{"t":"テキーラ","n":"メキシコのハリスコ州周辺で、ブルーアガベを原料に造る。"},{"t":"ウォッカ","n":"東欧が発祥で、穀物やジャガイモから造る。ろ過してクセを抑えた無色の酒が多い。"}],"famous":[{"t":"ジン・トニック","n":"ジンをトニックウォーターで割る定番のカクテル。"},{"t":"ダイキリ","n":"ラムにライムと砂糖を合わせる代表的なカクテル。"},{"t":"マルガリータ","n":"テキーラにライムとオレンジの酒を合わせ、縁に塩を付けるカクテル。"},{"t":"モスコミュール","n":"ウォッカをジンジャービアとライムで割るカクテル。"}],"anecdotes":["18世紀前半のロンドンでは安いジンが広まって社会問題となり、1751年に規制の法律ができた。","インド駐在の英国人が、苦いキニーネ入りのトニックウォーターをジンで割って飲んだのが、ジン・トニックの始まりとされる。","テキーラの原料は、サボテンではなくリュウゼツランの仲間で、収穫まで育つのに長い年月がかかる。"],"trivia":[{"f":"テキーラの原料はサボテンではなく、リュウゼツランの仲間のブルーアガベで、育つまでに年単位の時間がかかる。","q":"テキーラの原料になる植物は何か。","a":"ブルーアガベ","w":["ウチワサボテン","ユッカの根","ヤシの樹液"]},{"f":"ウォッカの名は、ロシア語で「水」を表す語を親しみを込めて縮めた形に由来するとされる。","q":"ウォッカの名の由来とされるロシア語は、何を意味するか。","a":"水","w":["命","火","麦"]}],"people":[],"related":["ジュニパーベリー","アガベ","糖蜜","蒸留と熟成","ウイスキー"]},{"id":"seishu","name":"日本酒","full":"日本酒（清酒）","en":"Sake (Nihonshu)","region":"日本","category":"酒の種類","when":"古代から。江戸期に現在の形","where":"日本各地（灘・伏見・新潟など）","era":"近世まで","tagline":"米・米麹・水を並行複発酵させて造る、日本を代表する醸造酒","facts":[{"t":"原料","n":"米・米麹・水が基本。麹の力で米のデンプンを糖にし、同時に酵母で発酵させる。"},{"t":"度数","n":"アルコール度数は15度前後が多く、ワイン（約12度）やビール（約5度）より高い。"},{"t":"火入れ","n":"貯蔵の前後などに60〜65℃ほどに加熱して殺菌する。この工程を「火入れ」と呼ぶ。"},{"t":"寒造り","n":"冬の寒い時期に仕込む「寒造り」が江戸時代に広まり、今も酒造りの基本。"}],"famous":[{"t":"灘と伏見","n":"兵庫県の灘と京都の伏見が、二大産地として知られる。"},{"t":"新潟県","n":"酒蔵の数が全国で最も多い県として知られる。"},{"t":"松尾大社","n":"京都市にある酒造の神を祀る神社で、全国の酒造関係者が参拝する。"}],"anecdotes":["16世紀の奈良の寺の日記『多聞院日記』に火入れの記述があり、パスツールの低温殺菌より約300年早い。","室町時代、奈良の寺院は僧坊酒を盛んに造り、中でも正暦寺の酒は清酒の源流の一つとされる。","10月1日は「日本酒の日」。十二支で10月にあたる酉の字が酒つぼを表すことなどから、1978年に定められた。"],"trivia":[{"f":"日本酒の「火入れ」は、パスツールが低温殺菌を考案する約300年前の16世紀の寺の日記にすでに記されている。","q":"日本酒の火入れ（加熱殺菌）を記した、16世紀の寺の日記は何か。","a":"多聞院日記","w":["御堂関白記","明月記","看聞日記"]},{"f":"酒蔵の数が最も多いのは兵庫県ではなく新潟県で、兵庫県は出荷量の面で全国一の酒どころとして知られる。","q":"酒蔵の数が全国で最も多い都道府県はどこか。","a":"新潟県","w":["兵庫県","京都府","山口県"]}],"people":[],"related":["純米・吟醸の区分","精米歩合","麹と並行複発酵","杜氏と酒蔵","灘と伏見","焼酎と泡盛","火入れ"]},{"id":"junmai","name":"純米・吟醸の区分","full":"純米・吟醸の区分（特定名称酒）","en":"Junmai and Ginjo grades","region":"日本","category":"製法・用語","when":"1990年ごろに表示基準","where":"日本全国","era":"戦後・現代","tagline":"米の磨き具合とアルコール添加の有無で分ける、日本酒の8つの呼び名","facts":[{"t":"特定名称酒","n":"純米大吟醸・大吟醸・純米吟醸・吟醸・特別純米・純米・特別本醸造・本醸造の8種類。"},{"t":"純米と本醸造","n":"純米は米・米麹・水だけ。本醸造は白米重量の10%以下の醸造アルコールを加える。"},{"t":"精米の基準","n":"吟醸は精米歩合60%以下、大吟醸は50%以下、本醸造は70%以下が目安。"},{"t":"吟醸造り","n":"低温でゆっくり発酵させ、果実のような吟醸香を引き出す造り方。"}],"famous":[{"t":"獺祭","n":"山口県の旭酒造の銘柄。最上位に精米歩合23%の純米大吟醸がある。"},{"t":"山田錦","n":"吟醸造りに向く酒米で、「酒米の王」として知られる。"}],"anecdotes":["「純米」は米を多く削ることではなく、アルコールを添加しないという意味で、あまり磨かない純米酒もある。","1990年前後に特定名称の表示基準が整い、それまでの特級・一級・二級の級別制度は1992年に廃止された。","吟醸酒は、かつて品評会に出す特別な酒として手間をかけて造られたことから広まったとされる。"],"trivia":[{"f":"純米酒の「純」は、米を何割削ったかではなく、醸造アルコールを加えていないことを示す。","q":"日本酒の「純米」の名が示しているのは何か。","a":"アルコール添加をしていないこと","w":["米を半分以下になるまで磨いたこと","原料に国産米だけを使っていること","その土地の水だけで仕込んでいること"]},{"f":"山口県の獺祭の最上位「磨き二割三分」は、玄米の約77%を削り落とし、残りの23%だけを使う。","q":"獺祭の最上位「磨き二割三分」は、玄米の約何%を削り落とすか。","a":"約77%","w":["約23%","約50%","約60%"]},{"f":"1992年まで日本酒には特級・一級・二級の「級別制度」があり、税額とも結びついていた。","q":"1992年に廃止された、日本酒の等級の仕組みはどれか。","a":"特級・一級・二級の級別制度","w":["吟醸・純米・本醸造の3区分制度","甲類・乙類の2区分制度","大吟醸・吟醸だけの2段階制度"]}],"people":[],"related":["日本酒","精米歩合","山田錦","醸造アルコール","特定名称酒","獺祭"]},{"id":"seimai","name":"精米歩合","full":"精米歩合（米を磨く割合）","en":"Seimai-buai (rice polishing ratio)","region":"日本","category":"製法・用語","when":"古くから米を磨く工程","where":"日本全国の酒蔵","era":"","tagline":"玄米を削って残った割合。数字が小さいほど外側を多く削ったことになる","facts":[{"t":"定義","n":"玄米を削って残った白米の割合。60%なら、外側を4割削り落としている。"},{"t":"磨く理由","n":"米の外側には脂質やタンパク質が多く、雑味や香りの乱れのもとになるため削る。"},{"t":"食用米との差","n":"ご飯用の白米は精米歩合90%前後。大吟醸はその半分ほどまで磨く。"},{"t":"心白","n":"酒造好適米は粒の中心に白く不透明な心白があり、麹が菌糸を伸ばしやすい。"}],"famous":[{"t":"山田錦","n":"兵庫県で育成された酒米の代表格で、「酒米の王」と呼ばれる。"},{"t":"五百万石","n":"新潟県を代表する酒米。淡麗な酒に向くとされる。"},{"t":"雄町","n":"岡山県で古くから栽培される酒米。豊かな味わいの酒になるとされる。"}],"anecdotes":["灘では六甲山から流れる急流の力で水車を回して米を搗き、大規模な酒造りを力強く支えた。","酒造好適米は食用米より粒が大きく、背が高く倒れやすいため、育てにくいと言われる。","山田錦は兵庫県で山田穂と短稈渡船の交配から生まれ、1936年に山田錦と命名されたとされる。"],"trivia":[{"f":"ご飯用の白米の精米歩合は90%前後で、玄米の外側を1割ほど削っただけ。大吟醸は50%以下まで削る。","q":"家庭で食べる白米の精米歩合は、およそ何%か。","a":"約90%","w":["約70%","約50%","約30%"]},{"f":"酒造好適米の粒の中央にある白く不透明な部分を「心白」と呼び、麹菌が菌糸を伸ばしやすくする。","q":"酒造好適米の中心にある、麹菌が菌糸を伸ばしやすい白い部分は何か。","a":"心白","w":["腹白","胚乳","糠層"]}],"people":[],"related":["日本酒","純米・吟醸の区分","山田錦","五百万石","雄町","心白"]},{"id":"toji","name":"杜氏と酒蔵","full":"杜氏と酒蔵","en":"Toji and Sakagura","region":"日本","category":"製法・用語","when":"江戸時代に仕組みが整う","where":"日本各地の酒蔵","era":"近世まで","tagline":"酒造りを率いる責任者「杜氏」と、蔵人たちが冬に仕込む伝統の仕組み","facts":[{"t":"杜氏","n":"酒蔵で酒造りの全工程を取り仕切る責任者。蔵人を率いて仕込みを進める。"},{"t":"寒造り","n":"冬に仕込む。低温で雑菌を抑え、ゆっくり発酵させて雑味の少ない酒にするため。"},{"t":"季節労働","n":"農閑期の冬に、農村から杜氏と蔵人が酒蔵へ出稼ぎに来る形が長く続いた。"},{"t":"杉玉","n":"酒蔵の軒先に吊るす杉の葉の玉。新酒ができた知らせとされる。"}],"famous":[{"t":"南部杜氏","n":"岩手県を拠点とする杜氏集団で、三大杜氏の一つとされる。"},{"t":"越後杜氏","n":"新潟県を拠点とする杜氏集団で、三大杜氏の一つとされる。"},{"t":"丹波杜氏","n":"兵庫県の丹波地方を拠点とし、灘の酒造りを支えた。"}],"anecdotes":["杜氏の語源には、酒造りの祖とされる中国の杜康にちなむ説や、古代の女性の呼び名「刀自」に由来する説がある。","酒蔵の軒の杉玉は、緑の新しいうちは新酒の合図で、茶色に枯れるころは酒の熟成が進んだ目安と言われる。","酒造りの神として京都の松尾大社などが信仰を集め、酒蔵には神棚を祀って仕込みの無事を祈る習慣がある。"],"trivia":[{"f":"酒造りが冬に行われてきたのは、低温で雑菌の繁殖を抑えながら、発酵をゆっくり進められるからだ。","q":"酒造りが冬に行われてきた主な理由は何か。","a":"低温で雑菌を抑え、発酵をゆっくり進めるため","w":["冬は新米の収穫期で、それ以外は米が手に入らないため","寒さで水の硬度が上がり、麹がよく育つため","日が短く、蔵の労働時間が自然に短くなるため"]},{"f":"酒蔵の軒に杉玉が青々と吊るされているのは、新酒ができたことを知らせる合図で、時間とともに茶色く枯れていく。","q":"酒蔵の軒に杉玉が青々と吊るされる時期は、何の知らせとされるか。","a":"新酒ができたこと","w":["酒蔵が休業に入ること","酒米の収穫を祝う宴","蔵開きの来場者の募集"]}],"people":[],"related":["日本酒","寒造り","杉玉","三大杜氏","松尾大社","麹と並行複発酵"]},{"id":"koji","name":"麹と並行複発酵","full":"麹と並行複発酵","en":"Koji and parallel multiple fermentation","region":"日本","category":"製法・用語","when":"古代から","where":"日本","era":"","tagline":"麹が米を糖にしながら酵母が発酵する、日本酒ならではの二つの同時進行","facts":[{"t":"麹","n":"蒸した米に麹菌を繁殖させたもの。酵素がデンプンを糖に変える（糖化）。"},{"t":"並行複発酵","n":"糖化と発酵を同じタンクで同時に進める。ワインやビールとは異なる方式。"},{"t":"三段仕込み","n":"酒母に、添・仲・留の3回に分けて米・麹・水を加えて仕込む。"},{"t":"高い度数","n":"糖が絶えず供給されるため、原酒では20度近くまで上がることもある。"}],"famous":[{"t":"黄麹菌","n":"日本酒・味噌・醤油に使われる麹菌。学名はアスペルギルス・オリゼー。"},{"t":"酒母","n":"酵母を純粋に大量に育てたもの。生もと・山廃・速醸などの方法がある。"},{"t":"醪","n":"仕込み後に発酵が進む液。米粒が溶けつつ発酵する状態。"}],"anecdotes":["『播磨国風土記』には、神に供えた米にカビが生え、それで酒を醸したという趣旨の記述があり、麹による酒造りの古い手がかりとされる。","麹菌は2006年、日本醸造学会に「国菌」と認定された。味噌や醤油にも使われる日本の食を支える菌だ。","古代には、米を口で噛んで唾液の酵素で糖にする「口噛み酒」も造られ、儀式に使われたと伝わる。"],"trivia":[{"f":"麹菌は、2006年に日本醸造学会によって「国菌」に認定された。日本酒だけでなく味噌や醤油にも欠かせない。","q":"2006年に日本醸造学会が「国菌」と認めた菌はどれか。","a":"麹菌（コウジカビ）","w":["納豆菌（枯草菌）","乳酸菌（ラクトバチルス）","酵母（サッカロミセス）"]},{"f":"日本酒は、麹による糖化と酵母による発酵を同じタンクで同時に進める並行複発酵のため、醸造酒でありながら高い度数に達する。","q":"日本酒が蒸留をせずに高い度数まで上がる、独特の仕組みは何か。","a":"糖化と発酵を同じタンクで同時に進める方式","w":["糖を足しながら何度も蒸留して濃縮する方式","発酵の後に凍らせて水分を除き濃縮する方式","純アルコールを大量に加えて度数を上げる方式"]}],"people":[],"related":["日本酒","黄麹菌","酒母","醪","三段仕込み","口噛み酒","国菌"]},{"id":"shochu","name":"焼酎と泡盛","full":"焼酎と泡盛","en":"Shochu and Awamori","region":"日本","category":"酒の種類","when":"16世紀ごろに伝来・普及","where":"九州・沖縄","era":"近世まで","tagline":"九州の芋・麦・米と、沖縄の泡盛。蒸留して造る日本の蒸留酒","facts":[{"t":"焼酎","n":"醸造した原料を蒸留した酒。連続式蒸留の甲類と、単式蒸留の乙類（本格焼酎）がある。"},{"t":"原料","n":"芋・麦・米・黒糖・そばなど多彩。鹿児島は芋、大分は麦、熊本は米が知られる。"},{"t":"泡盛","n":"沖縄の蒸留酒。タイ米を黒麹で仕込み、単式蒸留する。"},{"t":"古酒","n":"泡盛は3年以上寝かせたものを古酒（クース）と呼ぶ。長期熟成の文化がある。"}],"famous":[{"t":"芋焼酎","n":"鹿児島・宮崎が主産地。サツマイモ由来の甘い香りが特徴。"},{"t":"黒糖焼酎","n":"奄美群島だけで造れる焼酎。原料は黒糖と米麹。"},{"t":"泡盛","n":"琉球王国の時代から続く酒。壺で寝かせる古酒が珍重される。"}],"anecdotes":["鹿児島の神社で1559年に大工が残した落書きに、神主がけちで焼酎を飲ませてくれなかったとあり、「焼酎」の語が確かめられる古い例として知られる。","泡盛の蒸留技術は、15世紀ごろに琉球王国がシャム（今のタイ）との交易で伝えたとする説が有力とされる。","古い泡盛に新しい泡盛を継ぎ足して育てる「仕次ぎ」で、古酒の味を長く保つ伝統がある。"],"trivia":[{"f":"鹿児島県の神社の1559年の落書きに、神主がけちで焼酎を飲ませてくれなかったとあり、焼酎の語が使われた古い記録とされる。","q":"1559年の落書きに「焼酎」の語が残る場所はどこか。","a":"鹿児島県の郡山八幡神社","w":["沖縄県の首里城の門","熊本県の人吉城の石垣","宮崎県の高千穂の神社"]},{"f":"黒糖を原料にした焼酎は、酒税法の特例により、奄美群島だけで造ることが認められている。","q":"黒糖焼酎を造ることが認められている地域はどこか。","a":"奄美群島だけ","w":["沖縄本島だけ","種子島と屋久島だけ","九州の全県で自由に"]},{"f":"泡盛は、ふつうの国産米ではなく、タイ米（インディカ種の長粒米）を原料にして造るのが伝統である。","q":"泡盛の伝統的な原料の米は何か。","a":"タイ米（長粒種）","w":["国産のうるち米","国産のもち米","中国産の玄米"]}],"people":[],"related":["日本酒","梅酒","黒麹菌","本格焼酎","古酒","琉球王国"]},{"id":"japanesewhisky","name":"ジャパニーズウイスキー","full":"ジャパニーズウイスキー","en":"Japanese Whisky","region":"日本","category":"酒の種類","when":"1923年に着工、1929年発売","where":"山崎（大阪）・余市（北海道）など","era":"近代","tagline":"竹鶴と鳥井が築き、世界の賞を集めるまでに育った国産ウイスキー","facts":[{"t":"始まり","n":"1923年に山崎蒸溜所の建設が始まり、1929年に国産第1号が売り出された。"},{"t":"製法","n":"スコッチを手本に、麦芽を糖化・発酵・蒸留して木樽で熟成させる。"},{"t":"風土","n":"日本の多湿で寒暖差のある気候では、樽の熟成が比較的早いと言われる。"},{"t":"定義","n":"2021年に業界団体の自主基準ができ、国内での製造や3年以上の木樽熟成などが条件となった。"}],"famous":[{"t":"山崎蒸溜所","n":"大阪府島本町にある日本初の本格的な蒸溜所。1923年に着工した。"},{"t":"余市蒸溜所","n":"北海道余市町の蒸溜所。竹鶴政孝が1934年に開いた。"},{"t":"白州蒸溜所","n":"山梨県北杜市にあり、南アルプスの麓で1973年に操業を始めた。"}],"anecdotes":["山崎の地は、茶人の千利休ゆかりの名水が湧くことで知られ、水の良さが立地の理由に挙げられる。","2000年代の初めに国際的な品評会で余市や山崎が高く評価され、日本産が世界で注目されるきっかけとなった。","長年、国内に統一した定義がなく、輸入した原酒を混ぜた製品もジャパニーズウイスキーと名乗ることができた。"],"trivia":[{"f":"2021年に業界の自主基準ができるまで、国には「ジャパニーズウイスキー」の定義がなく、輸入した原酒を混ぜた酒も名乗れた。","q":"2021年に業界団体の自主基準ができる前の、ジャパニーズウイスキーの表示はどうだったか。","a":"国の定義がなく輸入原酒入りでも名乗れた","w":["国産原料の使用が酒税法で義務づけられていた","蒸溜所の所在地が国の許可制で管理されていた","3年以上の熟成が法律で定められていた"]},{"f":"山崎蒸溜所の建設と初期の製造を指揮したのは、スコットランドで学んだ竹鶴政孝だった。","q":"山崎蒸溜所の初代所長を務めたのは誰か。","a":"竹鶴政孝","w":["鳥井信治郎","佐治敬三","岩井喜一郎"]}],"people":["竹鶴政孝","鳥井信治郎"],"related":["山崎蒸溜所","余市蒸溜所","ウイスキー","スコッチ","ニッカウヰスキー","サントリー","蒸留と熟成"]},{"id":"nadafushimi","name":"灘と伏見","full":"灘と伏見（二大酒どころ）","en":"Nada and Fushimi","region":"日本","category":"産地・地理","when":"江戸時代に大産地へ","where":"兵庫県（灘）・京都市（伏見）","era":"近世まで","tagline":"硬水の灘は辛口の「男酒」、軟水の伏見はやわらかな「女酒」","facts":[{"t":"灘五郷","n":"神戸から西宮にかけて、今津郷・西宮郷・魚崎郷・御影郷・西郷の5つの地区がある。"},{"t":"宮水","n":"西宮で湧く硬水。酵母の栄養になる成分が多く、鉄分が少ないため酒造りに向く。"},{"t":"伏見","n":"京都市南部の産地。水は軟水で、まろやかでやわらかな酒質になる。"},{"t":"輸送","n":"灘の酒は江戸へ樽廻船で運ばれ、「下り酒」として評判を得た。"}],"famous":[{"t":"灘","n":"日本最大級の酒どころで、辛口でキレのある酒質が特徴。"},{"t":"伏見","n":"豊臣秀吉の伏見城下で栄え、月桂冠など老舗の蔵が並ぶ。"},{"t":"下り酒","n":"上方から江戸へ運ばれた良質な酒の呼び名。"}],"anecdotes":["江戸後期、西宮の井戸水で造った酒の出来が際立って良かったことから、宮水が見いだされたと伝わる。","灘の酒を江戸へ運ぶ樽廻船では、航海中に波に揺られて酒の味がまろやかになったと言われる。","上方から江戸へ送る良質な酒が「下り酒」で、そうでない品を「くだらない」と呼んだという説がある。"],"trivia":[{"f":"灘の酒造りを支える名水「宮水」は、酵母の栄養になるリンやカリウムが多く、酒を劣化させる鉄分が少ない硬水だ。","q":"宮水が酒造りに向くとされる理由は何か。","a":"酵母の栄養になる成分が多く鉄分が少ない","w":["鉄分が豊富で、酒にコクのある濃い色がつく","塩分が多く含まれ、酒の味が引き締まる","糖分を含み、発酵の前から甘みがある"]},{"f":"硬水の灘の酒は辛口でがっしりした「男酒」、軟水の伏見の酒はやわらかな「女酒」と呼ばれてきた。","q":"灘の酒を「男酒」と呼ぶのに対し、「女酒」と呼ばれてきた産地はどこか。","a":"京都・伏見","w":["兵庫・西宮","新潟・越後","秋田・横手"]}],"people":[],"related":["日本酒","宮水","灘五郷","男酒と女酒","下り酒","樽廻船","杜氏と酒蔵"]},{"id":"umeshu","name":"梅酒","full":"梅酒","en":"Umeshu (plum liqueur)","region":"日本","category":"酒の種類","when":"江戸期に記録。昭和に家庭へ","where":"日本各地（和歌山が梅の大産地）","era":"近世まで","tagline":"青梅を酒と氷砂糖に漬け込み、甘酸っぱく仕上げる日本のリキュール","facts":[{"t":"製法","n":"青梅を氷砂糖とともに、ホワイトリカーなどの酒に数か月以上漬けて造る。"},{"t":"家庭の梅酒","n":"家庭では度数20度以上の酒に漬け、自分で飲む範囲に限って認められる。"},{"t":"産地","n":"梅の生産量は和歌山県が全国一。南高梅が代表的な品種。"},{"t":"分類","n":"市販の梅酒は、果実を酒に漬けたリキュール類に分類される。"}],"famous":[{"t":"南高梅","n":"和歌山県みなべ町周辺で育成された、大粒で果肉が厚い梅。"},{"t":"ホワイトリカー","n":"梅酒づくりによく使われる、無色でクセの少ない甲類焼酎。"}],"anecdotes":["梅は奈良時代以前に中国から伝わり、薬として重んじられたとされる。梅酒の記録は江戸時代の書物に見られる。","家庭での梅酒づくりは、酒税法の扱いが改まった1962年に認められるようになった。","青梅の未熟な実や種には有毒な成分が含まれ、生でそのまま食べないよう注意が呼びかけられている。"],"trivia":[{"f":"家庭で梅酒を漬けるとき、使う酒はアルコール度数20度以上のものと決まっており、できた梅酒は販売できない。","q":"家庭で梅酒を漬けるときに使う酒の、アルコール度数の条件は何か。","a":"20度以上","w":["10度以上","15度以上","25度以上"]},{"f":"梅酒づくりに氷砂糖を使うのは、ゆっくり溶けて、実のエキスを時間をかけて引き出せるからだ。","q":"梅酒づくりで氷砂糖が使われる主な理由は何か。","a":"ゆっくり溶けて実のエキスをじっくり引き出すため","w":["すぐ溶けて、漬けた直後から甘みが出るようにするため","透明で見栄えがよく、瓶の中で梅が映えるため","含まれる成分が雑菌を抑え、カビを防ぐため"]},{"f":"梅の収穫量は和歌山県が全国の約6割を占め、梅酒の主原料の南高梅もここで生まれた。","q":"梅の生産量が全国一で、全体の約6割を占める県はどこか。","a":"和歌山県","w":["群馬県","奈良県","福井県"]}],"people":[],"related":["日本酒","焼酎と泡盛","南高梅","ホワイトリカー","氷砂糖","和歌山県"]},{"id":"kanpai","name":"乾杯と酒器の作法","full":"乾杯と酒器の作法","en":"Toasts and sake etiquette","region":"日本","category":"文化・作法","when":"古代の神事から現代まで","where":"日本各地の宴席","era":"","tagline":"「乾杯」の由来から、徳利・盃・枡まで。酒席の作法と道具","facts":[{"t":"乾杯","n":"宴の初めに杯を掲げ、酒を飲み干す習慣。英語のトーストなどにあたる。"},{"t":"献杯","n":"法事など弔いの席では乾杯せず、杯を静かに掲げて「献杯」と言う。"},{"t":"酒器","n":"徳利やちろりで燗をつけ、盃や猪口で飲む。冷酒にはグラスも使われる。"},{"t":"枡と合","n":"枡は一合（約180ml）などを量る道具で、酒を入れて飲む器にもなる。"}],"famous":[{"t":"三三九度","n":"結婚式で新郎新婦が三つの盃を使い、三度ずつ酒を交わす儀式。"},{"t":"鏡開き","n":"祝いの席で樽酒の蓋を木槌で開く。「割る」を避けて「開く」と言う。"},{"t":"返杯","n":"注いでもらった相手に、お返しの酒を注ぐ作法。"}],"anecdotes":["グラスを合わせる乾杯の起源には、毒が入っていないことを示すため酒をはね合わせたという説がある。","英語の「トースト」は、酒に香りを付ける焼いたパンを入れた習慣に由来するとされる。","樽の蓋を「鏡」と呼び、割るのではなく「開く」と言うのは、縁起を担ぐ言い方とされる。"],"trivia":[{"f":"法事など弔いの席では、乾杯の代わりに「献杯」と言って、故人を偲びながら静かに杯を掲げる。","q":"法事など弔いの席で、乾杯の代わりに使う言葉は何か。","a":"献杯","w":["返杯","祝杯","満杯"]},{"f":"英語で乾杯を表す「トースト」は、香り付けに酒へ入れた焼きパンに由来するとされる。","q":"「トースト」の語源とされる習慣は何か。","a":"酒に浮かべた焼きパン","w":["杯に添えた焼きリンゴ","乾杯のとき叩いた木の板","宴の前に焚いた香木"]}],"people":[],"related":["日本酒","梅酒","献杯","三三九度","鏡開き","枡","トースト"]}],"glossary":[{"t":"オーヴィレール修道院","kind":"place","d":"シャンパーニュ地方にあるベネディクト会の修道院。ドン・ペリニヨンが酒庫係として長く務めた。","en":"Hautvillers Abbey"},{"t":"ベネディクト会","kind":"term","d":"6世紀に創設された修道会。中世から修道院でワインやビールを造り、酒造りの技術を伝えた。ドン・ペリニヨンもその一員。","en":"Benedictines"},{"t":"瓶内二次発酵","kind":"term","d":"瓶に酵母と糖を加えて密閉し、瓶の中でもう一度発酵させて泡を生む方法。シャンパーニュの製法の核。","en":"Traditional method"},{"t":"ピノ・ノワール","kind":"term","d":"黒ブドウの品種。ブルゴーニュの赤の主役で、シャンパーニュにも使われる。","en":"Pinot Noir"},{"t":"モエ・エ・シャンドン","kind":"term","d":"シャンパーニュの大手生産者。最高級銘柄にドン・ペリニヨンの名を冠している。","en":"Moet & Chandon"},{"t":"低温殺菌","kind":"term","d":"食品や酒を穏やかな温度で加熱し、微生物を減らす方法。パスツールがワインの変質を防ぐ研究で示した。","en":"Pasteurization"},{"t":"酵母","kind":"term","d":"糖を食べてアルコールと二酸化炭素を作る微生物。パスツールが発酵の主役だと示した。","en":"Yeast"},{"t":"発酵","kind":"term","d":"微生物の働きで糖がアルコールなどに変わること。パスツールは発酵が生きた微生物の働きだと示した。","en":"Fermentation"},{"t":"自然発生説の否定","kind":"event","d":"微生物は生物から生じると実験で示し、1860年代に自然発生説を退けた。パスツールの代表的な業績。","en":"Refutation of spontaneous generation"},{"t":"狂犬病ワクチン","kind":"work","d":"1885年にパスツールが、狂犬に咬まれた少年へ初めて人に使った予防接種。","en":"Rabies vaccine"},{"t":"ポーター","kind":"term","d":"18世紀のロンドンで広まった黒褐色のビール。ギネスはこれを主力とし、のちにスタウトが生まれた。","en":"Porter"},{"t":"スタウト","kind":"term","d":"ポーターから生まれた、焦がした麦芽を使う黒く濃いビール。ギネスが代表的な銘柄。","en":"Stout"},{"t":"セント・ジェイムズ・ゲート醸造所","kind":"place","d":"ダブリンにあるギネスの醸造所。アーサー・ギネスが1759年に借りて以来の本拠地。","en":"St. James's Gate Brewery"},{"t":"ギネス・ブック","kind":"work","d":"世界一の記録を集めた本。1955年に初版が出て、ギネス社の経営者の発案とされる。","en":"Guinness Book of Records"},{"t":"エール","kind":"term","d":"上面発酵の酵母で比較的高い温度で発酵させるビール。英国やベルギーに伝統がある。","en":"Ale"},{"t":"スコッチ","kind":"term","d":"スコットランドで造られるウイスキー。3年以上の樽熟成などの決まりがある。竹鶴政孝が学んだ本場。","en":"Scotch whisky"},{"t":"カベルネ・ソーヴィニヨン","kind":"term","d":"黒ブドウの品種。ボルドーの赤の中心で、渋みと骨格のあるワインになる。","en":"Cabernet Sauvignon"},{"t":"シャルドネ","kind":"term","d":"白ブドウの品種。ブルゴーニュの白とシャンパーニュの主要品種で、世界中で栽培される。","en":"Chardonnay"},{"t":"クヴェヴリ","kind":"term","d":"ジョージアで地中に埋めて使う卵形の大きな壺。ワインの醸造や熟成に用いる。","en":"Qvevri"},{"t":"バーボン","kind":"term","d":"米国のウイスキー。トウモロコシを51%以上使い、内側を焦がした新品のオーク樽で熟成する。","en":"Bourbon"},{"t":"シングルモルト","kind":"term","d":"一つの蒸留所の麦芽だけで造ったウイスキー。個性が強く、山崎や余市の名でも知られる。","en":"Single malt"},{"t":"ブレンデッド","kind":"term","d":"モルトとグレーンの原酒を混ぜたウイスキー。味が安定し、流通の中心になっている。","en":"Blended whisky"},{"t":"ポットスチル","kind":"term","d":"銅製の単式蒸留器。原料の個性が残りやすく、モルトウイスキーやコニャックの蒸留に使う。","en":"Pot still"},{"t":"麦芽","kind":"term","d":"大麦を発芽させて乾かしたもの。酵素でデンプンが糖になり、ビールやウイスキーの原料になる。","en":"Malt"},{"t":"ラガー","kind":"term","d":"下面発酵の酵母で低温で発酵・熟成させるビール。現在の世界の主流。","en":"Lager"},{"t":"ピルスナー","kind":"term","d":"1842年にピルゼンで生まれた淡い金色のラガー。ホップの苦みが特徴で世界に広まった。","en":"Pilsner"},{"t":"ホップ","kind":"term","d":"ビールに苦みと香りを与え、保存性も高める植物。球果状の花を使う。","en":"Hops"},{"t":"純粋令","kind":"event","d":"1516年にバイエルンで出された、ビールの原料を限る法令。ビール純粋令とも呼ばれる。","en":"Reinheitsgebot"},{"t":"アルマニャック","kind":"term","d":"フランス南西部ガスコーニュ地方のブランデー。コニャックより素朴とされ、蒸留は基本1回。","en":"Armagnac"},{"t":"カルヴァドス","kind":"term","d":"フランス北西部ノルマンディー地方で造る、リンゴの酒を蒸留したブランデー。","en":"Calvados"},{"t":"ユニ・ブラン","kind":"term","d":"白ブドウの品種。酸が強くアルコール度が低く、コニャックの原料の中心に使われる。","en":"Ugni Blanc"},{"t":"ルミュアージュ","kind":"term","d":"シャンパーニュで、瓶を少しずつ回し傾けて澱を瓶口に集める作業。動瓶とも言う。","en":"Remuage"},{"t":"サバラージュ","kind":"term","d":"サーベルで瓶の首を切り飛ばし、シャンパーニュを開ける作法。ナポレオン軍に由来すると伝わる。","en":"Sabrage"},{"t":"メルロー","kind":"term","d":"黒ブドウの品種。ボルドー右岸で主役となり、やわらかく丸みのある味わいになる。","en":"Merlot"},{"t":"クリマ","kind":"term","d":"ブルゴーニュで、味の違いにより区分されてきた個々のぶどう畑。2015年に世界遺産に登録された。","en":"Climat"},{"t":"ロマネ・コンティ","kind":"place","d":"ブルゴーニュのヴォーヌ・ロマネ村にある特級畑と、そのワイン。世界で最も高価な部類に入る。","en":"Romanee-Conti"},{"t":"1855年の格付け","kind":"event","d":"パリ万博に合わせて行われたボルドーの格付け。メドックの赤などを五つの等級に分けた。","en":"1855 Classification"},{"t":"AOC","kind":"term","d":"フランスの原産地呼称統制。産地・品種・製法などを法で定め、1930年代に整った。","en":"Appellation d'Origine Controlee"},{"t":"パリスの審判","kind":"event","d":"1976年にパリで行われた目隠し試飲会。カリフォルニア産が首位に立ち、世界に衝撃を与えた。","en":"Judgment of Paris"},{"t":"連続式蒸留機","kind":"term","d":"連続して蒸留でき、高純度のアルコールが得られる装置。19世紀前半にコフィーが特許を得た。","en":"Continuous still"},{"t":"エンジェルズ・シェア","kind":"term","d":"熟成中に樽から蒸発して失われる分。「天使の分け前」と呼ばれ、熟成の宿命とされる。","en":"Angel's share"},{"t":"オーク樽","kind":"term","d":"ナラ類の木で作る樽。ウイスキーやワインの熟成に使われ、色と香りを与える。","en":"Oak barrel"},{"t":"ジュニパーベリー","kind":"term","d":"ネズ（杜松）の実。ジンの香り付けに欠かせず、松のような爽やかな香りを与える。","en":"Juniper berry"},{"t":"アガベ","kind":"term","d":"リュウゼツラン属の植物。ブルーアガベはテキーラの原料で、育つのに数年かかる。","en":"Agave"},{"t":"糖蜜","kind":"term","d":"砂糖を搾り取った後に残る黒い濃厚な液。ラムの主な原料になる。","en":"Molasses"},{"t":"グラスゴー大学","kind":"place","d":"スコットランドの大学。竹鶴政孝が1918年に留学し、化学などを学んだ。","en":"University of Glasgow"},{"t":"竹鶴ノート","kind":"work","d":"竹鶴政孝がスコットランドの蒸溜所での実習を詳しく書き留めたノート。国産ウイスキー造りの手引きになった。","en":"Taketsuru Notebook"},{"t":"余市蒸溜所","kind":"place","d":"北海道余市町にあるニッカの蒸溜所。竹鶴政孝が1934年に創業した。","en":"Yoichi Distillery"},{"t":"ニッカウヰスキー","kind":"term","d":"竹鶴政孝が創業した会社。大日本果汁として始まり、のちに現在の社名になった。","en":"Nikka Whisky"},{"t":"リタ","kind":"person","d":"竹鶴政孝の妻。スコットランド出身で、1920年に結婚して来日し、夫を支えた。","en":"Rita Taketsuru"},{"t":"山崎蒸溜所","kind":"place","d":"大阪府島本町にある日本初の本格的なウイスキー蒸溜所。1923年に建設が始まった。","en":"Yamazaki Distillery"},{"t":"寿屋","kind":"term","d":"鳥井信治郎が率いた会社。のちのサントリー。赤玉ポートワインや国産ウイスキーを手がけた。","en":"Kotobukiya"},{"t":"サントリー","kind":"term","d":"鳥井信治郎が起こした酒類会社。社名は赤玉の太陽（サン）と鳥井にちなむとされる。","en":"Suntory"},{"t":"赤玉ポートワイン","kind":"work","d":"1907年に売り出された甘味のワイン。鳥井信治郎の最初の大きな成功商品。","en":"Akadama Port Wine"},{"t":"白札","kind":"work","d":"1929年に発売された国産初の本格ウイスキー「サントリー白札」。当時は伸び悩んだとされる。","en":"Shirofuda"},{"t":"角瓶","kind":"work","d":"1937年に売り出されたサントリーのウイスキー。亀甲模様の瓶で知られ、人気が定着した。","en":"Kakubin"},{"t":"火入れ","kind":"term","d":"日本酒を60〜65℃ほどに加熱して殺菌し、酵素の働きを止める工程。16世紀の記録にも見える。","en":"Hi-ire (pasteurization)"},{"t":"山田錦","kind":"term","d":"兵庫県で育成された酒造好適米。大粒で心白が大きく、吟醸酒向きの「酒米の王」。","en":"Yamada Nishiki"},{"t":"醸造アルコール","kind":"term","d":"サトウキビの糖蜜などから造る純度の高いアルコール。本醸造などで白米重量の10%以下を加える。","en":"Brewer's alcohol"},{"t":"特定名称酒","kind":"term","d":"吟醸・純米・本醸造などの名で品質を表示する清酒。純米大吟醸など8種類がある。","en":"Tokutei meisho-shu"},{"t":"獺祭","kind":"work","d":"山口県の旭酒造が造る純米大吟醸の銘柄。「磨き二割三分」は精米歩合23%の最上位品。","en":"Dassai"},{"t":"五百万石","kind":"term","d":"新潟県を代表する酒米。淡麗な酒に向くとされ、全国で広く栽培される。","en":"Gohyakumangoku"},{"t":"雄町","kind":"term","d":"岡山県で古くから栽培されてきた酒米。ふくらみのある味わいの酒になるとされる。","en":"Omachi"},{"t":"心白","kind":"term","d":"酒米の粒の中心にある白く不透明な部分。麹菌が入りこみやすく、麹造りに向く。","en":"Shinpaku"},{"t":"寒造り","kind":"term","d":"冬の寒い時期に酒を仕込む方法。低温で雑菌を抑えてゆっくり発酵させ、江戸時代に広まった。","en":"Kanzukuri"},{"t":"杉玉","kind":"term","d":"杉の葉を丸く束ねた飾り。酒蔵の軒先に吊るし、新酒ができたことを知らせる。酒林とも言う。","en":"Sugidama"},{"t":"三大杜氏","kind":"term","d":"南部杜氏（岩手）・越後杜氏（新潟）・丹波杜氏（兵庫）を指すことが多い。","en":"Three great toji guilds"},{"t":"松尾大社","kind":"place","d":"京都市にある神社。酒造の神として知られ、全国の酒造関係者の信仰を集める。","en":"Matsunoo Taisha"},{"t":"黄麹菌","kind":"term","d":"日本酒・味噌・醤油に使う麹菌。学名はアスペルギルス・オリゼー。国菌とされる。","en":"Aspergillus oryzae"},{"t":"酒母","kind":"term","d":"酵母を純粋に大量に育てた、仕込みの元になるもの。「もと」とも言い、生もと・山廃・速醸などがある。","en":"Shubo"},{"t":"醪","kind":"term","d":"仕込み後、発酵が進む米・麹・水・酵母の混合物。搾ると酒と酒粕に分かれる。","en":"Moromi"},{"t":"三段仕込み","kind":"term","d":"酒母に、添・仲・留の3回に分けて米・麹・水を加える仕込み方。酵母の量を整える。","en":"Three-stage mashing"},{"t":"口噛み酒","kind":"term","d":"米を口で噛み、唾液の酵素で糖にして発酵させる古い酒。神事に関わったと伝わる。","en":"Kuchikamizake"},{"t":"国菌","kind":"term","d":"2006年に日本醸造学会が麹菌（アスペルギルス・オリゼー）に与えた認定の呼び名。","en":"National microbe"},{"t":"黒麹菌","kind":"term","d":"泡盛の麹に使う菌。クエン酸を作り、暑い沖縄でも雑菌を抑えて仕込める。","en":"Black koji mold"},{"t":"本格焼酎","kind":"term","d":"単式蒸留で造る乙類焼酎の呼び名。原料の風味がよく残るのが特徴とされる。","en":"Honkaku shochu"},{"t":"古酒","kind":"term","d":"泡盛を3年以上寝かせたもの。「クース」とも呼ばれ、まろやかな味と香りを楽しむ。","en":"Kusu (aged awamori)"},{"t":"琉球王国","kind":"event","d":"15世紀から19世紀にかけ沖縄に栄えた王国。東南アジアと交易し、泡盛の蒸留技術が伝わった。","en":"Ryukyu Kingdom"},{"t":"宮水","kind":"term","d":"兵庫県西宮で湧く硬水。リンやカリウムが多く鉄分が少なく、灘の酒造りを支えた。","en":"Miyamizu"},{"t":"灘五郷","kind":"place","d":"兵庫県の西宮から神戸にかけて並ぶ、今津郷・西宮郷・魚崎郷・御影郷・西郷の5地区。","en":"Nada Gogo"},{"t":"男酒と女酒","kind":"term","d":"硬水で造る灘の辛口の酒を男酒、軟水で造る伏見のやわらかい酒を女酒と呼んだ。","en":"Otoko-zake and onna-zake"},{"t":"下り酒","kind":"term","d":"江戸時代、上方から江戸へ運ばれた上質な酒。灘の酒が代表で、評判が高かった。","en":"Kudari-zake"},{"t":"樽廻船","kind":"term","d":"江戸時代に上方から江戸へ酒の樽を運んだ廻船。灘の酒を大量に、速く運んだ。","en":"Taru-kaisen"},{"t":"南高梅","kind":"term","d":"和歌山県みなべ町周辺で育成された、大粒で果肉の厚い梅。梅干しや梅酒の代表品種。","en":"Nanko plum"},{"t":"ホワイトリカー","kind":"term","d":"無色透明でクセのない甲類焼酎。梅酒など果実酒づくりによく使われる。","en":"White liquor"},{"t":"氷砂糖","kind":"term","d":"大きな結晶の砂糖。ゆっくり溶けるため、梅酒で実のエキスをじっくり引き出す。","en":"Rock sugar"},{"t":"和歌山県","kind":"place","d":"紀伊半島の県。梅の収穫量が全国一で、梅干しや梅酒の産地として知られる。","en":"Wakayama Prefecture"},{"t":"献杯","kind":"term","d":"法事など弔いの席で、故人を偲び静かに杯を掲げること。乾杯と区別される。","en":"Kenpai"},{"t":"三三九度","kind":"term","d":"結婚式で大中小の三つの盃を使い、三度ずつ酒を交わす儀式。新郎新婦の契りを表す。","en":"San-san-kudo"},{"t":"鏡開き","kind":"term","d":"祝いの席で樽酒の蓋を木槌で開く行事。「割る」を避けて「開く」と言う。","en":"Kagami-biraki"},{"t":"枡","kind":"term","d":"木で作る四角い器。もともとは米や酒を量る道具で、一合は約180mlにあたる。","en":"Masu"},{"t":"トースト","kind":"term","d":"英語で乾杯を指す語。酒に焼いたパンを入れた習慣に由来するとされる。","en":"Toast"}]}},"sample":[{"d":"音楽","q":"ロマン派の作曲家で、生涯の大半をピアノ曲に捧げて「ピアノの詩人」と呼ばれた。『ノクターン』『ワルツ』『ポロネーズ』を残し、パリで没したが、遺言で心臓は故郷ワルシャワに運ばれたとされる。誰か。","o":["ロベルト・シューマン","フランツ・リスト","フレデリック・ショパン","フェリックス・メンデルスゾーン"],"a":2,"e":"ショパンはポーランド出身のロマン派。パリを拠点に活動し、心臓はワルシャワの聖十字架教会に安置されたと伝わる。リストは超絶技巧で知られるハンガリー出身、シューマンとメンデルスゾーンはドイツの作曲家。","r":"海外"},{"d":"音楽","q":"耳の病に苦しみ、1802年に弟たちへ宛てて「ハイリゲンシュタットの遺書」を書いたものの、その後も創作を続け、晩年に交響曲第9番『合唱付き』を完成させた作曲家は誰か。","o":["ルートヴィヒ・ファン・ベートーヴェン","ヨーゼフ・ハイドン","ヴォルフガング・アマデウス・モーツァルト","フランツ・シューベルト"],"a":0,"e":"ベートーヴェンはウィーン古典派からロマン派への橋渡しをした。聴覚の悪化に絶望して遺書を書いたが、芸術のために生き抜くと決意した。第9は1824年初演で、終楽章にシラーの詩『歓喜に寄す』を用いる。","r":"海外"},{"d":"音楽","q":"モーツァルトの『レクイエム』について正しいのはどれか。","o":["完成した楽譜を自ら指揮して、ウィーンの宮廷劇場で初演した直後に亡くなった","モーツァルトの死で未完となり、弟子のジュスマイヤーらが補筆して完成させた","ハイドンが書きかけた曲を、モーツァルトが補筆して完成させた","皇帝ヨーゼフ2世の依頼で作曲し、宮廷礼拝堂で初演された"],"a":1,"e":"1791年にモーツァルトが亡くなったとき、『レクイエム』は途中までだった。匿名の依頼者（ヴァルゼック伯爵）の注文で書かれ、弟子のジュスマイヤーらが完成させた。ヨーゼフ2世は1790年に没している。","r":"海外"},{"d":"音楽","q":"『平均律クラヴィーア曲集』を作曲し、のちに「音楽の父」と称されたバロック期の作曲家は誰か。","o":["ゲオルク・フリードリヒ・ヘンデル","アントニオ・ヴィヴァルディ","ゲオルク・フィリップ・テレマン","ヨハン・ゼバスティアン・バッハ"],"a":3,"e":"バッハは1685年生まれのドイツの作曲家。同じ年に生まれたヘンデルは『メサイア』、ヴィヴァルディは『四季』で知られる。『平均律』は全24の調で前奏曲とフーガを並べる。","r":"海外"},{"d":"文学","q":"平安中期、一条天皇の中宮彰子に仕えた女房が、光源氏の生涯と子の世代の物語を描いた長編物語で、世界最古級の長編小説とも評される作品は何か。","o":["『枕草子』","『源氏物語』","『和泉式部日記』","『竹取物語』"],"a":1,"e":"『源氏物語』の作者は紫式部。『枕草子』は中宮定子に仕えた清少納言の随筆、『更級日記』は菅原孝標女の日記、『竹取物語』は作者不詳の物語で、いずれも別の作品。","r":"海外"},{"d":"文学","q":"1849年に政治サークルへの参加で逮捕され、銃殺刑の直前に皇帝の特赦で減刑されて流刑となった。のちに『罪と罰』『カラマーゾフの兄弟』を著したロシアの作家は誰か。","o":["レフ・トルストイ","アントン・チェーホフ","イワン・セルゲーエヴィチ・ツルゲーネフ","フョードル・ドストエフスキー"],"a":3,"e":"ペトラシェフスキー事件で死刑を宣告され、刑場で減刑を告げられたのがドストエフスキー。『罪と罰』は1866年。トルストイは『戦争と平和』『アンナ・カレーニナ』、チェーホフは戯曲『桜の園』で知られる。","r":"海外"},{"d":"文学","q":"シェイクスピアの四大悲劇に含まれない作品はどれか。","o":["『ロミオとジュリエット』","『ハムレット（デンマーク王子の復讐劇）』","『リア王』","『マクベス』"],"a":0,"e":"四大悲劇は『ハムレット』『オセロー』『リア王』『マクベス』。『ロミオとジュリエット』も悲劇だが初期の作品で、四大悲劇には数えない。","r":"海外"},{"d":"地政学","q":"海洋国家が制海権を握ることが国の盛衰を左右すると論じ、『海上権力史論』（1890）を著したアメリカ海軍の軍人・歴史家は誰か。","o":["ハルフォード・ジョン・マッキンダー","アルフレッド・セイヤー・マハン","ニコラス・スパイクマン","カール・ハウスホーファー"],"a":1,"e":"マハンはシーパワー論の祖。マッキンダーは英国の地理学者でハートランド説、スパイクマンはアメリカの学者でリムランド説、ハウスホーファーはドイツの地政学者。","r":"海外"},{"d":"地政学","q":"マッキンダーが1919年の著作で、世界の中枢（ハートランド）とみなした地域はどこか。","o":["北大西洋に面した西ヨーロッパの沿岸部","インド洋沿岸の島嶼部","ユーラシア大陸の内陸部","北アメリカ大陸の中西部"],"a":2,"e":"「東欧を支配する者はハートランドを制し、ハートランドを支配する者は世界島を制し、世界島を支配する者は世界を制する」と述べた。ランドパワーの拠点をユーラシア内陸に置く見方である。","r":"海外"},{"d":"地理","q":"ケッペンの気候区分が、気候を分ける境界を決めるときに最も重視した自然の指標は何か。","o":["土壌の種類（肥沃かどうか）","標高","海流の向き","植生（植物の分布）"],"a":3,"e":"ドイツの気候学者ケッペンは、気温と降水量のデータで植生の分布に対応する境界を引き、熱帯・乾燥帯・温帯・冷帯・寒帯に分けた。","r":"海外"},{"d":"地理","q":"日本列島付近で接している4つのプレートの組み合わせとして正しいのはどれか。","o":["北アメリカ・南アメリカ・太平洋・フィリピン海","北アメリカ・ユーラシア・太平洋・ナスカ","ユーラシア・太平洋・インド・オーストラリア","北アメリカ・ユーラシア・太平洋・フィリピン海"],"a":3,"e":"日本は4つのプレートが集まる世界でも珍しい地域で、地震や火山活動が多い。ナスカプレートは南アメリカ大陸の西側にある。","r":"日本"},{"d":"文法学","q":"中世ヨーロッパの大学教育の基礎とされた自由七科のうち、「三学」に含まれる組み合わせはどれか。","o":["文法学・論理学・天文学","文法学・修辞学・論理学","修辞学・幾何学・天文学","論理学・算術・天文学"],"a":1,"e":"三学は言葉を扱う文法学・修辞学・論理学。四科は数に関わる算術・幾何・音楽・天文で、あわせて自由七科になる。","r":"海外"},{"d":"文法学","q":"「故郷が思い出される。」の「れる」と同じ意味にあたるものはどれか。","o":["受身（他から動作を受ける）","可能（できる）","自発（自然とそうなる）","尊敬（相手を高める）"],"a":2,"e":"「思い出される」は思い出そうとしなくても自然と浮かぶ意味で、自発。自発は「案じられる」「偲ばれる」のように心の動きを表す動詞につくことが多い。","r":"日本"},{"d":"修辞学","q":"アリストテレスが『弁論術』で挙げた説得の三要素のうち、「話し手の人柄や信頼性」にあたるものはどれか。","o":["パトス","ロゴス","カイロス","エートス"],"a":3,"e":"三要素は、話し手の信頼性のエートス、聞き手の感情に訴えるパトス、論理のロゴス。カイロスは「好機・時宜」を表す別の概念で、三要素には入らない。","r":"海外"},{"d":"修辞学","q":"「君は僕の太陽だ」のように、「ようだ」「ごとし」を使わずに他のものにたとえる修辞技法はどれか。","o":["隠喩（暗喩）","直喩（「ようだ」を用いる）","換喩","擬人法"],"a":0,"e":"「ようだ」などを使うのが直喩、使わないのが隠喩。換喩は「漱石を読む」のように関係の深いもので言い換え、擬人法は人でないものを人のように表す。","r":"海外"},{"d":"論理学","q":"「雨が降れば道が濡れる。道が濡れている。ゆえに雨が降った」という推論の誤りを何と呼ぶか。","o":["前件否定の誤謬","後件肯定の誤謬","循環論法","論点先取"],"a":1,"e":"道が濡れる原因は散水などほかにもあり、結論は必ずしも導けない。「AならばB」からBを確かめてAを結ぶ形が後件肯定。","r":"海外"},{"d":"論理学","q":"「AならばB」が真のとき、必ず真になる命題はどれか。","o":["「BならばA」","「AでないならばBでない」","「BでないならばAでない」","「AかつBでない」"],"a":2,"e":"元の命題の対偶は、必ず真偽が一致する。「BならばA」は逆、「AでないならばBでない」は裏で、真偽は一致しない。","r":"海外"},{"d":"天文学","q":"1610年に自作の望遠鏡で木星を観測し、のちに「ガリレオ衛星」と呼ばれる4つの衛星を見つけて、地動説を支持する証拠の一つとしたのは誰か。","o":["ヨハネス・ケプラー","ティコ・ブラーエ","ニコラウス・コペルニクス","ガリレオ・ガリレイ"],"a":3,"e":"ガリレオは『星界の報告』（1610）で木星の衛星や月の山を報告した。1633年の宗教裁判で地動説を撤回させられ、「それでも地球は動く」は後世の伝説とされる。","r":"海外"},{"d":"天文学","q":"ケプラーの第3法則が述べる関係はどれか。","o":["惑星の公転周期の2乗は、軌道の長半径の3乗に比例する","惑星と太陽を結ぶ線分が、同じ時間に描く面積は等しい（面積速度が一定）","惑星は太陽を1つの焦点とする楕円軌道を描く","惑星の公転周期は、太陽からの平均距離に比例する"],"a":0,"e":"第3法則は調和の法則。面積速度が一定なのは第2法則、楕円軌道は第1法則。周期は距離に比例せず、距離の1.5乗に比例する。","r":"海外"},{"d":"人文学","q":"ソクラテスが「無知の知」にたどり着く契機になったとされる出来事はどれか。","o":["ペルシア戦争に従軍して捕虜になったこと","デルフォイの神託で「ソクラテスより賢い者はいない」と告げられたこと","弟子プラトンが開いた学園アカデメイアの初代学頭を引き受けるよう求められたこと","アテナイの民会で追放の判決を受けたこと"],"a":1,"e":"『ソクラテスの弁明』によれば、神託の真意を確かめるため賢者とされる人々を訪ねて対話し、彼らも自分も実は知らないが、自分はそれを自覚している点で少し賢いと考えた。前399年に毒杯を仰いで没した。","r":"海外"},{"d":"人文学","q":"カントが『純粋理性批判』で、認識は対象に従うのではなく対象が認識に従うと考え直したことを、何にたとえたか。","o":["ガリレオ的な実験による検証","ニュートン的総合","コペルニクス的転回","ダーウィン的進化"],"a":2,"e":"地球が太陽の周りを回るという見方の転換になぞらえたもの。認識の側にある枠組みが、経験される対象のあり方を形づくると考えた。","r":"海外"},{"d":"社会科学","q":"フランスの社会学者デュルケームが『自殺論』（1897）で示した考え方として最も適切なのはどれか。","o":["自殺は精神疾患だけで説明でき、国や時代による自殺率の違いは統計の誤差にすぎず、宗教や家族構成も影響しない","自殺率は景気の動向だけで決まり、宗教や家族とは無関係である","自殺は遺伝で決まるため、国や地域による差はほとんどない","自殺率は個人の心理だけでなく、社会の統合や規制の度合いという社会的事実で説明できる"],"a":3,"e":"各国の統計を比べ、宗教や家族構成などで自殺率が違うことから、個人の外にある社会的事実が行動を左右すると論じた。社会学を実証的な学問にした例とされる。","r":"海外"},{"d":"社会科学","q":"アダム・スミスが『国富論』（1776）で、各人が自分の利益を追うことが結果として社会全体の利益につながる働きを、何にたとえたか。","o":["見えざる手","夜警国家（国家は治安と防衛に徹すべきとする考え）","比較優位","有効需要"],"a":0,"e":"市場では見えざる手に導かれて資源が配分されると述べた。夜警国家はラッサール、比較優位はリカード、有効需要はケインズの用語。","r":"海外"},{"d":"自然科学","q":"1831年から約5年間、ビーグル号に乗って各地の生物を観察し、のちに『種の起源』（1859）で自然選択による進化を論じたのは誰か。","o":["アルフレッド・ラッセル・ウォレス","グレゴール・メンデル","チャールズ・ダーウィン","ジャン＝バティスト・ラマルク"],"a":2,"e":"ウォレスも同じ時期に自然選択の考えに至り、共同発表につながったが、ビーグル号には乗っていない。メンデルは遺伝の法則、ラマルクは用不用説で知られる。","r":"海外"},{"d":"自然科学","q":"1869年に元素を原子量の順に並べると性質が周期的に現れることを示し、未発見の元素の存在と性質を予言したロシアの化学者は誰か。","o":["アントワーヌ・ラボアジエ","ドミトリ・メンデレーエフ","ジョン・ドルトン","マリ・キュリー"],"a":1,"e":"のちにガリウム（1875）、スカンジウム（1879）、ゲルマニウム（1886）が見つかり、予言が裏づけられて周期表の評価が高まった。","r":"海外"},{"d":"心理学","q":"1960年代初めにイェール大学でミルグラムが行った実験で、多くの参加者が実験者の指示に従って他者に強い電気ショックを与え続けたことから、示されたとされる傾向はどれか。","o":["傍観者効果","多数派への同調","確証バイアス","権威への服従"],"a":3,"e":"最も基本的な条件で、参加者の約3分の2が最大の450ボルトまで続けた。ただし実際には電気は流れず、被害者役は演技だった。同調はアッシュの実験、傍観者効果はラタネとダーリーの研究。","r":"海外"},{"d":"心理学","q":"ローゼンタールらが1960年代に小学校で行った実験で示された、教師の期待が児童の成績を実際に押し上げる現象は何と呼ばれるか。","o":["ハロー効果（後光効果）","ピグマリオン効果","ゴーレム効果","プラセボ効果"],"a":1,"e":"ギリシア神話の王ピグマリオンにちなむ名。期待が悪い方向に働いて成績が下がる現象はゴーレム効果、一部の特徴で全体を評価するのがハロー効果。","r":"海外"},{"d":"芸術","q":"ポスト印象派の画家で、『ひまわり』『星月夜』を描き、南仏アルルでの共同生活の末に自分の耳を切り落とした逸話がある。生前に売れた作品は少なかったとされる画家は誰か。","o":["フィンセント・ファン・ゴッホ","ポール・セザンヌ","クロード・モネ","ピエール＝オーギュスト・ルノワール"],"a":0,"e":"1888年、アルルでゴーギャンと暮らしたが口論の末に耳を切る事件を起こした。セザンヌはポスト印象派でも別の画家、モネとルノワールは印象派。","r":"海外"},{"d":"芸術","q":"ルネサンス盛期の芸術家・科学者で、『モナ・リザ』とミラノの修道院の食堂の壁画『最後の晩餐』で知られ、人体解剖や飛行機械の手稿も多く残したのは誰か。","o":["ミケランジェロ・ブオナローティ","ラファエロ・サンティ","サンドロ・ボッティチェッリ","レオナルド・ダ・ヴィンチ"],"a":3,"e":"ミケランジェロはシスティーナ礼拝堂の天井画、ラファエロは『アテナイの学堂』、ボッティチェッリは『ヴィーナスの誕生』で知られる。","r":"海外"},{"d":"芸術","q":"19世紀後半のヨーロッパで、浮世絵などの日本美術が画家たちに影響を与えた流行や潮流を何と呼ぶか。","o":["オリエンタリズム","ダダイズム","ジャポニスム","ロマン主義"],"a":2,"e":"ゴッホやモネ、ドビュッシーらが浮世絵などに刺激を受けた。ドビュッシーの『海』の初版楽譜の表紙には北斎の波が使われたと伝わる。","r":"海外"}]};
</script>

function addTie(a,b,why){ (ties[a]=ties[a]||{})[b]=ties[a][b]||why; (ties[b]=ties[b]||{})[a]=ties[b][a]||why; }
function loadDomain(id){
  S.domain = id; DM = DOMS[id]; M = (D.data||{})[id] || {people:[],items:[],glossary:[]};
  ALLP = (M.people||[]).map(function(p){ p.region = p.region||'海外'; return p; });
  ALLI = (M.items||[]).map(function(x){ x.region = x.region||'海外'; x.category = x.category||x.family||''; x.people = x.people||x.composers||[]; return x; });
  byName = {}; byId = {}; gloss = {}; inv = {}; iById = {}; iByName = {}; pInst = {}; iComp = {}; ties = {};
  ALLP.forEach(function(p){ byName[p.name]=p; byId[p.id]=p; });
  ALLI.forEach(function(x){ iById[x.id]=x; iByName[x.name]=x; });
  (M.glossary||[]).forEach(function(g){ gloss[g.t]=g; });
  ALLP.forEach(function(p){ (p.related||[]).forEach(function(w){ (inv[w]=inv[w]||[]).push(p.id); }); });
  ALLI.forEach(function(x){ (x.related||[]).forEach(function(w){ (inv[w]=inv[w]||[]).push(x.id); }); });
  ALLI.forEach(function(x){ (x.people||[]).forEach(function(n){ var p = byName[n]; if(!p) return; (pInst[p.id]=pInst[p.id]||[]).push(x.id); (iComp[x.id]=iComp[x.id]||[]).push(p.id); }); });
  ALLP.forEach(function(p){
    var text = (p.tagline||'')+' '+(p.anecdotes||[]).join(' ')+' '+(p.works||[]).map(function(w){return w.n||'';}).join(' ');
    ALLP.forEach(function(q){
      if(q.id===p.id) return;
      var nm = [q.name].concat(q.full?[q.full]:[]);
      if(nm.some(function(n){return n.length>=2 && text.indexOf(n)!==-1;})) addTie(p.id,q.id,'逸話などに登場');
      else if(q.born===p.born) addTie(p.id,q.id,'同じ'+yr(p.born)+'年生まれ');
    });
  });

}
function setRegion(r){

  var more = []; people.concat(INST).forEach(function(e){ if(e.era && ERAIDS.indexOf(e.era)<0 && more.indexOf(e.era)<0) more.push(e.era); });
  ERAIDS = ERAIDS.concat(more);
  BANDS = ((((D.bands||{})[S.domain])||{})[r]) || er;

  if(S.view==='inst' && !INST.length && people.length) S.view = 'people';
}

var STEP = {C:0,D:1,E:2,F:3,G:4,A:5,B:6};

function staffSvg(m){
  var n = m.notes.length, W = 28 + n*38, H = 96, gap = 8, bottom = 64;
  var s = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(m.t)+'の楽譜">';
  for(var i=0;i<5;i++) s += ln(8,bottom-i*gap,W-6,bottom-i*gap,0.9,'var(--muted)');
  m.notes.forEach(function(nt,k){
    var L = nt.p.charAt(0), oc = +nt.p.charAt(nt.p.length-1), acc = nt.p.length>2 ? nt.p.charAt(1) : '';
    var step = (oc-4)*7 + STEP[L] - STEP.E, y = bottom - step*gap/2, x = 26 + k*38;
    if(step<=-2) for(var q=-2;q>=step;q-=2) s += ln(x-9,bottom-q*gap/2,x+9,bottom-q*gap/2,0.9,'var(--muted)');
    if(step>=10) for(q=10;q<=step;q+=2) s += ln(x-9,bottom-q*gap/2,x+9,bottom-q*gap/2,0.9,'var(--muted)');
    var hollow = nt.d==='h';
    s += '<ellipse cx="'+x+'" cy="'+y+'" rx="5.4" ry="3.9" transform="rotate(-18 '+x+' '+y+')" fill="'+(hollow?'none':'var(--ink)')+'" stroke="var(--ink)" stroke-width="1.3"/>';
    var up = step<4;
    s += ln(up?x+5:x-5, y, up?x+5:x-5, up?y-24:y+24, 1.2, 'var(--ink)');
    if(nt.d==='e') s += pa('M'+(up?x+5:x-5)+' '+(up?y-24:y+24)+' q8 6 4 14','none','var(--ink)',1.2);
    if(acc) s += '<text x="'+(x-15)+'" y="'+(y+4)+'" font-size="12" fill="var(--ink)">'+(acc==='b'?'♭':acc==='#'?'♯':'♮')+'</text>';
    s += '<text x="'+x+'" y="'+(H-4)+'" font-size="11" text-anchor="middle" fill="var(--muted)">'+KANA[L]+(acc==='b'?'♭':acc==='#'?'♯':acc==='n'?'':'')+'</text>';
  });
  return s+'</svg>';
}

/* ---------- 画面の骨組み ---------- */

  h += '<div class="tabs"><button class="tab'+(S.tab==='explore'?' on':'')+'" data-t="explore">年表と一覧</button><button class="tab'+(S.tab==='quiz'?' on':'')+'" data-t="quiz">クイズ</button></div>';
  h += '<div id="main"></div>';
  if(DM.note) h += '<p class="note">'+esc(DM.note)+'</p>';
  h += '<p class="src">※ 試作版。人物・作品・逸話・うんちくは概説書に広く載っている内容にとどめていますが、出典の照合はこれからです。真偽が定まらない逸話は「伝わる」と書いています。人物の絵は、髪型・ひげ・めがね・時代の装いなど広く知られた特徴をもとにした似顔絵風のイメージで、実物の肖像ではありません。</p>';

  el('app').querySelectorAll('[data-t]').forEach(function(b){ b.onclick=function(){ S.tab=b.dataset.t; S.q=null; render(); }; });

/* ---------- 年表と一覧 ---------- */
function renderExplore(){
  var m = el('main');
  if(!DM.ready){ m.innerHTML = '<div class="panel empty"><b>'+esc(DM.ja)+'</b> は準備中です。<br>「クイズ」タブでは、この領域のサンプル問題を試せます。</div>'; return; }
  if(!people.length && !INST.length){ m.innerHTML = '<div class="panel empty"><b>'+esc(DM.ja)+'（'+esc(S.region)+'）</b> は準備中です。</div>'; return; }
  var both = people.length && INST.length;
  var seg = both ? '<div class="seg2" role="tablist"><button data-v="people" class="'+(S.view==='people'?'on':'')+'">'+esc(DM.pl)+'（年表）</button><button data-v="inst" class="'+(S.view==='inst'?'on':'')+'">'+esc(DM.ils)+'（'+INST.length+'）</button></div>' : '';
  if(S.view==='inst'){
    m.innerHTML = seg+'<div class="grid"><div><div class="panel"><h2>'+esc(DM.ils)+'の一覧</h2><div id="ilist"></div></div></div><div><div class="panel card" id="card"></div></div></div>';
    bindSeg(m); drawIList(); drawICard(); return;
  }
  m.innerHTML = seg+'<div class="grid"><div><div class="panel"><h2>年表（生没年の棒をタップ）</h2><div class="tl-wrap" id="tl"></div><div class="hint" style="margin-top:6px">色は時代区分。棒が重なっているのは、同じ時代に生きていた人です。</div></div>'+
    '<div class="panel" style="margin-top:12px"><h2>時代ごとの一覧</h2><div id="list"></div></div></div><div><div class="panel card" id="card"></div></div></div>';
  bindSeg(m);
  drawTimeline(); drawList(); drawCard();
  if(!window.__laResize){ window.__laResize = 1; var t; window.addEventListener('resize', function(){ clearTimeout(t); t = setTimeout(function(){ if(S.tab==='explore' && el('tl')) drawTimeline(); }, 150); }); }
}
function bindSeg(m){ m.querySelectorAll('.seg2 button').forEach(function(b){ b.onclick=function(){ S.view=b.dataset.v; S.word=null; renderExplore(); }; }); }
function eraRange(era){
  var xs = people.filter(function(p){return p.era===era;}).map(function(p){return p.born;});
  return xs.length ? yr(Math.min.apply(null,xs))+(xs.length>1?'〜'+yr(Math.max.apply(null,xs)):'')+'年生まれ' : '';
}
function drawList(){
  var h='';

    var ps = people.filter(function(p){return p.era===e;}); if(!ps.length) return;
    h += '<div class="era-h"><i style="background:'+eraColor(e)+'"></i>'+esc(e)+'<span>'+eraRange(e)+'</span></div><div class="plist">'+ps.map(function(p){
      return '<button class="pbtn'+(S.sel===p.id?' on':'')+(seen(p.id)?' seen':'')+'" data-p="'+p.id+'"><b>'+yr(p.born)+'</b>'+esc(p.name)+'</button>';
    }).join('')+'</div>';
  });

}
function tickStep(span){ return span>1800?500 : span>800?200 : span>380?100 : span>160?50 : 25; }
function drawTimeline(){
  var ys = people.map(function(p){return p.born;}), ye = people.map(function(p){return p.died||2026;});
  var wrap = el('tl'), lo = Math.min.apply(null,ys), hi = Math.max.apply(null,ye), span0 = hi-lo, pad = Math.max(8, Math.round(span0*0.04));
  var y0 = Math.floor((lo-pad)/10)*10, y1 = Math.ceil((hi+pad)/10)*10, W = Math.max(440, Math.floor(wrap.clientWidth || 640) - 2), L = 6, rowH = 22, top = 34, n = people.length, H = top + n*rowH + 14;
  var X = function(y){ return L + (y-y0)/(y1-y0)*(W-L-8); };
  var s = '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="生没年の年表">';
  (BANDS||[]).forEach(function(b,i){
    var a = Math.max(b.from,y0), z = Math.min(b.to,y1); if(z<=a) return;
    s += '<rect x="'+X(a).toFixed(1)+'" y="0" width="'+(X(z)-X(a)).toFixed(1)+'" height="'+H+'" fill="'+eraColor(b.id)+'" opacity="'+(i%2?0.07:0.12)+'"/>'+
         '<text class="band-t" x="'+(X(a)+6).toFixed(1)+'" y="14" fill="'+eraColor(b.id)+'">'+esc(b.id)+'</text>';
  });
  var step = tickStep(y1-y0);
  s += '<g class="axis">';
  for(var y=Math.ceil(y0/step)*step;y<=y1;y+=step){ s += '<line x1="'+X(y).toFixed(1)+'" y1="20" x2="'+X(y).toFixed(1)+'" y2="'+H+'"/><text x="'+(X(y)+3).toFixed(1)+'" y="30">'+yr(y)+'</text>'; }
  s += '</g>';

    var labelRight = x1 + 6, anchor = 'start';

      '<rect x="0" y="'+(yy-2)+'" width="'+W+'" height="'+rowH+'" fill="transparent"/>'+
      '<rect class="life" x="'+x0.toFixed(1)+'" y="'+(yy+3)+'" width="'+Math.max(4,x1-x0).toFixed(1)+'" height="12" rx="6" fill="'+eraColor(p.era)+'"/>'+
      '<text x="'+labelRight.toFixed(1)+'" y="'+(yy+13)+'" text-anchor="'+anchor+'">'+esc(p.name)+' <tspan fill="var(--muted)" font-size="10">'+yr(p.born)+'–'+(p.died?yr(p.died):'')+'</tspan></text></g>';
  });

    g.onclick=function(){ showPerson(g.dataset.p, true); };

  });
}

  S.tab='explore'; S.view='people'; S.sel=id; S.word=null; mark(id);
  var ch = p.region!==S.region; if(ch) setRegion(p.region);
  if(ch || !el('tl')) render(); else { drawList(); drawTimeline(); drawCard(); }
  if(scroll && window.matchMedia('(max-width:900px)').matches && el('card')) el('card').scrollIntoView({behavior:'smooth',block:'start'});
}
var pick = showPerson;
function drawIList(){
  var cats = (DM.cats||[]).slice(); INST.forEach(function(x){ if(cats.indexOf(x.category)<0) cats.push(x.category); });
  var h='';
  cats.forEach(function(f){
    var xs = INST.filter(function(x){return x.category===f;}); if(!xs.length) return;
    h += '<div class="fam-h">'+esc(f)+'</div><div class="plist">'+xs.map(function(x){
      return '<button class="pbtn'+(S.isel===x.id?' on':'')+(seen(x.id,1)?' seen':'')+'" data-i="'+x.id+'">'+esc(x.name)+'</button>';
    }).join('')+'</div>';
  });
  el('ilist').innerHTML = h;
  el('ilist').querySelectorAll('[data-i]').forEach(function(b){ b.onclick=function(){ showInst(b.dataset.i, true); }; });
}
function showInst(id, scroll){
  var x = iById[id]; if(!x) return;
  S.tab='explore'; S.view='inst'; S.isel=id; S.word=null; mark(id,1);
  var ch = x.region!==S.region; if(ch) setRegion(x.region);
  if(ch || !el('ilist')) render(); else { drawIList(); drawICard(); }
  if(scroll && window.matchMedia('(max-width:900px)').matches && el('card')) el('card').scrollIntoView({behavior:'smooth',block:'start'});
}
var pickInst = showInst;

/* ---------- 人物カードと関連語 ---------- */
function kindOf(w){ if(byName[w]) return 'person'; if(iByName[w]) return 'inst'; return gloss[w] ? gloss[w].kind : 'term'; }
function legendHTML(){ return '<div class="legend">'+Object.keys(KIND_LABEL).map(function(k){ return '<span><i style="background:'+KIND_COLOR[k]+'"></i>'+kindLabel(k)+'</span>'; }).join('')+'</div>'; }
function trivHTML(e){
  var ts = e.trivia||[]; if(!ts.length) return '';
  return '<div class="sec">うんちく（へぇ〜）</div><ul class="trv">'+ts.map(function(t){ return '<li>'+esc(t.f)+'</li>'; }).join('')+'</ul>';
}
function drawCard(){
  var c = el('card'), p = byId[S.sel];
  if(!p){ c.innerHTML = '<div class="empty">左の年表か一覧から、'+esc(DM.pl)+'を選んでください。<br>例：'+esc(people.slice(0,3).map(function(x){return x.name;}).join('、'))+'</div>'; return; }
  var h = '<div><span class="tag" style="background:'+eraColor(p.era)+'">'+esc(p.era)+'</span><span class="hint">'+life(p)+(p.died?'年':'現在')+' ・ '+esc(p.country||'')+'</span></div>'+
    '<h3>'+avatar(p)+esc(p.name)+'</h3><div class="sub">'+esc(p.full||'')+(p.en?' / '+esc(p.en):'')+'</div><div class="tagline">'+esc(p.tagline)+'</div>';
  h += '<div class="sec">'+esc(DM.wl)+'</div><ul class="works">'+(p.works||[]).map(function(w){ return '<li><b>'+esc(w.t)+'</b>'+(w.n?' <span>— '+esc(w.n)+'</span>':'')+'</li>'; }).join('')+'</ul>';
  h += motifFigures(p.id);
  h += '<div class="sec">逸話</div><ul class="anec">'+(p.anecdotes||[]).map(function(a){ return '<li>'+esc(a)+'</li>'; }).join('')+'</ul>';
  h += trivHTML(p);
  var tl = Object.keys(ties[p.id]||{}).map(function(id){return byId[id];}).sort(function(a,b){return a.born-b.born;});
  if(tl.length) h += '<div class="sec">つながる'+esc(DM.pl)+'</div><div class="rel">'+tl.map(function(x){ return '<button class="rchip" style="--kc:'+KIND_COLOR.person+'" data-go="'+x.id+'" title="'+esc(ties[p.id][x.id])+'">'+esc(x.name)+'<span class="hint" style="font-size:10.5px">'+esc(ties[p.id][x.id])+'</span></button>'; }).join('')+'</div>';
  var pi = pInst[p.id]||[];
  if(pi.length) h += '<div class="sec">'+relLabel()+(DM.id==='music'?'の楽器':esc(DM.ils))+'</div><div class="rel">'+pi.map(function(id){ var x = iById[id]; return '<button class="rchip" style="--kc:'+KIND_COLOR.inst+'" data-gi="'+x.id+'">'+esc(x.name)+'</button>'; }).join('')+'</div>';
  h += '<div class="sec">関連する言葉（タップで意味と、つながるもの）</div><div class="rel">'+(p.related||[]).map(function(w){
    var k = kindOf(w); return '<button class="rchip'+(S.word===w?' on':'')+'" style="--kc:'+KIND_COLOR[k]+'" data-w="'+esc(w)+'">'+esc(w)+'</button>';
  }).join('')+'</div>';
  h += legendHTML()+'<div id="word"></div>';
  h += '<div class="btnrow"><button class="btn pri" id="qthis">この人物でクイズ</button></div>';
  c.innerHTML = h;
  c.querySelectorAll('[data-w]').forEach(function(b){ b.onclick=function(){ openWord(b.dataset.w); }; });
  c.querySelectorAll('.rel > [data-go]').forEach(function(b){ b.onclick=function(){ showPerson(b.dataset.go, true); }; });
  c.querySelectorAll('[data-gi]').forEach(function(b){ b.onclick=function(){ showInst(b.dataset.gi, true); }; });
  el('qthis').onclick=function(){ S.tab='quiz'; S.qOnly='p:'+p.id; S.q=null; render(); };
  if(S.word) openWord(S.word, true);
}
function drawICard(){
  var c = el('card'), x = iById[S.isel];
  if(!x){ c.innerHTML = '<div class="empty">左の一覧から、'+esc(DM.ils)+'を選んでください。<br>例：'+esc(INST.slice(0,3).map(function(y){return y.name;}).join('、'))+'</div>'; return; }
  var li = function(arr){ return '<ul class="works">'+(arr||[]).map(function(w){ return '<li><b>'+esc(w.t)+'</b>'+(w.n?' <span>— '+esc(w.n)+'</span>':'')+'</li>'; }).join('')+'</ul>'; };
  var h = '<div><span class="tag" style="background:'+KIND_COLOR.inst+'">'+esc(x.category)+'</span><span class="hint">'+esc(x.when||'')+(x.where?' ・ '+esc(x.where):'')+'</span></div>'+
    '<h3>'+esc(x.name)+'</h3><div class="sub">'+esc(x.full||'')+(x.en?' / '+esc(x.en):'')+'</div><div class="tagline">'+esc(x.tagline)+'</div>'+instFigure(x.id);
  if((x.facts||[]).length) h += '<div class="sec">しくみと歴史</div>'+li(x.facts);
  if((x.famous||[]).length) h += '<div class="sec">代表例・使い手・事例</div>'+li(x.famous);
  h += '<div class="sec">逸話</div><ul class="anec">'+(x.anecdotes||[]).map(function(a){ return '<li>'+esc(a)+'</li>'; }).join('')+'</ul>';
  h += trivHTML(x);
  var cs = (iComp[x.id]||[]).map(function(id){return byId[id];});
  if(cs.length) h += '<div class="sec">'+relLabel()+(DM.id==='music'?'の作曲家':'する'+esc(DM.pl))+'</div><div class="rel">'+cs.map(function(p){ return '<button class="rchip" style="--kc:'+KIND_COLOR.person+'" data-go="'+p.id+'">'+esc(p.name)+'</button>'; }).join('')+'</div>';
  h += '<div class="sec">関連する言葉（タップで意味と、つながるもの）</div><div class="rel">'+(x.related||[]).map(function(w){ var k=kindOf(w); return '<button class="rchip'+(S.word===w?' on':'')+'" style="--kc:'+KIND_COLOR[k]+'" data-w="'+esc(w)+'">'+esc(w)+'</button>'; }).join('')+'</div>';
  h += legendHTML()+'<div id="word"></div>';
  h += '<div class="btnrow"><button class="btn pri" id="qthis">この'+esc(DM.inoun||'項目')+'でクイズ</button></div>';
  c.innerHTML = h;
  c.querySelectorAll('[data-w]').forEach(function(b){ b.onclick=function(){ openWord(b.dataset.w); }; });
  c.querySelectorAll('.rel > [data-go]').forEach(function(b){ b.onclick=function(){ showPerson(b.dataset.go, true); }; });
  el('qthis').onclick=function(){ S.tab='quiz'; S.qOnly='i:'+x.id; S.q=null; render(); };
  if(S.word) openWord(S.word, true);
}
function openWord(w, keep){
  if(!keep && byName[w] && !(S.view==='people' && byName[w].id===S.sel)){ showPerson(byName[w].id, true); return; }
  if(!keep && iByName[w] && !(S.view==='inst' && iByName[w].id===S.isel)){ showInst(iByName[w].id, true); return; }
  S.word = w;
  var c = el('card'); c.querySelectorAll('.rchip').forEach(function(b){ b.classList.toggle('on', b.dataset.w===w); });
  var cur = S.view==='inst' ? S.isel : S.sel;
  var g = gloss[w], k = kindOf(w), ps = (inv[w]||[]).map(function(id){return byId[id]||iById[id];}).filter(function(x){return x && x.id!==cur;});
  var own = byName[w] || iByName[w];
  var h = '<div class="word" style="--kc:'+KIND_COLOR[k]+'"><h4>'+esc(w)+' <span class="hint">'+kindLabel(k)+(g&&g.en?' ・ '+esc(g.en):'')+'</span></h4>';
  if(g) h += '<p>'+esc(g.d)+'</p>';
  else if(own) h += '<p>'+esc(own.tagline)+'</p>';
  else h += '<p class="hint">この言葉の解説は準備中です。</p>';
  if(ps.length) h += '<p class="hint">この言葉でつながるもの</p><div class="rel">'+ps.map(function(x){ var isI = !!iById[x.id]; return '<button class="rchip" style="--kc:'+(isI?KIND_COLOR.inst:KIND_COLOR.person)+'" data-go="'+x.id+'">'+esc(x.name)+'</button>'; }).join('')+'</div>';
  h += '</div>';
  el('word').innerHTML = h;
  el('word').querySelectorAll('[data-go]').forEach(function(b){ b.onclick=function(){ if(iById[b.dataset.go]) showInst(b.dataset.go, true); else showPerson(b.dataset.go, true); }; });
}

/* ---------- クイズ ---------- */
function maskName(text, p){
  var names = [p.name, p.full||''].filter(Boolean);
  if(p.full){ var parts = p.full.split(/[・･\s]/); names.push(parts[parts.length-1]); }
  names = names.filter(function(n){ return n && n.length>=2; }).sort(function(a,b){return b.length-a.length;});
  var t = text; names.forEach(function(n){ t = t.split(n).join('この'+(DM.pq||'人物')); });
  return t;
}
function nearPeople(p, n){
  var others = people.filter(function(x){return x.id!==p.id;});
  if(others.length<3) others = others.concat(ALLP.filter(function(x){ return x.id!==p.id && others.indexOf(x)<0; }));
  var near = others.slice().sort(function(a,b){ return Math.abs(a.born-p.born)-Math.abs(b.born-p.born); }).slice(0,8);
  return sample(near, n);
}
function worksQ(p, ws){ return ws+(DM.wq||'で知られる人物')+'はだれか。'; }
function makeCardQ(p){
  var kinds = [];
  if((p.anecdotes||[]).length) kinds.push('anec');
  if((p.works||[]).length>=2) kinds.push('works');
  if(ERAIDS.length>=4) kinds.push('era');
  var onlyWords = (p.related||[]).filter(function(w){ return (inv[w]||[]).length===1 && !byName[w] && !iByName[w]; });
  if(onlyWords.length) kinds.push('word');
  if(!kinds.length) return null;
  var k = pickOne(kinds), ds = nearPeople(p,3), q, opts;
  var sum = p.name+'（'+lifeText(p)+'・'+p.era+'）'+p.tagline;
  if(k==='era'){
    var eras = [p.era].concat(sample(ERAIDS.filter(function(e){return e!==p.era;}),3));
    opts = shuffle(eras);
    return {q:p.name+'（'+lifeText(p)+'）が属する時代区分はどれか。', o:opts, a:opts.indexOf(p.era), e:sum, pid:p.id, d:DM.ja};
  }
  if(ds.length<3) return null;
  if(k==='anec') q = '次の逸話に当てはまる'+(DM.pq||'人物')+'はだれか。\n「'+maskName(pickOne(p.anecdotes),p)+'」';
  else if(k==='works') q = worksQ(p, sample(p.works,Math.min(3,p.works.length)).map(function(w){return '「'+w.t+'」';}).join('、'));
  else q = '「'+pickOne(onlyWords)+'」と最も深く関わる'+(DM.pq||'人物')+'はだれか。';
  opts = shuffle([p.name].concat(ds.map(function(x){return x.name;})));
  return {q:q, o:opts, a:opts.indexOf(p.name), e:sum, pid:p.id, d:DM.ja};
}
function makeInstQ(x){
  var others = INST.filter(function(y){return y.id!==x.id;});
  var same = others.filter(function(y){return y.category===x.category;});
  var pool = same.length>=3 ? same : others;
  if(pool.length<3) pool = ALLI.filter(function(y){return y.id!==x.id;});
  if(pool.length<3) return null;
  var ds = sample(pool, 3), noun = DM.inoun||'項目';
  var mask = function(t){ var r = t; [x.name, x.full||''].filter(function(n){return n && n.length>=2;}).sort(function(a,b){return b.length-a.length;}).forEach(function(n){ r = r.split(n).join('この'+noun); }); return r; };
  var kinds = []; if((x.anecdotes||[]).length) kinds.push('a'); kinds.push('t');
  var fs = (x.famous||[]).filter(function(f){return f.t.indexOf(x.name)===-1;}); if(fs.length) kinds.push('f');
  var k = pickOne(kinds), q;
  if(k==='a') q = '次の逸話に当てはまる'+noun+'はどれか。\n「'+mask(pickOne(x.anecdotes))+'」';
  else if(k==='f'){ var f = pickOne(fs); q = '「'+mask(f.t)+'」と結びつく'+noun+'はどれか。\n'+mask(f.n||''); }
  else q = '次の説明にあてはまる'+noun+'はどれか。\n'+mask(x.tagline);
  var opts = shuffle([x.name].concat(ds.map(function(y){return y.name;})));
  return {q:q, o:opts, a:opts.indexOf(x.name), e:x.name+'（'+(x.when?x.when+'・':'')+x.category+'）'+x.tagline, iid:x.id, d:DM.ja};
}
function makeTriviaQ(e, isItem){
  var t = pickOne(e.trivia||[]); if(!t) return null;
  var opts = shuffle([t.a].concat(t.w));
  var r = {q:t.q, o:opts, a:opts.indexOf(t.a), e:t.f, d:DM.ja, trv:1};
  if(isItem) r.iid = e.id; else r.pid = e.id;
  return r;
}
function entities(){ return people.map(function(p){return {e:p,i:0};}).concat(INST.map(function(x){return {e:x,i:1};})); }
function pool(){ return (D.sample||[]).filter(function(x){return x.d===DM.ja && (x.r||'海外')===S.region;}); }
function triviaPool(){ return entities().filter(function(z){ return (z.e.trivia||[]).length; }); }
function nextQ(){
  var tp = triviaPool(), sp = pool(), mode = S.qmode;
  if(S.qOnly){
    var isI = S.qOnly.indexOf('i:')===0, id = S.qOnly.slice(2), e = isI ? iById[id] : byId[id];
    if(!e) return null;
    var tq = (e.trivia||[]).length && Math.random()<0.4 ? makeTriviaQ(e, isI) : null;
    return tq || (isI ? makeInstQ(e) : makeCardQ(e)) || makeTriviaQ(e, isI);
  }
  var pickKind = function(){
    var r = Math.random();
    if(mode==='trivia') return tp.length ? 'trivia' : null;
    if(mode==='sample') return sp.length ? 'sample' : null;
    if(mode==='card') return (people.length||INST.length) ? 'card' : null;
    if(r<0.4 && tp.length) return 'trivia';
    if(r<0.55 && sp.length) return 'sample';
    return (people.length||INST.length) ? 'card' : (tp.length ? 'trivia' : (sp.length ? 'sample' : null));
  };
  for(var tries=0; tries<6; tries++){
    var kind = pickKind(), q = null; if(!kind) return null;
    if(kind==='trivia'){ var z = pickOne(tp); q = makeTriviaQ(z.e, z.i); }
    else if(kind==='sample'){
      var it = pickOne(sp), o = it.o.slice(), correct = o[it.a], order = shuffle(o.map(function(_,i){return i;}));
      q = {q:it.q, o:order.map(function(i){return o[i];}), a:order.indexOf(it.a), e:it.e, d:it.d, st:1};
    } else {
      var useItem = INST.length && (!people.length || Math.random()<0.3);
      q = useItem ? makeInstQ(pickOne(INST)) : makeCardQ(pickOne(people));
    }
    if(q) return q;
  }
  return null;
}
function renderQuiz(){
  var m = el('main');
  if(!S.q) S.q = nextQ();
  if(!S.q){ m.innerHTML='<div class="panel empty"><b>'+esc(DM.ja)+'（'+esc(S.region)+'）</b> のクイズは準備中です。</div>'; return; }
  var q = S.q, hasT = triviaPool().length;
  var only = S.qOnly ? (S.qOnly.indexOf('i:')===0 ? iById[S.qOnly.slice(2)] : byId[S.qOnly.slice(2)]) : null;
  var h = '<div class="panel qbox"><div class="qmeta"><span>'+esc(DM.ja)+(only?' ・ '+esc(only.name)+' だけ':'')+' ・ これまで '+ST.quiz.right+'/'+ST.quiz.asked+' 問正解</span>';
  var modes = [['all','ぜんぶ'],['card','カードから'],['trivia','うんちく'],['sample','用語・教養']];
  h += '<span class="seg">'+modes.filter(function(x){ return x[0]==='all' || (x[0]==='trivia'?hasT:x[0]==='sample'?pool().length:true); }).map(function(x){ return '<button data-m="'+x[0]+'" class="'+(S.qmode===x[0]&&!S.qOnly?'on':'')+'">'+x[1]+'</button>'; }).join('')+'</span>';
  h += '</div>'+(q.trv?'<div class="trvtag">うんちく問題</div>':'')+'<div class="qq">'+esc(q.q).replace(/\n/g,'<br>')+'</div><div class="opts">'+q.o.map(function(o,i){ return '<button class="opt" data-i="'+i+'">'+esc(o)+'</button>'; }).join('')+'</div><div id="fb"></div></div>';
  m.innerHTML = h;
  m.querySelectorAll('[data-m]').forEach(function(b){ b.onclick=function(){ S.qmode=b.dataset.m; S.qOnly=null; S.q=null; renderQuiz(); }; });
  m.querySelectorAll('.opt').forEach(function(b){ b.onclick=function(){ answer(+b.dataset.i); }; });
}
function answer(i){
  var q = S.q, ok = i===q.a;
  ST.quiz.asked++; if(ok) ST.quiz.right++; save();
  el('main').querySelectorAll('.opt').forEach(function(b,k){ b.disabled=true; if(k===q.a) b.classList.add('ok'); else if(k===i) b.classList.add('ng'); });
  var h = '<div class="exp"><b>'+(ok?'正解':'不正解')+'</b>　'+(q.trv?'へぇ〜：':'')+esc(q.e)+'</div><div class="btnrow"><button class="btn pri" id="nx">次の問題</button>'+(q.pid?'<button class="btn" id="seec">この人物のカードを見る</button>':'')+(q.iid?'<button class="btn" id="seei">このカードを見る</button>':'')+'</div>';
  el('fb').innerHTML = h;
  el('nx').onclick=function(){ S.q=null; renderQuiz(); };
  if(q.pid) el('seec').onclick=function(){ showPerson(q.pid); };
  if(q.iid) el('seei').onclick=function(){ showInst(q.iid); };
}

loadDomain('music');
render();
})();
