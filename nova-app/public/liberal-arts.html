<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>リベラルアーツ</title>
<style>
  :root{
    --bg:#F7F8FA; --paper:#FFFFFF; --ink:#16181D; --muted:#667085; --line:#E1E5EC; --soft:#F0F3F8;
    --accent:#8A5A2B; --accent-soft:#F6EBDD; --navy:#1E3A6E;
    --c-baroque:#B7791F; --c-classical:#2F7D6D; --c-romantic:#B83280; --c-national:#2B6CB0; --c-late:#6B46C1; --c-impress:#3182CE; --c-modern:#C05621;
    --k-inst:#0E7C86; --k-person:#2B6CB0; --k-work:#B83280; --k-term:#2F7D6D; --k-place:#B7791F; --k-event:#6B46C1;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12151B; --paper:#1B2029; --ink:#E7EAF1; --muted:#98A2B3; --line:#2B313D; --soft:#232936;
      --accent:#E0B27A; --accent-soft:#2F2619; --navy:#C6D6EC;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;line-height:1.7;-webkit-text-size-adjust:100%;}
  button{font:inherit;color:inherit;cursor:pointer;}
  .wrap{max-width:1180px;margin:0 auto;padding:18px 16px 60px;}
  .eyebrow{font-size:11px;letter-spacing:.14em;color:var(--accent);font-weight:700;}
  h1{margin:2px 0 4px;font-size:26px;font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;}
  .lead{margin:0 0 14px;color:var(--muted);font-size:13px;}
  .dgroups{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:10px;margin:10px 0 16px;}
  .dgroup{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0;}
  .dgroup h2{margin:0;font-size:13px;}
  .dgroup .gnote{margin:2px 0 8px;font-size:11px;color:var(--muted);line-height:1.5;}
  .dgroup .domains{margin:0;gap:6px;}
  .dsub{display:block;font-size:10.5px;font-weight:400;opacity:.8;margin-top:1px;}
  .domains{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px;}
  .dchip{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:5px 12px;font-size:13px;font-weight:600;text-align:left;}
  .dchip.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .dchip.soon{color:var(--muted);font-weight:500;}
  .dchip small{font-size:10px;margin-left:5px;opacity:.7;}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;}
  .tab{border:0;background:none;padding:8px 14px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;}
  .tab.on{color:var(--accent);border-bottom-color:var(--accent);}
  .grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start;}
  @media (max-width:900px){.grid{grid-template-columns:1fr;}}
  .panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;}
  .panel h2{margin:0 0 8px;font-size:14px;}
  .hint{font-size:12px;color:var(--muted);}
  /* 年表 */
  .tl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--paper);}
  .tl-wrap svg{display:block;}
  .bar{cursor:pointer;}
  .bar rect{transition:opacity .12s;}
  .bar:hover rect.life,.bar:focus rect.life{opacity:.8;}
  .bar.sel rect.life{stroke:var(--ink);stroke-width:2;}
  .bar text{font-size:11.5px;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:3px;stroke-linejoin:round;pointer-events:none;}
  .bar:focus{outline:none;}
  .axis text{font-size:10px;fill:var(--muted);}
  .axis line{stroke:var(--line);}
  .band-t{font-size:11px;font-weight:700;}
  /* 時代別の一覧 */
  .seg2{display:inline-flex;border:1px solid var(--line);border-radius:100px;padding:2px;background:var(--paper);margin-bottom:12px;}
  .seg2 button{border:0;background:none;padding:5px 16px;font-size:13px;font-weight:600;border-radius:100px;color:var(--muted);}
  .seg2 button.on{background:var(--accent);color:#fff;}
  .fam-h{display:flex;align-items:baseline;gap:8px;margin:12px 0 6px;font-size:13px;font-weight:800;}
  .fam-h span{font-size:11px;font-weight:500;color:var(--muted);}
  .era-h{display:flex;align-items:baseline;gap:8px;margin:14px 0 6px;font-size:13px;font-weight:800;}
  .era-h i{display:inline-block;width:10px;height:10px;border-radius:3px;}
  .era-h span{font-size:11px;font-weight:500;color:var(--muted);}
  .plist{display:flex;flex-wrap:wrap;gap:6px;}
  .pbtn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:5px 10px;font-size:13px;display:inline-flex;gap:7px;align-items:baseline;}
  .pbtn b{font-size:11px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;}
  .pbtn:hover{border-color:var(--accent);}
  .pbtn.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .pbtn.on b{color:#fff;opacity:.85;}
  .pbtn.seen::after{content:"✓";font-size:11px;color:var(--k-term);margin-left:2px;}
  .pbtn.on.seen::after{color:#fff;}
  /* カード */
  @media (min-width:901px){ #card{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;} }
  .fig{margin:10px 0;}
  .figsvg{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;justify-content:center;}
  .figsvg svg{height:150px;width:auto;max-width:100%;display:block;}
  .staff .figsvg{padding:8px 10px;overflow-x:auto;justify-content:flex-start;}
  .staff .figsvg svg{height:96px;max-width:none;}
  .fig figcaption{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.6;}
  .portrait{display:inline-block;width:64px;height:76px;margin-right:12px;vertical-align:middle;}
  .portrait svg{width:100%;height:100%;display:block;}
  .avatar{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--ac,var(--accent));color:#fff;font-size:17px;font-weight:700;margin-right:10px;vertical-align:middle;font-family:inherit;}
  .card h3{margin:0;font-size:22px;font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;}
  .card .sub{font-size:12px;color:var(--muted);margin:2px 0 8px;}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 10px;border-radius:100px;color:#fff;margin-right:6px;}
  .tagline{font-size:14px;font-weight:700;margin:8px 0 10px;}
  .sec{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--accent);margin:14px 0 4px;}
  .works{list-style:none;margin:0;padding:0;display:grid;gap:4px;}
  .works li{font-size:13px;border-left:3px solid var(--line);padding:2px 0 2px 10px;}
  .works b{font-weight:700;}
  .works span{color:var(--muted);}
  .anec{margin:0;padding-left:18px;font-size:13px;}
  .anec li{margin:3px 0;}
  .rel{display:flex;flex-wrap:wrap;gap:6px;}
  .rchip{border:1px solid var(--line);background:var(--paper);border-radius:100px;padding:3px 11px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;}
  .rchip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--kc,var(--muted));}
  .rchip:hover,.rchip.on{border-color:var(--kc,var(--accent));background:var(--soft);}
  .legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--muted);margin:6px 0 0;}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;}
  .word{margin-top:10px;border:1px solid var(--line);border-left:4px solid var(--kc,var(--accent));border-radius:10px;padding:10px 12px;background:var(--soft);}
  .word h4{margin:0 0 2px;font-size:14px;}
  .word p{margin:3px 0;font-size:12.5px;}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
  .btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:7px 14px;font-size:13px;font-weight:600;}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;}
  .empty{color:var(--muted);font-size:13px;padding:30px 10px;text-align:center;}
  /* クイズ */
  .qbox{max-width:760px;}
  .qmeta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:8px;flex-wrap:wrap;gap:8px;}
  .qq{font-size:15px;font-weight:600;line-height:1.8;margin:6px 0 12px;}
  .opts{display:grid;gap:8px;}
  .opt{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 14px;font-size:14px;}
  .opt:hover:not(:disabled){border-color:var(--accent);}
  .opt.ok{border-color:#2F7D6D;background:rgba(47,125,109,.12);}
  .opt.ng{border-color:#C0392B;background:rgba(192,57,43,.1);}
  .opt:disabled{cursor:default;}
  .exp{margin-top:12px;padding:10px 14px;border-radius:10px;background:var(--soft);font-size:13px;}
  .src{font-size:11px;color:var(--muted);margin-top:18px;}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:100px;padding:2px;background:var(--paper);}
  .seg button{border:0;background:none;padding:3px 12px;font-size:12px;border-radius:100px;color:var(--muted);}
  .seg button.on{background:var(--accent);color:#fff;}

  .trv{margin:0;padding:0;list-style:none;font-size:13px;line-height:1.7}
  .trv li{margin:6px 0;padding-left:2.6em;position:relative}
  .trv li::before{content:"へぇ";position:absolute;left:0;top:3px;padding:0 6px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:10px;font-weight:700;line-height:1.7}
  .trvtag{display:inline-block;margin:0 0 6px;padding:2px 10px;border-radius:999px;background:var(--accent);color:#fff;font-size:11px;font-weight:700}
  .note{margin:10px 0 0;padding:8px 12px;border-radius:10px;background:var(--paper);border:1px solid var(--line);font-size:12px;color:var(--muted)}
</style>
</head>

スの娘だ。","q":"名器「レディ・ブラント」の名の由来となった夫人の母は?","a":"数学者エイダ・ラブレス","w":["看護師ナイチンゲール","物理学者キュリー夫人","作家メアリー・シェリー"]},{"f":"ストラディヴァリは、ヴァイオリンのほかにヴィオラやチェロ、ギター、ハープなども製作した。","q":"ヴァイオリン以外にストラディヴァリが製作した楽器は?","a":"ギターやハープ","w":["ピアノやオルガン","フルートやオーボエ","トランペットやホルン"]}]},{"id":"guarneri","name":"グァルネリ・デル・ジェズ","full":"グァルネリ・デル・ジェズ（バルトロメオ・ジュゼッペ・グァルネリ製作のヴァイオリン）","en":"Guarneri del Gesu","when":"1720年代〜1744年","where":"イタリア（クレモナ）","era":"バロック","tagline":"ストラディヴァリウスと並び称される、力強い音の名器","facts":[{"t":"製作者","n":"バルトロメオ・ジュゼッペ・グァルネリ（1698〜1744）。クレモナのグァルネリ家に生まれた。"},{"t":"通称","n":"ラベルに十字とIHSの文字を入れたことから『デル・ジェズ（イエスの）』と呼ばれる。"},{"t":"作風","n":"現存は少なく、力強く暗い音色が特色とされる。ストラディヴァリウスは華やかと評される。"}],"famous":[{"t":"イル・カノーネ（1743年製）","n":"パガニーニの愛器で、遺言によりジェノヴァ市に遺贈された。"},{"t":"ダヴィッド（1742年製）","n":"ハイフェッツが演奏会で愛用したことで知られる名器。"},{"t":"評価の高まり","n":"19世紀にパガニーニらの使用で評価が上がり、名器の地位を確立したといわれる。"}],"anecdotes":["リヴォルノの演奏会で借りた楽器の音に感嘆したパガニーニに、持ち主は返却を求めなかったと伝わる。","『イル・カノーネ』は大砲のような音量にちなむ呼び名とされる。ジェノヴァ市が保管し、特別な機会に限って演奏される。","デル・ジェズは晩年に困窮し、投獄されたという話も伝わるが、生涯には不明な点が多い。"],"related":["クレモナ","ジェノヴァ","イル・カノーネ","パガニーニ","ストラディヴァリウス","ヴァイオリン","ヴィルトゥオーゾ","ヤッシャ・ハイフェッツ"],"region":"海外","category":"弦楽器","people":["パガニーニ"],"trivia":[{"f":"通称「デル・ジェズ」は、製作ラベルに記された十字架と「IHS」の文字に由来する。IHSは、イエスを表す記号だ。","q":"グァルネリの通称「デル・ジェズ」の由来は?","a":"ラベルのIHSの文字と十字架","w":["工房が教会の隣にあったこと","作者の洗礼名がジェズだったこと","注文主の修道会の名前"]},{"f":"デル・ジェズの祖父アンドレア・グァルネリは、名工ニコロ・アマティの工房で修業した。クレモナの名器の系譜はつながっている。","q":"祖父アンドレア・グァルネリが弟子入りした名工は?","a":"ニコロ・アマティ","w":["ヤコプ・シュタイナー","ガスパロ・ダ・サロ","ジャン＝バティスト・ヴィヨーム"]}]},{"id":"cello","name":"チェロ","full":"チェロ（ヴィオロンチェロ、低音の弓奏弦楽器）","en":"Cello","when":"16世紀〜","where":"イタリア","era":"バロック","tagline":"人の声に近いといわれる、ヴァイオリン族の低音楽器","facts":[{"t":"成立","n":"16世紀のイタリアで、ヴァイオリンと同じ時期にその低音楽器として成立した。"},{"t":"名称","n":"正式名ヴィオロンチェロは『小さなヴィオローネ』の意で、略してチェロと呼ぶ。"},{"t":"構造","n":"4本の弦をヴィオラの1オクターヴ下に調弦し、膝の間に構えて弾く。"},{"t":"エンドピン","n":"床に支える脚は19世紀に広まった。それ以前はふくらはぎで挟んで支えた。"}],"famous":[{"t":"無伴奏チェロ組曲","n":"バッハの全6曲の独奏組曲。カザルスが演奏会で取り上げて評価を高めた。"},{"t":"パブロ・カザルス","n":"20世紀を代表する奏者で、この組曲を再発見したと伝わる。"},{"t":"ドヴォルザークの協奏曲","n":"ロ短調（1895年）。ロマン派を代表するチェロ協奏曲として知られる。"},{"t":"デュポール","n":"ストラディヴァリのチェロ（1711年製）。ロストロポーヴィチが愛用した。"}],"anecdotes":["カザルスは13歳のころバルセロナの楽譜店でバッハの組曲の楽譜を見つけ、長い年月をかけて演奏会にかけるまで練習を重ねたと伝わる。","『デュポール』の名で呼ばれるストラディヴァリのチェロには、ナポレオンが試奏して拍車で傷をつけたという話が伝わる。","ドヴォルザークの協奏曲の楽譜を読んだブラームスは、これほどの曲が書けるのかと感嘆したと伝わる。"],"related":["ヴァイオリン","ストラディヴァリウス","パブロ・カザルス","無伴奏チェロ組曲","ナポレオン","ムスティスラフ・ロストロポーヴィチ","ドヴォルザーク","バッハ"],"region":"海外","category":"弦楽器","people":["バッハ","ベートーヴェン","シューマン","ドヴォルザーク"],"trivia":[{"f":"チェロの床に立てる支柱「エンドピン」が広まる前、奏者は楽器をふくらはぎで挟んで支えていた。19世紀に普及した。","q":"エンドピンが普及する前、奏者はチェロをどう支えた?","a":"ふくらはぎで挟んだ","w":["膝の上に載せた","首から紐で吊った","小さな台に固定した"]},{"f":"「ヴィオロンチェロ」は「小さなヴィオローネ」の意味。大きな楽器を表す語に、小さいことを示す語尾が付いている。","q":"「ヴィオロンチェロ」の語尾「チェロ」が表す意味は?","a":"小さい","w":["低い","古い","細い"]}]},{"id":"piano","name":"ピアノ","full":"ピアノ（ハンマーで弦を打つ鍵盤楽器、ピアノフォルテ）","en":"Piano","when":"1700年ごろ〜","where":"イタリア（フィレンツェ）で発明","era":"ロマン派","tagline":"指の強弱で音の大小を出せる鍵盤楽器。フィレンツェで生まれた","facts":[{"t":"発明","n":"1700年ごろ、フィレンツェのメディチ家に仕えたクリストフォリが考案した。"},{"t":"原名","n":"当初の名は『強弱のつくチェンバロ』を意味し、のちにピアノフォルテ、ピアノと略された。"},{"t":"機構","n":"鍵を押すとハンマーが弦を打つ。タッチの強さで音量が変わる点がチェンバロと異なる。"},{"t":"発展","n":"19世紀に鉄のフレームが導入され、音量と音域が拡大した。現代の標準は88鍵。"}],"famous":[{"t":"現存する最古級の楽器","n":"クリストフォリの1720年製がニューヨークのメトロポリタン美術館に現存する。"},{"t":"ブロードウッド社","n":"ロンドンの製造者。力強い響きのイギリス式ピアノで知られる。"},{"t":"エラール社","n":"パリの製造者。連打性を高めた機構を開発し、リストらが愛用した。"},{"t":"プレイエル社","n":"パリの製造者。繊細な音色でショパンに愛された。"}],"anecdotes":["ベートーヴェンは1818年、ブロードウッド社から贈られたピアノを受け取った。聴力を失う中で愛用し、のちにリストの手に渡ったと伝わる。","ショパンはマヨルカ島の滞在中、プレイエル社のピアノが届くのを待ちわび、届くと作曲に励んだと伝わる。","リストは1840年ごろロンドンで、独りで演奏する会を『リサイタル』と呼んだとされる。"],"related":["チェンバロ","バルトロメオ・クリストフォリ","フィレンツェ","ブロードウッド社","プレイエル社","エラール社","マヨルカ島","リサイタル"],"region":"海外","category":"鍵盤楽器","people":["モーツァルト","ベートーヴェン","ショパン","リスト"],"trivia":[{"f":"グランドピアノの弦をすべて合わせた張力は20トン近くにもなる。これを鋳鉄のフレームが支えている。","q":"コンサート用グランドピアノの弦の張力は、合計で約何トン?","a":"約20トン","w":["約2トン","約5トン","約60トン"]},{"f":"鍵盤は標準で88鍵だが、ウィーンのベーゼンドルファー社には低音側に鍵盤を足した97鍵の大型ピアノがある。","q":"97鍵の大型ピアノを作るウィーンのメーカーは?","a":"ベーゼンドルファー","w":["スタ 四弦、筑前琵琶は五弦が一般的で、柱（フレット）を持つ"}],"famous":[{"t":"平家物語","n":"琵琶法師が平曲として語り、語り物の中心になった"},{"t":"鶴田錦史","n":"琵琶奏者。「ノヴェンバー・ステップス」の初演で琵琶を弾いた"},{"t":"薩摩琵琶","n":"薩摩の武士の間で伝わった琵琶楽。戦国期に始まると伝わる"}],"anecdotes":["琵琶法師は盲目の語り手として各地を回り、琵琶を弾きながら『平家物語』を語って広めたとされる。","小泉八雲の『怪談』に収められた「耳なし芳一」は、平家を語る盲目の琵琶法師の怪談である。","武満徹は琵琶と尺八を西洋の管弦楽と向き合わせ、「ノヴェンバー・ステップス」を作曲した。"],"related":["平家物語","平曲","琵琶法師","薩摩琵琶","耳なし芳一","ノヴェンバー・ステップス","鶴田錦史","雅楽"],"category":"弦楽器","people":["武満徹"],"trivia":[{"f":"日本最大の湖、琵琶湖の名は、湖の形が楽器の琵琶に似ていることに由来するとされる。","q":"琵琶湖の名の由来とされるのは?","a":"湖の形が琵琶に似ていること","w":["湖畔に枇杷の木が多かったこと","琵琶法師が湖畔に集まったこと","平家の落人が琵琶を沈めたこと"]},{"f":"奈良の正倉院には、螺鈿の飾りが美しい五絃の琵琶が伝わる。奈良時代の五絃琵琶は世界で唯一現存するとされる。","q":"正倉院に伝わる、世界で唯一現存するとされる琵琶の弦の数は?","a":"五絃","w":["三絃","四絃","六絃"]}]},{"id":"sho","name":"笙","full":"笙（しょう）","en":"Sho","region":"日本","when":"奈良時代に雅楽とともに伝来","where":"日本（中国から伝来）","era":"","tagline":"雅楽の和音をつくる、十七本の竹管の吹奏楽器","facts":[{"t":"しくみ","n":"十七本の竹管を円形に立て、そのうち十五本に金属製のリード（簧）が付く"},{"t":"奏法","n":"息を吸っても吐いても音が出るため、音を途切れさせずに和音を奏でられる"},{"t":"合竹","n":"複数の音を同時に鳴らす和音の奏法を合竹（あいたけ）という"}],"famous":[{"t":"越天楽","n":"雅楽の代表的な曲。管絃で演奏され、笙は和音で支える"},{"t":"セレモニアル","n":"武満徹が笙と管弦楽のために書き、1992年に初演された曲"},{"t":"宮田まゆみ","n":"笙の現代曲の演奏で知られ、国際的に活動する奏者"}],"anecdotes":["笙の形は、鳳凰が翼を休めて立つ姿に例えられ、そのため「鳳笙」とも呼ばれると伝わる。","演奏の前に火であぶって管を温め、息の湿気による音の乱れを防ぐ。水分で簧が鳴りにくくなるためである。","笙の構造が、西洋のアコーディオンやハーモニカなど自由リード楽器の発達に影響したと言われる。"],"related":["雅楽","合竹","越天楽","管絃","セレモニアル","宮田まゆみ","武満徹"],"category":"木管楽器","people":["武満徹"],"trivia":[{"f":"笙は17本の竹管を束ねた楽器だが、そのうち2本には簧（リード）がなく、音が出ない。","q":"笙の17本の管のうち、音が出ない管はいくつ?","a":"2本","w":["0本","5本","8本"]},{"f":"笙は息を吸っても吐いても同じように音が鳴るため、途切れずに和音を響かせ続けられる。","q":"笙の音は、いつ鳴る?","a":"吸うときも吐くときも","w":["吐くときだけ","吸うときだけ","吸うと低く吐くと高く"]}]},{"id":"wadaiko","name":"和太鼓","full":"和太鼓（わだいこ）","en":"Wadaiko","region":"日本","when":"古代から使われ、昭和に組太鼓が発展","where":"日本","era":"昭和の創造","tagline":"祭礼から舞台芸能へ。日本各地に広がる打楽器の総称","facts":[{"t":"しくみ","n":"木をくり抜いた胴などに皮を張り、桴（ばち）で打つ。大きさや形は多様"},{"t":"種類","n":"長胴太鼓、締太鼓、大太鼓などがあり、祭り・歌舞伎・能・雅楽で使い分ける"},{"t":"用途","n":"神事や祭礼、芸能の拍子、戦場の合図などに用いられてきた"}],"famous":[{"t":"鼓童","n":"1981年に新潟県の佐渡島で結成された太鼓芸能集団"},{"t":"林英哲","n":"ソロ奏者として和太鼓を独奏楽器に育てた奏者"},{"t":"小口大八","n":"複数の太鼓を組み合わせる組太鼓を始めたとされる奏者"}],"anecdotes":["太鼓の音は神を招き、邪気を払うとされ、各地の神事や祭礼で長く打たれてきた。その伝統が今日の和太鼓につながる。","戦国時代、陣太鼓は軍の進退や攻撃開始の合図に使われ、兵を動かす役割を担ったと伝わる。","能の囃子は笛と小鼓、大鼓で構成され、曲によっては太鼓が加わる。囃子の太鼓は舞台の拍子を引き締める。"],"related":["鼓童","林英哲","小口大八","組太鼓","能","雅楽","歌舞伎"],"category":"打楽器","people":[],"trivia":[{"f":"「太鼓判を押す」の太鼓判は、太鼓のように大きく丸い判のこと。確かさを保証する意味で使われる。","q":"「太鼓判を押す」の「太鼓判」とは?","a":"太鼓のように大きな判","w":["太鼓の皮に押す焼き印","祭りの太鼓の奉納印","太鼓職人が押す検印"]},{"f":"祭りなどで見かける長胴太鼓の胴は、一本の欅の丸太をくり抜いて作られ、皮には主に牛皮が張られる。","q":"長胴太鼓の胴に定番の木材は?","a":"欅（ケヤキ）","w":["桐（キリ）","檜（ヒノキ）","杉（スギ）"]}]}],"glossary":[{"t":"バロック","kind":"term","d":"17世紀初めから18世紀半ばの時代・様式。通奏低音と華麗な装飾が特徴で、ヴィヴァルディ、バッハ、ヘンデルが代表。","en":"Baroque"},{"t":"古典派","kind":"term","d":"18世紀後半から19世紀初めの時代・様式。均整の取れた形式を重んじ、交響曲やソナタが完成した。ハイドン、モーツァルトが中心。","en":"Classical period"},{"t":"ロマン派","kind":"term","d":"19世紀の時代・様式。感情や個性の表現、文学や自然との結びつきを重んじた。ここで扱う作曲家の多くがこの時代に活動した。","en":"Romanticism"},{"t":"協奏曲","kind":"term","d":"独奏楽器と管弦楽が掛け合う楽曲。ヴィヴァルディは急・緩・急の三楽章形式の定着に大きく寄与した。","en":"Concerto"},{"t":"リトルネロ形式","kind":"term","d":"全員の演奏が独奏部分を挟んで繰り返される楽章の構成。ヴィヴァルディの協奏曲の急速楽章で典型的に使われた。","en":"Ritornello form"},{"t":"標題音楽","kind":"term","d":"物語・情景・詩など音楽以外の内容を題や解説で示した器楽曲。ヴィヴァルディの『四季』やベルリオーズの『幻想交響曲』が例。","en":"Program music"},{"t":"フーガ","kind":"term","d":"一つの主題が複数の声部に次々と模倣されて進む楽曲形式。バッハが頂点を築いた。","en":"Fugue"},{"t":"対位法","kind":"term","d":"独立した複数の旋律を同時に重ね合わせる作曲技法。フーガはその代表で、バッハの音楽の根幹をなす。","en":"Counterpoint"},{"t":"オラトリオ","kind":"term","d":"聖書などの物語を独唱・合唱・管弦楽で上演する大規模声楽曲。舞台装置は使わない。ヘンデルがロンドンで多数を作曲した。","en":"Oratorio"},{"t":"交響曲","kind":"term","d":"管弦楽のための多楽章の大規模な楽曲。ハイドンが形式を整えて「交響曲の父」と呼ばれ、モーツァルト、ベートーヴェンが発展させた。","en":"Symphony"},{"t":"弦楽四重奏曲","kind":"term","d":"二つのヴァイオリン、ヴィオラ、チェロの4人で奏する室内楽。ハイドンが古典派の形式を確立したとされる。","en":"String quartet"},{"t":"ソナタ形式","kind":"term","d":"提示部・展開部・再現部からなる楽章の構成法。古典派で確立し、ベートーヴェンが劇的に発展させた。","en":"Sonata form"},{"t":"ケッヘル番号","kind":"term","d":"モーツァルトの全作品を整理した目録の番号（K.）。19世紀にルートヴィヒ・フォン・ケッヘルが編んだ。","en":"Köchel catalogue number"},{"t":"リート","kind":"term","d":"ドイツ語の芸術歌曲。詩の世界をピアノと声が対等に描く。シューベルトが確立し、シューマンらが受け継いだ。","en":"Lied"},{"t":"ヴィルトゥオーゾ","kind":"term","d":"超絶的な技巧をもつ名演奏家。パガニーニはその典型で、リストらのピアニストに大きな影響を与えた。","en":"Virtuoso"},{"t":"管弦楽法","kind":"term","d":"楽器の音色や組み合わせを使い分けて管弦楽曲を書く技術。ベルリオーズの著した教本は後世に大きな影響を与えた。","en":"Orchestration"},{"t":"固定楽想","kind":"term","d":"一つの旋律が形を変えながら曲全体に繰り返し現れる手法（イデー・フィクス）。ベルリオーズが『幻想交響曲』で用いた。","en":"Idée fixe"},{"t":"ローマ賞","kind":"term","d":"フランスで芸術家に与えられた留学奨学制度の賞。受賞者はローマに留学した。ベルリオーズは1830年に作曲部門で受賞した。","en":"Prix de Rome"},{"t":"無言歌","kind":"term","d":"歌詞のない、歌うような旋律のピアノ小品。メンデルスゾーンが同名の曲集を書き、この名を広めた。","en":"Song without words"},{"t":"ポロネーズ","kind":"term","d":"ポーランド起源の3拍子の舞曲。行進のような威厳をもつ。ショパンがピアノ曲として芸術性を高めた。","en":"Polonaise"},{"t":"ノクターン","kind":"term","d":"夜想曲。夜の静けさを思わせる叙情的な小品。アイルランドのフィールドに始まるとされ、ショパンが深めた。","en":"Nocturne"},{"t":"イル・カノーネ","kind":"term","d":"パガニーニが愛用した1743年製グァルネリ・デル・ジェズのヴァイオリンの愛称。「大砲」の意で、遺言によりジェノヴァ市に遺贈された。","en":"Il Cannone"},{"t":"ダヴィッド同盟","kind":"term","d":"シューマンが批評文の中で思い描いた、俗物的な風潮と戦う芸術家たちの結社。フロレスタンとオイゼビウスという人物が登場した。","en":"Davidsbund"},{"t":"四季","kind":"work","d":"ヴィヴァルディのヴァイオリン協奏曲集『和声と創意の試み』Op.8の最初の4曲。春夏秋冬を描き、標題音楽の例としても有名。","en":"The Four Seasons"},{"t":"マタイ受難曲","kind":"work","d":"バッハが作曲した、マタイ福音書に基づく大規模な受難曲。1829年にメンデルスゾーンが蘇演し、バッハ再評価の契機となった。","en":"St Matthew Passion"},{"t":"平均律クラヴィーア曲集","kind":"work","d":"バッハが全24の長調・短調で前奏曲とフーガを組にした鍵盤曲集。全2巻あり、「音楽の旧約聖書」と称される。","en":"The Well-Tempered Clavier"},{"t":"メサイア","kind":"work","d":"ヘンデルのオラトリオ。キリストの生涯と救いを描き、1742年にダブリンで初演された。ハレルヤ・コーラスで名高い。","en":"Messiah"},{"t":"ハレルヤ・コーラス","kind":"work","d":"『メサイア』第2部を締めくくる合唱。国王が立ち上がったとの伝承から、起立して聴く習慣が生まれたとされる。","en":"Hallelujah Chorus"},{"t":"水上の音楽","kind":"work","d":"ヘンデルの管弦楽組曲集。1717年、国王ジョージ1世のテムズ川の舟遊びで演奏された。","en":"Water Music"},{"t":"告別交響曲","kind":"work","d":"ハイドンの交響曲第45番。終楽章で奏者が一人ずつ演奏をやめて退場し、楽団の休暇を願う意図があったとされる。","en":"Farewell Symphony"},{"t":"魔笛","kind":"work","d":"モーツァルト最晩年のドイツ語オペラ。1791年9月にウィーンで初演され、台本は興行主シカネーダーが書いた。","en":"The Magic Flute"},{"t":"モーツァルトのレクイエム","kind":"work","d":"モーツァルト最晩年の未完の鎮魂ミサ曲（K.626）。作曲者の死後、弟子ジュスマイヤーが補筆して完成させた。","en":"Mozart's Requiem"},{"t":"交響曲第5番「運命」","kind":"work","d":"ベートーヴェンの交響曲（Op.67）。冒頭の短い動機が全曲を貫く。「運命」の通称は弟子シンドラーの伝えに由来するとされる。","en":"Symphony No. 5"},{"t":"交響曲第9番「合唱付き」","kind":"work","d":"ベートーヴェン最後の交響曲（Op.125）。終楽章に独唱と合唱を加え、シラーの詩『歓喜に寄せて』を歌う。1824年初演。","en":"Symphony No. 9"},{"t":"魔王","kind":"work","d":"シューベルトが18歳ごろにゲーテの詩に作曲した歌曲（D.328）。語り手・父・子・魔王を一人の歌手が歌い分ける。","en":"Erlkönig"},{"t":"冬の旅","kind":"work","d":"シューベルトの連作歌曲集。ミュラーの詩による24曲で、失恋した青年のさすらいを描く。","en":"Winterreise"},{"t":"未完成交響曲","kind":"work","d":"シューベルトのロ短調の交響曲。完成した2つの楽章のみが残り、作曲者の没後1865年に初演された。","en":"Unfinished Symphony"},{"t":"ラ・カンパネッラ","kind":"work","d":"パガニーニのヴァイオリン協奏曲第2番の終楽章。鐘を模した音が特徴で、リストのピアノ編曲でも広く知られる。","en":"La campanella"},{"t":"24のカプリース","kind":"work","d":"パガニーニの無伴奏ヴァイオリンのための練習曲集（Op.1）。超絶技巧の宝庫で、後世の作曲家が主題を借りて変奏した。","en":"24 Caprices"},{"t":"幻想交響曲","kind":"work","d":"ベルリオーズの標題交響曲（Op.14）。失恋した芸術家の幻覚を5つの楽章で描き、1830年に初演された。","en":"Symphonie fantastique"},{"t":"夏の夜の夢","kind":"work","d":"シェイクスピアの戯曲による、メンデルスゾーンの序曲（1826年）と劇付随音楽（1843年）。結婚行進曲を含む。","en":"A Midsummer Night's Dream"},{"t":"結婚行進曲","kind":"work","d":"メンデルスゾーンの劇音楽『夏の夜の夢』中の一曲。結婚式の入場曲として広まり、1858年の英国王女の結婚式でも演奏された。","en":"Wedding March"},{"t":"革命のエチュード","kind":"work","d":"ショパンの練習曲Op.10の第12番。左手の激しい走句が特徴。祖国への憤りから書かれたと伝わるが確証はない。","en":"Revolutionary Étude"},{"t":"子供の情景","kind":"work","d":"シューマンのピアノ曲集（Op.15）。子供時代の思い出を13の小品で描き、第7曲「トロイメライ」で知られる。","en":"Kinderszenen"},{"t":"新音楽時報","kind":"work","d":"シューマンが1834年にライプツィヒで友人らと創刊した音楽雑誌。ショパンやブラームスを紹介する批評を掲載した。","en":"Neue Zeitschrift für Musik"},{"t":"ジョージ1世","kind":"person","d":"ハノーファー選帝侯から1714年に英国王となった君主。ヘンデルが仕えた縁があり、『水上の音楽』が演奏された王。","en":"George I"},{"t":"フリードリヒ大王","kind":"person","d":"プロイセン王（在位1740〜86年）。フルートを愛した。1747年、ポツダムにバッハを迎え、即興演奏の主題を与えた。","en":"Frederick the Great"},{"t":"ブクステフーデ","kind":"person","d":"ドイツのオルガン奏者・作曲家（1637頃〜1707）。リューベックの教会で演奏会を開き、青年バッハが聴きに訪れたと伝わる。","en":"Dieterich Buxtehude"},{"t":"ザロモン","kind":"person","d":"ヨハン・ペーター・ザロモン。ロンドンのヴァイオリン奏者・興行師。ハイドンを招いて演奏会を開き、ロンドン交響曲の誕生につながった。","en":"Johann Peter Salomon"},{"t":"エステルハージ家","kind":"person","d":"ハンガリーの大貴族の家。ハイドンは1761年から約30年、この家の楽長として宮廷楽団を率いた。","en":"Esterházy family"},{"t":"サリエリ","kind":"person","d":"アントニオ・サリエリ（1750〜1825）。ウィーン宮廷楽長を務めた作曲家で、シューベルトらの師。モーツァルト毒殺の噂は根拠に乏しい。","en":"Antonio Salieri"},{"t":"ナポレオン","kind":"person","d":"ナポレオン・ボナパルト（1769〜1821）。フランス皇帝。ベートーヴェンは当初「英雄」交響曲を彼に捧げるつもりだったと伝わる。","en":"Napoleon Bonaparte"},{"t":"ゲーテ","kind":"person","d":"ヨハン・ヴォルフガング・フォン・ゲーテ（1749〜1832）。ドイツの文豪。『魔王』など彼の詩にシューベルトらが曲をつけた。","en":"Johann Wolfgang von Goethe"},{"t":"ジョルジュ・サンド","kind":"person","d":"フランスの女性作家（1804〜1876）。1830年代末から1840年代にかけてショパンと親しく交際し、マヨルカ島へも同行した。","en":"George Sand"},{"t":"ハリエット・スミッソン","kind":"person","d":"アイルランド出身の女優。1827年パリでシェイクスピア劇に出演し、ベルリオーズが熱烈に恋した。のち彼の妻となった。","en":"Harriet Smithson"},{"t":"シェイクスピア","kind":"person","d":"ウィリアム・シェイクスピア（1564〜1616）。英国の劇作家。『夏の夜の夢』はその喜劇で、メンデルスゾーンが音楽をつけた。","en":"William Shakespeare"},{"t":"クララ・シューマン","kind":"person","d":"クララ・ヴィーク（1819〜1896）。ドイツのピアニスト・作曲家。ロベルト・シューマンの妻で、夫の作品を演奏して広めた。","en":"Clara Schumann"},{"t":"ヴェネツィア","kind":"place","d":"アドリア海に面したイタリアの水都。ヴィヴァルディの生地で、当時は共和国としてオペラや器楽が盛んだった。","en":"Venice"},{"t":"ピエタ養育院","kind":"place","d":"ヴェネツィアの孤児らを引き取る施設。女子の音楽教育で名高く、ヴィヴァルディが長く音楽教師を務めた。","en":"Ospedale della Pietà"},{"t":"ライプツィヒ","kind":"place","d":"ドイツ東部ザクセンの都市。バッハが後半生を過ごし、メンデルスゾーンやシューマンも活動した音楽の街。","en":"Leipzig"},{"t":"聖トーマス教会","kind":"place","d":"ライプツィヒの教会。付属学校の合唱隊とともに、バッハが1723年からカントルとして礼拝音楽を担った。","en":"St Thomas Church"},{"t":"ロンドン","kind":"place","d":"イギリスの首都。ヘンデルが生涯の大半を過ごし、ハイドンも招かれて大成功を収めた。","en":"London"},{"t":"ウィーン","kind":"place","d":"オーストリアの首都。古典派からロマン派初期の音楽の都で、ハイドン、モーツァルト、ベートーヴェン、シューベルトが活動した。","en":"Vienna"},{"t":"ザルツブルク","kind":"place","d":"オーストリアの都市。モーツァルトの生地で、当時は大司教が治める領邦の都だった。","en":"Salzburg"},{"t":"ジェノヴァ","kind":"place","d":"イタリア北西部の港町。パガニーニの生地で、愛器カノーネが市に遺贈され今も保管されている。","en":"Genoa"},{"t":"パリ","kind":"place","d":"フランスの首都。ショパンが後半生を過ごし、ベルリオーズが生涯の大半を活動した19世紀の芸術の中心地。","en":"Paris"},{"t":"ワルシャワ","kind":"place","d":"ポーランドの首都。ショパンが青年期まで過ごし、心臓は遺志によりこの地の聖十字架教会に納められた。","en":"Warsaw"},{"t":"マヨルカ島","kind":"place","d":"地中海のスペイン領の島。ショパンは1838〜39年の冬にサンドらと滞在し、前奏曲の作曲を進めた。","en":"Majorca"},{"t":"ゲヴァントハウス管弦楽団","kind":"place","d":"ライプツィヒの名門オーケストラ。メンデルスゾーンが1835年から指揮者を務め、ヨーロッパ屈指の楽団へ高めた。","en":"Gewandhaus Orchestra"},{"t":"ハイリゲンシュタットの遺書","kind":"event","d":"1802年、難聴に苦しむベートーヴェンがウィーン郊外で兄弟に宛てて書いた手紙。絶望と創作への決意が記され、死後に発見された。","en":"Heiligenstadt Testament"},{"t":"シューベルティアーデ","kind":"event","d":"シューベルトを囲む友人たちが集い、新作の歌曲やピアノ曲を楽しんだ私的な音楽の集まり。","en":"Schubertiade"},{"t":"11月蜂起","kind":"event","d":"1830年11月に始まったロシア支配に対するポーランドの武装蜂起。翌年に鎮圧され、ショパンが亡命生活を続ける背景となった。","en":"November Uprising"},{"t":"交響詩","kind":"term","d":"文学や絵画などの内容を、単楽章の管弦楽で描く形式。リストが創始し、代表作に「前奏曲」がある。","en":"Symphonic poem"},{"t":"リサイタル","kind":"term","d":"一人の演奏家が独奏で聴かせる演奏会。リストが各地で開き、この形を広めたとされる。","en":"Recital"},{"t":"ワイマール","kind":"place","d":"ドイツ中部の都市。リストが宮廷楽長を務め、ワーグナーの『ローエングリン』を初演した地。","en":"Weimar"},{"t":"コジマ・ワーグナー","kind":"person","d":"リストの娘。指揮者ビューローの妻だったが、のちにワーグナーと結婚した。夫の死後はバイロイト音楽祭を率いた。","en":"Cosima Wagner"},{"t":"ハンガリー狂詩曲","kind":"work","d":"リストがハンガリーの民俗的な旋律をもとに書いたピアノ曲集。全19曲で、第2番が特に有名。","en":"Hungarian Rhapsodies"},{"t":"楽劇","kind":"term","d":"音楽・台本・演出を一体とし、場面が切れ目なく進むワーグナーのオペラの形。『指環』『トリスタン』が代表。","en":"Music drama"},{"t":"ライトモティーフ","kind":"term","d":"人物や事物に結びつけた短い旋律。繰り返し現れて劇を支える。ワーグナーが多用した。日本語では示導動機。","en":"Leitmotif"},{"t":"総合芸術","kind":"term","d":"音楽・詩・演劇・美術を一つに結びつける理念。ワーグナーが楽劇で目指した。","en":"Gesamtkunstwerk"},{"t":"バイロイト祝祭劇場","kind":"place","d":"ドイツ南部バイロイトにあるワーグナー作品の専用劇場。1876年に開場し、今も毎夏音楽祭が開かれる。","en":"Bayreuth Festspielhaus"},{"t":"ルートヴィヒ2世","kind":"person","d":"バイエルン王（在位1864〜1886）。ワーグナーを庇護し、資金面で支えた。ノイシュヴァンシュタイン城でも知られる。","en":"Ludwig II of Bavaria"},{"t":"ニーベルングの指環","kind":"work","d":"ワーグナーの四部作の楽劇。ラインの黄金・ワルキューレ・ジークフリート・神々の黄昏からなり、上演に四夜かかる。","en":"Der Ring des Nibelungen"},{"t":"オペラ","kind":"term","d":"歌と管弦楽で進める舞台劇。16世紀末のイタリアに始まる。ヴェルディはその伝統を頂点へ導いた。","en":"Opera"},{"t":"リソルジメント","kind":"event","d":"19世紀のイタリア統一運動。オーストリアの支配に抗い、1861年にイタリア王国が成立した。ヴェルディの作品と結びつけて語られる。","en":"Risorgimento"},{"t":"ミラノ・スカラ座","kind":"place","d":"ミラノの名門歌劇場。1778年開場。ヴェルディの『ナブッコ』や『オテロ』などが初演された。","en":"La Scala"},{"t":"ナブッコ","kind":"work","d":"ヴェルディ初期の出世作のオペラ(1842)。古代ユダヤ人の捕囚を描き、合唱「行け、わが想いよ」で知られる。","en":"Nabucco"},{"t":"椿姫","kind":"work","d":"ヴェルディのオペラ(1853)。パリの高級娼婦ヴィオレッタの悲恋を描く。デュマ・フィスの小説が原作。","en":"La traviata"},{"t":"アイーダ","kind":"work","d":"ヴェルディのオペラ(1871)。古代エジプトを舞台にした悲恋を描く。カイロで初演され、凱旋行進曲で名高い。","en":"Aida"},{"t":"絶対音楽","kind":"term","d":"物語や詩などの内容に頼らず、音そのものの構造で成り立つ音楽という考え方。ブラームスの交響曲が代表例とされる。","en":"Absolute music"},{"t":"ハンブルク","kind":"place","d":"ドイツ北部の港湾都市。ブラームスの生地で、青年期までをここで過ごした。","en":"Hamburg"},{"t":"ドイツ・レクイエム","kind":"work","d":"ブラームスの合唱曲。1860年代後半に完成した。ドイツ語訳聖書の言葉を用い、死者を悼む人々を慰める内容。","en":"A German Requiem"},{"t":"ハンガリー舞曲集","kind":"work","d":"ブラームスの連弾用の舞曲集（全21曲）。ハンガリー風の旋律に基づき、第5番が特に有名。","en":"Hungarian Dances"},{"t":"バレエ音楽","kind":"term","d":"舞踊のために書かれた音楽。チャイコフスキーは『白鳥の湖』などで、バレエ音楽を交響的な水準に高めた。","en":"Ballet music"},{"t":"白鳥の湖","kind":"work","d":"チャイコフスキーのバレエ(1877年初演)。魔法で白鳥にされた王女と王子の物語。","en":"Swan Lake"},{"t":"交響曲第6番「悲愴」","kind":"work","d":"チャイコフスキー最後の交響曲(1893)。暗く静かな終楽章で閉じる。初演の9日後に作曲者が亡くなった。","en":"Symphony No. 6 Pathétique"},{"t":"メック夫人","kind":"person","d":"ナジェージダ・フォン・メック（1831〜1894）。鉄道事業家の未亡人で、チャイコフスキーを長年経済的に支えた。","en":"Nadezhda von Meck"},{"t":"モスクワ音楽院","kind":"place","d":"1866年創立のロシアの音楽院。チャイコフスキーは開校とともに教授に就いた。","en":"Moscow Conservatory"},{"t":"サンクトペテルブルク","kind":"place","d":"当時のロシア帝国の首都。チャイコフスキーが学んだ音楽院があり、ムソルグスキーが亡くなった町。","en":"Saint Petersburg"},{"t":"五人組","kind":"term","d":"19世紀後半のロシアの作曲家グループ。ムソルグスキーやリムスキー＝コルサコフらが、ロシア独自の音楽を目指した。","en":"The Five (Mighty Handful)"},{"t":"国民楽派","kind":"term","d":"民謡や民族舞曲を取り入れ、自国らしさを打ち出した19世紀の作曲家たち。ドヴォルザーク、グリーグ、ムソルグスキーなど。","en":"Nationalism in music"},{"t":"ボヘミア","kind":"place","d":"現在のチェコ西部にあたる地方。ドヴォルザークとマーラーの生まれた土地。","en":"Bohemia"},{"t":"スメタナ","kind":"person","d":"ベドルジハ・スメタナ（1824〜1884）。チェコ国民楽派の祖。ドヴォルザークは彼が指揮する劇場楽団でヴィオラを弾いた。","en":"Bedřich Smetana"},{"t":"ニューヨーク","kind":"place","d":"アメリカ最大の都市。ドヴォルザークが院長を務めた音楽学校があり、マーラーも晩年に活動した。","en":"New York"},{"t":"交響曲第9番「新世界より」","kind":"work","d":"ドヴォルザークの交響曲(1893)。アメリカ滞在中に書かれ、第2楽章の旋律と終楽章の力強い主題で知られる。","en":"Symphony No. 9 From the New World"},{"t":"スラヴ舞曲集","kind":"work","d":"ドヴォルザークの舞曲集。ピアノ連弾版と管弦楽版があり、ブラームスのハンガリー舞曲集に刺激されて生まれた。","en":"Slavonic Dances"},{"t":"黒人霊歌","kind":"term","d":"アメリカの黒人の間で歌い継がれた宗教的な歌。ドヴォルザークは滞在中にこれに関心を寄せた。","en":"Spirituals"},{"t":"リムスキー＝コルサコフ","kind":"person","d":"ニコライ・リムスキー＝コルサコフ（1844〜1908）。五人組の一人。ムソルグスキーの遺作を整理し、ストラヴィンスキーを教えた。","en":"Nikolai Rimsky-Korsakov"},{"t":"ハルトマン","kind":"person","d":"ヴィクトル・ハルトマン（1834〜1873）。ロシアの建築家・画家。ムソルグスキーの親友で、その遺作展が『展覧会の絵』の契機となった。","en":"Viktor Hartmann"},{"t":"展覧会の絵","kind":"work","d":"ムソルグスキーのピアノ組曲(1874)。ハルトマンの遺作展を歩いて見て回る構成。ラヴェルの管弦楽編曲が有名。","en":"Pictures at an Exhibition"},{"t":"ボリス・ゴドゥノフ","kind":"work","d":"ムソルグスキーのオペラ。16世紀末のロシア皇帝ボリスを主人公とする。プーシキンの劇が原作。","en":"Boris Godunov"},{"t":"ロシア","kind":"place","d":"ユーラシアの大国。チャイコフスキー、ムソルグスキー、ストラヴィンスキーらを生んだ。","en":"Russia"},{"t":"ノルウェー","kind":"place","d":"北欧の国。19世紀に民族意識が高まり、グリーグが民謡を取り入れた音楽でその象徴となった。","en":"Norway"},{"t":"ベルゲン","kind":"place","d":"ノルウェー西岸の港町。グリーグの生まれた町で、彼の名を冠したコンサートホールがある。","en":"Bergen"},{"t":"トロルハウゲン","kind":"place","d":"ベルゲン近郊にあるグリーグの旧邸。現在は記念館として公開され、夫妻の墓もある。","en":"Troldhaugen"},{"t":"イプセン","kind":"person","d":"ヘンリック・イプセン（1828〜1906）。ノルウェーの劇作家。『ペール・ギュント』の劇音楽をグリーグに依頼した。","en":"Henrik Ibsen"},{"t":"ペール・ギュント","kind":"work","d":"イプセンの戯曲(1867)と、グリーグの劇音楽(1874〜75)。「朝」や「山の魔王の宮殿にて」は組曲として有名。","en":"Peer Gynt"},{"t":"抒情小品集","kind":"work","d":"グリーグのピアノ小品集。1867〜1901年に全10集が出版された。「春に寄す」などを含む。","en":"Lyric Pieces"},{"t":"後期ロマン派","kind":"term","d":"19世紀末から20世紀初頭の、巨大な管弦楽と複雑な和声を特徴とする様式。マーラーが代表的な作曲家。","en":"Late Romanticism"},{"t":"ウィーン宮廷歌劇場","kind":"place","d":"ウィーンの歌劇場（現在のウィーン国立歌劇場）。マーラーが1897年から約10年間、監督を務めた。","en":"Vienna Court Opera"},{"t":"アルマ・マーラー","kind":"person","d":"マーラーの妻（1879〜1964）。画家の娘で、自身も作曲を学んだ。1902年にマーラーと結婚した。","en":"Alma Mahler"},{"t":"大地の歌","kind":"work","d":"マーラーの作品(1908〜09)。中国の詩のドイツ語訳による、独唱つきの交響曲的な連作。初演は死後だった。","en":"Das Lied von der Erde"},{"t":"交響曲第2番「復活」","kind":"work","d":"マーラーの交響曲(1894年完成)。終楽章で独唱と合唱が復活への希望を歌う。","en":"Symphony No. 2 Resurrection"},{"t":"印象派","kind":"term","d":"光や空気の移ろいを捉えようとした19世紀末フランスの芸術潮流。音楽ではドビュッシーやラヴェルがこの名で呼ばれる。","en":"Impressionism"},{"t":"全音音階","kind":"term","d":"隣り合う音がすべて全音の間隔で並ぶ6音の音階。調性感が曖昧になり、ドビュッシーが好んで用いた。","en":"Whole-tone scale"},{"t":"ガムラン","kind":"term","d":"インドネシアの打楽器中心の合奏音楽。ドビュッシーは1889年のパリ万博で聴き、影響を受けたとされる。","en":"Gamelan"},{"t":"パリ万国博覧会","kind":"event","d":"1889年にパリで開かれた万博。エッフェル塔が建てられ、ドビュッシーはここでジャワのガムランを聴いたとされる。","en":"Exposition Universelle (1889)"},{"t":"マラルメ","kind":"person","d":"ステファヌ・マラルメ（1842〜1898）。フランス象徴派の詩人。その詩『牧神の午後』がドビュッシーの管弦楽曲の源となった。","en":"Stéphane Mallarmé"},{"t":"葛飾北斎","kind":"person","d":"江戸時代の浮世絵師（1760ごろ〜1849）。『神奈川沖浪裏』が有名。ドビュッシー『海』の初版の表紙に波の絵が使われたとされる。","en":"Katsushika Hokusai"},{"t":"ローマ大賞","kind":"event","d":"フランスの国家が与えた芸術家の登竜門の賞。受賞者はローマに留学できた。ドビュッシーは1884年に受賞し、ラヴェルは落選を重ねた。","en":"Prix de Rome"},{"t":"ペレアスとメリザンド","kind":"work","d":"ドビュッシー唯一の完成したオペラ(1902)。メーテルリンクの劇による。語るような旋律で進む。","en":"Pelléas et Mélisande"},{"t":"ボレロ","kind":"work","d":"ラヴェルの管弦楽曲(1928)。同一の旋律とリズムが続き、楽器を加えて音量を高める。バレエ音楽として作曲された。","en":"Boléro"},{"t":"イダ・ルビンシュタイン","kind":"person","d":"ロシア出身のダンサー（1883〜1960）。自らの舞踊団のためにラヴェルへ『ボレロ』を依頼した。","en":"Ida Rubinstein"},{"t":"ロシア・バレエ団","kind":"term","d":"ディアギレフが1909年にパリで旗揚げしたバレエ団。ストラヴィンスキーやラヴェルが作品を書いた。","en":"Ballets Russes"},{"t":"セルゲイ・ディアギレフ","kind":"person","d":"ロシアの興行師（1872〜1929）。ロシア・バレエ団を率い、ストラヴィンスキーを見出した。","en":"Sergei Diaghilev"},{"t":"春の祭典","kind":"work","d":"ストラヴィンスキーのバレエ音楽(1913)。ニジンスキー振付、パリで初演され、激しい反応を呼んだと伝わる。","en":"The Rite of Spring"},{"t":"新古典主義","kind":"term","d":"18世紀の均整のとれた形式や様式に学ぶ20世紀の潮流。ストラヴィンスキーは1920年ごろからこの方向へ進んだ。","en":"Neoclassicism"},{"t":"十二音技法","kind":"term","d":"1オクターブの12音を一定の順序で使う作曲法。シェーンベルクが確立。ストラヴィンスキーも晩年に取り入れた。","en":"Twelve-tone technique"},{"t":"シャンゼリゼ劇場","kind":"place","d":"パリの劇場（1913年開場）。同年の『春の祭典』初演の舞台となった。","en":"Théâtre des Champs-Élysées"},{"t":"クレモナ","kind":"place","d":"北イタリア・ロンバルディア地方の都市。アマティ、ストラディヴァリ、グァルネリらが工房を構えた弦楽器製作の中心地。","en":"Cremona"},{"t":"アントニオ・ストラディヴァリ","kind":"person","d":"クレモナの弦楽器製作者（1644ごろ〜1737）。名器ストラディヴァリウスの作り手で、長い生涯に多数の楽器を残した。","en":"Antonio Stradivari"},{"t":"アマティ家","kind":"person","d":"クレモナの弦楽器製作者の一族。16世紀のアンドレア・アマティが現代型ヴァイオリンの原型を築いたとされる。","en":"Amati family"},{"t":"フランソワ・トゥルテ","kind":"person","d":"パリの弓製作者（1747〜1835）。現代のヴァイオリン族の弓の標準を定めた人物とされる。","en":"Francois Tourte"},{"t":"タルティーニ","kind":"person","d":"ジュゼッペ・タルティーニ（1692〜1770）。イタリアの作曲家・ヴァイオリン奏者で、『悪魔のトリル』で知られる。","en":"Giuseppe Tartini"},{"t":"ヤッシャ・ハイフェッツ","kind":"person","d":"20世紀を代表するヴァイオリン奏者（1901〜1987）。ヴィリニュス生まれで米国で活躍。グァルネリ・デル・ジェズの愛用者。","en":"Jascha Heifetz"},{"t":"無伴奏チェロ組曲","kind":"work","d":"バッハが作曲した全6曲の独奏チェロのための組曲。カザルスの演奏と録音で演奏会の中心的な作品と認められた。","en":"Cello Suites"},{"t":"パブロ・カザルス","kind":"person","d":"スペイン・カタルーニャ出身のチェロ奏者（1876〜1973）。バッハの無伴奏チェロ組曲を演奏会曲目として定着させたとされる。","en":"Pablo Casals"},{"t":"ムスティスラフ・ロストロポーヴィチ","kind":"person","d":"旧ソ連出身のチェロ奏者・指揮者（1927〜2007）。20世紀後半を代表する名手で、ストラディヴァリのチェロ『デュポール』を愛用した。","en":"Mstislav Rostropovich"},{"t":"バルトロメオ・クリストフォリ","kind":"person","d":"イタリアのチェンバロ製作者（1655〜1731）。フィレンツェのメディチ家に仕え、1700年ごろにピアノの原型を完成させたとされる。","en":"Bartolomeo Cristofori"},{"t":"フィレンツェ","kind":"place","d":"イタリア中部トスカーナの都市。メディチ家の宮廷でクリストフォリがピアノを考案し、初期オペラが生まれた地でもある。","en":"Florence"},{"t":"ブロードウッド社","kind":"term","d":"ロンドンのピアノ製造会社。力強い響きのイギリス式ピアノで知られ、ベートーヴェンにも楽器を贈った。","en":"Broadwood"},{"t":"プレイエル社","kind":"term","d":"パリのピアノ製造会社。繊細な音色でショパンに愛され、チェンバロやハープの製作でも知られた。","en":"Pleyel"},{"t":"エラール社","kind":"term","d":"パリの楽器製造会社。ピアノの連打機構とダブルアクション式ペダルハープを開発し、リストも愛用したとされる。","en":"Erard"},{"t":"ワンダ・ランドフスカ","kind":"person","d":"ポーランド出身の鍵盤楽器奏者（1879〜1959）。20世紀初頭にチェンバロを演奏会に復活させ、古楽復興の先駆者となった。","en":"Wanda Landowska"},{"t":"ルッカース家","kind":"person","d":"16〜17世紀にアントウェルペンで活躍したチェンバロ製作者の一族。その楽器は後世の製作や改造の模範とされた。","en":"Ruckers family"},{"t":"通奏低音","kind":"term","d":"バロック音楽で、低音の旋律と和音の伴奏を鍵盤楽器などが受け持つ書法。チェンバロやオルガンが担った。","en":"basso continuo"},{"t":"ゴルトベルク変奏曲","kind":"work","d":"バッハ作曲の鍵盤作品。主題の後に30の変奏が続き、2段鍵盤のチェンバロのために書かれた。","en":"Goldberg Variations"},{"t":"ドメニコ・スカルラッティ","kind":"person","d":"イタリア生まれの作曲家・鍵盤奏者（1685〜1757）。多数の鍵盤ソナタを残し、ヘンデルと同年の生まれ。","en":"Domenico Scarlatti"},{"t":"リューベック","kind":"place","d":"北ドイツの港湾都市。聖マリア教会でブクステフーデがオルガニストを務め、若きバッハが訪ねたと伝わる。","en":"Lubeck"},{"t":"ジルバーマン","kind":"person","d":"ゴットフリート・ジルバーマン（1683〜1753）。ザクセンのオルガン製作者で、ピアノも手がけた。バッハが試奏した話が伝わる。","en":"Gottfried Silbermann"},{"t":"トッカータとフーガ ニ短調","kind":"work","d":"バッハ作と伝わるオルガン曲（BWV565）。劇的な冒頭で広く知られるが、作者や成立年代には議論がある。","en":"Toccata and Fugue in D minor"},{"t":"テオバルト・ベーム","kind":"person","d":"ドイツの笛製作者・フルート奏者（1794〜1881）。1847年ごろ、金属製の円筒管をもつ現代フルートを完成させた。","en":"Theobald Boehm"},{"t":"クヴァンツ","kind":"person","d":"ヨハン・ヨアヒム・クヴァンツ（1697〜1773）。ドイツのフルート奏者・作曲家で、フリードリヒ大王の師。奏法書でも知られる。","en":"Johann Joachim Quantz"},{"t":"牧神の午後への前奏曲","kind":"work","d":"ドビュッシーの管弦楽曲（1894年初演）。マラルメの詩に着想を得て、冒頭の無伴奏フルートの旋律で知られる。","en":"Prelude to the Afternoon of a Faun"},{"t":"音楽の捧げもの","kind":"work","d":"バッハが1747年に出版した曲集。フリードリヒ大王から与えられた主題による作品群で、フルートを含む三重奏ソナタも収める。","en":"The Musical Offering"},{"t":"ヨハン・クリストフ・デンナー","kind":"person","d":"ニュルンベルクの管楽器製作者（1655〜1707）。1700年ごろ、シャリュモーを改良してクラリネットを生んだとされる。","en":"Johann Christoph Denner"},{"t":"ニュルンベルク","kind":"place","d":"ドイツ南部バイエルン地方の都市。古くから管楽器の製作が盛んで、クラリネットもここで生まれたとされる。","en":"Nuremberg"},{"t":"アントン・シュタードラー","kind":"person","d":"ウィーンのクラリネット奏者（1753〜1812）。モーツァルトと親交が深く、五重奏曲と協奏曲を書いてもらった名手。","en":"Anton Stadler"},{"t":"リヒャルト・ミュールフェルト","kind":"person","d":"ドイツのクラリネット奏者（1856〜1907）。ブラームスが晩年にクラリネット作品を書くきっかけとなった名手。","en":"Richard Muhlfeld"},{"t":"ベニー・グッドマン","kind":"person","d":"米国のクラリネット奏者（1909〜1986）。スウィング・ジャズの王と呼ばれ、クラシックの作品も演奏した。","en":"Benny Goodman"},{"t":"ジャズ","kind":"term","d":"20世紀初めに米国で生まれた音楽。即興演奏を特徴とし、クラリネットやサクソフォンが重要な役を担ってきた。","en":"jazz"},{"t":"アドルフ・サックス","kind":"person","d":"ベルギー出身の楽器製作者（1814〜1894）。パリで活動し、1840年代にサクソフォンを発明した。","en":"Adolphe Sax"},{"t":"チャーリー・パーカー","kind":"person","d":"米国のアルト・サクソフォン奏者（1920〜1955）。ビバップを確立した中心人物で、モダン・ジャズに大きな影響を与えた。","en":"Charlie Parker"},{"t":"序奏とアレグロ","kind":"work","d":"ラヴェルが1905年に書いた、ハープ・フルート・クラリネットと弦楽四重奏のための作品。エラール社の依頼によるとされる。","en":"Introduction and Allegro"},{"t":"交響曲第103番「太鼓連打」","kind":"work","d":"ハイドンがロンドンのために書いた交響曲。冒頭のティンパニの連打が通称の由来。","en":"Symphony No. 103 'Drumroll'"},{"t":"荒城の月","kind":"work","d":"土井晩翠の詩に滝廉太郎が曲を付けた歌曲。山田耕筰の編曲版でも広く歌われる。","en":"Kojo no Tsuki"},{"t":"組歌「四季」","kind":"work","d":"滝廉太郎が1900年に作った、春夏秋冬を歌う4曲の組歌。第1曲が「花」。","en":"Shiki (song cycle)"},{"t":"土井晩翠","kind":"person","d":"仙台出身の詩人。「荒城の月」の詞を書き、滝廉太郎が曲を付けた。","en":"Doi Bansui"},{"t":"東京音楽学校","kind":"place","d":"東京藝術大学音楽学部の前身。滝廉太郎や山田耕筰が学んだ官立の音楽教育機関。","en":"Tokyo Music School"},{"t":"岡城跡","kind":"place","d":"大分県竹田市にある城跡。滝廉太郎が少年期を過ごした地で、「荒城の月」の着想の地とされる。","en":"Oka Castle ruins"},{"t":"唱歌","kind":"term","d":"明治期に学校教育のために作られた歌。滝廉太郎は「荒城の月」「お正月」などを残した。","en":"Shoka"},{"t":"北原白秋","kind":"person","d":"詩人。山田耕筰と組み、「この道」「からたちの花」などの歌曲を生んだ。","en":"Kitahara Hakushu"},{"t":"三木露風","kind":"person","d":"詩人。北海道のトラピスト修道院に暮らした時期もある。詞に山田耕筰が曲を付けた「赤とんぼ」で知られる。","en":"Miki Rofu"},{"t":"マックス・ブルッフ","kind":"person","d":"ドイツの作曲家。山田耕筰がベルリン留学中に作曲を学んだ師とされる。","en":"Max Bruch"},{"t":"赤とんぼ","kind":"work","d":"三木露風の詞による童謡。山田耕筰が1927年に曲を付けた日本を代表する歌曲。","en":"Akatombo"},{"t":"からたちの花","kind":"work","d":"北原白秋の詞による歌曲。山田耕筰が1925年に作曲し、日本語の抑揚を生かした。","en":"Karatachi no Hana"},{"t":"日本交響楽協会","kind":"event","d":"1925年に山田耕筰らが設立に関わった管弦楽団。日本の管弦楽活動の基礎を作った。","en":"Japan Symphony Association"},{"t":"六段の調べ","kind":"work","d":"箏の代表的な独奏曲。八橋検校の作と伝わり、六つの段で構成される。","en":"Rokudan no Shirabe"},{"t":"箏曲","kind":"term","d":"箏を中心とする音楽の総称。八橋検校が基礎を築き、宮城道雄が近代化した。","en":"Sokyoku"},{"t":"検校","kind":"term","d":"江戸時代に盲人の音楽家や鍼灸師などが就いた最高位。八橋検校はその位にあった。","en":"Kengyo"},{"t":"当道座","kind":"term","d":"中世から江戸時代にかけて盲人が組織した自治団体。箏曲や三味線音楽の担い手を支えた。","en":"Todoza"},{"t":"筑紫箏","kind":"term","d":"北九州で伝わった箏の流派。八橋検校はこれを学んで箏曲を発展させたとされる。","en":"Tsukushi-goto"},{"t":"箏組歌","kind":"term","d":"歌を伴う箏の古典曲集。八橋検校が整えたと伝わり、箏曲の基礎になった。","en":"Kumiuta"},{"t":"平調子","kind":"term","d":"箏の基本的な調弦。八橋検校が整えたと伝わり、日本的な旋律の土台となった。","en":"Hirajoshi"},{"t":"生田流","kind":"term","d":"箏曲の二大流派のひとつで、江戸中期に生田検校が興した。角爪を用いる。","en":"Ikuta-ryu"},{"t":"山田流","kind":"term","d":"箏曲の二大流派のひとつで、江戸後期に山田検校が興した。丸爪を用い、語りを重視する。","en":"Yamada-ryu"},{"t":"十七絃","kind":"term","d":"宮城道雄が1921年に考案した低音の箏。十七本の弦を持ち、合奏の低音を支える。","en":"Jushichigen"},{"t":"新日本音楽","kind":"term","d":"大正から昭和にかけ、宮城道雄らが洋楽の要素を取り入れて進めた邦楽の革新運動。","en":"Shin Nihon Ongaku"},{"t":"仁川","kind":"place","d":"朝鮮半島西岸の港町。宮城道雄が少年期に渡り、作曲を始めた地とされる。","en":"Incheon"},{"t":"ルネ・シュメー","kind":"person","d":"フランスのヴァイオリニスト。来日して宮城道雄と共演し、「春の海」を海外に紹介した。","en":"Renee Chemet"},{"t":"春の海","kind":"work","d":"宮城道雄が作曲した箏と尺八の二重奏曲。正月の定番曲として親しまれる。","en":"Haru no Umi"},{"t":"雅楽","kind":"term","d":"古代に大陸から伝わり日本で整えられた宮廷音楽。笙や琵琶、箏などが用いられる。","en":"Gagaku"},{"t":"管絃","kind":"term","d":"雅楽のうち、舞を伴わない器楽合奏。笙や篳篥、龍笛などの管楽器と、箏や琵琶などで奏する。","en":"Kangen"},{"t":"越天楽","kind":"work","d":"雅楽の代表曲のひとつ。管絃で演奏され、笙が和音で曲を支える。","en":"Etenraku"},{"t":"合竹","kind":"term","d":"笙が複数の音を同時に鳴らす和音の奏法。雅楽の響きを特徴づける。","en":"Aitake"},{"t":"セレモニアル","kind":"work","d":"武満徹が笙と管弦楽のために書いた曲。1992年に初演された。","en":"Ceremonial (An Autumn Ode)"},{"t":"宮田まゆみ","kind":"person","d":"笙奏者。笙の現代曲の演奏で知られ、武満徹の作品でも演奏した。","en":"Miyata Mayumi"},{"t":"日本狂詩曲","kind":"work","d":"伊福部昭が1935年に作った管弦楽曲。チェレプニン賞を受けた。","en":"Japanese Rhapsody"},{"t":"シンフォニア・タプカーラ","kind":"work","d":"伊福部昭の交響曲。題名は「立って踊る」を意味するアイヌ語に由来する。","en":"Sinfonia Tapkaara"},{"t":"ゴジラ","kind":"work","d":"1954年公開の特撮映画。伊福部昭の音楽がテーマとして広く知られる。","en":"Godzilla"},{"t":"ラウダ・コンチェルタータ","kind":"work","d":"伊福部昭が1979年に書いた、二十絃箏と管弦楽のための協奏曲。","en":"Lauda Concertata"},{"t":"二十絃箏","kind":"term","d":"二十本の弦を持つ箏。伊福部昭が協奏曲を書いたことでも知られる。","en":"Nijugen-so"},{"t":"アイヌ音楽","kind":"term","d":"北海道の先住民族アイヌの歌や舞踊。伊福部昭は少年期に触れ、作風に影響を受けた。","en":"Ainu music"},{"t":"チェレプニン賞","kind":"event","d":"作曲家アレクサンドル・チェレプニンが募った作曲賞。伊福部昭が1935年に日本狂詩曲で受けた。","en":"Tcherepnin Prize"},{"t":"芥川也寸志","kind":"person","d":"作曲家。作家・芥川龍之介の三男で、伊福部昭に師事した門下のひとり。","en":"Akutagawa Yasushi"},{"t":"ノヴェンバー・ステップス","kind":"work","d":"武満徹が1967年に作った、琵琶・尺八と管弦楽の 『友情』などで人道主義を描き、のち「新しき村」を作った"},{"t":"志賀直哉","n":"簡潔な文体で知られ、「小説の神様」と呼ばれた"},{"t":"有島武郎","n":"『或る女』『一房の葡萄』などを著した"}],"anecdotes":["志賀直哉は、簡潔で無駄のない文章から「小説の神様」と呼ばれ、多くの後輩作家に影響を与えた。","武者小路実篤は、理想の共同体をつくろうと、1918年に宮崎県で「新しき村」の活動を始めた。","『白樺』は、西洋美術の図版を多く載せ、日本の若者に新しい芸術を紹介する役割も果たした。"],"trivia":[{"f":"白樺派の中心となった作家たちの多くは、学習院に学んだ裕福な家の出身で、同人雑誌『白樺』で活動を始めた。","q":"白樺派の作家たちの共通点として挙げられる学校はどこか。","a":"学習院","w":["東京帝国大学の法学部","慶應義塾の文学部","第一高等学校の寮"]},{"f":"武者小路実篤は、1918年に宮崎県の山間に「新しき村」を作り、理想の共同生活を実践した。","q":"武者小路実篤が作った理想の共同体は何か。","a":"新しき村","w":["桃源の里","白樺の園","理想郷の会"]},{"f":"『白樺』は、ゴッホやセザンヌ、ロダンなど、西洋の画家や彫刻家を日本に紹介したことでも知られる。","q":"『白樺』が日本に紹介した彫刻家は誰か。","a":"ロダン","w":["ミケランジェロ","ドナテッロ","ブランクーシ"]}],"people":[],"related":["志賀直哉","武者小路実篤","有島武郎","私小説","夏目漱石"]},{"id":"genbun","name":"近代文学の口語文（言文一致）","full":"言文一致運動","en":"Genbun Itchi Movement","region":"日本","category":"潮流・運動","when":"明治20年前後","where":"日本","era":"近代","tagline":"話し言葉に近い文体で書く運動が、近代の日本語の文章をつくった","facts":[{"t":"文語から口語へ","n":"従来の文語体に代わり、話し言葉に近い文で書こうとした"},{"t":"明治20年前後","n":"1880年代後半に、小説家たちが新しい文体を試みた"},{"t":"文末表現の工夫","n":"「だ」「です」「である」など、文末の形が模索された"}],"famous":[{"t":"二葉亭四迷","n":"『浮雲』（1887年〜）で、口語体の小説を試みた"},{"t":"山田美妙","n":"「です」調で、言文一致の小説を書いた"},{"t":"尾崎紅葉","n":"「である」調を使った文体で、人気を集めた"}],"anecdotes":["二葉亭四迷の筆名は、「くたばってしまえ」と自分を罵ったことに由来するという説が伝わる。","二葉亭は、ロシア文学の翻訳でも口語体を試み、ツルゲーネフの作品を訳して評判を得た。","夏目漱石の『吾輩は猫である』は、口語体の文章で書かれ、近代の話し言葉の文体を広めたとされる。"],"trivia":[{"f":"二葉亭四迷の『浮雲』は、1887年に発表が始まり、口語体で書かれた近代小説の先駆けとされる。","q":"言文一致体の先駆けとされる、二葉亭四迷の作品はどれか。","a":"浮雲","w":["舞姫","金色夜叉","五重塔"]},{"f":"二葉亭四迷の筆名は、「くたばってしめえ」と自らを罵ったことに由来するという説が、広く語られている。","q":"二葉亭四迷の筆名の由来として伝わる説は何か。","a":"自分を罵る言葉","w":["師の号から一字を借りた","出身地の地名にちなんだ","愛読した詩集の名にちなんだ"]},{"f":"森鴎外は『舞姫』を、古い雅文体で書いており、言文一致が広まる前の文語体の名作として今も読まれる。","q":"森鴎外が『舞姫』で用いた文体はどれか。","a":"雅文体（文語体）","w":["口語体","漢文訓読体","候文"]}],"people":["夏目漱石","森鴎外"],"related":["夏目漱石","森鴎外","二葉亭四迷","浮雲","尾崎紅葉"]}],"glossary":[{"t":"神曲","kind":"work","d":"ダンテが著した、地獄・煉獄・天国を巡る長編叙事詩。三部構成で、全100歌からなる。","en":"The Divine Comedy"},{"t":"ベアトリーチェ","kind":"person","d":"ダンテが生 三人の亡霊に導かれ、改心する。","en":"A Christmas Carol"},{"t":"ロンドン","kind":"place","d":"イギリスの首都。ディケンズが幼少期を過ごし、作品の多くの舞台にもなった。","en":"London"},{"t":"ヴィクトリア朝","kind":"event","d":"ヴィクトリア女王が在位した1837年から1901年の時代。産業革命が進み、ディケンズが活躍した。","en":"Victorian era"},{"t":"罪と罰","kind":"work","d":"ドストエフスキーの1866年の長編。貧しい青年が犯した殺人と、その後の苦悩を描く。","en":"Crime and Punishment"},{"t":"カラマーゾフの兄弟","kind":"work","d":"ドストエフスキー最後の長編。父と三人の兄弟を軸に、信仰、自由、罪を問う。","en":"The Brothers Karamazov"},{"t":"シベリア","kind":"place","d":"ロシア東部の広大な地域。ドストエフスキーは流刑でこの地の監獄に約4年間送られた。","en":"Siberia"},{"t":"ペテルブルク","kind":"place","d":"ロシア帝国の首都として栄えた都市。ドストエフスキーの『罪と罰』の舞台となった。","en":"Saint Petersburg"},{"t":"戦争と平和","kind":"work","d":"トルストイの長編。ナポレオン戦争期のロシアを、貴族の家族を通して壮大に描く。","en":"War and Peace"},{"t":"アンナ・カレーニナ","kind":"work","d":"トルストイの長編。上流社会の人妻アンナの恋と悲劇を、もう一つの家庭と対比して描く。","en":"Anna Karenina"},{"t":"ヤースナヤ・ポリャーナ","kind":"place","d":"モスクワの南にあるトルストイの領地。生まれ、暮らし、作品を書いた場所である。","en":"Yasnaya Polyana"},{"t":"変身","kind":"work","d":"カフカの1915年の中編。ある朝、巨大な虫になっていた青年と、その家族の姿を描く。","en":"The Metamorphosis"},{"t":"審判","kind":"work","d":"カフカの長編。理由を知らされないまま、訴追された銀行員の運命を描く。没後に刊行された。","en":"The Trial"},{"t":"プラハ","kind":"place","d":"現在のチェコの首都。カフカが生まれ、ドイツ語で作品を書いた街である。","en":"Prague"},{"t":"マックス・ブロート","kind":"person","d":"カフカの友人の作家。遺言に背いて遺稿を出版し、カフカの名を世に広めた。","en":"Max Brod"},{"t":"カミュ","kind":"person","d":"フランスの作家（1913〜1960）。『異邦人』などで不条理を描き、1957年にノーベル文学賞を受けた。","en":"Albert Camus"},{"t":"老人と海","kind":"work","d":"ヘミングウェイの1952年の中編。老漁師が巨大な魚と数日間闘う姿を、簡潔な文体で描く。","en":"The Old Man and the Sea"},{"t":"日はまた昇る","kind":"work","d":"ヘミングウェイの1926年の長編。大戦後のパリやスペインを舞台に、若者たちを描く。","en":"The Sun Also Rises"},{"t":"失われた世代","kind":"term","d":"第一次大戦後に成人した、価値観を見失った若者たちを指す呼び名。ヘミングウェイらが代表。","en":"Lost Generation"},{"t":"スペイン内戦","kind":"event","d":"1936年から1939年にかけてスペインで起きた内戦。ヘミングウェイは取材に赴き、作品の題材とした。","en":"Spanish Civil War"},{"t":"ホメロス","kind":"person","d":"古代ギリシアの詩人。『イリアス』『オデュッセイア』の作者とされるが、実像は定かでない。","en":"Homer"},{"t":"イリアス","kind":"work","d":"ホメロスの作とされる叙事詩。トロイア戦争の最中に起きた、英雄アキレウスの怒りを描く。","en":"Iliad"},{"t":"オデュッセイア","kind":"work","d":"ホメロスの作とされる叙事詩。トロイア戦争後、英雄オデュッセウスが故郷へ帰る長い旅を描く。","en":"Odyssey"},{"t":"アリストテレス","kind":"person","d":"古代ギリシアの哲学者（前384〜前322）。『詩学』で悲劇の効果を論じ、後世に影響した。","en":"Aristotle"},{"t":"カタルシス","kind":"term","d":"アリストテレスが『詩学』で、悲劇が観客の感情を浄化する働きを指して用いた語。","en":"Catharsis"},{"t":"オイディプス王","kind":"work","d":"ソポクレスの悲劇。知らぬまま父を殺し母を妻とした王が、真実に突き当たる筋。","en":"Oedipus Rex"},{"t":"ペトラルカ","kind":"person","d":"イタリアの詩人（1304〜1374）。ラウラへの恋を歌った詩集で、ソネットの手本を示した。","en":"Petrarch"},{"t":"ヴィルヘルム・マイスター","kind":"work","d":"ゲーテの教養小説。商家の青年が演劇に憧れ、遍歴を経て成長していく物語。","en":"Wilhelm Meister"},{"t":"魔の山","kind":"work","d":"トーマス・マンが1924年に発表した長編。スイスの療養所で過ごす青年の精神的成長を描く。","en":"The Magic Mountain"},{"t":"ワーズワース","kind":"person","d":"イギリス・ロマン派の詩人（1770〜1850）。コールリッジと『抒情民謡集』を出し、自然を詠んだ。","en":"William Wordsworth"},{"t":"バイロン","kind":"person","d":"イギリスのロマン派詩人（1788〜1824）。ギリシア独立戦争に参加し、現地で亡くなった。","en":"Lord Byron"},{"t":"バルザック","kind":"person","d":"フランスの小説家（1799〜1850）。連作『人間喜劇』で、同時代の社会全体を描こうとした。","en":"Honore de Balzac"},{"t":"フローベール","kind":"person","d":"フランスの小説家（1821〜1880）。『ボヴァリー夫人』で知られ、文体への徹底したこだわりで有名。","en":"Gustave Flaubert"},{"t":"ボヴァリー夫人","kind":"work","d":"フローベールの1857年の長編。田舎医者の妻エンマの、夢と幻滅を冷静に描いた。","en":"Madame Bovary"},{"t":"異邦人","kind":"work","d":"カミュの1942年の小説。母の死にも感情を示さない青年ムルソーを通して、不条理を描く。","en":"The Stranger"},{"t":"ゴドーを待ちながら","kind":"work","d":"ベケットの戯曲。来るはずのゴドーを待ち続ける二人の男を描き、1953年にパリで初演された。","en":"Waiting for Godot"},{"t":"ベケット","kind":"person","d":"アイルランド出身の作家（1906〜1989）。『ゴドーを待ちながら』で知られ、1969年にノーベル文学賞を受けた。","en":"Samuel Beckett"},{"t":"大江健三郎","kind":"person","d":"日本の小説家（1935〜2023）。1994年に、日本人として二人目のノーベル文学賞を受けた。","en":"Oe Kenzaburo"},{"t":"スウェーデン・アカデミー","kind":"term","d":"1786年に創設された、ストックホルムの学術団体。ノーベル文学賞の選考を担う。","en":"Swedish Academy"},{"t":"源氏物語","kind":"work","d":"紫式部が著した五十四帖の長編物語。光源氏と、その子孫の恋と栄華、悲哀を描く。","en":"The Tale of Genji"},{"t":"光源氏","kind":"person","d":"『源氏物語』の主人公。天皇の子として生まれながら臣下となり、数々の恋愛を重ねる。","en":"Hikaru Genji"},{"t":"藤原道長","kind":"person","d":"平安中期の権力者。娘の彰子を一条天皇に入れ、仕える紫式部を後援したとされる。","en":"Fujiwara no Michinaga"},{"t":"平安京","kind":"place","d":"794年に都が移された、今の京都にあたる都。紫式部や清少納言が活躍した舞台である。","en":"Heian-kyo"},{"t":"枕草子","kind":"work","d":"清少納言が著した随筆。四季の趣や宮廷での出来事を、鋭い感性で記した平安の名作。","en":"The Pillow Book"},{"t":"中宮定子","kind":"person","d":"一条天皇の中宮。清少納言が仕えた主人で、文化的な宮廷サロンの中心となった。","en":"Empress Teishi"},{"t":"奥の細道","kind":"work","d":"芭蕉が1689年の旅をもとに綴った紀行文。俳句をまじえ、東北から北陸の道のりを描く。","en":"The Narrow Road to the Deep North"},{"t":"曾良","kind":"person","d":"河合曾良。芭蕉の弟子で、『奥の細道』の旅に同行し、詳細な旅日記を残した。","en":"Kawai Sora"},{"t":"正岡子規","kind":"person","d":"明治の俳人・歌人（1867〜1902）。俳句と短歌の革新を進め、夏目漱石と親交があった。","en":"Masaoka Shiki"},{"t":"小林一茶","kind":"person","d":"信濃出身の江戸後期の俳人（1763〜1827）。庶民的で親しみやすい句を、数多く残した。","en":"Kobayashi Issa"},{"t":"蕉風","kind":"term","d":"芭蕉とその門下の句風を指す。閑寂さや余情を重んじ、俳諧を芸術に高めた。","en":"Basho style"},{"t":"吾輩は猫である","kind":"work","d":"夏目漱石の長編。名もない猫の目から、人間社会をユーモラスに風刺した、デビュー作。","en":"I Am a Cat"},{"t":"坊っちゃん","kind":"work","d":"夏目漱石の1906年の小説。松山の中学に赴任した、直情的な青年教師の痛快な物語。","en":"Botchan"},{"t":"こころ","kind":"work","d":"夏目漱石の1914年の長編。先生の遺書を軸に、人間のエゴと孤独を描いた後期の代表作。","en":"Kokoro"},{"t":"舞姫","kind":"work","d":"森鴎外が1890年に発表した小説。ドイツ留学中の青年と、踊り子との恋の別れを描く。","en":"The Dancing Girl"},{"t":"雁","kind":"work","d":"森鴎外の長編。明治の東京を背景に、高利貸しの妾お玉のひそかな恋を描く。","en":"The Wild Geese"},{"t":"高瀬舟","kind":"work","d":"森鴎外の1916年の短編。罪人を護送する舟の上で、安楽死や足るを知ることを問いかける。","en":"Takasebune"},{"t":"軍医","kind":"term","d":"軍隊で医療を担う将校。森鴎外は陸軍の軍医として働きながら、文筆活動を続けた。","en":"Military surgeon"},{"t":"羅生門","kind":"work","d":"芥川龍之介が1915年に発表した短編。荒れた京の門で、下人が悪へと傾く心理を描く。","en":"Rashomon"},{"t":"蜘蛛の糸","kind":"work","d":"芥川龍之介が1918年に発表した童話。地獄の男に、お釈迦様が一筋の糸を垂らす。","en":"The Spider's Thread"},{"t":"藪の中","kind":"work","d":"芥川龍之介の1922年の短編。一つの事件について、関係者の証言が食い違う構成を取る。","en":"In a Grove"},{"t":"菊池寛","kind":"person","d":"小説家・実業家（1888〜1948）。文藝春秋社を興し、芥川賞と直木賞を創設した。","en":"Kikuchi Kan"},{"t":"銀河鉄道の夜","kind":"work","d":"宮沢賢治の童話。少年ジョバンニが友人カムパネルラと、銀河を走る列車で旅をする。","en":"Night on the Galactic Railroad"},{"t":"注文の多い料理店","kind":"work","d":"宮沢賢治の童話。山奥の西洋 :"京都","era":"古代・中世","tagline":"日本の風物と物語を描く、平安生まれの絵画","facts":[{"t":"成立","n":"中国風の「唐絵」に対し、日本の風景や人物を題材にした絵として平安時代に成立した"},{"t":"形式","n":"絵巻物や屏風、障子の絵として発展し、和歌や物語と結びついた"},{"t":"表現","n":"細い線で目鼻を描く引目鉤鼻や、屋根を省いて室内を見せる吹抜屋台が特色"},{"t":"継承","n":"鎌倉以降は土佐派・住吉派が受け継ぎ、のちの流派にも影響した"}],"famous":[{"t":"源氏物語絵巻","n":"12世紀前半の作と伝わる、『源氏物語』を絵画化した現存最古級の絵巻"},{"t":"鳥獣戯画","n":"兎・蛙・猿などを擬人化して描いた絵巻。京都・高山寺に伝わる"}],"anecdotes":["『鳥獣戯画』は甲・乙・丙・丁の4巻から成り、動物を擬人化した甲巻が特に知られる。","大和絵の「大和」は奈良の地名ではなく、日本を指す語として使われている。"],"trivia":[{"f":"『鳥獣戯画』は甲・乙・丙・丁の4巻で、巻ごとに筆致が異なり、複数の手で描き継がれたとされる。","q":"『鳥獣戯画』の巻ごとの画風が異なる理由とされるのは。","a":"複数の絵師が描き継いだ","w":["後世に全体を描き直した","一人が年齢で画風を変えた","中国の絵を日本で写した"]},{"f":"『源氏物語絵巻』では、屋根や天井を省いて室内を斜め上から見下ろす構図が使われ、吹抜屋台と呼ばれる。","q":"『源氏物語絵巻』で、室内を見せるために屋根や天井を省く構図は。","a":"吹抜屋台","w":["引目鉤鼻","異時同図","蒔絵螺鈿"]}],"people":[],"related":["源氏物語絵巻","鳥獣戯画","唐絵","引目鉤鼻","吹抜屋台","狩野派","屏風絵"]},{"id":"mingei","name":"民藝","full":"民藝（民衆的工芸）","en":"Mingei (folk craft movement)","region":"日本","category":"様式・潮流","when":"1920年代から","where":"日本（東京・京都ほか）","era":"近代","tagline":"名もなき職人の日用品に美を見いだす運動","facts":[{"t":"提唱","n":"思想家の柳宗悦が、陶芸家の濱田庄司、河井寛次郎らと1920年代に提唱した"},{"t":"語","n":"「民衆的工芸」を縮めた造語で、1925年ごろに生まれたとされる"},{"t":"考え方","n":"無名の職人が作る日用品に宿る、健やかで用いてこそ生きる美を重んじた"},{"t":"拠点","n":"1936年、東京の駒場に日本民藝館が開館した"}],"famous":[{"t":"柳宗悦","n":"運動を主導した思想家。朝鮮の陶磁や木喰仏の美を紹介した"},{"t":"濱田庄司","n":"栃木・益子で作陶し、民藝運動を実践した陶芸家"},{"t":"河井寛次郎","n":"京都を拠点とした陶芸家。栄典を辞退したことでも知られる"}],"anecdotes":["柳宗悦は朝鮮の陶磁器の美に感銘を受け、日用の雑器の美を考えるようになったとされる。","日本民藝館は1936年に東京の駒場に開館し、初代館長は柳宗悦が務めた。"],"trivia":[{"f":"「民藝」は柳宗悦らが1925年ごろに作った言葉で、「民衆的工芸」を縮めたものだ。","q":"「民藝」という言葉は、何を縮めたものか。","a":"民衆的工芸","w":["民間伝承芸術","民族の藝能","民営の工房"]},{"f":"民藝運動の陶芸家・河井寛次郎は、文化勲章や人間国宝といった栄典を辞退したことで知られる。","q":"河井寛次郎が辞退したことで知られるのは。","a":"文化勲章などの栄典","w":["日本民藝館の館長職","京都の窯を継ぐ話","東京の美術学校の教職"]}],"people":[],"related":["柳宗悦","濱田庄司","河井寛次郎","日本民藝館","木喰仏"]}],"glossary":[{"t":"モナ・リザ","kind":"work","d":"ダ・ヴィンチが描いた女性の半身像。ルーヴル美術館が所蔵し、輪郭をぼかす表現で名高い。","en":"Mona Lisa"},{"t":"最後の晩餐","kind":"work","d":"ダ・ヴィンチがミラノの修道院食堂に描いた壁画。キリストと十二使徒の食卓の場面を遠近法で構成した。","en":"The Last Supper"},{"t":"ウィトルウィウス的人体図","kind":"work","d":"ダ・ヴィンチの素描。円と正方形に人体を重ね、古代ローマの建築家の比例論を図にした。","en":"Vitruvian Man"},{"t":"スフマート","kind":"term","d":"輪郭線を引かず、色を煙のように溶かして境をぼかす技法。ダ・ヴィンチが得意とした。","en":"Sfumato"},{"t":"フィレンツェ","kind":"place","d":"イタリア中部の都市。メディチ家の庇護のもとでルネサンス美術の中心となり、ダビデ像が置かれた。","en":"Florence"},{"t":"ルーヴル美術館","kind":"place","d":"パリにある世界有数の美術館。『モナ・リザ』などダ・ヴィンチの作品を所蔵する。","en":"Louvre Museum"},{"t":"システィーナ礼拝堂","kind":"place","d":"バチカン宮殿の礼拝堂。ミケランジェロが天井画と『最後の審判』をフレスコで描いた。","en":"Sistine Chapel"},{"t":"ヴァザーリ","kind":"person","d":"16世紀イタリアの画家・建築家。『画家・彫刻家・建築家列伝』でミケランジェロらの伝記を記した。","en":"Giorgio Vasari"},{"t":"ラファエロ","kind":"person","d":"ルネサンス盛期のイタリアの画家。調和のとれた聖母子像を描き、ミケランジェロと同時期にローマで活躍した。","en":"Raffaello Sanzio"},{"t":"ピエタ","kind":"work","d":"ミケランジェロがサン・ピエトロ大聖堂のために彫った大理石像。亡きキリストを抱く聖母を表す。","en":"Pietà"},{"t":"ダビデ像","kind":"work","d":"ミケランジェロがフィレンツェで1501年から04年に彫った大理石像。共和国の象徴とされた。","en":"David"},{"t":"キアロスクーロ","kind":"term","d":"明暗の強い対比で立体感や劇的な効果を生む技法。レンブラントやカラヴァッジョが得意とした。","en":"Chiaroscuro"},{"t":"夜警","kind":"work","d":"レンブラントが1642年に完成させた集団肖像画。アムステルダムの市民隊を躍動的に描いた。","en":"The Night Watch"},{"t":"オランダ黄金時代","kind":"event","d":"17世紀のオランダで貿易と経済が栄え、市民が絵の買い手となって美術が花開いた時代。レンブラントやフェルメールが活躍した。","en":"Dutch Golden Age"},{"t":"カラヴァッジョ","kind":"person","d":"17世紀初頭にローマで活躍したイタリアの画家。強い明暗の対比でバロック絵画に影響を与え、レンブラントにも通じる。","en":"Caravaggio"},{"t":"デルフト","kind":"place","d":"オランダの都市。フェルメールが生涯の大半を過ごした地で、『デルフトの眺望』の題材となった。","en":"Delft"},{"t":"真珠の耳飾りの少女","kind":"work","d":"フェルメールの半身像。青いターバンの少女がこちらを振り返る姿で、マウリッツハイス美術館が所蔵する。","en":"Girl with a Pearl Earring"},{"t":"ラピスラズリ","kind":"term","d":"深い青色の鉱物。砕いて高価な青の顔料（ウルトラマリン）にした。フェルメールの青で知られる。","en":"Lapis lazuli"},{"t":"カメラ・オブスクラ","kind":"term","d":"暗い箱や部屋の小さな穴から外の像を映す装置。フェルメールが絵に使ったとする説がある。","en":"Camera obscura"},{"t":"ハン・ファン・メーヘレン","kind":"person","d":"20世紀オランダの画家。フェルメール作と偽る絵を描いて売り、1945年に贋作と自白した。","en":"Han van Meegeren"},{"t":"トローニー","kind":"term","d":"特定の人物を描く肖像ではなく、表情や衣装の面白さを見せる人物画。フェルメールの少女像が例とされる。","en":"Tronie"},{"t":"ベラスケス","kind":"person","d":"17世紀スペインの宮廷画家。『ラス・メニーナス』で知られ、ゴヤやダリが敬意を払った先達である。","en":"Diego Velázquez"},{"t":"ゲルニカ","kind":"work","d":"ピカソが1937年に描いた大作。バスク地方の町への空襲を主題とし、白黒の画面で戦争の悲惨さを表した。","en":"Guernica"},{"t":"プラド美術館","kind":"place","d":"マドリードにあるスペインの国立美術館。ゴヤやベラスケスの作品を多く所蔵する。","en":"Prado Museum"},{"t":"1808年5月3日","kind":"work","d":"ゴヤが1814年に描いた作。ナポレオン軍に銃殺される市民を、白いシャツの男を中心に描いた。","en":"The Third of May 1808"},{"t":"黒い絵","kind":"work","d":"ゴヤが晩年に自宅の壁に描いた暗い連作。『わが子を食らうサトゥルヌス』などがあり、のちにキャンバスへ移された。","en":"Black Paintings"},{"t":"ナポレオン","kind":"person","d":"フランスの軍人・皇帝。1808年にスペインへ軍を送り、ゴヤの『1808年5月3日』の背景となった。","en":"Napoleon Bonaparte"},{"t":"印象・日の出","kind":"work","d":"モネが1872年にル・アーヴルの港を描いた作。「印象派」の名の由来となった。","en":"Impression, Sunrise"},{"t":"睡蓮","kind":"work","d":"モネがジヴェルニーの池を題材に描いた連作。晩年には大画面の装飾画に展開した。","en":"Water Lilies"},{"t":"ジヴェルニー","kind":"place","d":"パリ近郊の村。モネが後半生を過ごして庭と睡蓮の池を造り、多くの作品の舞台とした。","en":"Giverny"},{"t":"ルノワール","kind":"person","d":"フランスの画家。モネと並ぶ印象派の中心で、明るい色調で人物を描いた。","en":"Pierre-Auguste Renoir"},{"t":"印象派展","kind":"event","d":"1874年から86年に計8回開かれた印象派のグループ展。官展サロンに頼らず、画家が自ら開いた。","en":"Impressionist exhibitions"},{"t":"テオ","kind":"person","d":"テオドルス・ファン・ゴッホ。画商でゴッホの弟。兄を経済的にも精神的にも支え、多くの手紙を受けた。","en":"Theo van Gogh"},{"t":"アルル","kind":"place","d":"南仏の古い町。ゴッホが1888年に移り住み、『ひまわり』『夜のカフェテラス』などを描いた。","en":"Arles"},{"t":"ひまわり","kind":"work","d":"ゴッホがアルルで描いた、花瓶のひまわりの連作。黄色の厚塗りで知られる。","en":"Sunflowers"},{"t":"星月夜","kind":"work","d":"ゴッホが1889年にサン＝レミの療養院で描いた夜空の作。渦巻く筆致で知られ、ニューヨーク近代美術館が所蔵する。","en":"The Starry Night"},{"t":"ゴーギャン","kind":"person","d":"フランスの画家。1888年にアルルでゴッホと共同生活を送り、のちタヒチで制作した。","en":"Paul Gauguin"},{"t":"ブラック","kind":"person","d":"ジョルジュ・ブラック。フランスの画家で、ピカソとともにキュビスムを創始した。","en":"Georges Braque"},{"t":"アヴィニョンの娘たち","kind":"work","d":"ピカソが1907年に完成させた大作。人物を角張った面に分解し、キュビスムの出発点となった。","en":"Les Demoiselles d'Avignon"},{"t":"青の時代","kind":"term","d":"ピカソが1901年ごろから04年ごろに青い色調で貧しい人々を描いた時期。『老いたギター弾き』が例である。","en":"Blue Period"},{"t":"セザンヌ","kind":"person","d":"フランスの画家。自然を単純な形で捉える考えがキュビスムに影響し、ピカソらに「父」と仰がれた。","en":"Paul Cézanne"},{"t":"コラージュ","kind":"term","d":"紙片や布などを画面に貼る技法。1912年ごろ、ブラックやピカソが絵画に取り入れた。","en":"Collage"},{"t":"ブルトン","kind":"person","d":"アンドレ・ブルトン。フランスの詩人で、1924年に『シュルレアリスム宣言』を発表し、運動を率いた。","en":"André Breton"},{"t":"記憶の固執","kind":"work","d":"ダリが1931年に描いた、溶けた時計が垂れ下がる作。ニューヨーク近代美術館が所蔵する。","en":"The Persistence of Memory"},{"t":"ガラ","kind":"person","d":"ダリの妻。もとはエリュアールの妻で、のちダリのモデル・支え手として作品に多く登場した。","en":"Gala"},{"t":"マグリット","kind":"person","d":"ベルギーの画家。日常の物を意外に組み合わせる絵で、ダリと並ぶシュルレアリスムの代表とされる。","en":"René Magritte"},{"t":"山水画","kind":"term","d":"山や川などの自然風景を描く東洋画の分野。雪舟が水墨で大成した。","en":"Landscape painting"},{"t":"秋冬山水図","kind":"work","d":"雪舟が描いた、秋と冬を対にした2幅の山水画。力強い線と大胆な構図を示す国宝。","en":"Autumn and Winter Landscapes"},{"t":"天橋立図","kind":"work","d":"雪舟が京都の天橋立を描いた図。実景を俯瞰して写した作として知られる国宝。","en":"View of Amanohashidate"},{"t":"長谷川等伯","kind":"person","d":"桃山期の絵師。『松林図屏風』を描き、雪舟に私淑して水墨画の新境地を開いた。","en":"Hasegawa Tohaku"},{"t":"本阿弥光悦","kind":"person","d":"江戸初期の書家・陶芸家・蒔絵師。宗達と組んで琳派の基礎を築き、京都の鷹峯に工芸の村を開いた。","en":"Hon'ami Koetsu"},{"t":"風神雷神図屏風","kind":"work","d":"俵屋宗達が描いた、風神と雷神を金地に対置した屏風。光琳や抱一も同じ主題に取り組んだ。","en":"Wind God and Thunder God"},{"t":"たらし込み","kind":"term","d":"墨や絵具が乾かないうちに別の色を垂らし、にじみを生かす技法。宗達が得意とし、琳派に受け継がれた。","en":"Tarashikomi"},{"t":"酒井抱一","kind":"person","d":"江戸後期の絵師。光琳に私淑して琳派を江戸で復興し、『夏秋草図屏風』を描いた。","en":"Sakai Hoitsu"},{"t":"尾形乾山","kind":"person","d":"尾形光琳の弟の陶工・絵師。光琳が絵付けをした焼き物を作り、琳派の工芸を代表する。","en":"Ogata Kenzan"},{"t":"紅白梅図屏風","kind":"work","d":"尾形光琳が描いた、中央の川を挟んで紅梅と白梅を配する屏風。熱海のMOA美術館が所蔵する国宝。","en":"Red and White Plum Blossoms"},{"t":"燕子花図屏風","kind":"work","d":"尾形光琳が金地に燕子花の群れだけを描いた屏風。根津美術館が所蔵する国宝。","en":"Irises"},{"t":"冨嶽三十六景","kind":"work","d":"北斎が1830年代に刊行した、富士を各地から描いた風景版画の連作。人気により全46図となった。","en":"Thirty-six Views of Mount Fuji"},{"t":"神奈川沖浪裏","kind":"work","d":"冨嶽三十六景の一図。大波と遠くの富士を描き、海外では「グレート・ウェーブ」の名で知られる。","en":"The Great Wave off Kanagawa"},{"t":"ベロ藍","kind":"term","d":"18世紀に輸入された化学合成の青い顔料（プルシアンブルー）。北斎や広重の版画で、鮮やかな青として広まった。","en":"Prussian blue"},{"t":"北斎漫画","kind":"work","d":"葛飾北斎が描いた絵手本。人物や動植物の絵を集め、全15編で、ヨーロッパの芸術家にも知られた。","en":"Hokusai Manga"},{"t":"錦絵","kind":"term","d":"1765年ごろに完成した、多色摺りの浮世絵版画。北斎や広重の風景版画もこの形式で出された。","en":"Nishiki-e"},{"t":"東海道五十三次","kind":"work","d":"歌川広重が描いた、江戸から京都までの宿場を描く連作。1830年代前半に刊行され、広重の出世作となった。","en":"Fifty-three Stations of the Tokaido"},{"t":"名所江戸百景","kind":"work","d":"歌川広重が晩年に手がけた江戸の名所の連作。近景を大きく切り取る構図で、ゴッホにも影響した。","en":"One Hundred Famous Views of Edo"},{"t":"岡倉天心","kind":"person","d":"明治の思想家・美術行政家。フェノロサとともに日本美術の再評価を進め、日本美術院を創設した。","en":"Okakura Tenshin"},{"t":"朦朧体","kind":"term","d":"輪郭線を使わず色の濃淡で空気や光を表す日本画の描き方。大観と春草が試み、当初は批判された。","en":"Moroutai"},{"t":"日本美術院","kind":"term","d":"1898年に岡倉天心らが創設した美術団体。横山大観らが活動し、展覧会「院展」で知られる。","en":"Japan Art Institute"},{"t":"生々流転","kind":"work","d":"横山大観が1923年に描いた約40メートルの絵巻。水の旅を墨で描き、重要文化財に指定されている。","en":"Seisei Ruten"},{"t":"菱田春草","kind":"person","d":"明治の日本画家。大観とともに朦朧体を試み、『黒き猫』『落葉』などを描いた。","en":"Hishida Shunso"},{"t":"フェノロサ","kind":"person","d":"アメリカ人の哲学者。明治期の日本で伝統美術の価値を説き、岡倉天心とともに東京美術学校の設立に関わった。","en":"Ernest Fenollosa"},{"t":"縄文土器","kind":"term","d":"縄目の文様をもつ日本最古級の土器。岡本太郎は1951年にその造形に衝撃を受けて、日本の美を捉え直した。","en":"Jomon pottery"},{"t":"太陽の塔","kind":"work","d":"岡本太郎が1970年の大阪万博のために作った高さ約70メートルの塔。三つの顔をもつ。","en":"Tower of the Sun"},{"t":"明日の神話","kind":"work","d":"岡本太郎が原爆の悲劇を主題に描いた縦約5.5メートル、横約30メートルの壁画。渋谷駅に設置されている。","en":"Myth of Tomorrow"},{"t":"日本万国博覧会","kind":"event","d":"1970年に大阪で開かれた万国博覧会。テーマ館のシンボルとして岡本太郎の『太陽の塔』が建てられた。","en":"Expo '70"},{"t":"今日の芸術","kind":"work","d":"岡本太郎が1954年に刊行した著書。芸術を専門家だけのものとせず、一般の人に開かれたものとして説いた。","en":"Today's Art"},{"t":"メディチ家","kind":"term","d":"フィレンツェで銀行業により栄えた一族。ルネサンスの芸術家を庇護し、ミケランジェロらを支えた。","en":"House of Medici"},{"t":"ボッティチェリ","kind":"person","d":"ルネサンス期フィレンツェの画家。『ヴィーナスの誕生』『春』で知られ、メディチ家の庇護を受けた。","en":"Sandro Botticelli"},{"t":"ルーベンス","kind":"person","d":"17世紀フランドルの画家。躍動的で豊かな色彩の宗教画・神話画を描き、バロックを代表する。","en":"Peter Paul Rubens"},{"t":"ベルニーニ","kind":"person","d":"17世紀ローマの彫刻家・建築家。『聖テレサの法悦』で知られ、バロック彫刻の第一人者とされる。","en":"Gian Lorenzo Bernini"},{"t":"ドガ","kind":"person","d":"フランスの画家。踊り子や競馬を題材に、印象派展に参加しつつ独自の構図を追求した。","en":"Edgar Degas"},{"t":"ピサロ","kind":"person","d":"フランスの画家。印象派の最年長格で、全8回の印象派展すべてに出品した。","en":"Camille Pissarro"},{"t":"サロン","kind":"term","d":"フランスの官設の美術展。入選は画家の登竜門で、印象派の画家たちはこれに反発して独自の展覧会を開いた。","en":"Salon"},{"t":"エルンスト","kind":"person","d":"ドイツ出身の画家・彫刻家。フロッタージュなどの技法を試した、シュルレアリスムの代表の一人。","en":"Max Ernst"},{"t":"ミロ","kind":"person","d":"スペイン出身の画家。自由な形と鮮やかな色による詩的な画面で、シュルレアリスムに参加した。","en":"Joan Miró"},{"t":"自動記述","kind":"term","d":"意識的な統制を離れ、頭に浮かぶまま書く（描く）手法。ブルトンらシュルレアリストが無意識に迫る方法とした。","en":"Automatism"},{"t":"デペイズマン","kind":"term","d":"物を本来の場所から引き離して意外な場所に置き、違和感と詩情を生む手法。マグリットの作品に多い。","en":"Dépaysement"},{"t":"ブルネレスキ","kind":"person","d":"15世紀フィレンツェの建築家。大聖堂のドームを設計し、線遠近法の実験を最初に行ったとされる。","en":"Filippo Brunelleschi"},{"t":"消失点","kind":"term","d":"遠近法で、平行な線が画面上で集まる一点。『最後の晩餐』ではキリストの頭の近くに置かれた。","en":"Vanishing point"},{"t":"浮絵","kind":"term","d":"江戸中期に流行した、遠近法で奥行きを強調した浮世絵。西洋の画法の影響を示す。","en":"Uki-e"},{"t":"ファン・エイク兄弟","kind":"person","d":"15世紀フランドルの画家兄弟。『ヘントの祭壇画』を描き、油彩の技法を発展させた。","en":"Jan and Hubert van Eyck"},{"t":"テンペラ","kind":"term","d":"卵黄などで顔料を練った絵具、またはその技法。中世から用いられ、速く乾くのが特徴。ダ・ヴィンチも壁画に用いた。","en":"Tempera"},{"t":"ホイッスラー","kind":"person","d":"アメリカ出身の画家。ロンドンやパリで活動し、日本美術に学んだ構図の『ノクターン』連作を描いた。","en":"James McNeill Whistler"},{"t":"ガレ","kind":"person","d":"フランスのガラス工芸家エミール・ガレ。アール・ヌーヴォーを代表し、日本美術の影響を受けた。","en":"Émile Gallé"},{"t":"パリ万国博覧会","kind":"event","d":"19世紀から20世紀にパリで開かれた万博。1867年には日本が初めて公式に参加し、ジャポニスムの広がる契機となった。","en":"Exposition Universelle (Paris)"},{"t":"ドビュッシー","kind":"person","d":"フランスの作曲家。『海』の初版楽譜の表紙に北斎の『神奈川沖浪裏』を用いたことで知られる。","en":"Claude Debussy"},{"t":"蔦屋重三郎","kind":"person","d":"江戸中期の版元。喜多川歌麿や東洲斎写楽を世に出し、浮世絵の出版を支えた。","en":"Tsutaya Juzaburo"},{"t":"菱川師宣","kind":"person","d":"江戸前期の絵師。浮世絵版画の基礎を築き、『見返り美人図』で知られる。","en":"Hishikawa Moronobu"},{"t":"喜多川歌麿","kind":"person","d":"江戸中期の浮世絵師。美人画の名手で、蔦屋重三郎のもとで大首絵の美人を描いた。","en":"Kitagawa Utamaro"},{"t":"東洲斎写楽","kind":"person","d":"江戸後期の浮世絵師。1794年から95年に役者絵を残
