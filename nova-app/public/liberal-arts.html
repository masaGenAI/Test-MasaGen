 (Parallelism)","region":"日本","category":"音・語順・構成","when":"古代（漢詩の受容とともに）","where":"中国・日本（漢詩・和文）","era":"古代・中世","tagline":"形を揃えた二つの句を並べ、対比と調子を生む","facts":[{"t":"しくみ","n":"語の種類や数、句の長さをそろえた二つの句を並べる。意味が対になるものも、似るものもある"},{"t":"漢詩","n":"律詩は八句のうち、第三・四句と第五・六句を対句にする決まりがある"},{"t":"和文","n":"『万葉集』の長歌や『平家物語』の冒頭など、日本の文章にも広く取り入れられた"},{"t":"効果","n":"調子が整い、記憶に残りやすい。語り物では耳で聞いて分かりやすくする効果もある"}],"famous":[{"t":"律詩","n":"唐代に完成した八句の漢詩。日本でも平安時代の漢詩文で盛んに作られた"},{"t":"『平家物語』","n":"冒頭で鐘の声と花の色を対にして、世の無常を表す語り物"},{"t":"『万葉集』","n":"柿本人麻呂らの長歌に対句が多く見られる"}],"anecdotes":["『平家物語』は琵琶の伴奏で語られた。耳で聞く芸能のため、対句のリズムが覚えやすさを支えた。","漢詩の対句では、名詞は名詞、動詞は動詞と、品詞や意味の種類をそろえるのがならわしだった。","短歌では対句は主役ではなく、長歌や軍記物語など長い作品に多く見られる傾向がある。"],"trivia":[{"f":"律詩は八句から成り、第三句と第四句、第五句と第六句を対句にするのが約束事とされる。","q":"律詩（八句）で、対句にするのが決まりとされる句の組は?","a":"三・四句と五・六句","w":["一・二句と三・四句","五・六句と七・八句","一・二句と七・八句"]},{"f":"琵琶法師が語った『平家物語』は、対句を多く含む七五調に近い文体で、耳で聞いて覚えやすいと言われる。","q":"『平家物語』を琵琶の伴奏で語った芸能者は?","a":"琵琶法師","w":["能の役者である猿楽師","説経節を語る説経師","寄席で演じる講談師"]}],"people":[],"related":["対句法・反復法","『平家物語』","琵琶法師","漢詩","律詩","『万葉集』","柿本人麻呂"]}],"glossary":[{"t":"弁論術","kind":"term","d":"説得の技術を体系化した古代の学問。アリストテレスの著作名でもあり、修辞学の源流になった。","en":"Rhetoric"},{"t":"修辞学","kind":"term","d":"言葉を効果的に使い、人を説得し感動させる技術を研究する学問。古代ギリシア・ローマで発達した。","en":"Rhetoric"},{"t":"比喩","kind":"term","d":"あるものを別のものに例えて表す表現の総称。隠喩・直喩・換喩・提喩などを含む。","en":"Figurative language"},{"t":"説得","kind":"term","d":"相手を納得させて考えや行動を変えてもらうこと。弁論術の中心的な目的とされた。","en":"Persuasion"},{"t":"三種の弁論","kind":"term","d":"アリストテレスが分けた、審議・法廷・演示の三つの弁論。聞き手の役割によって区別される。","en":"Three genres of rhetoric"},{"t":"弁論の五部門","kind":"term","d":"弁論の制作を発想・配列・表現・記憶・発表に整理した枠組み。ローマの修辞学で定着した。","en":"Five canons of rhetoric"},{"t":"エンテュメーマ","kind":"term","d":"弁論で使う省略された推論。前提の一部を聞き手の常識に任せる。アリストテレスが論じた。","en":"Enthymeme"},{"t":"三段論法","kind":"term","d":"二つの前提から結論を導く推論の形式。アリストテレスが『分析論前書』で体系化した。","en":"Syllogism"},{"t":"ソフィスト","kind":"term","d":"前5世紀ごろ、報酬を取って弁論術や知識を教えた職業教師。ゴルギアスはその代表の一人。","en":"Sophist"},{"t":"序論","kind":"term","d":"弁論や文章の冒頭部分。聞き手の関心と好意を得て、話題を示す役割をもつ。","en":"Introduction"},{"t":"結論部","kind":"term","d":"弁論や文章の締めくくり。要点をまとめ、聞き手の感情に訴えて行動を促す。","en":"Conclusion"},{"t":"起承転結","kind":"term","d":"漢詩の絶句に由来する四段の構成。物語や文章の展開の型としても使われる。","en":"Kishoutenketsu"},{"t":"PREP法","kind":"term","d":"結論、理由、具体例、結論の順に話す型。ビジネスの説明や発表で使われ、三段構成に通じる。","en":"PREP method"},{"t":"見立て","kind":"term","d":"あるものを別のものになぞらえる日本の表現法。比喩に近く、和歌や庭園、芸能に広く見られる。","en":"Mitate"},{"t":"擬人法","kind":"term","d":"人でないものを人のように表す技法。「風がささやく」など。比喩の一種として扱われる。","en":"Personification"},{"t":"反語","kind":"term","d":"言葉の字面と反対のことを伝える言い方や、疑問の形で強く否定する言い方。アイロニーに近い。","en":"Rhetorical irony"},{"t":"修辞疑問","kind":"term","d":"答えを求めず、疑問の形で主張を強める言い方。聞き手に結論を考えさせる効果がある。","en":"Rhetorical question"},{"t":"アナフォラ","kind":"term","d":"文や句の頭で同じ語句を繰り返す技法。リズムを生み、強調や高揚を作る。反復法の一つ。","en":"Anaphora"},{"t":"トリコロン","kind":"term","d":"三つの語句や節を並べる技法。区切りのよさと完結感を与え、演説でよく使われる。","en":"Tricolon"},{"t":"頭韻","kind":"term","d":"語頭の音をそろえて響きを整える技法。英語やゲルマン詩に多く、弁論でも調子作りに使われる。","en":"Alliteration"},{"t":"ソクラテス","kind":"person","d":"前5世紀のアテネの哲学者。無知を装う問答で知られ、アイロニーの語と結びつく。","en":"Socrates"},{"t":"プラトン","kind":"person","d":"ソクラテスの弟子の哲学者。対話篇『ゴルギアス』で弁論術を批判し、アリストテレスの師となった。","en":"Plato"},{"t":"アレクサンドロス大王","kind":"person","d":"マケドニアの王。若いころ、アリストテレスから教育を受けたと伝わる。","en":"Alexander the Great"},{"t":"ホメロス","kind":"person","d":"古代ギリシアの叙事詩人とされる人物。『イリアス』『オデュッセイア』の作者と伝わる。","en":"Homer"},{"t":"カエサル","kind":"person","d":"共和政ローマ末期の政治家・将軍で、弁論と文章の名手。キケロと同時代を生きた。","en":"Julius Caesar"},{"t":"アントニウス","kind":"person","d":"カエサルの部下だったローマの政治家。キケロと対立し、前43年の最期に関わった。","en":"Mark Antony"},{"t":"ポッジョ・ブラッチョリーニ","kind":"person","d":"15世紀イタリアの人文主義者。古典写本を各地で発見し、『弁論家の教育』の完本を見つけたと伝わる。","en":"Poggio Bracciolini"},{"t":"ヤコブソン","kind":"person","d":"20世紀のロシア出身の言語学者。隠喩と換喩を言語の二つの軸として論じた。","en":"Roman Jakobson"},{"t":"レイコフ","kind":"person","d":"アメリカの言語学者。ジョンソンとの共著で、隠喩を思考の枠組みとする概念メタファー論を広めた。","en":"George Lakoff"},{"t":"キング牧師","kind":"person","d":"アメリカの公民権運動の指導者。1963年の演説は、反復法を生かした名演説として知られる。","en":"Martin Luther King Jr."},{"t":"シモニデス","kind":"person","d":"前6世紀から前5世紀の古代ギリシアの詩人。場所を使う記憶術の創始者と伝わる。","en":"Simonides of Ceos"},{"t":"ソポクレス","kind":"person","d":"前5世紀アテネの悲劇詩人。『オイディプス王』の作者で、劇的アイロニーの名手とされる。","en":"Sophocles"},{"t":"『弁論術』","kind":"work","d":"アリストテレスの著作。説得の手段と弁論の構成を体系的に論じた、西洋修辞学の基本文献。","en":"Rhetoric (Aristotle)"},{"t":"『詩学』","kind":"work","d":"アリストテレスの詩論。悲劇や叙事詩を論じ、隠喩の働きを定義した。","en":"Poetics"},{"t":"『弁論家の教育』","kind":"work","d":"クインティリアヌスの大著。全十二巻で、幼少期からの弁論家の養成を論じた。","en":"Institutio Oratoria"},{"t":"『弁論家について』","kind":"work","d":"キケロの対話体の著作。理想の弁論家には幅広い教養が必要だと論じた。","en":"De Oratore"},{"t":"『ヘレネ礼讃』","kind":"work","d":"ゴルギアスの作品。言葉が人の心を動かす力を、ヘレネの弁護を通して論じた。","en":"Encomium of Helen"},{"t":"『オイディプス王』","kind":"work","d":"ソポクレスの悲劇。観客が真相を知りながら進む筋立てが、劇的アイロニーの代表例とされる。","en":"Oedipus Rex"},{"t":"『イリアス』","kind":"work","d":"ホメロスの叙事詩。トロイア戦争を描き、長く展開する比喩が多いことで知られる。","en":"Iliad"},{"t":"『レトリックと人生』","kind":"work","d":"レイコフとジョンソンの著作の邦題。日常の言葉に隠喩が深く根づくことを示した。","en":"Metaphors We Live By"},{"t":"アテネ","kind":"place","d":"古代ギリシアの代表的な都市国家。民主政のもとで弁論が重んじられ、修辞学が発達した。","en":"Athens"},{"t":"ローマ","kind":"place","d":"古代ローマの都。元老院や法廷での弁論が盛んで、キケロらが活躍した。","en":"Rome"},{"t":"シチリア島","kind":"place","d":"地中海の大きな島。古代ギリシア人の植民地があり、ゴルギアスの故郷レオンティノイもここにある。","en":"Sicily"},{"t":"リュケイオン","kind":"place","d":"アテネ郊外の体育場。アリストテレスが学園を開いた場所で、後に学派の名のもとになった。","en":"Lyceum"},{"t":"逍遙学派","kind":"term","d":"アリストテレスが開いた学派。回廊を歩きながら講義や議論をしたことにちなむ名とされる。","en":"Peripatetic school"},{"t":"カティリナ陰謀","kind":"event","d":"前63年、貴族カティリナが企てたローマ転覆計画。執政官キケロがこれを暴いた。","en":"Catilinarian conspiracy"},{"t":"ヴェッレス裁判","kind":"event","d":"前70年、シチリア総督ヴェッレスの不正を問う裁判。キケロの弁論が名声を高めた。","en":"Trial of Verres"},{"t":"和歌","kind":"term","d":"日本の伝統的な詩。五七五七七の短歌が中心で、掛詞や枕詞などの技法が発達した。","en":"Waka"},{"t":"『万葉集』","kind":"work","d":"奈良時代に成立した日本最古の歌集。約四千五百首を収め、枕詞や序詞が多く見られる。","en":"Man'yoshu"},{"t":"『古今和歌集』","kind":"work","d":"905年ごろに成立した最初の勅撰和歌集。掛詞や縁語が発達した時代を代表する。","en":"Kokin Wakashu"},{"t":"『新古今和歌集』","kind":"work","d":"1205年に完成した八番目の勅撰和歌集。本歌取りや体言止めが多く、技巧的な歌風で知られる。","en":"Shin Kokin Wakashu"},{"t":"『百人一首』","kind":"work","d":"百人の歌人の歌を一首ずつ選んだ歌集。藤原定家の選と伝わり、かるたとしても親しまれる。","en":"Hyakunin Isshu"},{"t":"『平家物語』","kind":"work","d":"平家の興亡を描く軍記物語。琵琶法師が語り、対句を多く含む調子のよい文体で知られる。","en":"Tale of the Heike"},{"t":"柿本人麻呂","kind":"person","d":"飛鳥時代の歌人で『万葉集』を代表する人物。長歌で枕詞や序詞、対句を巧みに使ったとされる。","en":"Kakinomoto no Hitomaro"},{"t":"小野小町","kind":"person","d":"平安時代前期の女性歌人で六歌仙の一人。掛詞を生かした恋の歌で名高い。","en":"Ono no Komachi"},{"t":"藤原定家","kind":"person","d":"鎌倉時代初期の歌人・歌学者。『新古今和歌集』の撰者の一人で、本歌取りの名手として知られる。","en":"Fujiwara no Teika"},{"t":"後鳥羽院","kind":"person","d":"鎌倉時代初期の上皇。和歌所を置いて『新古今和歌集』の編纂を命じ、後に隠岐へ流された。","en":"Retired Emperor Go-Toba"},{"t":"西行","kind":"person","d":"平安時代末期の歌人。もと武士で出家し、各地を旅した。三夕の歌の作者の一人として知られる。","en":"Saigyo"},{"t":"寂蓮","kind":"person","d":"平安末から鎌倉初期の歌人。新古今の撰者に加わったが、完成前に亡くなった。三夕の歌の作者の一人。","en":"Jakuren"},{"t":"三夕の歌","kind":"work","d":"『新古今和歌集』に採られた、寂蓮・西行・藤原定家の秋の夕暮れの三首。体言止めの名例。","en":"Three Evening Poems"},{"t":"近松門左衛門","kind":"person","d":"江戸時代の浄瑠璃・歌舞伎の作者。心中物で名高く、道行文に掛詞や縁語を駆使した。","en":"Chikamatsu Monzaemon"},{"t":"道行","kind":"term","d":"浄瑠璃や歌舞伎で、登場人物の旅路を美しい文章で語る場面。掛詞や縁語が多用される。","en":"Michiyuki"},{"t":"琵琶法師","kind":"term","d":"琵琶を弾きながら物語を語った盲目の僧形の芸能者。『平家物語』を語ったことで知られる。","en":"Biwa hoshi"},{"t":"漢詩","kind":"term","d":"漢字で作る中国の詩。日本でも古くから作られ、律詩や絶句の形式が対句と深く結びつく。","en":"Kanshi"},{"t":"律詩","kind":"term","d":"八句から成る漢詩の形式。第三・四句と第五・六句を対句にする決まりがある。","en":"Regulated verse"}]},"logic":{"people":[{"id":"aristoteles","name":"アリストテレス","full":"アリストテレス","en":"Aristotle","region":"海外","born":-384,"died":-322,"country":"古代ギリシア","era":"古代・中世","tagline":"論理学を学問として創始した古代ギリシアの哲学者","works":[{"t":"『分析論前書』","n":"三段論法を体系的に扱い、推論の妥当な形を調べた、論理学の中心となる書"},{"t":"『オルガノン』","n":"論理学関係の著作群の呼び名で、哲学の道具という意味をもつ"},{"t":"『範疇論』","n":"語が表すものを実体・量・性質などの区分に分けて整理した"},{"t":"『命題論』","n":"肯定と否定、全称と特称といった命題の種類と対立を論じた"},{"t":"『形而上学』","n":"矛盾律を、あらゆる推論の根底にある原理として論じた"}],"anecdotes":["17歳ごろにプラトンの学園アカデメイアに入り、師が亡くなるまでおよそ20年をそこで過ごしたと伝わる。","マケドニア王に招かれて王子アレクサンドロスを教えた。この王子がのちのアレクサンドロス大王になった。","アテネに学園リュケイオンを開き、回廊を歩きながら講義したことから、弟子たちは逍遙学派と呼ばれたとされる。"],"trivia":[{"f":"論理学書の総称『オルガノン』は、ギリシア語で道具を意味する。この名はアリストテレス自身ではなく、後世の編集者がつけた呼び名とされる。","q":"アリストテレスの論理学書をまとめて呼ぶ『オルガノン』は、もとの言葉で何を意味するか。","a":"道具","w":["推論の技術","論証を飾る修辞の技法","弟子に与える問答の型"]},{"f":"カントは『純粋理性批判』の第2版序文で、論理学はアリストテレス以来、後退も前進もしていないとみなした。","q":"カントはアリストテレス以来の論理学の歩みを、どうみなしたか。","a":"進みも戻りもしていないとみた","w":["ライプニッツの記号化で完成したとみた","中世にほぼ失われ近代に復活したとみた","ストア派の登場で根本から覆されたとみた"]},{"f":"中世ヨーロッパの大学では、論理学が文法・修辞学と並ぶ基礎課程の三学のひとつで、その土台はアリストテレスの著作だった。","q":"中世ヨーロッパの教養科目『三学』に、論理学と並んで含まれた二つの科目は何か。","a":"文法と修辞学","w":["算術と幾何学","天文学と音楽","神学と医学"]}],"related":["三段論法","演繹と帰納","矛盾律","排中律","オルガノン","リュケイオン","プラトン","アレクサンドロス大王"],"look":{"hair":"short","hc":"#6B5B4B","face":"normal","beard":"full","bc":"#6B5B4B","collar":"toga","cloth":"#E8E2D0"}},{"id":"leibniz","name":"ライプニッツ","full":"ゴットフリート・ヴィルヘルム・ライプニッツ","en":"Gottfried Wilhelm Leibniz","region":"海外","born":1646,"died":1716,"country":"ドイツ（神聖ローマ帝国）","era":"近代","tagline":"思考を計算に置きかえる夢を描いた万能の学者","works":[{"t":"普遍記号法の構想","n":"あらゆる概念を記号で表し、議論を計算で決着させる言語を目指した"},{"t":"微積分","n":"ニュートンとは別に微積分を創り、今も使う微分と積分の記号を考案した"},{"t":"二進法","n":"0と1だけで数を表す二進法を研究し、1703年に論文を発表した"},{"t":"充足理由律","n":"何事にもそうである理由があるという原理を、推論の基本原理に据えた"},{"t":"段階計算機","n":"加減だけでなく乗除もできる計算機を設計し、1670年代に試作した"}],"anecdotes":["ハノーファー家に40年ほど仕え、司書や顧問として働くかたわら、数学・法学・歴史など多方面の草稿を大量に書き残した。","二進法の0と1が、中国の易経の六十四卦の陰と陽に対応することに気づいたとされ、宣教師から送られた図で確信を深めたと伝わる。","ニュートンとの間で、微積分を先に見いだしたのはどちらかをめぐる優先権争いが起き、英国と大陸の学界の対立が長く続いた。"],"trivia":[{"f":"現在の積分記号は、ラテン語で和を意味する語の頭文字Sを縦に伸ばした形で、ライプニッツが1675年ごろから使い始めたとされる。","q":"積分記号の形は、何の頭文字を引き伸ばしたものか。","a":"和を意味する語のS","w":["差を意味する語のD","面積を意味する語のA","全体を意味する語のT"]},{"f":"ライプニッツの論理学の草稿は大半が生前に公刊されず、没後200年ほどたった20世紀初頭に整理されて、その先駆性が注目された。","q":"ライプニッツの論理学の仕事が広く知られるようになったのは、いつごろか。","a":"没後200年ほどの20世紀初頭","w":["没後すぐの18世紀前半ごろ","フランス革命のころの18世紀末","ブールが活躍した19世紀の半ば"]},{"f":"ヴォルテールの小説『カンディード』に出る楽天家の哲学者パングロスは、ライプニッツの最善世界説を風刺した人物とされる。","q":"ヴォルテールが『カンディード』で風刺した、ライプニッツの考えは何か。","a":"この世界は可能な世界で最善だという考え","w":["精神と身体は別の実体だという考え","無限小は計算上の便宜にすぎないという考え","神は世界を創ったあと関与しないという考え"]}],"related":["普遍記号法","二進法","微積分","充足理由律","ニュートン","ハ },{"t":"真偽の関係","n":"元の命題と対偶は、つねに真偽が同じ。逆と裏も互いに同じで、元の命題とは別物"},{"t":"証明での役割","n":"対偶を示せば元の命題を示したことになり、直接示しにくい命題で役立つ"},{"t":"例","n":"「雨なら地面が濡れる」が真でも、逆の「濡れていれば雨」は真とは限らない"}],"famous":[{"t":"対偶による証明","n":"nの2乗が偶数ならnも偶数、をnが奇数ならnの2乗も奇数、で示す定番"},{"t":"十分条件と必要条件","n":"AはBの十分条件、BはAの必要条件。逆と取り違えると誤りになる"},{"t":"後件肯定の誤謬","n":"逆を元の命題と同じとみなす取り違えが、典型的な誤謬になる"}],"anecdotes":["アリストテレスは『分析論前書』で、主語と述語を入れ替える換位を調べ、すべてのAはBが、そのままでは、すべてのBはAにならないと示した。","高校数学では「逆は必ずしも真ならず」という言い方で、元の命題と逆の取り違えへの注意が繰り返し教えられる。","「頭のいい人は読書家だ」を「読書家は頭がいい」と読み替える取り違えは、日常の会話でも起こりやすい。"],"trivia":[{"f":"「AならばB」が偽になるのは、Aが真でBが偽のときだけ。Aが偽なら、Bが何であっても、この命題は真とみなされる。","q":"「AならばB」を論理学で偽とみなすのは、どのときか。","a":"Aが真でBが偽のときだけ","w":["AもBも偽のとき","Aが偽でBが真のとき","AとBの真偽が一致しないとき"]},{"f":"数学の定番の証明に、nの2乗が偶数ならnも偶数、を対偶で示すものがある。nが奇数ならnの2乗も奇数、と示せば足りる。","q":"「nの2乗が偶数ならnは偶数」を示すとき、対偶として証明するのはどれか。","a":"nが奇数ならnの2乗は奇数","w":["nの2乗が奇数ならnは奇数","nが偶数ならnの2乗は偶数","nが奇数ならnの2乗は偶数"]}],"people":["アリストテレス"],"related":["十分条件と必要条件","含意","反例","背理法","後件肯定の誤謬","真理値","三段論法"]},{"id":"enneki","name":"演繹と帰納","full":"演繹法と帰納法","en":"Deduction and induction","region":"海外","category":"推論の形","when":"古代に区別、近代に整理","where":"ギリシアからヨーロッパへ","era":"近代","tagline":"一般から個別へ導く演繹と、個別から一般へ進む帰納","facts":[{"t":"演繹","n":"前提が真で形が妥当なら結論は必ず真。ただし前提に含まれない新しい知識は増えない"},{"t":"帰納","n":"個々の観察から一般則を導く。結論は確からしさにとどまり、反例が出れば崩れる"},{"t":"近代の対比","n":"ベーコンは観察と実験を積む帰納を重んじ、デカルトは理性による演繹を重んじた"},{"t":"帰納の問題","n":"帰納が正しいことは経験からは示せないとヒュームが論じ、今も議論が続く"}],"famous":[{"t":"ベーコン","n":"『新機関』（1620年）で、帰納法にもとづく新しい学問の方法を唱えた"},{"t":"ヒューム","n":"18世紀のスコットランドの哲学者で、帰納の問題を鋭く提起した"},{"t":"黒い白鳥","n":"白鳥は白いという一般化が、黒い白鳥1羽で崩れる定番の例"},{"t":"シャーロック・ホームズ","n":"演繹の名人とされるが、実際は観察から最善の説明を選ぶ推論が多い"}],"anecdotes":["シャーロック・ホームズは自分の推理を演繹と呼ぶが、実際には観察から最もありそうな説明を選ぶ形で、帰納やアブダクションに近いと言われる。","ヨーロッパでは長く、白鳥はすべて白いと信じられ、黒い白鳥は「ありえないもの」の例えだった。17世紀末にオーストラリア西部で黒い白鳥が見つかり、例えが崩れたと伝わる。","ベーコンは鶏に雪を詰めて冷凍保存を試す実験をしていて風邪をひき、それがもとで亡くなったと伝わる。"],"trivia":[{"f":"ベーコンの主著『新機関』（ノヴム・オルガヌム）は、アリストテレスの論理学書『オルガノン』に対抗する、新しい学問の道具という題を掲げた。","q":"ベーコンの『ノヴム・オルガヌム』は、何に対する新しい道具という題か。","a":"アリストテレスの『オルガノン』","w":["プラトンの『国家』","ユークリッドの『原論』","トマス・アクィナスの『神学大全』"]},{"f":"「黒い白鳥」は、ヨーロッパで長く「ありえないもの」の例えだった。17世紀末にオランダ人がオーストラリア西部で見つけ、例えの根拠がなくなったとされる。","q":"帰納の弱さの例として語られる黒い白鳥は、17世紀末にどこで確認されたとされるか。","a":"オーストラリア西部","w":["アフリカ南部の湖沼地帯","アマゾン川の流域","インド洋のモーリシャス島"]}],"people":["アリストテレス","ポパー"],"related":["三段論法","反証可能性","ベーコン","ヒューム","帰納の問題","黒い白鳥","アブダクション"]},{"id":"hairihou","name":"背理法","full":"背理法（帰謬法）","en":"Proof by contradiction","region":"海外","category":"推論の形","when":"古代ギリシア以来","where":"古代ギリシア","era":"古代・中世","tagline":"結論を否定して矛盾を示し、元の結論を証明する方法","facts":[{"t":"手順","n":"示したいことの否定を仮定し、そこから矛盾を導いて、仮定が誤りだったと結論する"},{"t":"排中律","n":"否定が偽なら元の主張が真とするため、排中律（PかPでないかのどちらか）を使う"},{"t":"直観主義","n":"20世紀にブラウワーは排中律の無制限な使用を疑い、直観主義の数学を唱えた"},{"t":"利点と注意","n":"存在を示せるが、具体的な作り方までは教えてくれない場合がある"}],"famous":[{"t":"2の平方根が無理数","n":"分数で書けると仮定すると矛盾が出る、背理法の最も有名な例"},{"t":"素数が無限にある","n":"ユークリッド『原論』の証明は、背理法の形でよく紹介される"},{"t":"ハーディの比喩","n":"英国の数学者ハーディが、背理法をチェスの手にたとえたことで知られる"}],"anecdotes":["ハーディは『ある数学者の弁明』で、背理法をチェスのギャンビットにたとえ、数学者が差し出すのは駒でなく勝負そのものだと述べた。","2の平方根が分数で表せないことは古代ギリシアで知られ、ピタゴラス学派の周辺で発見されたと伝わる。","20世紀初め、オランダのブラウワーは無限を扱う数学で背理法をむやみに使うことを疑い、数学者の間で長い論争になった。"],"trivia":[{"f":"2の平方根が無理数であることの証明は、背理法の定番。分数で書けると仮定すると、分母と分子がともに偶数になり、既約分数という仮定に反する。","q":"2の平方根が無理数であることを背理法で示すとき、最後にぶつかる矛盾は何か。","a":"既約分数なのに分母と分子が偶数になる","w":["分数の値が2よりも大きくなってしまう","小数展開が途中で止まらなくなってしまう","分母が0になり計算できなくなってしまう"]},{"f":"英国の数学者ハーディは、背理法をチェスの手にたとえた。駒を差し出す定跡と違い、数学者が差し出すのは勝負そのものだという。","q":"ハーディが背理法をたとえたゲームは何か。","a":"チェス","w":["クリケット","囲碁","ブリッジ"]}],"people":["アリストテレス"],"related":["排中律","直観主義","ブラウワー","ハーディ","ユークリッド","対偶・逆・裏","反例"]},{"id":"koukenkoutei","name":"後件肯定の誤謬","full":"後件肯定と前件否定の誤謬","en":"Affirming the consequent and denying the antecedent","region":"海外","category":"誤謬","when":"古代から知られる","where":"ヨーロッパ","era":"古代・中世","tagline":"「AならばB」から、逆や裏を勝手に導く、よくある誤り","facts":[{"t":"後件肯定","n":"「AならばB」と「B」から「A」を導くのは誤り。BになるのはA以外の原因でもありうる"},{"t":"前件否定","n":"「AならばB」と「Aでない」から「Bでない」を導くのも誤りになる"},{"t":"妥当な形","n":"「AならばB」とAからB(肯定式)、「AならばB」とBでないからAでない(否定式)だけが妥当"}, "n":"18世紀に、書簡の中で円による図示を広めたスイスの数学者"},{"t":"ケンブリッジの窓","n":"ベンが所属したカレッジの食堂には、ベン図を描いた色ガラスの窓がある"}],"anecdotes":["ベンは自分の図をオイラー円の改良と呼んでいた。「ベン図」という名は、1918年に論理学者のルイスが著書で使ったのが始まりとされる。","ベンはクリケットの投球機械を作ったと伝わる。1909年に訪れたオーストラリア代表の打者を、この機械が打ち取ったとされる。"],"trivia":[{"f":"「ベン図」という呼び名は、ベン本人ではなく、1918年に論理学者のC・I・ルイスが著書で使ったのが始まりとされる。ベン自身はオイラー円の改良と呼んでいた。","q":"「ベン図」という呼び名を最初に使ったとされるのは誰か。","a":"C・I・ルイス","w":["ジョン・ベン本人","レオンハルト・オイラー","ルイス・キャロル"]},{"f":"ベンが所属したケンブリッジ大学のカレッジの食堂には、ベンを記念して、ベン図を描いた色ガラスの窓がある。","q":"ベンを記念して、ベン図を描いた色ガラスの窓があるのはどこか。","a":"ケンブリッジ大学のカレッジの食堂","w":["オックスフォード大学の図書館の閲覧室","ロンドンの大英博物館の円形閲覧室","ヨーク大聖堂の礼拝堂の入口"]}],"people":["ブール"],"related":["集合","オイラー図","ジョン・ベン","三段論法","命題論理と述語論理","妥当性"]},{"id":"hanshou","name":"反証可能性","full":"反証可能性（反証主義）","en":"Falsifiability","region":"海外","category":"推論の形","when":"1934年（ポパー）","where":"ウィーン","era":"記号論理学の時代","tagline":"反証できる主張こそ科学的だとする、ポパーの基準","facts":[{"t":"基準","n":"科学的な主張は、観察や実験で誤りと示せる形でなければならないとする基準"},{"t":"論理的な根拠","n":"全称の主張は、例がどれだけ増えても証明できないが、反例1つで否定できる"},{"t":"線引き問題","n":"科学と疑似科学を分ける問いへの答えとして、1934年の『科学的発見の論理』で示された"},{"t":"批判","n":"実際の科学は反証1つで理論を捨てるとは限らないと、クーンらが批判した"}],"famous":[{"t":"ポパー","n":"『科学的発見の論理』（1934年）で、反証可能性を科学の基準に据えた"},{"t":"1919年の日食観測","n":"エディントンの観測で検証された相対性理論の予言を、ポパーは模範とした"},{"t":"精神分析と占星術","n":"どんな結果も説明できるとして、ポパーが反証できない例に挙げた"}],"anecdotes":["ポパーは若いころ、アドラーの心理学とマルクス主義、アインシュタインの相対論に接し、前二者が何でも説明できる点に疑問をもったと語った。","『科学的発見の論理』は1934年にドイツ語で出たが、英語版が出たのは1959年で、英語圏への浸透は戦後になった。","ポパーは、黒い白鳥が1羽見つかればすべての白鳥は白いという主張を覆せることを、反証の論理の例としてよく用いた。"],"trivia":[{"f":"ポパーは1919年のエディントンの日食観測を、反証可能な理論の模範とした。相対性理論は、星の光が太陽に曲げられるという予言をし、外れれば捨てられたからだ。","q":"ポパーが反証可能な理論の模範とした、1919年の日食観測で確かめられた理論は何か。","a":"一般相対性理論","w":["量子力学","ニュートン力学","特殊相対性理論"]},{"f":"科学史家クーンは『科学革命の構造』（1962年）で、実際の科学は反証1つで理論を捨てず、パラダイムの転換で進むと論じ、ポパーの科学観に疑問を投げた。","q":"反証主義に代わる科学観として、クーンが1962年の著書で唱えた概念は何か。","a":"パラダイムの転換","w":["仮説形成の連鎖","科学的研究プログラム","還元主義の徹底"]}],"people":["ポパー"],"related":["線引き問題","疑似科学","帰納の問題","批判的合理主義","黒い白鳥","演繹と帰納","『科学的発見の論理』"]},{"id":"inmyou","name":"因明","full":"因明（仏教の論理学）","en":"Hetuvidya (Buddhist logic)","region":"日本","category":"推論の形","when":"インドで成立、奈良時代までに伝来","where":"インド・中国・日本","era":"古代・中世","tagline":"仏教が磨いた、宗・因・喩で論証する推論の学","facts":[{"t":"宗・因・喩","n":"主張の宗、理由の因、実例の喩の三つで論証を組み立てる（新因明の三支作法）"},{"t":"成立の背景","n":"インドで仏教徒と他の学派が論争を重ねるなかで磨かれ、論証の正誤を判定する規則に発展した"},{"t":"伝来","n":"唐の玄奘がインドの因明書を漢訳し、日本には法相宗の学問として伝わった"},{"t":"新因明","n":"陳那が整えた新因明は、論証の理由が満たすべき条件を細かく定めた"}],"famous":[{"t":"定番の例","n":"音声は無常という宗を、作られたものという因と、瓶という喩で示す例が入門の定番"},{"t":"陳那","n":"5〜6世紀ごろのインドの論理学者で、新因明の祖とされる"},{"t":"玄奘","n":"7世紀の唐の僧で、因明の書を漢訳して東アジアに広めた"},{"t":"法相宗の寺","n":"興福寺や薬師寺など、法相宗の寺で因明が学ばれた"}],"anecdotes":["法相宗を日本に最初に伝えたのは、唐で玄奘に学んだ僧の道昭とされ、因明もこの学派の学びに含まれた。","興福寺の維摩会では、僧が問答で教義を競う論義が行われ、そこで因明の学びが生かされたとされる。","明治以降は西洋の論理学と並べて研究され、三支作法は三段論法に似た形として紹介されることが多い。"],"trivia":[{"f":"因明の論証は、宗・因・喩の三つで組み立てる。西洋の三段論法に似るが、一般則だけでなく具体的な実例を喩として添える点が特徴とされる。","q":"因明の三つの部分のうち、具体的な実例（瓶などの例）にあたるものはどれか。","a":"喩","w":["宗","因","結"]},{"f":"玄奘は645年にインドから帰り、因明の書を漢訳して、中国と日本の因明の出発点を作った。","q":"因明の書を漢訳し、日本の因明の土台を作った唐の僧は誰か。","a":"玄奘","w":["鑑真","義浄","法顕"]}],"people":[],"related":["三段論法","宗・因・喩","玄奘","陳那","法相宗","論義"]},{"id":"yakugo","name":"「論理学」の訳語","full":"「論理学」という訳語の成立","en":"Origin of the Japanese term for logic","region":"日本","category":"体系・記号","when":"幕末から明治（19世紀）","where":"日本（東京ほか）","era":"近代","tagline":"ロジックに致知学など複数の訳語があった時代を経て定着した","facts":[{"t":"訳語の揺れ","n":"明治初期には致知学のほか複数の訳語が試され、やがて論理学の語が定着した"},{"t":"西周の役割","n":"西周は西洋の学問用語を数多く訳し、論理学の入門書『致知啓蒙』（1874年）を著した"},{"t":"関連語","n":"概念・命題・推理・演繹・帰納などの語も、明治期の翻訳を通じて広まった"},{"t":"中国との違い","n":"中国ではミルの論理学が名学の題で訳され、同じ学問に違う名がついた"}],"famous":[{"t":"西周","n":"幕末から明治の啓蒙思想家で、哲学など多くの訳語を作ったとされる"},{"t":"『致知啓蒙』","n":"1874年刊。西洋の論理学書を参考にした、日本語の論理学入門の草分け"},{"t":"厳復","n":"中国の啓蒙思想家で、ミルの論理学を『穆勒名学』として中国語に訳した"}],"anecdotes":["西周は幕末にオランダへ留学してライデンで学び、帰国後は多くの西洋の学問用語を日本語に移す仕事で知られた。","philosophy を希哲学のち哲学と訳したのも西周とされる。logic を致知学と呼んだのと並び、学問名の命名者として名が挙がる。","論理学という語が定着する前は、致知学のほかにも訳語が用いられ、学者ごとに呼び方が揺れていた。"],"trivia":[{"f":"西周は philosophy を哲学と訳した人物として知られ、logic にも致知学という訳語を当て、論理学の入門書に『致知啓蒙』と名づけた。","q":"西周が論理学の入門書につけた書名は何か。","a":"『致知啓蒙』","w":["『名学浅説』","『推理新論』","『論法指南』"]},{"f":"厳復はミルの『論理学体系』を『穆勒名学』として中国語に訳し、論理学を名学と呼んだ。明治の日本と中国では、同じ学問に違う名がついた。","q":"ミルの論理学書を中国語に訳した厳復は、論理学を何と呼んだか。","a":"名学","w":["致知学","格致学","理学"]}],"people":[],"related":["西周","『致知啓蒙』","厳復","ミル","演繹と帰納","三段論法","因明"]},{"id":"nihongo","name":"日本語の論理","full":"日本語の論理（結論の置き場所）","en":"Logic and discourse structure in Japanese","region":"日本","category":"推論の形","when":"近現代の文章指導","where":"日本語圏","era":"","tagline":"結論を先に置くか後に置くかは、論理でなく型の違い","facts":[{"t":"述語は文末","n":"日本語は述語が文末に来るため、肯定か否定かが文の最後まで分からない"},{"t":"起承転結","n":"漢詩の絶句の構成が由来で、話の流れの型として文章指導に広まった"},{"t":"結論の置き場所","n":"結論を先に置く型と、経緯のあとに置く型がある。論理の強さでなく伝え方の慣習の違い"}],"famous":[{"t":"起承転結","n":"漢詩の絶句の四句の構成で、日本では作文の型として広まった"},{"t":"序破急","n":"雅楽に由来し、世阿弥が能の構成に用いた三段の展開"},{"t":"ピラミッド原則","n":"結論を頂点に根拠を下に並べる文書の型で、コンサルティングで広く使われる"}],"anecdotes":["日本語は述語が文末に来るため、会話では相手の反応を見ながら最後に肯否を決める言い方ができる、と説明されることがある。","起承転結の転は、話を別の方向へ移す句で、もとは詩の構成である。論証文には向かないと指摘されることも多い。","ピラミッド原則を体系化したバーバラ・ミントは、コンサルティング会社マッキンゼーで文書の書き方を指導した人物として知られる。"],"trivia":[{"f":"起承転結は、もとは漢詩の絶句の構成で、第3句の転で話を変えて、第4句の結で収める。論証の型として生まれたわけではない。","q":"起承転結の「転」は、もとの漢詩では何をする句か。","a":"話の調子や場面を変える","w":["前の句の内容を言い換えて強める","作者の名と題を述べて始める","全体の結論を先に述べておく"]},{"f":"序破急は雅楽の曲の構成に由来し、世阿弥が能の演出に取り入れたとされる。結論を急がず、段階的に盛り上げる型の代表例。","q":"序破急を能の理論に取り入れたとされる人物は誰か。","a":"世阿弥","w":["観阿弥","近松門左衛門","千利休"]}],"people":[],"related":["起承転結","序破急","ピラミッド原則","バーバラ・ミント","演繹と帰納","三段論法"]}],"glossary":[{"t":"矛盾律","kind":"term","d":"同じものが同じ点で、ある性質をもちつつ、もたないことはない、という原理。アリストテレスが『形而上学』で基礎に据えた。","en":"Law of non-contradiction"},{"t":"排中律","kind":"term","d":"ある命題かその否定のどちらかが必ず成り立ち、第三の場合はないという原理。背理法の根拠で、アリストテレスが論じた。","en":"Law of excluded middle"},{"t":"オルガノン","kind":"work","d":"アリストテレスの論理学関係の著作の総称。『範疇論』『命題論』『分析論前書』などを含み、名は道具を意味する。","en":"Organon"},{"t":"リュケイオン","kind":"place","d":"アテネ郊外にあったアリストテレスの学園。回廊を歩きながら講義したので、弟子は逍遙学派と呼ばれたとされる。","en":"Lyceum"},{"t":"プラトン","kind":"person","d":"前5世紀から前4世紀にかけての古代ギリシアの哲学者。学園アカデメイアを開き、若いアリストテレスがそこで学んだ。","en":"Plato"},{"t":"アレクサンドロス大王","kind":"person","d":"マケドニア王（前356〜前323）。少年期にアリストテレスに教わったとされ、東方遠征で大帝国を築いた。","en":"Alexander the Great"},{"t":"普遍記号法","kind":"term","d":"ライプニッツが構想した、あらゆる概念を記号で表し、議論を計算で解決できる人工言語。論理の記号化の先駆。","en":"Characteristica universalis"},{"t":"二進法","kind":"term","d":"0と1だけで数を表す方法。ライプニッツが体系的に研究し、のちのコンピュータの数の表し方の基礎になった。","en":"Binary numeral system"},{"t":"微積分","kind":"term","d":"変化の速さと面積を扱う数学。ニュートンとライプニッツが別々に創始し、ライプニッツの記号が今も使われる。","en":"Calculus"},{"t":"充足理由律","kind":"term","d":"あらゆる事柄にはそうである理由があるという原理。ライプニッツが矛盾律と並ぶ推論の基本原理とした。","en":"Principle of sufficient reason"},{"t":"ニュートン","kind":"person","d":"17世紀の英国の物理学者。万有引力と力学で知られ、ライプニッツと微積分の先取権をめぐって争った。","en":"Isaac Newton"},{"t":"ハノーファー","kind":"place","d":"ドイツ北部の都市。ライプニッツが仕えたハノーファー家の宮廷があり、彼は晩年をここで過ごして亡くなった。","en":"Hanover"},{"t":"易経","kind":"work","d":"古代中国の占いと思想の書。陰陽の線を重ねた六十四卦が二進法と対応することを、ライプニッツが見いだしたとされる。","en":"I Ching"},{"t":"ブール代数","kind":"term","d":"真と偽を1と0に置き、論理積・論理和・否定を演算とする代数。ブールの論理の代数化から生まれた。","en":"Boolean algebra"},{"t":"論理演算","kind":"term","d":"AND・OR・NOTなど、真偽の値から真偽の値を作る演算。ブールの代数で定式化され、回路の設計に使われる。","en":"Logical operation"},{"t":"論理回路","kind":"term","d":"電気信号の有無を1と0に対応させ、論理演算を行う回路。ブール代数を用いてシャノンが設計法を示した。","en":"Logic circuit"},{"t":"シャノン","kind":"person","d":"1916〜2001。米国の数学者・技術者。1937年の修士論文でブール代数を継電器回路に応用し、情報理論も創始した。","en":"Claude Shannon"},{"t":"真理値","kind":"term","d":"命題の真と偽を表す値。ブールは真を1、偽を0とする代数に表し、論理を計算として扱えるようにした。","en":"Truth value"},{"t":"『思考の法則』","kind":"work","d":"ブールが1854年に出した主著。論理と確率を代数の記号で扱い、ブール代数の出発点になった。","en":"The Laws of Thought"},{"t":"コーク","kind":"place","d":"アイルランド南部の都市。ブールは1849年にクイーンズ・カレッジの数学教授に迎えられ、ここで亡くなった。","en":"Cork"},{"t":"概念記法","kind":"work","d":"フレーゲが1879年に出した小冊子。量化子と独自の記号で、述語論理を初めて体系にした書。","en":"Begriffsschrift"},{"t":"量化子","kind":"term","d":"「すべての」「ある」を表す記号。フレーゲが述語論理に導入し、三段論法を含む推論を記号で表せるようにした。","en":"Quantifier"},{"t":"ラッセルのパラドックス","kind":"event","d":"自分自身を要素に含まない集合全体を考えると矛盾する、という発見。ラッセルが見いだし、フレーゲの体系を揺るがした。","en":"Russell's paradox"},{"t":"論理主義","kind":"term","d":"数学は論理から導けるという立場。フレーゲが構想し、ラッセルとホワイトヘッドが『プリンキピア』で推し進めた。","en":"Logicism"},{"t":"意義と指示対象","kind":"term","d":"フレーゲの区別。表現が指す対象が指示対象、その示し方が意義。明けの明星と宵の明星の例で説明される。","en":"Sense and reference"},{"t":"イェーナ","kind":"place","d":"ドイツ中部の大学都市。フレーゲが生涯の大半をイェーナ大学で教え、ウィトゲンシュタインもここを訪ねた。","en":"Jena"},{"t":"ウィトゲンシュタイン","kind":"person","d":"1889〜1951。オーストリア生まれの哲学者。フレーゲを訪ね、ラッセルに学ぶよう勧められたとされる。","en":"Ludwig Wittgenstein"},{"t":"ホワイトヘッド","kind":"person","d":"1861〜1947。英国の数学者・哲学者。ラッセルと共に『プリンキピア・マテマティカ』を書いた。","en":"Alfred North Whitehead"},{"t":"『プリンキピア・マテマティカ』","kind":"work","d":"ホワイトヘッドとラッセルの共著（1910〜13年）。数学を論理の記号から導く、3巻の大著。","en":"Principia Mathematica"},{"t":"型理論","kind":"term","d":"対象を階層に分け、自分自身に当てはめる文を禁じる理論。ラッセルがパラドックスを避けるために作った。","en":"Type theory"},{"t":"記述理論","kind":"term","d":"「現在のフランス王」のような限定記述を論理の形で分析する、ラッセルの理論（1905年）。","en":"Theory of descriptions"},{"t":"ノーベル文学賞","kind":"event","d":"1950年にラッセルが受けた賞。多彩で重要な著作で人道主義と思想の自由を擁護した功績が理由とされる。","en":"Nobel Prize in Literature"},{"t":"集合","kind":"term","d":"ものの集まりを一つの対象として扱う数学の概念。ラッセルのパラドックスで、素朴な扱いの限界が示された。","en":"Set"},{"t":"不完全性定理","kind":"term","d":"算術を含む無矛盾な体系には、その中で証明も反証もできない命題があるという、ゲーデルの1931年の定理。","en":"Incompleteness theorems"},{"t":"完全性定理","kind":"term","d":"一階述語論理では、論理的に正しい式がすべて証明できるという定理。ゲーデルが1929年に示した。","en":"Completeness theorem"},{"t":"形式体系","kind":"term","d":"記号・公理・推論規則だけで定めた体系。ゲーデルはこの枠組みで、証明できることの限界を示した。","en":"Formal system"},{"t":"ヒルベルト計画","kind":"event","d":"ヒルベルトが20世紀初めに掲げた、数学全体を形式化して無矛盾性を示す計画。不完全性定理で見直された。","en":"Hilbert's program"},{"t":"ゲーデル数","kind":"term","d":"式や証明に番号を割り当てる方法。ゲーデルはこれで、体系が自分自身について語る文を作った。","en":"Godel numbering"},{"t":"アインシュタイン","kind":"person","d":"1879〜1955。相対性理論の物理学者。プリンストンでゲーデルと親しく、散歩の友だったと伝わる。","en":"Albert Einstein"},{"t":"プリンストン","kind":"place","d":"米国ニュージャージー州の町。高等研究所があり、ゲーデルは1940年から亡くなるまでここで過ごした。","en":"Princeton"},{"t":"連続体仮説","kind":"term","d":"整数の数と実数の数の間に、中間の大きさの無限はないという仮説。ゲーデルは公理と矛盾しないことを示した。","en":"Continuum hypothesis"},{"t":"線引き問題","kind":"term","d":"科学と疑似科学や形而上学を、どう区別するかという問い。ポパーは反証可能性で答えた。","en":"Demarcation problem"},{"t":"批判的合理主義","kind":"term","d":"知識は確定せず、批判によって誤りを取り除きながら進むとする、ポパーの立場。","en":"Critical rationalism"},{"t":"『科学的発見の論理』","kind":"work","d":"ポパーが1934年に出した主著。反証可能性を基準とする科学観を示した。英訳は1959年。","en":"The Logic of Scientific Discovery"},{"t":"『開かれた社会とその敵』","kind":"work","d":"ポパーが第二次世界大戦中に書き、1945年に出した著作。全体主義を批判した。","en":"The Open Society and Its Enemies"},{"t":"ウィーン学団","kind":"event","d":"1920〜30年代にウィーン大学周辺に集まった哲学者・科学者の集団。論理実証主義の拠点で、ポパーは会員でなかった。","en":"Vienna Circle"},{"t":"ニュージーランド","kind":"place","d":"ポパーが1937年から終戦のころまで、亡命して教えた国。『開かれた社会とその敵』はここで書かれた。","en":"New Zealand"},{"t":"帰納の問題","kind":"term","d":"過去の観察から未来や一般則を導く帰納に、論理的な保証はあるのかという問い。ヒュームが提起し、ポパーも論じた。","en":"Problem of induction"},{"t":"前提","kind":"term","d":"推論の出発点となる文。三段論法では大前提と小前提があり、これらから結論が導かれる。","en":"Premise"},{"t":"結論","kind":"term","d":"前提から導かれる文。三段論法では、前提が真で形が妥当なら、結論も必ず真になる。","en":"Conclusion"},{"t":"媒概念","kind":"term","d":"三段論法で二つの前提に共通して現れ、結論には現れない語。大概念と小概念を結びつける役割をする。","en":"Middle term"},{"t":"妥当性","kind":"term","d":"前提がすべて真なら結論も必ず真になる、という推論の形の性質。三段論法の型はこれで評価される。","en":"Validity"},{"t":"バルバラ","kind":"term","d":"三段論法の最も基本の型で、全称肯定の3つの文から成る。中世の覚え歌でこの名がつけられた。","en":"Barbara"},{"t":"十分条件と必要条件","kind":"term","d":"AならばBのとき、AはBの十分条件、BはAの必要条件。逆と取り違えると誤りになる。","en":"Sufficient and necessary conditions"},{"t":"含意","kind":"term","d":"「AならばB」の論理的な関係。Aが真でBが偽のときだけ偽になり、対偶と真偽が一致する。","en":"Implication"},{"t":"反例","kind":"term","d":"全称の主張が成り立たない具体例。一つ示すだけで主張を覆せ、逆や裏が真でないことを示すのにも使う。","en":"Counterexample"},{"t":"ベーコン","kind":"person","d":"1561〜1626。英国の哲学者。『新機関』で帰納法を唱え、近代科学の方法に影響を与えた。","en":"Francis Bacon"},{"t":"ヒューム","kind":"person","d":"1711〜1776。スコットランドの哲学者。帰納に論理的な根拠はないと論じ、帰納の問題を提起した。","en":"David Hume"},{"t":"黒い白鳥","kind":"term","d":"白鳥はすべて白いという一般化を覆す例。帰納の弱さと反証可能性を説明する定番の話。","en":"Black swan"},{"t":"アブダクション","kind":"term","d":"観察された事実を最もよく説明する仮説を選ぶ推論。演繹・帰納と並ぶ第三の推論として論じられる。","en":"Abduction"},{"t":"ブラウワー","kind":"person","d":"1881〜1966。オランダの数学者。排中律の無制限な使用を疑い、直観主義を唱えた。","en":"L. E. J. Brouwer"},{"t":"ハーディ","kind":"person","d":"1877〜1947。英国の数学者。『ある数学者の弁明』で、背理法をチェスの手にたとえた。","en":"G. H. Hardy"},{"t":"ユークリッド","kind":"person","d":"前3世紀ごろのギリシアの数学者。『原論』で公理から定理を導く証明の型を示した。","en":"Euclid"},{"t":"直観主義","kind":"term","d":"数学的対象は人が構成して初めて存在するとし、排中律や背理法の無制限な使用を認めない立場。ブラウワーが創始。","en":"Intuitionism"},{"t":"肯定式","kind":"term","d":"「AならばB」とAから、Bを導く妥当な推論。後件肯定の誤謬と取り違えないことが大切。","en":"Modus ponens"},{"t":"否定式","kind":"term","d":"「AならばB」とBでないことから、Aでないを導く妥当な推論。対偶に基づく。","en":"Modus tollens"},{"t":"形式的誤謬","kind":"term","d":"内容でなく、推論の形そのものが妥当でない誤り。後件肯定や前件否定が代表例。","en":"Formal fallacy"},{"t":"4枚カード問題","kind":"event","d":"ウェイソンが1966年に考案した推論課題。後件肯定のような、誤った選択をしがちな様子を示した。","en":"Wason selection task"},{"t":"非形式的誤謬","kind":"term","d":"形でなく内容や言葉の使い方に由来する誤り。論点先取や循環論法がこれに含まれる。","en":"Informal fallacy"},{"t":"アグリッパのトリレンマ","kind":"term","d":"根拠づけは無限後退、循環、独断のどれかに行き着くという懐疑論の議論。古代の懐疑派アグリッパに帰される。","en":"Agrippa's trilemma"},{"t":"ミュンヒハウゼンのトリレンマ","kind":"term","d":"アグリッパのトリレンマの現代的な呼び名。男爵が髪を引いて沼から脱け出す話にちなむ。","en":"Munchhausen trilemma"},{"t":"定義の循環","kind":"term","d":"辞書で語を引き、説明の語をたどると元の語に戻ってしまうこと。循環論法の身近な例。","en":"Circular definition"},{"t":"真理表","kind":"term","d":"命題の真偽の組み合わせごとに、複合命題の真偽を一覧にした表。命題論理の判定に使われる。","en":"Truth table"},{"t":"論理結合子","kind":"term","d":"かつ・または・ならば・でない、など命題をつなぐ記号。命題論理を組み立てる部品。","en":"Logical connective"},{"t":"オイラー図","kind":"term","d":"円を使って概念の包含関係を示す図。オイラーが書簡で広め、ベン図の先駆とされる。","en":"Euler diagram"},{"t":"ジョン・ベン","kind":"person","d":"1834〜1923。英国の論理学者。1880年に円を重ねた図を示し、ケンブリッジ大学で教えた。","en":"John Venn"},{"t":"疑似科学","kind":"term","d":"科学のように見えるが、反証可能性などの基準を満たさない主張。ポパーが線引き問題で取り上げた。","en":"Pseudoscience"},{"t":"宗・因・喩","kind":"term","d":"因明の論証の三要素。主張（宗）、理由（因）、実例（喩）を並べて論証する。","en":"Three-part argument"},{"t":"玄奘","kind":"person","d":"7世紀の唐の僧。インドから経典を持ち帰り、因明の書を漢訳して、日本の因明の源流を作った。","en":"Xuanzang"},{"t":"陳那","kind":"person","d":"5〜6世紀ごろのインドの仏教論理学者。新因明の祖とされ、因明の論証の規則を整えた。","en":"Dignaga"},{"t":"法相宗","kind":"term","d":"玄奘の学系を受けた仏教の宗派。奈良時代に日本へ伝わり、興福寺や薬師寺を中心に因明が学ばれた。","en":"Hosso school"},{"t":"論義","kind":"term","d":"仏教寺院で、僧が問いと答えで教義を確かめる問答の形式。因明の学びが生かされるとされる。","en":"Rongi"},{"t":"西周","kind":"person","d":"1829〜1897。幕末から明治の啓蒙思想家。哲学や論理学の語を訳し、『致知啓蒙』を著した。","en":"Nishi Amane"},{"t":"『致知啓蒙』","kind":"work","d":"西周が1874年に出した論理学の入門書。日本語で書かれた論理学書の草分けとされる。","en":"Chichi Keimo"},{"t":"厳復","kind":"person","d":"1854〜1921。中国の啓蒙思想家。ミルの論理学を『穆勒名学』として訳し、論理学を名学と呼んだ。","en":"Yan Fu"},{"t":"ミル","kind":"person","d":"1806〜1873。英国の哲学者。『論理学体系』（1843年）で帰納の方法を論じた。","en":"John Stuart Mill"},{"t":"起承転結","kind":"term","d":"漢詩の絶句の四句の構成。日本では作文や話の展開の型として広まった。","en":"Kishoutenketsu"},{"t":"序破急","kind":"term","d":"雅楽に由来する三段の展開。世阿弥が能の構成に用い、日本の芸の型として広まった。","en":"Jo-ha-kyu"},{"t":"ピラミッド原則","kind":"term","d":"結論を頂点に、根拠を下に並べる文書の構成法。ミントが体系化し、コンサルティングで広く使われる。","en":"Pyramid Principle"},{"t":"バーバラ・ミント","kind":"person","d":"米国の経営コンサルタント。マッキンゼーで文書の書き方を指導し、ピラミッド原則を体系化した。","en":"Barbara Minto"}]},"astro":{"people":[{"id":"ptolemy","name":"プトレマイオス","full":"クラウディオス・プトレマイオス","en":"Claudius Ptolemy","region":"海外","born":100,"died":170,"approx":true,"country":"古代ローマ（エジプトのアレクサンドリア）","era":"古代・中世","tagline":"天動説を『アルマゲスト』にまとめた古代の天文学者","works":[{"t":"アルマゲスト","n":"古代ギリシャ天文学を集大成した全13巻の書。千年以上、西洋とイスラム世界で天文学の教科書だった。"},{"t":"天動説の数理モデル","n":"周転円や離心円を組み合わせ、惑星の逆行など複雑な動きを計算で予測できるようにした。"},{"t":"星表と48星座","n":"1000あまりの恒星の位置と明るさを記した星表を載せ、48の星座を整理した。"},{"t":"ゲオグラフィア","n":"地名の緯度と経度を集め、地図のかき方を論じた書。ルネサンス期のヨーロッパで再び注目された。"},{"t":"テトラビブロス","n":"星の位置と地上の出来事の関係を論じた占星術の書。中世まで広く読まれた。"}],"anecdotes":["『アルマゲスト』の書名は、ギリシャ語で最大を意味する語がアラビア語を経て変化した呼び名とされる。","名前は古代エジプトのプトレマイオス朝と同じだが、その王家の一員ではないとされる。","天動説は誤りだが、観測とよく合う予測ができたため、コペルニクスの時代まで1000年以上使われた。"],"trivia":[{"f":"プトレマイオスは星表に48の星座を載せた。この古代の星座が、現在の88星座の土台になった。","q":"プトレマイオスの星表に載った星座は、いくつだったか？","a":"48個","w":["12個","24個","66個"]},{"f":"『アルマゲスト』という書名は、ギリシャ語で最大を意味する語がアラビア語経由で伝わったものとされる。","q":"『アルマゲスト』の書名のもとの語は、どんな意味とされるか？","a":"最大の書物","w":["星々の地図","天界の調和","宇宙の秩序"]},{"f":"プトレマイオスは、地中海世界の学術の中心だったエジプトの都市アレクサンドリアで活動したとされる。","q":"プトレマイオスが活動したとされる学術都市は？","a":"アレクサンドリア","w":["アテネ","ローマ","ペルガモン"]}],"related":["天動説と地動説" ":[{"f":"カミオカンデが1987年に超新星SN1987Aから捉えたニュートリノは、10秒あまりの間にわずか11個だった。","q":"カミオカンデが超新星SN1987Aから捉えたニュートリノは何個か？","a":"11個","w":["約100個","約3000個","1個"]},{"f":"カミオカンデの名は神岡核子崩壊実験を略したもので、本来は陽子の崩壊を探す装置だった。","q":"カミオカンデが本来探そうとしていたものは？","a":"陽子の崩壊","w":["暗黒物質の粒子","重力波の到来","宇宙線の起源"]},{"f":"小柴の弟子の梶田隆章は、1998年にスーパーカミオカンデでニュートリノ振動の証拠を示し、2015年にノーベル物理学賞を受けた。","q":"2015年に小柴の弟子でノーベル物理学賞を受けた人物は？","a":"梶田隆章","w":["戸塚洋二","鈴木厚人","益川敏英"]}],"related":["ニュートリノ天文学","カミオカンデ","スーパーカミオカンデ","超新星","SN1987A","梶田隆章","ノーベル物理学賞","神岡鉱山"],"look":{"hair":"short","hc":"#CFCFCF","face":"normal","glasses":"rect","collar":"bow","cloth":"#2B2B33"}}],"items":[{"id":"tendo_chido","name":"天動説と地動説","full":"天動説（地球中心説）と地動説（太陽中心説）","en":"Geocentric and Heliocentric Models","region":"海外","category":"宇宙像・法則","when":"古代ギリシャ〜17世紀","where":"地中海世界・ヨーロッパ","era":"古代・中世","tagline":"地球が中心か、太陽が中心か。宇宙像をめぐる長い論争","facts":[{"t":"天動説","n":"地球は宇宙の中心で動かず、太陽や星が回るという考え。プトレマイオスが数学で体系化した。"},{"t":"地動説","n":"太陽が中心で、地球は惑星の一つとして自転しながら公転するという考え。"},{"t":"決着の道筋","n":"ガリレオの望遠鏡観測、ケプラーの楕円軌道、ニュートンの万有引力が重なり、地動説が定着した。"},{"t":"現代の見方","n":"太陽も銀河系の中を動いており、宇宙に絶対的な中心は見つかっていない。"}],"famous":[{"t":"アリスタルコス","n":"紀元前3世紀、太陽中心の宇宙像を唱えたとされる古代ギリシャの天文学者。"},{"t":"プトレマイオスの体系","n":"周転円を使い、惑星の動きを計算で予測した天動説の完成形。"},{"t":"コペルニクス","n":"1543年の主著で、太陽中心の宇宙を数学的にまとめ直した。"},{"t":"ガリレオ","n":"木星の衛星や金星の満ち欠けの観測で地動説を後押しし、宗教裁判にかけられた。"}],"anecdotes":["地動説への有力な反論は、地球が動くなら恒星の見える向きが年周的に変わるはずだ、というものだった。それが初めて測られたのは1838年。","天動説は誤りだが、惑星の位置をかなり正確に計算でき、約1400年にわたり暦や航海に使われた。","ブラーエは、地球を中心に太陽が回り、他の惑星は太陽を回るという折衷案を出して支持を集めた。"],"trivia":[{"f":"恒星の年周視差が初めて測られたのは1838年で、ドイツのベッセルが、はくちょう座61番星の距離を求めた。","q":"地球の公転の直接的な証拠となる、恒星の年周視差が初めて測られた年は？","a":"1838年","w":["1543年","1687年","1920年"]},{"f":"太陽中心の宇宙像は、コペルニクスの約1800年前に、古代ギリシャのアリスタルコスが唱えたとされる。","q":"コペルニクスより約1800年前に、太陽中心の宇宙像を唱えたとされる人物は？","a":"アリスタルコス","w":["ヒッパルコス","エラトステネス","ピタゴラス"]},{"f":"ガリレオ裁判をめぐり、1992年にローマ教皇ヨハネ・パウロ2世が、当時の神学者たちの誤りを認める演説をした。","q":"ローマ教皇がガリレオ裁判をめぐる誤りを公式に認めた年は？","a":"1992年","w":["1822年","1965年","2000年"]}],"people":["プトレマイオス","コペルニクス","ガリレオ","ケプラー"],"related":["プトレマイオス","コペルニクス","周転円","地動説","年周視差","アリスタルコス","宗教裁判"]},{"id":"kepler3","name":"ケプラーの3法則","full":"ケプラーの惑星運動の3法則","en":"Kepler's Laws of Planetary Motion","region":"海外","category":"宇宙像・法則","when":"1609〜1619年","where":"ドイツ・プラハ","era":"科学革命","tagline":"惑星は楕円を描き、太陽に近いほど速く動く","facts":[{"t":"第1法則（楕円軌道）","n":"惑星は、太陽を一つの焦点とする楕円を描いて回る。"},{"t":"第2法則（面積速度一定）","n":"惑星と太陽を結ぶ線は、同じ時間に同じ面積を掃く。太陽に近いほど速く動く。"},{"t":"第3法則（調和の法則）","n":"公転周期の2乗は、軌道の長半径の3乗に比例する。"},{"t":"位置づけ","n":"観測から導かれた経験則で、のちにニュートンが万有引力から理論的に説明した。"}],"famous":[{"t":"火星の軌道","n":"第1・第2法則は、ブラーエの火星の観測データを分析して導かれた。"},{"t":"地球の公転","n":"地球の公転軌道は円に近く、楕円のつぶれ具合を示す離心率は約0.017。"},{"t":"系外惑星","n":"第3法則は、系外惑星の軌道や連星の質量を見積もる計算にも使われる。"}],"anecdotes":["第1・第2法則は1609年の『新天文学』、第3法則は1619年の『世界の調和』で発表され、10年の間があいている。","ニュートンは、引力が距離の2乗に反比例するなら惑星は楕円を描くことを数学で示し、法則を理論から導いた。","ケプラーは第3法則を、神がつくった宇宙の調和を示す発見として、大きな喜びをもって書き記したとされる。"],"trivia":[{"f":"地球は1月初めごろ太陽に最も近づくため、日本のある北半球の冬のほうが、公転の速さが速い。","q":"地球が太陽にいちばん近づくのは、およそいつか？","a":"1月初め","w":["7月初め","3月下旬","9月下旬"]},{"f":"地球の公転軌道はほとんど円に近く、楕円のつぶれ具合を表す離心率は約0.017しかない。","q":"地球の公転軌道の離心率は、およそいくつか？","a":"約0.017","w":["約0.17","約0.0017","約0.5"]}],"people":["ケプラー","ブラーエ","ニュートン"],"related":["ケプラー","楕円","離心率","面積速度","万有引力","新天文学","火星"]},{"id":"gravity","name":"万有引力","full":"万有引力の法則（ニュートンの重力理論）","en":"Universal Gravitation","region":"海外","category":"宇宙像・法則","when":"1687年（プリンキピア）","where":"イギリス","era":"科学革命","tagline":"リンゴも月も同じ力で引かれる。天と地を一つにした法則","facts":[{"t":"内容","n":"質量をもつ物体どうしは、質量の積に比例し距離の2乗に反比例する力で引き合う。"},{"t":"天と地の統一","n":"木から落ちる実と、月が地球をまわる力を同じ原理で説明し、天上と地上の区別をなくした。"},{"t":"潮の満ち引き","n":"月と太陽の引力の差で海面が上下する潮汐も、この法則で説明できる。"},{"t":"限界","n":"水星の軌道のずれは説明できず、1915年の一般相対性理論が引力を時空のゆがみとして説明した。"}],"famous":[{"t":"海王星の発見","n":"天王星の軌道のずれから位置が計算され、1846年に発見された。"},{"t":"ハレー彗星の回帰","n":"ハレーが周期を計算し、予言どおり1758年に戻ってきた。"},{"t":"人工衛星","n":"地球をまわる人工衛星の軌道も、この法則で計算される。"}],"anecdotes":["ロバート・フックも逆2乗の引力を考えていたと主張し、ニュートンとの間で先取権をめぐる争いになった。","ハレーが予言したハレー彗星は1758年に戻ってきたが、ハレーは1742年に亡くなり、確認を見られなかった。","海王星は、望遠鏡で探す前に計算で位置が分かっていたことから、ペン先の発見とよばれた。"],"trivia":[{"f":"海王星は、天王星の軌道のずれから位置を計算で予測し、その計算した場所の近くで見つかった。","q":"万有引力にもとづく計算で位置を予測して見つかった惑星は？","a":"海王星","w":["天王星","土星","火星"]},{"f":"ハレー彗星は予言どおり1758年に戻ってきたが、ハレーはその16年前に亡くなっていた。","q":"ハレー彗星の回帰が確かめられたのは、ハレーの死の何年後か？","a":"約16年後","w":["約5年後","約30年後","約50年後"]},{"f":"月は地球との間で働く潮汐の作用で、毎年約3.8cmずつ、少しずつ地球から遠ざかっている。","q":"月が地球から遠ざかる速さは、およそどのくらいか？","a":"年に約3.8cm","w":["年に約3.8m","年に約38cm","年に約38km"]}],"people":["ニュートン","ケプラー"],"related":["ニュートン","海王星","ハレー彗星","潮汐","プリンキピア","一般相対性理論","運動の3法則"]},{"id":"expansion","name":"膨張する宇宙","full":"膨張する宇宙とビッグバン","en":"The Expanding Universe","region":"海外","category":"宇宙像・法則","when":"1920年代〜","where":"アメリカ・ベルギー","era":"近代・現代","tagline":"遠い銀河ほど速く遠ざかる。宇宙は広がり続けている","facts":[{"t":"観測","n":"遠い銀河ほど速く遠ざかっている。1929年にハッブルが距離と速度の関係を示した。"},{"t":"意味","n":"銀河が空間の中を飛んでいくというより、空間そのものが広がっていると捉える。"},{"t":"ビッグバン","n":"膨張をさかのぼると、宇宙は約138億年前に高温高密度の状態から始まったとされる。"},{"t":"加速膨張","n":"1998年、遠い超新星の観測から膨張が加速していると分かり、2011年のノーベル物理学賞につながった。"}],"famous":[{"t":"ルメートル","n":"ベルギーの司祭で天文学者。1927年に膨張宇宙の理論を示した。"},{"t":"ハッブル","n":"1929年、銀河の距離と後退速度の比例関係を示した。"},{"t":"宇宙マイクロ波背景放射","n":"1965年にペンジアスとウィルソンが発見した、ビッグバンの名残の電波。"},{"t":"ダークエネルギー","n":"加速膨張の原因とされる、正体不明のエネルギー。"}],"anecdotes":["アインシュタインは宇宙が静止していると考えて方程式に宇宙項を加えたが、膨張が示されると撤回したと伝わる。","ビッグバンの名は、定常宇宙論を唱えたホイルが、1949年のラジオ放送で対立する説を指して使ったのが広まったとされる。","1965年、ペンジアスとウィルソンは、アンテナの雑音の原因を探ってハトのふんまで掃除したが消えず、それが宇宙の名残の電波だったと伝わる。"],"trivia":[{"f":"ビッグバンという呼び名は、対立する定常宇宙論を唱えていたフレッド・ホイルが、ラジオ放送で使ったのが広まったとされる。","q":"ビッグバンの名を広めたとされる人物は？","a":"フレッド・ホイル","w":["ジョージ・ガモフ","エドウィン・ハッブル","ジョルジュ・ルメートル"]},{"f":"ペンジアスとウィルソンは、アンテナの雑音を消そうと巣くっていたハトのふんまで掃除したが消えず、それが宇宙背景放射だったと伝わる。","q":"雑音の原因を探る中で、二人が掃除したと伝わるものは？","a":"ハトのふん","w":["積もった雪","さびた金具","クモの巣"]},{"f":"1998年、二つの研究チームが遠方のIa型超新星の観測から、宇宙の膨張が加速していることを発見した。","q":"加速膨張の発見に使われた主な観測対象は？","a":"Ia型超新星","w":["球状星団","セファイド変光星","クエーサー"]}],"people":["ハッブル"],"related":["ハッブル","ルメートル","ハッブルの法則","ビッグバン","宇宙マイクロ波背景放射","ダークエネルギー","赤方偏移","超新星"]},{"id":"blackhole","name":"ブラックホール","full":"ブラックホール（黒い穴）","en":"Black Hole","region":"海外","category":"天体","when":"理論1916年・撮影2019年","where":"宇宙全域（銀河の中心など）","era":"近代・現代","tagline":"光さえ抜け出せない天体。2019年に影が撮影された","facts":[{"t":"定義","n":"重力が強すぎて光も脱出できない領域。その境界を事象の地平線とよぶ。"},{"t":"でき方","n":"重い星が一生を終えるとき、中心部がつぶれて生まれるものがある。"},{"t":"大きさ","n":"太陽の数倍〜数十倍の質量のものから、銀河の中心にある太陽の数百万倍以上のものまである。"},{"t":"観測","n":"2019年に銀河M87、2022年に天の川銀河の中心の、ブラックホールの影が電波で撮影された。"}],"famous":[{"t":"シュヴァルツシルト","n":"1916年、アインシュタインの方程式の解から、ブラックホールの半径にあたる値を導いた。"},{"t":"ホーキング","n":"1974年、ブラックホールが粒子を放出して蒸発するという理論（ホーキング放射）を発表した。"},{"t":"いて座A*","n":"天の川銀河の中心にあり、太陽の約400万倍の質量をもつブラックホール。"},{"t":"重力波の検出","n":"2015年、ブラックホール連星の合体による重力波が初めて直接検出された。"}],"anecdotes":["ブラックホールの名は、1960年代後半に物理学者のジョン・ホイーラーが広めたとされる。","18世紀には、ミッチェルやラプラスが、光でさえ逃げ出せないほど重い星の可能性をすでに考えていた。","2020年のノーベル物理学賞は、ブラックホールの形成の理論を示したペンローズと、銀河中心の観測をしたゲンツェルとゲズに贈られた。"],"trivia":[{"f":"ブラックホールの語を広めたのは、1960年代後半の講演などで使った物理学者のジョン・ホイーラーとされる。","q":"ブラックホールの呼び名を広めたとされる物理学者は？","a":"ジョン・ホイーラー","w":["ホーキング","ペンローズ","シュヴァルツシルト"]},{"f":"光でも脱出できない星の可能性は、1783年にイギリスの牧師ジョン・ミッチェルがすでに論じていた。","q":"1783年に、光も逃げ出せないほど重い星の可能性を論じたイギリスの牧師は？","a":"ジョン・ミッチェル","w":["ウィリアム・ハーシェル","エドモンド・ハレー","ロバート・フック"]},{"f":"天の川銀河の中心にあるブラックホール、いて座A*は、太陽の約400万倍の質量をもつ。","q":"天の川銀河の中心のブラックホールの質量は、太陽の約何倍か？","a":"約400万倍","w":["約4億倍","約40倍","約4000倍"]}],"people":[],"related":["事象の地平線","ホーキング放射","一般相対性理論","イベント・ホライズン・テレスコープ","いて座A*","超新星"]},{"id":"planets","name":"太陽系の惑星","full":"太陽系の八つの惑星","en":"Planets of the Solar System","region":"海外","category":"天体","when":"古代〜2006年","where":"太陽のまわりの軌道","era":"近代・現代","tagline":"水星から海王星まで8つ。2006年に冥王星が外れた","facts":[{"t":"八つの惑星","n":"水星・金星・地球・火星・木星・土星・天王星・海王星。太陽に近い順に並ぶ。"},{"t":"三つの仲間","n":"水星〜火星は岩石の地球型、木星と土星はガスの巨大惑星、天王星と海王星は氷の巨大惑星に分けられる。"},{"t":"惑星の定義","n":"2006年に国際天文学連合が、太陽を回る、丸い、軌道の近くに他の天体がない、の3条件を定めた。"},{"t":"冥王星","n":"1930年に発見されたが、この定義で惑星から外れ、準惑星に分類された。"}],"famous":[{"t":"天王星","n":"1781年、ハーシェルが望遠鏡で発見した最初の惑星。"},{"t":"海王星","n":"1846年、軌道の計算から位置を予測して見つかった。"},{"t":"金星","n":"表面温度が約460℃に達し、太陽系で最も高温の惑星。"},{"t":"木星","n":"太陽系で最大の惑星で、直径は地球の約11倍、質量は他の惑星の合計の2倍以上。"}],"anecdotes":["冥王星の名は、イギリスの11歳の少女ヴェネティア・バーニーが提案した案が採用された。","惑星は惑う星の意味で、星座の間を行きつ戻りつして動くように見えることから名づけられた。","冥王星の公転周期は約248年で、惑星とされた76年間は、1周の3分の1にも満たない。"],"trivia":[{"f":"太陽系で最も表面温度が高い惑星は、太陽に最も近い水星ではなく、厚い大気をもつ金星である。","q":"太陽系で表面温度がもっとも高い惑星は？","a":"金星","w":["水星","火星","木星"]},{"f":"冥王星の名は、イギリスの11歳の少女ヴェネティア・バーニーの提案が採用されたものである。","q":"冥王星の名を最初に提案したとされるのは？","a":"イギリスの11歳の少女","w":["発見者のトンボー","ローウェル天文台の所長","天文学者のローウェル本人"]},{"f":"金星は自転の向きが他の多くの惑星と逆で、1回の自転にかかる時間のほうが、公転周期より長い。","q":"金星の自転周期と公転周期の関係は？","a":"自転のほうが長い","w":["どちらもほぼ同じ長さ","公転のほうが長い","自転周期は約1日"]}],"people":["ハーシェル"],"related":["ハーシェル","冥王星","準惑星","国際天文学連合","天王星","海王星","火星"]},{"id":"zodiac","name":"星座と黄道十二宮","full":"星座と黄道十二宮（十二星座）","en":"Constellations and the Zodiac","region":"海外","category":"天体","when":"古代メソポタミア〜","where":"メソポタミア・ギリシャ","era":"古代・中世","tagline":"夜空を絵に見立てた88星座と、太陽の通り道の十二区分","facts":[{"t":"星座","n":"星を結んで神話の人物や動物に見立てたもの。現在は国際天文学連合が定めた88星座で空全体を分ける。"},{"t":"黄道十二宮","n":"太陽の通り道（黄道）を30度ずつ12に分けた区分。星占いの12星座にあたる。"},{"t":"起源","n":"星座の原型は古代メソポタミアにさかのぼり、黄道の12区分は紀元前5世紀ごろまでに整った。"},{"t":"星占いとのずれ","n":"歳差のため春分点は星座の間を動き、星占いの区分と実際の星座の位置はずれている。"}],"famous":[{"t":"プトレマイオスの48星座","n":"『アルマゲスト』に載った古代の星座で、現在の星座の土台。"},{"t":"北斗七星","n":"おおぐま座の一部。柄杓の形で、北極星を探す目印になる。"},{"t":"オリオン座","n":"冬の代表的な星座。三つ星と赤いベテルギウスが目立つ。"},{"t":"88星座の制定","n":"1922年に国際天文学連合が88に整理し、1928年に境界線を定めた。"}],"anecdotes":["太陽は毎年12月初めごろ、星占いにないへびつかい座を通過する。黄道が通る星座は13ある。","星占いで春分のころはおひつじ座とされるが、歳差のため、現在の春分の日に太陽がいるのはうお座である。","最も小さな星座はみなみじゅうじ座で、南半球では南の方角を知る目印として古くから親しまれてきた。"],"trivia":[{"f":"太陽の通り道である黄道が通る星座は、占いの12ではなく、へびつかい座を加えた13個である。","q":"黄道が通る星座は、いくつあるか？","a":"13個","w":["12個","11個","14個"]},{"f":"歳差のため、現在の春分の日に太陽がいる星座は、占いで最初のおひつじ座ではなくうお座である。","q":"現在の春分の日に太陽が位置する星座は？","a":"うお座","w":["おひつじ座","みずがめ座","おうし座"]},{"f":"88星座のうち最も小さいのはみなみじゅうじ座で、全天の星座の中で最小の面積しかない。","q":"88星座のうち最も面積が小さい星座は？","a":"みなみじゅうじ座","w":["こうま座","ろくぶんぎ座","こじし座"]}],"people":["プトレマイオス"],"related":["プトレマイオス","黄道","歳差","へびつかい座","国際天文学連合"]},{"id":"hst","name":"ハッブル宇宙望遠鏡","full":"ハッブル宇宙望遠鏡（HST）","en":"Hubble Space Telescope","region":"海外","category":"観測・暦","when":"1990年に打ち上げ","where":"地球周回軌道（高度約540km）","era":"近代・現代","tagline":"大気の外から宇宙を見続ける、世界で最も有名な望遠鏡","facts":[{"t":"概要","n":"口径2.4mの反射望遠鏡で、1990年にスペースシャトルで打ち上げられた。"},{"t":"利点","n":"大気のゆらぎや吸収がなく、地上より鮮明に見え、紫外線なども観測できる。"},{"t":"軌道","n":"高度約540kmの軌道を、約95分で地球1周する。"},{"t":"修理","n":"5回のスペースシャトルによる整備ミッションで、カメラなどの機器を交換・修理した。"}],"famous":[{"t":"ハッブル・ディープ・フィールド","n":"1995年、暗い空の一点を約10日間撮影し、約3000の銀河を写した。"},{"t":"宇宙膨張の測定","n":"セファイド変光星の観測で、宇宙膨張の速さの精度を高めた。"},{"t":"後継機","n":"2021年末に、赤外線で遠くを見るジェイムズ・ウェッブ宇宙望遠鏡が打ち上げられた。"}],"anecdotes":["打ち上げ直後、主鏡のわずかな研磨の誤差で、ぼやけた像しか撮れなかった。1993年の修理で補正光学系を取り付けて直した。","主鏡のずれは、髪の毛の太さの約50分の1というごくわずかなものだったが、遠い宇宙の像には致命的だった。","宇宙望遠鏡の構想は、1946年にライマン・スピッツァーが提案しており、実現まで40年以上かかった。"],"trivia":[{"f":"ハッブル宇宙望遠鏡の打ち上げ直後のぼやけは、主鏡が設計より髪の毛の約50分の1だけ平らに削られていたためだった。","q":"打ち上げ直後にぼやけた像しか撮れなかった原因は？","a":"主鏡の形のわずかな誤差","w":["太陽電池パネルの故障","姿勢制御装置の故障","鏡の表面に付いた汚れ"]},{"f":"1995年のハッブル・ディープ・フィールドは、星がほとんどない暗い空の一点を約10日間撮影したものだ。","q":"ハッブル・ディープ・フィールドで撮影された場所は、どんなところか？","a":"何もなさそうな暗い一点","w":["有名な銀河団の中心","天の川の中心方向","星雲の明るい中心部"]},{"f":"ハッブル宇宙望遠鏡は5回の整備ミッションで、宇宙飛行士が軌道上で機器を交換して性能を保った。","q":"ハッブル宇宙望遠鏡の整備ミッションは何回行われたか？","a":"5回","w":["2回","8回","12回"]}],"people":["ハッブル"],"related":["ハッブル","ハッブル・ディープ・フィールド","ジェイムズ・ウェッブ宇宙望遠鏡","スペースシャトル","球面収差","赤外線","膨張する宇宙"]},{"id":"jokyo","name":"貞享暦","full":"貞享暦（じょうきょうれき）","en":"Jokyo Calendar","region":"日本","category":"観測・暦","when":"1685年（貞享2年）から","where":"日本","era":"江戸","tagline":"日本人が初めて作った暦。800年続いた宣明暦に代わった","facts":[{"t":"作成者","n":"渋川春海が作り、貞享2年（1685年）から使われた。日本人が初めて編んだ暦とされる。"},{"t":"前の暦","n":"宣明暦は862年から使われ、実際の天体の動きと2日ほどずれていた。"},{"t":"方法","n":"中国の授時暦をもとに、日本と中国の経度の差を考えて補正した。"},{"t":"その後","n":"貞享暦のあと宝暦暦、寛政暦、天保暦と改暦が続き、1873年に太陽暦へ改まった。"}],"famous":[{"t":"渋川春海","n":"貞享暦を作り、幕府の初代天文方になった。"},{"t":"宣明暦","n":"平安時代前期から江戸時代前期まで、800年以上使われた暦。"},{"t":"寛政暦","n":"1798年から使われた暦。麻田剛立の弟子の高橋至時らが作った。"},{"t":"天保暦","n":"1844年から使われた、日本最後の太陰太陽暦。"}],"anecdotes":["暦は農作業や行事の日取りを決める生活の道具で、伊勢暦などの暦が各地で毎年配られた。","改暦に成功した春海は、その功績が認められ、幕府が新たに置いた天文方の初代に任じられた。","貞享暦の作成までの苦闘は、冲方丁の小説『天地明察』に描かれ、2012年に映画化された。"],"trivia":[{"f":"貞享暦の前に使われた宣明暦は、平安時代の862年から使われ、約820年間も日本の暦であり続けた。","q":"宣明暦が使われ続けた期間は、およそどのくらいか？","a":"約820年","w":["約200年","約450年","約1200年"]},{"f":"貞享暦のあとにも宝暦暦、寛政暦、天保暦と改暦が続き、天保暦が日本最後の太陰太陽暦になった。","q":"日本で最後に使われた太陰太陽暦は？","a":"天保暦","w":["宝暦暦","寛政暦","貞享暦"]}],"people":["渋川春海","麻田剛立"],"related":["渋川春海","宣明暦","授時暦","天文方","寛政暦","天地明察","太陰太陽暦と太陽暦"]},{"id":"calendar","name":"太陰太陽暦と太陽暦","full":"太陰太陽暦（旧暦）と太陽暦（グレゴリオ暦）","en":"Lunisolar and Solar Calendars","region":"日本","category":"観測・暦","when":"古代〜1873年の改暦","where":"日本・世界","era":"近代","tagline":"旧暦から新暦へ。明治5年12月は2日しかなかった","facts":[{"t":"太陰太陽暦","n":"月の満ち欠けで月を数え、閏月を入れて季節とのずれを直す暦。いわゆる旧暦。"},{"t":"太陽暦","n":"地球の公転にもとづく暦。1年は約365.2422日で、現行のグレゴリオ暦は閏年で調整する。"},{"t":"明治の改暦","n":"1872年12月3日を1873年1月1日とし、日本は太陽暦に切り替えた。"},{"t":"閏年のルール","n":"4年に1度の閏年だが、100で割り切れる年は平年、400で割り切れる年は閏年とする。"}],"famous":[{"t":"グレゴリオ暦","n":"1582年にローマ教皇グレゴリウス13世が制定した。現在、世界の多くの国で使われている。"},{"t":"二十四節気","n":"太陽の動きで1年を24に分けた区分。立春や冬至など、旧暦でも季節の目安に使われた。"},{"t":"福沢諭吉の改暦弁","n":"改暦の仕組みをやさしく説明した小冊子で、広く読まれた。"}],"anecdotes":["明治5年12月は2日で終わった。改暦の発表は同年11月9日で、元日まで約3週間しかなかった。","改暦を急いだ理由の一つは、翌年に閏月があると給料を13か月分払うことになり、財政が苦しい政府がそれを避けたかったためとされる。","福沢諭吉は、改暦に戸惑う人びとのために『改暦弁』を短期間で書き上げ、広く読まれたとされる。"],"trivia":[{"f":"明治5年12月3日が明治6年1月1日になったため、明治5年12月は2日しかなかった。","q":"明治5年12月は、何日で終わったか？","a":"2日間","w":["12日間","20日間","30日間"]},{"f":"福沢諭吉は、改暦の仕組みを説明する小冊子『改暦弁』を書いた。代表作『学問のすゝめ』とは別の本である。","q":"福沢諭吉が太陽暦への改暦を説明するために書いたのは？","a":"小冊子の『改暦弁』","w":["『学問のすゝめ』","『西洋事情』","『文明論之概略』"]},{"f":"グレゴリオ暦は400年に97回の閏年を置き、1年の平均を365.2425日にして季節とのずれを小さくしている。","q":"グレゴリオ暦で、400年のうち閏年は何回か？","a":"97回","w":["96回","98回","100回"]}],"people":["渋川春海"],"related":["貞享暦","渋川春海","閏月","グレゴリオ暦","旧暦","改暦弁"]},{"id":"subaru","name":"すばる望遠鏡","full":"すばる望遠鏡（国立天文台ハワイ観測所）","en":"Subaru Telescope","region":"日本","category":"観測・暦","when":"1999年完成・2000年観測開始","where":"ハワイ島マウナケア山頂","era":"現代","tagline":"ハワイの山頂から宇宙を見る、日本の口径8.2m望遠鏡","facts":[{"t":"概要","n":"国立天文台が建設した口径8.2mの光学赤外線望遠鏡。1999年に完成した。"},{"t":"場所","n":"ハワイ島マウナケアの山頂（標高4000m超）。空気が薄く乾き、星がよく見える。"},{"t":"主鏡","n":"一枚鏡としては世界最大級。厚さ約20cmと薄く、約260本の支持装置で形を保つ。"},{"t":"広い視野","n":"主焦点の広視野カメラで、遠方の銀河や暗黒物質の分布を広範囲に調べる。"}],"famous":[{"t":"初期宇宙の探査","n":"遠くの銀河を探し、できて間もない宇宙の姿を調べる成果を上げてきた。"},{"t":"系外惑星","n":"恒星のまわりの惑星や円盤を直接撮影する観測も行う。"},{"t":"暗黒物質の地図","n":"広視野カメラで銀河の見え方のゆがみを調べ、暗黒物質の分布を描き出す。"}],"anecdotes":["名前のすばるは、おうし座のプレアデス星団の和名で、広く名前を募る公募によって選ばれた。","自動車メーカーのスバルの社名も、望遠鏡の名と同じおうし座のプレアデス星団に由来する。","山頂は標高が高く酸素が薄いため、観測者は中腹の宿泊施設で体を慣らしてから山頂へ上がる。"],"trivia":[{"f":"すばるはおうし座のプレアデス星団の和名で、自動車メーカーのスバルの社名も同じ星団に由来する。","q":"すばる望遠鏡の名前が指す天体は？","a":"プレアデス星団","w":["オリオン大星雲","アンドロメダ銀河","ヒアデス星団"]},{"f":"すばる望遠鏡の主鏡は厚さ約20cmと薄く、約260本の支持装置が下から押して形を保っている。","q":"すばる望遠鏡の薄い主鏡の形を保つ仕組みは？","a":"多数の支持装置による制御","w":["鏡を水銀の池に浮かべる","液体窒素による冷却","小さな鏡を並べて貼る"]}],"people":[],"related":["マウナケア","国立天文台","ハッブル宇宙望遠鏡","プレアデス星団","暗黒物質","七夕と二十八宿"]},{"id":"neutrino","name":"ニュートリノ天文学","full":"ニュートリノ天文学（宇宙ニュートリノの観測）","en":"Neutrino Astronomy","region":"日本","category":"観測・暦","when":"1987年〜","where":"岐阜県飛騨市（神岡）","era":"現代","tagline":"物質とほとんど反応しない粒子を、地下の巨大水槽で捉える","facts":[{"t":"ニュートリノ","n":"電荷をもたず、物質とほとんど反応しない素粒子。毎秒、体を何兆個も通り抜ける。"},{"t":"観測の仕組み","n":"地下の巨大な水槽で、まれに起きる反応が出す淡い光を、多数の光センサーで捉える。"},{"t":"成果","n":"1987年に超新星爆発のニュートリノを検出し、1998年にはニュートリノに質量があることを示す振動を発見した。"},{"t":"受賞","n":"2002年に小柴昌俊、2015年に梶田隆章が、ノーベル物理学賞を受賞した。"}],"famous":[{"t":"カミオカンデ","n":"1983年に観測を始めた、神岡鉱山の地下の装置。"},{"t":"スーパーカミオカンデ","n":"1996年に観測を始めた後継装置。約5万トンの純水と、約1万1千本の光センサーを備える。"},{"t":"アイスキューブ","n":"南極の氷を使い、1立方キロメートルの規模でニュートリノを探す観測装置。"}],"anecdotes":["スーパーカミオカンデは地下約1000mにあり、地上の宇宙線の影響を岩盤で避けている。","1987年の超新星は約16万光年先の大マゼラン雲で起き、ニュートリノは光より数時間早く観測された。","ニュートリノは1930年にパウリが存在を予言し、検出されたのは26年後の1956年だった。"],"trivia":[{"f":"1987年の超新星では、爆発の光が地球に届くより数時間早く、ニュートリノがカミオカンデで観測された。","q":"超新星SN1987Aのニュートリノは、光が届くよりどのくらい早く観測されたか？","a":"数時間ほど早く","w":["ほぼ同時","数日ほど早く","1年ほど早く"]},{"f":"スーパーカミオカンデの水槽には約5万トンの純水が満たされ、約1万1千本の光センサーが壁を覆っている。","q":"スーパーカミオカンデの水槽の水の量は、およそどのくらいか？","a":"約5万トン","w":["約500トン","約5000トン","約50万トン"]},{"f":"ニュートリノは1930年にパウリが存在を予言したが、実際に検出されたのは26年後の1956年だった。","q":"ニュートリノの存在予言から検出までは、およそ何年かかったか？","a":"約26年","w":["約6年","約60年","約100年"]}],"people":["小柴昌俊"],"related":["カミオカンデ","スーパーカミオカンデ","SN1987A","梶田隆章","ノーベル物理学賞","チェレンコフ光","ニュートリノ振動","パウリ"]},{"id":"hayabusa","name":"小惑星探査機はやぶさ","full":"小惑星探査機はやぶさ・はやぶさ2","en":"Hayabusa Asteroid Explorer","region":"日本","category":"観測・暦","when":"2003年打ち上げ・2010年帰還","where":"小惑星イトカワ・リュウグウ","era":"現代","tagline":"小惑星のかけらを持ち帰った、日本の探査機","facts":[{"t":"初代はやぶさ","n":"2003年に打ち上げられ、2005年に小惑星イトカワに到着。2010年6月に地球へ帰還した。"},{"t":"成果","n":"小惑星の表面から物質を持ち帰った、世界で初めての探査機となった。"},{"t":"技術","n":"イオンエンジンで航行し、地球の重力を使って加速するスイングバイも行った。"},{"t":"はやぶさ2","n":"2014年に打ち上げられ、小惑星リュウグウから約5.4gの試料を2020年12月に持ち帰った。"}],"famous":[{"t":"イトカワ","n":"細長い形の小惑星。日本のロケット開発の父、糸川英夫にちなんで名づけられた。"},{"t":"リュウグウ","n":"炭素を多く含むとされる小惑星。はやぶさ2が訪れた。"},{"t":"帰還カプセル","n":"2010年、オーストラリアのウーメラ砂漠に着地した。"}],"anecdotes":["はやぶさは通信の途絶や燃料の漏れ、エンジンの故障など多くのトラブルを乗り越え、約7年、約60億kmを航行して帰ってきた。","4台のイオンエンジンの壊れた部分を組み合わせ、1台として動かす操作で帰還の道を開いた。","地球に帰還した本体は大気圏で燃え尽き、その光が夜空に流れ、カプセルだけが分かれて地上に降りた。"],"trivia":[{"f":"はやぶさは約7年間かけて約60億kmを航行し、予定より遅れて2010年6月に地球へ帰ってきた。","q":"初代はやぶさが航行した距離は、およそどのくらいか？","a":"約60億km","w":["約6億km","約600億km","約6000万km"]},{"f":"小惑星イトカワの名は、日本のロケット開発の父とよばれる糸川英夫にちなむ。糸川は1955年にペンシルロケットの実験を行った。","q":"糸川英夫が1955年に水平発射実験を行った、小型のロケットは？","a":"ペンシルロケット","w":["カッパロケット","ラムダロケット","ミューロケット"]},{"f":"はやぶさ2は2020年12月、小惑星リュウグウの砂や石を、約5.4g持ち帰ることに成功した。","q":"はやぶさ2がリュウグウから持ち帰った試料の量は、およそどのくらいか？","a":"約5.4g","w":["約54kg","約540g","約0.5g"]}],"people":[],"related":["イトカワ","リュウグウ","はやぶさ2","イオンエンジン","糸川英夫"]},{"id":"tanabata","name":"七夕と二十八宿","full":"七夕（織姫と彦星）と二十八宿","en":"Tanabata and the 28 Lunar Mansions","region":"日本","category":"観測・暦","when":"古代中国から日本へ","where":"中国・日本","era":"江戸","tagline":"織姫と彦星の星伝説と、月の道を28に分けた星座","facts":[{"t":"七夕","n":"こと座のベガ（織姫）とわし座のアルタイル（彦星）が、天の川をはさんで年に1度会うという伝説にもとづく行事。"},{"t":"起源","n":"中国の牽牛織女の伝説に、日本古来の機織りの信仰である棚機つ女が結びついたとされる。"},{"t":"旧暦の七夕","n":"もとは旧暦7月7日の行事で、現在の暦では8月ごろにあたる。梅雨の時期の7月7日より星が見やすい。"},{"t":"二十八宿","n":"月が天球を一周する約27.3日にあわせ、月の通り道を28に分けた中国・インド由来の星座区分。"}],"famous":[{"t":"ベガとアルタイル","n":"ベガは約25光年、アルタイルは約17光年の距離にある。夏の大三角をつくる。"},{"t":"キトラ古墳","n":"奈良県明日香村の古墳。天井の星図は、世界最古級の本格的な天文図とされる。"},{"t":"昴宿","n":"二十八宿の一つ。プレアデス星団のことで、すばる望遠鏡の名の由来。"}],"anecdotes":["ベガとアルタイルの間は約15光年。光でも約15年かかるので、年に1度の再会は星の世界ではありえない。","短冊に願いごとを書いて笹に飾る風習は、江戸時代に寺子屋などを通じて庶民へ広まったとされる。","七夕を「たなばた」と読むのは、機を織る道具である棚機と、それを使う棚機つ女の信仰に由来するとされる。"],"trivia":[{"f":"織姫星ベガと彦星アルタイルの間は約15光年で、光でも15年かかるほど離れている。","q":"ベガとアルタイルの間の距離は、およそどのくらいか？","a":"約15光年","w":["約1.5光年","約150光年","約1500光年"]},{"f":"七夕をたなばたと読むのは、日本古来の機織りの信仰である棚機つ女の棚機に由来するとされる。","q":"七夕をたなばたと読む由来とされるものは？","a":"機織りの信仰","w":["笹を立てる風習","星を数える遊び","川に舟を流す儀式"]},{"f":"奈良県明日香村のキトラ古墳の天井には、現存する世界最古級の本格的な天文図が描かれている。","q":"世界最古級の天文図が天井に描かれた、奈良県明日香村の古墳は？","a":"キトラ古墳","w":["藤ノ木古墳","石舞台古墳","箸墓古墳"]}],"people":[],"related":["ベガ","アルタイル","天の川","夏の大三角","キトラ古墳","二十八宿","旧暦"]}],"glossary":[{"t":"アルマゲスト","kind":"work","d":"プトレマイオスが著した全13巻の天文書。天動説の数理モデルを集大成し、千年以上、教科書として読まれた。","en":"Almagest"},{"t":"周転円","kind":"term","d":"惑星が小さな円を描きながら、その中心が大きな円を回るとする古代の模型。プトレマイオスが惑星の逆行の説明に用いた。","en":"Epicycle"},{"t":"ヒッパルコス","kind":"person","d":"紀元前2世紀の古代ギリシャの天文学者。星表を作り、歳差を見つけたとされ、プトレマイオスに大きな影響を与えた。","en":"Hipparchus"},{"t":"アレクサンドリア","kind":"place","d":"エジプトの地中海岸の都市。大図書館があった古代の学術の中心で、プトレマイオスが活動したとされる地。","en":"Alexandria"},{"t":"天球の回転について","kind":"work","d":"コペルニクスが1543年に刊行した主著。太陽を中心とする宇宙の姿を、全6巻で数学的に述べた。","en":"De revolutionibus orbium coelestium"},{"t":"地動説","kind":"term","d":"地球が自転しながら太陽のまわりを公転するという説。コペルニクスが体系化し、ガリレオやケプラーが支えた。","en":"Heliocentrism"},{"t":"ウラニボリ","kind":"place","d":"ブラーエがデンマークのヴェン島に築いた天文台。大型の観測器具をそなえ、望遠鏡以前で最高の精度の観測を行った。","en":"Uraniborg"},{"t":"超新星","kind":"term","d":"重い星が一生の最後に起こす大爆発。1572年のものはブラーエが、1987年のものは小柴昌俊らが観測した。","en":"Supernova"},{"t":"彗星","kind":"term","d":"氷とちりでできた小天体で、太陽に近づくと尾をのばす。ブラーエは1577年の大彗星が月より遠いと示した。","en":"Comet"},{"t":"ティコ体系","kind":"term","d":"地球が中心で、太陽が地球を、他の惑星が太陽を回るとするブラーエの宇宙模型。天動説と地動説の折衷。","en":"Tychonic system"},{"t":"楕円","kind":"term","d":"二つの焦点からの距離の和が一定の曲線。ケプラーは、惑星が太陽を一つの焦点とする楕円を描くと見いだした。","en":"Ellipse"},{"t":"新天文学","kind":"work","d":"ケプラーが1609年に刊行した書。火星の軌道の分析から、楕円軌道と面積速度一定の法則を導いた。","en":"Astronomia Nova"},{"t":"火星","kind":"place","d":"太陽から4番目の惑星。ブラーエの火星の観測が、ケプラーの法則の発見を導いた。","en":"Mars"},{"t":"世界の調和","kind":"work","d":"ケプラーが1619年に刊行した書。第3法則を述べ、惑星の運動を音楽の調和になぞらえて論じた。","en":"Harmonices Mundi"},{"t":"ケプラー宇宙望遠鏡","kind":"work","d":"2009年に打ち上げられたNASAの宇宙望遠鏡。恒星の明るさの低下を捉え、数千個の系外惑星を見つけた。","en":"Kepler Space Telescope"},{"t":"星界の報告","kind":"work","d":"ガリレオが1610年に刊行した小冊子。望遠鏡で見た月の表面や木星の4衛星などを世に知らせた。","en":"Sidereus Nuncius"},{"t":"木星の衛星","kind":"term","d":"ガリレオが1610年に見つけた、イオ・エウロパ・ガニメデ・カリストの4つ。ガリレオ衛星とよばれる。","en":"Galilean moons"},{"t":"太陽の黒点","kind":"term","d":"太陽の表面にみえる、周囲より温度が低く暗い斑点。ガリレオが望遠鏡で観察し、太陽も変化すると示した。","en":"Sunspot"},{"t":"金星の満ち欠け","kind":"term","d":"金星が月のように満ち欠けして見える現象。ガリレオの観測は、地動説を支える証拠の一つになった。","en":"Phases of Venus"},{"t":"宗教裁判","kind":"event","d":"ガリレオが1633年に受けた、ローマの異端審問所による裁判。地動説を教えないと誓わされた。","en":"Trial of Galileo"},{"t":"プリンキピア","kind":"work","d":"ニュートンが1687年に刊行した主著。運動の3法則と万有引力の法則を、数学で体系的に示した。","en":"Principia"},{"t":"運動の3法則","kind":"term","d":"慣性の法則、運動の法則、作用・反作用の法則。ニュートンが『プリンキピア』でまとめた力学の基本。","en":"Newton's laws of motion"},{"t":"反射望遠鏡","kind":"term","d":"凹面鏡で光を集める望遠鏡。ニュートンが実用的な形を作り、ハーシェルは大口径のものを自作した。","en":"Reflecting telescope"},{"t":"微積分","kind":"term","d":"変化の割合と総量を扱う数学。ニュートンとライプニッツが別々に作り上げ、先取権をめぐって争った。","en":"Calculus"},{"t":"ハレー彗星","kind":"term","d":"約76年周期で戻る彗星。ハレーが軌道を計算して回帰を予言し、1758年に予言どおり再び現れた。","en":"Halley's Comet"},{"t":"天王星","kind":"place","d":"太陽から7番目の惑星。1781年にハーシェルが発見した。軌道のずれが海王星発見の手がかりになった。","en":"Uranus"},{"t":"赤外線","kind":"term","d":"目に見える赤い光より波長の長い電磁波。1800年にハーシェルが太陽光の中に見つけた。熱を伝える働きが強い。","en":"Infrared"},{"t":"星雲","kind":"term","d":"ガスやちりが雲のように広がって見える天体。ハーシェルは多数の星雲を調べて目録にまとめた。","en":"Nebula"},{"t":"天の川","kind":"place","d":"夜空を横切る淡い光の帯で、天の川銀河の星々が集まって見えるもの。ハーシェルは星を数えてその形を調べた。","en":"Milky Way"},{"t":"ハッブルの法則","kind":"term","d":"遠い銀河ほど速く遠ざかるという、距離と後退速度の比例関係。1929年にハッブルが示し、宇宙の膨張を表す。","en":"Hubble's law"},{"t":"アンドロメダ銀河","kind":"place","d":"地球から約250万光年にある渦巻銀河。ハッブルが距離を測り、天の川の外の銀河だと示した。","en":"Andromeda Galaxy"},{"t":"セファイド変光星","kind":"term","d":"明るさが周期的に変わる星で、周期が長いほど明るい。ハッブルが銀河の距離を測るものさしに使った。","en":"Cepheid variable"},{"t":"ルメートル","kind":"person","d":"ベルギーの司祭で天文学者のジョルジュ・ルメートル。1927年に膨張宇宙の理論を示し、ビッグバンの原型を考えた。","en":"Georges Lemaitre"},{"t":"宣明暦","kind":"term","d":"平安時代の862年から使われた、中国の唐の暦。貞享暦まで800年以上続き、ずれが目立つようになっていた。","en":"Senmyo calendar"},{"t":"天文方","kind":"term","d":"江戸幕府の役職で、暦の計算や天体観測を担った。渋川春海が初代で、のちに高橋至時らが務めた。","en":"Tenmongata"},{"t":"天地明察","kind":"work","d":"冲方丁の歴史小説。渋川春海の改暦事業を描き、2010年に本屋大賞を受賞し、2012年に映画化された。","en":"Tenchi Meisatsu"},{"t":"囲碁","kind":"term","d":"盤上で石を置いて陣地を競うゲーム。江戸幕府には碁方があり、渋川春海は碁の名家・安井家の出身だった。","en":"Go"},{"t":"日食","kind":"term","d":"月が太陽を隠す現象。麻田剛立は1763年の日食を予測して的中させ、渋川春海は予測の失敗も経験した。","en":"Solar eclipse"},{"t":"寛政暦","kind":"term","d":"1798年から使われた暦。麻田剛立の弟子の高橋至時と間重富が中心になって作った。","en":"Kansei calendar"},{"t":"高橋至時","kind":"person","d":"江戸幕府の天文方で、麻田剛立の弟子。寛政暦を作り、50歳ごろの伊能忠敬を弟子に迎えた。","en":"Takahashi Yoshitoki"},{"t":"間重富","kind":"person","d":"大坂の商家に生まれ、麻田剛立に学んだ天文家。高橋至時とともに寛政暦の作成に加わった。","en":"Hazama Shigetomi"},{"t":"大日本沿海輿地全図","kind":"work","d":"伊能忠敬の測量をもとに作られた日本全図。大図・中図・小図があり、1821年に幕府へ提出された。","en":"Dai Nihon Enkai Yochi Zenzu"},{"t":"測量","kind":"term","d":"距離や角度を測って、土地の位置や形を決める技術。忠敬は距離と方位の測定に、天体観測による緯度の確認を組み合わせた。","en":"Surveying"},{"t":"蝦夷地","kind":"place","d":"江戸時代の北海道方面の呼び名。伊能忠敬が1800年に最初の測量を行った地。","en":"Ezo"},{"t":"シーボルト事件","kind":"event","d":"1828年に伊能図の写しなどの持ち出しが発覚し、ドイツ人医師シーボルトが翌年に国外追放となった事件。","en":"Siebold Incident"},{"t":"Z項","kind":"term","d":"緯度変化の式に現れる、観測地点によらず共通して現れる小さな項。木村栄が1902年に見いだした。","en":"Z term"},{"t":"水沢緯度観測所","kind":"place","d":"1899年に岩手県水沢に設けられた観測所。木村栄が初代所長を務め、現在は国立天文台水沢の名で続く。","en":"Mizusawa Latitude Observatory"},{"t":"国際緯度観測事業","kind":"event","d":"北緯39度8分の同じ緯度上に世界6か所の観測点を置き、星を観測して緯度変化を調べた国際事業。水沢も参加した。","en":"International Latitude Service"},{"t":"緯度変化","kind":"term","d":"地球の自転軸が地球本体に対して動くことなどで、観測地点の緯度がわずかに変わる現象。木村栄の研究対象だった。","en":"Latitude variation"},{"t":"文化勲章","kind":"event","d":"1937年に制定された、文化の発展に功績のある人に贈られる勲章。木村栄は最初の受章者9人の一人。","en":"Order of Culture"},{"t":"国立天文台","kind":"place","d":"日本の天文学の中核となる研究機関。水沢の観測所やすばる望遠鏡などを運営している。","en":"National Astronomical Observatory of Japan"},{"t":"カミオカンデ","kind":"term","d":"岐阜県の神岡鉱山の地下に作られた、水を使うニュートリノ観測装置。小柴昌俊が率い、超新星ニュートリノを捉えた。","en":"Kamiokande"},{"t":"スーパーカミオカンデ","kind":"term","d":"カミオカンデの後継装置で、約5万トンの純水を使う。1998年にニュートリノ振動の証拠を示した。","en":"Super-Kamiokande"},{"t":"SN1987A","kind":"event","d":"1987年2月に大マゼラン雲で起きた超新星。ニュートリノが観測され、小柴昌俊のノーベル賞の業績につながった。","en":"SN 1987A"},{"t":"梶田隆章","kind":"person","d":"小柴昌俊の弟子の物理学者。1998年にニュートリノ振動の証拠を示し、2015年にノーベル物理学賞を受けた。","en":"Takaaki Kajita"},{"t":"ノーベル物理学賞","kind":"event","d":"ノーベル賞の部門の一つ。ニュートリノ関連では2002年に小柴昌俊ら、2015年に梶田隆章らが受賞した。","en":"Nobel Prize in Physics"},{"t":"神岡鉱山","kind":"place","d":"岐阜県飛騨市にあった鉱山。地下の深い空間が宇宙線を遮るため、カミオカンデなどが置かれた。","en":"Kamioka Mine"},{"t":"年周視差","kind":"term","d":"地球の公転により、近い恒星の見える向きが1年周期でわずかに変わる現象。1838年にベッセルが初めて測った。","en":"Stellar parallax"},{"t":"アリスタルコス","kind":"person","d":"紀元前3世紀の古代ギリシャの天文学者。太陽中心の宇宙像を唱えたとされ、太陽と月の大きさや距離も論じた。","en":"Aristarchus of Samos"},{"t":"離心率","kind":"term","d":"楕円のつぶれ具合を表す数。0なら円で、1に近いほど細長い。地球の公転軌道は約0.017。","en":"Eccentricity"},{"t":"面積速度","kind":"term","d":"惑星と太陽を結ぶ線が、単位時間に掃く面積。ケプラーの第2法則では、これが一定になる。","en":"Areal velocity"},{"t":"海王星","kind":"place","d":"太陽から最も遠い惑星。1846年に、天王星の軌道のずれをもとにした計算から位置が予測され、発見された。","en":"Neptune"},{"t":"潮汐","kind":"term","d":"月や太陽の引力で、海面が周期的に上下する現象。万有引力の法則の応用で説明される。","en":"Tide"},{"t":"一般相対性理論","kind":"term","d":"アインシュタインが1915年に完成した重力の理論。引力を時空のゆがみとして説明し、ブラックホールも予言した。","en":"General relativity"},{"t":"ビッグバン","kind":"event","d":"宇宙が高温高密度の状態から始まり、膨張してきたとする説。宇宙の年齢は約138億年と見積もられている。","en":"Big Bang"},{"t":"宇宙マイクロ波背景放射","kind":"term","d":"ビッグバンの名残として、宇宙全体から届く弱い電波。1965年にペンジアスとウィルソンが偶然見つけた。","en":"Cosmic microwave background"},{"t":"ダークエネルギー","kind":"term","d":"宇宙の膨張を加速させているとされる、正体不明のエネルギー。宇宙全体の約7割を占めるとされる。","en":"Dark energy"},{"t":"赤方偏移","kind":"term","d":"遠ざかる天体の光の波長が伸びて赤みを帯びる現象。ハッブルは銀河の赤方偏移から後退速度を求めた。","en":"Redshift"},{"t":"事象の地平線","kind":"term","d":"ブラックホールの境界面。内側からは光さえ外へ出られず、外からは内部の様子が見えない。","en":"Event horizon"},{"t":"ホーキング放射","kind":"term","d":"ブラックホールがわずかに粒子を放出して蒸発するという、ホーキングが1974年に示した理論。","en":"Hawking radiation"},{"t":"イベント・ホライズン・テレスコープ","kind":"work","d":"世界の電波望遠鏡をつないで地球サイズの望遠鏡にする計画。2019年にM87のブラックホールの影を撮影した。","en":"Event Horizon Telescope"},{"t":"いて座A*","kind":"place","d":"天の川銀河の中心にある巨大ブラックホール。質量は太陽の約400万倍で、2022年に影が撮影された。","en":"Sagittarius A*"},{"t":"冥王星","kind":"place","d":"1930年にトンボーが発見した天体。2006年に準惑星に分類され、惑星から外れた。","en":"Pluto"},{"t":"準惑星","kind":"term","d":"太陽を回り、丸いが、軌道上の他の天体を一掃していない天体。冥王星やエリスなどが分類される。","en":"Dwarf planet"},{"t":"国際天文学連合","kind":"term","d":"世界の天文学者の国際組織。1922年に88星座を定め、2006年に惑星の定義を決めた。","en":"International Astronomical Union"},{"t":"黄道","kind":"term","d":"天球上で、太陽が1年かけて通る見かけの道筋。黄道十二宮は、この道を12に分けた区分である。","en":"Ecliptic"},{"t":"歳差","kind":"term","d":"地球の自転軸が、約2万6千年かけて円を描くように向きを変える現象。春分点が星座の間をゆっくり動く原因。","en":"Precession"},{"t":"へびつかい座","kind":"term","d":"さそり座の北にある星座。黄道が通るが、星占いの12星座には入っていない。","en":"Ophiuchus"},{"t":"ハッブル・ディープ・フィールド","kind":"work","d":"1995年に、ハッブル宇宙望遠鏡が暗い空の一点を長時間撮影した画像。約3000の銀河が写っていた。","en":"Hubble Deep Field"},{"t":"ジェイムズ・ウェッブ宇宙望遠鏡","kind":"work","d":"2021年末に打ち上げられた、赤外線で観測する宇宙望遠鏡。ハッブル宇宙望遠鏡の後継とされる。","en":"James Webb Space Telescope"},{"t":"スペースシャトル","kind":"term","d":"アメリカの再使用型の宇宙船。1990年にハッブル宇宙望遠鏡を運び、その後の整備ミッションも担った。","en":"Space Shuttle"},{"t":"球面収差","kind":"term","d":"球面の鏡やレンズで、光が一点に集まらずぼやける現象。ハッブル宇宙望遠鏡では主鏡の誤差でこれが起きた。","en":"Spherical aberration"},{"t":"授時暦","kind":"term","d":"13世紀末に中国の元で作られた精密な暦。渋川春海はこれをもとに貞享暦をつくった。","en":"Shoushi calendar"},{"t":"閏月","kind":"term","d":"太陰太陽暦で、月と季節のずれを直すために加える13番目の月。旧暦では約3年に1度入る。","en":"Leap month"},{"t":"グレゴリオ暦","kind":"term","d":"1582年にローマ教皇グレゴリウス13世が制定した太陽暦。日本は1873年（明治6年）に採用した。","en":"Gregorian calendar"},{"t":"旧暦","kind":"term","d":"太陰太陽暦のうち、明治5年まで日本で使われた暦。七夕やお盆など、行事の日付の背景にある。","en":"Old Japanese calendar"},{"t":"改暦弁","kind":"work","d":"福沢諭吉が1873年に書いた小冊子。太陽暦への改暦の理由と仕組みを、やさしく説明した。","en":"Kairekiben ろ、凹面鏡を使う小型の反射望遠鏡を自作した。"}],"anecdotes":["1665年、ペストの流行でケンブリッジ大学が閉鎖され、故郷に戻った。この間に重力や光の着想を得たとされ、後に驚異の年と呼ばれる。","木から落ちるリンゴを見て引力を思いついたという話は、晩年に本人が語ったと伝わる。リンゴが頭に当たったというのは後の脚色とされる。","1696年に造幣局の監事となり、のちに長官を務めた。偽金づくりの摘発にも力を入れ、学者でありながら役人としても働いた。"],"trivia":[{"f":"ニュートンは物理学のほかに錬金術や神学にも没頭し、それらの分野でも膨大な手稿を残した。","q":"ニュートンが物理学のほかに膨大な手稿を残した分野は?","a":"錬金術と神学","w":["医学と解剖学","音楽と作曲","航海術と造船"]},{"f":"ニュートンは1699年から亡くなるまで王立造幣局の長官を務め、貨幣の偽造の取り締まりにも当たった。","q":"ニュートンが1699年から亡くなるまで務めた役職は?","a":"王立造幣局の長官","w":["王立天文台の台長","イングランド銀行の総裁","大蔵省の会計監査官"]},{"f":"ニュートンの墓はウェストミンスター寺院にあり、後にダーウィンもその近くに葬られた。","q":"ニュートンが葬られた寺院は?","a":"ウェストミンスター寺院","w":["聖ポール大聖堂","カンタベリー大聖堂","ヨーク大聖堂"]}],"related":["ライプニッツ","プリンキピア","微積分法","ケンブリッジ大学","万有引力と運動の法則","ダーウィン","アインシュタイン"],"look":{"hair":"wig","hc":"#D9D2C5","face":"normal","collar":"cravat","cloth":"#4A3A30"}},{"id":"lavoisier","name":"ラボアジエ","full":"アントワーヌ・ラボアジエ","en":"Antoine Lavoisier","region":"海外","born":1743,"died":1794,"country":"フランス","era":"科学革命・啓蒙","tagline":"燃焼の謎を解き、近代化学の土台を築いた","works":[{"t":"質量保存の法則","n":"化学反応の前後で全体の質量が変わらないことを、精密な天秤で示した。"},{"t":"燃焼の理論","n":"燃えるとは物が酸素と結びつくことだと説き、フロギストン説を退けた。"},{"t":"化学命名法の刷新","n":"1787年、物質の名を成分にもとづいて決める新しい命名法の制定に加わった。"},{"t":"『化学原論』","n":"1789年に出した教科書。元素の表を示し、近代化学の出発点となった。"}],"anecdotes":["1774年にプリーストリーが訪れて酸素の実験を伝え、ラボアジエはそれを追試して燃焼の意味を組み立て直したとされる。","徴税請負人の組織に加わって収入を得、その資金で実験器具をそろえた。この経歴が、革命期に裁かれる理由になった。","1794年5月、恐怖政治の下でギロチン刑となった。数学者ラグランジュは、その死を学問の大きな損失と惜しんだと伝わる。"],"trivia":[{"f":"ラボアジエが革命期に処刑された背景には、徴税請負人の組織に属していた経歴があった。","q":"ラボアジエが処刑された背景にあるとされる、彼のもう一つの職は?","a":"徴税請負人","w":["宮廷の侍医","海軍の主計官","王立銀行の頭取"]},{"f":"ラボアジエが1789年に示した元素の表には、光と熱素(カロリック)も単体として並んでいた。","q":"ラボアジエの元素表に単体として載っていた、今日では物質とされないものは?","a":"光と熱素","w":["電気と磁気という二つの流体","音と色を生む振動のもと","生命力と呼ばれる目に見えない力"]},{"f":"酸素の名は『酸を生むもの』の意味で、ラボアジエはすべての酸に酸素が含まれると考えたが、塩酸はそうではなかった。","q":"ラボアジエが付けた『酸素』の名は、もともとどんな意味?","a":"酸を生むもの","w":["燃えるもの","息をするもの","空気の精"]}],"related":["質量保存の法則","酸素","フロギストン説","化学原論","フランス革命","元素と周期表","マリ・キュリー"],"look":{"hair":"wig","hc":"#E6E2DA","face":"normal","collar":"cravat","cloth":"#2B2B33"}},{"id":"darwin","name":"ダーウィン","full":"チャールズ・ダーウィン","en":"Charles Darwin","region":"海外","born":1809,"died":1882,"country":"イギリス","era":"近代","tagline":"自然選択で、生物の多様さと共通の祖先を説明した","works":[{"t":"『ビーグル号航海記』","n":"世界一周の調査航海で見た地層や生物を記録し、博物学者として名を上げた。"},{"t":"『種の起原』(1859)","n":"生物は共通の祖先から自然選択によって変化してきたと、膨大な証拠で論じた。"},{"t":"『人間の由来』(1871)","n":"人間も進化の産物として論じ、性選択の考えも示した。"},{"t":"サンゴ礁の成因論","n":"航海中の観察から、環礁は沈む島のまわりにサンゴが育ってできるとする説を唱えた。"}],"anecdotes":["1858年、ウォレスから自分とよく似た考えを記した手紙を受け取り、同年リンネ学会で二人の論文が共同で発表された。","結婚の利点と欠点を紙に書き出して比べたのち、従姉のエマ・ウェッジウッドと結婚した。","1882年に亡くなり、ウェストミンスター寺院でニュートンの墓の近くに葬られた。"],"trivia":[{"f":"『適者生存』という言葉を作ったのはダーウィンではなく哲学者のスペンサーで、ダーウィンは後の版から用いた。","q":"『適者生存』という言葉を最初に使った人物は?","a":"スペンサー","w":["ダーウィン本人","博物学者ウォレス","生物学者ハクスリー"]},{"f":"ダーウィンは船長フィッツロイの話し相手を兼ねる博物学者として、自費でビーグル号に乗り込んだ。","q":"ダーウィンがビーグル号に乗った立場は?","a":"船長の話し相手役の博物学者","w":["船に付く医師","測量を担う士官","乗員を導く牧師"]},{"f":"『種の起原』の初版は1859年11月に発売され、書店への割り当て分が当日のうちに売り切れたとされる。","q":"『種の起原』の初版は、発売後どうなったとされる?","a":"発売当日に完売した","w":["数年間ほとんど売れなかった","出版直後に発禁処分を受けた","古書店を通じてだけ出回った"]}],"related":["自然選択","種の起原","ビーグル号航海","ガラパゴス諸島","ウォレス","進化論","ケンブリッジ大学","メンデル"],"look":{"hair":"bald","hc":"#CFCAC0","face":"normal","beard":"full","bc":"#DDD8CE","collar":"collar","cloth":"#2B2B33","frown":1}},{"id":"mendel","name":"メンデル","full":"グレゴール・ヨハン・メンデル","en":"Gregor Mendel","region":"海外","born":1822,"died":1884,"country":"オーストリア帝国（現チェコ）","era":"近代","tagline":"エンドウの交配から、遺伝の規則性を見いだした","works":[{"t":"エンドウの交配実験","n":"1850年代後半から約8年、数万株のエンドウを育て、形質の伝わり方を数えた。"},{"t":"「植物雑種の研究」","n":"1865年に口頭で発表し、翌年に論文として刊行。遺伝の規則性を数の比で示した。"},{"t":"優性・分離・独立の法則","n":"対立形質の現れ方に3対1などの比があることを示し、のちメンデルの法則と呼ばれた。"},{"t":"気象観測とミツバチの研究","n":"修道院で気象の観測を続け、ミツバチの交配の研究も行った。"}],"anecdotes":["1865年にブリュンの自然科学協会で発表したが、反響は乏しく、論文はその後30年以上ほとんど注目されなかった。","修道士として教師も務め、のち修道院長となった。院長の仕事が忙しくなり、研究は次第に続けにくくなったとされる。","1900年、ド・フリースら3人の植物学者が別々にメンデルの論文を見直し、法則が再発見された。没後16年がたっていた。"],"trivia":[{"f":"『遺伝子』という語はメンデルの没後に作られ、1909年にデンマークのヨハンセンが用いたのが始まりである。","q":"『遺伝子( lmicro","name":"細胞説と微生物学","full":"細胞説・自然発生説の否定・病原菌説","en":"Cell Theory and Microbiology","region":"海外","category":"生物・医学","when":"1665年〜1882年","where":"ヨーロッパ","era":"近代","tagline":"生き物は細胞でできていて、病は微生物が起こす","facts":[{"t":"細胞説(1838〜39)","n":"シュライデンが植物、シュワンが動物で、生物は細胞からできていると唱えた。"},{"t":"細胞の由来(1855)","n":"フィルヒョウが、細胞は細胞から生まれると述べ、病気を細胞の異常と見る考えを広めた。"},{"t":"自然発生説の否定","n":"1860年代、パスツールが微生物は空気中から入ると示し、発酵や腐敗に微生物が関わると示した。"},{"t":"病原菌説","n":"コッホが炭疽菌(1876年)や結核菌(1882年)を発見し、特定の菌が特定の病気を起こすと示した。"}],"famous":[{"t":"フックとコルク","n":"1665年、フックがコルクの断片に小さな部屋を見いだし、cellと名づけた。"},{"t":"レーウェンフック","n":"17世紀、自作の顕微鏡で細菌や原生動物を初めて観察した。"},{"t":"ジェンナーの種痘","n":"1796年、牛痘を使って天然痘を防ぐ方法を示した。"}],"anecdotes":["シュライデンとシュワンは、1837年の食事の席で細胞の話をして意気投合し、細胞説につながったと伝わる。","コッホは、助手ヘッセの妻の提案で、培地を固める材料にゼラチンの代わりに寒天を使うようになったと伝わる。"],"trivia":[{"f":"レーウェンフックの本業は織物商で、大学教育は受けていなかったが、自作の顕微鏡で微生物を観察した。","q":"微生物を初めて詳しく観察したレーウェンフックの本業は?","a":"織物商","w":["医師","眼鏡職人","大学教授"]},{"f":"世界結核デーの3月24日は、1882年にコッホが結核菌の発見を発表した日にちなむ。","q":"世界結核デーの3月24日が選ばれた由来は?","a":"コッホが結核菌の発見を発表した日","w":["BCGワクチンを初めて接種した日","世界保健機関が設立された日","北里柴三郎が菌を培養した日"]},{"f":"1665年にフックがcell(細胞)と名づけたのは、コルクの薄片に見えた小さな部屋だった。","q":"1665年、フックが顕微鏡で観察し、細胞の語の元になった材料は?","a":"コルク","w":["玉ねぎの薄皮","蝶の羽","鳥の羽毛"]}],"people":["パスツール"],"related":["フック","レーウェンフック","ジェンナー","コッホ","自然発生説","低温殺菌"]},{"id":"meson","name":"中間子論","full":"湯川の中間子論","en":"Meson Theory","region":"日本","category":"物理・宇宙","when":"1935年","where":"日本（大阪帝国大学）","era":"近代","tagline":"核力を担う未知の粒子を予言した","facts":[{"t":"核力の説明(1935)","n":"湯川が、陽子と中性子を結びつける核力を、新しい粒子のやり取りで説明した。"},{"t":"質量の見積もり","n":"力の届く距離が短いほど粒子は重いとして、質量を電子の約200倍と見積もった。"},{"t":"発見(1947)","n":"パウエルらが宇宙線の中に、湯川の粒子に当たるπ中間子を見つけた。"},{"t":"ノーベル賞(1949)","n":"湯川がこの業績でノーベル物理学賞を受け、日本人初の受賞となった。"}],"famous":[{"t":"パウエル","n":"写真乾板で宇宙線を調べ、1947年にπ中間子を発見した。"},{"t":"坂田昌一ら","n":"湯川と共同で中間子の研究を進めた、日本の理論物理学者たち。"},{"t":"力は粒子のやり取りで生じる","n":"のちの素粒子物理学の基本的な考え方の先駆けとなった。"}],"anecdotes":["湯川は着想を、1934年秋の夜に、核力の届く距離と粒子の質量の関係に気づいたこととして自伝に記している。","湯川は発表時28歳で、大阪帝国大学の講師だった。のちに京都帝国大学の教授となった。"],"trivia":[{"f":" とは","n":"体の細胞に少数の遺伝子を入れて初期化し、さまざまな細胞になれる能力をもたせた細胞。"},{"t":"作製の成功","n":"2006年にマウス、2007年にヒトの細胞で、山中伸弥らが作製に成功した。"},{"t":"ES細胞との違い","n":"受精卵を壊さずに、本人の細胞から作れる。倫理面の課題や拒絶反応が軽いと期待される。"},{"t":"活用","n":"病気のしくみの研究、薬の試験、網膜などの再生医療への応用が進む。"}],"famous":[{"t":"山中因子","n":"Oct3/4、Sox2、Klf4、c-Mycの4つの遺伝子で、細胞を初期化する。"},{"t":"ジョン・ガードン","n":"1962年のカエルの核移植で、成熟した細胞の核も初期化できることを示した。"},{"t":"網膜の移植","n":"2014年、iPS細胞から作った網膜の細胞を患者に移植する世界初の臨床研究が行われた。"}],"anecdotes":["山中らは24個の候補の遺伝子から、1つずつ除く方法で絞り込み、4つで足りることを突き止めた。","ガードンは1962年、カエルの腸の細胞の核を卵に移し、オタマジャクシまで育てた。この仕事が初期化の考えの土台となった。"],"trivia":[{"f":"山中らが2006年に最初に試した候補の遺伝子は24個で、そこから4つに絞り込んだ。","q":"2006年の研究で、山中らがまず候補とした遺伝子の数は?","a":"24個","w":["4個","12個","100個"]},{"f":"iPS細胞から作った細胞の人への移植は、2014年に目の網膜の病気を対象に世界で初めて行われた。","q":"世界初のiPS細胞由来の細胞移植が行われた部位は?","a":"目の網膜","w":["心臓","脊髄","皮膚"]},{"f":"ヒトiPS細胞は2007年、米国ウィスコンシン大学のトムソンのグループも、山中とほぼ同時に報告した。","q":"山中とほぼ同時にヒトiPS細胞を報告した米国のグループは?","a":"ウィスコンシン大学のトムソンら","w":["ハーバード大学のメルトンら","スタンフォード大学のワイスマンら","ソーク研究所のゲージら"]}],"people":["山中伸弥"],"related":["山中因子","ES細胞","再生医療","ジョン・ガードン","京都大学","ノーベル賞と日本人"]},{"id":"serum","name":"血清療法","full":"抗毒素血清による治療","en":"Serum Therapy","region":"日本","category":"生物・医学","when":"1890年","where":"ドイツ（ベルリン）","era":"近代","tagline":"免疫をもつ動物の血清で、毒素を打ち消す治療","facts":[{"t":"発見(1890)","n":"北里柴三郎とベーリングが、破傷風とジフテリアの毒素を打ち消す抗毒素が血清にできることを示した。"},{"t":"方法","n":"毒素を少量ずつ動物に与えて免疫をつけ、その血清を患者に注射して治療や予防に使う。"},{"t":"北里の基礎","n":"北里は1889年、嫌気性の破傷風菌の純粋培養に成功し、毒素の研究を可能にした。"},{"t":"広がり","n":"ジフテリアの治療に使われ、現在もヘビ毒に対する抗毒素などに生かされている。"}],"famous":[{"t":"ベーリング","n":"ジフテリア抗毒素の研究で、1901年に第1回ノーベル生理学・医学賞を受けた。"},{"t":"北里柴三郎","n":"破傷風菌の培養と抗毒素の発見に貢献した。"},{"t":"ジフテリア血清","n":"多くの子どもの命を救い、小児の病気の治療を変えた。"}],"anecdotes":["血清療法の論文は、1890年にベーリングと北里の連名で発表された。ベーリングはコッホの研究所に勤めるドイツの軍医だった。","第1回ノーベル生理学・医学賞は、血清療法でベーリングだけが受けた。北里は候補に挙がったが受賞者には含まれなかった。","北里が破傷風菌を純粋培養できたのは、菌が酸素を嫌う性質と、芽胞が熱に強い性質を利用したからとされる。"],"trivia":[{"f":"ジフテリアの抗毒素は、主に馬に毒素を少しずつ注射して免疫をつけ、その血清から作られた。","q":"ジフテリア抗毒素の血清を採るため、主に免疫をつけた動物は?","a":"馬","w":["牛","ウサギ","羊"]},{"f":"1925年冬、ジフテリアが流行したアラスカの町ノームに、血清は犬ぞりのリレーで届けられた。","q":"1925年冬、ジフテリアが流行したアラスカのノームへ、血清を届けた方法は?","a":"犬ぞりのリレー","w":["小型飛行機の直行便","砕氷船での輸送","雪上車の車列"]}],"people":["北里柴三郎"],"related":["抗毒素","ベーリング","破傷風","コッホ","伝染病研究所","細胞説と微生物学"]},{"id":"nobeljp","name":"ノーベル賞と日本人","full":"自然科学分野の日本人受賞の系譜","en":"Japanese Nobel Laureates in Science","region":"日本","category":"物理・宇宙","when":"1949年〜","where":"日本・スウェーデン","era":"","tagline":"湯川から山中へ、日本の科学の歩みを映す受賞の系譜","facts":[{"t":"賞の始まり","n":"ノーベル賞は1901年に始まり、授賞式は毎年12月10日に開かれる。"},{"t":"日本人初(1949)","n":"湯川秀樹が物理学賞を受け、日本人初のノーベル賞受賞者となった。"},{"t":"受賞の広がり","n":"2000年以降、物理学・化学・生理学医学の3賞で、日本出身の受賞者が相次いだ。"},{"t":"受賞者の数","n":"自然科学の3賞では、日本出身の受賞者が20人を超える。"}],"famous":[{"t":"湯川秀樹(1949年)","n":"中間子の予言で物理学賞を受けた、日本人初の受賞者。"},{"t":"朝永振一郎(1965年)","n":"くりこみ理論で、シュウィンガー、ファインマンと共に物理学賞を受けた。"},{"t":"小柴昌俊(2002年)","n":"ニュートリノの観測で、物理学賞を受けた。"},{"t":"山中伸弥(2012年)","n":"iPS細胞の作製で、生理学・医学賞を受けた。"}],"anecdotes":["湯川の受賞は敗戦から4年後で、暗い世相の日本に大きな希望を与えたと言われる。","1987年、大マゼラン雲の超新星からのニュートリノを神岡の検出器が捉え、小柴昌俊の2002年の受賞につながった。","ノーベル賞は、ダイナマイトの発明者ノーベルの遺言で創設され、その遺産を基金として運営される。"],"trivia":[{"f":"授賞式が毎年12月10日なのは、この日がアルフレッド・ノーベルの命日だからである。","q":"ノーベル賞の授賞式が12月10日に開かれる理由は?","a":"ノーベルの命日だから","w":["賞の創設を決めた日だから","ノーベルの誕生日だから","最初の授賞式の日だから"]},{"f":"カミオカンデは、もともと陽子崩壊を探す装置として造られ、のちに超新星のニュートリノを捉えた。","q":"カミオカンデが当初の目的として探していた現象は?","a":"陽子崩壊","w":["超新星のニュートリノ","太陽のニュートリノ","暗黒物質"]},{"f":"2015年の生理学・医学賞を受けた大村智は、静岡県のゴルフ場の近くで採った土の中の微生物から、寄生虫病の薬の元を見つけた。","q":"大村智が薬の元になる微生物を見つけた場所は?","a":"ゴルフ場の近くの土","w":["北海道の温泉の湯だまり","沖縄のサンゴ礁の海底","東京湾の海底の泥"]}],"people":["湯川秀樹","朝永振一郎","山中伸弥"],"related":["ノーベル賞","小柴昌俊","カミオカンデ","大村智","アルフレッド・ノーベル","北里柴三郎"]}],"glossary":[{"t":"ライプニッツ","kind":"person","d":"ドイツの哲学者・数学者（1646〜1716）。ニュートンとは別に微積分法を考え、先取権をめぐって争った。","en":"Gottfried Leibniz"},{"t":"ウォレス","kind":"person","d":"イギリスの博物学者（1823〜1913）。ダーウィンとは別に自然選択の考えに至り、1858年に共同で発表した。","en":"Alfred Russel Wallace"},{"t":"ド・フリース","kind":"person","d":"オランダの植物学者（1848〜1935）。1900年にメンデルの法則を再発見した一人で、突然変異説も唱えた。","en":"Hugo de Vries"},{"t":"コッホ","kind":"person","d":"ドイツの細菌学者（1843〜1910）。炭疽菌・結核菌・コレラ菌を発見し、北里柴三郎を指導した。","en":"Robert Koch"},{"t":"デービー","kind":"person","d":"イギリスの化学者（1778〜1829）。多くの元素を電気分解で単離し、ファラデーを助手に採用した。","en":"Humphry Davy"},{"t":"ヘルツ","kind":"person","d":"ドイツの物理学者（1857〜1894）。1880年代に電磁波を実験で確かめた。周波数の単位ヘルツに名を残す。","en":"Heinrich Hertz"},{"t":"ピエール・キュリー","kind":"person","d":"フランスの物理学者（1859〜1906）。マリの夫で、共に放射能を研究し、1903年にノーベル賞を受けた。","en":"Pierre Curie"},{"t":"ベクレル","kind":"person","d":"フランスの物理学者（1852〜1908）。1896年にウランが放射線を出すことを発見した。放射能の強さの単位に名を残す。","en":"Henri Becquerel"},{"t":"エディントン","kind":"person","d":"イギリスの天文学者（1882〜1944）。1919年の日食観測で、一般相対性理論の予言を支持する結果を得た。","en":"Arthur Eddington"},{"t":"ラザフォード","kind":"person","d":"ニュージーランド出身の物理学者（1871〜1937）。原子核を発見した。ボーアが若い時期に師事した一人。","en":"Ernest Rutherford"},{"t":"ハイゼンベルク","kind":"person","d":"ドイツの物理学者（1901〜1976）。行列力学と不確定性原理で知られ、ボーアと親交があった。","en":"Werner Heisenberg"},{"t":"ベーリング","kind":"person","d":"ドイツの細菌学者（1854〜1917）。北里とジフテリア・破傷風の抗毒素を研究し、1901年に第1回ノーベル賞を受けた。","en":"Emil von Behring"},{"t":"福沢諭吉","kind":"person","d":"明治の思想家・教育者（1835〜1901）。慶應義塾を創設し、北里柴三郎の研究所設立を支援した。","en":"Fukuzawa Yukichi"},{"t":"志賀潔","kind":"person","d":"日本の細菌学者（1871〜1957）。北里の門下で、1897年に赤痢菌を発見した。","en":"Shiga Kiyoshi"},{"t":"パウエル","kind":"person","d":"イギリスの物理学者（1903〜1969）。宇宙線の写真乾板で1947年にπ中間子を見つけ、1950年にノーベル賞を受けた。","en":"Cecil Powell"},{"t":"シュウィンガー","kind":"person","d":"アメリカの物理学者（1918〜1994）。くりこみを独自に定式化し、1965年に朝永らとノーベル賞を受けた。","en":"Julian Schwinger"},{"t":"ファインマン","kind":"person","d":"アメリカの物理学者（1918〜1988）。ファインマン図を考案し、1965年に朝永らとノーベル賞を受けた。","en":"Richard Feynman"},{"t":"ジョン・ガードン","kind":"person","d":"イギリスの発生生物学者（1933年生まれ）。1962年にカエルで核移植に成功し、2012年に山中伸弥と共に受賞した。","en":"John Gurdon"},{"t":"ガリレオ・ガリレイ","kind":"person","d":"イタリアの科学者（1564〜1642）。落下や振り子を研究し、慣性の考えの先駆けとなった。","en":"Galileo Galilei"},{"t":"メンデレーエフ","kind":"person","d":"ロシアの化学者（1834〜1907）。1869年に周期表を発表し、未発見の元素を予言した。","en":"Dmitri Mendeleev"},{"t":"ラマルク","kind":"person","d":"フランスの博物学者（1744〜1829）。1809年に、使う器官が発達するという用不用説を述べた。","en":"Jean-Baptiste Lamarck"},{"t":"ロザリンド・フランクリン","kind":"person","d":"イギリスの化学者（1920〜1958）。DNAのX線回折写真で、二重らせんの解明に重要な手がかりを与えた。","en":"Rosalind Franklin"},{"t":"エルステッド","kind":"person","d":"デンマークの物理学者（1777〜1851）。1820年に電流が磁針を動かすことを発見し、電磁気学の扉を開いた。","en":"Hans Christian Oersted"},{"t":"プランク","kind":"person","d":"ドイツの物理学者（1858〜1947）。1900年にエネルギーが量子としてやり取りされるとし、量子論の扉を開いた。","en":"Max Planck"},{"t":"シュレーディンガー","kind":"person","d":"オーストリアの物理学者（1887〜1961）。1926年に波動方程式を示し、1933年にノーベル賞を受けた。","en":"Erwin Schroedinger"},{"t":"フック","kind":"person","d":"イギリスの科学者（1635〜1703）。1665年の『ミクログラフィア』で顕微鏡観察を示し、cell（細胞）の語を使った。","en":"Robert Hooke"},{"t":"レーウェンフック","kind":"person","d":"オランダの商人・顕微鏡製作者（1632〜1723）。自作の顕微鏡で、細菌や原生動物を初めて観察した。","en":"Antonie van Leeuwenhoek"},{"t":"ジェンナー","kind":"person","d":"イギリスの医師（1749〜1823）。1796年に牛痘を使う種痘を開発し、天然痘予防の道を開いた。","en":"Edward Jenner"},{"t":"小柴昌俊","kind":"person","d":"日本の物理学者（1926〜2020）。カミオカンデで超新星からのニュートリノを捉え、2002年にノーベル物理学賞を受けた。","en":"Koshiba Masatoshi"},{"t":"大村智","kind":"person","d":"日本の化学者（1935年生まれ）。土の中の微生物から寄生虫病の薬の元を見つけ、2015年に生理学・医学賞を受けた。","en":"Omura Satoshi"},{"t":"アルフレッド・ノーベル","kind":"person","d":"スウェーデンの化学者・発明家（1833〜1896）。ダイナマイトを発明し、遺言でノーベル賞を創設した。","en":"Alfred Nobel"},{"t":"プリンキピア","kind":"work","d":"ニュートンが1687年に刊行した『自然哲学の数学的諸原理』。運動の三法則と万有引力の法則を述べた。","en":"Principia Mathematica"},{"t":"化学原論","kind":"work","d":"ラボアジエが1789年に出した教科書。元素表と新しい命名法を載せ、近代化学の出発点とされる。","en":"Elements of Chemistry"},{"t":"種の起原","kind":"work","d":"ダーウィンが1859年に刊行した本。自然選択による進化を、証拠とともに論じた。","en":"On the Origin of Species"},{"t":"フランス革命","kind":"event","d":"1789年に始まったフランスの政治変革。ラボアジエは革命期の1794年に処刑された。","en":"French Revolution"},{"t":"ビーグル号航海","kind":"event","d":"1831〜36年の、英国海軍の測量船ビーグル号による世界一周の調査航海。ダーウィンが博物学者として乗り込んだ。","en":"Voyage of the Beagle"},{"t":"ケンブリッジ大学","kind":"place","d":"イギリスの名門大学。ニュートンとダーウィンが学び、マクスウェルが教授を務めた。","en":"University of Cambridge"},{"t":"ガラパゴス諸島","kind":"place","d":"南米エクアドル沖の火山島群。島ごとに異なる生物が見られ、ダーウィンの着想に影響したとされる。","en":"Galapagos Islands"},{"t":"伝染病研究所","kind":"place","d":"1892年に北里が福沢諭吉の支援で設けた日本初の伝染病研究機関。東京大学医科学研究所の前身。","en":"Institute for Infectious Diseases"},{"t":"ロックフェラー医学研究所","kind":"place","d":"ニューヨークにあった医学研究機関（現ロックフェラー大学）。野口英世が長く研究した。","en":"Rockefeller Institute"},{"t":"アクラ","kind":"place","d":"西アフリカ・ガーナの首都。野口英世が1928年に黄熱の研究中に亡くなった地。","en":"Accra"},{"t":"京都大学","kind":"place","d":"京都にある国立大学。湯川秀樹と朝永振一郎が学び、山中伸弥のiPS細胞研究所もある。","en":"Kyoto University"},{"t":"理化学研究所","kind":"place","d":"1917年創設の日本の研究機関。朝永は仁科研究室で学び、113番元素ニホニウムも合成された。","en":"RIKEN"},{"t":"海王星","kind":"place","d":"太陽系の第8惑星。1846年に天王星の軌道のずれから位置が計算され、直後に発見された。","en":"Neptune"},{"t":"カミオカンデ","kind":"place","d":"岐阜県の神岡鉱山の地下にある検出器。1980年代に観測を始め、超新星ニュートリノの検出で知られる。","en":"Kamiokande"},{"t":"微積分法","kind":"term","d":"変化の割合と面積を扱う数学。ニュートンとライプニッツがそれぞれ独自に体系化したとされる。","en":"calculus"},{"t":"質量保存の法則","kind":"term","d":"化学反応の前後で、全体の質量は変わらないという法則。ラボアジエが精密な測定で示した。","en":"law of conservation of mass"},{"t":"酸素","kind":"term","d":"空気の約2割を占める気体。ラボアジエが燃焼との関わりを説明し、その名を付けた。","en":"oxygen"},{"t":"フロギストン説","kind":"term","d":"燃える物には燃素が含まれ、燃焼で逃げるとした17〜18世紀の説。ラボアジエが退けた。","en":"phlogiston theory"},{"t":"自然選択","kind":"term","d":"環境に合った性質の個体がより多く子を残し、集団の性質が変わる仕組み。ダーウィンの進化論の中心。","en":"natural selection"},{"t":"エンドウ","kind":"term","d":"メンデルが交配実験に使ったマメ科の植物。形質がはっきり分かれ、扱いやすかった。","en":"pea"},{"t":"優性の法則","kind":"term","d":"対立する形質をもつ純系を交配すると、子には一方の形質だけが現れるという規則。メンデルが見いだした。","en":"law of dominance"},{"t":"分離の法則","kind":"term","d":"対になった遺伝の要素が、配偶子ができるときに分かれるという規則。孫の世代で3対1の比が現れる。","en":"law of segregation"},{"t":"自然発生説","kind":"term","d":"生物が無生物から自然に生じるという考え。パスツールが白鳥の首のフラスコの実験で否定した。","en":"spontaneous generation"},{"t":"低温殺菌","kind":"term","d":"飲食物を比較的低い温度で加熱し、有害な菌を減らす方法。パスツールがワインの腐敗防止で研究した。","en":"pasteurization"},{"t":"ワクチン","kind":"term","d":"弱めた病原体などを接種して免疫をつける予防法。語源は牛痘で、パスツールが広めた。","en":"vaccine"},{"t":"電磁誘導","kind":"term","d":"磁界の変化で導線に電流が生じる現象。ファラデーが1831年に発見し、発電機や変圧器の原理となった。","en":"electromagnetic induction"},{"t":"電気分解","kind":"term","d":"電気を通して物質を分解する方法。ファラデーが量的な関係を法則にまとめた。","en":"electrolysis"},{"t":"マクスウェル方程式","kind":"term","d":"電気と磁気の振る舞いを表す方程式群。マクスウェルがまとめ、光が電磁波であることを導いた。","en":"Maxwell's equations"},{"t":"電磁波","kind":"term","d":"電界と磁界が波として空間を伝わるもの。光や電波も仲間で、マクスウェルが存在を予言した。","en":"electromagnetic wave"},{"t":"マクスウェルの悪魔","kind":"term","d":"分子を選り分けて熱力学第二法則を破るように見える仮想の存在。マクスウェルが考えた思考実験。","en":"Maxwell's demon"},{"t":"ラジウム","kind":"term","d":"キュリー夫妻が1898年に発見した放射性元素。強い放射線を出し、がん治療にも使われた。","en":"radium"},{"t":"ポロニウム","kind":"term","d":"1898年に発見された放射性元素。マリ・キュリーが祖国ポーランドにちなんで命名した。","en":"polonium"},{"t":"放射能","kind":"term","d":"原子核が自然に壊れて放射線を出す性質。マリ・キュリーがこの名で呼んだ。","en":"radioactivity"},{"t":"光電効果","kind":"term","d":"金属に光を当てると電子が飛び出す現象。アインシュタインが光量子で説明し、ノーベル賞を受けた。","en":"photoelectric effect"},{"t":"E=mc2","kind":"term","d":"質量とエネルギーが等価であることを示す式。アインシュタインが1905年に導いた。","en":"mass-energy equivalence"},{"t":"原子模型","kind":"term","d":"原子の内部の構造を表す考え方。ボーアは1913年に、電子が飛び飛びの軌道をもつ模型を示した。","en":"atomic model"},{"t":"コペンハーゲン解釈","kind":"term","d":"量子力学の代表的な解釈。測定すると確率で結果が決まるとし、ボーアらが形作った。","en":"Copenhagen interpretation"},{"t":"ボーリウム","kind":"term","d":"107番元素（元素記号Bh）。1997年にボーアにちなんで命名された。","en":"bohrium"},{"t":"破傷風","kind":"term","d":"破傷風菌の毒素で筋肉がこわばる病気。北里柴三郎が菌の純粋培養に成功し、血清療法につなげた。","en":"tetanus"},{"t":"黄熱病","kind":"term","d":"蚊が媒介するウイルス性の熱病。野口英世は研究中にこの病に感染し、1928年に亡くなった。","en":"yellow fever"},{"t":"核力","kind":"term","d":"原子核の中で陽子と中性子を結びつける強い力。湯川は粒子のやり取りで説明した。","en":"nuclear force"},{"t":"π中間子","kind":"term","d":"核力を担う粒子で、電子の約270倍の質量。湯川の予言を受け、1947年に発見された。","en":"pion"},{"t":"素粒子","kind":"term","d":"物質を構成する最小の単位とされる粒子。電子やクォークなど。湯川の中間子論が研究を広げた。","en":"elementary particle"},{"t":"量子電磁力学","kind":"term","d":"電気や磁気の力を光子のやり取りで量子論的に表す理論。くりこみにより精密な予測ができた。","en":"quantum electrodynamics"},{"t":"超多時間理論","kind":"term","d":"朝永が1943年に作った、相対性理論と量子論を矛盾なく組み合わせる理論形式。","en":"super-many-time theory"},{"t":"山中因子","kind":"term","d":"山中伸弥が2006年に見いだした、体細胞を初期化する4つの遺伝子。","en":"Yamanaka factors"},{"t":"ES細胞","kind":"term","d":"初期の胚から作る、何にでもなれる幹細胞。iPS細胞は同様の能力を、受精卵を使わずに実現した。","en":"embryonic stem cell"},{"t":"再生医療","kind":"term","d":"失われた組織や臓器を、細胞を使って修復・再生する医療。iPS細胞の応用が期待される。","en":"regenerative medicine"},{"t":"ケプラーの法則","kind":"term","d":"ケプラーが見いだした惑星運動の3法則。惑星は楕円を描く。ニュートンは引力から導いた。","en":"Kepler's laws"},{"t":"ハレー彗星","kind":"term","d":"約76年の周期で戻る彗星。ハレーが周期を予言し、再来が引力の理論の裏づけとなった。","en":"Halley's Comet"},{"t":"原子番号","kind":"term","d":"原子核の陽子の数で、元素の順番を決める数。モーズリーが1913年にX線の研究で意義を示した。","en":"atomic number"},{"t":"ガリウム","kind":"term","d":"31番元素。メンデレーエフの予言に合う性質で1875年に見つかり、融点は約30度。","en":"gallium"},{"t":"ニホニウム","kind":"term","d":"113番元素（Nh）。理化学研究所の研究グループが合成し、2016年に日本由来の名が付いた。","en":"nihonium"},{"t":"遺伝子","kind":"term","d":"遺伝情報の単位。メンデルの要素にあたり、DNAの特定の領域として働く。","en":"gene"},{"t":"染色体","kind":"term","d":"細胞分裂のときに見える、DNAとたんぱく質からなる構造。モーガンが遺伝子の担い手だと示した。","en":"chromosome"},{"t":"二重らせん","kind":"term","d":"DNAの立体構造。2本の鎖が向かい合ってらせんを描き、塩基が対になる。1953年に提案された。","en":"double helix"},{"t":"ヒトゲノム","kind":"term","d":"ヒトのもつ遺伝情報の全体。約30億の塩基対からなり、解読は2003年に完了が宣言された。","en":"human genome"},{"t":"時空","kind":"term","d":"空間の3次元と時間を一体にした見方。相対性理論では、質量によって曲がるとされる。","en":"spacetime"},{"t":"重力波","kind":"term","d":"時空のゆがみが波として伝わるもの。一般相対性理論が予言し、2015年に初めて直接検出された。","en":"gravitational wave"},{"t":"GPS","kind":"term","d":"衛星からの電波で位置を求める仕組み。衛星の時計には、相対性理論による補正が欠かせない。","en":"Global Positioning System"},{"t":"宇宙定数","kind":"term","d":"一般相対性理論の式に加えられた定数項。アインシュタインが1917年に導入し、のち暗黒エネルギーの候補として注目された。","en":"cosmological constant"},{"t":"不確定性原理","kind":"term","d":"粒子の位置と運動量を同時に正確には決められないという原理。ハイゼンベルクが1927年に示した。","en":"uncertainty principle"},{"t":"シュレーディンガーの猫","kind":"term","d":"箱の中の猫の生死で量子の重ね合わせの奇妙さを示した、1935年の思考実験。","en":"Schroedinger's cat"},{"t":"二重スリット実験","kind":"term","d":"2つの細い隙間に光や電子を通すと、干渉の縞が出る実験。粒子が波の性質をもつことを示す。","en":"double-slit experiment"},{"t":"宇宙線","kind":"term","d":"宇宙から地球に降り注ぐ高エネルギーの粒子。π中間子やミュー粒子の発見の舞台となった。","en":"cosmic ray"},{"t":"ラム・シフト","kind":"term","d":"水素原子のエネルギー準位の、理論値からのごくわずかなずれ。1947年の測定がくりこみ理論の契機となった。","en":"Lamb shift"},{"t":"抗毒素","kind":"term","d":"毒素を中和する抗体を含む血清。動物に毒素を少しずつ与えて作り、治療に使う。","en":"antitoxin"},{"t":"ノーベル賞","kind":"term","d":"ノーベルの遺言で1901年に始まった国際的な賞。自然科学では物理学・化学・生理学医学の3部門がある。","en":"Nobel Prize"}]},"human":{"people":[{"id":"socrates","name":"ソクラテス","full":"ソクラテス","en":"Socrates","region":"海外","born":-470,"approx":true,"died":-399,"country":"古代ギリシア（アテネ）","era":"古代","tagline":"問答で人々の思い込みを問い直し、哲学を街角に持ち込んだ人","works":[{"t":"問答法","n":"街で出会った人に問いを重ね、答えの矛盾から思い込みを吟味していく対話の方法。"},{"t":"無知の知","n":"自分は大切なことを知らないと自覚している点で、知者を自任する人よりわずかに賢いとした立場。"},{"t":"魂への配慮","n":"富や名声よりも、魂をよりよくすることを人間の最優先の務めと説いた。"},{"t":"著作を残さなかった哲学","n":"自らは書かず、プラトンやクセノフォンの著作を通じて思想が後世に伝わった。"}],"anecdotes":["デルフォイの神託が「ソクラテスより賢い者はいない」と告げたと伝わる。彼はその意味を確かめようと、知者とされる人々を訪ね歩いた。","紀元前399年、神々を認めず青年を害したとして訴えられ、裁判で死刑が決まった。逃亡の勧めを断り、毒杯をあおいだとされる。","出征した遠征の冬、厳しい寒さのなかでも裸足で平然と歩いていたと、プラトンの『饗宴』でアルキビアデスが語っている。"],"trivia":[{"f":"ソクラテスは自分では一冊も著作を書かなかった。私たちが彼を知るのは、主にプラトンやクセノフォンらの著作を通してである。","q":"ソクラテス自身が書き残した著作について、正しい説明はどれか。","a":"自身は著作を残さず、弟子の著作で思想が伝わる","w":["『国家』を著し、理想の国のあり方と正義を論じた","『ニコマコス倫理学』を著し、幸福を論じた","『方法序説』を著し、方法的懐疑を説いた"]},{"f":"裁判のあとも、刑はすぐには執行されなかった。デロス島へ送る聖なる船が戻るまで処刑が禁じられていたため、約1か月、牢で過ごしたとされる。","q":"ソクラテスの死刑がすぐに行われなかった理由として伝わるものは何か。","a":"デロス島へ向かう聖なる船が戻るまで処刑が禁じられていた","w":["弟子たちが差し出した保釈金が裁判所に受理され刑が猶予された","アテネが戦争のさなかで刑を執行する役人がいなかった","最後の著作を書き終えるまで裁判所が待つことを認めた"]},{"f":"ソクラテスは石工の子として生まれたと伝わる。のちに哲学の祖と呼ばれる人物が、職人の家の出だったことになる。","q":"ソクラテスの生まれについて伝わる話はどれか。","a":"石工として働く職人の家に生まれたと伝わる","w":["アテネの有力な政治家の家に生まれたと伝わる","港町の船乗りの子として育ったと伝わる","神殿に仕える神官の家に生まれたと伝わる"]}],"related":["プラトン","アテネ","無知の知","問答法","ソクラテスの裁判","『ソクラテスの弁明』"],"look":{"hair":"bald","hc":"#8A8580","face":"round","beard":"full","bc":"#8A8580","collar":"toga","cloth":"#D8D0BC"}},{"id":"platon","name":"プラトン","full":"プラトン","en":"Plato","region":"海外","born":-427,"approx":true,"died":-347,"country":"古代ギリシア（アテネ）","era":"古代","tagline":"イデアを説き、学園アカデメイアを開いた西洋哲学の源流","works":[{"t":"『国家』","n":"正義とは何かを問い、理想の国家と哲人王の統治、洞窟の比喩を描いた主著の一つ。"},{"t":"イデア論","n":"感覚でとらえる現実の背後に、永遠で変わらない真の実在としてのイデアがあると説いた。"},{"t":"『ソクラテスの弁明』","n":"裁判での師ソクラテスの弁論を描いた作品。師の姿を後世に伝える基本の資料。"},{"t":"アカデメイアの創設","n":"アテネ郊外に学園を開いた。アリストテレスもここで学び、のちの学園の原型となった。"}],"anecdotes":["本名はアリストクレスで、肩幅が広いことから「プラトン（広い）
