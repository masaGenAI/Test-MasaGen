<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>リベラルアーツ</title>
<style>
  :root{
    --bg:#F7F8FA; --paper:#FFFFFF; --ink:#16181D; --muted:#667085; --line:#E1E5EC; --soft:#F0F3F8;
    --accent:#8A5A2B; --accent-soft:#F6EBDD; --navy:#1E3A6E;
    --c-baroque:#B7791F; --c-classical:#2F7D6D; --c-romantic:#B83280; --c-national:#2B6CB0; --c-late:#6B46C1; --c-impress:#3182CE; --c-modern:#C05621;
    --k-inst:#0E7C86; --k-person:#2B6CB0; --k-work:#B83280; --k-term:#2F7D6D; --k-place:#B7791F; --k-event:#6B46C1;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12151B; --paper:#1B2029; --ink:#E7EAF1; --muted:#98A2B3; --line:#2B313D; --soft:#232936;
      --accent:#E0B27A; --accent-soft:#2F2619; --navy:#C6D6EC;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;line-height:1.7;-webkit-text-size-adjust:100%;}
  button{font:inherit;color:inherit;cursor:pointer;}
  .wrap{max-width:1180px;margin:0 auto;padding:18px 16px 60px;}
  .eyebrow{font-size:11px;letter-spacing:.14em;color:var(--accent);font-weight:700;}
  h1{margin:2px 0 4px;font-size:26px;font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;}
  .lead{margin:0 0 14px;color:var(--muted);font-size:13px;}
  .dgroups{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:10px;margin:10px 0 16px;}
  .dgroup{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0;}
  .dgroup h2{margin:0;font-size:13px;}
  .dgroup .gnote{margin:2px 0 8px;font-size:11px;color:var(--muted);line-height:1.5;}
  .dgroup .domains{margin:0;gap:6px;}
  .dsub{display:block;font-size:10.5px;font-weight:400;opacity:.8;margin-top:1px;}
  .domains{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px;}
  .dchip{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:5px 12px;font-size:13px;font-weight:600;text-align:left;}
  .dchip.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .dchip.soon{color:var(--muted);font-weight:500;}
  .dchip small{font-size:10px;margin-left:5px;opacity:.7;}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;}
  .tab{border:0;background:none;padding:8px 14px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;}
  .tab.on{color:var(--accent);border-bottom-color:var(--accent);}
  .grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start;}
  @media (max-width:900px){.grid{grid-template-columns:1fr;}}
  .panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;}
  .panel h2{margin:0 0 8px;font-size:14px;}
  .hint{font-size:12px;color:var(--muted);}
  /* 年表 */
  .tl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--paper);}
  .tl-wrap svg{display:block;}
  .bar{cursor:pointer;}
  .bar rect{transition:opacity .12s;}
  .bar:hover rect.life,.bar:focus rect.life{opacity:.8;}
  .bar.sel rect.life{stroke:var(--ink);stroke-width:2;}
  .bar text{font-size:11.5px;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:3px;stroke-linejoin:round;pointer-events:none;}
  .bar:focus{outline:none;}
  .axis text{font-size:10px;fill:var(--muted);}
  .axis line{stroke:var(--line);}
  .band-t{font-size:11px;font-weight:700;}
  /* 時代別の一覧 */
  .seg2{display:inline-flex;border:1px solid var(--line);border-radius:100px;padding:2px;background:var(--paper);margin-bottom:12px;}
  .seg2 button{border:0;background:none;padding:5px 16px;font-size:13px;font-weight:600;border-radius:100px;color:var(--muted);}
  .seg2 button.on{background:var(--accent);color:#fff;}
  .fam-h{display:flex;align-items:baseline;gap:8px;margin:12px 0 6px;font-size:13px;font-weight:800;}
  .fam-h span{font-size:11px;font-weight:500;color:var(--muted);}
  .era-h{display:flex;align-items:baseline;gap:8px;margin:14px 0 6px;font-size:13px;font-weight:800;}
  .era-h i{display:inline-block;width:10px;height:10px;border-radius:3px;}
  .era-h span{font-size:11px;font-weight:500;color:var(--muted);}
  .plist{display:flex;flex-wrap:wrap;gap:6px;}
  .pbtn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:5px 10px;font-size:13px;display:inline-flex;gap:7px;align-items:baseline;}
  .pbtn b{font-size:11px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;}
  .pbtn:hover{border-color:var(--accent);}
  .pbtn.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .pbtn.on b{color:#fff;opacity:.85;}
  .pbtn.seen::after{content:"✓";font-size:11px;color:var(--k-term);margin-left:2px;}
  .pbtn.on.seen::after{color:#fff;}
  /* カード */
  @media (min-width:901px){ #card{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;} }
  .fig{margin:10px 0;}
  .figsvg{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;justify-content:center;}
  .figsvg svg{height:150px;width:auto;max-width:100%;display:block;}
  .staff .figsvg{padding:8px 10px;overflow-x:auto;justify-content:flex-start;}
  .staff .figsvg svg{height:96px;max-width:none;}
  .fig figcaption{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.6;}
  .portrait{display:inline-block;width:64px;height:76px;margin-right:12px;vertical-align:middle;}
  .portrait svg{width:100%;height:100%;display:block;}
  .avatar{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--ac,var(--accent));color:#fff;font-size:17px;font-weight:700;margin-right:10px;vertical-align:middle;font-family:inherit;}
  .card h3{margin:0;font-size:22px;font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;}
  .card .sub{font-size:12px;color:var(--muted);margin:2px 0 8px;}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 10px;border-radius:100px;color:#fff;margin-right:6px;}
  .tagline{font-size:14px;font-weight:700;margin:8px 0 10px;}
  .sec{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--accent);margin:14px 0 4px;}
  .works{list-style:none;margin:0;padding:0;display:grid;gap:4px;}
  .works li{font-size:13px;border-left:3px solid var(--line);padding:2px 0 2px 10px;}
  .works b{font-weight:700;}
  .works span{color:var(--muted);}
  .anec{margin:0;padding-left:18px;font-size:13px;}
  .anec li{margin:3px 0;}
  .rel{display:flex;flex-wrap:wrap;gap:6px;}
  .rchip{border:1px solid var(--line);background:var(--paper);border-radius:100px;padding:3px 11px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;}
  .rchip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--kc,var(--muted));}
  .rchip:hover,.rchip.on{border-color:var(--kc,var(--accent));background:var(--soft);}
  .legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--muted);margin:6px 0 0;}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;}
  .word{margin-top:10px;border:1px solid var(--line);border-left:4px solid var(--kc,var(--accent));border-radius:10px;padding:10px 12px;background:var(--soft);}
  .word h4{margin:0 0 2px;font-size:14px;}
  .word p{margin:3px 0;font-size:12.5px;}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
  .btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:7px 14px;font-size:13px;font-weight:600;}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;}
  .empty{color:var(--muted);font-size:13px;padding:30px 10px;text-align:center;}
  /* クイズ */
  .qbox{max-width:760px;}
  .qmeta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:8px;flex-wrap:wrap;gap:8px;}
  .qq{font-size:15px;font-weight:600;line-height:1.8;margin:6px 0 12px;}
  .opts{display:grid;gap:8px;}
  .opt{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 14px;font-size:14px;}
  .opt:hover:not(:disabled){border-color:var(--accent);}
  .opt.ok{border-color:#2F7D6D;background:rgba(47,125,109,.12);}
  .opt.ng{border-color:#C0392B;background:rgba(192,57,43,.1);}
  .opt:disabled{cursor:default;}
  .exp{margin-top:12px;padding:10px 14px;border-radius:10px;background:var(--soft);font-size:13px;}
  .src{font-size:11px;color:var(--muted);margin-top:18px;}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:100px;padding:2px;background:var(--paper);}
  .seg button{border:0;background:none;padding:3px 12px;font-size:12px;border-radius:100px;color:var(--muted);}
  .seg button.on{background:var(--accent);color:#fff;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>

。自らを二つの人格に分けて語った。","晩年は精神を病み、1854年にライン川に身を投げて救助され、療養所で1856年に没した。"],"related":["ロマン派","クララ・シューマン","新音楽時報","ダヴィッド同盟","子供の情景","ブラームス","ショパン","ライプツィヒ","リート"],"region":"海外"},{"id":"liszt","name":"リスト","full":"フランツ・リスト","en":"Franz Liszt","born":1811,"died":1886,"country":"ハンガリー（ヨーロッパ各地で活動）","era":"ロマン派","tagline":"ピアノの魔術師。超絶技巧と交響詩で時代を切り開いた。","works":[{"t":"超絶技巧練習曲","n":"ピアノの限界に挑む12曲の練習曲集。難曲の代名詞として知られる"},{"t":"ハンガリー狂詩曲","n":"ハンガリーの民俗的な旋律に基づくピアノ曲集。全19曲で、第2番が特に有名"},{"t":"ラ・カンパネラ","n":"「鐘」の意。パガニーニの主題による大練習曲の第3番として知られるピアノ曲"},{"t":"ピアノ・ソナタ ロ短調","n":"単一楽章の中に全体を凝縮した大作。主題を変形させながら展開する"},{"t":"交響詩「前奏曲」","n":"人生を死への前奏曲になぞらえた序文をもつ、リスト代表の交響詩"}],"anecdotes":["1832年にパリでパガニーニの演奏を聴いて衝撃を受け、ピアノでも同等の技巧を目指したとされる。のちに彼の主題を使った練習曲を書いた。","ピアノ独奏だけで聴かせる演奏会を各地で開き、これを「リサイタル」と呼んで広めたとされる。暗譜で弾く姿も当時は新しかった。","1850年、ワイマールの宮廷楽長として、亡命中のワーグナーの『ローエングリン』の初演を指揮した。のちに娘コジマがワーグナーの妻となった。"],"related":["ロマン派","交響詩","パガニーニ","ワーグナー","ショパン","リサイタル","ワイマール","コジマ・ワーグナー","ハンガリー狂詩曲"],"region":"海外"},{"id":"wagner","name":"ワーグナー","full":"リヒャルト・ワーグナー","en":"Richard Wagner","born":1813,"died":1883,"country":"ドイツ","era":"ロマン派","tagline":"楽劇を創り上げたドイツの作曲家。総合芸術を目指した。","works":[{"t":"ニーベルングの指環","n":"北欧・ゲルマン神話に基づく四部作の楽劇。全曲の上演に四夜かかる"},{"t":"トリスタンとイゾルデ","n":"解決を先延ばしにする和声で愛と死を描く楽劇。後の音楽に大きな影響を与えた"},{"t":"ニュルンベルクのマイスタージンガー","n":"歌の親方たちの競い合いを描く、ワーグナーには珍しい喜劇的な楽劇"},{"t":"ローエングリン","n":"白鳥の騎士の物語を描くロマン派オペラ。第3幕の婚礼の合唱が有名"},{"t":"さまよえるオランダ人","n":"呪われた幽霊船の船長を描く、初期の傑作オペラ"}],"anecdotes":["1876年、自作上演のための専用劇場としてバイロイト祝祭劇場を開いた。『ニーベルングの指環』の全曲がこの杮落としで初めて通して上演された。","バイエルン王ルートヴィヒ2世に招かれ、1864年から資金面の援助を受けた。借金に追われていたワーグナーにとって大きな転機になった。","1849年のドレスデン蜂起に加わって指名手配され、スイスへ逃れた。亡命生活のあいだに『指環』の台本と作曲を進めた。"],"related":["楽劇","ライトモティーフ","総合芸術","バイロイト祝祭劇場","ルートヴィヒ2世","ニーベルングの指環","リスト","ヴェルディ","ブラームス"],"region":"海外"},{"id":"verdi","name":"ヴェルディ","full":"ジュゼッペ・ヴェルディ","en":"Giuseppe Verdi","born":1813,"died":1901,"country":"イタリア","era":"ロマン派","tagline":"イタリア・オペラの巨匠。人間の情念を劇的に描いた。","works":[{"t":"リゴレット","n":"宮廷道化師とその娘の悲劇を描くオペラ。「女心の歌」が有名"},{"t":"椿姫","n":"高級娼婦ヴィオレッタの悲恋を描くオペラ。「乾杯の歌」で知られる"},{"t":"アイーダ","n":"古代エジプトを舞台にした大作オペラ。凱旋行進曲が有名"},{"t":"オテロ","n":"シェイクスピアに基づく晩年のオペラ。劇と音楽が切れ目なく進む"},{"t":"レクイエム","n":"死者のためのミサ曲。劇的な「怒りの日」で名高い"}],"anecdotes":["オペラ『ナブッコ』(1842)の合唱「行け、わが想いよ」は、当時オーストリアの支配下にあったイタリアの人々の心を捉え、独立運動の象徴になったと伝わる。","「ヴェルディ万歳」の掛け声は、のちの初代イタリア国王の名の頭文字を隠した政治的な合言葉でもあったとされる。","若くして最初の妻と二人の子を亡くし、悲嘆のなかで書いた喜劇も失敗した。作曲をやめかけたが、『ナブッコ』で立ち直ったと伝わる。"],"related":["オペラ","リソルジメント","ミラノ・スカラ座","ナブッコ","椿姫","アイーダ","シェイクスピア","ワーグナー"],"region":"海外"},{"id":"brahms","name":"ブラームス","full":"ヨハネス・ブラームス","en":"Johannes Brahms","born":1833,"died":1897,"country":"ドイツ（ハンブルク生まれ、ウィーンで活動）","era":"ロマン派","tagline":"バッハ、ベートーヴェンと並ぶ「3大B」の一人。","works":[{"t":"交響曲第1番","n":"20年ほどをかけて完成させた重厚な交響曲。終楽章の主題が有名"},{"t":"ドイツ・レクイエム","n":"ラテン語ではなくドイツ語の聖書の言葉で書いた、死者を悼む合唱曲"},{"t":"ハンガリー舞曲集","n":"ハンガリー風の旋律による連弾曲集。第5番が特に有名"},{"t":"ヴァイオリン協奏曲 ニ長調","n":"友人ヨアヒムの助言を受けて書いた、独奏と管弦楽が対等に渡り合う大作"},{"t":"交響曲第4番","n":"渋い味わいの最後の交響曲。終楽章はバッハ風のパッサカリア形式"}],"anecdotes":["交響曲第1番の完成までに20年ほどかかった。ベートーヴェンの偉大な影を意識したためとされ、初演後にはベートーヴェンの第10番になぞらえる評が出た。","20歳の1853年にシューマンを訪ね、才能を絶賛された。シューマンは雑誌で若いブラームスを「新しい道」を示す者として世に紹介した。","シューマンの死後も、その妻クララ・シューマンと生涯にわたり親交を結んだ。ブラームス自身は生涯独身だった。"],"related":["シューマン","クララ・シューマン","ベートーヴェン","バッハ","絶対音楽","ハンブルク","ウィーン","ドイツ・レクイエム","ハンガリー舞曲集"],"region":"海外"},{"id":"tchaikovsky","name":"チャイコフスキー","full":"ピョートル・イリイチ・チャイコフスキー","en":"Pyotr Ilyich Tchaikovsky","born":1840,"died":1893,"country":"ロシア","era":"ロマン派","tagline":"ロシアが生んだ旋律の名手。バレエ音楽でも名高い。","works":[{"t":"白鳥の湖 (op.20)","n":"王子と白鳥に変えられた王女の物語を描く、チャイコフスキー初のバレエ音楽"},{"t":"眠れる森の美女 (op.66)","n":"ペローの童話に基づくバレエ。「三大バレエ」の一つに数えられる"},{"t":"くるみ割り人形 (op.71)","n":"クリスマスの夜の夢を描くバレエ。「花のワルツ」などの組曲が有名"},{"t":"ピアノ協奏曲第1番 (op.23)","n":"冒頭の力強い和音と大きな旋律で知られる、ピアノ協奏曲の代表作"},{"t":"交響曲第6番「悲愴」 (op.74)","n":"最晩年の作。静かに消え入るように終わる終楽章が異例とされる"}],"anecdotes":["法律学校を卒業して法務省に勤めたのち、1862年に音楽院に入り音楽家へ転じた。専門の音楽教育を受け始めたのは、決して早い年齢ではなかった。","富裕な未亡人メック夫人から長年にわたり年金の援助を受けた。二人は手紙で深く交流し、直接会うことは避けたと伝わる。","交響曲第6番「悲愴」を自ら指揮して初演した9日後に亡くなった。死因はコレラとされるが、異説もある。"],"related":["バレエ音楽","白鳥の湖","交響曲第6番「悲愴」","メック夫人","モスクワ音楽院","サンクト めて良いことで知られる。"},{"t":"デュポール（1711年製）","n":"チェロの名器。奏者デュポールの名で呼ばれ、のちにロストロポーヴィチが愛用した。"},{"t":"二人の息子","n":"フランチェスコとオモボノが父の工房で働き、その仕事を継いだ。"},{"t":"グァルネリ・デル・ジェズ","n":"同じクレモナの名器。華やかなストラディヴァリウスに対し、力強い音とされる。"}],"anecdotes":["製作ラベルにラテン語で『アントニウス・ストラディヴァリウス・クレモネンシス』と記したことが、通称の由来になった。","その音の秘密は長く研究され、小氷期に育った密な木材やニスが理由だといわれる。新作と聞き分けにくいという実験もあり、論争が続く。","『メシア』の名は、噂に聞くばかりで誰も実物を見たことがない名器、という含みで付けられたと伝わる。"],"composers":[],"related":["クレモナ","アントニオ・ストラディヴァリ","ヴァイオリン","グァルネリ・デル・ジェズ","アマティ家","イル・カノーネ","バロック","チェロ"],"region":"海外"},{"id":"guarneri","name":"グァルネリ・デル・ジェズ","full":"グァルネリ・デル・ジェズ（バルトロメオ・ジュゼッペ・グァルネリ製作のヴァイオリン）","en":"Guarneri del Gesu","family":"弦楽器","when":"1720年代〜1744年","where":"イタリア（クレモナ）","era":"バロック","tagline":"ストラディヴァリウスと並び称される、力強い音の名器","facts":[{"t":"製作者","n":"バルトロメオ・ジュゼッペ・グァルネリ（1698〜1744）。クレモナのグァルネリ家に生まれた。"},{"t":"通称","n":"ラベルに十字とIHSの文字を入れたことから『デル・ジェズ（イエスの）』と呼ばれる。"},{"t":"作風","n":"現存は少なく、力強く暗い音色が特色とされる。ストラディヴァリウスは華やかと評される。"}],"famous":[{"t":"イル・カノーネ（1743年製）","n":"パガニーニの愛器で、遺言によりジェノヴァ市に遺贈された。"},{"t":"ダヴィッド（1742年製）","n":"ハイフェッツが演奏会で愛用したことで知られる名器。"},{"t":"評価の高まり","n":"19世紀にパガニーニらの使用で評価が上がり、名器の地位を確立したといわれる。"}],"anecdotes":["リヴォルノの演奏会で借りた楽器の音に感嘆したパガニーニに、持ち主は返却を求めなかったと伝わる。","『イル・カノーネ』は大砲のような音量にちなむ呼び名とされる。ジェノヴァ市が保管し、特別な機会に限って演奏される。","デル・ジェズは晩年に困窮し、投獄されたという話も伝わるが、生涯には不明な点が多い。"],"composers":["パガニーニ"],"related":["クレモナ","ジェノヴァ","イル・カノーネ","パガニーニ","ストラディヴァリウス","ヴァイオリン","ヴィルトゥオーゾ","ヤッシャ・ハイフェッツ"],"region":"海外"},{"id":"cello","name":"チェロ","full":"チェロ（ヴィオロンチェロ、低音の弓奏弦楽器）","en":"Cello","family":"弦楽器","when":"16世紀〜","where":"イタリア","era":"バロック","tagline":"人の声に近いといわれる、ヴァイオリン族の低音楽器","facts":[{"t":"成立","n":"16世紀のイタリアで、ヴァイオリンと同じ時期にその低音楽器として成立した。"},{"t":"名称","n":"正式名ヴィオロンチェロは『小さなヴィオローネ』の意で、略してチェロと呼ぶ。"},{"t":"構造","n":"4本の弦をヴィオラの1オクターヴ下に調弦し、膝の間に構えて弾く。"},{"t":"エンドピン","n":"床に支える脚は19世紀に広まった。それ以前はふくらはぎで挟んで支えた。"}],"famous":[{"t":"無伴奏チェロ組曲","n":"バッハの全6曲の独奏組曲。カザルスが演奏会で取り上げて評価を高めた。"},{"t":"パブロ・カザルス","n":"20世紀を代表する奏者で、この組曲を再発見したと伝わる。"},{"t":"ドヴォルザークの協奏曲","n":"ロ短調（1895年）。ロマン派を代表するチェロ協奏曲として知られる。"},{"t":"デュポール","n":"ストラディヴァリのチェロ（1711年製）。ロストロポーヴィチが愛用した。"}],"anecdotes":["カザルスは13歳のころバルセロナの楽譜店でバッハの組曲の楽譜を見つけ、長い年月をかけて演奏会にかけるまで練習を重ねたと伝わる。","『デュポール』の名で呼ばれるストラディヴァリのチェロには、ナポレオンが試奏して拍車で傷をつけたという話が伝わる。","ドヴォルザークの協奏曲の楽譜を読んだブラームスは、これほどの曲が書けるのかと感嘆したと伝わる。"],"composers":["バッハ","ベートーヴェン","シューマン","ドヴォルザーク"],"related":["ヴァイオリン","ストラディヴァリウス","パブロ・カザルス","無伴奏チェロ組曲","ナポレオン","ムスティスラフ・ロストロポーヴィチ","ドヴォルザーク","バッハ"],"region":"海外"},{"id":"piano","name":"ピアノ","full":"ピアノ（ハンマーで弦を打つ鍵盤楽器、ピアノフォルテ）","en":"Piano","family":"鍵盤楽器","when":"1700年ごろ〜","where":"イタリア（フィレンツェ）で発明","era":"ロマン派","tagline":"指の強弱で音の大小を出せる鍵盤楽器。フィレンツェで生まれた","facts":[{"t":"発明","n":"1700年ごろ、フィレンツェのメディチ家に仕えたクリストフォリが考案した。"},{"t":"原名","n":"当初の名は『強弱のつくチェンバロ』を意味し、のちにピアノフォルテ、ピアノと略された。"},{"t":"機構","n":"鍵を押すとハンマーが弦を打つ。タッチの強さで音量が変わる点がチェンバロと異なる。"},{"t":"発展","n":"19世紀に鉄のフレームが導入され、音量と音域が拡大した。現代の標準は88鍵。"}],"famous":[{"t":"現存する最古級の楽器","n":"クリストフォリの1720年製がニューヨークのメトロポリタン美術館に現存する。"},{"t":"ブロードウッド社","n":"ロンドンの製造者。力強い響きのイギリス式ピアノで知られる。"},{"t":"エラール社","n":"パリの製造者。連打性を高めた機構を開発し、リストらが愛用した。"},{"t":"プレイエル社","n":"パリの製造者。繊細な音色でショパンに愛された。"}],"anecdotes":["ベートーヴェンは1818年、ブロードウッド社から贈られたピアノを受け取った。聴力を失う中で愛用し、のちにリストの手に渡ったと伝わる。","ショパンはマヨルカ島の滞在中、プレイエル社のピアノが届くのを待ちわび、届くと作曲に励んだと伝わる。","リストは1840年ごろロンドンで、独りで演奏する会を『リサイタル』と呼んだとされる。"],"composers":["モーツァルト","ベートーヴェン","ショパン","リスト"],"related":["チェンバロ","バルトロメオ・クリストフォリ","フィレンツェ","ブロードウッド社","プレイエル社","エラール社","マヨルカ島","リサイタル"],"region":"海外"},{"id":"harpsichord","name":"チェンバロ","full":"チェンバロ（爪で弦をはじく鍵盤楽器、ハープシコード）","en":"Harpsichord","family":"鍵盤楽器","when":"15世紀ごろ〜（最盛期は17〜18世紀）","where":"ヨーロッパ（イタリア、フランドル、フランスなど）","era":"バロック","tagline":"弦を爪ではじく響きが、バロック音楽を彩った鍵盤楽器","facts":[{"t":"発音","n":"鍵を押すと、ジャックに付いた爪が弦をはじいて音が出る。"},{"t":"強弱","n":"タッチの強さで音量が変わらないため、2段鍵盤や音色の切り替えで変化をつける。"},{"t":"名称","n":"チェンバロはドイツ語系の呼び名。英語ではハープシコード、フランス語ではクラヴサンという。"},{"t":"衰退と復興","n":"18世紀後半にピアノに押されて衰え、20世紀に古楽の復興とともによみがえった。"}],"famous":[{"t":"ルッカース家","n":"アントウェルペンで活躍した製作者の一族。楽器は後世の模範とされた。"},{"t":"ワンダ・ランドフスカ","n":"20世紀初頭にチェンバロを演奏会に復活させた奏者。"},{"t":"ゴルトベルク変奏曲","n":"バッハの大作。2段鍵盤のチェンバロのために書かれた。"}],"anecdotes":["ゴルトベルク変奏曲は、不眠に悩む伯爵のために書かれたと伝わる。この逸話の真偽は定かでない。","ヘンデルとドメニコ・スカルラッティがローマで腕を競い、チェンバロはスカルラッティが、オルガンはヘンデルが優ったと伝わる。","プレイエル社が1910年代にランドフスカのために大型の楽器を製作し、この楽器の復興を後押しした。"],"composers":["バッハ","ヘンデル"],"related":["ピアノ","バロック","通奏低音","ゴルトベルク変奏曲","ワンダ・ランドフスカ","ルッカース家","ドメニコ・スカルラッティ","パイプオルガン"],"region":"海外"},{"id":"organ","name":"パイプオルガン","full":"パイプオルガン（風でパイプを鳴らす大型の鍵盤楽器）","en":"Pipe organ","family":"鍵盤楽器","when":"古代〜（教会のオルガンは中世以降）","where":"ヨーロッパ（教会が中心）","era":"バロック","tagline":"『楽器の王』と呼ばれる、教会の大型鍵盤楽器","facts":[{"t":"仕組み","n":"送風機が送る風を、鍵盤で選んだパイプに通して鳴らす。大型のものは数千本のパイプをもつ。"},{"t":"構成","n":"手で弾く複数の鍵盤と、足で弾くペダル鍵盤をもち、ストップで音色を選ぶ。"},{"t":"起源","n":"起源は古代の水オルガン（ヒュドラウリス）とされ、中世以降は教会で発展した。"}],"famous":[{"t":"バッハ","n":"各地でオルガニストを務め、楽器の鑑定人としても重んじられた。"},{"t":"ブクステフーデ","n":"リューベックの名オルガニスト。北ドイツの楽派の中心で、バッハが敬った。"},{"t":"ジルバーマン","n":"ザクセンのオルガン製作者。バッハがその楽器を試奏した話が伝わる。"},{"t":"トッカータとフーガ ニ短調","n":"バッハ作と伝わる名曲。広く知られるが、作者や成立には議論がある。"}],"anecdotes":["若いバッハはブクステフーデの演奏を聴くため、アルンシュタットからリューベックまで徒歩で向かったと伝わる。","モーツァルトはオルガンを楽器の王にたとえたと伝わる。音量、音域、音色の幅で他の楽器を圧する存在だからである。","バッハはオルガンの鑑定でも名高く、新設された楽器の検査や試奏に各地から招かれたといわれる。"],"composers":["バッハ","ヘンデル","メンデルスゾーン"],"related":["バッハ","ブクステフーデ","リューベック","聖トーマス教会","ジルバーマン","トッカータとフーガ ニ短調","フーガ","チェンバロ"],"region":"海外"},{"id":"flute","name":"フルート","full":"フルート（息を吹き込んで鳴らす横笛、現代は金属製）","en":"Flute","family":"木管楽器","when":"古代〜（現代の形は1847年ごろ）","where":"ヨーロッパ（ドイツで現代式が成立）","era":"ロマン派","tagline":"最古級の楽器の一つ。現代の形は19世紀のドイツで整った","facts":[{"t":"起源","n":"骨や木で作った笛は数万年前から知られ、人類最古級の楽器の一つとされる。"},{"t":"発音","n":"リードを使わず、歌口の縁に息を当てて音を出す。金属製でも木管楽器に分類される。"},{"t":"バロックの笛","n":"バロック期の横笛は木製で、円錐形の管に少数のキーをもっていた。"},{"t":"ベーム式","n":"1847年ごろ、ベームが金属製の円筒管と新しい指孔・キー配置の現代式を完成した。"}],"famous":[{"t":"クヴァンツ","n":"フリードリヒ大王に仕えたフルート奏者・作曲家で、大王の師。"},{"t":"フリードリヒ大王","n":"自らフルートを吹き、ポツダムの宮廷で演奏会を催した王。"},{"t":"牧神の午後への前奏曲","n":"ドビュッシーの管弦楽曲。冒頭の無伴奏フルートの旋律で知られる。"}],"anecdotes":["フリードリヒ大王は自らフルートを吹き、ポツダムを訪れたバッハに主題を与えた。これが『音楽の捧げもの』の源になった。","モーツァルトは注文のフルート作品を書いたが、この楽器を好まなかったことが手紙から伝わる。","『牧神の午後への前奏曲』の冒頭は、低音域の柔らかい音で始まり、この楽器の魅力を示す場面として知られる。"],"composers":["バッハ","モーツァルト","ドビュッシー"],"related":["テオバルト・ベーム","クヴァンツ","フリードリヒ大王","魔笛","牧神の午後への前奏曲","音楽の捧げもの","バッハ","ドビュッシー"],"region":"海外"},{"id":"clarinet","name":"クラリネット","full":"クラリネット（単一のリードで鳴らす木管楽器）","en":"Clarinet","family":"木管楽器","when":"1700年ごろ〜","where":"ドイツ（ニュルンベルク）","era":"古典派","tagline":"1700年ごろニュルンベルクで生まれ、モーツァルトが愛した木管","facts":[{"t":"発明","n":"1700年ごろ、ニュルンベルクのデンナーが古い笛シャリュモーを改良して生んだとされる。"},{"t":"仕組み","n":"1枚のリードをマウスピースに付けて吹く。管はほぼ円筒形で、息を強めると12度上の音が出る。"},{"t":"普及","n":"古典派の時代に管弦楽の常任となり、B♭管とA管を持ち替えるのが通例になった。"}],"famous":[{"t":"アントン・シュタードラー","n":"ウィーンの名手。モーツァルトの五重奏曲と協奏曲は彼のために書かれた。"},{"t":"リヒャルト・ミュールフェルト","n":"マイニンゲン宮廷楽団の名手。ブラームス晩年のクラリネット作品の契機となった。"},{"t":"ベニー・グッドマン","n":"スウィング時代を代表する奏者。ジャズとクラシックの双方で活躍した。"}],"anecdotes":["モーツァルトのクラリネット協奏曲は1791年の秋、死の約2か月前に完成したとされる。友人シュタードラーのために書かれた。","ブラームスは作曲をやめる考えだったが、ミュールフェルトの演奏に触発され、クラリネット作品を書き継いだと伝わる。","グッドマンは1938年にニューヨークのカーネギー・ホールで演奏会を開き、ジャズを大きな舞台へ押し上げたとされる。"],"composers":["モーツァルト","ブラームス"],"related":["ヨハン・クリストフ・デンナー","ニュルンベルク","アントン・シュタードラー","リヒャルト・ミュールフェルト","ベニー・グッドマン","モーツァルト","ブラームス","ジャズ"],"region":"海外"},{"id":"saxophone","name":"サクソフォン","full":"サクソフォン（アドルフ・サックスが発明した金属製の木管楽器）","en":"Saxophone","family":"木管楽器","when":"1840年代（1846年に特許）","where":"フランス（ベルギー出身の発明者がパリで開発）","era":"近現代","tagline":"金属の管にリードを付けた、1840年代生まれの新しい木管","facts":[{"t":"発明","n":"ベルギー出身のアドルフ・サックスが1840年代にパリで開発し、1846年に特許を得た。"},{"t":"仕組み","n":"金属製の円錐形の管に、クラリネット型の単一リードのマウスピースを付けて吹く。"},{"t":"種類","n":"ソプラノからバスまで、大きさの異なる多くの種類がある。アルトとテナーがよく使われる。"},{"t":"用途","n":"軍楽隊で採用が進み、のちにジャズの主役の楽器となった。"}],"famous":[{"t":"アドルフ・サックス","n":"発明者（1814〜1894）。パリで楽器製作者として活動した。"},{"t":"チャーリー・パーカー","n":"アルト奏者。ビバップを確立した中心人物で、ジャズに大きな影響を与えた。"},{"t":"ボレロ","n":"ラヴェルの管弦楽曲。サクソフォンが旋律を受け持つ場面がある。"},{"t":"展覧会の絵","n":"ラヴェルの編曲で、アルト・サクソフォンが『古城』の旋律を歌う。"}],"anecdotes":["サックスは、オフィクレイドにクラリネット型のマウスピースを付ける実験から着想したとされる。","ベルリオーズは早くからサックスの楽器を高く評価し、新聞に称賛の記事を寄せたといわれる。","サックスは特許や商売をめぐる争いに悩まされ、破産も経験したと伝わる。発明の成功と経営の苦境が同居した生涯だった。"],"composers":["ベルリオーズ","ドビュッシー","ラヴェル"],"related":["アドルフ・サックス","パリ","ジャズ","チャーリー・パーカー","ボレロ","展覧会の絵","ベルリオーズ","ラヴェル"],"region":"海外"},{"id":"harp","name":"ハープ","full":"ハープ（弦をはじいて鳴らす大型の撥弦楽器）","en":"Harp","family":"弦楽器","when":"古代〜（現代のペダルハープは1810年）","where":"古代オリエント〜ヨーロッパ（現代式はパリ）","era":"ロマン派","tagline":"古代から続く弦楽器。全調を弾ける現代式は19世紀に誕生","facts":[{"t":"起源","n":"弦を張った楽器は古代オリエントやエジプトにさかのぼり、最古級の弦楽器の一つとされる。"},{"t":"構造","n":"コンサート用は47弦・7本のペダルをもち、ペダルの操作で各音を半音ずつ上下できる。"},{"t":"発明","n":"1810年、パリのセバスチャン・エラールがダブルアクション式を特許とし、現代式の基礎となった。"}],"famous":[{"t":"エラール社","n":"ダブルアクション式ペダルハープを開発。ピアノ製造でも知られた。"},{"t":"プレイエル社","n":"弦を交差させたクロマティック・ハープを製作し、エラール社と競った。"},{"t":"序奏とアレグロ","n":"ラヴェル作。ハープ、フルート、クラリネットと弦楽四重奏のための作品。"},{"t":"白鳥の湖","n":"チャイコフスキーのバレエ音楽。第2幕の導入にハープの独奏がある。"}],"anecdotes":["ウルの王墓で見つかった紀元前2500年ごろの竪琴は、最古級の弦楽器の遺物として知られる。","プレイエル社が委嘱したドビュッシーの曲と、エラール社が委嘱したラヴェルの曲は、両社の競い合いから生まれたといわれる。","ハープはアイルランドの国章に用いられ、硬貨にも図柄が刻まれるなど、同国の象徴として広く親しまれている。"],"composers":["ヘンデル","ドビュッシー","ラヴェル","チャイコフスキー"],"related":["エラール社","プレイエル社","序奏とアレグロ","白鳥の湖","ドビュッシー","ラヴェル","チャイコフスキー","ヘンデル"],"region":"海外"},{"id":"timpani","name":"ティンパニ","full":"ティンパニ（音の高さを変えられる大型の太鼓）","en":"Timpani","family":"打楽器","when":"中世〜（ペダル式は19世紀）","where":"ヨーロッパ（中東から伝来）","era":"古典派","tagline":"管弦楽で音程を奏でる太鼓。ベートーヴェンが活躍の場を広げた","facts":[{"t":"構造","n":"銅などの半球形の釜に皮（現在は合成素材も）を張り、張力で音の高さを変える。"},{"t":"由来","n":"中東の太鼓が十字軍の時代にヨーロッパへ伝わったとされ、宮廷ではトランペットと組んだ。"},{"t":"調律","n":"バロックから古典派では主音と属音の2個が基本。ペダルで音高を変える方式は19世紀に広まった。"}],"famous":[{"t":"交響曲第103番「太鼓連打」","n":"ハイドン作。冒頭のティンパニの連打が通称の由来。"},{"t":"ヴァイオリン協奏曲","n":"ベートーヴェン作。冒頭にティンパニの打音が置かれている。"},{"t":"交響曲第9番「合唱付き」","n":"ベートーヴェン作。スケルツォ楽章でティンパニを旋律的に扱った。"}],"anecdotes":["ハイドンの交響曲第103番は、冒頭のティンパニのトレモロにちなみ『太鼓連打』と呼ばれる。","ベートーヴェンはヴァイオリン協奏曲の冒頭にティンパニの打音を置いた。当時としては独創的な始まりである。","ベルリオーズは『幻想交響曲』の第3楽章の終わりに、遠雷を表すため4人のティンパニ奏者を求めた。"],"composers":["ハイドン","ベートーヴェン","ベルリオーズ"],"related":["ハイドン","ベートーヴェン","ベルリオーズ","幻想交響曲","交響曲第9番「合唱付き」","交響曲第103番「太鼓連打」","管弦楽法","交響曲"],"region":"海外"},{"id":"koto","name":"箏","full":"箏（こと）","en":"Koto","region":"日本","family":"弦楽器","when":"奈良時代に伝来、江戸時代に発展","where":"日本（中国から伝来）","era":"近世邦楽","tagline":"十三本の弦を柱で調律する、日本を代表する弦楽器","facts":[{"t":"しくみ","n":"長さ約180cmの桐の胴に十三本の弦を張り、柱（じ）の位置で音高を決める"},{"t":"奏法","n":"右手の親指・人差し指・中指に爪をはめて弾き、左手で弦を押して音を変える"},{"t":"流派","n":"江戸時代に生田流と山田流が成立し、爪の形や構え方が異なる"}],"famous":[{"t":"六段の調べ","n":"八橋検校の作と伝わる、箏の代表的な独奏曲"},{"t":"春の海","n":"宮城道雄が作曲した、箏と尺八による正月の定番曲"},{"t":"宮城道雄","n":"十七絃を考案し、洋楽との融合を進めた近代の名手"}],"anecdotes":["箏は奈良時代に雅楽の楽器として中国から伝わった。江戸時代に八橋検校らが箏曲を広げたとされる。","箏は柱を立てて音を決める楽器で、柱を立てない七弦の「琴（きん）」とは別の楽器である。","宮城道雄の「春の海」は正月の定番曲として流され、箏の音色を日本の正月と結びつけた。"],"composers":["八橋検校","宮城道雄"],"related":["箏曲","八橋検校","宮城道雄","生田流","山田流","十七絃","六段の調べ","雅楽"]},{"id":"shamisen","name":"三味線","full":"三味線（しゃみせん）","en":"Shamisen","region":"日本","family":"弦楽器","when":"16世紀に伝来、江戸時代に普及","where":"日本（琉球の三線から発展）","era":"近世邦楽","tagline":"三本の弦を撥で弾く、歌舞伎や民謡を支えた楽器","facts":[{"t":"しくみ","n":"胴に皮を張り、棹に三本の弦を張る。撥で弦と皮を打つように弾く"},{"t":"種類","n":"棹の太さで細棹・中棹・太棹に分かれ、長唄や義太夫などで使い分ける"},{"t":"さわり","n":"一の糸が棹に軽く触れて鳴る独特の響きを「さわり」といい、音色の特徴となる"}],"famous":[{"t":"長唄","n":"歌舞伎の舞踊や伴奏として発展した三味線音楽"},{"t":"津軽三味線","n":"太棹を打楽的に弾く奏法。高橋竹山らが名手として知られる"},{"t":"義太夫節","n":"人形浄瑠璃を支える、太棹の三味線による語り物"}],"anecdotes":["三味線は琉球の三線が16世紀に堺へ伝わり、琵琶法師らの手で改良され、広まったとされる。","三味線の胴にはかつて猫や犬の皮が使われた。近年は合成皮革も用いられ、素材の幅が広がっている。","津軽三味線は、旅をして門付けをした芸人たちの間で、激しい奏法へ発達したとされる。"],"composers":[],"related":["長唄","義太夫節","津軽三味線","三線","歌舞伎","浄瑠璃","琵琶"]},{"id":"shakuhachi","name":"尺八","full":"尺八（しゃくはち）","en":"Shakuhachi","region":"日本","family":"木管楽器","when":"奈良時代に伝来、江戸時代に虚無僧が普及","where":"日本（中国から伝来）","era":"近世邦楽","tagline":"竹一本から作る縦笛。虚無僧の法器から独奏楽器へ","facts":[{"t":"しくみ","n":"竹の根に近い部分で作る縦笛。表に四つ、裏に一つの指孔を持つ"},{"t":"名の由来","n":"標準の管の長さが一尺八寸（約54.5cm）であることが名の由来とされる"},{"t":"音の特徴","n":"息の角度や首の振りで音色や音高を変え、息の雑音も表現に生かす"}],"famous":[{"t":"鶴の巣籠","n":"尺八の古典本曲として知られる代表曲のひとつ"},{"t":"中尾都山","n":"1896年に都山流を創流し、尺八の普及に努めた奏者"},{"t":"横山勝也","n":"「ノヴェンバー・ステップス」の初演で尺八を吹いた奏者"}],"anecdotes":["江戸時代の普化宗では、虚無僧が深編笠をかぶり、尺八を吹きながら諸国を歩いたとされる。","普化宗は明治4年（1871年）に廃止され、その後、尺八は一般の楽器として広まった。","古代の尺八は奈良時代に雅楽の楽器として伝わり、その実物が正倉院に現在も残っている。"],"composers":["宮城道雄","武満徹"],"related":["虚無僧","普化宗","都山流","琴古流","本曲","春の海","ノヴェンバー・ステップス","箏"]},{"id":"biwa","name":"琵琶","full":"琵琶（びわ）","en":"Biwa","region":"日本","family":"弦楽器","when":"奈良時代に伝来、中世に平家琵琶が発展","where":"日本（中国から伝来）","era":"近世邦楽","tagline":"洋梨を縦に割ったような胴を持つ、語りと弾き語りの楽器","facts":[{"t":"種類","n":"雅楽の楽琵琶、平家物語を語る平家琵琶、薩摩琵琶、筑前琵琶などがある"},{"t":"奏法","n":"大きな撥で弦をはじき、弦と胴を打つ奏法も表現に使う"},{"t":"弦","n":"薩摩琵琶は四弦、筑前琵琶は五弦が一般的で、柱（フレット）を持つ"}],"famous":[{"t":"平家物語","n":"琵琶法師が平曲として語り、語り物の中心になった"},{"t":"鶴田錦史","n":"琵琶奏者。「ノヴェンバー・ステップス」の初演で琵琶を弾いた"},{"t":"薩摩琵琶","n":"薩摩の武士の間で伝わった琵琶楽。戦国期に始まると伝わる"}],"anecdotes":["琵琶法師は盲目の語り手として各地を回り、琵琶を弾きながら『平家物語』を語って広めたとされる。","小泉八雲の『怪談』に収められた「耳なし芳一」は、平家を語る盲目の琵琶法師の怪談である。","武満徹は琵琶と尺八を西洋の管弦楽と向き合わせ、「ノヴェンバー・ステップス」を作曲した。"],"composers":["武満徹"],"related":["平家物語","平曲","琵琶法師","薩摩琵琶","耳なし芳一","ノヴェンバー・ステップス","鶴田錦史","雅楽"]},{"id":"sho","name":"笙","full":"笙（しょう）","en":"Sho","region":"日本","family":"木管楽器","when":"奈良時代に雅楽とともに伝来","where":"日本（中国から伝来）","era":"","tagline":"雅楽の和音をつくる、十七本の竹管の吹奏楽器","facts":[{"t":"しくみ","n":"十七本の竹管を円形に立て、そのうち十五本に金属製のリード（簧）が付く"},{"t":"奏法","n":"息を吸っても吐いても音が出るため、音を途切れさせずに和音を奏でられる"},{"t":"合竹","n":"複数の音を同時に鳴らす和音の奏法を合竹（あいたけ）という"}],"famous":[{"t":"越天楽","n":"雅楽の代表的な曲。管絃で演奏され、笙は和音で支える"},{"t":"セレモニアル","n":"武満徹が笙と管弦楽のために書き、1992年に初演された曲"},{"t":"宮田まゆみ","n":"笙の現代曲の演奏で知られ、国際的に活動する奏者"}],"anecdotes":["笙の形は、鳳凰が翼を休めて立つ姿に例えられ、そのため「鳳笙」とも呼ばれると伝わる。","演奏の前に火であぶって管を温め、息の湿気による音の乱れを防ぐ。水分で簧が鳴りにくくなるためである。","笙の構造が、西洋のアコーディオンやハーモニカなど自由リード楽器の発達に影響したと言われる。"],"composers":["武満徹"],"related":["雅楽","合竹","越天楽","管絃","セレモニアル","宮田まゆみ","武満徹"]},{"id":"wadaiko","name":"和太鼓","full":"和太鼓（わだいこ）","en":"Wadaiko","region":"日本","family":"打楽器","when":"古代から使われ、昭和に組太鼓が発展","where":"日本","era":"昭和の創造","tagline":"祭礼から舞台芸能へ。日本各地に広がる打楽器の総称","facts":[{"t":"しくみ","n":"木をくり抜いた胴などに皮を張り、桴（ばち）で打つ。大きさや形は多様"},{"t":"種類","n":"長胴太鼓、締太鼓、大太鼓などがあり、祭り・歌舞伎・能・雅楽で使い分ける"},{"t":"用途","n":"神事や祭礼、芸能の拍子、戦場の合図などに用いられてきた"}],"famous":[{"t":"鼓童","n":"1981年に新潟県の佐渡島で結成された太鼓芸能集団"},{"t":"林英哲","n":"ソロ奏者として和太鼓を独奏楽器に育てた奏者"},{"t":"小口大八","n":"複数の太鼓を組み合わせる組太鼓を始めたとされる奏者"}],"anecdotes":["太鼓の音は神を招き、邪気を払うとされ、各地の神事や祭礼で長く打たれてきた。その伝統が今日の和太鼓につながる。","戦国時代、陣太鼓は軍の進退や攻撃開始の合図に使われ、兵を動かす役割を担ったと伝わる。","能の囃子は笛と小鼓、大鼓で構成され、曲によっては太鼓が加わる。囃子の太鼓は舞台の拍子を引き締める。"],"composers":[],"related":["鼓童","林英哲","小口大八","組太鼓","能","雅楽","歌舞伎"]}],"glossary":[{"t":"バロック","kind":"term","d":"17世紀初めから18世紀半ばの時代・様式。通奏低音と華麗な装飾が特徴で、ヴィヴァルディ、バッハ、ヘンデルが代表。","en":"Baroque"},{"t":"古典派","kind":"term","d":"18世紀後半から19世紀初めの時代・様式。均整の取れた形式を重んじ、交響曲やソナタが完成した。ハイドン、モーツァルトが中心。","en":"Classical period"},{"t":"ロマン派","kind":"term","d":"19世紀の時代・様式。感情や個性の表現、文学や自然との結びつきを重んじた。ここで扱う作曲家の多くがこの時代に活動した。","en":"Romanticism"},{"t":"協奏曲","kind":"term","d":"独奏楽器と管弦楽が掛け合う楽曲。ヴィヴァルディは急・緩・急の三楽章形式の定着に大きく寄与した。","en":"Concerto"},{"t":"リトルネロ形式","kind":"term","d":"全員の演奏が独奏部分を挟んで繰り返される楽章の構成。ヴィヴァルディの協奏曲の急速楽章で典型的に使われた。","en":"Ritornello form"},{"t":"標題音楽","kind":"term","d":"物語・情景・詩など音楽以外の内容を題や解説で示した器楽曲。ヴィヴァルディの『四季』やベルリオーズの『幻想交響曲』が例。","en":"Program music"},{"t":"フーガ","kind":"term","d":"一つの主題が複数の声部に次々と模倣されて進む楽曲形式。バッハが頂点を築いた。","en":"Fugue"},{"t":"対位法","kind":"term","d":"独立した複数の旋律を同時に重ね合わせる作曲技法。フーガはその代表で、バッハの音楽の根幹をなす。","en":"Counterpoint"},{"t":"オラトリオ","kind":"term","d":"聖書などの物語を独唱・合唱・管弦楽で上演する大規模声楽曲。舞台装置は使わない。ヘンデルがロンドンで多数を作曲した。","en":"Oratorio"},{"t":"交響曲","kind":"term","d":"管弦楽のための多楽章の大規模な楽曲。ハイドンが形式を整えて「交響曲の父」と呼ばれ、モーツァルト、ベートーヴェンが発展させた。","en":"Symphony"},{"t":"弦楽四重奏曲","kind":"term","d":"二つのヴァイオリン、ヴィオラ、チェロの4人で奏する室内楽。ハイドンが古典派の形式を確立したとされる。","en":"String quartet"},{"t":"ソナタ形式","kind":"term","d":"提示部・展開部・再現部からなる楽章の構成法。古典派で確立し、ベートーヴェンが劇的に発展させた。","en":"Sonata form"},{"t":"ケッヘル番号","kind":"term","d":"モーツァルトの全作品を整理した目録の番号（K.）。19世紀にルートヴィヒ・フォン・ケッヘルが編んだ。","en":"Köchel catalogue number"},{"t":"リート","kind":"term","d":"ドイツ語の芸術歌曲。詩の世界をピアノと声が対等に描く。シューベルトが確立し、シューマンらが受け継いだ。","en":"Lied"},{"t":"ヴィルトゥオーゾ","kind":"term","d":"超絶的な技巧をもつ名演奏家。パガニーニはその典型で、リストらのピアニストに大きな影響を与えた。","en":"Virtuoso"},{"t":"管弦楽法","kind":"term","d":"楽器の音色や組み合わせを使い分けて管弦楽曲を書く技術。ベルリオーズの著した教本は後世に大きな影響を与えた。","en":"Orchestration"},{"t":"固定楽想","kind":"term","d":"一つの旋律が形を変えながら曲全体に繰り返し現れる手法（イデー・フィクス）。ベルリオーズが『幻想交響曲』で用いた。","en":"Idée fixe"},{"t":"ローマ賞","kind":"term","d":"フランスで芸術家に与えられた留学奨学制度の賞。受賞者はローマに留学した。ベルリオーズは1830年に作曲部門で受賞した。","en":"Prix de Rome"},{"t":"無言歌","kind":"term","d":"歌詞のない、歌うような旋律のピアノ小品。メンデルスゾーンが同名の曲集を書き、この名を広めた。","en":"Song without words"},{"t":"ポロネーズ","kind":"term","d":"ポーランド起源の3拍子の舞曲。行進のような威厳をもつ。ショパンがピアノ曲として芸術性を高めた。","en":"Polonaise"},{"t":"ノクターン","kind":"term","d":"夜想曲。夜の静けさを思わせる叙情的な小品。アイルランドのフィールドに始まるとされ、ショパンが深めた。","en":"Nocturne"},{"t":"イル・カノーネ","kind":"term","d":"パガニーニが愛用した1743年製グァルネリ・デル・ジェズのヴァイオリンの愛称。「大砲」の意で、遺言によりジェノヴァ市に遺贈された。","en":"Il Cannone"},{"t":"ダヴィッド同盟","kind":"term","d":"シューマンが批評文の中で思い描いた、俗物的な風潮と戦う芸術家たちの結社。フロレスタンとオイゼビウスという人物が登場した。","en":"Davidsbund"},{"t":"四季","kind":"work","d":"ヴィヴァルディのヴァイオリン協奏曲集『和声と創意の試み』Op.8の最初の4曲。春夏秋冬を描き、標題音楽の例としても有名。","en":"The Four Seasons"},{"t":"マタイ受難曲","kind":"work","d":"バッハが作曲した、マタイ福音書に基づく大規模な受難曲。1829年にメンデルスゾーンが蘇演し、バッハ再評価の契機となった。","en":"St Matthew Passion"},{"t":"平均律クラヴィーア曲集","kind":"work","d":"バッハが全24の長調・短調で前奏曲とフーガを組にした鍵盤曲集。全2巻あり、「音楽の旧約聖書」と称される。","en":"The Well-Tempered Clavier"},{"t":"メサイア","kind":"work","d":"ヘンデルのオラトリオ。キリストの生涯と救いを描き、1742年にダブリンで初演された。ハレルヤ・コーラスで名高い。","en":"Messiah"},{"t":"ハレルヤ・コーラス","kind":"work","d":"『メサイア』第2部を締めくくる合唱。国王が立ち上がったとの伝承から、起立して聴く習慣が生まれたとされる。","en":"Hallelujah Chorus"},{"t":"水上の音楽","kind":"work","d":"ヘンデルの管弦楽組曲集。1717年、国王ジョージ1世のテムズ川の舟遊びで演奏された。","en":"Water Music"},{"t":"告別交響曲","kind":"work","d":"ハイドンの交響曲第45番。終楽章で奏者が一人ずつ演奏をやめて退場し、楽団の休暇を願う意図があったとされる。","en":"Farewell Symphony"},{"t":"魔笛","kind":"work","d":"モーツァルト最晩年のドイツ語オペラ。1791年9月にウィーンで初演され、台本は興行主シカネーダーが書いた。","en":"The Magic Flute"},{"t":"モーツァルトのレクイエム","kind":"work","d":"モーツァルト最晩年の未完の鎮魂ミサ曲（K.626）。作曲者の死後、弟子ジュスマイヤーが補筆して完成させた。","en":"Mozart's Requiem"},{"t":"交響曲第5番「運命」","kind":"work","d":"ベートーヴェンの交響曲（Op.67）。冒頭の短い動機が全曲を貫く。「運命」の通称は弟子シンドラーの伝えに由来するとされる。","en":"Symphony No. 5"},{"t":"交響曲第9番「合唱付き」","kind":"work","d":"ベートーヴェン最後の交響曲（Op.125）。終楽章に独唱と合唱を加え、シラーの詩『歓喜に寄せて』を歌う。1824年初演。","en":"Symphony No. 9"},{"t":"魔王","kind":"work","d":"シューベルトが18歳ごろにゲーテの詩に作曲した歌曲（D.328）。語り手・父・子・魔王を一人の歌手が歌い分ける。","en":"Erlkönig"},{"t":"冬の旅","kind":"work","d":"シューベルトの連作歌曲集。ミュラーの詩による24曲で、失恋した青年のさすらいを描く。","en":"Winterreise"},{"t":"未完成交響曲","kind":"work","d":"シューベルトのロ短調の交響曲。完成した2つの楽章のみが残り、作曲者の没後1865年に初演された。","en":"Unfinished Symphony"},{"t":"ラ・カンパネッラ","kind":"work","d":"パガニーニのヴァイオリン協奏曲第2番の終楽章。鐘を模した音が特徴で、リストのピアノ編曲でも広く知られる。","en":"La campanella"},{"t":"24のカプリース","kind":"work","d":"パガニーニの無伴奏ヴァイオリンのための練習曲集（Op.1）。超絶技巧の宝庫で、後世の作曲家が主題を借りて変奏した。","en":"24 Caprices"},{"t":"幻想交響曲","kind":"work","d":"ベルリオーズの標題交響曲（Op.14）。失恋した芸術家の幻覚を5つの楽章で描き、1830年に初演された。","en":"Symphonie fantastique"},{"t":"夏の夜の夢","kind":"work","d":"シェイクスピアの戯曲による、メンデルスゾーンの序曲（1826年）と劇付随音楽（1843年）。結婚行進曲を含む。","en":"A Midsummer Night's Dream"},{"t":"結婚行進曲","kind":"work","d":"メンデルスゾーンの劇音楽『夏の夜の夢』中の一曲。結婚式の入場曲として広まり、1858年の英国王女の結婚式でも演奏された。","en":"Wedding March"},{"t":"革命のエチュード","kind":"work","d":"ショパンの練習曲Op.10の第12番。左手の激しい走句が特徴。祖国への憤りから書かれたと伝わるが確証はない。","en":"Revolutionary Étude"},{"t":"子供の情景","kind":"work","d":"シューマンのピアノ曲集（Op.15）。子供時代の思い出を13の小品で描き、第7曲「トロイメライ」で知られる。","en":"Kinderszenen"},{"t":"新音楽時報","kind":"work","d":"シューマンが1834年にライプツィヒで友人らと創刊した音楽雑誌。ショパンやブラームスを紹介する批評を掲載した。","en":"Neue Zeitschrift für Musik"},{"t":"ジョージ1世","kind":"person","d":"ハノーファー選帝侯から1714年に英国王となった君主。ヘンデルが仕えた縁があり、『水上の音楽』が演奏された王。","en":"George I"},{"t":"フリードリヒ大王","kind":"person","d":"プロイセン王（在位1740〜86年）。フルートを愛した。1747年、ポツダムにバッハを迎え、即興演奏の主題を与えた。","en":"Frederick the Great"},{"t":"ブクステフーデ","kind":"person","d":"ドイツのオルガン奏者・作曲家（1637頃〜1707）。リューベックの教会で演奏会を開き、青年バッハが聴きに訪れたと伝わる。","en":"Dieterich Buxtehude"},{"t":"ザロモン","kind":"person","d":"ヨハン・ペーター・ザロモン。ロンドンのヴァイオリン奏者・興行師。ハイドンを招いて演奏会を開き、ロンドン交響曲の誕生につながった。","en":"Johann Peter Salomon"},{"t":"エステルハージ家","kind":"person","d":"ハンガリーの大貴族の家。ハイドンは1761年から約30年、この家の楽長として宮廷楽団を率いた。","en":"Esterházy family"},{"t":"サリエリ","kind":"person","d":"アントニオ・サリエリ（1750〜1825）。ウィーン宮廷楽長を務めた作曲家で、シューベルトらの師。モーツァルト毒殺の噂は根拠に乏しい。","en":"Antonio Salieri"},{"t":"ナポレオン","kind":"person","d":"ナポレオン・ボナパルト（1769〜1821）。フランス皇帝。ベートーヴェンは当初「英雄」交響曲を彼に捧げるつもりだったと伝わる。","en":"Napoleon Bonaparte"},{"t":"ゲーテ","kind":"person","d":"ヨハン・ヴォルフガング・フォン・ゲーテ（1749〜1832）。ドイツの文豪。『魔王』など彼の詩にシューベルトらが曲をつけた。","en":"Johann Wolfgang von Goethe"},{"t":"ジョルジュ・サンド","kind":"person","d":"フランスの女性作家（1804〜1876）。1830年代末から1840年代にかけてショパンと親しく交際し、マヨルカ島へも同行した。","en":"George Sand"},{"t":"ハリエット・スミッソン","kind":"person","d":"アイルランド出身の女優。1827年パリでシェイクスピア劇に出演し、ベルリオーズが熱烈に恋した。のち彼の妻となった。","en":"Harriet Smithson"},{"t":"シェイクスピア","kind":"person","d":"ウィリアム・シェイクスピア（1564〜1616）。英国の劇作家。『夏の夜の夢』はその喜劇で、メンデルスゾーンが音楽をつけた。","en":"William Shakespeare"},{"t":"クララ・シューマン","kind":"person","d":"クララ・ヴィーク（1819〜1896）。ドイツのピアニスト・作曲家。ロベルト・シューマンの妻で、夫の作品を演奏して広めた。","en":"Clara Schumann"},{"t":"ヴェネツィア","kind":"place","d":"アドリア海に面したイタリアの水都。ヴィヴァルディの生地で、当時は共和国としてオペラや器楽が盛んだった。","en":"Venice"},{"t":"ピエタ養育院","kind":"place","d":"ヴェネツィアの孤児らを引き取る施設。女子の音楽教育で名高く、ヴィヴァルディが長く音楽教師を務めた。","en":"Ospedale della Pietà"},{"t":"ライプツィヒ","kind":"place","d":"ドイツ東部ザクセンの都市。バッハが後半生を過ごし、メンデルスゾーンやシューマンも活動した音楽の街。","en":"Leipzig"},{"t":"聖トーマス教会","kind":"place","d":"ライプツィヒの教会。付属学校の合唱隊とともに、バッハが1723年からカントルとして礼拝音楽を担った。","en":"St Thomas Church"},{"t":"ロンドン","kind":"place","d":"イギリスの首都。ヘンデルが生涯の大半を過ごし、ハイドンも招かれて大成功を収めた。","en":"London"},{"t":"ウィーン","kind":"place","d":"オーストリアの首都。古典派からロマン派初期の音楽の都で、ハイドン、モーツァルト、ベートーヴェン、シューベルトが活動した。","en":"Vienna"},{"t":"ザルツブルク","kind":"place","d":"オーストリアの都市。モーツァルトの生地で、当時は大司教が治める領邦の都だった。","en":"Salzburg"},{"t":"ジェノヴァ","kind":"place","d":"イタリア北西部の港町。パガニーニの生地で、愛器カノーネが市に遺贈され今も保管されている。","en":"Genoa"},{"t":"パリ","kind":"place","d":"フランスの首都。ショパンが後半生を過ごし、ベルリオーズが生涯の大半を活動した19世紀の芸術の中心地。","en":"Paris"},{"t":"ワルシャワ","kind":"place","d":"ポーランドの首都。ショパンが青年期まで過ごし、心臓は遺志によりこの地の聖十字架教会に納められた。","en":"Warsaw"},{"t":"マヨルカ島","kind":"place","d":"地中海のスペイン領の島。ショパンは1838〜39年の冬にサンドらと滞在し、前奏曲の作曲を進めた。","en":"Majorca"},{"t":"ゲヴァントハウス管弦楽団","kind":"place","d":"ライプツィヒの名門オーケストラ。メンデルスゾーンが1835年から指揮者を務め、ヨーロッパ屈指の楽団へ高めた。","en":"Gewandhaus Orchestra"},{"t":"ハイリゲンシュタットの遺書","kind":"event","d":"1802年、難聴に苦しむベートーヴェンがウィーン郊外で兄弟に宛てて書いた手紙。絶望と創作への決意が記され、死後に発見された。","en":"Heiligenstadt Testament"},{"t":"シューベルティアーデ","kind":"event","d":"シューベルトを囲む友人たちが集い、新作の歌曲やピアノ曲を楽しんだ私的な音楽の集まり。","en":"Schubertiade"},{"t":"11月蜂起","kind":"event","d":"1830年11月に始まったロシア支配に対するポーランドの武装蜂起。翌年に鎮圧され、ショパンが亡命生活を続ける背景となった。","en":"November Uprising"},{"t":"交響詩","kind":"term","d":"文学や絵画などの内容を、単楽章の管弦楽で描く形式。リストが創始し、代表作に「前奏曲」がある。","en":"Symphonic poem"},{"t":"リサイタル","kind":"term","d":"一人の演奏家が独奏で聴かせる演奏会。リストが各地で開き、この形を広めたとされる。","en":"Recital"},{"t":"ワイマール","kind":"place","d":"ドイツ中部の都市。リストが宮廷楽長を務め、ワーグナーの『ローエングリン』を初演した地。","en":"Weimar"},{"t":"コジマ・ワーグナー","kind":"person","d":"リストの娘。指揮者ビューローの妻だったが、のちにワーグナーと結婚した。夫の死後はバイロイト音楽祭を率いた。","en":"Cosima Wagner"},{"t":"ハンガリー狂詩曲","kind":"work","d":"リストがハンガリーの民俗的な旋律をもとに書いたピアノ曲集。全19曲で、第2番が特に有名。","en":"Hungarian Rhapsodies"},{"t":"楽劇","kind":"term","d":"音楽・台本・演出を一体とし、場面が切れ目なく進むワーグナーのオペラの形。『指環』『トリスタン』が代表。","en":"Music drama"},{"t":"ライトモティーフ","kind":"term","d":"人物や事物に結びつけた短い旋律。繰り返し現れて劇を支える。ワーグナーが多用した。日本語では示導動機。","en":"Leitmotif"},{"t":"総合芸術","kind":"term","d":"音楽・詩・演劇・美術を一つに結びつける理念。ワーグナーが楽劇で目指した。","en":"Gesamtkunstwerk"},{"t":"バイロイト祝祭劇場","kind":"place","d":"ドイツ南部バイロイトにあるワーグナー作品の専用劇場。1876年に開場し、今も毎夏音楽祭が開かれる。","en":"Bayreuth Festspielhaus"},{"t":"ルートヴィヒ2世","kind":"person","d":"バイエルン王（在位1864〜1886）。ワーグナーを庇護し、資金面で支えた。ノイシュヴァンシュタイン城でも知られる。","en":"Ludwig II of Bavaria"},{"t":"ニーベルングの指環","kind":"work","d":"ワーグナーの四部作の楽劇。ラインの黄金・ワルキューレ・ジークフリート・神々の黄昏からなり、上演に四夜かかる。","en":"Der Ring des Nibelungen"},{"t":"オペラ","kind":"term","d":"歌と管弦楽で進める舞台劇。16世紀末のイタリアに始まる。ヴェルディはその伝統を頂点へ導いた。","en":"Opera"},{"t":"リソルジメント","kind":"event","d":"19世紀のイタリア統一運動。オーストリアの支配に抗い、1861年にイタリア王国が成立した。ヴェルディの作品と結びつけて語られる。","en":"Risorgimento"},{"t":"ミラノ・スカラ座","kind":"place","d":"ミラノの名門歌劇場。1778年開場。ヴェルディの『ナブッコ』や『オテロ』などが初演された。","en":"La Scala"},{"t":"ナブッコ","kind":"work","d":"ヴェルディ初期の出世作のオペラ(1842)。古代ユダヤ人の捕囚を描き、合唱「行け、わが想いよ」で知られる。","en":"Nabucco"},{"t":"椿姫","kind":"work","d":"ヴェルディのオペラ(1853)。パリの高級娼婦ヴィオレッタの悲恋を描く。デュマ・フィスの小説が原作。","en":"La traviata"},{"t":"アイーダ","kind":"work","d":"ヴェルディのオペラ(1871)。古代エジプトを舞台にした悲恋を描く。カイロで初演され、凱旋行進曲で名高い。","en":"Aida"},{"t":"絶対音楽","kind":"term","d":"物語や詩などの内容に頼らず、音そのものの構造で成り立つ音楽という考え方。ブラームスの交響曲が代表例とされる。","en":"Absolute music"},{"t":"ハンブルク","kind":"place","d":"ドイツ北部の港湾都市。ブラームスの生地で、青年期までをここで過ごした。","en":"Hamburg"},{"t":"ドイツ・レクイエム","kind":"work","d":"ブラームスの合唱曲。1860年代後半に完成した。ドイツ語訳聖書の言葉を用い、死者を悼む人々を慰める内容。","en":"A German Requiem"},{"t":"ハンガリー舞曲集","kind":"work","d":"ブラームスの連弾用の舞曲集（全21曲）。ハンガリー風の旋律に基づき、第5番が特に有名。","en":"Hungarian Dances"},{"t":"バレエ音楽","kind":"term","d":"舞踊のために書かれた音楽。チャイコフスキーは『白鳥の湖』などで、バレエ音楽を交響的な水準に高めた。","en":"Ballet music"},{"t":"白鳥の湖","kind":"work","d":"チャイコフスキーのバレエ(1877年初演)。魔法で白鳥にされた王女と王子の物語。","en":"Swan Lake"},{"t":"交響曲第6番「悲愴」","kind":"work","d":"チャイコフスキー最後の交響曲(1893)。暗く静かな終楽章で閉じる。初演の9日後に作曲者が亡くなった。","en":"Symphony No. 6 Pathétique"},{"t":"メック夫人","kind":"person","d":"ナジェージダ・フォン・メック（1831〜1894）。鉄道事業家の未亡人で、チャイコフスキーを長年経済的に支えた。","en":"Nadezhda von Meck"},{"t":"モスクワ音楽院","kind":"place","d":"1866年創立のロシアの音楽院。チャイコフスキーは開校とともに教授に就いた。","en":"Moscow Conservatory"},{"t":"サンクトペテルブルク","kind":"place","d":"当時のロシア帝国の首都。チャイコフスキーが学んだ音楽院があり、ムソルグスキーが亡くなった町。","en":"Saint Petersburg"},{"t":"五人組","kind":"term","d":"19世紀後半のロシアの作曲家グループ。ムソルグスキーやリムスキー＝コルサコフらが、ロシア独自の音楽を目指した。","en":"The Five (Mighty Handful)"},{"t":"国民楽派","kind":"term","d":"民謡や民族舞曲を取り入れ、自国らしさを打ち出した19世紀の作曲家たち。ドヴォルザーク、グリーグ、ムソルグスキーなど。","en":"Nationalism in music"},{"t":"ボヘミア","kind":"place","d":"現在のチェコ西部にあたる地方。ドヴォルザークとマーラーの生まれた土地。","en":"Bohemia"},{"t":"スメタナ","kind":"person","d":"ベドルジハ・スメタナ（1824〜1884）。チェコ国民楽派の祖。ドヴォルザークは彼が指揮する劇場楽団でヴィオラを弾いた。","en":"Bedřich Smetana"},{"t":"ニューヨーク","kind":"place","d":"アメリカ最大の都市。ドヴォルザークが院長を務めた音楽学校があり、マーラーも晩年に活動した。","en":"New York"},{"t":"交響曲第9番「新世界より」","kind":"work","d":"ドヴォルザークの交響曲(1893)。アメリカ滞在中に書かれ、第2楽章の旋律と終楽章の力強い主題で知られる。","en":"Symphony No. 9 From the New World"},{"t":"スラヴ舞曲集","kind":"work","d":"ドヴォルザークの舞曲集。ピアノ連弾版と管弦楽版があり、ブラームスのハンガリー舞曲集に刺激されて生まれた。","en":"Slavonic Dances"},{"t":"黒人霊歌","kind":"term","d":"アメリカの黒人の間で歌い継がれた宗教的な歌。ドヴォルザークは滞在中にこれに関心を寄せた。","en":"Spirituals"},{"t":"リムスキー＝コルサコフ","kind":"person","d":"ニコライ・リムスキー＝コルサコフ（1844〜1908）。五人組の一人。ムソルグスキーの遺作を整理し、ストラヴィンスキーを教えた。","en":"Nikolai Rimsky-Korsakov"},{"t":"ハルトマン","kind":"person","d":"ヴィクトル・ハルトマン（1834〜1873）。ロシアの建築家・画家。ムソルグスキーの親友で、その遺作展が『展覧会の絵』の契機となった。","en":"Viktor Hartmann"},{"t":"展覧会の絵","kind":"work","d":"ムソルグスキーのピアノ組曲(1874)。ハルトマンの遺作展を歩いて見て回る構成。ラヴェルの管弦楽編曲が有名。","en":"Pictures at an Exhibition"},{"t":"ボリス・ゴドゥノフ","kind":"work","d":"ムソルグスキーのオペラ。16世紀末のロシア皇帝ボリスを主人公とする。プーシキンの劇が原作。","en":"Boris Godunov"},{"t":"ロシア","kind":"place","d":"ユーラシアの大国。チャイコフスキー、ムソルグスキー、ストラヴィンスキーらを生んだ。","en":"Russia"},{"t":"ノルウェー","kind":"place","d":"北欧の国。19世紀に民族意識が高まり、グリーグが民謡を取り入れた音楽でその象徴となった。","en":"Norway"},{"t":"ベルゲン","kind":"place","d":"ノルウェー西岸の港町。グリーグの生まれた町で、彼の名を冠したコンサートホールがある。","en":"Bergen"},{"t":"トロルハウゲン","kind":"place","d":"ベルゲン近郊にあるグリーグの旧邸。現在は記念館として公開され、夫妻の墓もある。","en":"Troldhaugen"},{"t":"イプセン","kind":"person","d":"ヘンリック・イプセン（1828〜1906）。ノルウェーの劇作家。『ペール・ギュント』の劇音楽をグリーグに依頼した。","en":"Henrik Ibsen"},{"t":"ペール・ギュント","kind":"work","d":"イプセンの戯曲(1867)と、グリーグの劇音楽(1874〜75)。「朝」や「山の魔王の宮殿にて」は組曲として有名。","en":"Peer Gynt"},{"t":"抒情小品集","kind":"work","d":"グリーグのピアノ小品集。1867〜1901年に全10集が出版された。「春に寄す」などを含む。","en":"Lyric Pieces"},{"t":"後期ロマン派","kind":"term","d":"19世紀末から20世紀初頭の、巨大な管弦楽と複雑な和声を特徴とする様式。マーラーが代表的な作曲家。","en":"Late Romanticism"},{"t":"ウィーン宮廷歌劇場","kind":"place","d":"ウィーンの歌劇場（現在のウィーン国立歌劇場）。マーラーが1897年から約10年間、監督を務めた。","en":"Vienna Court Opera"},{"t":"アルマ・マーラー","kind":"person","d":"マーラーの妻（1879〜1964）。画家の娘で、自身も作曲を学んだ。1902年にマーラーと結婚した。","en":"Alma Mahler"},{"t":"大地の歌","kind":"work","d":"マーラーの作品(1908〜09)。中国の詩のドイツ語訳による、独唱つきの交響曲的な連作。初演は死後だった。","en":"Das Lied von der Erde"},{"t":"交響曲第2番「復活」","kind":"work","d":"マーラーの交響曲(1894年完成)。終楽章で独唱と合唱が復活への希望を歌う。","en":"Symphony No. 2 Resurrection"},{"t":"印象派","kind":"term","d":"光や空気の移ろいを捉えようとした19世紀末フランスの芸術潮流。音楽ではドビュッシーやラヴェルがこの名で呼ばれる。","en":"Impressionism"},{"t":"全音音階","kind":"term","d":"隣り合う音がすべて全音の間隔で並ぶ6音の音階。調性感が曖昧になり、ドビュッシーが好んで用いた。","en":"Whole-tone scale"},{"t":"ガムラン","kind":"term","d":"インドネシアの打楽器中心の合奏音楽。ドビュッシーは1889年のパリ万博で聴き、影響を受けたとされる。","en":"Gamelan"},{"t":"パリ万国博覧会","kind":"event","d":"1889年にパリで開かれた万博。エッフェル塔が建てられ、ドビュッシーはここでジャワのガムランを聴いたとされる。","en":"Exposition Universelle (1889)"},{"t":"マラルメ","kind":"person","d":"ステファヌ・マラルメ（1842〜1898）。フランス象徴派の詩人。その詩『牧神の午後』がドビュッシーの管弦楽曲の源となった。","en":"Stéphane Mallarmé"},{"t":"葛飾北斎","kind":"person","d":"江戸時代の浮世絵師（1760ごろ〜1849）。『神奈川沖浪裏』が有名。ドビュッシー『海』の初版の表紙に波の絵が使われたとされる。","en":"Katsushika Hokusai"},{"t":"ローマ大賞","kind":"event","d":"フランスの国家が与えた芸術家の登竜門の賞。受賞者はローマに留学できた。ドビュッシーは1884年に受賞し、ラヴェルは落選を重ねた。","en":"Prix de Rome"},{"t":"ペレアスとメリザンド","kind":"work","d":"ドビュッシー唯一の完成したオペラ(1902)。メーテルリンクの劇による。語るような旋律で進む。","en":"Pelléas et Mélisande"},{"t":"ボレロ","kind":"work","d":"ラヴェルの管弦楽曲(1928)。同一の旋律とリズムが続き、楽器を加えて音量を高める。バレエ音楽として作曲された。","en":"Boléro"},{"t":"イダ・ルビンシュタイン","kind":"person","d":"ロシア出身のダンサー（1883〜1960）。自らの舞踊団のためにラヴェルへ『ボレロ』を依頼した。","en":"Ida Rubinstein"},{"t":"ロシア・バレエ団","kind":"term","d":"ディアギレフが1909年にパリで旗揚げしたバレエ団。ストラヴィンスキーやラヴェルが作品を書いた。","en":"Ballets Russes"},{"t":"セルゲイ・ディアギレフ","kind":"person","d":"ロシアの興行師（1872〜1929）。ロシア・バレエ団を率い、ストラヴィンスキーを見出した。","en":"Sergei Diaghilev"},{"t":"春の祭典","kind":"work","d":"ストラヴィンスキーのバレエ音楽(1913)。ニジンスキー振付、パリで初演され、激しい反応を呼んだと伝わる。","en":"The Rite of Spring"},{"t":"新古典主義","kind":"term","d":"18世紀の均整のとれた形式や様式に学ぶ20世紀の潮流。ストラヴィンスキーは1920年ごろからこの方向へ進んだ。","en":"Neoclassicism"},{"t":"十二音技法","kind":"term","d":"1オクターブの12音を一定の順序で使う作曲法。シェーンベルクが確立。ストラヴィンスキーも晩年に取り入れた。","en":"Twelve-tone technique"},{"t":"シャンゼリゼ劇場","kind":"place","d":"パリの劇場（1913年開場）。同年の『春の祭典』初演の舞台となった。","en":"Théâtre des Champs-Élysées"},{"t":"クレモナ","kind":"place","d":"北イタリア・ロンバルディア地方の都市。アマティ、ストラディヴァリ、グァルネリらが工房を構えた弦楽器製作の中心地。","en":"Cremona"},{"t":"アントニオ・ストラディヴァリ","kind":"person","d":"クレモナの弦楽器製作者（1644ごろ〜1737）。名器ストラディヴァリウスの作り手で、長い生涯に多数の楽器を残した。","en":"Antonio Stradivari"},{"t":"アマティ家","kind":"person","d":"クレモナの弦楽器製作者の一族。16世紀のアンドレア・アマティが現代型ヴァイオリンの原型を築いたとされる。","en":"Amati family"},{"t":"フランソワ・トゥルテ","kind":"person","d":"パリの弓製作者（1747〜1835）。現代のヴァイオリン族の弓の標準を定めた人物とされる。","en":"Francois Tourte"},{"t":"タルティーニ","kind":"person","d":"ジュゼッペ・タルティーニ（1692〜1770）。イタリアの作曲家・ヴァイオリン奏者で、『悪魔のトリル』で知られる。","en":"Giuseppe Tartini"},{"t":"ヤッシャ・ハイフェッツ","kind":"person","d":"20世紀を代表するヴァイオリン奏者（1901〜1987）。ヴィリニュス生まれで米国で活躍。グァルネリ・デル・ジェズの愛用者。","en":"Jascha Heifetz"},{"t":"無伴奏チェロ組曲","kind":"work","d":"バッハが作曲した全6曲の独奏チェロのための組曲。カザルスの演奏と録音で演奏会の中心的な作品と認められた。","en":"Cello Suites"},{"t":"パブロ・カザルス","kind":"person","d":"スペイン・カタルーニャ出身のチェロ奏者（1876〜1973）。バッハの無伴奏チェロ組曲を演奏会曲目として定着させたとされる。","en":"Pablo Casals"},{"t":"ムスティスラフ・ロストロポーヴィチ","kind":"person","d":"旧ソ連出身のチェロ奏者・指揮者（1927〜2007）。20世紀後半を代表する名手で、ストラディヴァリのチェロ『デュポール』を愛用した。","en":"Mstislav Rostropovich"},{"t":"バルトロメオ・クリストフォリ","kind":"person","d":"イタリアのチェンバロ製作者（1655〜1731）。フィレンツェのメディチ家に仕え、1700年ごろにピアノの原型を完成させたとされる。","en":"Bartolomeo Cristofori"},{"t":"フィレンツェ","kind":"place","d":"イタリア中部トスカーナの都市。メディチ家の宮廷でクリストフォリがピアノを考案し、初期オペラが生まれた地でもある。","en":"Florence"},{"t":"ブロードウッド社","kind":"term","d":"ロンドンのピアノ製造会社。力強い響きのイギリス式ピアノで知られ、ベートーヴェンにも楽器を贈った。","en":"Broadwood"},{"t":"プレイエル社","kind":"term","d":"パリのピアノ製造会社。繊細な音色でショパンに愛され、チェンバロやハープの製作でも知られた。","en":"Pleyel"},{"t":"エラール社","kind":"term","d":"パリの楽器製造会社。ピアノの連打機構とダブルアクション式ペダルハープを開発し、リストも愛用したとされる。","en":"Erard"},{"t":"ワンダ・ランドフスカ","kind":"person","d":"ポーランド出身の鍵盤楽器奏者（1879〜1959）。20世紀初頭にチェンバロを演奏会に復活させ、古楽復興の先駆者となった。","en":"Wanda Landowska"},{"t":"ルッカース家","kind":"person","d":"16〜17世紀にアントウェルペンで活躍したチェンバロ製作者の一族。その楽器は後世の製作や改造の模範とされた。","en":"Ruckers family"},{"t":"通奏低音","kind":"term","d":"バロック音楽で、低音の旋律と和音の伴奏を鍵盤楽器などが受け持つ書法。チェンバロやオルガンが担った。","en":"basso continuo"},{"t":"ゴルトベルク変奏曲","kind":"work","d":"バッハ作曲の鍵盤作品。主題の後に30の変奏が続き、2段鍵盤のチェンバロのために書かれた。","en":"Goldberg Variations"},{"t":"ドメニコ・スカルラッティ","kind":"person","d":"イタリア生まれの作曲家・鍵盤奏者（1685〜1757）。多数の鍵盤ソナタを残し、ヘンデルと同年の生まれ。","en":"Domenico Scarlatti"},{"t":"リューベック","kind":"place","d":"北ドイツの港湾都市。聖マリア教会でブクステフーデがオルガニストを務め、若きバッハが訪ねたと伝わる。","en":"Lubeck"},{"t":"ジルバーマン","kind":"person","d":"ゴットフリート・ジルバーマン（1683〜1753）。ザクセンのオルガン製作者で、ピアノも手がけた。バッハが試奏した話が伝わる。","en":"Gottfried Silbermann"},{"t":"トッカータとフーガ ニ短調","kind":"work","d":"バッハ作と伝わるオルガン曲（BWV565）。劇的な冒頭で広く知られるが、作者や成立年代には議論がある。","en":"Toccata and Fugue in D minor"},{"t":"テオバルト・ベーム","kind":"person","d":"ドイツの笛製作者・フルート奏者（1794〜1881）。1847年ごろ、金属製の円筒管をもつ現代フルートを完成させた。","en":"Theobald Boehm"},{"t":"クヴァンツ","kind":"person","d":"ヨハン・ヨアヒム・クヴァンツ（1697〜1773）。ドイツのフルート奏者・作曲家で、フリードリヒ大王の師。奏法書でも知られる。","en":"Johann Joachim Quantz"},{"t":"牧神の午後への前奏曲","kind":"work","d":"ドビュッシーの管弦楽曲（1894年初演）。マラルメの詩に着想を得て、冒頭の無伴奏フルートの旋律で知られる。","en":"Prelude to the Afternoon of a Faun"},{"t":"音楽の捧げもの","kind":"work","d":"バッハが1747年に出版した曲集。フリードリヒ大王から与えられた主題による作品群で、フルートを含む三重奏ソナタも収める。","en":"The Musical Offering"},{"t":"ヨハン・クリストフ・デンナー","kind":"person","d":"ニュルンベルクの管楽器製作者（1655〜1707）。1700年ごろ、シャリュモーを改良してクラリネットを生んだとされる。","en":"Johann Christoph Denner"},{"t":"ニュルンベルク","kind":"place","d":"ドイツ南部バイエルン地方の都市。古くから管楽器の製作が盛んで、クラリネットもここで生まれたとされる。","en":"Nuremberg"},{"t":"アントン・シュタードラー","kind":"person","d":"ウィーンのクラリネット奏者（1753〜1812）。モーツァルトと親交が深く、五重奏曲と協奏曲を書いてもらった名手。","en":"Anton Stadler"},{"t":"リヒャルト・ミュールフェルト","kind":"person","d":"ドイツのクラリネット奏者（1856〜1907）。ブラームスが晩年にクラリネット作品を書くきっかけとなった名手。","en":"Richard Muhlfeld"},{"t":"ベニー・グッドマン","kind":"person","d":"米国のクラリネット奏者（1909〜1986）。スウィング・ジャズの王と呼ばれ、クラシックの作品も演奏した。","en":"Benny Goodman"},{"t":"ジャズ","kind":"term","d":"20世紀初めに米国で生まれた音楽。即興演奏を特徴とし、クラリネットやサクソフォンが重要な役を担ってきた。","en":"jazz"},{"t":"アドルフ・サックス","kind":"person","d":"ベルギー出身の楽器製作者（1814〜1894）。パリで活動し、1840年代にサクソフォンを発明した。","en":"Adolphe Sax"},{"t":"チャーリー・パーカー","kind":"person","d":"米国のアルト・サクソフォン奏者（1920〜1955）。ビバップを確立した中心人物で、モダン・ジャズに大きな影響を与えた。","en":"Charlie Parker"},{"t":"序奏とアレグロ","kind":"work","d":"ラヴェルが1905年に書いた、ハープ・フルート・クラリネットと弦楽四重奏のための作品。エラール社の依頼によるとされる。","en":"Introduction and Allegro"},{"t":"交響曲第103番「太鼓連打」","kind":"work","d":"ハイドンがロンドンのために書いた交響曲。冒頭のティンパニの連打が通称の由来。","en":"Symphony No. 103 'Drumroll'"},{"t":"荒城の月","kind":"work","d":"土井晩翠の詩に滝廉太郎が曲を付けた歌曲。山田耕筰の編曲版でも広く歌われる。","en":"Kojo no Tsuki"},{"t":"組歌「四季」","kind":"work","d":"滝廉太郎が1900年に作った、春夏秋冬を歌う4曲の組歌。第1曲が「花」。","en":"Shiki (song cycle)"},{"t":"土井晩翠","kind":"person","d":"仙台出身の詩人。「荒城の月」の詞を書き、滝廉太郎が曲を付けた。","en":"Doi Bansui"},{"t":"東京音楽学校","kind":"place","d":"東京藝術大学音楽学部の前身。滝廉太郎や山田耕筰が学んだ官立の音楽教育機関。","en":"Tokyo Music School"},{"t":"岡城跡","kind":"place","d":"大分県竹田市にある城跡。滝廉太郎が少年期を過ごした地で、「荒城の月」の着想の地とされる。","en":"Oka Castle ruins"},{"t":"唱歌","kind":"term","d":"明治期に学校教育のために作られた歌。滝廉太郎は「荒城の月」「お正月」などを残した。","en":"Shoka"},{"t":"北原白秋","kind":"person","d":"詩人。山田耕筰と組み、「この道」「からたちの花」などの歌曲を生んだ。","en":"Kitahara Hakushu"},{"t":"三木露風","kind":"person","d":"詩人。北海道のトラピスト修道院に暮らした時期もある。詞に山田耕筰が曲を付けた「赤とんぼ」で知られる。","en":"Miki Rofu"},{"t":"マックス・ブルッフ","kind":"person","d":"ドイツの作曲家。山田耕筰がベルリン留学中に作曲を学んだ師とされる。","en":"Max Bruch"},{"t":"赤とんぼ","kind":"work","d":"三木露風の詞による童謡。山田耕筰が1927年に曲を付けた日本を代表する歌曲。","en":"Akatombo"},{"t":"からたちの花","kind":"work","d":"北原白秋の詞による歌曲。山田耕筰が1925年に作曲し、日本語の抑揚を生かした。","en":"Karatachi no Hana"},{"t":"日本交響楽協会","kind":"event","d":"1925年に山田耕筰らが設立に関わった管弦楽団。日本の管弦楽活動の基礎を作った。","en":"Japan Symphony Association"},{"t":"六段の調べ","kind":"work","d":"箏の代表的な独奏曲。八橋検校の作と伝わり、六つの段で構成される。","en":"Rokudan no Shirabe"},{"t":"箏曲","kind":"term","d":"箏を中心とする音楽の総称。八橋検校が基礎を築き、宮城道雄が近代化した。","en":"Sokyoku"},{"t":"検校","kind":"term","d":"江戸時代に盲人の音楽家や鍼灸師などが就いた最高位。八橋検校はその位にあった。","en":"Kengyo"},{"t":"当道座","kind":"term","d":"中世から江戸時代にかけて盲人が組織した自治団体。箏曲や三味線音楽の担い手を支えた。","en":"Todoza"},{"t":"筑紫箏","kind":"term","d":"北九州で伝わった箏の流派。八橋検校はこれを学んで箏曲を発展させたとされる。","en":"Tsukushi-goto"},{"t":"箏組歌","kind":"term","d":"歌を伴う箏の古典曲集。八橋検校が整えたと伝わり、箏曲の基礎になった。","en":"Kumiuta"},{"t":"平調子","kind":"term","d":"箏の基本的な調弦。八橋検校が整えたと伝わり、日本的な旋律の土台となった。","en":"Hirajoshi"},{"t":"生田流","kind":"term","d":"箏曲の二大流派のひとつで、江戸中期に生田検校が興した。角爪を用いる。","en":"Ikuta-ryu"},{"t":"山田流","kind":"term","d":"箏曲の二大流派のひとつで、江戸後期に山田検校が興した。丸爪を用い、語りを重視する。","en":"Yamada-ryu"},{"t":"十七絃","kind":"term","d":"宮城道雄が1921年に考案した低音の箏。十七本の弦を持ち、合奏の低音を支える。","en":"Jushichigen"},{"t":"新日本音楽","kind":"term","d":"大正から昭和にかけ、宮城道雄らが洋楽の要素を取り入れて進めた邦楽の革新運動。","en":"Shin Nihon Ongaku"},{"t":"仁川","kind":"place","d":"朝鮮半島西岸の港町。宮城道雄が少年期に渡り、作曲を始めた地とされる。","en":"Incheon"},{"t":"ルネ・シュメー","kind":"person","d":"フランスのヴァイオリニスト。来日して宮城道雄と共演し、「春の海」を海外に紹介した。","en":"Renee Chemet"},{"t":"春の海","kind":"work","d":"宮城道雄が作曲した箏と尺八の二重奏曲。正月の定番曲として親しまれる。","en":"Haru no Umi"},{"t":"雅楽","kind":"term","d":"古代に大陸から伝わり日本で整えられた宮廷音楽。笙や琵琶、箏などが用いられる。","en":"Gagaku"},{"t":"管絃","kind":"term","d":"雅楽のうち、舞を伴わない器楽合奏。笙や篳篥、龍笛などの管楽器と、箏や琵琶などで奏する。","en":"Kangen"},{"t":"越天楽","kind":"work","d":"雅楽の代表曲のひとつ。管絃で演奏され、笙が和音で曲を支える。","en":"Etenraku"},{"t":"合竹","kind":"term","d":"笙が複数の音を同時に鳴らす和音の奏法。雅楽の響きを特徴づける。","en":"Aitake"},{"t":"セレモニアル","kind":"work","d":"武満徹が笙と管弦楽のために書いた曲。1992年に初演された。","en":"Ceremonial (An Autumn Ode)"},{"t":"宮田まゆみ","kind":"person","d":"笙奏者。笙の現代曲の演奏で知られ、武満徹の作品でも演奏した。","en":"Miyata Mayumi"},{"t":"日本狂詩曲","kind":"work","d":"伊福部昭が1935年に作った管弦楽曲。チェレプニン賞を受けた。","en":"Japanese Rhapsody"},{"t":"シンフォニア・タプカーラ","kind":"work","d":"伊福部昭の交響曲。題名は「立って踊る」を意味するアイヌ語に由来する。","en":"Sinfonia Tapkaara"},{"t":"ゴジラ","kind":"work","d":"1954年公開の特撮映画。伊福部昭の音楽がテーマとして広く知られる。","en":"Godzilla"},{"t":"ラウダ・コンチェルタータ","kind":"work","d":"伊福部昭が1979年に書いた、二十絃箏と管弦楽のための協奏曲。","en":"Lauda Concertata"},{"t":"二十絃箏","kind":"term","d":"二十本の弦を持つ箏。伊福部昭が協奏曲を書いたことでも知られる。","en":"Nijugen-so"},{"t":"アイヌ音楽","kind":"term","d":"北海道の先住民族アイヌの歌や舞踊。伊福部昭は少年期に触れ、作風に影響を受けた。","en":"Ainu music"},{"t":"チェレプニン賞","kind":"event","d":"作曲家アレクサンドル・チェレプニンが募った作曲賞。伊福部昭が1935年に日本狂詩曲で受けた。","en":"Tcherepnin Prize"},{"t":"芥川也寸志","kind":"person","d":"作曲家。作家・芥川龍之介の三男で、伊福部昭に師事した門下のひとり。","en":"Akutagawa Yasushi"},{"t":"ノヴェンバー・ステップス","kind":"work","d":"武満徹が1967年に作った、琵琶・尺八と管弦楽のための曲。ニューヨーク・フィルの委嘱作。","en":"November Steps"},{"t":"弦楽のためのレクイエム","kind":"work","d":"武満徹が1957年に作った弦楽合奏曲。ストラヴィンスキーの称賛で知られる。","en":"Requiem for Strings"},{"t":"鶴田錦史","kind":"person","d":"琵琶奏者。「ノヴェンバー・ステップス」の初演で琵琶を担当した。","en":"Tsuruta Kinshi"},{"t":"横山勝也","kind":"person","d":"尺八奏者。「ノヴェンバー・ステップス」の初演で尺八を担当した。","en":"Yokoyama Katsuya"},{"t":"小澤征爾","kind":"person","d":"指揮者。「ノヴェンバー・ステップス」の初演を指揮し、武満徹の作品を海外へ紹介した。","en":"Ozawa Seiji"},{"t":"宮崎駿","kind":"person","d":"アニメーション監督。久石譲が音楽を担当した作品を多く手がけた。","en":"Miyazaki Hayao"},{"t":"北野武","kind":"person","d":"映画監督。久石譲が音楽を担当した『HANA-BI』などの作品を手がけた。","en":"Kitano Takeshi"},{"t":"スタジオジブリ","kind":"term","d":"宮崎駿らが拠点としたアニメーションスタジオ。久石譲の音楽は多くの作品で用いられた。","en":"Studio Ghibli"},{"t":"ミニマル・ミュージック","kind":"term","d":"短い音型を反復し、少しずつ変化させる音楽。久石譲が初期に取り組んだ手法。","en":"Minimal music"},{"t":"風の谷のナウシカ","kind":"work","d":"1984年公開の宮崎駿監督のアニメ映画。久石譲が音楽を担当し、協働の出発点となった。","en":"Nausicaa of the Valley of the Wind"},{"t":"千と千尋の神隠し","kind":"work","d":"2001年公開の宮崎駿監督のアニメ映画。久石譲が音楽を担当した。","en":"Spirited Away"},{"t":"HANA-BI","kind":"work","d":"1997年公開の北野武監督の映画。久石譲が音楽を担当し、同監督との協働を深めた。","en":"Hana-bi"},{"t":"おくりびと","kind":"work","d":"2008年公開の滝田洋二郎監督の映画。久石譲の音楽が日本アカデミー賞を受けた。","en":"Departures"},{"t":"イエロー・マジック・オーケストラ","kind":"event","d":"1978年に細野晴臣、高橋幸宏、坂本龍一が結成したバンド。テクノポップで世界的に知られる。","en":"Yellow Magic Orchestra"},{"t":"戦場のメリークリスマス","kind":"work","d":"1983年公開の大島渚監督の映画。坂本龍一が音楽を担当し、俳優としても出演した。","en":"Merry Christmas, Mr. Lawrence"},{"t":"ラストエンペラー","kind":"work","d":"1987年公開のベルトルッチ監督の映画。坂本龍一らの音楽がアカデミー賞作曲賞を受けた。","en":"The Last Emperor"},{"t":"大島渚","kind":"person","d":"映画監督。『戦場のメリークリスマス』で坂本龍一を俳優と作曲家の両面で起用した。","en":"Oshima Nagisa"},{"t":"ベルナルド・ベルトルッチ","kind":"person","d":"イタリアの映画監督。『ラストエンペラー』の音楽を坂本龍一に任せた。","en":"Bernardo Bertolucci"},{"t":"三線","kind":"term","d":"沖縄の三弦楽器。三味線の原型とされ、16世紀ごろに本土へ伝わった。","en":"Sanshin"},{"t":"長唄","kind":"term","d":"歌舞伎の舞踊や伴奏から発展した三味線音楽。細棹の三味線を用いる。","en":"Nagauta"},{"t":"義太夫節","kind":"term","d":"人形浄瑠璃で語られる浄瑠璃の一流派。太棹の三味線が伴奏を受け持つ。","en":"Gidayu-bushi"},{"t":"浄瑠璃","kind":"term","d":"三味線を伴奏に物語を語る芸能。人形浄瑠璃や歌舞伎で発展した。","en":"Joruri"},{"t":"津軽三味線","kind":"term","d":"青森県の津軽地方で発達した、太棹を打楽的に弾く奏法とその音楽。","en":"Tsugaru-jamisen"},{"t":"歌舞伎","kind":"term","d":"江戸時代に成立した演劇。三味線音楽や太鼓などの鳴物が舞台を彩る。","en":"Kabuki"},{"t":"虚無僧","kind":"term","d":"普化宗の僧。深編笠をかぶり、尺八を吹いて諸国を修行して歩いた。","en":"Komuso"},{"t":"普化宗","kind":"term","d":"禅宗の一派。尺八を法器として吹禅を行い、江戸時代に虚無僧が属した。明治4年に廃止。","en":"Fuke-shu"},{"t":"都山流","kind":"term","d":"中尾都山が1896年に創始した尺八の流派。現在、尺八の主要な流派のひとつ。","en":"Tozan-ryu"},{"t":"琴古流","kind":"term","d":"江戸時代中期の黒沢琴古に始まる尺八の流派。虚無僧の本曲を受け継ぐ。","en":"Kinko-ryu"},{"t":"本曲","kind":"term","d":"虚無僧が修行として吹いた尺八の独奏曲。「鶴の巣籠」などの古典曲がある。","en":"Honkyoku"},{"t":"平家物語","kind":"work","d":"平家の興亡を描く軍記物語。琵琶法師が琵琶を弾きながら語って広めた。","en":"The Tale of the Heike"},{"t":"平曲","kind":"term","d":"『平家物語』を琵琶の伴奏で語る芸能。琵琶法師が受け継ぎ、中世に広まった。","en":"Heikyoku"},{"t":"琵琶法師","kind":"term","d":"琵琶を弾きながら語り物を語った、盲目の僧形の芸能者。平家琵琶を担った。","en":"Biwa hoshi"},{"t":"薩摩琵琶","kind":"term","d":"薩摩の武士の間で伝わった琵琶楽。力強い撥さばきと勇壮な語りが特徴。","en":"Satsuma-biwa"},{"t":"耳なし芳一","kind":"work","d":"小泉八雲が『怪談』に収めた物語。平家を語る盲目の琵琶法師、芳一が主人公。","en":"Hoichi the Earless"},{"t":"鼓童","kind":"term","d":"1981年に佐渡島で結成された太鼓芸能集団。和太鼓を舞台芸術として世界に広めた。","en":"Kodo"},{"t":"林英哲","kind":"person","d":"和太鼓奏者。ソロ奏者として、和太鼓を舞台の独奏楽器に育てた。","en":"Hayashi Eitetsu"},{"t":"小口大八","kind":"person","d":"和太鼓奏者。複数の太鼓を組み合わせる組太鼓を始めたとされる。","en":"Oguchi Daihachi"},{"t":"組太鼓","kind":"term","d":"大きさの異なる複数の太鼓を数人で組み合わせて演奏する形式。和太鼓の合奏様式を広げた。","en":"Kumi-daiko"},{"t":"能","kind":"term","d":"室町時代に観阿弥・世阿弥が大成した歌舞劇。囃子に笛・小鼓・大鼓が加わり、太鼓も用いられる。","en":"Noh"}]},"sample":[{"d":"音楽","q":"ロマン派の作曲家で、生涯の大半をピアノ曲に捧げて「ピアノの詩人」と呼ばれた。『ノクターン』『ワルツ』『ポロネーズ』を残し、パリで没したが、遺言で心臓は故郷ワルシャワに運ばれたとされる。誰か。","o":["ロベルト・シューマン","フランツ・リスト","フレデリック・ショパン","フェリックス・メンデルスゾーン"],"a":2,"e":"ショパンはポーランド出身のロマン派。パリを拠点に活動し、心臓はワルシャワの聖十字架教会に安置されたと伝わる。リストは超絶技巧で知られるハンガリー出身、シューマンとメンデルスゾーンはドイツの作曲家。","r":"海外"},{"d":"音楽","q":"耳の病に苦しみ、1802年に弟たちへ宛てて「ハイリゲンシュタットの遺書」を書いたものの、その後も創作を続け、晩年に交響曲第9番『合唱付き』を完成させた作曲家は誰か。","o":["ルートヴィヒ・ファン・ベートーヴェン","ヨーゼフ・ハイドン","ヴォルフガング・アマデウス・モーツァルト","フランツ・シューベルト"],"a":0,"e":"ベートーヴェンはウィーン古典派からロマン派への橋渡しをした。聴覚の悪化に絶望して遺書を書いたが、芸術のために生き抜くと決意した。第9は1824年初演で、終楽章にシラーの詩『歓喜に寄す』を用いる。","r":"海外"},{"d":"音楽","q":"モーツァルトの『レクイエム』について正しいのはどれか。","o":["完成した楽譜を自ら指揮して、ウィーンの宮廷劇場で初演した直後に亡くなった","モーツァルトの死で未完となり、弟子のジュスマイヤーらが補筆して完成させた","ハイドンが書きかけた曲を、モーツァルトが補筆して完成させた","皇帝ヨーゼフ2世の依頼で作曲し、宮廷礼拝堂で初演された"],"a":1,"e":"1791年にモーツァルトが亡くなったとき、『レクイエム』は途中までだった。匿名の依頼者（ヴァルゼック伯爵）の注文で書かれ、弟子のジュスマイヤーらが完成させた。ヨーゼフ2世は1790年に没している。","r":"海外"},{"d":"音楽","q":"『平均律クラヴィーア曲集』を作曲し、のちに「音楽の父」と称されたバロック期の作曲家は誰か。","o":["ゲオルク・フリードリヒ・ヘンデル","アントニオ・ヴィヴァルディ","ゲオルク・フィリップ・テレマン","ヨハン・ゼバスティアン・バッハ"],"a":3,"e":"バッハは1685年生まれのドイツの作曲家。同じ年に生まれたヘンデルは『メサイア』、ヴィヴァルディは『四季』で知られる。『平均律』は全24の調で前奏曲とフーガを並べる。","r":"海外"},{"d":"文学","q":"平安中期、一条天皇の中宮彰子に仕えた女房が、光源氏の生涯と子の世代の物語を描いた長編物語で、世界最古級の長編小説とも評される作品は何か。","o":["『枕草子』","『源氏物語』","『和泉式部日記』","『竹取物語』"],"a":1,"e":"『源氏物語』の作者は紫式部。『枕草子』は中宮定子に仕えた清少納言の随筆、『更級日記』は菅原孝標女の日記、『竹取物語』は作者不詳の物語で、いずれも別の作品。","r":"海外"},{"d":"文学","q":"1849年に政治サークルへの参加で逮捕され、銃殺刑の直前に皇帝の特赦で減刑されて流刑となった。のちに『罪と罰』『カラマーゾフの兄弟』を著したロシアの作家は誰か。","o":["レフ・トルストイ","アントン・チェーホフ","イワン・セルゲーエヴィチ・ツルゲーネフ","フョードル・ドストエフスキー"],"a":3,"e":"ペトラシェフスキー事件で死刑を宣告され、刑場で減刑を告げられたのがドストエフスキー。『罪と罰』は1866年。トルストイは『戦争と平和』『アンナ・カレーニナ』、チェーホフは戯曲『桜の園』で知られる。","r":"海外"},{"d":"文学","q":"シェイクスピアの四大悲劇に含まれない作品はどれか。","o":["『ロミオとジュリエット』","『ハムレット（デンマーク王子の復讐劇）』","『リア王』","『マクベス』"],"a":0,"e":"四大悲劇は『ハムレット』『オセロー』『リア王』『マクベス』。『ロミオとジュリエット』も悲劇だが初期の作品で、四大悲劇には数えない。","r":"海外"},{"d":"地政学","q":"海洋国家が制海権を握ることが国の盛衰を左右すると論じ、『海上権力史論』（1890）を著したアメリカ海軍の軍人・歴史家は誰か。","o":["ハルフォード・ジョン・マッキンダー","アルフレッド・セイヤー・マハン","ニコラス・スパイクマン","カール・ハウスホーファー"],"a":1,"e":"マハンはシーパワー論の祖。マッキンダーは英国の地理学者でハートランド説、スパイクマンはアメリカの学者でリムランド説、ハウスホーファーはドイツの地政学者。","r":"海外"},{"d":"地政学","q":"マッキンダーが1919年の著作で、世界の中枢（ハートランド）とみなした地域はどこか。","o":["北大西洋に面した西ヨーロッパの沿岸部","インド洋沿岸の島嶼部","ユーラシア大陸の内陸部","北アメリカ大陸の中西部"],"a":2,"e":"「東欧を支配する者はハートランドを制し、ハートランドを支配する者は世界島を制し、世界島を支配する者は世界を制する」と述べた。ランドパワーの拠点をユーラシア内陸に置く見方である。","r":"海外"},{"d":"地理","q":"ケッペンの気候区分が、気候を分ける境界を決めるときに最も重視した自然の指標は何か。","o":["土壌の種類（肥沃かどうか）","標高","海流の向き","植生（植物の分布）"],"a":3,"e":"ドイツの気候学者ケッペンは、気温と降水量のデータで植生の分布に対応する境界を引き、熱帯・乾燥帯・温帯・冷帯・寒帯に分けた。","r":"海外"},{"d":"地理","q":"日本列島付近で接している4つのプレートの組み合わせとして正しいのはどれか。","o":["北アメリカ・南アメリカ・太平洋・フィリピン海","北アメリカ・ユーラシア・太平洋・ナスカ","ユーラシア・太平洋・インド・オーストラリア","北アメリカ・ユーラシア・太平洋・フィリピン海"],"a":3,"e":"日本は4つのプレートが集まる世界でも珍しい地域で、地震や火山活動が多い。ナスカプレートは南アメリカ大陸の西側にある。","r":"日本"},{"d":"文法学","q":"中世ヨーロッパの大学教育の基礎とされた自由七科のうち、「三学」に含まれる組み合わせはどれか。","o":["文法学・論理学・天文学","文法学・修辞学・論理学","修辞学・幾何学・天文学","論理学・算術・天文学"],"a":1,"e":"三学は言葉を扱う文法学・修辞学・論理学。四科は数に関わる算術・幾何・音楽・天文で、あわせて自由七科になる。","r":"海外"},{"d":"文法学","q":"「故郷が思い出される。」の「れる」と同じ意味にあたるものはどれか。","o":["受身（他から動作を受ける）","可能（できる）","自発（自然とそうなる）","尊敬（相手を高める）"],"a":2,"e":"「思い出される」は思い出そうとしなくても自然と浮かぶ意味で、自発。自発は「案じられる」「偲ばれる」のように心の動きを表す動詞につくことが多い。","r":"日本"},{"d":"修辞学","q":"アリストテレスが『弁論術』で挙げた説得の三要素のうち、「話し手の人柄や信頼性」にあたるものはどれか。","o":["パトス","ロゴス","カイロス","エートス"],"a":3,"e":"三要素は、話し手の信頼性のエートス、聞き手の感情に訴えるパトス、論理のロゴス。カイロスは「好機・時宜」を表す別の概念で、三要素には入らない。","r":"海外"},{"d":"修辞学","q":"「君は僕の太陽だ」のように、「ようだ」「ごとし」を使わずに他のものにたとえる修辞技法はどれか。","o":["隠喩（暗喩）","直喩（「ようだ」を用いる）","換喩","擬人法"],"a":0,"e":"「ようだ」などを使うのが直喩、使わないのが隠喩。換喩は「漱石を読む」のように関係の深いもので言い換え、擬人法は人でないものを人のように表す。","r":"海外"},{"d":"論理学","q":"「雨が降れば道が濡れる。道が濡れている。ゆえに雨が降った」という推論の誤りを何と呼ぶか。","o":["前件否定の誤謬","後件肯定の誤謬","循環論法","論点先取"],"a":1,"e":"道が濡れる原因は散水などほかにもあり、結論は必ずしも導けない。「AならばB」からBを確かめてAを結ぶ形が後件肯定。","r":"海外"},{"d":"論理学","q":"「AならばB」が真のとき、必ず真になる命題はどれか。","o":["「BならばA」","「AでないならばBでない」","「BでないならばAでない」","「AかつBでない」"],"a":2,"e":"元の命題の対偶は、必ず真偽が一致する。「BならばA」は逆、「AでないならばBでない」は裏で、真偽は一致しない。","r":"海外"},{"d":"天文学","q":"1610年に自作の望遠鏡で木星を観測し、のちに「ガリレオ衛星」と呼ばれる4つの衛星を見つけて、地動説を支持する証拠の一つとしたのは誰か。","o":["ヨハネス・ケプラー","ティコ・ブラーエ","ニコラウス・コペルニクス","ガリレオ・ガリレイ"],"a":3,"e":"ガリレオは『星界の報告』（1610）で木星の衛星や月の山を報告した。1633年の宗教裁判で地動説を撤回させられ、「それでも地球は動く」は後世の伝説とされる。","r":"海外"},{"d":"天文学","q":"ケプラーの第3法則が述べる関係はどれか。","o":["惑星の公転周期の2乗は、軌道の長半径の3乗に比例する","惑星と太陽を結ぶ線分が、同じ時間に描く面積は等しい（面積速度が一定）","惑星は太陽を1つの焦点とする楕円軌道を描く","惑星の公転周期は、太陽からの平均距離に比例する"],"a":0,"e":"第3法則は調和の法則。面積速度が一定なのは第2法則、楕円軌道は第1法則。周期は距離に比例せず、距離の1.5乗に比例する。","r":"海外"},{"d":"人文学","q":"ソクラテスが「無知の知」にたどり着く契機になったとされる出来事はどれか。","o":["ペルシア戦争に従軍して捕虜になったこと","デルフォイの神託で「ソクラテスより賢い者はいない」と告げられたこと","弟子プラトンが開いた学園アカデメイアの初代学頭を引き受けるよう求められたこと","アテナイの民会で追放の判決を受けたこと"],"a":1,"e":"『ソクラテスの弁明』によれば、神託の真意を確かめるため賢者とされる人々を訪ねて対話し、彼らも自分も実は知らないが、自分はそれを自覚している点で少し賢いと考えた。前399年に毒杯を仰いで没した。","r":"海外"},{"d":"人文学","q":"カントが『純粋理性批判』で、認識は対象に従うのではなく対象が認識に従うと考え直したことを、何にたとえたか。","o":["ガリレオ的な実験による検証","ニュートン的総合","コペルニクス的転回","ダーウィン的進化"],"a":2,"e":"地球が太陽の周りを回るという見方の転換になぞらえたもの。認識の側にある枠組みが、経験される対象のあり方を形づくると考えた。","r":"海外"},{"d":"社会科学","q":"フランスの社会学者デュルケームが『自殺論』（1897）で示した考え方として最も適切なのはどれか。","o":["自殺は精神疾患だけで説明でき、国や時代による自殺率の違いは統計の誤差にすぎず、宗教や家族構成も影響しない","自殺率は景気の動向だけで決まり、宗教や家族とは無関係である","自殺は遺伝で決まるため、国や地域による差はほとんどない","自殺率は個人の心理だけでなく、社会の統合や規制の度合いという社会的事実で説明できる"],"a":3,"e":"各国の統計を比べ、宗教や家族構成などで自殺率が違うことから、個人の外にある社会的事実が行動を左右すると論じた。社会学を実証的な学問にした例とされる。","r":"海外"},{"d":"社会科学","q":"アダム・スミスが『国富論』（1776）で、各人が自分の利益を追うことが結果として社会全体の利益につながる働きを、何にたとえたか。","o":["見えざる手","夜警国家（国家は治安と防衛に徹すべきとする考え）","比較優位","有効需要"],"a":0,"e":"市場では見えざる手に導かれて資源が配分されると述べた。夜警国家はラッサール、比較優位はリカード、有効需要はケインズの用語。","r":"海外"},{"d":"自然科学","q":"1831年から約5年間、ビーグル号に乗って各地の生物を観察し、のちに『種の起源』（1859）で自然選択による進化を論じたのは誰か。","o":["アルフレッド・ラッセル・ウォレス","グレゴール・メンデル","チャールズ・ダーウィン","ジャン＝バティスト・ラマルク"],"a":2,"e":"ウォレスも同じ時期に自然選択の考えに至り、共同発表につながったが、ビーグル号には乗っていない。メンデルは遺伝の法則、ラマルクは用不用説で知られる。","r":"海外"},{"d":"自然科学","q":"1869年に元素を原子量の順に並べると性質が周期的に現れることを示し、未発見の元素の存在と性質を予言したロシアの化学者は誰か。","o":["アントワーヌ・ラボアジエ","ドミトリ・メンデレーエフ","ジョン・ドルトン","マリ・キュリー"],"a":1,"e":"のちにガリウム（1875）、スカンジウム（1879）、ゲルマニウム（1886）が見つかり、予言が裏づけられて周期表の評価が高まった。","r":"海外"},{"d":"心理学","q":"1960年代初めにイェール大学でミルグラムが行った実験で、多くの参加者が実験者の指示に従って他者に強い電気ショックを与え続けたことから、示されたとされる傾向はどれか。","o":["傍観者効果","多数派への同調","確証バイアス","権威への服従"],"a":3,"e":"最も基本的な条件で、参加者の約3分の2が最大の450ボルトまで続けた。ただし実際には電気は流れず、被害者役は演技だった。同調はアッシュの実験、傍観者効果はラタネとダーリーの研究。","r":"海外"},{"d":"心理学","q":"ローゼンタールらが1960年代に小学校で行った実験で示された、教師の期待が児童の成績を実際に押し上げる現象は何と呼ばれるか。","o":["ハロー効果（後光効果）","ピグマリオン効果","ゴーレム効果","プラセボ効果"],"a":1,"e":"ギリシア神話の王ピグマリオンにちなむ名。期待が悪い方向に働いて成績が下がる現象はゴーレム効果、一部の特徴で全体を評価するのがハロー効果。","r":"海外"},{"d":"芸術","q":"ポスト印象派の画家で、『ひまわり』『星月夜』を描き、南仏アルルでの共同生活の末に自分の耳を切り落とした逸話がある。生前に売れた作品は少なかったとされる画家は誰か。","o":["フィンセント・ファン・ゴッホ","ポール・セザンヌ","クロード・モネ","ピエール＝オーギュスト・ルノワール"],"a":0,"e":"1888年、アルルでゴーギャンと暮らしたが口論の末に耳を切る事件を起こした。セザンヌはポスト印象派でも別の画家、モネとルノワールは印象派。","r":"海外"},{"d":"芸術","q":"ルネサンス盛期の芸術家・科学者で、『モナ・リザ』とミラノの修道院の食堂の壁画『最後の晩餐』で知られ、人体解剖や飛行機械の手稿も多く残したのは誰か。","o":["ミケランジェロ・ブオナローティ","ラファエロ・サンティ","サンドロ・ボッティチェッリ","レオナルド・ダ・ヴィンチ"],"a":3,"e":"ミケランジェロはシスティーナ礼拝堂の天井画、ラファエロは『アテナイの学堂』、ボッティチェッリは『ヴィーナスの誕生』で知られる。","r":"海外"},{"d":"芸術","q":"19世紀後半のヨーロッパで、浮世絵などの日本美術が画家たちに影響を与えた流行や潮流を何と呼ぶか。","o":["オリエンタリズム","ダダイズム","ジャポニスム","ロマン主義"],"a":2,"e":"ゴッホやモネ、ドビュッシーらが浮世絵などに刺激を受けた。ドビュッシーの『海』の初版楽譜の表紙には北斎の波が使われたと伝わる。","r":"海外"}]};
</script>
<script>
(function(){
'use strict';
var D = window.LA_DATA;
if(!D){ document.getElementById('app').innerHTML = '<p style="padding:40px;text-align:center;color:#667085">リベラルアーツは準備中です。</p>'; return; }
var ERA_ORDER = ['バロック','古典派','ロマン派','国民楽派','後期ロマン派','印象派','近現代'];
var ERA_COLOR = {'近世邦楽':'var(--c-baroque)','洋楽の受容':'var(--c-classical)','昭和の創造':'var(--c-romantic)','現代':'var(--c-modern)','バロック':'var(--c-baroque)','古典派':'var(--c-classical)','ロマン派':'var(--c-romantic)','国民楽派':'var(--c-national)','後期ロマン派':'var(--c-late)','印象派':'var(--c-impress)','近現代':'var(--c-modern)'};
var KIND_LABEL = {person:'人物',inst:'楽器',work:'作品',term:'用語',place:'地名',event:'出来事'};
var KIND_COLOR = {person:'var(--k-person)',inst:'var(--k-inst)',work:'var(--k-work)',term:'var(--k-term)',place:'var(--k-place)',event:'var(--k-event)'};
var ST = load();
var FAMS = ['弦楽器','鍵盤楽器','木管楽器','金管楽器','打楽器'];
var S = {domain:'music', region:'海外', tab:'explore', view:'people', isel:null, sel:null, word:null, q:null, qmode:'all', qOnly:null};

function load(){ try{ var v = JSON.parse(localStorage.getItem('lah:v1')||'null'); if(v && v.seen) return v; }catch(e){} return {seen:{}, quiz:{asked:0,right:0}}; }
function save(){ try{ localStorage.setItem('lah:v1', JSON.stringify(ST)); }catch(e){} }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function el(id){ return document.getElementById(id); }

/* ---------- データの整形 ---------- */
var M = D.music;
var ALLP = M.people.map(function(p){ p.region = p.region||'海外'; return p; });
var ALLI = (M.instruments||[]).map(function(x){ x.region = x.region||'海外'; return x; });
var byName = {}, byId = {}, gloss = {}, inv = {}, iById = {}, iByName = {};
ALLP.forEach(function(p){ byName[p.name]=p; byId[p.id]=p; });
ALLI.forEach(function(x){ iById[x.id]=x; iByName[x.name]=x; });
M.glossary.forEach(function(g){ gloss[g.t]=g; });
ALLP.forEach(function(p){ (p.related||[]).forEach(function(w){ (inv[w]=inv[w]||[]).push(p.id); }); });
ALLI.forEach(function(x){ (x.related||[]).forEach(function(w){ (inv[w]=inv[w]||[]).push(x.id); }); });
/* 作曲家 ⇄ 楽器 */
var pInst = {}, iComp = {};
ALLI.forEach(function(x){ (x.composers||[]).forEach(function(n){ var p = byName[n]; if(!p) return; (pInst[p.id]=pInst[p.id]||[]).push(x.id); (iComp[x.id]=iComp[x.id]||[]).push(p.id); }); });
/* 選んでいる地域（海外／日本）の人物と楽器 */
var people = [], INST = [];
function setRegion(r){
  S.region = r;
  people = ALLP.filter(function(p){return p.region===r;}).sort(function(a,b){ return a.born-b.born || (a.died||9999)-(b.died||9999); });
  INST = ALLI.filter(function(x){return x.region===r;});
}
function eraOrder(){ return S.region==='日本' ? ['近世邦楽','洋楽の受容','昭和の創造','現代'] : ERA_ORDER; }
function lifeText(p){ return p.died ? p.born+'〜'+p.died+'年' : p.born+'年生まれ'; }
function life(p){ return p.died ? p.born+'〜'+p.died : p.born+'〜'; }
/* 作曲家どうしのつながり: 逸話や一言に名前が出てくる、または同じ年の生まれ */
var ties = {};
function addTie(a,b,why){ (ties[a]=ties[a]||{})[b]=ties[a][b]||why; (ties[b]=ties[b]||{})[a]=ties[b][a]||why; }
ALLP.forEach(function(p){
  var text = (p.tagline||'')+' '+(p.anecdotes||[]).join(' ')+' '+(p.works||[]).map(function(w){return w.n||'';}).join(' ');
  ALLP.forEach(function(q){
    if(q.id===p.id) return;
    var nm = [q.name].concat(q.full?[q.full]:[]);
    if(nm.some(function(n){return text.indexOf(n)!==-1;})) { addTie(p.id,q.id,'逸話などに登場'); }
    else if(q.born===p.born) addTie(p.id,q.id,'同じ'+p.born+'年生まれ');
  });
});

/* ---------- 図とイメージ（楽器の簡略図・楽譜・肖像代わりのモノグラム） ---------- */
var INK = 'var(--ink)', WOOD = '#B5733A', WOOD2 = '#7A4A22', BRASS = '#C9A227', DARK = '#2B2118', PAPER = 'var(--paper)';
function ln(x1,y1,x2,y2,w,c){ return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||DARK)+'" stroke-width="'+(w||1)+'" stroke-linecap="round"/>'; }
function rc(x,y,w,h,f,r,st){ return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+(r||0)+'" fill="'+f+'"'+(st?' stroke="'+st+'" stroke-width="1"':'')+'/>'; }
function ci(x,y,r,f,st){ return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+f+'"'+(st?' stroke="'+st+'" stroke-width="1"':'')+'/>'; }

function staffSvg(m){

    var L = nt.p.charAt(0), oc = +nt.p.charAt(nt.p.length-1), acc = nt.p.length>2 ? nt.p.charAt(1) : '';
    var step = (oc-4)*7 + STEP[L] - STEP.E, y = bottom - step*gap/2, x = 26 + k*38;
    if(step<=-2) for(var q=-2;q>=step;q-=2) s += ln(x-9,bottom-q*gap/2,x+9,bottom-q*gap/2,0.9,'var(--muted)');
    if(step>=10) for(q=10;q<=step;q+=2) s += ln(x-9,bottom-q*gap/2,x+9,bottom-q*gap/2,0.9,'var(--muted)');
    var hollow = nt.d==='h';
    s += '<ellipse cx="'+x+'" cy="'+y+'" rx="5.4" ry="3.9" transform="rotate(-18 '+x+' '+y+')" fill="'+(hollow?'none':'var(--ink)')+'" stroke="var(--ink)" stroke-width="1.3"/>';
    var up = step<4;
    s += ln(up?x+5:x-5, y, up?x+5:x-5, up?y-24:y+24, 1.2, 'var(--ink)');
    if(nt.d==='e') s += pa('M'+(up?x+5:x-5)+' '+(up?y-24:y+24)+' q8 6 4 14','none','var(--ink)',1.2);
    if(acc) s += '<text x="'+(x-15)+'" y="'+(y+4)+'" font-size="12" fill="var(--ink)">'+(acc==='b'?'♭':acc==='#'?'♯':'♮')+'</text>';

}

  if(tl.length) h += '<div class="sec">つながる作曲家</div><div class="rel">'+tl.map(function(x){ return '<button class="rchip" style="--kc:'+KIND_COLOR.person+'" data-go="'+x.id+'" title="'+esc(ties[p.id][x.id])+'">'+esc(x.name)+'<span class="hint" style="font-size:10.5px">'+esc(ties[p.id][x.id])+'</span></button>'; }).join('')+'</div>';
  var pi = pInst[p.id]||[];
  if(pi.length) h += '<div class="sec">ゆかりの楽器</div><div class="rel">'+pi.map(function(id){ var x = iById[id]; return '<button class="rchip" style="--kc:'+KIND_COLOR.inst+'" data-gi="'+x.id+'">'+esc(x.name)+'</button>'; }).join('')+'</div>';
  h += '<div class="sec">関連する言葉（タップで意味と、つながる人物）</div><div class="rel">'+(p.related||[]).map(function(w){
    var k = kindOf(w); return '<button class="rchip'+(S.word===w?' on':'')+'" style="--kc:'+KIND_COLOR[k]+'" data-w="'+esc(w)+'">'+esc(w)+'</button>';
  }).join('')+'</div>';
  h += '<div class="legend">'+Object.keys(KIND_LABEL).map(function(k){ return '<span><i style="background:'+KIND_COLOR[k]+'"></i>'+KIND_LABEL[k]+'</span>'; }).join('')+'</div>';
  h += '<div id="word"></div>';
  h += '<div class="btnrow"><button class="btn pri" id="qthis">この人物でクイズ</button></div>';
  c.innerHTML = h;
  c.querySelectorAll('[data-w]').forEach(function(b){ b.onclick=function(){ openWord(b.dataset.w); }; });
  c.querySelectorAll('.rel > [data-go]').forEach(function(b){ b.onclick=function(){ pick(b.dataset.go, true); }; });
  c.querySelectorAll('[data-gi]').forEach(function(b){ b.onclick=function(){ pickInst(b.dataset.gi); }; });
  el('qthis').onclick=function(){ S.tab='quiz'; S.qOnly=p.id; S.q=null; render(); };
  if(S.word) openWord(S.word, true);
}
function openWord(w, keep){
  if(!keep && byName[w] && !(S.view==='people' && byName[w].id===S.sel)){ showPerson(byName[w].id, true); return; }
  if(!keep && iByName[w] && !(S.view==='inst' && iByName[w].id===S.isel)){ showInst(iByName[w].id, true); return; }
  S.word = w;
  var c = el('card'); c.querySelectorAll('.rchip').forEach(function(b){ b.classList.toggle('on', b.dataset.w===w); });
  var cur = S.view==='inst' ? S.isel : S.sel;
  var g = gloss[w], k = kindOf(w), ps = (inv[w]||[]).map(function(id){return byId[id]||iById[id];}).filter(function(x){return x && x.id!==cur;});
  var own = byName[w] || iByName[w];
  var h = '<div class="word" style="--kc:'+KIND_COLOR[k]+'"><h4>'+esc(w)+' <span class="hint">'+KIND_LABEL[k]+(g&&g.en?' ・ '+esc(g.en):'')+'</span></h4>';
  if(g) h += '<p>'+esc(g.d)+'</p>';
  else if(own) h += '<p>'+esc(own.tagline)+'</p>';
  else h += '<p class="hint">この言葉の解説は準備中です。</p>';
  if(ps.length) h += '<p class="hint">この言葉でつながる人物</p><div class="rel">'+ps.map(function(x){ var isI = !!iById[x.id]; return '<button class="rchip" style="--kc:'+(isI?KIND_COLOR.inst:KIND_COLOR.person)+'" data-go="'+x.id+'">'+esc(x.name)+'</button>'; }).join('')+'</div>';
  h += '</div>';
  el('word').innerHTML = h;
  el('word').querySelectorAll('[data-go]').forEach(function(b){ b.onclick=function(){ if(iById[b.dataset.go]) showInst(b.dataset.go, true); else showPerson(b.dataset.go, true); }; });
}

/* ---------- クイズ ---------- */
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function sample(a,n){ return shuffle(a).slice(0,n); }
function maskName(text, p){
  var names = [p.name, p.full||''].filter(Boolean);
  if(p.full){ var parts = p.full.split(/[・･]/); names.push(parts[parts.length-1]); }
  names.sort(function(a,b){return b.length-a.length;});
  var t = text; names.forEach(function(n){ if(n) t = t.split(n).join('この作曲家'); });
  return t;
}
function nearPeople(p, n){
  var others = people.filter(function(x){return x.id!==p.id;});
  var near = others.slice().sort(function(a,b){ return Math.abs(a.born-p.born)-Math.abs(b.born-p.born); }).slice(0,8);
  return sample(near, n);
}
function makeCardQ(p){
  var kinds = [];
  if((p.anecdotes||[]).length) kinds.push('anec');
  if((p.works||[]).length>=2) kinds.push('works');
  kinds.push('era');
  var onlyWords = (p.related||[]).filter(function(w){ return (inv[w]||[]).length===1 && !byName[w]; });
  if(onlyWords.length) kinds.push('word');
  var k = kinds[Math.floor(Math.random()*kinds.length)];
  var ds = nearPeople(p,3), q, opts;
  var sum = p.name+'（'+lifeText(p)+'・'+p.era+'）'+p.tagline;
  if(k==='anec'){
    var a = p.anecdotes[Math.floor(Math.random()*p.anecdotes.length)];
    q = '次の逸話に当てはまる作曲家はだれか。\n「'+maskName(a,p)+'」';
  } else if(k==='works'){
    var ws = sample(p.works,Math.min(3,p.works.length)).map(function(w){return '『'+w.t+'』';}).join('、');
    q = ws+'を作曲した人物はだれか。';
  } else if(k==='word'){
    var w = onlyWords[Math.floor(Math.random()*onlyWords.length)];
    q = '「'+w+'」と最も深く関わる作曲家はだれか。';
  } else {
    var eras = [p.era].concat(sample(eraOrder().filter(function(e){return e!==p.era;}),3));
    opts = shuffle(eras);
    return {q:p.name+'（'+lifeText(p)+'）が属する時代区分はどれか。', o:opts, a:opts.indexOf(p.era), e:sum, pid:p.id, d:'音楽'};
  }
  opts = shuffle([p.name].concat(ds.map(function(x){return x.name;})));
  return {q:q, o:opts, a:opts.indexOf(p.name), e:sum, pid:p.id, d:'音楽'};
}
function pool(d){
  var items = (D.sample||[]).filter(function(x){return x.d===d.ja && (x.r||'海外')===S.region;});
  return items;
}
function makeInstQ(x){
  var others = INST.filter(function(y){return y.id!==x.id;});
  var same = others.filter(function(y){return y.family===x.family;});
  var ds = sample(same.length>=3 ? same : others, 3);
  var mask = function(t){ var r = t; [x.name, x.full||''].filter(Boolean).sort(function(a,b){return b.length-a.length;}).forEach(function(n){ r = r.split(n).join('この楽器'); }); return r; };
  var kinds = []; if((x.anecdotes||[]).length) kinds.push('a'); kinds.push('t'); if((x.famous||[]).length) kinds.push('f');
  var k = kinds[Math.floor(Math.random()*kinds.length)], q;
  if(k==='a') q = '次の逸話に当てはまる楽器はどれか。\n「'+mask(x.anecdotes[Math.floor(Math.random()*x.anecdotes.length)])+'」';
  else if(k==='f' && x.famous.some(function(f){return f.t.indexOf(x.name)===-1;})){ var fs = x.famous.filter(function(f){return f.t.indexOf(x.name)===-1;}), f = fs[Math.floor(Math.random()*fs.length)]; q = '「'+mask(f.t)+'」と結びつく楽器はどれか。\n'+mask(f.n||''); }
  else q = '次の説明にあてはまる楽器はどれか。\n'+mask(x.tagline);
  var opts = shuffle([x.name].concat(ds.map(function(y){return y.name;})));
  return {q:q, o:opts, a:opts.indexOf(x.name), e:x.name+'（'+(x.when||'')+'・'+x.family+'）'+x.tagline, iid:x.id, d:'音楽'};
}
function nextQ(d){
  var staticQs = pool(d), gen = null;
  if(d.id==='music'){
    if(S.qOnly){ gen = S.qOnly.indexOf('i:')===0 ? makeInstQ(iById[S.qOnly.slice(2)]) : makeCardQ(byId[S.qOnly]); }
    else if(S.qmode!=='sample'){ gen = (INST.length && Math.random()<0.25) ? makeInstQ(INST[Math.floor(Math.random()*INST.length)]) : makeCardQ(people[Math.floor(Math.random()*people.length)]); }
  }
  var useStatic = staticQs.length && (S.qmode==='sample' || (!gen) || (S.qmode==='all' && Math.random()<0.25));
  if(useStatic && !(d.id==='music' && S.qOnly)){
    var it = staticQs[Math.floor(Math.random()*staticQs.length)];
    var o = it.o.slice(), correct = o[it.a], order = shuffle(o.map(function(_,i){return i;}));
    return {q:it.q, o:order.map(function(i){return o[i];}), a:order.indexOf(it.a), e:it.e, d:it.d, st:1};
  }
  return gen;
}
function renderQuiz(d){
  var m = el('main'), mus = d.id==='music';
  if((!mus || !people.length) && !pool(d).length){ m.innerHTML='<div class="panel empty"><b>'+esc(d.ja)+'（'+esc(S.region)+'）</b> のクイズは準備中です。</div>'; return; }
  if(!S.q) S.q = nextQ(d);
  var q = S.q;
  var h = '<div class="panel qbox"><div class="qmeta"><span>'+esc(d.ja)+(S.qOnly?' ・ '+esc((byId[S.qOnly]||iById[S.qOnly.slice(2)]||{name:''}).name)+' だけ':'')+' ・ これまで '+ST.quiz.right+'/'+ST.quiz.asked+' 問正解</span>';
  if(mus) h += '<span class="seg"><button data-m="all" class="'+(S.qmode==='all'&&!S.qOnly?'on':'')+'">ぜんぶ</button><button data-m="card" class="'+(S.qmode==='card'&&!S.qOnly?'on':'')+'">人物カードから</button><button data-m="sample" class="'+(S.qmode==='sample'&&!S.qOnly?'on':'')+'">用語・教養の問題</button></span>';
  h += '</div><div class="qq">'+esc(q.q).replace(/\n/g,'<br>')+'</div><div class="opts">'+q.o.map(function(o,i){ return '<button class="opt" data-i="'+i+'">'+esc(o)+'</button>'; }).join('')+'</div><div id="fb"></div></div>';
  m.innerHTML = h;
  m.querySelectorAll('[data-m]').forEach(function(b){ b.onclick=function(){ S.qmode=b.dataset.m; S.qOnly=null; S.q=null; renderQuiz(d); }; });
  m.querySelectorAll('.opt').forEach(function(b){ b.onclick=function(){ answer(+b.dataset.i, d); }; });
}
function answer(i, d){
  var q = S.q, ok = i===q.a;
  ST.quiz.asked++; if(ok) ST.quiz.right++; save();
  el('main').querySelectorAll('.opt').forEach(function(b,k){ b.disabled=true; if(k===q.a) b.classList.add('ok'); else if(k===i) b.classList.add('ng'); });
  var h = '<div class="exp"><b>'+(ok?'正解':'不正解')+'</b>　'+esc(q.e)+'</div><div class="btnrow"><button class="btn pri" id="nx">次の問題</button>'+(q.pid?'<button class="btn" id="seec">この人物のカードを見る</button>':'')+(q.iid?'<button class="btn" id="seei">この楽器のカードを見る</button>':'')+'</div>';
  el('fb').innerHTML = h;
  el('nx').onclick=function(){ S.q=null; renderQuiz(d); };
  if(q.pid) el('seec').onclick=function(){ showPerson(q.pid); };
  if(q.iid) el('seei').onclick=function(){ showInst(q.iid); };
}

setRegion(S.region);
render();
})();
</script>
