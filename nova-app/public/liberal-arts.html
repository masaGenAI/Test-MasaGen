obedience","name":"ミルグラムの服従実験","full":"ミルグラムの服従実験（アイヒマン実験）","en":"Milgram obedience experiment","region":"海外","category":"実験・研究","when":"1961年〜1963年","where":"アメリカ（イェール大学）","era":"認知・現代","tagline":"権威の指示で、人はどこまで他人を傷つけるかを調べた実験","facts":[{"t":"設定","n":"「記憶の実験」と称し、参加者を教師役にして生徒役の誤答に電気ショックを与えさせた。"},{"t":"電圧と仕掛け","n":"電圧は15〜450ボルトの30段階。電気は実際には流れず、生徒役は俳優だった。"},{"t":"結果","n":"基本条件では、参加者の約65%が最大の450ボルトまで進んだ。"},{"t":"条件による差","n":"生徒が近い、権威者が不在などの条件では、服従は大きく減った。"}],"famous":[{"t":"白衣の実験者","n":"「続けてください」と指示する権威者の役。服従の引き金となった。"},{"t":"多くの変形版","n":"場所や距離、指示の出し方を変えた多数の条件で、服従の変化を調べた。"},{"t":"研究倫理の議論","n":"参加者に与えた心理的負担が論じられ、倫理指針が整う契機の一つになった。"}],"anecdotes":["実験の前、精神科医らは最大電圧まで進む人はごくわずかだろうと予想した。実際の結果はそれと大きく食い違った。","参加者は新聞広告などで募られ、1時間ほどの参加に4ドル50セントの謝礼が渡されたと伝わる。"],"trivia":[{"f":"服従実験の基本条件では、約65%の参加者が最大の450ボルトまで進んだ。事前の専門家の予想とは大きく食い違った。","q":"基本条件で最大電圧まで進んだ参加者の割合は、およそどれか。","a":"約65%","w":["約5%","約25%","約95%"]},{"f":"電気ショックを受ける「生徒役」は、実験に協力する俳優だった。電気は流れず、苦しむ様子は演技だった。","q":"服従実験の「生徒役」の正体はどれか。","a":"実験に協力する俳優","w":["別の実験に参加する学生","精神科の入院患者","実験者の家族"]},{"f":"イェール大学の権威の影響を調べるため、場所を近くの町ブリッジポートの事務所に移した条件でも、半数近くが最大電圧まで進んだ。","q":"イェール大学の権威を外すために実験場所を移した先は、どこの事務所か。","a":"ブリッジポート","w":["ボストン","ニューヨーク","フィラデルフィア"]}],"people":["ミルグラム"],"related":["アイヒマン裁判","イェール大学","ソロモン・アッシュ","同調（アッシュの実験）","スモールワールド実験","六次の隔たり"]},{"id":"asch","name":"同調（アッシュの実験）","full":"アッシュの同調実験（線分判断課題）","en":"Asch conformity experiments","region":"海外","category":"実験・研究","when":"1951年〜1956年","where":"アメリカ（スワースモア大学）","era":"認知・現代","tagline":"明らかな答えでも、多数派に合わせてしまう人は多い","facts":[{"t":"課題","n":"基準の線と同じ長さの線を、3本の比較線から選ぶ。正解は一目でわかる。"},{"t":"仕掛け","n":"参加者は一人で、周りの数名はサクラ。サクラは全員一致で誤答を言う。"},{"t":"結果","n":"全試行の約3分の1で、参加者は多数派の誤答に同調した。"},{"t":"味方の効果","n":"正解を言う仲間が一人いるだけで、同調は大きく減った。"}],"famous":[{"t":"線分判断課題","n":"誰が見ても正解が明らかな課題で、集団の圧力だけを取り出した。"},{"t":"統制条件","n":"サクラがいない場合、誤答はほとんど出なかった。"},{"t":"ミルグラムとの縁","n":"ミルグラムはアッシュのもとで学び、その研究に刺激を受けたとされる。"}],"anecdotes":["約4分の3の参加者が、十数回の試行のうち少なくとも一度は多数派の誤答に合わせたと報告される。","同調した参加者は、あとで「自分の見方に自信がなくなった」「目立ちたくなかった」などと語ったと報告される。"],"trivia":[{"f":"アッシュの実験では、正解を言う味方が一人いるだけで、多数派の誤答に合わせる人が大きく減った。","q":"アッシュの実験で、同調を大きく減らしたのはどれか。","a":"味方が一人正解を言うこと","w":["課題の線の本数を増やすこと","参加者に報酬を渡すこと","実験者が部屋に同席すること"]},{"f":"サクラのいない条件では、課題が簡単なため誤答は1%に満たなかった。同調が誤答を生んでいたことがわかる。","q":"サクラのいない条件での、参加者の誤答はどの程度だったか。","a":"ほとんどゼロ","w":["約10%程度","約25%程度","約40%程度"]},{"f":"アッシュの実験では、約4分の3の参加者が、少なくとも一度は多数派の誤答に合わせた。","q":"少なくとも一度は誤答に同調した参加者の割合として報告されるのはどれか。","a":"約4分の3","w":["約1割","約4分の1","ほぼ全員"]}],"people":["ミルグラム"],"related":["ソロモン・アッシュ","スワースモア大学","集団圧力","ミルグラムの服従実験","認知的不協和"]},{"id":"maslow_h","name":"マズローの欲求階層","full":"マズローの欲求階層説（欲求5段階説）","en":"Maslow's hierarchy of needs","region":"海外","category":"概念","when":"1943年〜1954年","where":"アメリカ","era":"認知・現代","tagline":"人の欲求を、生理から自己実現まで段階で整理した説","facts":[{"t":"五つの欲求","n":"生理的、安全、所属と愛、承認、自己実現の順に積み上がるとした。"},{"t":"欠乏と成長","n":"下位は不足を埋める欠乏欲求で、最上位は成長を求める欲求とされる。"},{"t":"順序の目安","n":"下位がある程度満たされると上位が現れる。厳密な順序ではないと述べた。"}],"famous":[{"t":"三角形の図","n":"後世に広まった五段の図。マズロー自身は描かなかったとされる。"},{"t":"経営学への影響","n":"X理論・Y理論や二要因理論など、動機づけ論の議論の土台となった。"}],"anecdotes":["欲求階層説は1943年の論文で発表され、1954年の『人間性の心理学』で広く知られた。","晩年のマズローは、自己実現のさらに上に「自己超越」を置くようになったとされる。"],"trivia":[{"f":"欲求階層説は1943年の論文で発表され、1954年の著書『人間性の心理学』で広まった。","q":"マズローが欲求階層説を最初に発表した年代はどれか。","a":"1940年代","w":["1920年代","1950年代","1960年代"]},{"f":"経営学では、マグレガーの「X理論・Y理論」が、マズローの欲求論の影響を受けているとされる。","q":"マズローの欲求論の影響を受けたとされる、経営学の人間観の理論はどれか。","a":"マグレガーのX理論・Y理論","w":["テイラーの科学的管理法の原則","ウェーバーの官僚制に関する理論","ファヨールの管理過程に関する理論"]}],"people":["マズロー"],"related":["自己実現","欠乏欲求と成長欲求","自己超越","至高体験","人間性心理学","二要因理論","X理論・Y理論","カール・ロジャーズ"]},{"id":"defense","name":"防衛機制","full":"防衛機制（自我の防衛）","en":"Defense mechanisms","region":"海外","category":"概念","when":"1894年〜1936年","where":"オーストリア・イギリス","era":"学派の時代","tagline":"不安や葛藤から心を守る、無意識のはたらき","facts":[{"t":"目的","n":"不安や葛藤から心を守るために、無意識のうちに働く心の仕組み。"},{"t":"主な種類","n":"抑圧、否認、投影、反動形成、合理化、昇華、退行、置き換えなど。"},{"t":"整理","n":"アンナ・フロイトが1936年の『自我と防衛機制』で整理した。"},{"t":"良し悪しではない","n":"誰もが使い、昇華のように適応的な形もある。"}],"famous":[{"t":"合理化","n":"手に入らないものを「どうせ酸っぱい」と思う、イソップの寓話の狐の例。"},{"t":"反動形成","n":"好きな相手にわざと冷たくする、本心と逆の態度。"},{"t":"昇華","n":"満たされない欲求を芸術やスポーツなどに向けること。"},{"t":"投影","n":"自分の受け入れがたい感情を、相手のものだと感じること。"}],"anecdotes":["防衛という語はフロイトが1894年の論文で使い始めた。それを整理したのは末娘のアンナ・フロイトで、1936年の著書による。","アンナは1938年に父とともにロンドンへ移り、のちに子どもの治療と研究のための施設を開いた。"],"trivia":[{"f":"「酸っぱいブドウ」の寓話は、防衛機制の「合理化」の例によく挙げられる。取れなかった実を、価値がないと思い込む。","q":"手に入らなかったものを「どうせ価値がない」と考えて納得する働きはどれか。","a":"合理化","w":["昇華","投影","反動形成"]},{"f":"防衛機制を整理した『自我と防衛機制』（1936年）を書いたのは、フロイトの末娘のアンナ・フロイトである。","q":"『自我と防衛機制』を著した人物は誰か。","a":"アンナ・フロイト","w":["メラニー・クライン","カレン・ホーナイ","アルフレッド・アドラー"]},{"f":"昇華は、満たされない欲求を芸術や学問、スポーツのような社会に認められる活動へ向ける働きで、成熟した型とされる。","q":"防衛機制のうち、成熟した型とされるのはどれか。","a":"昇華","w":["否認","投影","退行"]}],"people":["フロイト"],"related":["抑圧","否認","投影","合理化","反動形成","昇華","アンナ・フロイト"]},{"id":"pygmalion","name":"ピグマリオン効果","full":"ピグマリオン効果（教師期待効果）","en":"Pygmalion effect","region":"海外","category":"実験・研究","when":"1964年〜1968年","where":"アメリカ（小学校）","era":"認知・現代","tagline":"期待された人は、期待に沿って伸びやすいという現象","facts":[{"t":"内容","n":"他者から期待された人は、その期待に沿うように成果が上がりやすい現象。"},{"t":"実験","n":"1964年、ある小学校で、「今後伸びる」と担任に伝えた児童は無作為に選ばれていた。"},{"t":"結果","n":"約8か月後、特に低学年で、選ばれた児童の知能検査の得点が伸びたと報告された。"},{"t":"批判","n":"追試では結果が分かれ、効果が小さい場合も多いとされる。"}],"famous":[{"t":"『教室のピグマリオン』","n":"1968年にローゼンタールとジェイコブソンが出した、実験の報告書。"},{"t":"迷路に強いネズミ","n":"1963年、実験者に「賢いネズミ」と伝えると、成績が良くなったように見えた。"},{"t":"ゴーレム効果","n":"低い期待が成績を下げてしまう、逆の現象。"}],"anecdotes":["名は、自作の彫像に恋した王が、女神の力で像を人間にしたというギリシャ神話に由来する。この物語は後にミュージカル『マイ・フェア・レディ』の原作にもなった。","担任の期待は、声の調子や接し方などの無意識の態度を通じて児童に伝わったと説明された。"],"trivia":[{"f":"ピグマリオン効果の名は、ギリシャ神話で自作の像に恋した王に由来する。この物語は戯曲を経てミュージカル『マイ・フェア・レディ』にもなった。","q":"ピグマリオン効果の名のもとになった神話の主人公はどれか。","a":"自作の彫像に恋した王","w":["自分の影に恋した若者","人形に命を吹き込んだ職人","鏡に映る姿に見とれた若者"]},{"f":"児童は無作為に選ばれていたのに、担任が「伸びる」と期待した児童の得点が伸びた。期待が態度に表れたと説明された。","q":"ピグマリオン効果の実験で、「伸びる」と告げられた児童はどのように選ばれたか。","a":"無作為に選ばれた","w":["検査の成績が高い順に選ばれた","担任の推薦で選ばれた","家庭の希望で選ばれた"]},{"f":"ローゼンタールは1963年、学生の実験者に「迷路に強いネズミ」と伝えて走らせると、成績が良くなったと報告した。ネズミは無作為に分けられていた。","q":"このネズミの実験で、成績を左右したとされる要因はどれか。","a":"実験者の期待","w":["ネズミの品種の違い","餌の量の違い","迷路の広さの違い"]}],"people":[],"related":["ロバート・ローゼンタール","教室のピグマリオン","ゴーレム効果","ピグマリオン神話","マイ・フェア・レディ","認知バイアス"]},{"id":"bias","name":"認知バイアス","full":"認知バイアス（ヒューリスティックとバイアス）","en":"Cognitive biases","region":"海外","category":"概念","when":"1970年代〜","where":"アメリカ・イスラエル","era":"認知・現代","tagline":"判断を速くする近道が、決まった方向の誤りを生む","facts":[{"t":"偏りの源","n":"判断を速くする経験則（ヒューリスティック）が、一定の方向の誤りを生む。"},{"t":"1974年の論文","n":"トヴェルスキーとカーネマンが、三つのヒューリスティックで偏りを説明した。"},{"t":"主な例","n":"係留効果、確証バイアス、フレーミング効果、連言錯誤など。"},{"t":"対策","n":"偏りは知っても消えにくく、手順やチェックリストで補うのが有効とされる。"}],"famous":[{"t":"係留効果の実験","n":"10か65が出るルーレットを回した後、国連のアフリカ加盟国の割合を推定させた。"},{"t":"アジア病問題","n":"「200人助かる」か「400人死ぬ」かの言い方で、選択が逆転する。"},{"t":"リンダ問題","n":"「銀行員」より「活動家の銀行員」のほうが可能性が高いと答える誤り。"}],"anecdotes":["係留効果の実験では、ルーレットで10が出た群の推定は中央値で約25%、65が出た群は約45%だった。無関係な数字が答えを引き寄せた。","トヴェルスキーとカーネマンはヘブライ大学で出会い、1969年ごろから共同研究を始めたとされる。"],"trivia":[{"f":"係留効果の実験では、ルーレットの出た数字を見せたあとに、国連に加盟するアフリカ諸国の割合を推定させた。","q":"係留効果の実験で、参加者が推定した対象はどれか。","a":"国連に加盟するアフリカ諸国の割合","w":["世界の人口に占める都市部の割合","ルーレットの目盛りの総数と範囲","国連本部のあるニューヨークの人口"]},{"f":"同じ内容でも、「200人が助かる」と言うか「400人が亡くなる」と言うかで、人々の選択は逆転する。","q":"言い方の違いで選択が逆転する、この現象は何と呼ばれるか。","a":"フレーミング効果","w":["確証バイアス効果","係留と調整の効果","後知恵バイアス"]},{"f":"リンダ問題では、「銀行員」より「活動家でもある銀行員」のほうが可能性が高いと答える人が多い。全体は部分より小さくなりえない。","q":"リンダ問題で示される、この誤りは何と呼ばれるか。","a":"連言錯誤","w":["確証バイアス","後知恵バイアス","基準率の無視"]}],"people":["カーネマン"],"related":["ヒューリスティック","係留効果","確証バイアス","フレーミング効果","連言錯誤","アジア病問題","ヘブライ大学","行動経済学"]},{"id":"amae","name":"甘え","full":"甘え（土居健郎の概念）","en":"Amae","region":"日本","category":"概念","when":"1971年（『「甘え」の構造』）","where":"日本","era":"戦後の展開","tagline":"相手の好意を当てにして頼る心を、日本人の理解の鍵にした概念","facts":[{"t":"意味","n":"相手の好意を当てにして頼り、受け入れてもらいたいと願う心の動き。"},{"t":"原型","n":"乳児が母親に求める結びつきを、土居は甘えの原型とみた。"},{"t":"日本語の手がかり","n":"すねる、ひがむ、ふてくされるなど、甘えに関わる語が多いことに注目した。"},{"t":"普遍性","n":"感情は人類に共通で、それを表す語が日本語で発達したと論じた。"}],"famous":[{"t":"『「甘え」の構造』","n":"1971年に出た本。日本人論の古典として長く読まれた。"},{"t":"遠慮と気がね","n":"甘えたいのに控える気持ちを表す日本語の例。"},{"t":"英訳版","n":"1973年に『The Anatomy of Dependence』として刊行された。"}],"anecdotes":["『「甘え」の構造』は長く読まれ、累計で百万部を超えるとされる。専門家の書いた本としては異例の広がりだった。","土居の議論は日本人論の流行の中で広く受け入れられ、日本人だけの心理だとする受けとめ方も生んだ。"],"trivia":[{"f":"『「甘え」の構造』は長く読まれ、累計で百万部を超えるとされる。精神科医の本としては異例の売れ行きだった。","q":"『「甘え」の構造』の部数について伝わる話はどれか。","a":"百万部を超えた","w":["数千部にとどまった","1万部ほどだった","10万部ほどだった"]},{"f":"土居は、乳児が母親に求める気持ちを甘えの原型とみた。大人の甘えも、その延長にあると考えた。","q":"土居が「甘え」の原型とみたのはどれか。","a":"乳児が母親を求める気持ち","w":["弟子が師匠を慕い敬う気持ち","部下が上司に従う気持ち","隣人どうしが助け合う気持ち"]}],"people":["土居健郎"],"related":["甘えの構造","日本人論","遠慮と気がね","母子関係","精神分析"]},{"id":"sandplay","name":"箱庭療法","full":"箱庭療法（砂遊び療法）","en":"Sandplay therapy","region":"日本","category":"療法・応用","when":"1965年に日本へ導入","where":"イギリス・スイス・日本","era":"戦後の展開","tagline":"砂の箱にミニチュアを置いて、言葉にならない内面を表す療法","facts":[{"t":"方法","n":"砂の入った箱に、人や動物、建物のミニチュアを置いて世界を作る。"},{"t":"狙い","n":"言葉にしにくい内面を、置く行為と作品で表し、治療者が見守る。"},{"t":"起源","n":"英国のローエンフェルトの技法を、カルフがユング心理学と結びつけて発展させた。"},{"t":"日本での導入","n":"1965年に河合隼雄が紹介し、臨床の現場に広まった。"}],"famous":[{"t":"世界技法","n":"1929年に子どもの遊びの技法として始まった、箱庭の源流。"},{"t":"砂遊び療法","n":"カルフが、ユング心理学に基づく療法としてまとめた。"},{"t":"河合隼雄","n":"日本への導入と普及の中心となった臨床心理学者。"}],"anecdotes":["ローエンフェルトは、H・G・ウェルズの『床遊び』に着想を得て、子どもがおもちゃで世界を作る遊びを治療に使ったとされる。","標準の箱は縦57センチ、横72センチ、深さ7センチで、一目で全体を見渡せる大きさ。内側は青く塗られる。"],"trivia":[{"f":"箱庭療法の源流である世界技法は、H・G・ウェルズの『床遊び』に着想を得て、英国の医師ローエンフェルトが考案したとされる。","q":"世界技法を考案した人物は誰か。","a":"M・ローエンフェルト","w":["ドラ・マリア・カルフ","アンナ・フロイト","メラニー・クライン"]},{"f":"標準の箱は縦57センチ、横72センチ、深さ7センチで、内側の底と側面が青く塗られている。砂を掘ると水が現れたように見える。","q":"箱庭療法の標準の箱の内側が塗られる色はどれか。","a":"青","w":["白","緑","茶色"]},{"f":"「箱庭」という訳語は、日本に古くからあるミニチュアの庭を作る遊びを連想させ、河合隼雄が選んだとされる。","q":"「箱庭」という訳語が連想させる日本の遊びはどれか。","a":"ミニチュアの庭を作る遊び","w":["枯山水の石庭を鑑賞する習慣","盆栽を育てる趣味","茶室の庭を手入れする作法"]}],"people":["河合隼雄","ユング"],"related":["世界技法","マーガレット・ローエンフェルト","ドラ・カルフ","床遊び","ユング研究所","ユング派分析家","チューリッヒ"]},{"id":"morita_t","name":"森田療法","full":"森田療法（神経質に対する精神療法）","en":"Morita therapy","region":"日本","category":"療法・応用","when":"1919年ごろ","where":"日本（東京）","era":"導入期","tagline":"症状を消そうとせず、あるがままに受け入れて行動する療法","facts":[{"t":"考え方","n":"症状をなくそうとするほど注意が集まり悪化する、というとらわれの悪循環をみる。"},{"t":"あるがまま","n":"不安は不安のまま受け入れ、したいこと・すべきことに向かって行動する。"},{"t":"入院療法の四期","n":"絶対臥褥期、軽作業期、重作業期、生活訓練期の順に進む。"},{"t":"対象","n":"不安やとらわれが中心の神経症（森田のいう神経質）が主な対象とされた。"}],"famous":[{"t":"森田正馬","n":"1919年ごろ、自宅で入院療法を始めた創始者。"},{"t":"高良武久","n":"森田の弟子で、慈恵医大で森田療法を継承した精神科医。"},{"t":"建設的生き方","n":"米国のレイノルズが、森田療法と内観を取り入れて広めた生活の方法。"}],"anecdotes":["森田療法の入院では、回復するにつれて患者が家の仕事を手伝い、家族のように暮らしたとされる。","症状を受け入れて行動する点が、現代のマインドフルネスやACTと比べられることがある。"],"trivia":[{"f":"森田療法の入院は四つの時期に分かれ、最初に寝て過ごす臥褥期から、軽い作業、重い作業へと進む。","q":"森田療法の入院療法は、何期に分かれるか。","a":"4期","w":["2期","3期","6期"]},{"f":"森田療法の「あるがまま」は何もしないことではなく、不安を抱えたまま目の前のやるべきことに取り組む態度を指す。","q":"森田療法でいう「あるがまま」に最も近いのはどれか。","a":"不安のまま、すべきことをする","w":["不安が消えるまで安静にして待つ","不安の原因を一つずつ消していく","不安を意識せず別のことを考える"]},{"f":"森田のいう「神経質」は、日常語の「気にしやすい性格」とは少し異なり、向上心が強く完全を求める気質を指す。","q":"森田療法でいう「神経質」の特徴として説明されるのはどれか。","a":"生きる意欲や向上心が強い","w":["感情の起伏がほとんどない","他人への関心が極めて薄い","意志が弱く流されやすい"]}],"people":["森田正馬"],"related":["神経質","絶対臥褥","あるがまま","東京慈恵会医科大学","高良武久","呉秀三","内観療法"]},{"id":"naikan","name":"内観療法","full":"内観療法（内観法）","en":"Naikan therapy","region":"日本","category":"療法・応用","when":"1940年代〜","where":"日本（奈良県）","era":"戦後の展開","tagline":"身近な人との関わりを振り返り、自分を見つめ直す療法","facts":[{"t":"方法","n":"1週間ほど、屏風で仕切った静かな場所に座り、身近な人との関わりを振り返る。"},{"t":"三つの問い","n":"してもらったこと、して返したこと、迷惑をかけたことを、年代順に思い出す。"},{"t":"面接","n":"一定の間隔で面接者が訪れ、思い出した内容を聞く。"},{"t":"活用","n":"医療、矯正施設、教育の場などで使われてきた。"}],"famous":[{"t":"吉本伊信","n":"奈良県で内観の場を開き、広めた創始者。"},{"t":"身調べ","n":"浄土真宗の一派に伝わる修行法で、内観の源流とされる。"},{"t":"日本発の方法","n":"海外でもNaikanの名で紹介され、試みられている。"}],"anecdotes":["吉本伊信は、宗教色の濃い「身調べ」から宗教色を除き、誰でも行える形に整えたとされる。","内観は、多くの場合、まず母親に対する自分を振り返ることから始める。"],"trivia":[{"f":"内観は、はじめに母親に対して、してもらったこと・して返したこと・迷惑をかけたことを思い出すのが一般的である。","q":"内観で最初に振り返る相手として、一般的なのは誰か。","a":"母親","w":["上司","親友","配偶者"]},{"f":"内観の源流は、浄土真宗の一派に伝わる「身調べ」で、吉本伊信が宗教色を除いて広く使える形に整えたとされる。","q":"内観のもとになったとされる修行法はどれか。","a":"身調べ","w":["座禅の修行","写経の行","滝行の修行"]}],"people":[],"related":["吉本伊信","身調べ","森田療法","甘え","母子関係"]}],"glossary":[{"t":"実験心理学","kind":"term","d":"心の働きを実験と測定でとらえる心理学。ヴントが実験室を開いた1879年が出発点とされる。","en":"Experimental psychology"},{"t":"ライプツィヒ大学","kind":"place","d":"ドイツ東部の大学。ヴントが1879年に心理学実験室を開き、各国から留学生が集まった。","en":"Leipzig University"},{"t":"内観法","kind":"term","d":"訓練を受けた被験者が自分の意識の内容を観察して報告する方法。ヴントの実験で用いられた。","en":"Introspection"},{"t":"反応時間","kind":"term","d":"刺激を与えてから反応するまでの時間。ヴントの実験室で心の働きの速さを調べる指標とされた。","en":"Reaction time"},{"t":"感情の三次元説","kind":"term","d":"感情を快‐不快、興奮‐沈静、緊張‐弛緩の三つの軸で表すヴントの説。","en":"Tridimensional theory of feeling"},{"t":"民族心理学","kind":"term","d":"言語・神話・慣習など集団の産物から高次の心理を探る分野。ヴントが全10巻で体系化を試みた。","en":"Völkerpsychologie"},{"t":"構成主義","kind":"term","d":"意識を感覚などの要素に分けて分析する立場。ヴントの弟子ティチナーが米国で広めた。","en":"Structuralism"},{"t":"ティチナー","kind":"person","d":"ヴントに学んだ英国生まれの心理学者（1867〜1927）。米国のコーネル大学で構成主義を広めた。","en":"Edward Titchener"},{"t":"心理学原理","kind":"work","d":"ジェームズが12年かけて1890年に出した2巻本。意識の流れや情動を論じた心理学の古典。","en":"The Principles of Psychology"},{"t":"プラグマティズム","kind":"term","d":"考えの価値をその実際の結果で測る米国発の哲学。ジェームズが1907年の著書で広めた。","en":"Pragmatism"},{"t":"宗教的経験の諸相","kind":"work","d":"ジェームズが1902年に出した宗教心理学の古典。回心や神秘体験を個人の経験として分析した。","en":"The Varieties of Religious Experience"},{"t":"意識の流れ","kind":"term","d":"意識は部品の寄せ集めでなく、川のように連続して流れるとするジェームズの見方。","en":"Stream of consciousness"},{"t":"ジェームズ=ランゲ説","kind":"term","d":"身体の反応を感じ取ることが情動だとする説。ジェームズとデンマークのランゲが唱えた。","en":"James–Lange theory"},{"t":"ヘンリー・ジェームズ","kind":"person","d":"ウィリアムの弟で米国出身の小説家（1843〜1916）。『ある婦人の肖像』などで知られる。","en":"Henry James"},{"t":"ハーバード大学","kind":"place","d":"米国マサチューセッツ州の大学。ジェームズが長く教え、心理学の実演用の実験室を早くに設けた。","en":"Harvard University"},{"t":"夢判断","kind":"work","d":"フロイトが1900年の刊行年で出した本。夢を無意識の願望の表れとして解釈した。","en":"The Interpretation of Dreams"},{"t":"精神分析","kind":"term","d":"無意識の葛藤を自由連想などで探り、症状の理解と治療につなげるフロイトの理論と技法。","en":"Psychoanalysis"},{"t":"自由連想法","kind":"term","d":"頭に浮かぶことを選ばずに話してもらう技法。フロイトが無意識への道として用いた。","en":"Free association"},{"t":"エディプス・コンプレックス","kind":"term","d":"幼児が異性の親に向ける愛着と同性の親への敵意を指すフロイトの概念。名はギリシャ悲劇に由来する。","en":"Oedipus complex"},{"t":"自我・エス・超自我","kind":"term","d":"フロイトが後期に示した心の三領域。欲動のエス、現実に合わせる自我、良心にあたる超自我。","en":"Ego, id and superego"},{"t":"ウィーン","kind":"place","d":"オーストリアの首都。フロイトが長く開業し、精神分析が生まれた街として知られる。","en":"Vienna"},{"t":"ブロイアー","kind":"person","d":"ウィーンの医師（1842〜1925）。フロイトと『ヒステリー研究』（1895年）を共著した。","en":"Josef Breuer"},{"t":"集合的無意識","kind":"term","d":"個人を超えて人類に共通するとユングが考えた無意識の層。神話や夢に似た像が現れる根拠とされた。","en":"Collective unconscious"},{"t":"元型","kind":"term","d":"集合的無意識にあるとされる像の型。影、アニマ・アニムス、老賢者などがユングによって挙げられた。","en":"Archetype"},{"t":"内向と外向","kind":"term","d":"関心が自分の内面に向く型と外の世界に向く型。ユングが『心理学的類型』（1921年）で提案した。","en":"Introversion and extraversion"},{"t":"コンプレックス","kind":"term","d":"感情でむすばれた無意識の観念のまとまり。ユングが言語連想検査の研究から用いた。","en":"Complex"},{"t":"シンクロニシティ","kind":"term","d":"意味のある偶然の一致。ユングが因果とは別の原理として共時性と名づけた。","en":"Synchronicity"},{"t":"赤の書","kind":"work","d":"ユングが自らの幻視や夢を記した私的な書物。長く非公開で、2009年に刊行された。","en":"The Red Book"},{"t":"ボーリンゲンの塔","kind":"place","d":"ユングがチューリッヒ湖畔のボーリンゲンに建て、少しずつ増築した石造りの家。","en":"Bollingen Tower"},{"t":"ブルクヘルツリ病院","kind":"place","d":"チューリッヒの精神科病院。ユングがここで精神科医の経歴を始め、ブロイラーに師事した。","en":"Burghölzli"},{"t":"条件反射","kind":"term","d":"ある刺激との結びつきで、本来は関係のない刺激でも起こるようになった反応。パヴロフが研究した。","en":"Conditioned reflex"},{"t":"消化腺","kind":"term","d":"唾液や胃液を出す腺。パヴロフはその働きの研究で、1904年のノーベル賞を受けた。","en":"Digestive glands"},{"t":"ノーベル賞","kind":"event","d":"パヴロフは消化の生理学で1904年にノーベル生理学・医学賞を受けた。条件反射の研究が対象ではなかった。","en":"Nobel Prize"},{"t":"第二信号系","kind":"term","d":"パヴロフが考えた、言葉による刺激の系。人間では光や音などとは別の信号として働くとされる。","en":"Second signaling system"},{"t":"行動主義","kind":"term","d":"意識でなく、観察できる行動を研究対象にする立場。1913年のワトソンの論文が旗揚げとされる。","en":"Behaviorism"},{"t":"小アルバート実験","kind":"event","d":"ワトソンらが1920年に行った、乳児に白いネズミへの恐怖を条件づけた実験。倫理面でよく批判される。","en":"Little Albert experiment"},{"t":"ジョンズ・ホプキンス大学","kind":"place","d":"米国メリーランド州の研究大学。ワトソンが教授を務め、元良勇次郎も留学した。","en":"Johns Hopkins University"},{"t":"発生的認識論","kind":"term","d":"知識が子どもの発達のなかでどう生まれるかを調べる、ピアジェの理論。","en":"Genetic epistemology"},{"t":"認知発達段階","kind":"term","d":"ピアジェが示した、感覚運動期・前操作期・具体的操作期・形式的操作期の四段階。","en":"Stages of cognitive development"},{"t":"保存の概念","kind":"term","d":"見た目が変わっても量は変わらないという理解。具体的操作期の子どもがもつとピアジェは考えた。","en":"Conservation"},{"t":"シェマ","kind":"term","d":"経験を理解し行動するためのまとまった枠組み。ピアジェが発達を説明する基本の単位とした。","en":"Schema"},{"t":"同化と調節","kind":"term","d":"新しい経験を既存のシェマに取り込むのが同化、シェマを作り替えるのが調節。ピアジェの用語。","en":"Assimilation and accommodation"},{"t":"三つ山問題","kind":"term","d":"三つの山の模型を別の位置から見た景色を答えさせる課題。幼児の自己中心性を示すとされた。","en":"Three mountains task"},{"t":"自己中心性","kind":"term","d":"他者の視点に立てず、自分の見方で考える幼児の特徴。ピアジェが前操作期の特徴とした。","en":"Egocentrism"},{"t":"スキナー箱","kind":"term","d":"レバーを押すと餌が出る仕組みの実験装置。スキナーのオペラント条件づけの研究に用いられた。","en":"Operant conditioning chamber"},{"t":"強化","kind":"term","d":"行動の直後の結果によって、その行動が起こりやすくなること。スキナーの理論の中心概念。","en":"Reinforcement"},{"t":"変動比率スケジュール","kind":"term","d":"何回目の反応で報酬が出るかが毎回変わる方式。反応が長続きし、スロットマシンにたとえられる。","en":"Variable-ratio schedule"},{"t":"迷信行動","kind":"term","d":"報酬が行動と無関係に与えられても、直前の行動が繰り返される現象。スキナーが鳩で報告した。","en":"Superstitious behavior"},{"t":"プログラム学習","kind":"term","d":"学習内容を小さな段階に分け、正解のたびに先へ進む方式。スキナーが教育に応用した。","en":"Programmed learning"},{"t":"ウォールデン・ツー","kind":"work","d":"スキナーが1948年に出した小説。行動科学で設計された共同体を描いた。","en":"Walden Two"},{"t":"プロジェクト・ピジョン","kind":"event","d":"第二次世界大戦中にスキナーが進めた、鳩にミサイルを誘導させる計画。実用化はされなかった。","en":"Project Pigeon"},{"t":"ソーンダイク","kind":"person","d":"米国の心理学者（1874〜1949）。猫の問題箱の実験から効果の法則を唱えた。","en":"Edward Thorndike"},{"t":"効果の法則","kind":"term","d":"満足をもたらす行動は強まり、不快をもたらす行動は弱まるという法則。ソーンダイクが提唱した。","en":"Law of effect"},{"t":"自己実現","kind":"term","d":"自分の可能性を十分に発揮して生きること。マズローが欲求階層の最上位に置いた。","en":"Self-actualization"},{"t":"至高体験","kind":"term","d":"強い喜びや一体感に満たされる、まれな体験。マズローが自己実現した人に多いと論じた。","en":"Peak experience"},{"t":"人間性心理学","kind":"term","d":"行動主義と精神分析に続く「第三の勢力」として、人間の成長や主体性を重んじる立場。マズローらが主導した。","en":"Humanistic psychology"},{"t":"欠乏欲求と成長欲求","kind":"term","d":"不足を満たそうとする欲求と、さらに成長しようとする欲求。マズローは後者を自己実現に結びつけた。","en":"Deficiency needs and growth needs"},{"t":"自己超越","kind":"term","d":"自分の利益を超えて、他者や理念のために生きる境地。マズローが晩年に自己実現の上に置いたとされる。","en":"Self-transcendence"},{"t":"カール・ロジャーズ","kind":"person","d":"米国の心理学者（1902〜1987）。来談者中心療法を創始した、人間性心理学の代表的人物。","en":"Carl Rogers"},{"t":"二要因理論","kind":"term","d":"満足と不満足は別の要因で決まるとする、ハーズバーグの動機づけ理論。マズローの議論と並べて論じられる。","en":"Two-factor theory"},{"t":"X理論・Y理論","kind":"term","d":"マグレガーが1960年に示した、人間観の二つの型。マズローの欲求論の影響を受けたとされる。","en":"Theory X and Theory Y"},{"t":"アイヒマン裁判","kind":"event","d":"1961年にエルサレムで始まった元ナチス幹部の裁判。命令への服従が、ミルグラムの関心を引いたとされる。","en":"Eichmann trial"},{"t":"スモールワールド実験","kind":"event","d":"ミルグラムが1967年に行った、手紙を知人づたいに届けさせる実験。人のつながりの近さを示した。","en":"Small-world experiment"},{"t":"六次の隔たり","kind":"term","d":"世界の誰とでも、知人づたいに約6人でつながるという考え。1990年の戯曲の題名で広まった。","en":"Six degrees of separation"},{"t":"イェール大学","kind":"place","d":"米国コネチカット州の大学。ミルグラムが1961年に服従実験を始めた場所。","en":"Yale University"},{"t":"ソロモン・アッシュ","kind":"person","d":"ポーランド生まれの米国の心理学者（1907〜1996）。同調の線分実験で知られる。","en":"Solomon Asch"},{"t":"スワースモア大学","kind":"place","d":"米国ペンシルベニア州の小さな大学。アッシュが教え、同調の実験を行った場所の一つ。","en":"Swarthmore College"},{"t":"集団圧力","kind":"term","d":"集団の多数派の意見に合わせるよう感じる圧力。アッシュの実験で、その強さが示された。","en":"Group pressure"},{"t":"レオン・フェスティンガー","kind":"person","d":"米国の社会心理学者（1919〜1989）。認知的不協和の理論を1957年に発表した。","en":"Leon Festinger"},{"t":"予言が外れるとき","kind":"work","d":"フェスティンガーらが1956年に出した本。終末の予言が外れた集団の観察を報告した。","en":"When Prophecy Fails"},{"t":"フェスティンガーとカールスミスの実験","kind":"event","d":"1959年の実験。退屈な作業を嘘で勧められた人は、報酬が少ないほど作業を面白いと答えた。","en":"Festinger and Carlsmith experiment"},{"t":"アンナ・フロイト","kind":"person","d":"フロイトの末娘（1895〜1982）。児童分析を開き、『自我と防衛機制』（1936年）を著した。","en":"Anna Freud"},{"t":"抑圧","kind":"term","d":"受け入れがたい考えや記憶を意識から押しのける、防衛機制の基本形。フロイトが重視した。","en":"Repression"},{"t":"否認","kind":"term","d":"つらい現実をないものとして扱う防衛機制。アンナ・フロイトが整理した種類の一つ。","en":"Denial"},{"t":"投影","kind":"term","d":"自分の受け入れがたい感情を、相手がもっているように感じる防衛機制。","en":"Projection"},{"t":"合理化","kind":"term","d":"満たされなかった理由をもっともらしく説明して納得する防衛機制。「酸っぱいブドウ」が例に引かれる。","en":"Rationalization"},{"t":"反動形成","kind":"term","d":"本心と正反対の態度をとる防衛機制。好きな相手につらく当たる例が挙げられる。","en":"Reaction formation"},{"t":"昇華","kind":"term","d":"満たされない欲求を、芸術やスポーツなど社会に認められる活動に向ける、成熟した防衛機制。","en":"Sublimation"},{"t":"失錯行為","kind":"term","d":"言い間違いや物忘れなど。フロイトは『日常生活の精神病理学』で無意識の表れとして分析した。","en":"Parapraxis"},{"t":"エドゥアルト・フォン・ハルトマン","kind":"person","d":"ドイツの哲学者（1842〜1906）。1869年の『無意識の哲学』で無意識を論じた。","en":"Eduard von Hartmann"},{"t":"精神分析入門","kind":"work","d":"フロイトが一般の聴衆に向けて行った講義をまとめた本（1916〜17年）。失錯行為などの例を挙げる。","en":"Introductory Lectures on Psychoanalysis"},{"t":"ロバート・ローゼンタール","kind":"person","d":"米国の心理学者。教師の期待と児童の成績を調べ、ピグマリオン効果の研究で知られる。","en":"Robert Rosenthal"},{"t":"教室のピグマリオン","kind":"work","d":"ローゼンタールらが1968年に出した本。教師の期待が児童の成績に及ぶ影響を報告した。","en":"Pygmalion in the Classroom"},{"t":"ゴーレム効果","kind":"term","d":"教師などの低い期待が、相手の成績を下げてしまう現象。ピグマリオン効果の逆にあたる。","en":"Golem effect"},{"t":"ピグマリオン神話","kind":"term","d":"自作の彫像に恋した王が、女神に像を人間にしてもらうギリシャ神話。効果の名の由来。","en":"Pygmalion myth"},{"t":"マイ・フェア・レディ","kind":"work","d":"戯曲『ピグマリオン』を原作とする1956年のミュージカル。言葉づかいを学んで変わる娘を描く。","en":"My Fair Lady"},{"t":"プロスペクト理論","kind":"term","d":"人は得より損を大きく感じ、確率を歪めて見るとする意思決定の理論。1979年にカーネマンらが発表した。","en":"Prospect theory"},{"t":"ファスト&スロー","kind":"work","d":"カーネマンが2011年に出した一般向けの本。速い直感と遅い熟考という二つの思考様式を論じた。","en":"Thinking, Fast and Slow"},{"t":"ヒューリスティック","kind":"term","d":"経験則による素早い判断。便利だが一定の偏りを生むことが、カーネマンらの研究で示された。","en":"Heuristic"},{"t":"損失回避","kind":"term","d":"同じ額なら、得る喜びより失う痛みを大きく感じる傾向。プロスペクト理論の中心となる。","en":"Loss aversion"},{"t":"エイモス・トヴェルスキー","kind":"person","d":"イスラエル出身の心理学者（1937〜1996）。カーネマンと意思決定の偏りを共同研究した。","en":"Amos Tversky"},{"t":"システム1とシステム2","kind":"term","d":"直感的に速く働く思考と、意識的に遅く働く思考。『ファスト&スロー』で一般に広まった。","en":"System 1 and System 2"},{"t":"ピークエンドの法則","kind":"term","d":"経験の記憶は、最も強かった時点と終わりの印象で決まりやすいという傾向。カーネマンらが研究した。","en":"Peak-end rule"},{"t":"行動経済学","kind":"term","d":"人間の心理的な癖を取り入れて経済行動を説明する分野。カーネマンは2002年にノーベル経済学賞を受けた。","en":"Behavioral economics"},{"t":"係留効果","kind":"term","d":"最初に示された数字が、その後の見積もりを引き寄せてしまう傾向。アンカリングともいう。","en":"Anchoring effect"},{"t":"確証バイアス","kind":"term","d":"自分の考えに合う情報ばかりを集め、合わない情報を軽く見る傾向。","en":"Confirmation bias"},{"t":"フレーミング効果","kind":"term","d":"同じ内容でも、得の表現か損の表現かで選択が変わる現象。","en":"Framing effect"},{"t":"連言錯誤","kind":"term","d":"「AかつB」を「A」より起こりやすいと考えてしまう誤り。リンダ問題が有名。","en":"Conjunction fallacy"},{"t":"アジア病問題","kind":"event","d":"1981年にトヴェルスキーとカーネマンが示した、救える人数の言い方で選択が逆転する課題。","en":"Asian disease problem"},{"t":"ヘブライ大学","kind":"place","d":"エルサレムの大学。カーネマンとトヴェルスキーが出会い、共同研究を始めた場所。","en":"Hebrew University of Jerusalem"},{"t":"西周","kind":"person","d":"幕末・明治の啓蒙思想家（1829〜1897）。西洋の学術語を多く訳し、「心理学」の語も用いた。","en":"Nishi Amane"},{"t":"千里眼事件","kind":"event","d":"1910年ごろ、透視能力をもつとされた女性の実験が話題になった事件。元良の弟子の福来友吉が関わった。","en":"Clairvoyance incident"},{"t":"福来友吉","kind":"person","d":"元良勇次郎の弟子の心理学者（1869〜1952）。催眠や念写の研究で知られる。","en":"Tomokichi Fukurai"},{"t":"松本亦太郎","kind":"person","d":"元良勇次郎の弟子の心理学者（1865〜1943）。東京と京都の帝国大学で実験心理学を築いた。","en":"Matataro Matsumoto"},{"t":"精神物理学","kind":"term","d":"刺激の物理的な強さと感覚の大きさの関係を測る学問。元良勇次郎が日本で最初に講じたとされる。","en":"Psychophysics"},{"t":"東京帝国大学","kind":"place","d":"現在の東京大学の旧称。元良勇次郎が日本初の心理学講座を担当した。","en":"Tokyo Imperial University"},{"t":"神経質","kind":"term","d":"森田療法でいう、向上心が強く完全を求めやすく、症状にとらわれやすい気質。日常語とは少し意味が異なる。","en":"Shinkeishitsu"},{"t":"絶対臥褥","kind":"term","d":"森田療法の入院の第1期に、食事と洗面以外を寝て過ごす4〜7日ほどの期間。","en":"Absolute bed rest"},{"t":"あるがまま","kind":"term","d":"不安や症状を消そうとせず、そのまま受け入れて行動する、森田療法の態度。","en":"Arugamama"},{"t":"東京慈恵会医科大学","kind":"place","d":"東京の医科大学。森田正馬が精神医学の教授を務め、森田療法を発展させた。","en":"Jikei University School of Medicine"},{"t":"呉秀三","kind":"person","d":"日本の精神医学の基礎を築いた医師（1865〜1932）。東京帝国大学で森田正馬の師にあたる。","en":"Shuzo Kure"},{"t":"高良武久","kind":"person","d":"森田正馬の弟子の精神科医。慈恵医大で教え、森田療法を継承した。","en":"Takehisa Kora"},{"t":"甘えの構造","kind":"work","d":"土居健郎が1971年に出した本。日本人の心理を「甘え」で読み解き、広く読まれた。","en":"The Anatomy of Dependence"},{"t":"日本人論","kind":"term","d":"日本人や日本社会の特徴を論じる著作の総称。『甘えの構造』はその代表例の一つとされる。","en":"Nihonjinron"},{"t":"遠慮と気がね","kind":"term","d":"土居が「甘え」に関連づけて挙げた日本語。人に頼るのをためらう気持ちを表す。","en":"Enryo and kigane"},{"t":"母子関係", line":"ユーラシアの縁を制する者が世界を左右するという説","facts":[{"t":"提唱","n":"スパイクマンが『世界政治における米国の戦略』（1942）と『平和の地政学』（1944）で展開した。"},{"t":"範囲","n":"西欧、中東、インド、東南アジア、中国沿岸、朝鮮半島など、内陸と海洋の間の縁辺地帯。"},{"t":"ハートランド論との違い","n":"人口と資源が集まる縁辺部こそ要で、陸と海の勢力がぶつかる場所だと見た。"}],"famous":[{"t":"西ヨーロッパ","n":"人口と産業が集中する縁辺部の代表で、戦後の米国の同盟網の中心になった。"},{"t":"朝鮮半島とベトナム","n":"冷戦期の大きな戦争が縁辺部で起きたとする説明に、よく挙げられる。"},{"t":"封じ込め政策","n":"縁辺部で同盟の網を築く発想の背景に、この考え方があると指摘される。"}],"anecdotes":["スパイクマンは1943年に亡くなり、リムランド論を示した『平和の地政学』は没後の1944年に出版された。","戦争のさなかから、枢軸国を無力にしすぎるとユーラシアの均衡が崩れかねないと警告したとされる。"],"trivia":[{"f":"スパイクマンのリムランドは、マッキンダーが1904年に示した「内側の三日月地帯」とほぼ重なる。呼び名を変えて重要性を強調した。","q":"スパイクマンがリムランドと呼んだ地域は、マッキンダーのどの呼び名とほぼ重なるか。","a":"内側の三日月地帯","w":["外側の三日月地帯","世界島","ピボット・エリア"]},{"f":"リムランド論を展開した『平和の地政学』が出版されたとき、著者のスパイクマンはすでに世を去っていた。","q":"『平和の地政学』が出版された時点で、著者のスパイクマンはどうなっていたか。","a":"すでに亡くなっていた","w":["米国務省に入っていた","英国に亡命していた","海軍に従軍していた"]}],"people":["スパイクマン","マッキンダー"],"related":["スパイクマン","マッキンダー","ハートランド","封じ込め政策","平和の地政学","内側の三日月地帯","ユーラシア","朝鮮戦争"]},{"id":"containment","name":"封じ込め政策","full":"封じ込め政策（コンテインメント）","en":"Containment","region":"海外","category":"戦略・用語","when":"1946〜47年","where":"米国とソ連の周辺","era":"戦間・冷戦","tagline":"ソ連の勢力拡大を周辺で食い止める米国の冷戦戦略","facts":[{"t":"起点","n":"米国の外交官ケナンが、1946年の「長文電報」と1947年の「X論文」で打ち出した。"},{"t":"趣旨","n":"武力で押し返すのではなく、ソ連の膨張を長く抑え込めば、内部の変化を待てると考えた。"},{"t":"具体策","n":"トルーマン・ドクトリン（1947）、マーシャル・プラン、NATO（1949）などに展開した。"},{"t":"ケナンの不満","n":"ケナン自身は、政策が軍事一辺倒に傾いたと、のちに批判した。"}],"famous":[{"t":"トルーマン・ドクトリン","n":"1947年にギリシャとトルコへの援助を打ち出し、冷戦の始まりを象徴した。"},{"t":"マーシャル・プラン","n":"西欧の経済復興を援助し、ソ連圏に取り込まれるのを防ぐ狙いがあった。"},{"t":"朝鮮戦争とベトナム戦争","n":"封じ込めの考えが、軍事介入の理由づけに用いられた。"}],"anecdotes":["ケナンは1946年2月、モスクワの米大使館から国務省へ非常に長い電報を送った。ワシントンで広く読まれたとされる。","X論文は「X」の署名で雑誌に載ったが、筆者がケナンであることは、ほどなく知れ渡った。","ケナンは長寿で、2005年に101歳で亡くなった。封じ込め政策の立案者が冷戦後の世界を長く見届けたことになる。"],"trivia":[{"f":"ケナンが1947年に封じ込めを論じた論文は、実名ではなく「X」の署名で雑誌に載った。","q":"ケナンが1947年に封じ込めを論じた論文を雑誌に発表した際の署名はどれか。","a":"筆名「X」","w":["筆名「K」","筆名「Z」","実名のジョージ・ケナン"]},{"f":"封じ込め政策の立案者ケナンは長寿で、2005年に満101歳で亡くなり、ソ連崩壊後の世界まで見届けた。", 航ができなくなった。","q":"2021年にコンテナ船の座礁で、約6日間通航が止まった運河はどれか。","a":"スエズ運河","w":["パナマ運河","キール運河","コリントス運河"]},{"f":"マラッカ海峡は最も狭い所の幅が3キロに満たず、世界有数の交通量を誇りながら、船が通れる水路は限られている。","q":"マラッカ海峡で最も狭い所の幅は、およそどれくらいか。","a":"3キロに満たない","w":["約30キロ","約80キロ","約300キロ"]}],"people":["マハン"],"related":["マラッカ海峡","ホルムズ海峡","バブ・エル・マンデブ海峡","スエズ運河","パナマ運河","マハン","シーレーン","エネルギー安全保障"]},{"id":"balance","name":"勢力均衡","full":"勢力均衡（バランス・オブ・パワー）","en":"Balance of Power","region":"海外","category":"理論・概念","when":"17〜19世紀の欧州で発達","where":"欧州","era":"地政学の形成","tagline":"どの国も突出させず、均衡で平和を保つという発想","facts":[{"t":"内容","n":"特定の国が突出して強くなるのを、他国の同盟や対抗で防ぎ、安定を保つという考え。"},{"t":"背景","n":"近世の欧州で、主権国家が並び立つウェストファリア体制のもと発達した。"},{"t":"19世紀","n":"ウィーン会議（1814〜15）後の「ヨーロッパ協調」で、大国が均衡を保とうとした。"},{"t":"ビスマルク","n":"ビスマルクは同盟の網を張ってフランスの孤立を図り、欧州の安定を保とうとした。"}],"famous":[{"t":"ウィーン会議","n":"ナポレオン戦争後の秩序を話し合い、大国の均衡を意識した処理が行われた。"},{"t":"英国の役割","n":"英国は大陸に覇権国が現れないよう、弱い側に加勢する役を担ったと説明される。"},{"t":"冷戦期の米ソ","n":"核戦力を背景にした対峙が、一種の均衡として論じられる。"}],"anecdotes":["ウィーン会議には敗戦国フランスの代表タレーランも加わり、巧みな交渉でフランスを大国の列に戻したとされる。","勢力均衡は英語でバランス・オブ・パワーといい、天秤にのせた重りになぞらえた語とされる。"],"trivia":[{"f":"ウィーン会議では、敗戦国フランスの外交官タレーランが巧みに立ち回り、フランスを大国の列に戻したとされる。","q":"ウィーン会議でフランスの代表として活躍した外交官は誰か。","a":"タレーラン","w":["メッテルニヒ","フーシェ","ギゾー"]},{"f":"1878年のベルリン会議では、ビスマルクが議長を務め、露土戦争後のバルカンの国境を各国の利害を調整しながら整理した。","q":"1878年のベルリン会議で議長を務めた政治家は誰か。","a":"ビスマルク","w":["ヴィルヘルム2世","モルトケ","ディズレーリ"]}],"people":[],"related":["ウィーン会議","ビスマルク","タレーラン","ヨーロッパ協調","ウェストファリア条約","ベルリン会議","冷戦"]},{"id":"clash","name":"文明の衝突","full":"文明の衝突（The Clash of Civilizations）","en":"The Clash of Civilizations","region":"海外","category":"理論・概念","when":"1993年（論文）・1996年（書籍）","where":"世界全体","era":"冷戦後","tagline":"冷戦後の対立は文明の違いに沿って起こるとした説","facts":[{"t":"発表","n":"ハンチントンが1993年に雑誌で論文を発表し、1996年に著書にまとめた。"},{"t":"主張","n":"冷戦後の対立の主な軸は、イデオロギーや経済より、文化・文明の違いになるとした。"},{"t":"区分","n":"西欧、イスラム、中華、日本、ヒンドゥー、東方正教会、ラテンアメリカなどに分けた。"},{"t":"反応","n":"大きな議論を呼び、文明を固定的に捉えすぎだという批判も多かった。"}],"famous":[{"t":"日本文明","n":"日本は一国で一つの文明とされ、他の文明と並ぶ区分に置かれた。"},{"t":"2001年の同時多発テロ","n":"事件後、この説が再び注目され、賛否の議論が広がった。"},{"t":"歴史の終わり","n":"フクヤマの論と対照的な見方として、並べて語られることが多い。"}],"anecdotes":["1993年の論文の題の末尾には疑問符がついていた。1996年の著書では、疑問符が外された。","この論文は、フクヤマの『歴史の終わり』への応答でもあるとされ、掲載誌の歴史でも指折りの反響を呼んだと言われる。"],"trivia":[{"f":"ハンチントンの1993年の論文の題名は末尾に疑問符がついていたが、1996年の著書の題名からは疑問符が外された。","q":"1993年の論文の題名は、1996年の著書の題名と何が違っていたか。","a":"末尾に疑問符があった","w":["副題に「西洋の没落」とあった","題が「文明の融合」だった","末尾に感嘆符があった"]},{"f":"ハンチントンは文明の区分で、日本を一国で一つの文明として数えた。中国やインドのような広がりを持つ文明圏ではなかった。","q":"ハンチントンが、一国で一つの文明とみなした国はどれか。","a":"日本","w":["インド","ロシア","トルコ"]}],"people":["ハンチントン"],"related":["ハンチントン","文明の衝突と世界秩序の再創造","歴史の終わり","フランシス・フクヤマ","フォーリン・アフェアーズ","アメリカ同時多発テロ","ソ連崩壊"]},{"id":"sealane","name":"シーレーン","full":"シーレーン（海上交通路）","en":"Sea Lane","region":"日本","category":"戦略・用語","when":"1980年代に議論が広がる","where":"日本周辺と中東・東南アジアを結ぶ海域","era":"戦後","tagline":"日本の資源と貿易を運ぶ、海上の命綱","facts":[{"t":"意味","n":"船が通る海上交通路のこと。日本は資源の多くを輸入し、貿易のほとんどが海を通る。"},{"t":"主な経路","n":"中東からインド洋、マラッカ海峡、南シナ海を経て日本に至る航路が、原油の主な経路。"},{"t":"1000海里構想","n":"日本は1980年代に、周辺の海域を含む海上交通路の防衛を課題として議論した。"},{"t":"近年","n":"2009年から、海賊対策のため自衛隊の艦艇などがソマリア沖・アデン湾に派遣されている。"}],"famous":[{"t":"マラッカ海峡","n":"中東から日本へ向かう原油タンカーの多くが通る、狭い海峡。"},{"t":"ホルムズ海峡","n":"ペルシャ湾の出入口で、日本向けの原油の多くがここを通る。"},{"t":"ソマリア沖・アデン湾","n":"海賊対策のため、各国の艦艇が護衛にあたってきた海域。"}],"anecdotes":["太平洋戦争では、米潜水艦などの攻撃で日本の商船の多くが沈められ、資源の輸送が細って戦力の維持が難しくなった。","ペルシャ湾から日本へ向かう原油タンカーは、航海におよそ二十日前後をかけると言われる。"],"trivia":[{"f":"日本は2009年から海賊対策のため、アフリカ東岸沖の海域に自衛隊の艦艇などを派遣し、船舶の護衛にあたっている。","q":"2009年から日本が自衛隊の艦艇などを派遣して、船舶の護衛にあたっている海域はどこか。","a":"ソマリア沖・アデン湾","w":["ギニア湾","マラッカ海峡","ペルシャ湾"]},{"f":"日本の貿易は、重量で見るとほぼすべてが海上輸送で、海運の割合は99%台に達する。","q":"日本の貿易で、重量ベースで海上輸送が占める割合に最も近いのはどれか。","a":"99%台","w":["約75%","約82%","約90%"]}],"people":["マハン"],"related":["マハン","マラッカ海峡","ホルムズ海峡","ソマリア沖・アデン湾","南シナ海","エネルギー安全保障","石油危機"]},{"id":"eez","name":"排他的経済水域（EEZ）","full":"排他的経済水域（Exclusive Economic Zone）","en":"Exclusive Economic Zone","region":"日本","category":"理論・概念","when":"1982年採択・1994年発効","where":"沿岸から200海里の海域","era":"戦後","tagline":"沿岸から200海里の資源を沿岸国が管理する海域","facts":[{"t":"内容","n":"沿岸から200海里（約370キロ）まで、水産資源や海底資源を沿岸国が管理できる海域。"},{"t":"根拠","n":"1982年に採択された国連海洋法条約（1994年発効）が定めている。"},{"t":"日本の広さ","n":"領海とEEZを合わせた面積は約447万平方キロで、世界6位前後とされる。"},{"t":"航行の自由","n":"他国の船の航行や航空機の飛行は、原則として認められる。"}],"famous":[{"t":"沖ノ鳥島","n":"日本最南端の島。日本はこの島を基点に約40万平方キロのEEZを主張している。"},{"t":"南鳥島","n":"日本最東端の島で、周辺に広いEEZを持つ。"}],"anecdotes":["沖ノ鳥島は満潮時に海面上に残るのが小さな2つの岩ほどで、日本は浸食を防ぐための護岸工事を行ってきた。","沿岸200海里の権利は、1940年代後半にチリやペルーなどが主張したのが先駆けとされる。"],"trivia":[{"f":"日本の国土面積は約38万平方キロだが、領海とEEZを合わせると約447万平方キロで、国土のおよそ12倍にもなる。","q":"日本の領海とEEZを合わせた面積は、国土面積のおよそ何倍か。","a":"約12倍","w":["約3倍","約5倍","約25倍"]},{"f":"日本の最南端の島は東京都に属する沖ノ鳥島で、最東端の南鳥島、最西端の与那国島とともに日本の端を成す。","q":"日本の最南端の島はどれか。","a":"沖ノ鳥島","w":["南鳥島","与那国島","波照間島"]}],"people":[],"related":["国連海洋法条約","領海","大陸棚","沖ノ鳥島","南鳥島","接続水域","シーレーン"]},{"id":"anpo","name":"日米安全保障条約","full":"日米安全保障条約（日米安保条約）","en":"U.S.-Japan Security Treaty","region":"日本","category":"戦略・用語","when":"1951年署名・1960年改定","where":"日本・米国","era":"戦後","tagline":"米国に基地を提供し、日本の防衛と地域の安定を図る条約","facts":[{"t":"成立","n":"1951年9月、サンフランシスコ平和条約と同じ日に、旧条約が署名された。"},{"t":"改定","n":"1960年、岸内閣のもとで現行条約に改定し、米国の日本防衛の義務を明記した。"},{"t":"構造","n":"日本は基地を提供し、米国は日本の防衛にあたる。第6条が米軍の基地の使用を定める。"},{"t":"期限","n":"新条約は10年の固定期間のあと、どちらかが通告すれば1年後に終了できる。"}],"famous":[{"t":"日米地位協定","n":"在日米軍の施設の使用や米軍人の法的な地位などを定める協定。"},{"t":"1960年の安保闘争","n":"国会周辺で大規模なデモが起こり、アイゼンハワー大統領の訪日も中止された。"},{"t":"沖縄","n":"在日米軍専用施設の面積の約7割が集まる県。"}],"anecdotes":["1951年の旧条約の署名では、全権団のなかで吉田茂首相ただ一人が署名した。責任を一人で負う考えからとされる。","旧条約は、平和条約の会場となった市内のオペラハウスではなく、サンフランシスコの米陸軍基地の一室で署名された。"],"trivia":[{"f":"1951年、平和条約はサンフランシスコ市内のオペラハウスで署名されたが、旧日米安保条約は米陸軍の基地の中で署名された。","q":"1951年に旧日米安全保障条約が署名された場所は、どこか。","a":"サンフランシスコの陸軍基地","w":["サンフランシスコのオペラハウス","ワシントンのホワイトハウス","ニューヨークの国連本部"]},{"f":"現行の日米安保条約への改定は、1960年1月にワシントンで署名され、日本側の首相は岸信介だった。","q":"現行の日米安全保障条約に改定したときの日本の首相は誰か。","a":"岸信介","w":["吉田茂","池田勇人","佐藤栄作"]}],"people":[],"related":["サンフランシスコ平和条約","吉田茂","岸信介","日米地位協定","沖縄","核の傘","冷戦"]},{"id":"hoppou","name":"北方領土問題","full":"北方領土問題（北方四島）","en":"Northern Territories Dispute","region":"日本","category":"地域・要衝","when":"1945年以降","where":"択捉島・国後島・色丹島・歯舞群島","era":"戦後","tagline":"日本とロシアの間で未解決の、北の四島をめぐる問題","facts":[{"t":"対象","n":"択捉島、国後島、色丹島、歯舞群島の四島。日本は固有の領土だと主張している。"},{"t":"1855年","n":"日露和親条約が、択捉島と得撫島の間に日露の国境を定めた。"},{"t":"1945年","n":"終戦前後にソ連軍が四島に進み、占拠した。現在はロシアが実効支配している。"},{"t":"1956年","n":"日ソ共同宣言で戦争状態が終わり、平和条約締結後に歯舞・色丹を引き渡すとされた。"}],"famous":[{"t":"択捉島","n":"四島のなかで最大の島。日本の島では、本州・北海道・九州・四国に次ぐ大きさとされる。"},{"t":"樺太・千島交換条約","n":"1875年に、日本が樺太の権利を手放し、千島列島を得ると定めた。"},{"t":"北方領土の日","n":"毎年2月7日。日露和親条約が結ばれた日にちなんで定められた。"}],"anecdotes":["終戦時、四島には約1万7千人の日本人が暮らしていたとされ、のちに日本へ引き揚げた。","日ソ共同宣言の発効で日ソの国交が回復し、ソ連の支持を得て、日本は同じ1956年12月に国連への加盟を果たした。"],"trivia":[{"f":"2月7日の北方領土の日は、1855年に日露和親条約が結ばれ、択捉島と得撫島の間に国境が引かれたことにちなむ。","q":"北方領土の日である2月7日は、何を記念した日付か。","a":"1855年の日露和親条約の調印","w":["1875年の樺太・千島交換条約の調印","1956年の日ソ共同宣言の署名","1945年の終戦の詔書の放送"]},{"f":"1956年の日ソ共同宣言は、平和条約の締結後に、歯舞群島と色丹島を日本に引き渡すとした。","q":"1956年の日ソ共同宣言で、平和条約締結後に引き渡すとされた島はどれか。","a":"歯舞群島と色丹島","w":["択捉島と国後島","国後島と色丹島","択捉島と歯舞群島"]}],"people":[],"related":["択捉島","北方四島","日ソ共同宣言","日露和親条約","樺太・千島交換条約","ヤルタ会談","サンフランシスコ平和条約"]},{"id":"island","name":"島嶼防衛・第一列島線","full":"島嶼防衛と第一列島線","en":"Island Defense and the First Island Chain","region":"日本","category":"戦略・用語","when":"2010年代に南西シフトが進む","where":"南西諸島・東シナ海・台湾周辺","era":"冷戦後","tagline":"南西の島々を守る日本の課題と、海洋進出を測る線","facts":[{"t":"第一列島線","n":"九州から沖縄、台湾、フィリピン、ボルネオ島へ連なる島々の線。海洋進出を論じる際の指標。"},{"t":"第二列島線","n":"伊豆・小笠原諸島からグアム、マリアナ諸島に至る、より外側の線。"},{"t":"島嶼防衛","n":"離島への侵攻に備え、警戒・防衛・奪回の能力を整えること。"},{"t":"南西シフト","n":"日本は2010年代から、南西諸島への部隊の配備を進めてきた。"}],"famous":[{"t":"南西諸島","n":"九州から台湾の近くまで、約1200キロにわたって弧を描いて連なる島々。"},{"t":"与那国島","n":"日本最西端の島。台湾まで約110キロで、2016年に陸上自衛隊の部隊が置かれた。"},{"t":"水陸機動団","n":"離島の防衛や奪回を想定し、2018年に陸上自衛隊が新設した部隊。"}],"anecdotes":["列島線の考え方は、中国海軍の劉華清が1980年代に唱えたとされる。冷戦初期の米国の構想にも似た発想が見られる。","陸上自衛隊は2018年に水陸機動団を新設し、離島が占拠された場合に取り戻す能力を備えた。"],"trivia":[{"f":"与那国島は日本最西端の島で、台湾まで約110キロしかなく、晴れた日には台湾の山並みが見えることがあるとされる。","q":"日本最西端の島で、台湾まで約110キロの距離にある島はどれか。","a":"与那国島","w":["石垣島","宮古島","波照間島"]},{"f":"陸上自衛隊は2018年に、離島の防衛や奪回を想定した水陸機動団を新設した。日本版の海兵隊と紹介されることもある。","q":"2018年に陸上自衛隊が、離島の奪回を想定して新設した部隊はどれか。","a":"水陸機動団","w":["第1空挺団","中央即応集団","西部方面混成団"]}],"people":[],"related":["南西諸島","与那国島","尖閣諸島","沖縄","第二列島線","水陸機動団","台湾海峡"]},{"id":"energy","name":"エネルギー安全保障","full":"エネルギー安全保障（Energy Security）","en":"Energy Security","region":"日本","category":"戦略・用語","when":"1970年代に重視が高まる","where":"世界・日本","era":"戦後","tagline":"必要なエネルギーを、途切れず手頃な価格で確保する課題","facts":[{"t":"意味","n":"国民生活と経済に必要なエネルギーを、安定して妥当な価格で確保すること。"},{"t":"日本の事情","n":"一次エネルギーの自給率は1〜2割ほどで、石油・石炭・天然ガスの大半を輸入に頼る。"},{"t":"石油危機","n":"1973年の第四次中東戦争後の石油危機で原油価格が急騰し、日本経済は大きく揺れた。"},{"t":"対策","n":"石油備蓄、調達先の分散、省エネ、原子力や再生可能エネルギーの活用などを組み合わせてきた。"}],"famous":[{"t":"石油備蓄","n":"国家備蓄と民間備蓄をあわせ、輸入が途絶えても数か月はまかなえる量を持つ。"},{"t":"国際エネルギー機関","n":"石油危機を受けて1974年に設立され、緊急時の対応などを調整する。"},{"t":"ホルムズ海峡","n":"日本向けの原油の多くが通る要衝で、情勢の変化が直接響く。"}],"anecdotes":["1973年の石油危機のとき、日本ではトイレットペーパーなどの買い占め騒ぎが起き、社会不安の象徴として語られる。","石油危機のあと、日本は1974年に新エネルギーの技術開発をめざすサンシャイン計画を始めた。"],"trivia":[{"f":"1973年の石油危機の際、日本ではトイレットペーパーの買い占め騒ぎが起きたとして語り継がれている。","q":"1973年の石油危機の際に、買い占め騒ぎが起きたとして知られる紙製品は何か。","a":"トイレットペーパー","w":["コピー用紙（オフィス向け）","新聞用紙の巻き取り","段ボールの原紙"]},{"f":"国際エネルギー機関（IEA）は、1973年の石油危機を受け、1974年に先進国の協調の枠組みとして設立された。","q":"石油危機を受けて1974年に設立された、エネルギー政策を調整する国際機関はどれか。","a":"国際エネルギー機関","w":["石油輸出国機構","国際原子力機関","国際通貨基金"]}],"people":[],"related":["石油危機","国際エネルギー機関","ホルムズ海峡","石油備蓄","シーレーン","チョークポイント","再生可能エネルギー"]}],"glossary":[{"t":"地政学","kind":"term","d":"地理的な条件が国家の政策や国際関係に与える影響を論じる学問・視点。語はチェーレンがつくったとされる。","en":"Geopolitics"},{"t":"生存圏","kind":"term","d":"国家が存続し成長するのに必要な空間を指す語。ラッツェルが論じ、のちに拡張政策の標語に使われた。","en":"Lebensraum"},{"t":"有機体としての国家","kind":"term","d":"国家を生き物にたとえ、成長し領土を求めると見る考え方。ラッツェルやチェーレンが説いた。","en":"State as organism"},{"t":"人類地理学","kind":"work","d":"ラッツェルが1882年と1891年に著した全2巻の書。人間の暮らしと自然環境の結びつきを論じた。","en":"Anthropogeographie"},{"t":"政治地理学","kind":"work","d":"ラッツェルが1897年に著した書。国家と土地・位置・空間の関係を論じ、この分野の基礎となった。","en":"Politische Geographie"},{"t":"ヘッケル","kind":"person","d":"ドイツの生物学者（1834〜1919）。進化論を広めた一人で、ラッツェルが動物学を学んだ師。","en":"Ernst Haeckel"},{"t":"大国論","kind":"work","d":"チェーレンが1905年から刊行した書。世界の大国を地理や国力の面から比べて論じた。","en":"Stormakterna"},{"t":"生活形態としての国家","kind":"work","d":"チェーレンが1916年に著した書。国家を生きた存在とみなし、地理や経済など五つの面から論じた。","en":"Staten som livsform"},{"t":"第一次世界大戦","kind":"event","d":"1914年から1918年にかけて欧州を中心に戦われた大戦。地政学が政策論として注目されるきっかけになった。","en":"World War I"},{"t":"海上権力史論","kind":"work","d":"マハンが1890年に著した書。海上交通を握る海軍力が国の盛衰を左右すると論じ、各国の海軍論に影響した。","en":"The Influence of Sea Power upon History"},{"t":"パナマ運河","kind":"place","d":"太平洋と大西洋を結ぶ運河で、1914年に開通。マハンは米国が運河と海軍力を備える意義を説いた。","en":"Panama Canal"},{"t":"米海軍大学校","kind":"place","d":"米国ロードアイランド州ニューポートにある海軍の高等教育機関（1884年設立）。マハンが教官・校長を務めた。","en":"U.S. Naval War College"},{"t":"ヴィルヘルム2世","kind":"person","d":"ドイツ帝国の皇帝（在位1888〜1918）。マハンに影響を受け、海軍の大拡張を進めたと伝わる。","en":"Wilhelm II"},{"t":"セオドア・ローズベルト","kind":"person","d":"米国の第26代大統領（在任1901〜09）。海軍力の拡大を進め、マハンの考えを支持した。","en":"Theodore Roosevelt"},{"t":"世界島","kind":"term","d":"マッキンダーの用語で、ユーラシアとアフリカを合わせた陸塊のこと。ハートランドがその中核とされた。","en":"World-Island"},{"t":"歴史の地理的枢軸","kind":"work","d":"マッキンダーが1904年に王立地理学協会で発表した論文。ユーラシア内陸を世界史の枢軸と論じた。","en":"The Geographical Pivot of History"},{"t":"民主主義の理想と現実","kind":"work","d":"マッキンダーが1919年に著した書。ハートランドと世界島の考えを示し、戦後の秩序を論じた。","en":"Democratic Ideals and Reality"},{"t":"ケニア山","kind":"place","d":"アフリカ東部の高山。マッキンダーが1899年に最高峰へ初登頂したことで知られる。","en":"Mount Kenya"},{"t":"東ヨーロッパ","kind":"place","d":"マッキンダーが、ここを押さえる者がハートランドを制するとして、地政学上の鍵とした地域。","en":"Eastern Europe"},{"t":"内側の三日月地帯","kind":"term","d":"マッキンダーが1904年に示した、ハートランドの外側で海に面する縁の地帯。リムランドにほぼ重なる。","en":"Inner crescent"},{"t":"地政学雑誌","kind":"work","d":"ハウスホーファーらが1924年に創刊したドイツの雑誌。ドイツ語圏で地政学を広める場となった。","en":"Zeitschrift fur Geopolitik"},{"t":"ルドルフ・ヘス","kind":"person","d":"ナチス党の指導者の一人で、ハウスホーファーの教え子とされる。1941年に英国へ単独で飛行した。","en":"Rudolf Hess"},{"t":"第二次世界大戦","kind":"event","d":"1939年から1945年に戦われた世界規模の大戦。地政学は戦時の国家戦略論とも結びついた。","en":"World War II"},{"t":"平和の地政学","kind":"work","d":"スパイクマンの著書（1944年、没後刊行）。リムランドの重要性を論じ、戦後の戦略論に影響した。","en":"The Geography of the Peace"},{"t":"エール大学","kind":"place","d":"米国コネチカット州ニューヘイブンにある大学。スパイクマンが教授を務め、国際問題研究所に関わった。","en":"Yale University"},{"t":"ケナン","kind":"person","d":"米国の外交官・歴史家のジョージ・ケナン（1904〜2005）。封じ込め政策の考え方を打ち出した。","en":"George F. Kennan"},{"t":"ユーラシア","kind":"place","d":"ヨーロッパとアジアを合わせた世界最大の陸塊。ハートランド論やリムランド論の舞台となった。","en":"Eurasia"},{"t":"グランド・チェスボード","kind":"work","d":"ブレジンスキーが1997年に著した書。ユーラシアを覇権をめぐる盤面と見て、米国の戦略を論じた。","en":"The Grand Chessboard"},{"t":"三極委員会","kind":"term","d":"1973年に日本・北米・西欧の協力を探る目的で設立された民間組織。ブレジンスキーが設立にかかわった。","en":"Trilateral Commission"},{"t":"ジミー・カーター","kind":"person","d":"米国の第39代大統領（在任1977〜81）。ブレジンスキーを国家安全保障担当補佐官に起用した。","en":"Jimmy Carter"},{"t":"ソ連崩壊","kind":"event","d":"1991年12月にソビエト連邦が解体し、冷戦が名実ともに終わった出来事。冷戦後の論の背景となった。","en":"Dissolution of the Soviet Union"},{"t":"文明の衝突と世界秩序の再創造","kind":"work","d":"ハンチントンが1996年に著した書。1993年の論文を広げ、冷戦後の世界を文明の区分で論じた。","en":"The Clash of Civilizations and the Remaking of World Order"},{"t":"歴史の終わり","kind":"work","d":"フクヤマが1989年の論文と1992年の著書で、冷戦後は自由民主主義が広がると論じた作品。","en":"The End of History"},{"t":"フランシス・フクヤマ","kind":"person","d":"米国の政治学者（1952年生まれ）。『歴史の終わり』で知られ、ハンチントンの文明論と対比される。","en":"Francis Fukuyama"},{"t":"第三の波","kind":"term","d":"ハンチントンが、1974年のポルトガルに始まる世界的な民主化の広がりを指して使った語。","en":"Third Wave"},{"t":"軍人と国家","kind":"work","d":"ハンチントンが1957年に著した書。軍と文民政府の関係を論じた、この分野の古典。","en":"The Soldier and the State"},{"t":"フォーリン・アフェアーズ","kind":"term","d":"米国の外交問題評議会が1922年に創刊した外交の雑誌。X論文や文明の衝突の論文が載った。","en":"Foreign Affairs"},{"t":"ハーバード大学","kind":"place","d":"米国マサチューセッツ州の大学。ハンチントンが長年教え、ブレジンスキーも博士号を得た。","en":"Harvard University"},{"t":"シベリア鉄道","kind":"place","d":"ロシアが1891年に着工した、ヨーロッパ側と極東を結ぶ鉄道。陸上輸送の力を示す例とされた。","en":"Trans-Siberian Railway"},{"t":"グレート・ゲーム","kind":"event","d":"19世紀に英国とロシアが中央アジアなどで繰り広げた勢力争い。陸と海の対立の例として引かれる。","en":"The Great Game"},{"t":"朝鮮戦争","kind":"event","d":"1950年に始まり、1953年に休戦した戦争。冷戦期の封じ込めが軍事的に試された場の一つ。","en":"Korean War"},{"t":"X論文","kind":"work","d":"ケナンが1947年に筆名「X」で『フォーリン・アフェアーズ』に発表した論文。封じ込め政策の骨格を示した。","en":"The Sources of Soviet Conduct"},{"t":"長文電報","kind":"work","d":"1946年2月、モスクワの米大使館にいたケナンが国務省へ送った長い電報。ソ連の行動原理を分析した。","en":"Long Telegram"},{"t":"トルーマン・ドクトリン","kind":"event","d":"1947年、トルーマン大統領がギリシャとトルコへの援助を打ち出した方針。冷戦の始まりを象徴する。","en":"Truman Doctrine"},{"t":"マーシャル・プラン","kind":"event","d":"1947年に発表された、米国による西欧の経済復興援助計画。封じ込めを経済面から支えた。","en":"Marshall Plan"},{"t":"NATO","kind":"term","d":"1949年に北米と西欧の国々が結んだ北大西洋条約にもとづく軍事同盟。封じ込めの柱の一つ。","en":"NATO"},{"t":"冷戦","kind":"event","d":"第二次世界大戦後から1989〜91年にかけて続いた、米国とソ連を中心とする陣営間の対立。","en":"Cold War"},{"t":"アイゼンハワー","kind":"person","d":"米国の第34代大統領（在任1953〜61）。1954年にドミノの比喩を用いたことで知られる。","en":"Dwight D. Eisenhower"},{"t":"ディエンビエンフー","kind":"event","d":"ベトナム北西部の地名。1954年の戦いでフランス軍が敗れ、インドシナ戦争の転機となった。","en":"Dien Bien Phu"},{"t":"ベトナム戦争","kind":"event","d":"ベトナムの南北の対立に米国が深く関与した戦争。1975年に北側の勝利で終わり、ドミノ論が引かれた。","en":"Vietnam War"},{"t":"インドシナ半島","kind":"place","d":"東南アジア大陸部の半島。ベトナム・ラオス・カンボジアなどが位置し、ドミノ論の舞台とされた。","en":"Indochina Peninsula"},{"t":"マラッカ海峡","kind":"place","d":"マレー半島とスマトラ島の間の海峡。最も狭い所は3キロに満たず、日本向けの原油の主な経路になる。","en":"Strait of Malacca"},{"t":"ホルムズ海峡","kind":"place","d":"ペルシャ湾とオマーン湾を結ぶ海峡。世界の海上石油取引の多くが通る、最重要の要衝の一つ。","en":"Strait of Hormuz"},{"t":"バブ・エル・マンデブ海峡","kind":"place","d":"紅海とアデン湾を結ぶ狭い海峡。スエズ運河を通る船が通過する要衝。","en":"Bab-el-Mandeb"},{"t":"スエズ運河","kind":"place","d":"地中海と紅海を結ぶ運河で、1869年に開通。欧州とアジアの海上輸送の近道になった。","en":"Suez Canal"},{"t":"ウィーン会議","kind":"event","d":"1814〜15年にナポレオン戦争後の欧州秩序を話し合った国際会議。勢力均衡を意識した処理が行われた。","en":"Congress of Vienna"},{"t":"ビスマルク","kind":"person","d":"ドイツ統一を主導したプロイセン・ドイツの政治家（1815〜98）。同盟網で欧州の均衡を保とうとした。","en":"Otto von Bismarck"},{"t":"タレーラン","kind":"person","d":"フランスの外交官・政治家（1754〜1838）。ウィーン会議で敗戦国フランスの立場を守ったとされる。","en":"Talleyrand"},{"t":"ヨーロッパ協調","kind":"term","d":"ウィーン会議後、欧州の大国が会議外交で秩序を保とうとした仕組み。勢力均衡の実践例。","en":"Concert of Europe"},{"t":"ウェストファリア条約","kind":"event","d":"1648年に三十年戦争を終えた条約。主権国家が並び立つ近代の国際秩序の出発点とされる。","en":"Peace of Westphalia"},{"t":"ベルリン会議","kind":"event","d":"1878年にビスマルクが議長を務めた国際会議。露土戦争後のバルカン情勢を調整した。","en":"Congress of Berlin"},{"t":"アメリカ同時多発テロ","kind":"event","d":"2001年9月11日に起きた米国への連続テロ。直後から文明の衝突論が再び注目された。","en":"September 11 attacks"},{"t":"ソマリア沖・アデン湾","kind":"place","d":"アフリカ東岸沖の海域。海賊対策のため、日本は2009年から自衛隊の艦艇などを派遣している。","en":"Gulf of Aden"},{"t":"南シナ海","kind":"place","d":"中国と東南アジア諸国に囲まれた海。多くの船が行き交う海上交通路で、領有権をめぐる主張が重なる。","en":"South China Sea"},{"t":"国連海洋法条約","kind":"term","d":"1982年に採択、1994年に発効した海の国際ルール。領海12海里やEEZ200海里などを定める。","en":"UNCLOS"},{"t":"領海","kind":"term","d":"沿岸国の主権が及ぶ、基線から12海里までの海域。他国の船には無害通航権が認められる。","en":"Territorial sea"},{"t":"大陸棚","kind":"term","d":"沿岸国が海底の資源を探査・開発できる、陸地から続く海底の区域。EEZと重なることが多い。","en":"Continental shelf"},{"t":"沖ノ鳥島","kind":"place","d":"東京都に属する日本最南端の島。日本は周辺に約40万平方キロのEEZを主張している。","en":"Okinotorishima"},{"t":"南鳥島","kind":"place","d":"東京都小笠原村に属する日本最東端の島。周辺に広いEEZを持ち、日本の端を示す島の一つ。","en":"Minamitorishima"},{"t":"接続水域","kind":"term","d":"領海の外側で、基線から24海里までの海域。沿岸国が出入国管理などの取締りを行える。","en":"Contiguous zone"},{"t":"サンフランシスコ平和条約","kind":"event","d":"1951年9月に署名、52年4月に発効した、日本と連合国の戦争を終える条約。日本が主権を回復した。","en":"San Francisco Peace Treaty"},{"t":"吉田茂","kind":"person","d":"戦後日本の首相（1878〜1967）。1951年に平和条約と旧日米安全保障条約の署名にあたった。","en":"Shigeru Yoshida"},{"t":"岸信介","kind":"person","d":"1957〜60年の日本の首相。1960年に日米安全保障条約の改定を進めた。","en":"Nobusuke Kishi"},{"t":"日米地位協定","kind":"term","d":"在日米軍の施設の使用や米軍人の法的な地位などを定めた協定。日米安全保障条約の第6条にもとづく。","en":"Status of Forces Agreement"},{"t":"沖縄","kind":"place","d":"在日米軍専用施設の面積の約7割が集まる県。南西諸島の中核で、島嶼防衛でも要の位置にある。","en":"Okinawa"},{"t":"核の傘","kind":"term","d":"核を持つ同盟国が、持たない同盟国への攻撃を核で抑止するという約束。拡大抑止とも呼ばれる。","en":"Nuclear umbrella"},{"t":"択捉島","kind":"place","d":"北方四島で最大の島。日本は固有の領土と主張し、現在はロシアが実効支配している。","en":"Iturup"},{"t":"北方四島","kind":"place","d":"択捉島・国後島・色丹島・歯舞群島の総称。日本は返還を求めている。","en":"Northern Territories"},{"t":"日ソ共同宣言","kind":"event","d":"1956年に日本とソ連が戦争状態を終わらせた宣言。平和条約後に歯舞・色丹を引き渡すとされた。","en":"Soviet-Japanese Joint Declaration"},{"t":"日露和親条約","kind":"event","d":"1855年に下田で結ばれた条約。択捉島と得撫島の間に国境を定めた。","en":"Treaty of Shimoda"},{"t":"樺太・千島交換条約","kind":"e t":"アレクサンドリア図書館","kind":"place","d":"古代エジプトの都市にあった大図書館。エラトステネスはここで館長を務め、地球の測定にも取り組んだ。","en":"Library of Alexandria"},{"t":"シエネ","kind":"place","d":"いまのエジプト南部アスワン付近の古い名。夏至の正午に井戸の底へ日が差すとされ、地球測定の基点に使われた。","en":"Syene"},{"t":"スタディオン","kind":"term","d":"古代ギリシャの距離の単位で、複数形はスタディア。地域で長さが違い、エラトステネスの結果の評価を難しくする。","en":"Stadion"},{"t":"夏至","kind":"term","d":"北半球で昼がいちばん長くなる日。6月下旬ごろで、エラトステネスはこの日の太陽の高さを比べた。","en":"Summer solstice"},{"t":"エラトステネスの篩","kind":"work","d":"素数を見つける古い方法。2から順にその倍数を消していくと素数が残る。名はエラトステネスにちなむ。","en":"Sieve of Eratosthenes"},{"t":"アトラス","kind":"work","d":"地図を一冊にまとめた地図帳。メルカトルが書名に使って広まり、没後の1595年に彼の『アトラス』が出た。","en":"Atlas"},{"t":"航程線","kind":"term","d":"経線と一定の角度で交わりながら進む航路（等角航路）。メルカトル図法では直線で描ける。","en":"Rhumb line"},{"t":"ルーヴェン","kind":"place","d":"いまのベルギーにある大学都市。メルカトルが学び、地球儀などを作った町。","en":"Leuven"},{"t":"地球儀","kind":"term","d":"地球を球の形に縮めた模型。面積や形のゆがみがなく、メルカトルも1541年に大型のものを作った。","en":"Globe"},{"t":"正角図法","kind":"term","d":"地図上の角度が正しく表される図法。ごく小さな範囲で形が保たれる。メルカトル図法がその代表。","en":"Conformal projection"},{"t":"植生","kind":"term","d":"ある地域に生える植物の集まり。気候とよく対応し、ケッペンは植生の分布を気候区分の手がかりにした。","en":"Vegetation"},{"t":"乾燥帯","kind":"term","d":"降水量が蒸発量より少ない地域の気候帯。砂漠気候とステップ気候に分かれる。ケッペンの区分のB。","en":"Arid climate"},{"t":"地質時代の気候","kind":"work","d":"ケッペンとヴェゲナーが1924年に出した共著。過去の気候の変化を、大陸の位置から考えた。","en":"Die Klimate der geologischen Vorzeit"},{"t":"気候学","kind":"term","d":"各地の気候の特徴や成り立ち、変化を調べる学問。ケッペンはその草分けの一人とされる。","en":"Climatology"},{"t":"大陸移動説","kind":"term","d":"大陸は大昔につながっており、のち分かれて動いたとする説。ヴェゲナーが1912年に唱え、のちプレート理論に発展した。","en":"Continental drift"},{"t":"パンゲア","kind":"term","d":"約3億〜2億年前ごろにあったとされる超大陸。ヴェゲナーが、大陸が一つだった時代の名として使った。","en":"Pangaea"},{"t":"グリーンランド","kind":"place","d":"世界最大の島。大部分が氷床に覆われ、ヴェゲナーは複数回調査に加わり、1930年の探検中に亡くなった。","en":"Greenland"},{"t":"大陸と海洋の起源","kind":"work","d":"ヴェゲナーが1915年に出した主著。大陸の輪郭、化石、地層の一致などを根拠に大陸移動を論じた。","en":"The Origin of Continents and Oceans"},{"t":"高橋至時","kind":"person","d":"江戸幕府の天文方。伊能忠敬の師で、19歳年下ながら天文学を教えた。暦の改良（寛政暦）にたずさわった。","en":"Takahashi Yoshitoki"},{"t":"大日本沿海輿地全図","kind":"work","d":"伊能忠敬の測量をもとにした日本地図。大図・中図・小図があり、1821年に完成した。伊能図とも呼ぶ。","en":"Dai Nihon Enkai Yochi Zenzu"},{"t":"天文方","kind":"term","d":"江戸幕府の役職。暦の作成や天文の観測、洋書の翻訳などを担った。伊能忠敬の師の高橋至時もこの役にあった。","en":"Tenmonkata"},{"t":"佐原","kind":"place","d":"いまの千葉県香取市にある利根川沿いの町。伊能忠敬が商家の当主として家業を大きくした。","en":"Sawara"},{"t":"蝦夷地","kind":"place","d":"北海道の古い呼び名。伊能忠敬の最初の測量（1800年）は、蝦夷地の南東岸で行われた。","en":"Ezochi"},{"t":"シーボルト事件","kind":"event","d":"1828年、ドイツ人医師シーボルトが国外持ち出し禁止の日本地図を入手した事件。伊能図の写しが関わった。","en":"Siebold Incident"},{"t":"日本風景論","kind":"work","d":"志賀重昂が1894年に出した風景の評論。日本の気候や地形の特色を論じ、広く読まれた。","en":"Nihon Fukei-ron"},{"t":"南洋時事","kind":"work","d":"志賀重昂が1887年に出した書。軍艦に乗って巡った南太平洋の島々の様子を伝えた。","en":"Nanyo Jiji"},{"t":"政教社","kind":"term","d":"1888年に志賀重昂や三宅雪嶺らが作った結社。雑誌『日本人』を出し、国粋保存を唱えた。","en":"Seikyosha"},{"t":"三宅雪嶺","kind":"person","d":"明治から昭和の評論家・哲学者。志賀重昂らと政教社を作り、雑誌『日本人』で活動した。","en":"Miyake Setsurei"},{"t":"札幌農学校","kind":"place","d":"1876年に札幌で開かれた学校。現在の北海道大学のもとで、志賀重昂もここで学んだ。","en":"Sapporo Agricultural College"},{"t":"火山","kind":"term","d":"マグマが地表に噴き出してできた山。志賀重昂は『日本風景論』で、火山の多さを日本の景観の特色に数えた。","en":"Volcano"},{"t":"海嶺","kind":"term","d":"海底にある長い山脈。大西洋中央海嶺のように、新しい海底が生まれてプレートが広がっていく場所。","en":"Mid-ocean ridge"},{"t":"海溝","kind":"term","d":"海底にある細長く深い溝。プレートが別のプレートの下へ沈み込む場所で、日本海溝などがある。","en":"Oceanic trench"},{"t":"熱帯雨林気候","kind":"term","d":"一年中高温で雨が多い気候（Af）。アマゾン川流域などに広がる。ケッペンの区分では熱帯に入る。","en":"Tropical rainforest climate"},{"t":"砂漠気候","kind":"term","d":"降水量が極めて少ない気候（BW）。サハラ砂漠などにみられ、ケッペンの区分では乾燥帯に入る。","en":"Desert climate"},{"t":"地中海性気候","kind":"term","d":"夏に雨が少なく冬に雨が降る温帯の気候（Cs）。地中海沿岸が代表で、オリーブやぶどうに向く。","en":"Mediterranean climate"},{"t":"温暖湿潤気候","kind":"term","d":"四季がはっきりし、夏に高温多湿となる温帯の気候（Cfa）。日本の大部分がこの気候に入る。","en":"Humid subtropical climate"},{"t":"ツンドラ気候","kind":"term","d":"最も暖かい月でも平均気温が10℃未満の寒帯の気候（ET）。地面が凍り、背の高い樹木は育たない。","en":"Tundra climate"},{"t":"本初子午線","kind":"term","d":"経度0度の基準線で、ロンドンのグリニッジ天文台を通る。1884年の国際会議で決められた。","en":"Prime meridian"},{"t":"日付変更線","kind":"term","d":"日付を一日ずらす境の線。おおむね経度180度に沿って引かれ、国や島の都合で曲げられている。","en":"International Date Line"},{"t":"標準時","kind":"term","d":"ある国や地域が共通に使う基準の時刻。日本は東経135度の時刻を使い、グリニッジ標準時より9時間進む。","en":"Standard time"},{"t":"ハリソンの海洋時計","kind":"work","d":"ジョン・ハリソンが18世紀に作った船用の精密な時計。経度を正確に求める難問を解いた。","en":"Harrison's marine chronometer"},{"t":"正積図法","kind":"term","d":"地図上の面積が実際の比と等しくなる図法。メルカトル図法と違い、面積の比べ方にゆがみが出にくい。","en":"Equal-area projection"},{"t":"ジェット気流","kind":"term","d":"対流圏の上部を吹く非常に強い西風の帯。偏西風の中心部にあたり、飛行機の飛行時間にも影響する。","en":"Jet stream"},{"t":"貿易風","kind":"term","d":"低緯度の地表付近で、東から西へ吹く風。帆船の時代に、貿易の航路を支えた。","en":"Trade winds"},{"t":"季節風","kind":"term","d":"季節によって吹く向きが変わる風で、モンスーンの訳語。日本では夏に南東、冬に北西の風が多い。","en":"Monsoon wind"},{"t":"雨季","kind":"term","d":"一年のうち雨が集中して降る季節。南アジアでは、夏のモンスーンによって雨季がやってくる。","en":"Rainy season"},{"t":"六大陸","kind":"term","d":"ユーラシア、アフリカ、北アメリカ、南アメリカ、オーストラリア、南極の6つの大陸。日本の教科書の区分。","en":"Six continents"},{"t":"三大洋","kind":"term","d":"太平洋、大西洋、インド洋の三つ。陸と海の割合では、海が地球の表面の約7割を占める。","en":"Three major oceans"},{"t":"マリアナ海溝","kind":"place","d":"太平洋西部にある世界最深の海溝。最深部は水深約1万mで、エベレストを沈めても山頂は海面に届かない。","en":"Mariana Trench"},{"t":"マゼラン","kind":"person","d":"ポルトガル出身の航海者。スペイン王の命で西回りの航海に出て、1521年に戦死した。部下が世界周航を成し遂げた。","en":"Ferdinand Magellan"},{"t":"ナイル川","kind":"place","d":"アフリカ北東部を流れる世界有数の長い川。河口の大きな三角州が、古代から農業を支えた。","en":"Nile"},{"t":"ヘロドトス","kind":"person","d":"古代ギリシャの歴史家。エジプトを旅し、ナイル川の河口の土地をギリシャ文字のデルタに例えたとされる。","en":"Herodotus"},{"t":"甲府盆地","kind":"place","d":"山梨県の盆地。笛吹川や釜無川がつくった扇状地が広がり、ぶどうやももの産地として知られる。","en":"Kofu Basin"},{"t":"広島市","kind":"place","d":"太田川の三角州の上に市街地が広がる中国地方の都市。川が分かれて市内を流れる。","en":"Hiroshima"},{"t":"堆積","kind":"term","d":"川や風が運んだ砂や泥が、ある場所に積もること。扇状地や三角州は川の堆積でできる。","en":"Deposition"},{"t":"日本海溝","kind":"place","d":"東北地方の東の沖にある海溝。太平洋プレートが北米プレートの下へ沈み込み、巨大地震の震源になる。","en":"Japan Trench"},{"t":"南海トラフ","kind":"place","d":"駿河湾から九州沖へ続く海底の溝。フィリピン海プレートが沈み込み、大地震が繰り返し起きてきた。","en":"Nankai Trough"},{"t":"津波","kind":"term","d":"海底の地震などで生じる、周期の長い大きな波。「tsunami」は日本語から国際的な学術用語になった。","en":"Tsunami"},{"t":"東北地方太平洋沖地震","kind":"event","d":"2011年3月11日に起きたマグニチュード9.0の地震。日本海溝で太平洋プレートが北米プレートの下に沈む境界で起きた。","en":"2011 Tohoku earthquake"},{"t":"潮目","kind":"term","d":"性質の異なる海水がぶつかる境。親潮と黒潮が出会う三陸沖は、魚が集まる好漁場になる。","en":"Tide rip"},{"t":"対馬海流","kind":"term","d":"黒潮から分かれ、対馬海峡から日本海を北上する暖流。冬の日本海側の降雪に水蒸気を供給する。","en":"Tsushima Current"},{"t":"ニホンウナギ","kind":"term","d":"日本で食べられるウナギ。マリアナ諸島の西の海で生まれ、黒潮に乗って日本の川に向かう。","en":"Japanese eel"},{"t":"黒潮大蛇行","kind":"event","d":"黒潮が紀伊半島の沖で大きく南へ曲がって流れる状態。2017年に始まり、漁獲や気象に影響した。","en":"Kuroshio large meander"},{"t":"暖流","kind":"term","d":"低緯度から高緯度へ流れる、周りより水温の高い海流。黒潮が代表で、反対の性質の流れは寒流という。","en":"Warm current"},{"t":"梅雨前線","kind":"term","d":"初夏に日本付近に停滞する前線。北の冷たい空気と南の暖かい空気の境で、長雨をもたらす。","en":"Baiu front"},{"t":"熱帯低気圧","kind":"term","d":"熱帯の海で発生する低気圧。北西太平洋で最大風速が約17m/s以上になったものを台風と呼ぶ。","en":"Tropical cyclone"},{"t":"伊勢湾台風","kind":"event","d":"1959年9月に紀伊半島に上陸した台風。高潮で5000人を超える死者・行方不明者が出た。","en":"Typhoon Vera (Isewan Typhoon)"},{"t":"気象庁","kind":"term","d":"国の天気予報や地震、火山の監視を担う機関。台風に番号をつけ、進路を発表する。","en":"Japan Meteorological Agency"},{"t":"利根川","kind":"place","d":"関東平野を流れる川。流域面積は日本最大で、江戸時代に流路が東へ付け替えられた。","en":"Tone River"},{"t":"信濃川","kind":"place","d":"長野県と新潟県を流れる日本最長（367km）の川。長野県内では千曲川と呼ぶ。","en":"Shinano River"},{"t":"千曲川","kind":"place","d":"長野県内での信濃川の呼び名。長野盆地などを流れ、新潟県に入ると信濃川と呼ばれる。","en":"Chikuma River"},{"t":"関東平野","kind":"place","d":"日本で最も広い平野。利根川などの土砂と、火山灰が積もった関東ロームの台地を含む。","en":"Kanto Plain"},{"t":"輪中","kind":"term","d":"水害を防ぐため、集落や田を堤防で囲んだ地形。木曽三川の下流の濃尾平野でよく発達した。","en":"Wajuu (polder-like dike settlement)"},{"t":"ナウマン","kind":"person","d":"ドイツ出身の地質学者。明治初期に来日し、東京大学の初代地質学教授として、フォッサマグナを唱えた。","en":"Edmund Naumann"},{"t":"糸魚川-静岡構造線","kind":"place","d":"新潟県糸魚川市から静岡市に至る大断層。フォッサマグナの西縁とされ、東日本と西日本の地質を分ける。","en":"Itoigawa-Shizuoka Tectonic Line"},{"t":"諏訪湖","kind":"place","d":"長野県中部の湖。糸魚川-静岡構造線に沿い、中央構造線の北東端に近いとされる。","en":"Lake Suwa"},{"t":"ナウマンゾウ","kind":"term","d":"数万年前まで日本にいたとされる象。名はナウマンが化石を研究したことにちなむ。","en":"Naumann's elephant"}]},"gram":{"people":[{"id":"panini","name":"パーニニ","full":"パーニニ","en":"Panini","region":"海外","born":-400,"approx":true,"died":null,"country":"古代インド","era":"古代・中世","tagline":"サンスクリット語の文法を約4千の規則にまとめた古代インドの文法家","works":[{"t":"『アシュターディヤーイー』","n":"サンスクリット語の文法を約4千の短い規則で体系化した書。名は「八つの章」の意"},{"t":"シヴァ・スートラ","n":"音を並べた14の句。先頭と末尾の音を示し、音の集まりを短く指す略号を作る"},{"t":"規則の順序と優先の工夫","n":"規則が衝突したときの優先順位まで書き込み、少ない規則で多くの語形を導けるようにした"},{"t":"語根と接辞による語形成","n":"動詞の語根に接辞を足して語を作る仕組みを、規則の形で記述した"}],"anecdotes":["生涯はほとんど分かっていない。北西インドの出身で、紀元前5世紀から4世紀ごろの人とされ、生没年も確定していない。","最期は獅子に襲われて命を落としたという話が伝わるが、史実かどうかは確かめられていない。","主著は文字よりも口承で暗記して伝えられたとされ、極端に切り詰めた短い規則は暗記しやすい形だった。"],"trivia":[{"f":"パーニニの規則は、文法を記号と規則で書く点が現代の形式文法に似ており、コンピュータ言語の文法記述との類似が指摘されてきた。","q":"パーニニの文法書の書き方は、後世のどの分野の記法と似ていると指摘されてきたか。","a":"コンピュータ言語の文法記法","w":["星の運行を予測する天文計算表","音楽の旋律を書き留める楽譜","土地の面積を測る測量の公式集"]},{"f":"シヴァ・スートラは14の句からなり、先頭の音と末尾の合図を指定するだけで、母音全体などの音の集まりを短い略号で指せる。","q":"パーニニが音の集まりを短く指すために使った仕掛けは何か。","a":"音を並べた14の句と末尾の合図","w":["文字の形を分類した表と番号","語の意味を並べた辞書の見出し順","詩の韻律を表す長短の記号列"]},{"f":"ソシュールは若いころサンスクリットを深く学び、1880年の博士論文もサンスクリットの用法を扱った。パーニニの伝統は西洋言語学の土台の一つになった。","q":"ソシュールが博士論文の題材にした言語はどれか。","a":"サンスクリット","w":["古代ギリシア語とその方言","ヘブライ語とアラム語の比較","ゴート語と古高ドイツ語"]}],"related":["サンスクリット","アシュターディヤーイー","シヴァ・スートラ","ウィリアム・ジョーンズ","印欧語族","ガンダーラ","ソシュール","チョムスキー","生成文法"],"look":{"hair":"bun","hc":"#2A2220","face":"normal","beard":"full","bc":"#2A2220","collar":"none","cloth":"#E8DDB5","skin":"#B8825A"}},{"id":"donatus","name":"ドナトゥス","full":"アエリウス・ドナトゥス","en":"Aelius Donatus","region":"海外","born":320,"approx":true,"died":380,"country":"古代ローマ帝国","era":"古代・中世","tagline":"中世まで標準の入門書になったラテン語文法書の著者","works":[{"t":"『アルス・ミノール』","n":"八つの品詞を問答の形で教える短い入門書。初学者の教科書として長く使われた"},{"t":"『アルス・マイヨール』","n":"品詞論や語法の誤り、修辞の型などを論じた、より詳しい文法書（全3巻）"},{"t":"ウェルギリウス注釈","n":"詩人ウェルギリウスの作品への注釈。ほとんどが失われ、一部が伝わる"},{"t":"テレンティウス注釈","n":"喜劇作家テレンティウスへの注釈。ラテン文学研究の資料として残る"}],"anecdotes":["のちに聖書をラテン語に訳したことで知られるヒエロニムスが、青年期にローマでドナトゥスに学んだとされる。","中世の英語やフランス語では、ドナトゥスの名に由来する語が「入門書」や「初歩」の意味で使われた。","15世紀の初期の活版印刷物にも、ドナトゥスの文法書が含まれる。需要の大きい入門書だったためとされる。"],"trivia":[{"f":"『アルス・ round","collar":"collar","cloth":"#3D3D3D"}}],"items":[{"id":"trivium","name":"三学の文法（ラテン語文法）","full":"自由七科の三学のうちの文法","en":"Grammar in the Trivium","region":"海外","category":"品詞・語","when":"古代末から中世（15世紀まで）","where":"ローマ・中世ヨーロッパの学校と大学","era":"古代・中世","tagline":"文法は中世ヨーロッパの学問の入口。ラテン語の習得が教養の基礎だった","facts":[{"t":"三学の一つ","n":"文法・修辞学・論理学を三学といい、算術・幾何・天文・音楽の四科より先に学んだ"},{"t":"標準の教科書","n":"ドナトゥスの入門書と、6世紀初めごろのプリスキアヌスの大文法書が中世の標準だった"},{"t":"文法の役割","n":"文法はラテン語を正しく読み書きする技術で、聖書や古典、法律を学ぶ前提だった"}],"famous":[{"t":"ドナトゥス","n":"『アルス・ミノール』は初学者向けの教科書として中世を通じて写され、使われた"},{"t":"プリスキアヌス","n":"『文法教程』（全18巻）でラテン語文法を体系化した。多数の写本が残る"}],"anecdotes":["中世にラテン語を教えた学校は文法学校と呼ばれ、英語圏では今もグラマー・スクールという名が残る。","文法を意味する語は中世に学問全般や不思議な知識を指す意味にも広がり、魅力を意味する glamour の語源になったとされる。"],"trivia":[{"f":"英語のグラマー・スクールは、もとはラテン語を教える学校の名前で、文法とはラテン語文法のことだった。","q":"もとのグラマー・スクールで中心に教えられていたものは何か。","a":"ラテン語の読み書き","w":["算術と簿記の実務","音楽と舞踊の実技","航海術と天文の観測"]},{"f":"文法を意味する語は、中世に学問や不思議な知識まで指すようになり、魅力を意味する glamour の語源になったとされる。","q":"文法（グラマー）と語源の上でつながるとされる英単語はどれか。","a":"glamour（魅力）","w":["glimmer（かすかな光）","glory（栄光）","gamble（賭け事）"]}],"people":["ドナトゥス"],"related":["ドナトゥス","ラテン語","自由七科","プリスキアヌス","修辞学","論理学"]},{"id":"pos_west","name":"品詞","full":"品詞（パーツ・オブ・スピーチ）","en":"Parts of speech","region":"海外","category":"品詞・語","when":"古代ギリシア・ローマ期に整う","where":"ギリシア・ローマ","era":"古代・中世","tagline":"語を文法上の働きで分けた種類。西洋では八つに分ける伝統が長い","facts":[{"t":"語の分類","n":"語を形や文中の働きによって名詞・動詞などの種類に分けたもの"},{"t":"ギリシアの八品詞","n":"ディオニュシオス・トラクスの文法書では、名詞・動詞・分詞・冠詞・代名詞・前置詞・副詞・接続詞の八つ"},{"t":"ラテン語の八品詞","n":"ラテン語に冠詞はないため、ドナトゥスらは冠詞の代わりに間投詞を数えた"},{"t":"英語の学校文法","n":"名詞・代名詞・動詞・形容詞・副詞・前置詞・接続詞・間投詞の八つに分けるのが伝統的な型"}],"famous":[{"t":"ディオニュシオス・トラクス","n":"紀元前2世紀ごろ、八品詞を示す現存最古の西洋の文法書を著したとされる"},{"t":"ドナトゥス","n":"ラテン語の八品詞を示した入門書が、中世を通じて広く使われた"}],"anecdotes":["現代の英語の学校文法にある八品詞は、2千年近く前のギリシア・ローマの分類を引き継いだものである。","形容詞は、ラテン語の文法では名詞の一種とされていた。のちに独立した品詞として扱われるようになった。"],"trivia":[{"f":"ラテン語には冠詞がないため、ドナトゥスの八品詞は冠詞の代わりに間投詞を数えた。ギリシア語の八品詞には冠詞がある。","q":"ギリシア語の八品詞にあって、ドナトゥスのラテン語の八品詞にない品詞はどれか。","a":"冠詞","w":["分詞","接続詞","前置詞"]},{"f":"日本語の学校文法は、語を十の品詞に分ける。西洋の八品詞に比べて、形容動詞・連体詞・助動詞などを独自に立てる。","q":"日本語の学校文法で、語はいくつの品詞に分けられるか。","a":"十種類","w":["八種類","十二種類","六種類"]}],"people":["ドナトゥス"],"related":["ドナトゥス","名詞","動詞","冠詞","ディオニュシオス・トラクス","品詞（日本語）","三学の文法（ラテン語文法）"]},{"id":"tense_aspect","name":"時制と相","full":"時制（テンス）と相（アスペクト）","en":"Tense and aspect","region":"海外","category":"時制・活用・敬語","when":"古代ギリシア以来の考え方","where":"ギリシア・ヨーロッパほか世界各地","era":"古代・中世","tagline":"出来事がいつか（時制）と、どう捉えるか（相）を分けて考える","facts":[{"t":"時制","n":"出来事が話す時点の前（過去）か、同時（現在）か、後（未来）かを表す形の区別"},{"t":"相","n":"出来事が完了したか、進行中かなど、時間の内側での捉え方の区別"},{"t":"英語の例","n":"現在完了や進行形は、過去・現在という時制と、完了・進行という相の組み合わせで説明される"},{"t":"ロシア語の例","n":"動詞の多くが完了体と不完了体の対をもち、相の区別が文法の中心にある"}],"famous":[{"t":"現在完了","n":"過去に起きた出来事が現在に関わることを表す。英語学習者が混乱しやすい"},{"t":"完了体と不完了体","n":"ロシア語の動詞が、完結した動作と進行・反復の動作を別の形で表し分ける"},{"t":"アオリスト","n":"古代ギリシア語の過去を表す形の一つ。出来事を時間の幅のない点として捉える"}],"anecdotes":["アスペクトという概念は、スラヴ語の動詞の研究のなかで育ち、のちにヨーロッパ各国語の文法にも使われるようになった。","中国語やインドネシア語のように、動詞に時制の語形変化をもたない言語は多い。時間は副詞や文脈で示される。"],"trivia":[{"f":"日本語の「～ている」は、動作の進行（食べている）と結果の状態（割れている）の両方を表し、相の代表例として研究されてきた。","q":"日本語の「ている」が表す意味として正しいものはどれか。","a":"動作の進行と、結果の状態の両方","w":["過去に終わってしまった動作だけを表す","これから起こる予定の動作だけを表す","何度も繰り返される習慣だけを表す"]},{"f":"ロシア語では多くの動詞が完了体と不完了体の対になっていて、「読む」だけでも二つの形を場面によって使い分ける。","q":"ロシア語の動詞に多く見られる、完了と未完了を区別する仕組みを何というか。","a":"体（アスペクト）","w":["格（ケース）","性（ジェンダー）","数（ナンバー）"]}],"people":[],"related":["仮定法","活用","現在完了","完了体と不完了体","アオリスト","進行形"]},{"id":"subjunctive","name":"仮定法","full":"仮定法（接続法）","en":"Subjunctive mood","region":"海外","category":"時制・活用・敬語","when":"ラテン語・ギリシア語の時代から","where":"ヨーロッパの諸言語","era":"古代・中世","tagline":"事実でないことや願望を、動詞の形で示す言い方","facts":[{"t":"基本の働き","n":"事実と違うことや、実現しにくいことを述べるときの動詞の形。英語では過去形などを借りる"},{"t":"仮定法過去","n":"現在の事実と違うことを過去形で表す。be動詞は人称を問わず were を使うのが標準"},{"t":"接続法","n":"フランス語・ドイツ語などでは接続法と呼ばれ、願望・疑い・要求の後で動詞が語形変化する"},{"t":"仮定法現在","n":"要求・提案を表す節で動詞の原形を使う。I suggest that he go のような形"}],"famous":[{"t":"仮定法過去","n":"現在の事実と反対の仮定を過去形で表す。If I were you の形が有名"},{"t":"仮定法過去完了","n":"過去の事実と反対の仮定を、過去完了形で表す"},{"t":"ラテン語の接続法","n":"ラテン語では願望・可能性・目的などを接続法で表した"}],"anecdotes":["英語の仮定法は昔に比べて衰えており、口語では If I was you のように was を使う人も多い。標準的な書き言葉では were が好まれる。","ドイツ語には接続法第二式があり、礼儀正しい依頼や丁寧な言い方にも使われる。「もし～なら」だけの文法ではない。"],"trivia":[{"f":"God save the Queen の save は、三人称なのに s がつかない。仮定法現在の名残で、決まり文句に残っている。","q":"God save the Queen の動詞の形は、どの文法形式の名残とされるか。","a":"仮定法現在（願望を表す原形）","w":["命令法（命令を表す動詞の形）","不定詞（to のつかない原形）","直説法の三人称単数形"]},{"f":"ドイツ語の接続法第二式は、丁寧な依頼を作るときにも使われる。仮定の意味がなくても、控えめな言い方になる。","q":"ドイツ語で丁寧な依頼にも使われる、仮定法に当たる語形はどれか。","a":"接続法第二式","w":["命令法の丁寧形","直説法の過去完了形","受動態の現在形"]}],"people":[],"related":["直説法","接続法","反事実","時制と相","ラテン語"]},{"id":"passive","name":"受動態","full":"受動態（受け身）","en":"Passive voice","region":"海外","category":"文の構造","when":"古代ギリシア・ローマ以来の文法","where":"ヨーロッパの諸言語ほか","era":"古代・中世","tagline":"動作を受ける側を主語にして述べる文の形","facts":[{"t":"基本の形","n":"能動態の目的語を主語に立てる文の形。英語は be動詞と過去分詞で作る"},{"t":"動作主","n":"動作をした者は by 句で示せるが、省かれることが多い。不明・不要なときに便利"},{"t":"ラテン語の受動","n":"ラテン語は現在などの時制では、動詞の語尾で受動を表す"},{"t":"中動態","n":"ギリシア語やサンスクリットには、動作が主語自身に関わる意味を表す態がある"}],"famous":[{"t":"英語の受動態","n":"be動詞と過去分詞で作る。The window was broken. のように受け手を主語にする"},{"t":"中動態","n":"古代ギリシア語などで、動作が主語自身に及ぶ意味を表す第三の態"},{"t":"日本語の受身","n":"「れる・られる」で作る。迷惑の受身など、英語にない用法もある"}],"anecdotes":["英語の文章作法書では、能動態のほうが力強く短くなるとして、むやみに受動態を使わないよう勧めるものが多い。","日本語の受身には、「雨に降られた」のように迷惑を受ける意味を含むものがあり、英語の受動態に直訳しにくい。"],"trivia":[{"f":"日本語の「雨に降られる」は、自動詞の「降る」から作った受身で、迷惑の気持ちを含む。英語では同じ形の受動態は作れない。","q":"日本語の「雨に降られた」のような受身の特徴は何か。","a":"自動詞からも作れ、迷惑の意味を含む","w":["他動詞からしか作れず、敬意を含む","主語が必ず人でなければならず、願望を含む","過去の出来事にしか使えず、推量を含む"]},{"f":"中動態はインド・ヨーロッパ語の古い段階にあった態で、古代ギリシア語では能動態・中動態・受動態の三つがそろっていた。","q":"古代ギリシア語の動詞が区別した態は、能動態、受動態とあと一つは何か。","a":"中動態","w":["使役態","反復態","可能態"]}],"people":[],"related":["能動態","中動態","動作主","「れる・られる」の4つの意味","ラテン語","時制と相"]},{"id":"generative","name":"生成文法","full":"生成文法（変形生成文法）","en":"Generative grammar","region":"海外","category":"文の構造","when":"1950年代後半に提唱","where":"アメリカ（MIT）","era":"現代","tagline":"人間は有限の規則で無限の文を作れる、と考える文法理論","facts":[{"t":"基本の発想","n":"有限個の規則から、無限に多くの文を作り出す仕組みとして文法をとらえる"},{"t":"初期の理論","n":"1957年の『統辞構造論』で提唱され、句構造規則と変形規則で文の構造を説明した"},{"t":"生得的な能力","n":"人間の言語能力は、生まれつきの普遍文法に支えられているという仮説をとる"},{"t":"その後の展開","n":"1980年代の原理とパラメータ、1990年代のミニマリスト・プログラムへと発展した"}],"famous":[{"t":"チョムスキー","n":"提唱者。1950年代の言語学に新しい方向を示した"},{"t":"句構造規則","n":"文を名詞句や動詞句などの部分に分け、木の形で表す規則"},{"t":"原理とパラメータ","n":"言語の共通性を原理、違いをパラメータの設定で説明しようとした"}],"anecdotes":["子どもは、聞いたことのない文を自在に作れるようになる。この創造性が生成文法の出発点の一つだった。","生成文法は計算機科学の形式言語理論とも結びつき、プログラミング言語の文法を規則で表す考え方に影響した。"],"trivia":[{"f":"生成文法でいう「文法的」は、学校で習う正しい言い方という意味ではなく、母語話者が自然だと感じる文かどうかを指す。","q":"生成文法で「文法的な文」とは、おおよそ何を指すか。","a":"母語話者が自然だと判断できる文","w":["学校の教科書の規則に反しない文","辞書に載った語だけで作られた文","書き言葉で長く使われてきた文"]},{"f":"子どもが耳にする言語データは乏しいのに、数年で母語を使いこなす。この点を指摘する議論は刺激の貧困と呼ばれる。","q":"子どもが聞く言語データが乏しいのに母語を獲得できるという議論は、何と呼ばれるか。","a":"刺激の貧困","w":["入力の過剰","模倣の連鎖","語彙の飽和"]}],"people":["チョムスキー"],"related":["チョムスキー","普遍文法","句構造規則","統辞構造論","原理とパラメータ","刺激の貧困","ミニマリスト・プログラム"]},{"id":"pos_ja","name":"品詞（日本語）","full":"日本語の品詞（学校文法の十品詞）","en":"Parts of speech in Japanese","region":"日本","category":"品詞・語","when":"明治期に西洋文法を参考に整備","where":"日本","era":"明治・大正","tagline":"学校文法では語を十の品詞に分ける","facts":[{"t":"十品詞","n":"名詞・動詞・形容詞・形容動詞・副詞・連体詞・接続詞・感動詞・助動詞・助詞の十種類"},{"t":"自立語と付属語","n":"単独で文節を作れる自立語と、作れない付属語に分かれる。助動詞と助詞が付属語"},{"t":"活用の有無","n":"活用があるのは、動詞・形容詞・形容動詞・助動詞の四つ"},{"t":"成り立ち","n":"江戸期の国学の流れを受け、明治期に大槻文彦らが西洋文法を参考に品詞分類を整えた"}],"famous":[{"t":"大槻文彦","n":"『広日本文典』などで、西洋文法を参考に日本語の品詞分類を示した"},{"t":"橋本進吉","n":"文節を基にした品詞分類を示し、学校文法の土台になった"},{"t":"山田孝雄","n":"独自の文法体系を立て、品詞分類の議論をリードした"}],"anecdotes":["品詞の数え方は学者によって異なる。形容動詞を認めない説や、助動詞を独立の品詞としない説もある。","江戸時代の国学者は、語を名詞のような語と動詞のような語、そして「てにをは」に大きく分けて考えた。"],"trivia":[{"f":"学校文法の形容動詞は、外国人向けの日本語教育では、ナ形容詞として形容詞と並べて扱うことが多い。","q":"学校文法の形容動詞は、日本語教育ではふつう何と呼ばれるか。","a":"ナ形容詞","w":["イ形容詞","状態動詞","形式名詞"]},{"f":"学校文法の十品詞のうち、活用するのは動詞・形容詞・形容動詞・助動詞の四つだけで、名詞や助詞は形が変わらない。","q":"学校文法の十品詞のうち、活用がある品詞の組み合わせはどれか。","a":"動詞・形容詞・形容動詞・助動詞","w":["動詞・形容詞・副詞・助動詞","動詞・形容詞・形容動詞・助詞","名詞・動詞・形容詞・助動詞"]}],"people":["大槻文彦","橋本進吉"],"related":["大槻文彦","橋本進吉","文節","自立語と付属語","山田孝雄","活用","助詞と助動詞","学校文法"]},{"id":"katsuyou","name":"活用","full":"活用（語形変化）","en":"Conjugation","region":"日本","category":"時制・活用・敬語","when":"江戸期に研究が大きく進む","where":"日本","era":"江戸","tagline":"語が後に続く語に応じて形を変える仕組み。六つの活用形で整理する","facts":[{"t":"活用とは","n":"動詞・形容詞・形容動詞・助動詞が、後に続く語や文中の働きに応じて語尾を変えること"},{"t":"活用形","n":"口語は未然・連用・終止・連体・仮定・命令の六つ。文語は仮定の代わりに已然形をおく"},{"t":"動詞の種類","n":"口語は五段・上一段・下一段・カ変・サ変の五種類。文語は四段・上二段・下二段なども"},{"t":"語幹と語尾","n":"活用で変わらない部分を語幹、変わる部分を活用語尾とする"}],"famous":[{"t":"五段活用","n":"「書く」「読む」のように、語尾がア・イ・ウ・エ・オの五つの段にわたって変わる"},{"t":"上一段・下一段","n":"「見る」「食べる」のように、イ段またはエ段の音だけで変わる"},{"t":"カ変・サ変","n":"「来る」と「する」の系統だけ。不規則に変化する"}],"anecdotes":["活用の研究は江戸時代に大きく進み、本居宣長の長男・春庭は『詞の八衢』で動詞の活用を整理した。","五段活用の名は、「書かない・書きます・書く・書けば・書こう」のように、語尾が五つの段にわたることに由来する。"],"trivia":[{"f":"本居春庭は目が不自由になってからも研究を続け、『詞の八衢』で動詞の活用を体系的にまとめたことで知られる。","q":"動詞の活用をまとめた『詞の八衢』の著者・本居春庭は、宣長にとってどんな人物か。","a":"宣長の長男","w":["宣長の兄","宣長の孫","宣長の甥"]},{"f":"口語の動詞の活用は、五段・上一段・下一段・カ変・サ変の五種類。カ変とサ変に属する語は、それぞれ「来る」「する」の系統だけである。","q":"口語の動詞の活用の種類は全部でいくつか。","a":"五つ","w":["三つ","四つ","七つ"]}],"people":["橋本進吉","本居宣長"],"related":["本居宣長","橋本進吉","活用形","五段活用","語幹と活用語尾","本居春庭","詞の八衢"]},{"id":"particles","name":"助詞と助動詞","full":"助詞・助動詞（てにをは）","en":"Particles and auxiliary verbs","region":"日本","category":"品詞・語","when":"古くは「てにをは」として注目","where":"日本","era":"江戸","tagline":"日本語の文をつなぐ、活用のない助詞と活用する助動詞","facts":[{"t":"助詞","n":"活用せず、語と語の関係を示す（が・を・に）、意味を添える（は・も）、文を結ぶ（か・ね）などの働きをもつ"},{"t":"助動詞","n":"活用する付属語。受身・使役・推量・過去・否定・丁寧などの意味を動詞などに加える"},{"t":"助詞の種類","n":"格助詞・副助詞・接続助詞・終助詞などに分かれる。係助詞を立てる文法もある"},{"t":"てにをは","n":"助詞・助動詞をまとめた古い呼び名で、語と語をつなぐ働きに注目した言い方"}],"famous":[{"t":"てにをは","n":"語の最後に付く語の総称。漢文を読み下す点の位置に由来するという説がある"},{"t":"格助詞","n":"「が・を・に・へ・と・から・より・で・の」など。名詞と述語との関係を示す"},{"t":"れる・られる","n":"受身・可能・自発・尊敬の四つの意味をもつ、代表的な助動詞"}],"anecdotes":["本居宣長は『てにをは紐鏡』などで助詞に注目し、係り結びなどの規則を図に表した。","助詞の「は」と「が」の違いは、日本語学で長く議論されてきた問題で、今も研究が続いている。"],"trivia":[{"f":"助詞の「は」と「が」の使い分けは、日本語を学ぶ外国人にも日本語学者にも難問で、「は」は話題を示すと説明されることが多い。","q":"「は」と「が」の違いの説明で、「は」の働きとされることが多いのはどれか。","a":"すでに話題になっていることを示す","w":["動作を行う人を必ず示す","文の最後で推量を表す","動作の対象を直接示す"]},{"f":"「てにをは」の名は、漢文の読み下しで四隅に打つ点の読みに由来するという説がある。点の位置が助詞を表した。","q":"「てにをは」の名の由来として有力視される説はどれか。","a":"漢文を訓読するための点の読み","w":["四つの和歌の初句の頭文字","神社の祝詞の冒頭にある四語","仏典の題名の頭にある四文字"]}],"people":["本居宣長"],"related":["本居宣長","てにをは","格助詞","係助詞","「れる・られる」の4つの意味","係り結び","品詞（日本語）"]},{"id":"rareru","name":"「れる・られる」の4つの意味","full":"助動詞「れる・られる」（受身・可能・自発・尊敬）","en":"The four meanings of reru and rareru","region":"日本","category":"時制・活用・敬語","when":"古語の「る・らる」から","where":"日本","era":"","tagline":"受身・可能・自発・尊敬を一つの形で表す助動詞","facts":[{"t":"四つの意味","n":"受身「ほめられる」、可能「起きられる」、自発「故郷が思われる」、尊敬「先生が来られる」"},{"t":"つき方","n":"五段活用の動詞には「れる」、それ以外の動詞には「られる」がつく"},{"t":"成り立ち","n":"古語の「る・らる」から受け継がれ、四つの意味もそこに由来する"},{"t":"見分け方","n":"言い換えで見分ける。「できる」なら可能、自然にそうなるなら自発、敬意があれば尊敬"}],"famous":[{"t":"受身","n":"「先生にほめられる」。動作を受ける側を主語にする言い方"},{"t":"可能","n":"「食べられる」。「食べることができる」と言い換えられる"},{"t":"自発","n":"「懐かしく思われる」のように、自然にそうなる意味。使える動詞は限られる"},{"t":"尊敬","n":"「社長が来られる」。敬意を表す。「お～になる」でも言い換えられる"}],"anecdotes":["「食べれる」のように「ら」を抜く言い方は、ら抜き言葉と呼ばれる。若い世代から広がり、今は幅広い年代で使われる。","どの意味かは文脈で決まるため、「先生が来られる」は尊敬だけでなく、可能の意味にもなりうる。"],"trivia":[{"f":"ら抜き言葉は、可能の「食べられる」から「ら」を落として「食べれる」と言うもの。受身や尊敬の形と区別でき、意味の混乱を避ける面があると指摘される。","q":"ら抜き言葉が広まる理由として指摘される点は何か。","a":"受身や尊敬と、可能の形を区別できる","w":["古語の活用の形が復活したから","敬語としての丁寧さが増すから","方言の語尾が標準語に混じるから"]},{"f":"自発の「れる」は、「思われる」「感じられる」「偲ばれる」など、心の働きを表す限られた動詞につき、自然とそうなる気持ちを表す。","q":"自発の「れる・られる」がつく動詞として、典型的なのはどれか。","a":"思う・感じる・偲ぶなど心の動きを表す動詞","w":["走る・跳ぶ・投げるなど体の動作を表す動詞","食べる・飲む・読むなど物を取り込む動詞","壊す・割る・切るなど他へ働きかける動詞"]}],"people":[],"related":["受身","可能","自発","尊敬語","ら抜き言葉","助詞と助動詞","敬語（尊敬・謙譲・丁寧）"]},{"id":"keigo","name":"敬語（尊敬・謙譲・丁寧）","full":"敬語（三分類と五分類）","en":"Honorifics (keigo)","region":"日本","category":"時制・活用・敬語","when":"古代から。現行の五分類は2007年","where":"日本","era":"","tagline":"話し手と聞き手、話題の人物との関係を言葉で表す仕組み","facts":[{"t":"三分類から五分類へ","n":"従来は尊敬語・謙譲語・丁寧語の三分類。2007年の文化審議会答申『敬語の指針』で五分類が示された"},{"t":"五分類","n":"尊敬語・謙譲語Ⅰ・謙譲語Ⅱ（丁重語）・丁寧語・美化語"},{"t":"尊敬語と謙譲語Ⅰ","n":"尊敬語は相手の行為を高め、謙譲語Ⅰは自分の行為を低めて相手を立てる"},{"t":"丁寧語と丁重語","n":"丁寧語は「です・ます」。謙譲語Ⅱは「参る」「申す」で、聞き手に丁重に述べる"}],"famous":[{"t":"尊敬語","n":"「おっしゃる」「いらっしゃる」「召し上がる」。相手や話題の人の動作を高める"},{"t":"謙譲語","n":"「申し上げる」「伺う」「いただく」。自分側の動作をへりくだる"},{"t":"丁寧語","n":"「です」「ます」「ございます」。聞き手に丁寧に述べる"}],"anecdotes":["『源氏物語』では敬語の使い分けで、誰の行為か、誰と誰がどんな関係かを読み取れる。","「おっしゃられる」のように敬語を重ねる二重敬語は、一般に誤りとされることが多い。"],"trivia":[{"f":"2007年の「敬語の指針」で三分類が五分類に改められ、謙譲語は「伺う」型と「参る」型に分けられた。","q":"2007年の「敬語の指針」で、謙譲語はどのように整理されたか。","a":"謙譲語Ⅰと謙譲語Ⅱ（丁重語）に分けられた","w":["尊敬語に統合されて廃止された","謙譲語の名称が丁寧語に改められた","謙譲語は男性語と女性語に分けられた"]},{"f":"「参る」は謙譲語Ⅱで、自分側の動作にだけ使う。相手の動作に使った「社長が参られました」は、一般に適切でないとされる。","q":"「社長が参られました」が一般に適切でないとされる理由は何か。","a":"「参る」は自分側の動作に使う語だから","w":["「れる」は目上に使ってはならないから","過去形に敬語は使えないから","「社長」は尊敬語を受けない役職名だから"]}],"people":[],"related":["尊敬語","謙譲語","丁寧語","美化語","二重敬語","敬語の指針","源氏物語","「れる・られる」の4つの意味"]},{"id":"kakarimusubi","name":"係り結び","full":"係り結びの法則","en":"Kakari-musubi","region":"日本","category":"文の構造","when":"上代から中古に栄え、中世に衰える","where":"日本","era":"","tagline":"「ぞ・なむ・や・か・こそ」が文末の形を決める古文の決まり","facts":[{"t":"基本の決まり","n":"文中に係助詞「ぞ・なむ・や・か・こそ」があると、文末の活用形が変わる。強調や疑問を表す"},{"t":"結びの形","n":"「ぞ・なむ・や・か」の結びは連体形、「こそ」の結びは已然形"},{"t":"例外","n":"文が続いて結びが現れない結びの流れや、結びが省かれる場合もある"},{"t":"衰退","n":"中世以降は次第に衰え、現代語には決まりとして残らない"}],"famous":[{"t":"「こそ」","n":"強い強調を表す。結びは已然形になる。現代語でも強調の語として残る"},{"t":"「ぞ」「なむ」","n":"強調を表し、結びは連体形になる"},{"t":"「や」「か」","n":"疑問や反語を表し、結びは連体形になる"}],"anecdotes":["本居宣長は『てにをは紐鏡』『詞の玉緒』で係り結びを整理し、結びの活用形の規則を示した。","現代語でも「こそ」を使った強調は残るが、結びの活用形を変える決まりは失われた。"],"trivia":[{"f":"現代語の動詞の終止形は、古典語の連体形が終止形に取って代わったもの。係り結びの衰えと深く関わるとされる。","q":"現代語の終止形は、古典語のどの活用形を受け継いだものか。","a":"連体形","w":["已然形","連用形","未然形"]},{"f":"係助詞には「は」「も」もあるが、これらは結びの活用形を変えない。係り結びを起こすのは五つだけとされる。","q":"係助詞のうち、結びの活用形を変える働きをもたないのはどれか。","a":"「は」","w":["「なむ」","「や」","「こそ」"]}],"people":["本居宣長"],"related":["本居宣長","係助詞","連体形","已然形","結びの流れ","てにをは紐鏡","詞の玉緒"]}],"glossary":[{"t":"サンスクリット","kind":"term","d":"古代インドの学問語・聖典語。パーニニが文法を規則にまとめ、形が固定された。","en":"Sanskrit"},{"t":"アシュターディヤーイー","kind":"work","d":"パーニニの文法書。約4千の短い規則でサンスクリットの語形と音の変化を記述する。","en":"Ashtadhyayi"},{"t":"シヴァ・スートラ","kind":"work","d":"パーニニの文法で使う、音を並べた14の句。音の集まりを短い略号で指すために用いる。","en":"Shiva Sutras"},{"t":"ウィリアム・ジョーンズ","kind":"person","d":"18世紀のイギリスの東洋学者。1786年にサンスクリットとギリシア語・ラテン語の類縁を指摘した。","en":"William Jones"},{"t":"印欧語族","kind":"term","d":"英語・ラテン語・サンスクリットなどを含む、共通の祖語から分かれた大きな語族。","en":"Indo-European languages"},{"t":"ガンダーラ","kind":"place","d":"古代インド北西部の地域。現在のパキスタン北部からアフガニスタン東部にあたり、パーニニの出身地とされる。","en":"Gandhara"},{"t":"ラテン語","kind":"term","d":"古代ローマの言語。中世ヨーロッパでも学問と教会の共通語で、文法教育の中心だった。","en":"Latin"},{"t":"アルス・ミノール","kind":"work","d":"ドナトゥスの短い文法入門書。八つの品詞を問答の形で教え、中世の学校で広く使われた。","en":"Ars minor"},{"t":"ヒエロニムス","kind":"person","d":"4世紀の聖書学者。ローマでドナトゥスに学び、のちに聖書をラテン語に訳した。","en":"Jerome"},{"t":"グーテンベルク","kind":"person","d":"15世紀ドイツの活版印刷の発明者。初期の印刷物にドナトゥスの文法書の断片が残る。","en":"Gutenberg"},{"t":"マインツ","kind":"place","d":"ドイツ中西部の都市。グーテンベルクが活版印刷を実用化した地とされる。","en":"Mainz"},{"t":"プリスキアヌス","kind":"person","d":"6世紀初めの文法家。全18巻の『文法教程』を著し、中世のラテン語文法の基礎になった。","en":"Priscian"},{"t":"ラング","kind":"term","d":"ソシュールの用語で、社会に共有された言語の体系。個人の発話であるパロールと区別する。","en":"langue"},{"t":"パロール","kind":"term","d":"ソシュールの用語で、個人が実際に話す・書く行為。ラングが具体的に使われた姿にあたる。","en":"parole"},{"t":"シニフィアン","kind":"term","d":"ソシュールの用語で、記号の音や文字の側面にあたる音のまとまり。「能記」ともいう。","en":"signifiant"},{"t":"シニフィエ","kind":"term","d":"ソシュールの用語で、記号が指す意味や概念の側面。「所記」ともいう。","en":"signifie"},{"t":"一般言語学講義","kind":"work","d":"ソシュールの没後1916年に、弟子が講義ノートから編んだ本。現代言語学の出発点とされる。","en":"Course in General Linguistics"},{"t":"共時態と通時態","kind":"term","d":"ある時点の言語体系を見るのが共時態、時間に沿う変化を見るのが通時態。ソシュールが区別した。","en":"synchrony and diachrony"},{"t":"喉音理論","kind":"term","d":"印欧語の祖語に喉の音があったとする説。ソシュールが予言し、後にヒッタイト語で裏づけられた。","en":"laryngeal theory"},{"t":"ジュネーヴ","kind":"place","d":"スイスの都市。ソシュールが生まれ育ち、晩年に大学で講義を行った。","en":"Geneva"},{"t":"普遍文法","kind":"term","d":"すべての人間の言語の基礎にあるとされる、生まれつきの文法の枠組み。チョムスキーが提唱した。","en":"Universal Grammar"},{"t":"統辞構造論","kind":"work","d":"1957年のチョムスキーの著作。文法を、文を生み出す規則の体系として示した。","en":"Syntactic Structures"},{"t":"チョムスキー階層","kind":"term","d":"形式言語を規則の強さで四つの型に分けた分類。チョムスキーが提案し、計算機科学で使われる。","en":"Chomsky hierarchy"},{"t":"ミニマリスト・プログラム","kind":"term","d":"1990年代にチョムスキーが提唱した、文法の仕組みを最小限に絞る研究方針。","en":"Minimalist Program"},{"t":"スキナー","kind":"person","d":"20世紀アメリカの行動主義心理学者。言語も学習で身につくとし、チョムスキーの批判を受けた。","en":"B. F. Skinner"},{"t":"古事記伝","kind":"work","d":"本居宣長が約35年かけて書いた『古事記』の注釈書。全44巻で、1798年に完成した。","en":"Kojikiden"},{"t":"賀茂真淵","kind":"person","d":"江戸中期の国学者。1763年に松坂で宣長と会い、古事記の研究を勧めたとされる。","en":"Kamo no Mabuchi"},{"t":"松坂の一夜","kind":"event","d":"1763年、伊勢松坂の宿で宣長が賀茂真淵と初めて会った出来事。宣長の古事記研究の転機とされる。","en":"Night at Matsuzaka"},{"t":"国学","kind":"term","d":"江戸時代に興った、日本の古典から古代の思想や言葉を探る学問。本居宣長が大成した。","en":"Kokugaku"},{"t":"もののあはれ","kind":"term","d":"宣長が『源氏物語』の本質とした、物事に触れて心が深く動くこと。","en":"mono no aware"},{"t":"言海","kind":"work","d":"大槻文彦が編んだ近代的な国語辞典。1889年から91年にかけて刊行され、語源や品詞も記す。","en":"Genkai"},{"t":"大言海","kind":"work","d":"『言海』を大幅に増補した大辞典。大槻文彦の没後、1930年代に刊行された。","en":"Daigenkai"},{"t":"広日本文典","kind":"work","d":"大槻文彦の文法書（1897年）。西洋文法を参考に日本語の品詞や活用を整理した。","en":"Ko-Nihon Bunten"},{"t":"五十音順","kind":"term","d":"語をア・イ・ウ・エ・オの順に並べる配列。『言海』が大型辞書で採用し、のちに主流となった。","en":"gojuon order"},{"t":"文節","kind":"term","d":"文を実際の言葉として不自然でない程度に区切った、最も短いひと区切り。橋本進吉が定義した。","en":"bunsetsu"},{"t":"橋本文法","kind":"term","d":"橋本進吉の文法体系。文節を軸に品詞や文の構造を整理し、学校文法の基礎となった。","en":"Hashimoto grammar"},{"t":"学校文法","kind":"term","d":"中学・高校の国語で教える文法。橋本文法を基にして、十品詞などを教える。","en":"school grammar"},{"t":"上代特殊仮名遣","kind":"term","d":"奈良時代の万葉仮名に見られる使い分け。橋本進吉らの研究で、母音八つの説につながった。","en":"Jodai tokushu kanazukai"},{"t":"万葉仮名","kind":"term","d":"漢字の音や訓を借りて日本語を書き表す用法。『万葉集』に多く見られる。","en":"man'yogana"},{"t":"山田孝雄","kind":"person","d":"明治から昭和の国語学者。独自の山田文法を立て、品詞や文の構造を論じた。","en":"Yamada Yoshio"},{"t":"言語過程説","kind":"term","d":"言語を物でなく、話す・聞く・書く・読むという人の行為の過程とみる、時枝誠記の説。","en":"language process theory"},{"t":"国語学原論","kind":"work","d":"時枝誠記の主著（1941年）。言語過程説を体系的に説いた。","en":"Kokugogaku Genron"},{"t":"詞と辞","kind":"term","d":"時枝誠記の分類。概念を表す語を詞、話し手の判断や感情を表す語を辞とする。","en":"shi and ji"},{"t":"入れ子型構造","kind":"term","d":"時枝誠記が示した文の構造。辞が詞を包み、さらに別の辞が包む入れ子の形になる。","en":"nested structure"},{"t":"自由七科","kind":"term","d":"中世ヨーロッパの教養の基本。文法・修辞学・論理学の三学と、算術・幾何・天文・音楽の四科。","en":"seven liberal arts"},{"t":"修辞学","kind":"term","d":"説得力のある話し方や文章の技術。三学の一つで、文法の次に学ばれた。","en":"rhetoric"},{"t":"論理学","kind":"term","d":"正しい推論の仕方を扱う学問。三学の一つで、弁証術ともいう。","en":"logic"},{"t":"名詞","kind":"term","d":"人や物、事柄の名を表す品詞。ラテン語の伝統文法では形容詞も名詞に含めた。","en":"noun"},{"t":"動詞","kind":"term","d":"動作や状態を表し、時制などで形を変える品詞。ギリシア・ローマの文法でも基本の品詞だった。","en":"verb"},{"t":"冠詞","kind":"term","d":"名詞の前につき、特定か不特定かなどを示す語。ギリシア語にはあるが、ラテン語にはない。","en":"article"},{"t":"ディオニュシオス・トラクス","kind":"person","d":"紀元前2世紀ごろのギリシアの文法家。八品詞を示す現存最古の文法書の著者とされる。","en":"Dionysius Thrax"},{"t":"現在完了","kind":"term","d":"過去の出来事が現在に関わることを表す形。英語は have と過去分詞で作る。","en":"present perfect"},{"t":"完了体と不完了体","kind":"term","d":"ロシア語などで、完結した動作と進行や反復の動作を、別の動詞の形で表し分ける仕組み。","en":"perfective and imperfective"},{"t":"アオリスト","kind":"term","d":"古代ギリシア語の過去を表す形の一つ。出来事を時間の幅のない点として捉える。","en":"aorist"},{"t":"進行形","kind":"term","d":"動作が進行中であることを表す形。英語は be動詞と現在分詞（-ing）で作る。","en":"progressive"},{"t":"直説法","kind":"term","d":"事実をそのまま述べる動詞の形。仮定法（接続法）と対比される。","en":"indicative mood"},{"t":"接続法","kind":"term","d":"フランス語やドイツ語などで、願望・疑い・要求を表す動詞の形。仮定法にあたる。","en":"subjunctive"},{"t":"反事実","kind":"term","d":"事実と反対のことを仮に述べること。英語では仮定法過去や仮定法過去完了で表す。","en":"counterfactual"},{"t":"能動態","kind":"term","d":"動作をする側を主語にする文の形。受動態と対になる。","en":"active voice"},{"t":"中動態","kind":"term","d":"古代ギリシア語などにあった、動作が主語自身に及ぶことを表す態。能動と受動の中間にあたる。","en":"middle voice"},{"t":"動作主","kind":"term","d":"動作を行う側。受動態の文では by 句や「に」で示されたり、省略されたりする。","en":"agent"},{"t":"句構造規則","kind":"term","d":"文を名詞句・動詞句などの部分に分けて木の形で表す規則。生成文法の基本の道具。","en":"phrase structure rule"},{"t":"原理とパラメータ","kind":"term","d":"1980年代の生成文法の枠組み。共通の原理と、言語ごとに値が違うパラメータで説明する。","en":"Principles and Parameters"},{"t":"刺激の貧困","kind":"term","d":"子どもが耳にする言語データは乏しいのに母語を習得できる、という生成文法の議論。","en":"poverty of the stimulus"},{"t":"自立語と付属語","kind":"term","d":"単独で文節を作れる語が自立語、作れない語が付属語。助詞と助動詞は付属語にあたる。","en":"independent and ancillary words"},{"t":"活用形","kind":"term","d":"活用する語の語形のこと。口語は未然・連用・終止・連体・仮定・命令の六つに分ける。","en":"inflected form"},{"t":"五段活用","kind":"term","d":"語尾がア・イ・ウ・エ・オの五段にわたって変わる口語動詞の活用。「書く」「読む」など。","en":"godan conjugation"},{"t":"語幹と活用語尾","kind":"term","d":"活用で変わらない部分が語幹、変わる部分が活用語尾。「書く」では「書」が語幹にあたる。","en":"stem and ending"},{"t":"本居春庭","kind":"person","d":"宣長の長男。江戸後期の国学者で、目が不自由になりながら動詞の活用を体系化した。","en":"Motoori Haruniwa"},{"t":"詞の八衢","kind":"work","d":"本居春庭の江戸後期の著書。動詞の活用を整理し、活用研究の基礎になった。","en":"Kotoba no Yachimata"},{"t":"てにをは","kind":"term","d":"助詞や助動詞などの総称。語と語をつなぐ働きに注目した古い呼び名。","en":"teniwoha"},{"t":"格助詞","kind":"term","d":"「が・を・に・の」など。名詞が文中で他の語とどんな関係にあるかを示す助詞。","en":"case particle"},{"t":"係助詞","kind":"term","d":"「は・も・ぞ・なむ・や・か・こそ」など。意味を添え、古文では結びの形を変えるものがある。","en":"kakari particle"},{"t":"受身","kind":"term","d":"動作を受ける側を主語にする言い方。「ほめられる」。「れる・られる」の用法の一つ。","en":"passive (ukemi)"},{"t":"可能","kind":"term","d":"「できる」の意味。「食べられる」のように、「れる・られる」の用法の一つ。","en":"potential"},{"t":"自発","kind":"term","d":"自然にそうなるという意味。「思われる」など。「れる・られる」の用法の一つ。","en":"spontaneous"},{"t":"尊敬語","kind":"term","d":"相手や話題の人物の動作や状態を高める敬語。「いらっしゃる」「召し上がる」など。","en":"honorific"},{"t":"ら抜き言葉","kind":"term","d":"「食べられる」を「食べれる」のように、「ら」を抜いた可能の言い方。","en":"ra-nuki kotoba"},{"t":"謙譲語","kind":"term","d":"自分側の動作をへりくだって、相手や話題の人物を立てる敬語。「伺う」「申し上げる」など。","en":"humble form"},{"t":"丁寧語","kind":"term","d":"聞き手に丁寧に述べる敬語。「です」「ます」「ございます」など。","en":"polite form"},{"t":"美化語","kind":"term","d":"ものごとを上品に言う敬語。「お酒」「お料理」のように「お」「ご」をつける。","en":"beautification word"},{"t":"二重敬語","kind":"term","d":"同じ種類の敬語を二つ重ねた言い方。「おっしゃられる」など。一般に誤りとされることが多い。","en":"double honorific"},{"t":"敬語の指針","kind":"work","d":"2007年に文化審議会が答申した、敬語を五つに分ける考え方と使い方の指針。","en":"Keigo no Shishin"},{"t":"源氏物語","kind":"work","d":"平安時代の長編物語。敬語の使い分けから、誰の動作かを読み取れる。","en":"The Tale of Genji"},{"t":"連体形","kind":"term","d":"活用形の一つ。体言に続く形で、古文では「ぞ・なむ・や・か」の結びに使われる。","en":"attributive form"},{"t":"已然形","kind":"term","d":"文語の活用形の一つ。古文では「こそ」の結びになり、口語の仮定形につながる。","en":"realis form"},{"t
