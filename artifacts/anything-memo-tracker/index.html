<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anything Memo トラッカー</title>
</head>
<body style="margin:0">
<style>
#amt{--bg:#f8fafc;--card:#fff;--border:#e6e9ef;--text:#1e2330;--muted:#6b7280;--accent:#2f6bff;--chip:#1f2430;
 background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;line-height:1.55;min-height:100vh;}
#amt *{box-sizing:border-box;}
#amt .wrap{max-width:900px;margin:0 auto;padding:22px 16px 60px;}
#amt .hero{background:linear-gradient(120deg,#ebefff,#f1eafe);border:1px solid #e6e3fb;border-radius:14px;padding:20px 22px;margin-bottom:18px;}
#amt .hero h1{margin:0 0 6px;font-size:1.4rem;}
#amt .hero p{margin:0;color:#5b6072;font-size:.85rem;}
#amt .banner{background:#eff4ff;border:1px solid #c7d7fe;color:#1e40af;border-radius:8px;padding:8px 12px;font-size:.78rem;margin-bottom:16px;}
#amt .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
#amt .stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;}
#amt .stat .n{font-size:1.5rem;font-weight:800;}
#amt .stat .l{font-size:.72rem;color:var(--muted);}
#amt .panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:16px;}
#amt .panel h2{margin:0 0 12px;font-size:.9rem;}
#amt .grow{display:grid;grid-template-columns:150px 1fr 30px;align-items:center;gap:10px;margin:7px 0;font-size:.8rem;}
#amt .grow .track{height:12px;background:#eef1f6;border-radius:6px;overflow:hidden;}
#amt .grow .track>span{display:block;height:100%;border-radius:6px;}
#amt .grow .cnt{text-align:right;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;}
#amt .toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap;}
#amt .search{flex:1;min-width:220px;border:1px solid var(--border);border-radius:9px;padding:9px 12px;font-size:.85rem;background:var(--card);font-family:inherit;}
#amt .search:focus{outline:2px solid var(--accent);outline-offset:1px;}
#amt .sort{border:1px solid var(--border);background:var(--card);border-radius:9px;padding:9px 12px;font-size:.8rem;color:var(--muted);cursor:pointer;font-family:inherit;}
#amt .add{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:9px 14px;font-size:.82rem;font-weight:700;cursor:not-allowed;opacity:.85;}
#amt .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
#amt .chip{border:1px solid var(--border);background:var(--card);border-radius:999px;padding:6px 13px;font-size:.78rem;cursor:pointer;color:var(--muted);font-weight:600;font-family:inherit;}
#amt .chip.active{background:var(--chip);color:#fff;border-color:var(--chip);}
#amt .memos{display:flex;flex-direction:column;gap:12px;}
#amt .memo{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:15px 18px;}
#amt .memo .t{color:var(--accent);font-weight:800;font-size:.98rem;margin-bottom:6px;}
#amt .memo .note{font-size:.83rem;color:#3a4051;margin-bottom:10px;}
#amt .memo .meta{display:flex;align-items:center;gap:10px;font-size:.74rem;color:var(--muted);}
#amt .badge{border-radius:999px;padding:3px 10px;font-weight:700;font-size:.72rem;}
#amt .empty{color:var(--muted);font-size:.85rem;padding:20px;text-align:center;}
#amt footer{margin-top:26px;font-size:.74rem;color:var(--muted);}
</style>
<div id="amt"><div class="wrap">
 <div class="hero"><h1>🗂️ Anything Memo トラッカー</h1>
  <p>キーワードから作った「調べ済みノート」を追跡。データはブラウザ内に保存（Notion連携なし）。</p></div>
 <div class="banner">Cowork のアーティファクトを Code 側に移設した<strong>単体版</strong>です。元の<strong>Notion連携・詳細サブページ遷移は無効</strong>、検索とジャンル絞り込みのみ動作します。</div>
 <div class="stats" id="amtStats"></div>
 <div class="panel"><h2>ジャンル別の件数</h2><div id="amtGenreBars"></div></div>
 <div class="toolbar">
  <input class="search" id="amtSearch" placeholder="🔍 トピック・メモ・ジャンルを検索">
  <button class="sort" id="amtSort">並び替え：日付順</button>
  <button class="add" title="単体版では無効">＋ 追加</button>
 </div>
 <div class="chips" id="amtChips"></div>
 <div class="memos" id="amtList"></div>
 <footer>元データ: <code>data.json</code>（Cowork「Anything Memo Tracker」PDFより抽出・全18件）</footer>
</div></div>
<script>
(function(){
const D={"stats": {"memoTotal": 18, "genreCount": 5, "withDetail": 18}, "genres": [{"key": "ai", "emoji": "🤖", "name": "AI/生成AI", "fill": "#f1eafe", "text": "#9333ea", "count": 7}, {"key": "cloud", "emoji": "☁️", "name": "クラウド/インフラ", "fill": "#eaf0ff", "text": "#2f6bff", "count": 4}, {"key": "dev", "emoji": "🔧", "name": "開発/DevOps", "fill": "#e6f6ee", "text": "#15803d", "count": 3}, {"key": "biz", "emoji": "📈", "name": "ビジネス/マーケ", "fill": "#fde8d7", "text": "#d9480f", "count": 3}, {"key": "data", "emoji": "📊", "name": "データ/分析", "fill": "#e2f5fa", "text": "#0891b2", "count": 1}], "memos": [{"topic": "TCO（総所有コスト）", "genre": "biz", "date": "2026-06-13", "note": "導入から廃棄までのライフサイクル全体でかかる総費用。初期費用＋運用・保守・人件費・廃棄まで含めて比較する考え方。"}, {"topic": "Kubernetes（K8s）", "genre": "cloud", "date": "2026-06-13", "note": "コンテナ化アプリのデプロイ・スケーリング・管理を自動化するOSS基盤。自動スケール・自己修復・ロールバックが強み。"}, {"topic": "データの民主化", "genre": "data", "date": "2026-06-13", "note": "社員全員がデータにアクセス・活用できる環境を整えること。「専門家だけのデータ」を誰もが使える状態に。AIの民主化のデータ版。"}, {"topic": "疎結合（Loose Coupling）", "genre": "dev", "date": "2026-06-13", "note": "コンポーネント同士の依存を最小化し独立性を高める設計原則。変更に強く、独立した開発・デプロイ・スケールがしやすい。"}, {"topic": "AIの民主化", "genre": "ai", "date": "2026-06-13", "note": "AIが「専門家だけのもの」から「誰でも使えるもの」へ開かれた状態。ノーコード・生成AIが加速。利便とリスクが両立。"}, {"topic": "DAP（デジタルアダプションプラットフォーム）", "genre": "biz", "date": "2026-06-13", "note": "ソフトの画面にガイドを重ねて表示し、ユーザーの「使いこなし（定着）」を促すツール。WalkMe・Pendo・Whatfixが代表。"}, {"topic": "CAC（顧客獲得コスト）", "genre": "biz", "date": "2026-06-13", "note": "新規顧客1人の獲得にかかった営業・マーケ費用。CAC=費用合計÷新規獲得顧客数。LTV÷CAC≧3が目安。"}, {"topic": "主要なPython AI/MLライブラリ（6選）", "genre": "ai", "date": "2026-06-13", "note": "NumPy(土台)→Pandas(データ)→Matplotlib(可視化)→scikit-learn(古典ML)→TensorFlow/PyTorch(深層学習)の層で把握。"}, {"topic": "AI開発に使われるプログラミング言語", "genre": "ai", "date": "2026-06-13", "note": "事実上の標準はPython（豊富なライブラリ＋書きやすさ）。用途に応じてR・Julia・C++・Java/Scala・JSが補完。"}, {"topic": "Harness Engineering（エージェントハーネス設計）", "genre": "ai", "date": "2026-06-13", "note": "AIエージェントの性能はモデル本体だけでなく「周り（ハーネス）」の設計で決まる。その足場を意図的に設計する分野。"}, {"topic": "代表的なLLMの種類と特徴", "genre": "ai", "date": "2026-06-13", "note": "開発元別の系列で把握：GPT(汎用/連携)・Claude(長文/コード/安全)・Gemini(マルチモーダル/長文脈)・Llama(オープン/自社運用)。用途で選ぶ時代。"}, {"topic": "ビジネスで生成AIを活用する際の意識点", "genre": "ai", "date": "2026-06-13", "note": "①情報セキュリティ ②著作権 ③ハルシネーション対策 ④目的設定と効果測定 ⑤組織・人の対応 ⑥活用の3方向性。"}, {"topic": "CI/CD（継続的インテグレーション／デリバリー）", "genre": "dev", "date": "2026-06-13", "note": "コード変更の統合・テスト・リリースを自動化。CI=頻繁な統合と自動テスト、CD=デプロイ自動化。品質と速度を両立。"}, {"topic": "IDE（統合開発環境）", "genre": "dev", "date": "2026-06-13", "note": "エディタ・ビルド・デバッグ・テスト等を一つに統合した開発環境。代表例：VS Code、IntelliJ IDEA、Xcode。"}, {"topic": "AWS Cloud Adoption Framework (CAF)", "genre": "cloud", "date": "2026-06-13", "note": "クラウド導入を6パースペクティブ（Business/People/Governance/Platform/Security/Operations）で整理する組織向けフレームワーク。"}, {"topic": "クラウドの種類", "genre": "cloud", "date": "2026-06-13", "note": "提供範囲＝IaaS/PaaS/SaaS、利用形態＝パブリック/プライベート/ハイブリッドの2軸で分類。"}, {"topic": "クラウドのシェアと役割", "genre": "cloud", "date": "2026-06-13", "note": "Synergy Q4 2025: AWS 28% / Azure 21% / Google 14%（上位3社 約63%）。役割＝即時調達・スケール・CapEx→OpEx・DX/AIの土台。"}, {"topic": "Claude Skills（Agent Skills）", "genre": "ai", "date": "2026-06-03", "note": "再利用可能な手順＋資源をフォルダ単位でまとめ、必要時にロードしてClaudeを専門家化する仕組み。導入時は中身を監査。"}]};
const G=Object.fromEntries(D.genres.map(g=>[g.key,g]));
let activeGenre="all", q="", sortDesc=true;
const $=id=>document.getElementById(id);
function renderStats(){
 $("amtStats").innerHTML=[["メモ総数",D.stats.memoTotal],["ジャンル数",D.stats.genreCount],["詳細あり",D.stats.withDetail]]
  .map(([l,n])=>`<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`).join("");
}
function renderBars(){
 const max=Math.max(...D.genres.map(g=>g.count));
 $("amtGenreBars").innerHTML=D.genres.map(g=>`<div class="grow">
   <span>${g.emoji} ${g.name}</span>
   <span class="track"><span style="width:${g.count/max*100}%;background:${g.text}"></span></span>
   <span class="cnt">${g.count}</span></div>`).join("");
}
function renderChips(){
 const chips=[`<button class="chip ${activeGenre==='all'?'active':''}" data-g="all">すべて</button>`]
  .concat(D.genres.map(g=>`<button class="chip ${activeGenre===g.key?'active':''}" data-g="${g.key}">${g.emoji} ${g.name} (${g.count})</button>`));
 $("amtChips").innerHTML=chips.join("");
 $("amtChips").querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{activeGenre=c.dataset.g;renderChips();renderList();}));
}
function renderList(){
 let items=D.memos.slice();
 if(activeGenre!=="all") items=items.filter(m=>m.genre===activeGenre);
 if(q){const s=q.toLowerCase();items=items.filter(m=>(m.topic+m.note+G[m.genre].name).toLowerCase().includes(s));}
 items.sort((a,b)=>sortDesc?b.date.localeCompare(a.date):a.date.localeCompare(b.date));
 if(!items.length){$("amtList").innerHTML='<div class="empty">該当するメモがありません。</div>';return;}
 $("amtList").innerHTML=items.map(m=>{const g=G[m.genre];return `<div class="memo">
   <div class="t">${m.topic} ›</div>
   <div class="note">${m.note}</div>
   <div class="meta"><span class="badge" style="background:${g.fill};color:${g.text}">${g.emoji} ${g.name}</span><span>📅 ${m.date}</span></div>
  </div>`;}).join("");
}
$("amtSearch").addEventListener("input",e=>{q=e.target.value;renderList();});
$("amtSort").addEventListener("click",()=>{sortDesc=!sortDesc;$("amtSort").textContent="並び替え：日付順"+(sortDesc?" ↓":" ↑");renderList();});
renderStats();renderBars();renderChips();renderList();
})();
</script>
</body>
</html>
