:1,"explanation":"婚姻カップルに占める割合は増えたが、婚姻割合自体は横ばいか微増で婚姻率アップには寄与していないとされる。","q":"本書はマッチングアプリ（ネット系婚活）の効果をどう評価しているか。"},{"level":3,"choices":["経済格差と社会通念","少子化と高齢化","都市と地方","教育と宗教"],"answer":0,"explanation":"非正規雇用など「経済格差」の壁と、結婚=入籍といった「社会通念」の壁を越える必要があるとされる。","q":"「共創結婚」の実現を阻むと本書が挙げる2つの壁の組み合わせはどれか。"}]},"mkt53":{"title":"戦わずして売る技術 クリック1つで市場を生み出す最強のWEBマーケティング術","quiz":[{"level":1,"choices":["棲み分け","値下げ","寡占","大量出稿"],"answer":0,"explanation":"各社が最適な人にだけピンポイントで届ける「棲み分けマーケティング」を目指すべきとされる。","q":"本書が「WEBマーケティング」で目指すべきとするのは、競争ではなく何か。"},{"level":1,"choices":["置き換え・観察・憑依","観察・置き換え・憑依","憑依・観察・置き換え","観察・憑依・置き換え"],"answer":1,"explanation":"第1段階「観察」、第2段階「置き換え」、第3段階「憑依」の順で顧客理解を深める。","q":"ターゲットの思考回路をハックするための3段階の順序として正しいものはどれか。"},{"level":2,"choices":["夜間割引が効いていた","保留にした購入検討を帰宅後に再開している","夜は競合が広告を止めている","夜勤者が多いから"],"answer":1,"explanation":"電車内でスマホを触る人々を観察し、保留した購入検討を帰宅後に再開しているという真実を突き止めた。","q":"広告のCV率が夜に上がる理由を、著者は数字分析ではなく観察からどう突き止めたか。"},{"level":2,"choices":["ユニークベネフィットとアドバンテージ","リーズンとオーソリティ","価格と品質","認知と好意"],"answer":0,"explanation":"独自のベネフィットである「ユニークベネフィットUSP」と、他より優れた「アドバンテージUSP」に大別される。","q":"本書の「USP」分類で、商品の強みは大きくどの2つに分けられるか。"},{"level":3,"choices":["どのプラットフォームに出すか","検索順位をどう上げるか","どんな人に、どんなことを、どのように伝えるか","広告費をいくらかけるか"],"answer":2,"explanation":"細部よりも「どんな人に、どんなことを、どのように伝えるか」という問いに立ち返ることが本質とされる。","q":"本書が最も重要とする、WEBマーケティングで立ち返るべき問いはどれか。"}]},"mkt54":{"title":"競争としてのマーケティング","quiz":[{"level":1,"choices":["コトラーとドラッカー","ライズとトラウト","ポーターとミンツバーグ","カーネマンとセイラー"],"answer":1,"explanation":"アル・ライズとジャック・トラウトの理論を日本企業向けに解説している。","q":"本書が理論の下敷きにしている、マーケティング界のレジェンドと呼ばれる2人は誰か。"},{"level":1,"choices":["競争志向","品質志向","価格志向","生産志向"],"answer":0,"explanation":"自社の強み弱みだけでなく競合との相対関係を分析する「競争志向」への転換を説く。","q":"本書が転換をすすめる、従来の顧客志向に代わる考え方はどれか。"},{"level":2,"choices":["価格を下げる","一番手になる","広告量を増やす","店舗を増やす"],"answer":1,"explanation":"世界初のカップ麺と認識されるカップヌードルのように、一番手になることが最も強く心に残る。","q":"人の心の中に入り込む簡単な方法として本書が挙げるのはどれか。"},{"level":2,"choices":["競合商品の分析","体脂肪を気にする中年男性が多いという観察","海外の流行","社内アンケート"],"answer":1,"explanation":"商品分析ではなく、体脂肪を気にする中年男性が非常に多いという現実の観察から生まれた。","q":"「ヘルシア緑茶」のポジショニングのヒントは、どこから生まれたと本書はいうか。"},{"level":3,"choices":["ゲリラ攻撃法","側面攻撃法","弱点攻撃法","防御法"],"answer":3,"explanation":"リーダー企業は自らを絶えず攻撃し進化させる「防御法」がふさわしいとされる。","q":"トップシェアのリーダー企業にふさわしいと本書が説く戦い方はどれか。"}]},"mkt55":{"title":"行動経済学が勝敗を支配する","quiz":[{"level":1,"choices":["ゴール上段","ゴール下段","中央","ゴールポスト際"],"answer":0,"explanation":"上段を狙うほうが成功率が高いとデータで分かっているが、多くの選手は無難な下段を選ぶ。","q":"サッカーのPK戦で、データ上より成功率が高いとされる狙いどころはどこか。"},{"level":1,"choices":["概数効果","損失回避バイアス","サンクコスト","保有効果"],"answer":1,"explanation":"外して失敗すると責められやすいため、損失回避バイアスにより無難な下段を選んでしまう。","q":"PK戦で選手が無難な下段を選んでしまう原因として本書が挙げるバイアスはどれか。"},{"level":2,"choices":["概数効果","ネガティブフレーム","タレント過剰効果","上昇選好"],"answer":0,"explanation":"きりのよい数字の直前に完走者や達成者が急増する「概数効果」が見られる。","q":"「サブ4」や「打率3割」の直前に人が群がる現象を本書は何と呼ぶか。"},{"level":2,"choices":["社会的証明","ネガティブフレーム","返報性","権威"],"answer":1,"explanation":"負けている状況を「ネガティブフレーム」で捉えることが、成功率の低い盗塁という非合理な采配を招く。","q":"野球で負けているときほど無謀な盗塁を試みてしまう原因として本書が挙げるのはどれか。"},{"level":3,"choices":["概数効果","タレント過剰効果","解釈レベル効果","デフォルト効果"],"answer":1,"explanation":"スター選手が増えると連携が弱まる「タレント過剰効果」が報告され、サンクコストに引きずられた起用も一因とされる。","q":"レアル・マドリーの低迷の一因として本書が挙げる、スター選手が増えすぎて成績が落ちる効果はどれか。"}]},"mkt56":{"title":"行動経済学が最強の学問である","quiz":[{"level":1,"choices":["過去・現在・未来","個人・集団・社会","認知のクセ・状況・感情","価格・品質・ブランド"],"answer":2,"explanation":"意思決定に影響する「認知のクセ」「状況」「感情」の3要因で全体像を整理する。","q":"本書が行動経済学を整理するために用いる3つの要因の組み合わせはどれか。"},{"level":1,"choices":["システム2","システム1","アフェクト","ヒューリスティック2"],"answer":1,"explanation":"直感的で瞬間的な「システム1（ファスト）」と、注意深い「システム2（スロー）」の2つがある。","q":"直感的で瞬間的な思考モードを本書は何と呼ぶか。"},{"level":2,"choices":["ダニエル・カーネマン","リチャード・セイラー","ロバート・チャルディーニ","アダム・スミス"],"answer":0,"explanation":"行動経済学の父ダニエル・カーネマンが2つの思考モードを提唱したと紹介される。","q":"システム1とシステム2の考え方を提唱した「行動経済学の父」と本書が呼ぶ人物は誰か。"},{"level":2,"choices":["33%","50%","63%","80%"],"answer":2,"explanation":"客が誰もいないときは33%だったが、他の客が3人いると63%に増加した。","q":"電池を安く買える実験で、売場に他の客が3人いるときに安い電池を選んだ被験者の割合はどれか。"},{"level":3,"choices":["ムード","エモーション","バイアス","アフェクト"],"answer":3,"explanation":"はっきりしない淡い感情を「アフェクト」と呼び、これに訴えることが人を動かすうえで重要とされる。","q":"「なんとなく気乗りしない」といった程度のはっきりしない淡い感情を本書は何と呼ぶか。"}]},"mkt57":{"title":"論点思考 BCG流問題設定の技術","quiz":[{"level":1,"q":"著者が所属した「BCG」で、解くべき課題のことを何と呼ぶか。","answer":0,"explanation":"BCGでは解くべき課題のことを「論点」と呼び、それを正しく設定するプロセスを論点思考と呼ぶ。","choices":["論点","解答","仮説","結論"]},{"level":1,"q":"本書が説く論点思考の出発点はどれか。","answer":1,"explanation":"著者は最初に与えられた依頼(論点)を、まず疑ってみるところから始める。","choices":["すぐに解決策を実行する","与えられた問題をまず疑う","上司の指示に忠実に従う","競合をすべて調べ尽くす"]},{"level":2,"q":"優秀なコンサルタントは、企業が抱える多くの問題に対してどう対応するとされるか。","answer":2,"explanation":"すべての問題を解こうとせず、最優先で解決すべき課題を1つか2つに絞って注力する。","choices":["すべてを同時に解決しようとする","難しい問題から順に片付ける","最優先の課題を1つか2つに絞って注力する","効果より実行の容易さだけを重視する"]},{"level":2,"q":"本書が述べる「論点」の性質として正しいものはどれか。","answer":2,"explanation":"論点は人によって異なり、トップの問題意識の変化や外的要因を受けてダイナミックに動く。","choices":["一度決めたら固定される","人によらず常に同じである","作業を進めると動くものである","数値でしか表現できない"]},{"level":3,"q":"筋のよい論点を見極める3つの視点の組み合わせとして正しいものはどれか。","answer":1,"explanation":"解決できるか、実行は容易か、解決したらどれだけ効果があるか、の3点で見極める。","choices":["コスト・時間・人員","解決できるか・実行は容易か・効果があるか","市場・競合・自社","過去・現在・未来"]}]},"mkt58":{"title":"買いたがる脳 なぜ、「それ」を選んでしまうのか？","quiz":[{"level":1,"q":"本書が扱う、脳科学を応用したマーケティング手法の呼称はどれか。","answer":1,"explanation":"脳波や無意識の反応を応用した手法を「ニューロマーケティング」と呼ぶ。","choices":["ダイレクトマーケティング","「ニューロマーケティング」","マスマーケティング","コンテンツマーケティング"]},{"level":1,"q":"セールスの本質として、店内の仕掛けが消費者の脳内に作り出そうとするものはどれか。","answer":0,"explanation":"欲しいという要望が高まると欲しいし必要という「ウォンツニーズ」に変化し、強い購買欲求につながる。","choices":["「ウォンツニーズ」","罪悪感","無関心","値引き期待"]},{"level":2,"q":"店内の心地よいBGMや適度な温度設定は、消費者に主にどんな効果をもたらすとされるか。","answer":1,"explanation":"BGMや温度は店に入った緊張感や警戒感を解き、リラックスモードへ導く。","choices":["警戒心を強める","緊張感や警戒感を解きリラックスさせる","即座に退店させる","価格への注意を高める"]},{"level":2,"q":"買い物をする脳の判断は、いくつのプロセスに自動化されているとされるか。","answer":1,"explanation":"無意識の判断・カテゴリー化・意識的処理という3つのプロセスに自動化されている。","choices":["2種類","3種類","5種類","7種類"]},{"level":3,"q":"衝動買いが主に迅速に行われる脳の部位はどこか。","answer":1,"explanation":"衝動買いは古来からの脳の部位である大脳辺縁系で迅速に行われ、理性的判断は大脳皮質が担う。","choices":["大脳皮質","大脳辺縁系","小脳","脳幹"]}]},"mkt59":{"title":"超入門 コトラーの「マーケティング・マネ /* ============================================================
   HELPERS
============================================================ */
function lerpColor(a, b, t){
  const ah = a.match(/\w\w/g).map(x=>parseInt(x,16));
  const bh = b.match(/\w\w/g).map(x=>parseInt(x,16));
  const rgb = ah.map((c,i)=>Math.round(c + (bh[i]-c)*t));
  return `rgb(${rgb.join(',')})`;
}
const NAVY = "0B1F3F";
const SKY  = "9BC8EE";

function countBooks(node){
  let n = (node.books ? node.books.length : 0);
  if(node.children){ node.children.forEach(c => n += countBooks(c)); }
  return n;
}

function totalBookCount(){
  return DATA.reduce((sum, cat) => sum + countBooks(cat), 0);
}

/* view stack: array of {viewId, renderFn} so back() always knows the parent */
let viewStack = [];

function showView(id){
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  const el = document.getElementById(id);
  if(el) el.classList.add('active');
}

function goBack(){
  viewStack.pop();
  const prev = viewStack[viewStack.length - 1];
  if(!prev){ showView('view-root'); return; }
  showView(prev);
}

  const list = document.getElementById('rootList');

/* ---- クイズ出題ソース ---- */
function themeQuizQuestions(themeId){
  const order = THEME_QUIZ_BOOKS[themeId];
  if(order && order.length){
    const out = [];
    order.forEach(bid => {
      const bt = BOOK_QUIZ_TITLE[bid] || '';
      (BOOK_QUIZ[bid] || []).forEach(q => out.push(Object.assign({ book: bt }, q)));
    });
    if(out.length) return out;
  }
  const s = THEME_SYNTHESIS[themeId];
  return (s && s.quiz) ? s.quiz.slice() : [];
}

/* ---- 出題順（固定＝収録順 / ランダム＝シャッフル） ---- */
function buildQuizSequence(questions, order){
  const idx = questions.map((_, i) => i);
  if(order === 'random'){
    for(let i = idx.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      const t = idx[i]; idx[i] = idx[j]; idx[j] = t;
    }
  }
  return idx;
}

function quizResultComment(score, total){
  const r = total ? score / total : 0;
  if(r >= 0.9) return "見事な理解度です。要点をしっかり押さえられています。";
  if(r >= 0.7) return "よく理解できています。取りこぼした問題の解説を振り返ってみましょう。";
  if(r >= 0.5) return "半分以上正解。解説を読み返すと定着が深まります。";
  return "まずは解説を丁寧に確認し、もう一度挑戦してみましょう。";
}

/* ---- 1問ずつ出題するクイズエンジン ---- */
function mountQuiz(mountEl, questions, opts){
  opts = opts || {};
  const total = questions.length;
  let order = opts.defaultOrder || 'fixed';
  let seq = buildQuizSequence(questions, order);
  let pos = 0;
  const answered = {}; // 元問index -> 選択index

  mountEl.innerHTML = `
    <div class="quiz-box">
      ${opts.orderToggle ? `
      <div class="quiz-order">
        <span class="quiz-order-label">出題順</span>
        <div class="quiz-seg">
          <button class="seg-btn active" data-order="fixed">固定</button>
          <button class="seg-btn" data-order="random">ランダム</button>
        </div>
      </div>` : ''}
      <div class="quiz-head">
        <span class="quiz-counter"></span>
        <span class="quiz-score"></span>
      </div>
      <div class="quiz-stage"></div>
      <div class="quiz-nav">
        <button class="quiz-prev" type="button">← 戻る</button>
        <button class="quiz-next" type="button">次へ →</button>
      </div>
    </div>`;

  const stage   = mountEl.querySelector('.quiz-stage');
  const counter = mountEl.querySelector('.quiz-counter');
  const scoreEl = mountEl.querySelector('.quiz-score');
  const prevBtn = mountEl.querySelector('.quiz-prev');
  const nextBtn = mountEl.querySelector('.quiz-next');

  const scoreOf = () => Object.keys(answered).reduce((n, k) => n + (answered[k] === questions[k].answer ? 1 : 0), 0);
  const answeredCount = () => Object.keys(answered).length;

  function updateNav(){
    prevBtn.disabled = (pos === 0);
    const qIdx = seq[pos];
    const isAnswered = answered[qIdx] !== undefined;
    nextBtn.disabled = false; // 次へは常に押せる（未回答でもスキップ可）
    nextBtn.classList.toggle('ready', isAnswered && pos < total - 1);
    if(pos === total - 1){
      nextBtn.textContent = '結果を見る';
      nextBtn.classList.toggle('done', isAnswered);
    } else {
      nextBtn.textContent = '次へ →';
      nextBtn.classList.remove('done');
    }
  }

  function renderQ(){
    const qIdx = seq[pos];
    const q = questions[qIdx];
    const chosen = answered[qIdx];
    const isAnswered = chosen !== undefined;
    counter.textContent = `Q ${pos + 1} / ${total}`;
    scoreEl.innerHTML = `正解 <b>${scoreOf()}</b>${answeredCount() ? ' / ' + answeredCount() + '問回答' : ''}`;
    const choicesHTML = q.choices.map((c, ci) => {
      let cls = 'quiz-choice';
      let mark = '';
      if(isAnswered){
        if(ci === q.answer){ cls += ' correct'; mark = '正解'; }
        else if(ci === chosen){ cls += ' wrong'; mark = '×'; }
      }
      return `<button class="${cls}" type="button" data-ci="${ci}" ${isAnswered ? 'disabled' : ''}>
        <span class="opt">${'ABCD'[ci]}</span><span class="txt">${c}</span><span class="mark">${mark}</span>
      </button>`;
    }).join('');
    stage.innerHTML = `
      ${q.book ? `<p class="quiz-source"><span class="quiz-source-label">出典</span>『${q.book}』</p>` : ''}
      <p class="quiz-q-text"><span class="quiz-num">Q${pos + 1}.</span>${q.q}</p>
      <div class="quiz-choices">${choicesHTML}</div>
      <div class="quiz-explain" ${isAnswered ? '' : 'style="display:none"'}><b>正解：${'ABCD'[q.answer]}</b> — ${q.explanation}</div>`;
    if(!isAnswered){
      stage.querySelectorAll('.quiz-choice').forEach(btn => {
        btn.addEventListener('click', () => {
          if(answered[qIdx] !== undefined) return;
          answered[qIdx] = parseInt(btn.getAttribute('data-ci'), 10);
          renderQ();
        });
      });
    }
    updateNav();
  }

  function showSummary(){
    const sc = scoreOf();
    counter.textContent = '完了';
    scoreEl.innerHTML = `正解 <b>${sc}</b> / ${total}`;
    stage.innerHTML = `
      <div class="quiz-summary">
        <p class="quiz-summary-score"><b>${sc}</b>／ ${total} 問正解</p>
        <p class="quiz-summary-sub">${quizResultComment(sc, total)}</p>
        <button class="quiz-retry" type="button">もう一度挑戦</button>
      </div>`;
    prevBtn.disabled = false;
    nextBtn.disabled = true;
    nextBtn.classList.remove('ready', 'done');
    stage.querySelector('.quiz-retry').addEventListener('click', () => {
      Object.keys(answered).forEach(k => delete answered[k]);
      seq = buildQuizSequence(questions, order);
      pos = 0;
      renderQ();
    });
  }

  prevBtn.addEventListener('click', () => {
    if(pos > 0){ pos--; renderQ(); }
  });
  nextBtn.addEventListener('click', () => {
    if(pos < total - 1){ pos++; renderQ(); }
    else showSummary();
  });

  if(opts.orderToggle){
    mountEl.querySelectorAll('.seg-btn').forEach(b => {
      b.addEventListener('click', () => {
        const o = b.getAttribute('data-order');
        if(o === order) return;
        order = o;
        mountEl.querySelectorAll('.seg-btn').forEach(x => x.classList.toggle('active', x === b));
        Object.keys(answered).forEach(k => delete answered[k]);
        seq = buildQuizSequence(questions, order);
        pos = 0;
        renderQ();
      });
    });
  }

  renderQ();
}

function mountThemeQuiz(themeId){
  const el = document.getElementById('quizmount-theme-' + themeId);
  if(!el) return;
  const qs = themeQuizQuestions(themeId);
  if(qs.length) mountQuiz(el, qs, { orderToggle:true, defaultOrder:'fixed' });
}

function mountBookQuiz(bookId){
  const el = document.getElementById('quizmount-book-' + bookId);
  if(!el) return;
  const qs = BOOK_QUIZ[bookId];
  if(qs && qs.length) mountQuiz(el, qs, { orderToggle:false, defaultOrder:'fixed' });
}

function openCategory(cat, color){
  const viewId = `view-cat-${cat.id}`;
  const el = ensureView(viewId);
  let bodyHTML = '';

  if(cat.type === 'group' || cat.type === 'mixed'){
    if(cat.children && cat.children.length){
      bodyHTML += `<div class="section-label">サブカテゴリ</div><div class="index-list" id="list-${viewId}-sub"></div>`;
    }
  }
  if((cat.type === 'flat' || cat.type === 'mixed') ){
    bodyHTML += `<div class="section-label">${cat.type==='mixed' ? 'このカテゴリ直下の書籍' : '収録書籍'}</div>`;
    if(cat.books && cat.books.length){
      bodyHTML += `<div class="index-list" id="list-${viewId}-books"></div>`;
    } else {
      bodyHTML += emptyStateHTML();
    }
  }
  if(cat.type === 'group' && (!cat.children || cat.children.every(c => countBooks(c) === 0))){
    // nothing extra needed; children rows themselves show "Coming soon"
  }

  el.innerHTML = `
    <button class="back-btn" onclick="goBack()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      INDEX
    </button>
    <div class="detail-eyebrow">
      <div class="detail-icon" style="background:${color}"><svg viewBox="0 0 24 24">${ICONS[cat.id] || ICONS.folder}</svg></div>
    </div>
    <h2>${cat.title}</h2>
    <p class="detail-sub">${cat.sub} ・ ${countBooks(cat)} 冊収録</p>
    ${synthesisHTML(cat)}
    ${bodyHTML}
    ${backBtnBottomHTML('INDEX')}
  `;

  viewStack.push(viewId);
  showView(viewId);
  mountThemeQuiz(cat.id);

  if(cat.children && cat.children.length){
    const subList = document.getElementById(`list-${viewId}-sub`);
    cat.children.forEach(sub => {
      const n = countBooks(sub);
      const row = document.createElement('button');
      row.className = 'index-row';
      row.innerHTML = `
        <div class="spine" style="background:${color}"></div>
        <div class="icon-wrap" style="color:${color}"><svg viewBox="0 0 24 24">${ICONS.folder}</svg></div>
        <div class="row-text">
          <p class="row-title">${sub.title}</p>
          <p class="row-sub">${sub.sub || ''}</p>
        </div>
        <span class="row-meta ${n>0?'filled':''}">${n>0 ? n+' 冊収録' : 'Coming soon'}</span>
        <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      `;
      row.addEventListener('click', () => openSubcategory(cat, sub, color));
      subList.appendChild(row);
    });
  }
  if(cat.books && cat.books.length){
    const bookList = document.getElementById(`list-${viewId}-books`);
    cat.books.forEach(book => {
      const row = document.createElement('button');
      row.className = 'index-row';
      row.innerHTML = bookRowHTML(book, color);
      row.addEventListener('click', () => openBook(book, color, [cat.title]));
      bookList.appendChild(row);
    });
  }
}

function openSubcategory(cat, sub, color){
  const viewId = `view-sub-${cat.id}-${sub.id}`;
  const el = ensureView(viewId);
  el.innerHTML = `
    <button class="back-btn" onclick="goBack()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      ${cat.title}
    </button>
    <div class="detail-eyebrow">
      <div class="detail-icon" style="background:${color}"><svg viewBox="0 0 24 24">${ICONS.folder}</svg></div>
    </div>
    <h2>${sub.title}</h2>
    <p class="detail-sub">${cat.title} ${sub.sub ? '・ '+sub.sub : ''} ・ ${sub.books.length} 冊収録</p>
    ${sub.books.length ? `<div class="index-list" id="list-${viewId}"></div>` : emptyStateHTML()}
    ${backBtnBottomHTML(cat.title)}
  `;
  viewStack.push(viewId);
  showView(viewId);

  if(sub.books.length){
    const list = document.getElementById(`list-${viewId}`);
    sub.books.forEach(book => {
      const row = document.createElement('button');
      row.className = 'index-row';
      row.innerHTML = bookRowHTML(book, color);
      row.addEventListener('click', () => openBook(book, color, [cat.title, sub.title]));
      list.appendChild(row);
    });
  }
}

function openBook(book, color, crumbs){
  const viewId = `view-book-${book.id}`;
  const el = ensureView(viewId);
  const parentLabel = crumbs[crumbs.length - 1];

  const metaHTML = `
    <div class="book-meta-card">
      ${book.author ? `<span><b>著者:</b> ${book.author}</span>` : ''}
      ${book.publisher ? `<span><b>出版社:</b> ${book.publisher}</span>` : ''}
      ${book.year ? `<span><b>刊行:</b> ${book.year}年</span>` : ''}
      ${book.pages ? `<span><b>ページ数:</b> ${book.pages}p</span>` : ''}
      ${book.price ? `<span><b>価格:</b> ${book.price}</span>` : ''}
    </div>
  `;

  const pointsHTML = (book.points || []).map((p, i) => `
    <li class="point-item">
      <p class="point-head"><span class="num">${String(i+1).padStart(2,'0')}</span>${p.h}</p>
      <p class="point-body">${p.b}</p>
    </li>
  `).join('');

  el.innerHTML = `
    <button class="back-btn" onclick="goBack()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      ${parentLabel}
    </button>
    <div class="detail-eyebrow">
      <div class="detail-icon" style="background:${color}"><svg viewBox="0 0 24 24">${ICONS.book}</svg></div>
    </div>
    <h2>${book.title}</h2>
    <p class="detail-sub">${crumbs.join(' / ')}</p>

    ${metaHTML}
    ${book.oneLiner ? `<p class="book-oneliner">${book.oneLiner}</p>` : ''}

    <div class="book-section-title">Overview</div>
    <p class="book-overview">${book.overview || ''}</p>

    <div class="book-section-title">本書の要点</div>
    <ul class="point-list">${pointsHTML}</ul>

    ${book.takeaway ? `
    <div class="takeaway-box">
      <p class="label">実務への示唆</p>
      <p>${book.takeaway}</p>
    </div>` : ''}

    ${(BOOK_QUIZ[book.id] && BOOK_QUIZ[book.id].length) ? `
    <div class="book-section-title">理解度チェック（${BOOK_QUIZ[book.id].length}問クイズ）</div>
    <p class="quiz-intro">この要約から${BOOK_QUIZ[book.id].length}問。1問ずつ出題され、「次へ」で進みます。</p>
    <div class="quiz-mount" id="quizmount-book-${book.id}"></div>` : ''}

    <p class="source-note">※ 本要約はClaudeが書籍情報および要約サービス(Flier等)のレビューを参照し、独自にまとめた個人利用向けのノートです。原著・原要約の著作権はそれぞれの著者・出版社・要約サービス提供者に帰属します。</p>
    ${backBtnBottomHTML(parentLabel)}
  `;
  viewStack.push(viewId);
  showView(viewId);
  mountBookQuiz(book.id);
}

function emptyStateHTML(){
  return `
    <div class="empty-state">
      <svg viewBox="0 0 24 24" style="margin:0 auto 18px;display:block;"><path d="M4 5.5h11a2.5 2.5 0 0 1 2.5 2.5v5a2.5 2.5 0 0 1-2.5 2.5H10l-4 3v-3H6a2 2 0 0 1-2-2v-8Z"/></svg>
      <p>このセクションにはまだ書籍が登録されていません。順次サマリを追加していきます。</p>
    </div>
  `;
}

/* ============================================================
   INIT
============================================================ */
viewStack = ['view-root'];
renderRoot();
</script>
