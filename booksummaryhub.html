"講演をする"],"answer":1,"explanation":"アウトプットが苦手な人は、読んだことや体験を第三者に話すことから始めるのが取り組みやすいとされる。"},{"level":3,"q":"本書が話すことと比較して書くことについて述べる効果はどれか。","choices":["書くほうが圧倒的に記憶に残り自己成長を促す","話すほうが記憶に残る","両者に差はない","書くことは集中力を下げる"],"answer":0,"explanation":"書くことは話すことより圧倒的に記憶に残り、脳に信号を送り集中力を高め自己成長を促すとされる。"}]},"comp29":{"title":"学び効率が最大化する インプット大全","quiz":[{"level":1,"q":"本書の著者が自身を称する肩書きはどれか。","choices":["日本一アウトプットする精神科医","日本一速く読む書評家","記憶力世界チャンピオン","最年少の経営コンサルタント"],"answer":0,"explanation":"著者は「日本一アウトプットする精神科医」であり、最短時間で最大効率のインプットを行うことで大量のアウトプットを可能にしている。"},{"level":1,"q":"本書が説く究極の学習法における、インプットとアウトプットの黄金比はどれか。","choices":["5対5","7対3","3対7","1対9"],"answer":2,"explanation":"究極の学習法は、インプットとアウトプットを3対7の比率にすることだとされる。"},{"level":2,"q":"インプットの発想について、本書が説くポイントはどれか。","choices":["インプットを終えてからアウトプットを考える","アウトプットありきでインプットを行う","インプットだけに集中する","アウトプットは軽視してよい"],"answer":1,"explanation":"アウトプットありきでインプットを行うことで、加速度的に自己成長できると説かれる。"},{"level":2,"q":"私たちの心や脳は何でできているとされるか。","choices":["生まれつきの才能","10年前のインプット","昨日のアウトプット","周囲の評価"],"answer":1,"explanation":"私たちの心や脳は10年前のインプットでできているとされ、長期的視点でのインプットが求められる。"},{"level":3,"q":"インプットは必ず何とセットで行うべきだと述べられているか。","choices":["休息","目標設定","読書量の記録","他者への報告"],"answer":1,"explanation":"目標なきインプットは記憶に定着しにくいため、インプットは必ず目標設定とセットで行うべきである。"}]},"comp30":{"title":"成果・イノベーションを創出する ダイバーシティ・マネジメント大全","quiz":[{"level":1,"q":"本書が示す新しいダイバーシティ・マネジメントとは何を活かすマネジメントか。","choices":["性別と年齢という属性","働き方や考え方の多様性","効率性と同質性","勤続年数と役職"],"answer":1,"explanation":"新しいダイバーシティ・マネジメントとは、働き方や考え方の多様性を活かすマネジメントである。"},{"level":1,"q":"本書が執筆された背景として挙げられている社会状況はどれか。","choices":["コロナ禍のテレワーク普及","少子化による人手不足","円安の進行","終身雇用の完全崩壊"],"answer":0,"explanation":"コロナ禍のテレワーク普及を背景に、ダイバーシティ・マネジメントの進化が示されている。"},{"level":2,"q":"本書が指摘する、従来の日本の会社が「効率性」の名のもとに行ってきたことはどれか。","choices":["社員に多様な働き方を認めていた","ヒト・モノ・システムを1箇所に集め過ぎていた","評価を完全に成果主義にしていた","属性を一切問わなかった"],"answer":1,"explanation":"日本の会社は効率性の名のもとにヒト・モノ・システムを1箇所に集め過ぎ、同質性や同調圧力を押し付けていた。"},{"level":2,"q":"テレワークで部下へのマネジメントにまず求められることはどれか。","choices":["成果を出せない問題を部下のせいにする","成果を厳密に評価する","その人らしさを認めた働きかけ","出社の頻度を増やさせる"],"answer":2,"explanation":"まず求められるのは、問題を部下のせいにするのでも成果を評価するのでもなく、その人らしさを認めた働きかけである。"},{"level":3,"q":"本書が説く、成果やイノベーションを創出する可能性を秘めたマネジメントスタイルはどれか。","choices":["時間と空間にとらわれないマネジメント","対面での密な監視","画一的な行動管理","属性ごとの区別"],"answer":0,"explanation":"時間と空間にとらわれないこれからのマネジメントスタイルこそが、成果やイノベーションを創出する可能性を秘めている。"}]},"comp31":{"title":"時間術大全 人生が本当に変わる「87の時間ワザ」","quiz":[{"level":1,"q":"本書の原題はどれか。","choices":["「TIME HACKS」","「MAKE TIME」","「DEEP WORK」","「FLOW」"],"answer":1,"explanation":"本書の原題は「MAKE TIME」であり、時間はデザインできるという気づきから生まれた。"},{"level":1,"q":"本書が挙げる、時間がない2つの理由の一つはどれか。","choices":["多忙中毒","運動不足","睡眠過多","人間関係の悪化"],"answer":0,"explanation":"時間がないのは、忙しいのをよしとする「多忙中毒」と「無限の泉」に主導権を奪われていることが原因だとされる。"},{"level":2,"q":"スマホのアプリなど絶えずコンテンツが補充され、主導権を奪う存在を本書は何と表現したか。","choices":["ブラックホール","無限の泉","時間泥棒","デジタルの沼"],"answer":1,"explanation":"絶えずコンテンツが補充されるスマホアプリなどを「無限の泉」と呼び、これに主導権を奪われることを問題視している。"},{"level":2,"q":"メイクタイムの4ステップのうち、1日の初めにやりたいことを1つだけ決めるものはどれか。","choices":["レーザー","チャージ","ハイライト","チューニング"],"answer":2,"explanation":"「ハイライト」は1日の初めにやりたいことを1つだけ決めるステップである。"},{"level":3,"q":"心身のエネルギーを高めチャージするために、本書が勧める暮らし方はどれか。","choices":["最新テクノロジーを積極的に使う","先史時代の人間に近い暮らし","夜型の生活","常に情報を追い続ける生活"],"answer":1,"explanation":"先史時代の人間に近い暮らしをすることで、心身のエネルギーを高めチャージできるとされる。"}]},"comp32":{"title":"最少の努力で「トップ内定」し「仕事力」も高める 就活テクニック大全","quiz":[{"level":1,"q":"本書が説く自己PRのつくり方として正しいものはどれか。","choices":["自分だけで完結させて考える","他者の視点を借りて考える","過去の受賞歴だけを並べる","短所を隠すことに専念する"],"answer":1,"explanation":"自己PRは自分だけで考えてはいけず、志望企業の社員に質問するなどして客観的な視点を取り入れる。"},{"level":1,"q":"本命企業への志望度をアピールするために本書が勧める道具はどれか。","choices":["その企業専用のノート","高価なスーツ","資格の一覧表","自作のプレゼン資料"],"answer":0,"explanation":"企業専用のノートにIR情報や新聞記事のスクラップをまとめ、企業分析に活用することが勧められている。"},{"level":2,"q":"面接の頻出質問への備えとして、本書が把握を勧める期間はどれか。","choices":["過去1〜2年","過去5〜10年","過去20年","過去50年"],"answer":1,"explanation":"内定者に質問するなどして、過去5〜10年の質問傾向を把握しておくことで不安を減らせる。"},{"level":2,"q":"自己PRを客観化するために、本書が勧める企業社員への質問はどれか。","choices":["御社の年収はいくらか","これらの経験のうちどれが御社の仕事に近いか","内定者は何人か","面接官は誰か"],"answer":1,"explanation":"学生時代に力を入れたことを書き出し、社員に「どれが御社の仕事に近いか」を質問して客観的視点を取り入れる。"},{"level":3,"q":"本書が紹介する、自信を積み上げる戦略的なアプローチはどれか。","choices":["本命企業だけを受ける","下位の企業から先に内定を得る","内定はすべて辞退する","面接を最小限にする"],"answer":1,"explanation":"下位の企業から先に内定を得て自信を積み上げ、本命企業に臨むという戦略が紹介される。"}]},"comp33":{"title":"東大式 記憶力超大全","quiz":[{"level":1,"q":"記憶力に関する本書の主張として正しいものはどれか。","choices":["記憶力は完全に生まれつきの才能で決まる","環境やトレーニングによって十分に向上させられる","年齢とともに必ず大きく低下する","記憶術だけで復習は不要になる"],"answer":1,"explanation":"記憶力の遺伝要素はそれほど高くなく、環境やトレーニングによって十分に向上させることができる。"},{"level":1,"q":"本書の著者の経歴として正しいものはどれか。","choices":["メモリースポーツで日本一になり世界大会に3度出場","無敗のプロ棋士","医学部の教授","脳外科の専門医"],"answer":0,"explanation":"著者はメモリーアスリートとして日本一になり、世界大会に3度出場している。"},{"level":2,"q":"「顔は見たことあるけど誰だっけ」という状況で成立している記憶はどれか。","choices":["再生記憶","再認記憶","短期記憶の消失","記憶の完全な忘却"],"answer":1,"explanation":"見たことがあるか判断する「再認記憶」はできているが、完璧に思い出す「再生記憶」に至っていない状態である。"},{"level":2,"q":"本書が学習計画について強調していることはどれか。","choices":["復習込みで計画を立てる","一度で完璧に覚える","計画を立てない","暗記だけに集中する"],"answer":0,"explanation":"記憶術を使っても復習なしで長期間覚えておくことは難しいため、学習計画は復習込みで立てるべきである。"},{"level":3,"q":"脳トレによって得られる、能力向上以外の効果として本書が挙げるものはどれか。","choices":["視力の回復","自分の頭に自信が持てるようになる","睡眠時間の短縮","食欲の増進"],"answer":1,"explanation":"脳トレをすると能力が上がるだけでなく、自分の頭に自信が持てるようになり、知的活動への好循環が生まれる。"}]},"comp34":{"title":"株の爆益につなげる「暴落大全」","quiz":[{"level":1,"q":"株価暴落について本書が一貫して主張していることはどれか。","choices":["暴落したら二度と戻らない","長期的に見ると暴落しても必ずもとに戻っている","暴落は予測が容易である","暴落は投資家に無関係だ"],"answer":1,"explanation":"歴史上、株価暴落は何度も起きてきたが、長期的に見ると必ずもとに戻っており、10倍株の起点にもなり得る。"},{"level":1,"q":"本書によれば、暴落はどのくらいのペースで起きているとされるか。","choices":["10年に1度","5年に1度","2年に1度","毎月"],"answer":2,"explanation":"株価暴落は2年に1度のペースで起きているとされ、その歴史とメカニズムを知ることが備えになる。"},{"level":2,"q":"戦後最大の大暴落である「ブラックマンデー」の背景にあったとされるものはどれか。","choices":["為替変動","感染症の流行","戦争の勃発","金利の据え置き"],"answer":0,"explanation":"戦後最大の大暴落である「ブラックマンデー」は、為替変動が背景にあったとされている。"},{"level":2,"q":"「リーマンショック」の特異性として本書が挙げるものはどれか。","choices":["1回だけの急落だった","短期間に6回もの暴落を記録した","暴落が起きなかった","為替のみが原因だった"],"answer":1,"explanation":"「リーマンショック」は短期間に6回もの暴落を記録し、連鎖的に発生する暴落の例とされる。"},{"level":3,"q":"「はっしゃん式スロートレード法」の4ステップに含まれないものはどれか。","choices":["買い","長期保有","損切り","信用取引"],"answer":3,"explanation":"はっしゃん式スロートレード法は、買い・長期保有・損切り・利益確定の4ステップで行う手法である。"}]},"comp35":{"title":"科学的に自分を思い通りに動かす セルフコントロール大全","quiz":[{"level":1,"q":"モチベーションを上げるために本書が有効とする方法はどれか。","choices":["大きな目標だけを掲げる","小さな成功体験を積む","報酬を後回しにする","他人と比較し続ける"],"answer":1,"explanation":"モチベーションを上げるには小さな成功体験が有効で、細かく目標を設定して成功の機会を増やすとよい。"},{"level":1,"q":"本書がセルフコントロール法を分類している4つのパートに含まれるものはどれか。","choices":["仕事・生活・体・心","過去・現在・未来・夢","朝・昼・夜・深夜","知・情・意・体"],"answer":0,"explanation":"本書はセルフコントロール法を「仕事」「生活」「体」「心」の4つのパートに分けて紹介している。"},{"level":2,"q":"物を捨てられないタイプに本書が勧める、条件と行動を事前に決める手法はどれか。","choices":["イフ・ゼン・プランニング","タイムボクシング","ポモドーロ・テクニック","マインドマップ"],"answer":0,"explanation":"「この棚に入らなくなったら必ず何かを捨てる」といった「イフ・ゼン・プランニング」が有効とされる。"},{"level":2,"q":"朝起きるのがつらい人に本書が勧める逆転の発想はどれか。","choices":["目覚ましを増やす","計画的二度寝","前夜に早く寝ることだけを徹底","起床後すぐ運動"],"answer":1,"explanation":"無理に一発で起きようとするのではなく、あらかじめ二度寝を計画に組み込む「計画的二度寝」が勧められる。"},{"level":3,"q":"優柔不断な人に本書が勧める対処法はどれか。","choices":["決断のルールを事前に決めておく","毎回じっくり悩む","他人にすべて委ねる","決断を先延ばしにする"],"answer":0,"explanation":"決断のルールをあらかじめ決めておくことで、意志力を消耗せずに済むとされる。"}]},"comp36":{"title":"科学的に実証された 超ダイエット習慣大全","quiz":[{"level":1,"q":"本書が出発点として繰り返し強調する現実はどれか。","choices":["ダイエットは誰でも簡単に成功する","ダイエット成功者の8割はリバウンドしている","運動だけでやせられる","食事制限は不要だ"],"answer":1,"explanation":"ダイエット成功者の8割はリバウンドしており、やせた状態を保つことのほうが難しいというのが出発点である。"},{"level":1,"q":"本書がダイエットの最終目標として置き直しているものはどれか。","choices":["やせた後の体重維持","短期間での急激な減量","体脂肪率をゼロにすること","筋肉量の最大化"],"answer":0,"explanation":"本書はダイエットの最終目標を「やせた後の体重維持」に置き直している。"},{"level":2,"q":"ダイエット継続のカギとして本書が挙げる「設計」の単位はどれか。","choices":["30日を1サイクル","60日を1サイクル","90日を1サイクル","365日を1サイクル"],"answer":2,"explanation":"90日を1サイクルとして行動を習慣化することが、ダイエット継続のカギとされる。"},{"level":2,"q":"食事について本書が勧める選択はどれか。","choices":["エネルギー密度の低い食品を選ぶ","炭水化物を完全に断つ","一切の間食を禁じる","カロリーだけを数える"],"answer":0,"explanation":"エネルギー密度の低い食品を選び、たんぱく質と食物繊維を積極的にとることが勧められている。"},{"level":3,"q":"習慣形成に関する研究結果として本書が紹介するものはどれか。","choices":["1回サボると習慣は完全に崩れる","1回サボっても習慣形成にほとんど影響しない","習慣化には最低1年かかる","サボりは記録すべきでない"],"answer":1,"explanation":"1回サボっても習慣形成にほとんど影響しないという研究結果があり、やめる必要はないとされる。"}]},"comp37":{"title":"経営改革大全","quiz":[{"level":1,"q":"本書が次世代の価値軸とするものはどれか。","choices":["プロフィット（利益）","パーパス（志）","シェア（占有率）","スピード（速さ）"],"answer":1,"explanation":"次世代の価値軸となるのは、プロフィット（利益）ではなくパーパス（志）であるとされる。"},{"level":1,"q":"本書が提案する、これからの時代を表す言葉はどれか。","choices":["資本主義","志本主義","成果主義","市場主義"],"answer":1,"explanation":"これからは「資本主義」ではなく「志本主義」の時代だと著者は提案する。"},{"level":2,"q":"日本型経営について本書が主張していることはどれか。","choices":["欧米に大きく遅れている","むしろ先を行っている","もはや時代遅れである","株主第一主義に転換すべきだ"],"answer":1,"explanation":"日本企業は遅れているのではなく先を行っており、マルチステークホルダーに配慮する日本型経営こそ次にめざすものとされる。"},{"level":2,"q":"本書が100の経営モデルについて対比している2つの視点はどれか。","choices":["理論と実践","通説と真説","過去と現在","国内と海外"],"answer":1,"explanation":"本書は100の経営モデルについて、過去の解釈である「通説」と未来に向けた解釈である「真説」を対比する。"},{"level":3,"q":"本書が志本主義を提案する際に着目した、日本企業の伝統にある力はどれか。","choices":["異質なものを取り込む「和」の力","徹底した効率化の力","短期利益追求の力","トップダウンの力"],"answer":0,"explanation":"著者は、異質なものを取り込みより上質なものへと昇華する日本企業の伝統にある「和」の力に着目している。"}]},"comp38":{"title":"結果を出し続ける人が必ずやっている 「数学的」な仕事術大全","quiz":[{"level":1,"q":"本書がいう「数学的なビジネススキル」の定義はどれか。","choices":["数学の公式を暗記すること","数字と論理を用いて動作をし行為に落とし込むこと","計算を速くすること","統計を専門的に扱うこと"],"answer":1,"explanation":"数学的なビジネススキルとは、数字と論理を用いて動作をし、行為に落とし込むことを指す。"},{"level":1,"q":"本書は「数字」を何にたとえているか。","choices":["コトバ","道具","武器","地図"],"answer":0,"explanation":"数字とは「コトバ」であり、論理とは数学コトバを用いて文をつなげることだとされる。"},{"level":2,"q":"本書が挙げる5つの「動作」に含まれるものはどれか。","choices":["定義","記憶","反復","模倣"],"answer":0,"explanation":"本書における5つの動作は「定義」「分解」「比較」「構造化」「モデル化」である。"},{"level":2,"q":"本書が挙げる5つの「行為」に含まれるものはどれか。","choices":["計算する","見せる","暗記する","集計する"],"answer":1,"explanation":"5つの行為は「考える」「読む」「書く」「話す」「見せる」である。"},{"level":3,"q":"論理を構成するコトバとして本書が例示するものはどれか。","choices":["「よって」「次に」「以上より」","「たぶん」「なんとなく」「思うに」","「速い」「遅い」「同じ」","「大」「中」「小」"],"answer":0,"explanation":"「よって」「次に」「以上より」といった論理のコトバに親しむことで、話す内容に意味や結論を持たせられる。"}]},"comp39":{"title":"習慣超大全 スタンフォード行動デザイン研究所の自分を変える方法","quiz":[{"level":1,"q":"本書が自分を変えるもっとも手っ取り早い方法とするメソッドはどれか。","choices":["タイニー・ハビット（小さな習慣）","強い意志による断行","徹底した目標管理","毎朝の瞑想"],"answer":0,"explanation":"自分を変えるもっとも手っ取り早い方法は「タイニー・ハビット（小さな習慣）」だとされる。"},{"level":1,"q":"本書によれば、行動が起きるためにそろう必要がある3要素はどれか。","choices":["モチベーション・能力・きっかけ","時間・お金・場所","知識・経験・人脈","栄養・運動・睡眠"],"answer":0,"explanation":"「モチベーション」「能力」「きっかけ」の3つの要素がそろったときに行動が起きる。"},{"level":2,"q":"新しい習慣を始めるとき、既存の日課を何として活用するよう本書は勧めているか。","choices":["アンカー","ゴール","トリガーの排除対象","報酬"],"answer":0,"explanation":"既にある日課を「アンカー」として、そのあとに新しい習慣を行うようにすることが勧められる。"},{"level":2,"q":"本書が「継続」をどのようなものと捉えているか。","choices":["才能である","スキルであり練習で身につく","運によるものだ","意志の強さだけで決まる"],"answer":1,"explanation":"継続はスキルであり、練習によって身につくものだとされる。"},{"level":3,"q":"継続を促す方法として本書が有効とするものはどれか。","choices":["失敗を厳しく反省する","小さなことでもできたら自分を褒める","他人と競争する","目標を高く掲げ続ける"],"answer":1,"explanation":"小さなことでもちゃんとできたら自分を褒めることが有効で、それが積み重なって大きな習慣へと育つ。"}]},"comp40":{"title":"起業大全 スタートアップを科学する9つのフレームワーク","quiz":[{"level":1,"q":"本書が日本に圧倒的に少ないと指摘する存在はどれか。","choices":["0から1を作る起業家","1を100にする事業家","投資家","エンジニア"],"answer":1,"explanation":"0から1を作る起業家は増えたが、1を100にする事業家が日本には圧倒的に少ないと指摘される。"},{"level":1,"q":"本書が経営を分けて解説している要素の数はいくつか。","choices":["3つ","5つ","9つ","12"],"answer":2,"explanation":"本書は「スタートアップ・バランス・スコアカード」をもとに経営を9つの要素に分けて解説する。"},{"level":2,"q":"起業家が事業家に変身できないと、何が起きると本書は述べているか。","choices":["起業家自身が最大のボトルネックになる","資金がすぐ枯渇する","製品が完成しない","顧客が増えすぎる"],"answer":0,"explanation":"起業家から事業家に変身できないと、起業家自身が最大のボトルネックになり、事業をスケールできない。"},{"level":2,"q":"本書が挙げる「経営チームアベンジャー」を形成する4つの資質の型に含まれるものはどれか。","choices":["WHY型","WHEN型","WHERE型","WHICH型"],"answer":0,"explanation":"WHY型・WHAT型・HOW型・WHO型の4つの資質をバランス良く持つ経営チームが有利に成長できる。"},{"level":3,"q":"事業の中核を成す重要な要素として本書が挙げるものはどれか。","choices":["売る前の広告投資","売ったあとの顧客との関係構築","一度きりの大型販売","価格の徹底的な引き下げ"],"answer":1,"explanation":"売ったあとに顧客との関係を築き、継続して使い続けてもらうカスタマーサクセスの視点がスケールの鍵を握る。"}]},"comp41":{"title":"超タイトル大全 文章のポイントを短く、わかりやすく伝える「要約力」が身につく","quiz":[{"level":1,"q":"本書によれば、ウェブ記事の命運を決めるものはどれか。","choices":["本文の長さ","タイトル","公開時刻","著者名"],"answer":1,"explanation":"ウェブ記事の命運は「タイトル」で決まり、タイトルが平凡であればクリックすらされない。"},{"level":1,"q":"バズるタイトルをつけるために、最重要要素を持ってくるべき位置はどこか。","choices":["最初の9文字","中盤","末尾","本文の冒頭"],"answer":0,"explanation":"バズるタイトルをつけるには、最初の9文字に最重要要素を持ってくるべきである。"},{"level":2,"q":"最初の9文字を重視する理由として本書が挙げるものはどれか。","choices":["読者は9文字しか読まないから","表示上で切れてしまう部分にこそ最重要情報を配置するため","9は縁起の良い数字だから","検索エンジンが9文字で判断するから"],"answer":1,"explanation":"表示上で切れてしまう部分にこそ最重要情報を配置するため、最初の9文字に重要なキーワードや数字を入れる。"},{"level":2,"q":"バズる準備の4視点に含まれるものはどれか。","choices":["旬のキーワード","文字数の制限","色彩の選択","フォントの種類"],"answer":0,"explanation":"バズる準備の4視点は「旬のキーワード」「共感されるテーマ」「好みと悩み」「5W1H」である。"},{"level":3,"q":"依頼を受けて書く仕事で、本書がつかむことも重要だとする相手はどれか。","choices":["編集者","印刷会社","広告主","同業ライター"],"answer":0,"explanation":"編集者はバズりそうなタイトルの企画を見ているため、タイトルで編集者の心をつかむことも重要になる。"}]},"comp42":{"title":"超ライティング大全 「バズる記事」にはこの1冊さえあればいい","quiz":[{"level":1,"q":"バズる文章について本書が説くことはどれか。","choices":["才能がすべてである","「型」があり真似るだけで速くうまく書ける","長ければ長いほどよい","難しい言葉を使うべきだ"],"answer":1,"explanation":"バズる文章には「型」があり、その型を真似るだけで速くうまく文章が書けるようになる。"},{"level":1,"q":"本書の著者が研究した記事の規模として正しいものはどれか。","choices":["8年間で1万4491本","1年間で100本","3年間で500本","10年間で50本"],"answer":0,"explanation":"著者は8年間でバズった記事1万4491本を研究し、その型をまとめている。"},{"level":2,"q":"バズる文章を書くために本書が必要とする両輪はどれか。","choices":["テーマ選定と書き方","速さと安さ","長さと難しさ","画像と動画"],"answer":0,"explanation":"人を引きつけるテーマを選んだうえで、読まれる書き方を意識した記事づくりを行う両輪が必要とされる。"},{"level":2,"q":"バズる確率を上げる推敲の方法として本書が勧めるものはどれか。","choices":["書いた直後にすぐ公開する","一晩寝かせて推敲する","推敲を省く","他人に丸ごと書き直させる"],"answer":1,"explanation":"一晩寝かせて推敲するだけでバズる確率が上がり、推敲後はギリギリまでタイトルにこだわるとよい。"},{"level":3,"q":"ライターとして独立し息長く続けるために本書が説く姿勢はどれか。","choices":["一つのジャンルだけに固執する","一つのジャンルに固執せず書き続ける努力をする","話題の記事だけを書く","執筆量を絞る"],"answer":1,"explanation":"息長くやっていくには、一つのジャンルに固執せず、書き続けるための様々な努力が必要だとされる。"}]}}},
  "finance": {"themeBookOrder":["fin01","fin06","fin12","fin18","fin24","fin30","fin36","fin42","fin48","fin54"],"bookQuiz":{"fin01":{"title":"増補改訂版 道具としてのファイナンス","quiz":[{"q":"本書におけるファイナンスの定義として正しいものは。","answer":0,"level":1,"explanation":"ファイナンスは投資・調達・株主還元の意思決定を扱い、その先に企業価値の最大化がある。","choices":["企業が行う財務的な意思決定の方法を学ぶ学問","従業員の働きがいを高める心理学","商品を宣伝して売上を伸ばす技術","工場の生産効率を上げる手法"]},{"q":"NPV法で投資すべきと判断する条件は。","answer":3,"level":1,"explanation":"NPVは将来キャッシュフローの現在価値合計から初期投資額を引いた値で、0以上なら投資すべきと判断する。","choices":["総資産回転率が業界平均を上回るとき","売上高が前年より増えているとき","初期投資額がゼロのとき","NPVが0以上のとき"]},{"q":"WACCとは何の加重平均か。","answer":1,"level":2,"explanation":"WACCはデット(社債・銀行借入)とエクイティ(株式発行)の加重平均資本コストで、企業はこれを上回るリターンを求められる。","choices":["売上高と営業利益","デット・ファイナンスとエクイティ・ファイナンスの資本コスト","総資産と純資産","固定費と変動費"]},{"q":"ROEを高める要因として本書が挙げるのは。","answer":2,"level":2,"explanation":"ROEは売上高当期純利益率と総資産回転率と財務レバレッジに分解でき、財務レバレッジを高めるとROEは上がるがリスクも増す。","choices":["総資産回転率を下げる","売上高当期純利益率を下げる","財務レバレッジを高めてデットを増やす","現金保有を増やす"]},{"q":"拡張NPVの説明として正しいのは。","answer":3,"level":3,"explanation":"リアル・オプションは経営の自由度の価値を評価し、その価値をNPVに加えたものが拡張NPVである。","choices":["初期投資額から将来キャッシュフローを引いた値","WACCをフリーキャッシュフローで割った値","売上高から費用を引いた利益","NPV法で計算される価値と経営の自由度の価値の合計"]}]},"fin02":{"title":"ゼロからわかるファイナンス思考 働く人と会社の成長戦略","quiz":[{"q":"本書がファイナンスをどう定義するか。","answer":1,"level":1,"explanation":"本書はファイナンスを、すべてのビジネスパーソンが触れるべき企業価値最大化の活動と説く。","choices":["目先の利益を確保する節約術","企業価値を最大化するためにおこなう活動","株式を高値で売り抜ける投資テクニック","税金を最小化する会計処理"]},{"q":"ファイナンス思考の4つの活動に含まれないのは。","answer":2,"level":1,"explanation":"4つの活動は資金調達・資金の創出・資産の最適配分・ステークホルダーコミュニケーションである。","choices":["外部からの資金調達","資産の最適配分","競合他社の買収妨害","ステークホルダー・コミュニケーション"]},{"q":"返済義務がなく成長性が重視される資金調達は。","answer":0,"level":2,"explanation":"エクイティ・ファイナンスは返済義務がなく成長性が重視され、デットには返済義務がある。","choices":["エクイティ・ファイナンス","デット・ファイナンス","社債の発行","銀行借入"]},{"q":"「PL脳」の説明として正しいのは。","answer":3,"level":2,"explanation":"PL脳は短期的なPL数値を絶対視し、企業価値を損なうことがある病とされる。","choices":["キャッシュフローを最優先する姿勢","長期的な企業価値を評価軸に据える考え","BSの健全性だけを重視する態度","増収増益などPL上の数値の良さを絶対視する状態"]},{"q":"本書が「実際のお金の出入りを対象とするためごまかせない」とするのは。","answer":1,"level":3,"explanation":"PLは意図的に数値を良く見せる余地があるが、キャッシュフロー計算書は実際のお金の出入りを対象とするためごまかせない。","choices":["損益計算書(PL)","キャッシュフロー計算書","中期経営計画","有価証券報告書の注記"]}]},"fin03":{"title":"ファイナンス思考 日本企業を蝕む病と、再生の戦略論","quiz":[{"q":"本書が「失われた30年」の元凶とするのは。","answer":2,"level":1,"explanation":"本書は、目先の売上・利益を最大化することを目的視するPL脳が日本企業の長期的価値向上を阻んだと説く。","choices":["過度なリスクテイク","海外投資家の増加","目先の利益を目的視する「PL脳」","終身雇用制度そのもの"]},{"q":"ファイナンス思考の特徴として挙げられるのは。","answer":0,"level":1,"explanation":"本書はファイナンス思考を価値志向・長期志向・未来志向と特徴づける。","choices":["価値志向・長期志向・未来志向","コスト志向・短期志向・現状維持志向","売上志向・四半期志向・管理志向","配当志向・安定志向・保守志向"]},{"q":"会社が評価され続ける3つの市場に含まれないのは。","answer":3,"level":2,"explanation":"会社は財市場・労働市場・資本市場の3つから評価され、経営者はその利害を長期目線で調整する。","choices":["財市場(顧客)","労働市場(従業員)","資本市場(投資家)","為替市場(通貨)"]},{"q":"本書がファイナンス思考の好例として挙げるアマゾンの特徴は。","answer":1,"level":2,"explanation":"アマゾンは上場以来無配を貫き、顧客への価値提供を最大化する投資に注力し株主の納得を得てきた。","choices":["高配当を継続してきた","1997年の上場以来無配を貫いてきた","借入を一切しない無借金経営","早期の黒字化を最優先した"]},{"q":"日本企業がPL脳から脱却できない理由として挙げられるのは。","answer":0,"level":3,"explanation":"管理会計が対前年比のPL予実に依存し、たたき上げ人材がPL脳のまま経営者になる構造が脱却を阻む。","choices":["現場の管理会計が対前年比のPL予実算をベースにしている","海外機関投資家の圧力が強すぎる","会計基準が頻繁に変更される","株式の持ち合いが解消された"]}]},"fin04":{"title":"あれか、これか 「本当の値打ち」を見抜くファイナンス理論入門","quiz":[{"q":"本書が説くファイナンス思考の第一原則は。","answer":3,"level":1,"explanation":"前例がない場合などに対応するため、価格と価値を分け価値評価に軸足を移すのが第一原則である。","choices":["コストを積み上げて価格を決める","市場価格をそのまま採用する","現金を最も価値の高い資産とみなす","価格と価値を分けて考える"]},{"q":"ファイナンスで最も価値が低いとされる資産は。","answer":1,"level":1,"explanation":"現金はキャッシュフローを生まない最も収益性の低い資産とされ、現金への固執は最も損な投資と説かれる。","choices":["不動産","現金","特許などの知的財産","株式"]},{"q":"キャッシュフロー・アプローチの考え方は。","answer":2,"level":2,"explanation":"ファイナンスはモノの価値をそれが生み出すお金の量で捉え、銀座のコーヒーの例のように因果律を逆に見る。","choices":["モノの価値は仕入れコストで決まる","モノの価値は市場の平均価格で決まる","モノの価値はそれが生み出すお金の量で決まる","モノの価値は所有者の満足度で決まる"]},{"q":"バランスシートが会計と逆順(現金に変えやすい順)で記述される理由は。","answer":0,"level":2,"explanation":"ファイナンスは現金を最も収益性の低い資産とみなすため、BSは現金に変えやすい順で記述される。","choices":["現金それ自体を最も収益性の低い資産として扱うから","現金が最も価値の高い資産だから","会計基準がそう定めているだけで意味はない","負債を先に返済する必要があるから"]},{"q":"ファイナンスにおける「リスク」の意味として正しいのは。","answer":2,"level":3,"explanation":"ファイナンスのリスクは危険性ではなく不確実性を指し、予想より良い結果が起こる可能性の追求こそ真骨頂とされる。","choices":["損失が確定した状態","投資してはいけない危険性","危険性ではなく不確実性","割引率がゼロであること"]}]},"fin05":{"title":"コーポレートファイナンス 戦略と実践","quiz":[{"q":"企業のバリュエーションの土台となるアプローチは。","answer":0,"level":1,"explanation":"どの企業にも強みと弱みからなるキャラクターがあり、その分析がバリュエーションの土台となる。","choices":["企業のキャラクター分析","従業員満足度調査","広告効果測定","商品デザイン評価"]},{"q":"企業のキャラクターを構成する4要素のうち、相対的に重要とされるのは。","answer":2,"level":1,"explanation":"4要素のうち相対的に重要なのは収益性と生産性であり、ROAはその両方をかけ合わせた指標である。","choices":["安全性と成長性","成長性と収益性","収益性と生産性","安全性と収益性"]},{"q":"企業倒産時に弁済が優先されるのは。","answer":1,"level":2,"explanation":"倒産時はデットの弁済が優先されるため、エクイティのほうが投資家にとってリスクが大きい。","choices":["エクイティ(株主資本)","デット(有利子負債)","経営者の役員報酬","従業員の退職金"]},{"q":"在庫回転期間45.2日という驚異的な生産性の高さで特徴づけられるのは。","answer":3,"level":2,"explanation":"いきなり!ステーキは在庫回転期間45.2日という生産性の高さ、日高屋は収益性の高さで対照的な強みを持つ。","choices":["吉野家","日高屋","セブンイレブン","いきなり!ステーキ"]},{"q":"ソフトバンクグループのファイナンス戦略の特徴として述べられるのは。","answer":1,"level":3,"explanation":"ボーダフォン・スプリント・アーム買収で、安定した事業をコストの低いデットを活用して企業価値を高めた堅実な戦略とされる。","choices":["エクイティ中心で無借金を貫いた","安定したキャッシュフローを持つ事業をコストの低いデットで買収した","リスクの高い新興事業を株式交換で買収した","現金を厚く保有し買収を避けた"]}]},"fin06":{"title":"決定版 銀行デジタル革命 現金消滅で金融はどう変わるか","quiz":[{"q":"著者が金融の未来のゴールと見据えるのは。","answer":1,"level":1,"explanation":"元日銀審議委員の著者は、中央銀行によるデジタル通貨の発行こそ本当の金融革命の中心になりうると提言する。","choices":["現金の全面的な廃止による無政府化","中央銀行による通貨のデジタル化","メガバンクの完全国有化","仮想通貨による法定通貨の置き換え"]},{"q":"日本の現金流通の特徴として述べられるのは。","answer":3,"level":1,"explanation":"日本は現金志向が強く、流通現金の9割以上が1万円札というタンス預金的な性質を帯びている。","choices":["硬貨の流通量が突出して多い","現金流通がほぼ電子化されている","流通現金の大半が千円札である","流通する現金の9割以上が1万円札である"]},{"q":"日本の現金流通コストは年にどの程度と推計されているか。","answer":0,"level":2,"explanation":"発行・流通・保管コストに盗難や税金逃れの見えないコストも含めると、年15兆円から20兆円程度と推計される。","choices":["15兆円から20兆円程度","1兆円から2兆円程度","100兆円以上","5000億円未満"]},{"q":"かつて収益力の小さい金融機関でも生き残れるよう規制した仕組みは。","answer":2,"level":2,"explanation":"護送船団方式は最も収益力の小さい金融機関でも生き残れるよう規制し、時代への対応の遅れを生んだとされる。","choices":["5%ルール","ペイオフ制度","護送船団方式","BIS規制"]},{"q":"本書が中央銀行デジタル通貨の試みとして挙げる例は。","answer":3,"level":3,"explanation":"本書はウルグアイのeペソやスウェーデンのe-kronaを中央銀行デジタル通貨の試験・検討例として挙げる。","choices":["米国のドルコインと英国のポンドペイ","中国のデジタル人民元とインドのeルピー","ドイツのeマルクとフランスのeフラン","ウルグアイのeペソとスウェーデンのe-krona"]}]},"fin07":{"title":"ユーザーファースト 穐田誉輝とくふうカンパニー","quiz":[{"q":"穐田誉輝が育て上げたサービスに含まれないのは。","answer":2,"level":1,"explanation":"穐田はカカクコム・食べログ・クックパッドを次々に育て上げた経営者である。","choices":["カカクコム","食べログ","メルカリ","クックパッド"]},{"q":"高校時代の穐田がステレオ購入資金30万円を手にして行ったことは。","answer":0,"level":1,"explanation":"買い物と価格調査そのものを愛したこの執念が、後のカカクコムや食べログの原型的な発想につながった。","choices":["秋葉原の電気街を1カ月以上かけて徹底的に価格調査した","すぐに最高級品を購入した","その資金を元手に株式投資を始めた","資金を貯金して使わなかった"]},{"q":"就職活動で穐田が日本合同ファイナンスを選んだ理由は。","answer":3,"level":2,"explanation":"起業目的に合う職を求め、起業に必要な知識が身につくVCの日本合同ファイナンスを選び、飛び込み営業で情熱を磨いた。","choices":["給与が最も高かったから","終身雇用が保証されていたから","実家に近かったから","起業に必要な知識とノウハウが身につくベンチャーキャピタルだったから"]},{"q":"カカクコム社長就任後に穐田が行った方針転換は。","answer":1,"level":2,"explanation":"掲載順を出稿金額の高い順から商品価格が安い順に変える大胆な転換で、取扱商品数とユーザー数を急伸させた。","choices":["掲載順を出稿金額の高い順に変えた","掲載順を商品価格が安い順に変えた","有料会員制を導入した","取扱商品数を絞り込んだ"]},{"q":"クックパッド社長就任後に穐田が示したユーザーファースト経営は。","answer":0,"level":3,"explanation":"全社員との1on1を通じ、投稿者だけでなくレシピを見るライトユーザーの利益も起点に意思決定を行った。","choices":["約100名の全社員と1on1面接を行い、投稿者だけでなくライトユーザーにも役立つサイトを目指した","レシピ投稿者だけを優遇する制度を作った","広告収入の最大化を最優先した","有料機能を大幅に増やした"]}]},"fin08":{"title":"物語でわかる ベンチャーファイナンス入門","quiz":[{"q":"「ベンチャー」という語について本書が指摘するのは。","answer":3,"level":1,"explanation":"米国で起業に相当するのはスタートアップやスモールビジネスで、ベンチャーはベンチャーキャピタルという投資家側の業態を指す。","choices":["世界共通で起業家を指す標準的な英語である","大企業の新規事業部門を指す語である","銀行融資の一種を指す専門用語である","米国では投資家側の業態を指し、起業を指すのは和製英語である"]},{"q":"狭義のファイナンスの目標は。","answer":1,"level":1,"explanation":"狭義のファイナンスは日常反復的なおカネの出し入れや保管・返済で、目標は流動性の維持にある。","choices":["収益性の向上","流動性の維持","株価の最大化","従業員満足の向上"]},{"q":"シード期・スタートアップ期の資金調達の中心は。","answer":0,"level":2,"explanation":"成長段階に応じて調達先は変わり、シード・スタートアップ期は創業者の自己資金が中心となる。","choices":["創業者の自己資金","大手金融機関の長期融資","社債の公募発行","株式公開による調達"]},{"q":"資金調達を分類する4つの観点に含まれないのは。","answer":2,"level":2,"explanation":"4つの観点は株主資本と他人資本、長期資本と短期資本、内部金融と外部金融、直接金融と間接金融である。","choices":["内部金融と外部金融","直接金融と間接金融","固定金融と変動金融","長期資本と短期資本"]},{"q":"株式公開(IPO)の留意点として挙げられるのは。","answer":1,"level":3,"explanation":"IPOには多くのメリットがある一方、莫大なコスト、開示義務、買占め・乗っ取りの危機などの留意点がある。","choices":["資金調達力が低下する","買占め・乗っ取りの危機や同族経営維持の困難化","企業内容を一切開示しなくてよくなる","創業者がキャピタルゲインを得られなくなる"]}]},"fin09":{"title":"新解釈 コーポレートファイナンス理論","quiz":[{"q":"本書がコーポレートファイナンス理論をどう捉え直すか。","answer":0,"level":1,"explanation":"本書は同理論を、不確実な未来に企業がどう決断するかというミステリーをミクロ経済学で解明する学問と捉える。","choices":["企業行動のミステリーを解明する学問","企業価値拡大の手順を教えるハウツウ","会計処理を効率化する技術","株価を予測する統計学"]},{"q":"本書が「資本コスト」をどう定義するか。","answer":2,"level":1,"explanation":"資本コストは事業の不確実性を年率何%で表したもので、これを超えるキャッシュフロー獲得が企業価値拡大となる。","choices":["銀行に支払う利息の総額","株式発行にかかる手数料","企業が行う事業の不確実性(リスク)を年率何%で表したもの","従業員に支払う給与の割合"]},{"q":"コーポレートファイナンス理論で最も大事とされる原則は。","answer":3,"level":2,"explanation":"リスクが高い株式ほど高いリターンが要求され株主資本コストも高くなる、というのが最も大事な原則である。","choices":["コストは常に削減すべきという原則","現金は多いほどよいという原則","会計利益を最大化すべきという原則","リスクとリターンがセットになっているという原則"]},{"q":"会計とファイナンスの発想の違いとして正しいのは。","answer":1,"level":2,"explanation":"会計が収益から費用を引いた利益で発想するのに対し、ファイナンスは投資して将来どれだけキャッシュを回収できるかで発想する。","choices":["会計は将来のキャッシュ回収で発想する","ファイナンスは投資して将来どれだけキャッシュを回収できるかで発想する","ファイナンスは収益から費用を引く利益で発想する","両者の発想に違いはない"]},{"q":"企業がある程度の現金を保有することの合理性を説明する理論は。","answer":2,"level":3,"explanation":"現金自体は価値を生まないが、外部資金調達の優先順位を説くペッキングオーダー理論に照らせば現金保有に合理性がある。","choices":["損失回避性","護送船団方式","ペッキングオーダー理論","コスト・アプローチ"]}]},"fin10":{"title":"教養としての社会保障","quiz":[{"q":"本書が提示する社会保障についての逆転の発想は。","answer":1,"level":1,"explanation":"本書は社会保障を単なる負担でなく、雇用を創出する経済成長のエンジンになりうると捉え直す。","choices":["社会保障は削減すべき単なる負担である","社会保障は経済成長のエンジンになりうる","社会保障は富裕層だけのものである","社会保障は民間に任せるべきである"]},{"q":"近代社会保障制度が最初に生まれた国は。","answer":0,"level":1,"explanation":"社会保障は産業革命による資本家と労働者の階級対立という社会不安を解消するためイギリスで生まれた。","choices":["イギリス","アメリカ","日本","ドイツ"]},{"q":"日本の社会保障を支える基本的な仕組みは。","answer":2,"level":2,"explanation":"現在の日本の社会保障は、自助を中心に共助が支えるという仕組みで運営されている。","choices":["公助のみで運営される","共助を中心に自助が支える","自助を中心に共助が支える","私的保険だけで完結する"]},{"q":"人口減少社会で労働力人口を上げるカギとして挙げられるのは。","answer":3,"level":2,"explanation":"人口減少社会では女性が働きながら子供を持てるよう、女性の社会進出と子育ての両立支援がカギを握る。","choices":["定年の完全撤廃","外国人労働者の全面受け入れ","労働時間の大幅延長","女性の社会進出と子育ての両立支援"]},{"q":"本書が説く「競争から共生へ」の改革の方向性は。","answer":0,"level":3,"explanation":"何度でもやり直せるリーグ戦型へ競争システムを変え、自立と連帯をもとに共生へ社会を変革することが説かれる。","choices":["一度負けたら終わりのトーナメント型から、何度でも再挑戦できるリーグ戦型へ","競争を完全に排除した平等社会へ","勝者総取りの徹底したトーナメント型へ","国家がすべてを管理する計画経済へ"]}]},"fin11":{"title":"一流の投資家はなぜ、メンタルを大切にするのか？","quiz":[{"q":"一流投資家が長期的に成功する理由として本書が挙げるのは。","answer":2,"level":1,"explanation":"本書はバフェットらの成功の理由を、マーケット心理を読み取り自身の心理を適切にコントロールするスキルに見る。","choices":["誰よりも多くの資金を持つこと","最新のツールを使うこと","マーケット心理を読み自分の心理をコントロールするスキル","短期売買を繰り返すこと"]},{"q":"行動ファイナンス理論がいう「損失回避性」とは。","answer":3,"level":1,"explanation":"人は利得より損失に大きな不満足を抱く損失回避性を持ち、これが損切りの遅れにつながる。","choices":["損失を出したら投資をやめる傾向","利益を早く確定したがる傾向","損失も利益も同じように感じる傾向","利得よりも損失に大きな不満足感を抱く傾向"]},{"q":"株価上昇局面で生じやすい心理状態は。","answer":0,"level":2,"explanation":"上昇局面では万能感や高額商品購入の増加といった躁状態的なトレードハイが生じやすい。","choices":["万能感などの躁状態的なトレードハイ","悲観に支配されるトレードうつ","完全な無関心","極端な損失回避"]},{"q":"自分の思考の癖を客観視して認知の歪みを修正することを何と呼ぶか。","answer":1,"level":2,"explanation":"ストレス要因の除去に加え、自分の思考の癖を客観視するメタ認知による修正が心理コントロールの鍵となる。","choices":["損失回避","メタ認知","感応度逓減","ポジション管理"]},{"q":"リスクマネジメントの2種類の管理法として正しいのは。","answer":3,"level":3,"explanation":"保有資産の構成比率を決めるポートフォリオ管理法と、買い・売りのどちらで持つかを判断するポジション管理法の2種類がある。","choices":["収益管理法とコスト管理法","短期管理法と長期管理法","買い管理法と売り管理法","ポートフォリオ管理法とポジション管理法"]}]},"fin12":{"title":"すべての働く人のための新しい経営学","quiz":[{"q":"本書が経営学に横串を通すために着目したビジネスモデルの4要素は。","answer":3,"level":1,"explanation":"本書はビジネスをターゲット・バリュー・ケイパビリティ・収益モデルの4要素に単純化して学び直す。","choices":["ヒト・モノ・カネ・情報","調達・生産・物流・販売","経営戦略・マーケ・会計・財務","ターゲット・バリュー・ケイパビリティ・収益モデル"]},{"q":"本書が理解と実践の対象として特化しているのは。","answer":0,"level":1,"explanation":"本書は全社レベルの内容(M&AやPPMなど)を切り捨て、多くの人が取り組む事業レベルに特化する。","choices":["事業レベル(1つの事業)","全社レベル(複数事業の管理)","国家レベルの経済政策","個人レベルの家計管理"]},{"q":"ターゲットとバリューを決めるSTPのフレームワークに含まれるのは。","answer":1,"level":2,"explanation":"STPは顧客を細分化するセグメンテーション、対象を絞るターゲティング、提供価値を決めるポジショニングからなる。","choices":["サプライ・トランスポート・プロモーション","セグメンテーション・ターゲティング・ポジショニング","戦略・戦術・実行","調査・試作・量産"]},{"q":"マイケル・ポーターの3類型に含まれないのは。","answer":2,"level":2,"explanation":"ポーターの3類型はコストリーダーシップ・差別化・集中で、2軸のポジショニングマップに落とし込める。","choices":["コストリーダーシップ","差別化","多角化","集中"]},{"q":"他社が模倣できない独自の強みとなるケイパビリティを何と呼ぶか。","answer":0,"level":3,"explanation":"ケイパビリティはリソースとオペレーションから構成され、他社が模倣できない独自の強みがコア・コンピタンスとなる。","choices":["コア・コンピタンス","ポジショニングマップ","収益モデル","セグメンテーション"]}]},"fin13":{"title":"起業のファイナンス 増補改訂版 ベンチャーにとって一番大切なこと","quiz":[{"q":"本書がベンチャーに勧める資金調達方法は。","answer":0,"level":1,"explanation":"株式で調達した資金は金利や返済が不要で、投資家がリスクを引き受けるため、ベンチャーに適するとされる。","choices":["株式による資金調達","銀行融資による資金調達","社債の発行","経営者の個人保証付き借入"]},{"q":"銀行がお金を貸す相手について本書が指摘するのは。","answer":1,"level":1,"explanation":"銀行は絶対潰れない先にしか貸さず、リスクの高いベンチャーが借入に頼ると潰れれば社長個人が借金を背負う。","choices":["リスクの高いベンチャーを好んで支援する","絶対潰れない先にしかお金を貸さない","事業計画さえあれば誰にでも貸す","株式と引き換えに融資する"]},{"q":"本書が資本金についてどう考えるよう勧めるか。","answer":3,"level":2,"explanation":"資本金は債権者のバッファで、小さいほうが税制上有利なことが多いが、設立時に債務超過になる金額は避けるべきとされる。","choices":["できるだけ大きくすべきである","株主が得をするため多いほどよい","会社の信用のため上限まで積むべき","なるべく減らせないかと考えてみるべき"]},{"q":"本書が説く事業計画の役割は。","answer":2,"level":2,"explanation":"事業計画は頭の中のシミュレーションを共有しやる気にさせる源で、完璧でなくても投資を受けられることがある。","choices":["一度作れば変更してはいけない契約書","精緻であれば必ず投資を受けられる保証","関係者を「これならいける」とやる気にさせるシミュレーション","税務署に提出する法定書類"]},{"q":"本書によれば企業価値は何によって決まるか。","answer":1,"level":3,"explanation":"投資家はEXITを前提に投資するため、企業価値は複数の算出方法を併用しつつ最終的に需給バランスで決まる。","choices":["簿価純資産法による計算結果だけで決まる","資金を求める側と投資する側の需給バランスで決まる","過去の売上高の平均で決まる","経営者が一方的に提示した希望額で決まる"]}]},"fin14":{"title":"マッキンゼー成熟期の成長戦略 2014年新装版","quiz":[{"q":"本書によれば成熟社会で収益維持のために不可欠なのは。","answer":1,"level":1,"explanation":"効率化のみの収益志向は中長期で営業利益が低迷しがちで、成熟社会では成長志向が収益維持に不可欠となる。","choices":["効率化のみに注力する収益志向型の運営","当初は苦しくても中長期で利益を改善する成長志向型の運営","固定費投資を一切避ける運営","市場からの撤退を優先する運営"]},{"q":"成熟期の戦略で本書が重視すべきとするのは。","answer":2,"level":1,"explanation":"成熟期は限られたパイの取り合いとなるため、市場の魅力度より自社の強みを重視すべきだとされる。","choices":["市場の魅力度だけを重視する判断","競争相手の存在を無視した拡大","市場の魅力度より自社の強み","高度経済成長期と同じポートフォリオ管理"]},{"q":"活性化企業に共通する8つの条件の駆動力として挙げられるのは。","answer":0,"level":2,"explanation":"活性化企業はトップからの命令でなく価値観が駆動力となっており、皮肉にも日本型企業の特徴に近いとされる。","choices":["トップからの数字や命令ではなく価値観","厳格な数値目標とノルマ","徹底した中央集権","短期的な株主還元"]},{"q":"成熟期に全社的にはっきりさせるべき方向性として挙げられるのは。","answer":3,"level":2,"explanation":"成熟期にはコスト競争力で徹底して勝つか、特定セグメントへの差別化を重視するか、全社で方向性を定めるべきとされる。","choices":["市場の魅力度だけに従うこと","すべての事業に均等投資すること","新製品開発を停止すること","コスト競争力で勝つか特定セグメントで差別化するか"]},{"q":"新製品開発を阻む組織の壁を乗り越える方法として挙げられるのは。","answer":2,"level":3,"explanation":"新製品を徐々に全社波及させる工夫や人事評価への反映に加え、状況に応じたリーダーシップの使い分けが求められる。","choices":["予算編成のサイクルを撤廃すること","技術部門と販売部門を統合すること","状況に応じてリーダーシップの型を使い分けること","新製品開発を外部に丸投げすること"]}]},"fin15":{"title":"決定版FinTech 金融革命の全貌","quiz":[{"level":1,"answer":0,"explanation":"1998年に創業した「PayPal」は、その出身者たちがテスラモーターズやYouTubeなどを創業しシリコンバレーに影響を与えた。","q":"オンライン決済の必要性から生まれた決済サービス「PayPal」が創業されたのは何年か。","choices":["1998年","2001年","2008年","2016年"]},{"level":1,"answer":2,"explanation":"本書はフィンテックを金融とITの融合によって生まれた新しい金融サービスと定義している。","q":"本書はフィンテックをどのように定義しているか。","choices":["現金を電子マネーに置き換える技術","銀行が行う伝統的な融資業務","金融とITの融合によって生まれた新しい金融サービス","中央銀行が管理する決済網"]},{"level":2,"answer":1,"explanation":"マネックス証券などのオンライン証券が1999年に誕生するなど、日本は実はフィンテック先進国だった。","q":"本書によれば、日本で低コストなオンライン証券サービスが誕生したのはいつ頃か。","choices":["1985年","1999年","2010年","2016年"]},{"level":2,"answer":3,"explanation":"ビットコインは中央銀行ではなくネットワークが発行主体となり、参加者全員が取引データを分散管理する。","q":"ビットコインの発行主体は何か。","choices":["各国の中央銀行","国際的な決済会社","大手商業銀行の連合","参加者が支える分散ネットワーク"]},{"level":3,"answer":0,"explanation":"顧客属性や購買歴を人工知能が分析して融資可否を判断するなど、ビッグデータと人工知能が両輪となっている。","q":"本書がフィンテックを後押しする両輪的存在と位置づけるものは何か。","choices":["ビッグデータと人工知能","中央銀行と政府規制","現金と紙の帳簿","ブランド力と店舗網"]}]},"fin16":{"title":"コーポレート・ファイナンス CFOを志す人のために","quiz":[{"level":1,"answer":0,"explanation":"金融取引とは契約により現在の富と未来に返してもらう富とを交換する取引であると説明される。","q":"本書は金融取引の本質をどのように説明するか。","choices":["現在の富と未来の富とを交換する取引","余った現金を金庫に保管する行為","物々交換を効率化する仕組み","税金を国家に納める義務"]},{"level":1,"answer":1,"explanation":"1602年設立のオランダ東インド会社に始まる株式会社制度で、株主の有限責任という特色が生まれた。","q":"本書が株主有限責任の起点として挙げる、1602年設立の会社はどれか。","choices":["イギリス東インド会社","オランダ東インド会社","メディチ銀行","ハドソン湾会社"]},{"level":2,"answer":1,"explanation":"有限責任とは、会社が倒産しても株主が出資額以上の財産上の責任を追及されない性質を指す。","q":"株主有限責任とはどのような性質か。","choices":["会社の負債を全額肩代わりする義務","会社が倒産しても出資額以上の責任を負わない","配当を必ず受け取れる権利","経営に無制限に介入できる権利"]},{"level":2,"answer":1,"explanation":"DCF法は将来のキャッシュフローを加重平均資本コスト(WACC)で割り引いて企業価値を計算する。","q":"DCF法で将来のキャッシュフローを割り引く際に用いる割引率は何か。","choices":["安全資産の金利のみ","加重平均資本コスト(WACC)","物価上昇率","配当利回り"]},{"level":3,"answer":2,"explanation":"MM命題は資本構成が企業価値に無関連であると証明したが、現実の最適資本構成は今も未解明の難問である。","q":"本書が説明するMMの無関連性命題について正しいのはどれか。","choices":["負債は必ず企業価値を高めると証明した","最適資本構成の答えを完全に解明した","資本構成は企業価値に一切関係がないと証明した","配当政策が企業価値を決めると示した"]}]},"fin17":{"title":"会計の世界史 イタリア、イギリス、アメリカ――500年の物語","quiz":[{"level":1,"answer":0,"explanation":"15世紀イタリアで為替手形の記録を残すために簿記の技術が誕生した。","q":"本書によれば、簿記の技術が誕生したのはいつ頃のどこか。","choices":["15世紀イタリア","18世紀イギリス","19世紀アメリカ","20世紀ドイツ"]},{"level":1,"answer":1,"explanation":"莫大な初期投資が必要な鉄道会社で、支出を数年に分けて負担させる減価償却が生まれた。","q":"減価償却のルールが誕生した業界はどれか。","choices":["イタリアの貿易商","イギリスの鉄道会社","アメリカの石油会社","オランダの銀行"]},{"level":2,"answer":1,"explanation":"キャッシュレスで取引できる為替手形が登場し、その記録のために簿記が生まれた。","q":"15世紀イタリアで東方貿易のリスクを軽減するために登場したものは何か。","choices":["株式","為替手形","保険証券","国債"]},{"level":2,"answer":2,"explanation":"メディチ銀行は権限を各拠点に分権化し、支配人が帳簿を持って定期的に本部を訪ねる仕組みで遠隔地経営を実現した。","q":"メディチ銀行が遠隔地経営を可能にした仕組みはどれか。","choices":["すべての決定を本部で一括管理した","支店を持たず本店だけで運営した","権限を各拠点に分権化し支配人が帳簿を持って本部を訪ねた","現金輸送に武装護衛を付けた"]},{"level":3,"answer":2,"explanation":"鉄道会社の合併が進むと決算書もつながる連結決算が19世紀末に始まった。","q":"1869年にアメリカの大陸横断鉄道が完成し合併が進んだことで、19世紀末に始まったものは何か。","choices":["減価償却","為替手形","連結決算","複式簿記"]}]},"fin18":{"title":"ビジネススクールで身につける 会計×戦略思考","quiz":[{"level":1,"answer":1,"explanation":"決算書はWHY(なぜ)・SO WHAT(何が言えるか)・HOW(どうすべきか)で読むべきだとされる。","q":"本書が示す、決算書を読み解くための3つの問いはどれか。","choices":["WHO・WHEN・WHERE","WHY・SO WHAT・HOW","PLAN・DO・CHECK","見る・書く・覚える"]},{"level":1,"answer":2,"explanation":"本書はマイケル・ポーターの5つの力で業界の競争環境を理解する手法を紹介している。","q":"業界の競争環境を分析する「5つの力」を提唱したのは誰か。","choices":["ピーター・ドラッカー","フィリップ・コトラー","マイケル・ポーター","クレイトン・クリステンセン"]},{"level":2,"answer":0,"explanation":"研究開発費負担の大きい先発医薬品メーカーは粗利率が高く、ジェネリック会社は低いという違いが生まれる。","q":"バリューチェーン分析で、研究開発費負担の大きい先発医薬品メーカーの粗利率はどうなるか。","choices":["粗利率が高い","粗利率が低い","赤字が常態化する","粗利率は業界で最も低い"]},{"level":2,"answer":2,"explanation":"4PはProduct・Price・Place・Promotionであり、Peopleは含まれない。","q":"本書がマーケティング分析に用いる4Pに含まれないものはどれか。","choices":["Product(商品)","Price(価格)","People(人材)","Promotion(プロモーション)"]},{"level":3,"answer":1,"explanation":"RIZAPは短期集中の個別サポートと高額会費・広告宣伝費を組み合わせた戦略で、セントラルとは対照的な数字に表れる。","q":"本書がRIZAPのマーケティング戦略の特徴として挙げるのはどれか。","choices":["充実施設と粗利確保を重視する戦略","短期集中の個別サポートと高額会費・広告宣伝費を組み合わせた戦略","低価格と多店舗展開の薄利多売戦略","無料体験のみで会費を取らない戦略"]}]},"fin19":{"title":"餃子屋と高級フレンチでは、どちらが儲かるか？","quiz":[{"level":1,"answer":0,"explanation":"決算書には上手な化粧が施されており、真実を表現した決算書は存在しないと安曇は言う。","q":"会計士の安曇は決算書を何にたとえているか。","choices":["だまし絵","設計図","地図","写真"]},{"level":1,"answer":1,"explanation":"限界利益は売上金額から変動費を差し引いた金額で、直角三角形で表される。","q":"限界利益はどのように計算されるか。","choices":["売上金額から固定費を差し引いた金額","売上金額から変動費を差し引いた金額","変動費から固定費を差し引いた金額","売上金額に固定費を加えた金額"]},{"level":2,"answer":1,"explanation":"仕入れた日のうちに売り切れるコハダは、少ない資金を繰り返し回転させられるため多くの現金を稼ぐ。","q":"寿司屋全体を現金製造機と見なしたとき、より多くの現金を稼ぐのはどちらか。","choices":["仕入値が高い大トロ","少ない資金を繰り返し回せるコハダ","どちらも同額","在庫の多い高級ネタ"]},{"level":2,"answer":2,"explanation":"理想は営業CFを黒字にし、稼いだ現金を設備投資に回し、余った現金を配当にすることである。","q":"本書が示す理想的な現金の流れはどれか。","choices":["借入金で固定資産をすべて賄う","配当を優先し設備投資を後回しにする","営業CFを黒字にし設備投資に回して余りを配当にする","投資も配当もせず現金を貯め込む"]},{"level":3,"answer":1,"explanation":"高級フレンチは限界利益率が高く固定費も多いため、損益分岐点を超えると利益が大幅に増える構造を持つ。","q":"高級フレンチの利益構造の特徴として正しいのはどれか。","choices":["限界利益率が低く固定費も少ない薄利多売型","限界利益率が高く固定費も多く、損益分岐点を超えると利益が大幅に増える","固定費がゼロで常に黒字","変動費が売上を上回る赤字体質"]}]},"fin20":{"title":"100円のコーラを1000円で売る方法","quiz":[{"level":1,"answer":0,"explanation":"自社を鉄道事業と定義したため、他の輸送手段に顧客が流れても自分たちの問題と捉えられず衰退した。","q":"アメリカの鉄道会社が衰退した原因として本書が挙げるのはどれか。","choices":["事業を輸送事業ではなく鉄道事業と定義した","運賃を下げすぎた","新しい鉄道技術を導入しなかった","従業員を大量に解雇した"]},{"level":1,"answer":3,"explanation":"バリュープロポジションは顧客が望み、競合が提供できず、自社が提供できる価値であり、価格の安さは条件ではない。","q":"バリュープロポジションとして本書が示す3条件に含まれないものはどれか。","choices":["顧客が望んでいる価値","競合が提供できない価値","自社が提供できる価値","最も安く提供できる価値"]},{"level":2,"answer":1,"explanation":"目の前の顧客の言うことだけに対応し、本当に必要としていることに応えられないのがカスタマー・マイオピアである。","q":"カスタマー・マイオピアとはどのような状態か。","choices":["顧客の情報を一切集めない状態","目の前の顧客の言うことだけに対応し本当に必要なことに応えられない状態","顧客を無視して自社都合で商品を作る状態","顧客層を広げすぎて混乱する状態"]},{"level":2,"answer":2,"explanation":"特別な体験とともに高い価格で売るのはバリューセリングである。","q":"超高級ホテルのルームサービスで特別な体験とともにコーラを1000円で売るのは何と呼ばれるか。","choices":["プロダクトセリング","コストリーダーシップ","バリューセリング","ディスカウント戦略"]},{"level":3,"answer":0,"explanation":"徹底したコスト削減で安く売るのはプロダクトセリングであり、どちらが良い悪いではなく自社の目指す形を見極める必要がある。","q":"ディスカウントストアがコーラを安く売る手法は本書で何と呼ばれるか。","choices":["徹底したコスト削減によるプロダクトセリング","体験価値を売るバリューセリング","バリュープロポジションの実践","カスタマー・マイオピアの克服"]}]},"fin21":{"title":"うまい棒は、なぜうまいのか？","quiz":[{"level":1,"answer":1,"explanation":"うまい棒は発売から35年、10円という価格を守り続けている。","q":"うまい棒が発売以来守り続けている価格はいくらか。","choices":["5円","10円","20円","30円"]},{"level":1,"answer":2,"explanation":"反応が悪ければ製造終了となる中で、現在は18種類が定番として残っている。","q":"現在、定番として残っているうまい棒の味は何種類か。","choices":["8種類","12種類","18種類","24種類"]},{"level":2,"answer":1,"explanation":"穴を空けることで食感が良くなり不良品も減り、結果としてコストダウンにつながる。","q":"うまい棒に穴が空いている理由として本書が挙げるのはどれか。","choices":["原料を節約するため","食感を良くし不良品を減らしコストダウンにつながるため","見た目を派手にするため","早く湿気させるため"]},{"level":2,"answer":1,"explanation":"値下げではなく味や品質の向上にコストをかける、損してもお客をとれという精神を貫いている。","q":"やおきんが貫いているとされる精神はどれか。","choices":["安さがすべて","損してもお客をとれ","利益こそ正義","少量高価格で稼ぐ"]},{"level":3,"answer":1,"explanation":"駄菓子は子どもの頃の記憶を引き出す回想法として、認知症予防や閉じこもり予防のツールに有効とされる。","q":"駄菓子が認知症予防などに有効とされるのは、どのような働きによるものか。","choices":["糖分による脳の活性化","子どもの頃の記憶を引き出す回想法","咀嚼による運動効果","栄養素の補給"]}]},"fin22":{"title":"イノベーションのジレンマからの脱出","quiz":[{"level":1,"answer":1,"explanation":"みんなの銀行はふくおかフィナンシャルグループ(FFG)の子会社として誕生した。","q":"みんなの銀行の親会社にあたるのはどこか。","choices":["三菱UFJフィナンシャル・グループ","ふくおかフィナンシャルグループ(FFG)","ソニーフィナンシャルグループ","楽天グループ"]},{"level":1,"answer":2,"explanation":"みんなの銀行はバックログを積み残しながら2021年1月4日の開業にこぎつけた。","q":"みんなの銀行が開業したのはいつか。","choices":["2016年","2019年","2021年1月4日","2023年"]},{"level":2,"answer":0,"explanation":"永吉健一らはデジタルネイティブ世代をターゲットに、2016年にiBankマーケティングを設立した。","q":"みんなの銀行の出発点となったiBankマーケティングが設立されたのは何年か。","choices":["2016年","2018年","2020年","2023年"]},{"level":2,"answer":1,"explanation":"ウォーターフォール型が主流の銀行開発において、小さく開発しすばやくフィードバックを反映するアジャイル型を採用した。","q":"みんなの銀行が銀行システム開発で採用した開発方式はどれか。","choices":["ウォーターフォール型","アジャイル型","外注一括型","手作業型"]},{"level":3,"answer":2,"explanation":"内製を重視し、キャリア採用が66.7%を占めるなど、既存銀行と大きく異なる人員構成を持つ。","q":"既存銀行と大きく異なる人員構成の例として本書が示す、みんなの銀行のキャリア採用の割合はどれくらいか。","choices":["約20%","約40%","66.7%","90%以上"]}]},"fin23":{"title":"ソフトウェア・ファースト","quiz":[{"level":1,"answer":1,"explanation":"SaaSは利用状況を把握し改善し続けなければ解約される、サブスクリプション型のビジネスモデルである。","q":"SaaSがもたらしたビジネスモデルはどれか。","choices":["パッケージ買い切り型","サブスクリプション型","無料広告型","レンタル返却型"]},{"level":1,"answer":0,"explanation":"DXの本質は、企画から運用まで自らコントロールできるITの手の内化である。","q":"本書が説くDXの本質はどれか。","choices":["ITの手の内化","コスト削減の徹底","SIerへの外注拡大","紙業務の完全廃止"]},{"level":2,"answer":1,"explanation":"多くの経営者はITを単なる業務効率化の道具と考え、開発をSIerに任せきりにした。","q":"日本企業がITをどのように過小評価してきたと本書は指摘するか。","choices":["競争の中心","効率化の道具","経営そのもの","リスク要因"]},{"level":2,"answer":2,"explanation":"ソフトウェア開発では運用が最も重要で、運用で得た知見を企画や設計にフィードバックしていく。","q":"本書によれば、ソフトウェア開発で最も重要な段階はどれか。","choices":["製造","販売","運用","廃棄"]},{"level":3,"answer":0,"explanation":"システム開発をSIerに任せきりにした結果、自社にIT活用のノウハウが蓄積されず変化に乗り遅れた。","q":"SIer丸投げ文化がもたらした結果として本書が挙げるのはどれか。","choices":["自社にIT活用のノウハウが蓄積されなかった","開発コストが世界最低になった","エンジニアが大量に育った","クラウド化で世界をリードした"]}]},"fin24":{"title":"リスクマネジメント 変化をとらえよ","quiz":[{"level":1,"answer":1,"explanation":"リスクマネジメントはもはや経営そのものであり、無縁の部門は存在しないとされる。","q":"本書はリスクマネジメントを最終的に何と位置づけているか。","choices":["一部門だけの専門業務","経営そのもの","保険加入の手続き","IT部門のみの課題"]},{"level":1,"answer":1,"explanation":"想定外の需要増加のように、リスクにはポジティブな要素もあり、活用する姿勢が大切とされる。","q":"本書はリスクにどのような要素もあると述べているか。","choices":["ネガティブな要素のみ","ポジティブな要素もある","経済的な要素だけ","無視してよい要素だけ"]},{"level":2,"answer":0,"explanation":"戦略リスクは事業ポートフォリオを管理する計画リスクと、計画遂行に支障をきたす計画遂行リスクに分けられる。","q":"経営層が関与すべき戦略リスクを構成する2つのレイヤーはどれか。","choices":["計画リスクと計画遂行リスク","信用リスクと市場リスク","物理リスクと人的リスク","為替リスクと金利リスク"]},{"level":2,"answer":2,"explanation":"グローバル企業の84%が過去3年間にサードパーティー関連のインシデントを経験し、17%が重大な影響度だった。","q":"本書が示す調査で、過去3年間にサードパーティー関連のインシデントを経験したグローバル企業の割合はどれくらいか。","choices":["17%","42%","84%","99%"]},{"level":3,"answer":2,"explanation":"サイバーアタックにはネットワーク・物理・人という3つのルートがあり、部門横断的な取り組みが必要になる。","q":"本書が挙げるサイバーアタックの3つのルートはどれか。","choices":["過去・現在・未来","国内・国外・宇宙","ネットワーク・物理・人","音声・映像・文字"]}]},"fin25":{"title":"不平等と再分配の経済学","quiz":[{"level":1,"answer":0,"explanation":"本書は賃金格差の是正策を直接的再分配と財政的再分配に分けて比較検証する。","q":"本書が比較検証する2つの再分配はどれか。","choices":["直接的再分配と財政的再分配","国内再分配と国外再分配","現物再分配と現金再分配","都市再分配と地方再分配"]},{"level":1,"answer":1,"explanation":"本書は『21世紀の資本』の著者トマ・ピケティによる、再分配政策を検証する一冊である。","q":"本書の著者で、『21世紀の資本』でも知られるのは誰か。","choices":["ミルトン・フリードマン","トマ・ピケティ","ジョセフ・スティグリッツ","アマルティア・セン"]},{"level":2,"answer":1,"explanation":"税と社会保障給付による財政的再分配は労働の価格そのものを歪めないため、相対的に効率的とされる。","q":"本書が相対的に効率的とするのはどちらの再分配か。","choices":["企業に賃上げを求める直接的再分配","税と社会保障給付による財政的再分配","どちらも同程度に効率的","どちらも効果がない"]},{"level":2,"answer":2,"explanation":"社会保険料と給付の逓減が重なり、低賃金労働者の実効限界税率は70〜90%に達することがある。","q":"本書が指摘する、低賃金労働者の実効限界税率はどの程度に達しうるか。","choices":["10〜20%","30〜40%","70〜90%","ほぼ0%"]},{"level":3,"answer":1,"explanation":"米国は低スキルのサービス業中心の成長で雇用は拡大したが賃金は停滞し、フランスは高スキル型で雇用拡大が抑制された。","q":"米国とフランスの成長モデルの違いとして本書が示すのはどれか。","choices":["両国とも高スキル型で雇用が拡大した","米国は低スキルのサービス業中心で雇用は拡大したが賃金は停滞した","フランスは低スキル型で賃金が急上昇した","両国とも雇用が縮小した"]}]},"fin26":{"title":"世界基準の働き方","quiz":[{"level":1,"answer":0,"explanation":"海外の成功例をそのまま真似ず日本市場に合わせてローカライズする、Think Globally, Act Locallyが第一歩とされる。","q":"著者が発想転換の言葉として掲げるのはどれか。","choices":["Think Globally, Act Locally","Time is Money","Less is More","Winner Takes All"]},{"level":1,"answer":1,"explanation":"著者はネスレ日本で創業以来初の生え抜き社長として6期連続増収を達成した。","q":"著者が創業以来初の生え抜き社長を務めた企業はどこか。","choices":["トヨタ自動車","ネスレ日本","ソニー","資生堂"]},{"level":2,"answer":2,"explanation":"マーケティングは全部門に存在し、人事部門にとっての顧客は社員、採用担当にとっての顧客は求職者である。","q":"本書によれば、人事部門にとっての「顧客」は誰か。","choices":["取引先","株主","社員","監査法人"]},{"level":2,"answer":1,"explanation":"潜在的な課題を発見し解決するのがイノベーションで、ウォークマンがその例として挙げられる。","q":"顧客がまだ自覚していない潜在的な課題を発見し解決することを本書は何と呼ぶか。","choices":["リノベーション","イノベーション","ローカライズ","マイオピア"]},{"level":3,"answer":1,"explanation":"3つの覚悟には、一人で24時間考え抜いて確信に至ること、ゼロベースで当たり前を疑うこと、新しい現実を見つける勇気が含まれる。","q":"潜在的な顧客課題を掘り起こすのに必要な3つの覚悟に含まれるものはどれか。","choices":["他人に判断を委ねること","一人で24時間考え抜いて確信に至ること","前例をそのまま踏襲すること","短時間で結論を出すこと"]}]},"fin27":{"title":"10年後の働き方","quiz":[{"level":1,"answer":1,"explanation":"著者はSXSWの日本唯一の公式コンサルタントとして、最先端テクノロジーから10年後の仕事を予測する。","q":"本書の著者が日本唯一の公式コンサルタントを務める、世界最大級のビジネスイベントはどれか。","choices":["CES","SXSW","ダボス会議","GAFAサミット"]},{"level":1,"answer":1,"explanation":"培養肉は牛の筋細胞から培養する研究が、食糧危機や動物愛護の観点から進んでいる。","q":"「培養肉」は何から培養されるか。","choices":["植物のタンパク質","牛の筋細胞","昆虫の粉末","藻類"]},{"level":2,"answer":2,"explanation":"オレゴン州ポートランドでは、公共交通やシェアカーをシームレスに使うアプリで都市の拡大を抑制している。","q":"コンパクトシティ化が進む都市として本書が挙げるのはどこか。","choices":["ニューヨーク","東京","オレゴン州ポートランド","パリ"]},{"level":2,"answer":1,"explanation":"ミュージシャンが楽曲を直接販売できる透明性の高い仕組みから、フェアトレードミュージシャンという働き方が生まれる。","q":"定額制の聞き放題が主流になった音楽業界から生まれるとされる働き方はどれか。","choices":["培養肉マイスター","フェアトレードミュージシャン","コンパクトシティ技術者","筋電操作デザイナー"]},{"level":3,"answer":0,"explanation":"MITが開発した、肘から先の筋肉が発生する筋電を感知する技術が、筋電操作デザイナーの基礎になる。","q":"筋電操作デザイナーの基となる、微弱な電気でデバイスを操作する技術を開発したのはどこか。","choices":["MIT","スタンフォード大学","ハーバード大学","東京大学"]}]},"fin28":{"title":"ADHDの僕が苦手とされる事務にとことん向き合ってみた。","quiz":[{"level":1,"answer":0,"explanation":"分解・日付・担当を自問する3つのギモンによって、取りかかりづらい仕事も着実に進められる。","q":"著者が事務を動かすために用いる仕組みの名称はどれか。","choices":["3つのギモン","5つの力","4つのP","2つの軸"]},{"level":1,"answer":2,"explanation":"どうやる?は仕事を小さな手順に分ける分解を意味する。","q":"3つのギモンのうち「どうやる?」が意味するものはどれか。","choices":["日付を入れる","担当者を決める","仕事を小さな手順に分解する","優先順位を捨てる"]},{"level":2,"answer":3,"explanation":"3つのギモンは分解・日付・担当であり、なぜやる?は含まれない。","q":"3つのギモンに含まれないものはどれか。","choices":["どうやる?(分解)","いつやる?(日付)","だれがやる?(担当)","なぜやる?(目的)"]},{"level":2,"answer":0,"explanation":"最初にやるべきものだけを決めるルールにすると、割り込み仕事にも都度対応でき動けなくなりにくい。","q":"優先順位について本書が勧める方法はどれか。","choices":["最初にやるべきものだけを決める","重要度と緊急度のマトリクスを常に描く","すべての順位を毎朝決め直す","順位を一切つけない"]},{"level":3,"answer":1,"explanation":"できそうにない仕事を小さく分解し、できそうと思えるまで実現可能性を上げる、できる仕事を目指す発想が有効とされる。","q":"本書が目指すべきとする発想の転換はどれか。","choices":["できる仕事ではなくできる自分を目指す","できる自分ではなくできる仕事を目指す","苦手な仕事を他人に丸投げする","重い仕事を後回しにし続ける"]}]},"fin29":{"title":"FinTech入門 テクノロジーが推進する「ユーザー第一主義」の金融革命","quiz":[{"q":"本書が扱う「FinTech」とは、何と何の融合を指すか。","choices":["金融とテクノロジー","物流と人工知能","製造と通信","教育と広告"],"answer":0,"level":1,"explanation":"本書は金融とテクノロジーの融合をFinTechと呼び、その最新サービスを解説している。"},{"q":"ロボアドバイザーが一般の人々に提供したものは何か。","choices":["不動産の一括査定","高金利の預金口座","グローバル分散投資による資産運用","生命保険の見直し"],"answer":2,"level":1,"explanation":"これまで機関投資家や富裕層しか使えなかった分散投資を、低コストで一般に提供する点が特徴とされる。"},{"q":"2014年に世界のFinTech企業への投資額はどの水準に達したか。","choices":["約12億ドル","約120億ドル","約1200億ドル","約1兆ドル"],"answer":1,"level":2,"explanation":"2014年に約120億ドルとそれまでの3〜5倍に達したことが注目のきっかけとなった。"},{"q":"本書によれば、FinTech企業のほとんどはどのような企業か。","choices":["大手金融機関の子会社","政府系機関","老舗メーカー","スタートアップ"],"answer":3,"level":2,"explanation":"意思決定の遅い大企業には難しく、金融機関はスタートアップと提携・出資して取り込もうとしている。"},{"q":"2015年9月に金融庁がFinTechを重要施策として掲げた文書はどれか。","choices":["日本再興戦略","成長戦略実行計画","平成27年度金融行政方針","骨太の方針"],"answer":2,"level":3,"explanation":"2015年9月、金融庁は平成27年度金融行政方針の重要施策としてFinTechの調査と整備を掲げた。"}]},"fin30":{"title":"NFTの教科書 ビジネス・ブロックチェーン・法律・会計まで デジタルデータが資産になる未来","quiz":[{"q":"「NFT」の正式名称として本書が挙げるものはどれか。","choices":["代替性トークン","非代替性トークン","分散型台帳","暗号資産一般"],"answer":1,"level":1,"explanation":"NFTはNon-Fungible Token、すなわち非代替性トークンを指す。"},{"q":"「NFT」とビットコインなどの暗号資産(FT)との違いはどれか。","choices":["NFTは唯一無二で代替不可能","NFTは国が発行する","NFTは価格変動がない","NFTは複製が容易"],"answer":0,"level":1,"explanation":"FTが代替可能なのに対し、NFTは唯一無二の識別データを持ち代替不可能なデジタル資産となる。"},{"q":"本書が世界初のNFTアートとして紹介する作品はどれか。","choices":["「Bored Ape」","「Beeple」","「CryptoPunks」","「Meebits」"],"answer":2,"level":2,"explanation":"「CryptoPunks」は2021年1月に約8000万円で取引され、同年8月には「VISA」が購入し話題となった。"},{"q":"アートNFTを保有することの意味について、本書の説明はどれか。","choices":["著作権が自動的に移転する","作品を自由に商用利用できる","現物の原画が送られてくる","作品のパトロンであることを示せるのみ"],"answer":3,"level":2,"explanation":"アートNFTの保有は著作権の保有を意味せず、パトロンであることを世間に示せるにとどまる場合が多い。"},{"q":"メタバースにおいてNFTがもたらす変化として本書が挙げるのはどれか。","choices":["現実の通貨が使えなくなる","バーチャル空間に二次売買可能な経済圏が生まれる","ゲームがすべて無料になる","データの複製が容易になる"],"answer":1,"level":3,"explanation":"土地やアバターがNFT化され、メルカリのような二次販売の仕組みがデジタルデータにも実現する。"}]},"fin31":{"title":"VR for BUSINESS 売り方、人の育て方、伝え方の常識が変わる","quiz":[{"q":"本書がVRコンテンツ最大の価値として挙げるものはどれか。","choices":["没入感","低コスト","大人数の同時体験","拡散のしやすさ"],"answer":0,"level":1,"explanation":"VRは実体験と変わらないほど強烈な印象を残す没入感を生み出す点に価値がある。"},{"q":"VRはどのような性質の伝達ツールだと本書は説明するか。","choices":["広く浅く伝える","一方向に大量配信する","狭く深く伝える","匿名で伝える"],"answer":2,"level":1,"explanation":"一度に体験できる人数は少ないが強烈な印象を与えられる、狭く深く伝えるツールとされる。"},{"q":"2020年にVRのビジネス市場はどの規模まで拡大すると見込まれたか。","choices":["70億ドル","700億ドル","7億ドル","7000億ドル"],"answer":1,"level":2,"explanation":"ビジネス分野でのVR活用は2020年に700億ドル市場まで拡大すると見込まれていた。"},{"q":"CGでVRを制作する場合、1分のコンテンツに必要とされる画像枚数はどれか。","choices":["180枚","600枚","900枚","1800枚"],"answer":3,"level":2,"explanation":"1分のコンテンツに1800枚もの画像が必要で、百台のPCで並列処理しても18日かかるとされる。"},{"q":"プランニングの早い段階でチーム全体が共有すべき項目はどれか。","choices":["誰が・どこで・何を・何人","予算・納期・利益","色・音・光","起承転結"],"answer":0,"level":3,"explanation":"体験者が何者になるか、体験場所や機材、体験できる人数を早期に共有しておく必要がある。"}]},"fin32":{"title":"「3か月」の使い方で人生は変わる Googleで学び、シェアNo.1クラウド会計ソフトfreeeを生み出した「3か月ルール」","quiz":[{"q":"著者が「確実に変化を起こせる最小単位」とする期間はどれか。","choices":["1週間","3か月","1年","3年"],"answer":1,"level":1,"explanation":"1つのテーマに3か月しっかり向き合えば何かをつかめる、集中の限界だと著者は語る。"},{"q":"著者が3か月間で独学のプログラミングにより作り上げたものはどれか。","choices":["新しい会計理論","グーグルの新機能","「freee」の原型","書籍の原稿"],"answer":2,"level":1,"explanation":"著者は3か月間で独学のプログラミングにより「freee」の原型を作り上げた。"},{"q":"ゴールを決める際に著者が勧める考え方はどれか。","choices":["理想ドリブン","現実ベース","他人基準","前例踏襲"],"answer":0,"level":2,"explanation":"現実ベースだと発想が狭まるため、理想をベースに考え溝を埋める習慣が重要とされる。"},{"q":"著者が勧める目標設定の型はどれか。","choices":["売上100万円のような達成目標","競合を上回る目標","上司が決めた目標","クライアント訪問20件のような行動目標"],"answer":3,"level":2,"explanation":"自分でコントロールできる行動目標を立てることで優先順位が明確になりアクションにつながる。"},{"q":"3か月間取り組むテーマの選び方として本書が勧めるのはどれか。","choices":["誰もが取り組む王道分野","みんなが注目していないニッチでワクワクする分野","最も稼げる分野","リスクの最も低い分野"],"answer":1,"level":3,"explanation":"普段の延長にないニッチな分野に挑戦し、やりたいとできるが重なるテーマを見つけるとよい。"}]},"fin34":{"title":"お金の不安がなくなる小さな習慣 心と財布に余裕が生まれる88のヒント","quiz":[{"q":"賢くお金を使う人が買うかどうかを判断する基準はどれか。","choices":["いまの自分に必要か・気に入っているか","値段が安いかどうか","流行しているかどうか","他人が持っているかどうか"],"answer":0,"level":1,"explanation":"買う理由が値段なら買わないと決め、必要か・気に入っているかで判断するとよいとされる。"},{"q":"衝動買いを防ぐ習慣として本書が勧めるものはどれか。","choices":["クレジットカードを増やす","毎日買い物に行く","買わない習慣と欲しいものリスト","何でもまとめ買いする"],"answer":2,"level":1,"explanation":"欲しいものリストを作り、必要になってから買いに行く買わない習慣が有効とされる。"},{"q":"本書が「もの」より価値が高いとするものはどれか。","choices":["ブランド品","経験","貯金","不動産"],"answer":1,"level":2,"explanation":"ものの価値は下がるが、経験は知識や知恵、創造力に変換され未来の自分を形づくる。"},{"q":"「お金で時間を買う」発想の根拠として本書が挙げるものはどれか。","choices":["お金は無限にあるから","時間は無限にあるから","時間はお金より必ず安いから","死ぬときの後悔の多くは時間の配分で解決できるから"],"answer":3,"level":2,"explanation":"死ぬときに後悔することの多くは時間の配分で解決でき、時間リッチを目指す視点が重要とされる。"},{"q":"本書が重視する3つの「生きる力」に含まれないものはどれか。","choices":["他人からお金を借りる力","稼ぐ力","少ないお金で暮らす力","いまあるお金を増やす力"],"answer":0,"level":3,"explanation":"重要なのは稼ぐ力・少ないお金で暮らす力・増やす力の3つで、借りる力は挙げられていない。"}]},"fin35":{"title":"これだけは知っておきたい「プレゼンテーション」の基本と常識 改訂新版","quiz":[{"q":"本書がプレゼンを成功させる3要素として挙げるものはどれか。","choices":["資料・照明・音響","プログラム・プレゼンテーションスキル・パーソナリティ","時間・場所・人数","声・表情・服装"],"answer":1,"level":1,"explanation":"内容(プログラム)・伝え方(スキル)・人柄(パーソナリティ)の3要素が結果に影響する。"},{"q":"メラビアンによれば、第一印象に最も影響を与える情報はどれか。","choices":["視覚情報","聴覚情報","言語情報","触覚情報"],"answer":0,"level":1,"explanation":"外見などの視覚情報が55%を占め、第一印象は見た目でほぼ決まるとされる。"},{"q":"メラビアンの分類で、話す言葉や内容などの言語情報が占める割合はどれか。","choices":["55%","38%","20%","7%"],"answer":3,"level":2,"explanation":"視覚55%・聴覚38%に対し、言語情報は7%とされる。"},{"q":"多数の人を相手にする場合に本書が求めることはどれか。","choices":["内容を必要最小限に絞る","キャッチボールに徹する","聞き手を分析し話の流れを設計する","資料をあえて配らない"],"answer":2,"level":2,"explanation":"多数が相手のときは聞き手を分析し、「PREP法」や起承転結型など話の流れを決めておく。"},{"q":"導入部の「つかみ」の5テクニックに含まれないものはどれか。","choices":["エピソード法","反復法","質問法","直接法"],"answer":1,"level":3,"explanation":"5つはエピソード法・ショック法・質問法・適応法・直接法で、反復法は含まれない。"}]},"fin36":{"title":"テレワークも業務改善もさっぱりわからない私に新しい働き方を教えてください！","quiz":[{"q":"本書が自分をブランディングする3要素として挙げるものはどれか。","choices":["リーダー・マネージャー・プレイヤー","知識・技術・態度","スペシャル・トラスト・ファミリア","早さ・安さ・うまさ"],"answer":2,"level":1,"explanation":"特別性・信頼性・親しみやすさの3要素を高めることで社内外にファンを増やせるとされる。"},{"q":"3要素のうち「トラスト」が意味するものはどれか。","choices":["品質や納期で得る信頼性","誰にも負けない専門性","声をかけやすい親しみやすさ","価格の安さ"],"answer":0,"level":1,"explanation":"トラストは品質や納期で信頼を得る信頼性を指す。"},{"q":"部下が「正当に評価されていない」と感じる原因の多くは何だと本書は言うか。","choices":["上司の能力不足","評価を伝えるタイミング","給与制度そのもの","同僚との比較"],"answer":1,"level":2,"explanation":"原因の多くはタイミングにあり、「1on1」などで期待役割の解像度を上げておくとよい。"},{"q":"経験を他者に語りやすくするために本書が勧める工夫はどれか。","choices":["資格を取る","すべて数値化する","SNSに毎日投稿する","経験にタグづけして記録する"],"answer":3,"level":2,"explanation":"経験にタグをつけて記録すると、わかりやすいストーリーとして他者に語れるようになる。"},{"q":"「好き」を仕事にすることについて本書の説明はどれか。","choices":["好きな仕事はライバルが少ない","結果が出せなくてもダメージが小さい","モチベーションは保ちやすいがライバルが多く、まず信頼を勝ち取ることが優先","好きを仕事にすべきではない"],"answer":2,"level":3,"explanation":"好きな仕事は高い力を発揮できる反面ライバルが多く、まず目の前の仕事で信頼を得ることが優先とされる。"}]},"fin37":{"title":"人工知能はなぜ椅子に座れないのか 情報化社会における「知」と「生命」","quiz":[{"q":"「人工知能」という言葉が生まれた1956年の会議はどれか。","choices":["チューリング会議","ダートマス会議","ジュネーブ会議","スタンフォード会議"],"answer":1,"level":1,"explanation":"1956年のダートマス会議で人工知能という言葉が生まれた。"},{"q":"本書が「心」や「意識」の根幹に位置づける生命維持のプロセスはどれか。","choices":["メタボリズム","シンギュラリティ","ホメオスタシス(恒常性)","アルゴリズム"],"answer":2,"level":1,"explanation":"変化を認識しつつ安定を維持するホメオスタシスの中核に、心や意識の根幹があるとされる。"},{"q":"コンピュータの認識を阻む「不良設定問題」とはどのようなものか。","choices":["対象を認識するには対象が何かを既に知っている必要があるという循環","計算速度が足りない問題","データが多すぎる問題","電力が不足する問題"],"answer":0,"level":2,"explanation":"ワイングラスを認識するにはそれが何かを知っている必要があるという循環論的な問題を指す。"},{"q":"17世紀に四則演算計算機を発明したとされる人物は誰か。","choices":["チューリング","リックライダー","ミンスキー","ライプニッツ"],"answer":3,"level":2,"explanation":"17世紀にライプニッツが四則演算計算機を発明して以来、論理的推論を演算化する試みが続いた。"},{"q":"1960年にリックライダーが提唱し、今日のインターネットの原型となった思想はどれか。","choices":["人工知能による人間の代替","人とコンピュータの共生","機械学習の自動化","分散処理の統合"],"answer":1,"level":3,"explanation":"人とコンピュータの共生という思想がインターネットの原型となり、シンギュラリティ論はこの系譜から外れる。"}]},"fin38":{"title":"企業変革の実務 いつ、何を、どの順番で行えば現場は動くか","quiz":[{"q":"本書が優れた企業の持つ自律的な問題解決能力を何と呼ぶか。","choices":["リーンマネジメント","コーポレートガバナンス","課題解決ガバナンス","アジャイル経営"],"answer":2,"level":1,"explanation":"優れた企業の根幹をなすのが、自律的に定着した課題解決ガバナンスである。"},{"q":"本書によれば、企業変革は遅くとも何か月以内に軌道に乗せる必要があるか。","choices":["6か月","12か月","24か月","36か月"],"answer":0,"level":1,"explanation":"遅くとも6か月以内に課題解決ガバナンスを機能させる必要があるとされる。"},{"q":"業績不振が続く「不振企業」が抱える三重苦(複雑骨折)はどれか。","choices":["資金・人材・設備","戦略・オペレーション・組織","販売・製造・開発","経営・現場・株主"],"answer":1,"level":2,"explanation":"不振企業は戦略・オペレーション・組織の三重苦を抱えるとされる。"},{"q":"「冴えない企業」の根本的な問題として本書が挙げるものはどれか。","choices":["資金繰りの悪化","人材の大量流出","過剰な設備投資","課題解決のPDCAにズレ・モレが生じている"],"answer":3,"level":2,"explanation":"冴えない企業は課題解決のPDCAサイクルにズレ・モレが生じ機能不全に陥っている。"},{"q":"変革プログラムを設計する3つの視点に含まれるものはどれか。","choices":["財務・人事・法務","短期・中期・長期","変革4要件のマネジメント・変革メカニズム・変革の具体策","計画・実行・評価"],"answer":2,"level":3,"explanation":"変革4要件のマネジメント、変革メカニズム、変革の具体策の3視点から青写真を描く。"}]},"fin39":{"title":"会社は「本」で強くなる マネーフォワード 全社で取り組む「読書経営」","quiz":[{"q":"本書が読書文化を取り上げている企業はどれか。","choices":["楽天","マネーフォワード","サイボウズ","ラクスル"],"answer":1,"level":1,"explanation":"本書はクラウド会計ソフトなどで知られるマネーフォワードの読書文化を取材している。"},{"q":"同社で読書文化が根づいているツール上の場はどれか。","choices":["「Slack」","紙の社内報","朝礼","掲示板"],"answer":0,"level":1,"explanation":"「Slack」上で自主的な読書会や課題図書の共有が行われ、読書が根づいている。"},{"q":"本書で読書は組織にとって何として機能していると説かれるか。","choices":["個人の趣味","福利厚生の一環","組織の共通言語","評価の指標"],"answer":2,"level":2,"explanation":"読書は個人の教養ではなく、組織の共通言語として機能しているとされる。"},{"q":"辻CEOの読書遍歴で、現在に位置づけられるフェーズはどれか。","choices":["プロダクトづくりのための読書時代","経営者になるための読書時代","組織づくりを学ぶ読書時代","名経営者の評伝を読む人間理解のための読書時代"],"answer":3,"level":2,"explanation":"4つのフェーズをたどり、現在は名経営者の評伝を読む人間理解のための読書時代に至る。"},{"q":"経営幹部が四半期に一度行う経営合宿の特徴はどれか。","choices":["外部講師を招いて講義を受ける","辻が課題図書を指定し書籍を起点に対話を深める","数値目標のみを議論する","社員全員が参加する"],"answer":1,"level":3,"explanation":"泊まり込みの経営合宿では辻が課題図書を指定し、書籍を通じて価値観を共有し対話を深める。"}]},"fin40":{"title":"会社役員のための法務ハンドブック","quiz":[{"q":"本書が役員に身につけるべきと説く力はどれか。","choices":["詳細な会計知識","高度な語学力","問題を察知するリーガルマインド","交渉術"],"answer":2,"level":1,"explanation":"条文の暗記より、問題となりうる点を察知するリーガルマインドが重要とされる。"},{"q":"代表取締役の権限について、本書の説明はどれか。","choices":["万能ではなく決議が必要な事項は勝手に決められない","何でも自分だけで決定できる","常に株主総会より弱い","取締役会に完全に従属する"],"answer":0,"level":1,"explanation":"法律や定款で株主総会・取締役会の決議が必要な事項は、代表取締役でも勝手に決められない。"},{"q":"代表権に制限を加えても、その制限を対抗できない相手はどれか。","choices":["自社の従業員","制限を知らない第三者","株主","監査役"],"answer":1,"level":2,"explanation":"代表権の制限は、それを知らない第三者に対しては主張(対抗)できない。"},{"q":"個人情報漏洩が起きた場合に必要な対応として、本書が挙げていないものはどれか。","choices":["事実調査","原因究明","本人への連絡","SNSでの謝罪広告の掲載"],"answer":3,"level":2,"explanation":"事実調査・原因究明・再発防止策・本人連絡が必要で、場合により主務大臣への報告も要る。"},{"q":"勤務時間外・社外で行われたセクハラについて、本書の説明はどれか。","choices":["会社は一切責任を負わない","加害者個人のみの問題である","職務に関連させて行われたと判断されれば会社の使用者責任が認められた判例がある","刑事罰のみが問われる"],"answer":2,"level":3,"explanation":"職務関連と判断されれば会社の使用者責任が認められ、取締役の善管注意義務違反も問われうる。"}]},"fin41":{"title":"僕たちがスタートアップした理由","quiz":[{"q":"本書が起業を身近にした最大の理由として挙げるものはどれか。","choices":["政府の補助金増加","IT関連コストの劇的な低下","大学教育の充実","人口の増加"],"answer":1,"level":1,"explanation":"直近10年のIT関連コストの劇的な低下が、起業への障壁を大きく下げたとされる。"},{"q":"IT機器関連コストは10年前と比べどうなったと本書は述べるか。","choices":["1/20〜1/100になった","2倍になった","ほとんど変わらない","10倍になった"],"answer":0,"level":1,"explanation":"IT機器関連コストは10年前の1/20〜1/100になり、月に数千円からEコマースも始められる。"},{"q":"シリコンバレーで最も尊敬を集めるとされるのは誰か。","choices":["大企業の管理職","著名な投資家","起業家","大学教授"],"answer":2,"level":2,"explanation":"スタンフォードでは最も優秀な学生が起業し、起業家になる者が一番偉いという文化があるとされる。"},{"q":"本書が提唱する「バックパッカー起業」の考え方はどれか。","choices":["最初から最高峰の目標を掲げる","海外を放浪してから起業する","大企業で十分に経験を積んでから起業する","いきなり高い目標でなくまず個性的な小さな山に登る"],"answer":3,"level":2,"explanation":"エベレストではなく高尾山のような山にまず登り、起業の絶対数を増やす発想である。"},{"q":"仕事と会社を選ぶ基準として本書が示すものはどれか。","choices":["給与の高さ","その仕事が好きかどうか","会社の知名度","雇用の安定性"],"answer":1,"level":3,"explanation":"好きだからこそ集中でき一流になれるとし、好きかどうかをシンプルな判断基準とする。"}]},"fin42":{"title":"図解 労務入門","quiz":[{"q":"本書は「労務」をどう定義しているか。","choices":["人材を採用すること","給与を計算すること","労働における義務を果たすこと","福利厚生を整えること"],"answer":2,"level":1,"explanation":"本書は労務を労働における義務を果たすことと定義し、6要素から体系的に解説する。"},{"q":"本書が挙げる労務担当者の3つの役割に含まれるものはどれか。","choices":["ルールマスター(RM)","マーケター","アカウンタント","エンジニア"],"answer":0,"level":1,"explanation":"RM、オペレーションエクセレンス(OE)、ストラテジスト(ST)の3つの役割があるとされる。"},{"q":"労働基準法などの「公法」の特徴はどれか。","choices":["罰則がなく民事で対応する","罰則や行政指導の規定を持つ","就業規則の作成根拠になる","労使が自由に内容を決められる"],"answer":1,"level":2,"explanation":"公法は罰則や行政指導の規定を持ち、罰則のない私法は違反時に民事上の損害賠償で対応する。"},{"q":"介護休業の趣旨について、本書の説明はどれか。","choices":["労働者自身がメインで介護するための制度","介護が回復するまでの長期休養","退職を前提とした制度","仕事と介護を両立できる体制を整えるための制度"],"answer":3,"level":2,"explanation":"介護休業は両立支援が趣旨で、誤解されると93日では足りないと離職につながりやすい。"},{"q":"労務担当者の成果は最終的に何の改善に行き着くと本書は説くか。","choices":["ROIの改善","顧客満足の改善","EX(エンプロイー・エクスペリエンス)の改善","在庫回転率の改善"],"answer":2,"level":3,"explanation":"入社から退職まで従業員が体験する価値であるEXの改善に、労務の業務すべてが直結する。"}]},"fin43":{"title":"対立を歓迎するリーダーシップ 組織のあらゆる困難・葛藤を力に変える","quiz":[{"q":"著者が組織内で目に見えない力として働くものを何と呼ぶか。","choices":["オーラ","フィールド","モメンタム","シナジー"],"answer":1,"level":1,"explanation":"境界を持たずタオに沿って流れる力を、著者はフィールドと呼ぶ。"},{"q":"本書で対立の両極は何として現れると説かれるか。","choices":["アーキタイプ","ペルソナ","タイムスピリット","ステレオタイプ"],"answer":2,"level":1,"explanation":"フィールドの攻撃的な極と平和的な極を、著者はタイムスピリットと名づけた。"},{"q":"フィールドはどのような流れになぞらえられるか。","choices":["老荘思想の「道(タオ)」","資本主義の市場原理","ダーウィンの進化","物理の慣性の法則"],"answer":0,"level":2,"explanation":"フィールドは老荘思想の道(タオ)に沿って流れる力とされ、組織は氷山にたとえられる。"},{"q":"ワールドワークの根底にある、あらゆる部分や視点を重要とする考え方はどれか。","choices":["多数決主義","効率至上主義","成果主義","ディープ・デモクラシー"],"answer":3,"level":2,"explanation":"ディープ・デモクラシーが根底にあり、ファシリテーターは気づき(アウェアネス)を促す。"},{"q":"葛藤解決の鍵として本書が挙げる手法はどれか。","choices":["対立を無視してやり過ごす","ロールスイッチで人を一時的な役割と同一視させない","多数派の意見を採用する","上司が一方的に裁定する"],"answer":1,"level":3,"explanation":"ロールスイッチにより人を集団内の一時的な役割と同一視させないことが、解決の鍵になる。"}]},"fin44":{"title":"採用ファースト経営 中小企業の加速度的成長を可能にする超攻撃的「人財ファースト戦略」の全貌","quiz":[{"level":1,"q":"採用ファースト経営を成り立たせる3本柱の組み合わせとして正しいものはどれか。","choices":["新卒大量採用・早期育成・定着化","海外展開・M&A・上場","値上げ・広告・在庫圧縮","残業削減・副業解禁・週休三日"],"answer":0,"explanation":"採用ファースト経営は「新卒大量採用」「早期育成」「定着化」を柱に成長スピードを引き上げるモデルとして提示されている。"},{"level":1,"q":"本書が示す中小企業の新卒有効求人倍率はおよそどれくらいか。","choices":["0.37倍","1.5倍","9.91倍","3.2倍"],"answer":2,"explanation":"中小企業の新卒有効求人倍率は9.91倍と非常に高く、大企業の0.37倍とは対照的な厳しい採用環境が示されている。"},{"level":2,"q":"専任の採用担当者として理想とされる人材像はどれか。","choices":["定年間近のベテラン","20代のエース級社員","外部の派遣スタッフ","経理部門の管理職"],"answer":1,"explanation":"6つの経営課題の一つとして、専任採用担当には理想として20代のエース級社員を配置することが挙げられている。"},{"level":2,"q":"新卒大量採用を実現する方法として本書が重視するのはどれか。","choices":["縁故採用のみに絞る","採用時期を春の一括に限定する","通年採用とマルチチャネル化","採用担当を置かず社長が兼任する"],"answer":2,"explanation":"合同説明会やダイレクトリクルーティング、インターンシップなど複数チャネルを組み合わせ、通年採用で母集団を形成することが示されている。"},{"level":3,"q":"早期育成と定着化を支える3本柱に含まれないものはどれか。","choices":["能力・スキルの見える化","体系立った育成プログラム","定着化の取り組み","成果に応じた降格処分の徹底"],"answer":3,"explanation":"早期育成と定着化は「見える化」「育成プログラム」「定着化の取り組み」の3本柱で支えられ、降格処分の徹底は挙げられていない。"}]},"fin45":{"title":"教養としてのお金とアート 誰でもわかる「新たな価値のつくり方」","quiz":[{"level":1,"q":"本書は誰と誰による対談形式の一冊か。","choices":["公認会計士と東京画廊オーナー","投資家と落語家","銀行員と美術館長","小説家と写真家"],"answer":0,"explanation":"公認会計士の田中靖浩氏と東京画廊オーナーの山本豊津氏が、会計とアートの共通点を語り合う対談本である。"},{"level":1,"q":"1602年にオランダで誕生した、世界最初の株式会社とされるのはどれか。","choices":["東京画廊","東インド会社","ライブドア","レンブラント商会"],"answer":1,"explanation":"簿記の普及を背景に、1602年オランダで世界最初の株式会社である東インド会社が誕生したと述べられている。"},{"level":2,"q":"簿記の普及がもたらしたと本書が述べる効果はどれか。","choices":["株主が安心して投資でき、絵画市場が生まれた","画家の税金が免除された","国が絵画の輸出を禁じた","オークションが廃止された"],"answer":0,"explanation":"帳簿があるからこそ株主は安心して投資でき、そこから生まれた豪商が絵画を買い、画家が大成できる市場が育ったとされる。"},{"level":2,"q":"本書が指摘する、ギャラリーの仕事の本質はどれか。","choices":["作品を保管すること","画家に絵を描かせること","価値を価格に変換すること","美術史を執筆すること"],"answer":2,"explanation":"価値は第三者に認められてはじめて価格になり、価値を価格に変換することがギャラリーの仕事だと田中氏は指摘する。"},{"level":3,"q":"山本氏が語る「美意識」の説明として最も近いものはどれか。","choices":["高価な作品を数多く所有すること","自分の人生を作品として生きる感覚","最新技術の作品を優先すること","他人の評価に従って選ぶこと"],"answer":1,"explanation":"山本氏は美意識を、お金では手に入らない自分の人生を作品として考える感覚だと説明している。"}]},"fin46":{"title":"新版 経営分析の基本","quiz":[{"level":1,"q":"本書がいう財務三表の組み合わせとして正しいものはどれか。","choices":["貸借対照表・損益計算書・キャッシュフロー計算書","総勘定元帳・仕訳帳・伝票","予算書・決算書・申告書","日報・週報・月報"],"answer":0,"explanation":"財務三表は貸借対照表・損益計算書・キャッシュフロー計算書を指し、これらが密接に結びついていると解説される。"},{"level":1,"q":"「利益は意見、現金は事実」という言葉が示す含意はどれか。","choices":["利益は常に正確である","キャッシュフロー計算書のほうが実態を正確に映す","現金は重要でない","損益計算書だけ見ればよい"],"answer":1,"explanation":"この言葉は、損益計算書よりキャッシュフロー計算書のほうが会社の実態をより正確に映し出すことを示している。"},{"level":2,"q":"損益分岐点売上高の計算式として正しいものはどれか。","choices":["変動費÷固定費","固定費÷(1-変動費率)","売上高×変動費率","固定費×安全余裕率"],"answer":1,"explanation":"損益分岐点売上高は「固定費÷(1-変動費率)」で計算され、利益がゼロになる売上高を指す。"},{"level":2,"q":"フリーキャッシュフローの計算方法として本書が示すものはどれか。","choices":["営業CFに財務CFを足す","投資CFから財務CFを引く","営業CFから投資CFを引く","当期純利益に減価償却を足す"],"answer":2,"explanation":"営業CFから投資CFを引いたものがフリーキャッシュフローで、事業投資の範囲内で黒字であることが健全とされる。"},{"level":3,"q":"現金循環日数(CCC)の説明として最も適切なものはどれか。","choices":["現金が商品や売掛金に変わり再び現金に戻るまでの日数","固定費を回収するまでの月数","決算日から申告までの日数","借入金を返済し終える年数"],"answer":0,"explanation":"CCCは現金が商品や売掛金に姿を変え再び現金に戻るまでの日数を測る指標で、回転が速いほど少ない運転資金で商売ができる。"}]},"fin47":{"title":"朝型勤務がダメな理由 あなたの睡眠を改善する最新知識","quiz":[{"level":1,"q":"6時間睡眠を10日間続けると、認知機能はどの状態と同レベルまで低下するとされるか。","choices":["昼寝後と同レベル","徹夜明けと同レベル","変化なし","運動後と同レベル"],"answer":1,"explanation":"6時間睡眠を10日間続けるだけで、徹夜明けと同レベルまで認知機能が低下すると述べられている。"},{"level":1,"q":"本書によると、思春期の若者に対して米国小児科学会が勧めているのはどれか。","choices":["早寝早起き","睡眠時間の短縮","寝坊(遅い起床)","昼夜逆転生活"],"answer":2,"explanation":"思春期は生理的に夜型化するため、米国小児科学会は早寝早起きではなく寝坊を勧めている。"},{"level":2,"q":"始業時間を1時間半遅らせた米国の高校で確認された効果はどれか。","choices":["平均睡眠が45分延び、集中力や成績が改善した","遅刻者が急増した","睡眠時間が逆に減った","変化はなかった"],"answer":0,"explanation":"始業を1時間半遅らせた高校では平均睡眠が45分延び、集中力向上や抑うつ感の改善、成績上位者の増加が確認された。"},{"level":2,"q":"夜型体質の労働者は人口のおよそどれくらいを占めると本書は述べるか。","choices":["1割","3割","5割","8割"],"answer":1,"explanation":"人口の3割を占める夜型体質の労働者に朝型を強制すれば、適応に苦しみパフォーマンス低下を招きかねないとされる。"},{"level":3,"q":"朝型・夜型という「体質」についての本書の説明として正しいものはどれか。","choices":["完全に環境で決まり遺伝は関係ない","遺伝的影響が半分を占め環境の影響をほとんど受けない","年齢とともに必ず朝型になる","努力すれば体質そのものを簡単に変えられる"],"answer":1,"explanation":"体質としての朝型・夜型は遺伝的影響が半分を占め、環境の影響をほとんど受けないと説明されている。"}]},"fin48":{"title":"東大から刑務所へ","quiz":[{"level":1,"q":"本書で対談している2人の著名人はどれか。","choices":["堀江貴文と井川意高","緒方貞子と本多静六","田中靖浩と山本豊津","濱口桂一郎と林總"],"answer":0,"explanation":"ライブドア事件の堀江貴文氏と大王製紙事件の井川意高氏が、逮捕から服役、再起までを語り合う対談本である。"},{"level":1,"q":"2人がいずれも逮捕・起訴された捜査機関はどこか。","choices":["警視庁公安部","東京地検特捜部","国税局査察部","海上保安庁"],"answer":1,"explanation":"堀江氏も井川氏も、東京地検特捜部に逮捕・起訴され服役した経験を持つ。"},{"level":2,"q":"ライブドアへの強制捜査が行われたタイミングとして本書が挙げるのはどれか。","choices":["月曜の早朝","金曜日の夕方","祝日の正午","日曜の深夜"],"answer":1,"explanation":"証拠隠滅の恐れがないにもかかわらず、金曜日の夕方に踏み込むという不自然な形で強制捜査が行われたとされる。"},{"level":2,"q":"顧問弁護士が語ったとされる、特捜部が強制捜査に入った場合の見通しはどれか。","choices":["ほとんど起訴されない","100%逮捕され起訴される","示談で解決できる","書類送検で済む"],"answer":1,"explanation":"顧問弁護士は「特捜が強制捜査したら100%逮捕され起訴される」と語り、裁判での戦いになると告げたとされる。"},{"level":3,"q":"出所後の堀江氏の活動として本書で触れられているのはどれか。","choices":["宇宙ロケット事業への出資","製紙会社の再建","国連難民支援","画廊の経営"],"answer":0,"explanation":"出所後、堀江氏は宇宙ロケット事業への出資者として、つまずいても立ち上がれることを証明しようとしていると述べられている。"}]},"fin49":{"title":"社員100人までの会社の「社長の仕事」","quiz":[{"level":1,"q":"本書が中小企業の社長の仕事として集約する3つに含まれないものはどれか。","choices":["経営理念・ビジョンの浸透","社員が働ける環境整備","会社にお金を残すこと","株式を上場させること"],"answer":3,"explanation":"社長の仕事は理念の浸透・環境整備・お金を残すことの3つに集約され、上場は挙げられていない。"},{"level":1,"q":"著者が代表を務める会計事務所の実績として示されているのはどれか。","choices":["3期連続赤字","33期連続増収・赤字ゼロ","一度倒産して再建","海外上場を達成"],"answer":1,"explanation":"著者の古田土会計は、創業以来33期連続増収・赤字ゼロを続けている実績が紹介されている。"},{"level":2,"q":"本書が中小企業の社長に第一とすべきだと説くのはどれか。","choices":["株主満足","顧客満足より従業員満足","取引先満足","顧客満足の徹底のみ"],"answer":1,"explanation":"資源が少ない中小企業だからこそ、顧客満足より従業員満足を第一とし、社員を大切にする経営が望ましいとされる。"},{"level":2,"q":"毎年作成し社員全員で共有する経営計画書を構成する2編はどれか。","choices":["序章編と終章編","方針編と諸表編","理論編と事例編","攻め編と守り編"],"answer":1,"explanation":"経営計画書は理念・ビジョンを記す方針編と、短期利益計画を数値に落とし込む諸表編から成る。"},{"level":3,"q":"会社の現金預金を減らす4つの資金流出要因に含まれないものはどれか。","choices":["サイト負け","身の丈以上の借入金","過剰在庫","従業員満足への投資"],"answer":3,"explanation":"資金流出の主因はサイト負け・過大な借入金・過剰在庫・支払手形への依存の4つで、従業員満足への投資は含まれない。"}]},"fin50":{"title":"私の仕事 国連難民高等弁務官の10年と平和の構築","quiz":[{"level":1,"q":"著者の緒方貞子が務めた役職はどれか。","choices":["国連事務総長","国連難民高等弁務官","世界銀行総裁","国際司法裁判所長官"],"answer":1,"explanation":"緒方貞子は日本人で初めて国連難民高等弁務官を務め、その10年を振り返っている。"},{"level":1,"q":"緒方貞子が国連難民高等弁務官を務めた期間として本書が示すのはどれか。","choices":["1年間","3期10年","20年","半年"],"answer":1,"explanation":"1991年から2000年まで3期10年にわたり国連難民高等弁務官を務めた。"},{"level":2,"q":"難民援助の枠組みを一変させた歴史的な出来事として本書が挙げるのはどれか。","choices":["冷戦の終結","石油危機","リーマンショック","国際連盟の設立"],"answer":0,"explanation":"1990年代は冷戦終結で抑え込まれていた紛争の種が顕在化し、自国内での難民化が急増して援助の枠組みが一変した。"},{"level":2,"q":"クルド難民危機でUNHCRが打ち破ったとされる従来の考え方はどれか。","choices":["食糧支援は行わないという方針","国境の外に出た難民しか保護できないという考え方","女性を優先保護する原則","軍の関与を一切認めない立場"],"answer":1,"explanation":"UNHCRは国境の外に出た難民しか保護できないという考え方を覆し、イラク国内に安全地帯を設けて人道的介入に踏み切った。"},{"level":3,"q":"日本が経済大国から人道大国へ成長する鍵として本書が示すのはどれか。","choices":["軍事力の強化","国内外を問わず現場を歩き連帯感(ソリダリティー)を持つこと","国境の管理を厳格化すること","難民の受け入れを制限すること"],"answer":1,"explanation":"国内外を分けず自ら現場を歩き文化に触れて連帯感を持つことが、日本が人道大国へ成長する鍵だとされる。"}]},"fin51":{"title":"私の財産告白","quiz":[{"level":1,"q":"著者の本多静六が手がけた仕事として知られるのはどれか。","choices":["日比谷公園の設計や明治神宮の造林","東京タワーの建設","新幹線の開発","銀座の百貨店経営"],"answer":0,"explanation":"本多静六は日比谷公園の設計や明治神宮の造林で知られる人物である。"},{"level":1,"q":"本多静六が資産形成の第一歩とした貯金法はどれか。","choices":["宝くじを毎月買う","月給の4分の1を天引きして貯金する","借金をして投資する","支出をすべて記録するだけ"],"answer":1,"explanation":"本多式4分の1天引き貯金法は、月給の4分の1を容赦なく天引きして貯金する方法である。"},{"level":2,"q":"株式投資で本多静六が貫いたとされる方針はどれか。","choices":["値上がりしても2割の利益で売却する","含み損でも売らずに持ち続ける","全財産を一銘柄に集中する","毎日売買を繰り返す"],"answer":0,"explanation":"思いがけず値上がりしても欲を出さず2割の利益で売却する「2割利食い」を貫き、利益は銀行定期に預けたとされる。"},{"level":2,"q":"本多静六が景気の局面ごとに勧める行動として正しいものはどれか。","choices":["好景気に借金し、不景気に貯蓄する","好景気に勤倹貯蓄し、不景気に思い切った投資をする","常に投資を控える","常に全額を投資に回す"],"answer":1,"explanation":"好景気のときは勤倹貯蓄し、不景気になったら時機を逃さず思い切った投資を行うサイクルがベストだとされる。"},{"level":3,"q":"本多静六が人生最大の幸福と説く境地はどれか。","choices":["財産を子孫に多く残すこと","職業の道楽化","早期に引退すること","他人と競争して勝つこと"],"answer":1,"explanation":"仕事に打ち込み日々のつとめ自体が面白くてたまらなくなる「職業の道楽化」こそ人生最大の幸福だとされる。"}]},"fin52":{"title":"賃金とは何か 職務給の蹉跌と所属給の呪縛","quiz":[{"level":1,"q":"本書がいうメンバーシップ型とジョブ型で、賃金の基準となるものの対比として正しいのはどれか。","choices":["メンバーシップ型は人、ジョブ型は職務","メンバーシップ型は職務、ジョブ型は人","どちらも年齢","どちらも成果"],"answer":0,"explanation":"メンバーシップ型は「人」、ジョブ型は「職務」を賃金の基準とすると対比されている。"},{"level":1,"q":"日本で年功賃金制が採用された理由として本書が挙げるのはどれか。","choices":["職務内容が契約に記載されず職務基準が困難だから","海外の法律で義務づけられたから","労働組合が反対したから","成果が正確に測れたから"],"answer":0,"explanation":"日本の雇用契約には具体的な職務内容が記載されないため、勤続年数や年齢を基準とする年功賃金制が採用された。"},{"level":2,"q":"「ベースアップ」という和製英語が結実したとされる年はどれか。","choices":["1920年","1950年","1975年","2000年"],"answer":1,"explanation":"賃金統制令に由来する「賃金ベース」が賃上げの論理に転化し、1950年に「ベースアップ」という和製英語に結実した。"},{"level":2,"q":"日本の長期雇用慣行の起点として本書が位置づける時期と制度はどれか。","choices":["江戸期の丁稚制度","大正期に確立した定期採用制","戦後の労働基準法","平成期の成果主義"],"answer":1,"explanation":"日露戦争後の重工業化を背景に、大正期に子飼い職工を中心とする定期採用制が確立し、これが長期雇用慣行の起点となった。"},{"level":3,"q":"1975年春闘に関連して日経連が提唱した原理はどれか。","choices":["生産性基準原理","同一労働同一賃金原則","最低賃金原則","職務給定価原則"],"answer":0,"explanation":"石油危機下で日経連は名目賃金上昇を抑える「生産性基準原理」を提唱し、これが戦後賃金史の分水嶺となった。"}]},"fin53":{"title":"28歳からのリアル","quiz":[{"level":1,"q":"本書が人生設計の起点とする年齢はいくつか。","choices":["20歳","28歳","40歳","50歳"],"answer":1,"explanation":"寿命を85歳と仮定すると人生の3分の1が過ぎた28歳を起点に、7つのテーマを解説している。"},{"level":1,"q":"本書が転職について勧める進め方はどれか。","choices":["生活が困窮してから急いで探す","生活が困窮する前に計画的に行う","在職中は一切準備しない","感情に任せて即断する"],"answer":1,"explanation":"困窮時の転職活動は納得のいかない再就職につながりやすいため、蓄えや失業保険を踏まえ計画的に行うべきとされる。"},{"level":2,"q":"女性が結婚相手に求める最低条件の年収として本書が紹介する目安はどれか。","choices":["年収300万円","年収500万円","年収800万円","年収1000万円"],"answer":1,"explanation":"民間給与実態調査を踏まえ、女性が結婚相手に求める最低条件は年収500万円と言われると紹介されている。"},{"level":2,"q":"お金を増やす3つの方法のうち、今すぐ始められるものとして挙げられるのはどれか。","choices":["収入を増やす","支出を減らす","運用して増やす","相続を待つ"],"answer":1,"explanation":"3つの方法のうち収入増は簡単でないため、まずは支出を減らし150万円ほどの元本を貯めることが第一歩とされる。"},{"level":3,"q":"本書が示す、独立開業に向いている人の条件に含まれないものはどれか。","choices":["当たりそうなアイデアを持っている","半年〜1年分の生活費に耐える貯蓄がある","社交的で自己管理ができる","資金がなくても勢いで始められる"],"answer":3,"explanation":"独立に向くのは当たりそうなアイデア・人並み以上の才能・半年〜1年の貯蓄・社交性と自己管理を備えた人であり、勢い任せは含まれない。"}]},"fin54":{"title":"88.68%勝てる営業 ペンタゴンで培われた世界最強の提案営業フレームワーク","quiz":[{"level":1,"q":"本書が紹介する提案営業メソッドの名称はどれか。","choices":["シップレイメソッド","ランチェスター戦略","SPIN話法","PDCAサイクル"],"answer":0,"explanation":"米国政府機関の調達マネージャーが40年かけて確立したシップレイメソッドを紹介している。"},{"level":1,"q":"本書が脱却を促す、従来の日本式営業スタイルの特徴はどれか。","choices":["チームで戦略的に攻める","個人の営業力や熱意に依存する","データに基づき自動化する","価格だけで勝負する"],"answer":1,"explanation":"個人の営業力や熱意に依存した従来のスタイルから脱却し、チームで攻めるキャプチャー営業への転換を促している。"},{"level":2,"q":"シップレイメソッドが提案書作成に取り掛かるタイミングとして重視するのはどれか。","choices":["顧客から正式依頼を受けた後","顧客の要求よりずっと前","契約締結の直前","競合の提案を見た後"],"answer":1,"explanation":"18ステップでは顧客の要求よりずっと前に提案計画に着手し、組織的観点や最重要関心事を理解して提案する姿勢が重視される。"},{"level":2,"q":"案件獲得までを分ける3つのフェーズの組み合わせとして正しいものはどれか。","choices":["調査・実行・評価","アカウント・キャプチャー・プロポーザル","計画・見積・納品","集客・接客・追客"],"answer":1,"explanation":"案件獲得までをアカウント・キャプチャー・プロポーザルの3フェーズに分け、マネージャーが監督・調整して進める。"},{"level":3,"q":"顧客のホットボタンを把握して差別化する4つの視点に含まれないものはどれか。","choices":["自社の強みを強調する","自社の弱みを軽減する","競争相手の弱みを強調する","競争相手の価格を必ず下回る"],"answer":3,"explanation":"差別化は自社の強み強調・弱み軽減・競争相手の弱み強調・競争相手の強みの過小評価の4視点で行い、価格を下回ることは含まれない。"}]},"fin55":{"title":"AIビジネスチャンス 技術動向と事例に学ぶ新たな価値を生成する攻めの戦略","quiz":[{"level":1,"q":"本書が示す生成AI導入の進め方はどれか。","choices":["7つのステップで進める","3つのステップで進める","手順を決めず試行錯誤する","外部に丸投げする"],"answer":0,"explanation":"生成AI導入はビジネス目標の明確化から運用までの7つのステップで進めるのが望ましいとされる。"},{"level":1,"q":"生成AI導入の第1ステップとして本書が挙げるのはどれか。","choices":["技術スタックの選定","ビジネス目標と成果の明確化","本番開発","運用"],"answer":1,"explanation":"第1ステップはビジネス目標と成果の明確化で、戦略的目標の設定など4段階に分かれると解説される。"},{"level":2,"q":"金融業について本書が試算する、生成AIを活用可能な就業者の割合はどれくらいか。","choices":["28%","50%","95%","10%"],"answer":2,"explanation":"金融業では就業者159万人のうち95%にあたる151万人が生成AI活用可能とされ、月10時間削減で月1510万時間相当を圧縮できると試算される。"},{"level":2,"q":"リスク評価で重要になるとされる2つの視点の組み合わせはどれか。","choices":["国内規制の動向と、生成AI特有の法的・倫理的リスク","為替リスクと金利リスク","採用リスクと退職リスク","在庫リスクと物流リスク"],"answer":0,"explanation":"国内のAI関連ガイドラインと世界的な規制動向を知ることと、生成AI特有の法的・倫理的リスクを知ることの両方が重要とされる。"},{"level":3,"q":"商談内容の議事録生成ツールについて本書が紹介する機能はどれか。","choices":["音声を録音するだけの機能","過去の商談履歴から勝ちパターンを分析・採点する機能","顧客の顔を認証する機能","契約書を自動締結する機能"],"answer":1,"explanation":"議事録生成では、リアルタイムのテキスト化に加え、過去の商談履歴から勝ちパターンを分析・採点する機能まで備えたツールが登場していると紹介される。"}]},"fin56":{"title":"FP1級取得！サバンナ八木流 お金のガチを教えます","quiz":[{"level":1,"q":"本書の著者であるお笑い芸人が取得した資格はどれか。","choices":["FP1級","簿記1級","宅建士","税理士"],"answer":0,"explanation":"お笑い芸人 が何も雇用していない「無消費」に着目することが含まれる。"},{"q":"P&Gの中国での紙おむつ販売の事例が示す教訓はどれか。","choices":["価格を下げれば必ず売れる","機能訴求だけでなく感情・社会面が重要である","広告量が売上を決める","現地生産が成功の鍵である"],"answer":1,"level":2,"explanation":"機能訴求で苦戦したP&Gが、夜よく眠る子は頭がよくなるという感情・認知能力に訴える広告に転換して30%のシェアを獲得した事例が挙げられる。"},{"q":"片づけるべきジョブと同義になったブランドを本書は何と呼ぶか。","choices":["ジョブスペック","パーパスブランド","プロセスエコノミー","参照点ブランド"],"answer":1,"level":3,"explanation":"本書は、ジョブと同義になったブランドを「パーパスブランド」と呼び、カテゴリの垣根を越えて業界構造を変える力を持つとする。"}]},"mkt28":{"title":"ストーリーとしての競争戦略 優れた戦略の条件","quiz":[{"q":"本書が優れた戦略をたとえるものはどれか。","choices":["思わず人に話したくなる面白いストーリー","精密な設計図","厳格なルールブック","詳細なチェックリスト"],"answer":0,"level":1,"explanation":"本書は、優れた戦略とは思わず人に話したくなるような面白いストーリーであるという視点から競争戦略を論じる。"},{"q":"本書が戦略の本質として軸足を置く2要素のうち、重視するものはどれか。","choices":["違い","つながり","速さ","規模"],"answer":1,"level":1,"explanation":"本書は「違い」と「つながり」の2要素のうち、打ち手同士が因果論理でつながる「つながり」に軸足を置く。"},{"q":"本書が「違い」を分類するSPとOCのうち、OC（組織能力）の説明として正しいものはどれか。","choices":["他社と違う場所に自社を位置づけること","他社が簡単に真似できない独自の強み","利益創出の最終論理","本質的な顧客価値の定義"],"answer":1,"level":2,"explanation":"OC（組織能力）は他社が簡単に真似できない独自の強みであり、他社と違う場所に位置づけるのはSP（戦略的ポジショニング）である。"},{"q":"本書が戦略ストーリーの評価軸として挙げる枠組みはどれか。","choices":["3C","4P","5C","SWOT"],"answer":2,"level":2,"explanation":"本書は、競争優位・コンセプト・構成要素・クリティカル・コア・一貫性からなる5Cで戦略ストーリーを評価する。"},{"q":"本書がスターバックスの直営方式を例に説く「賢者の盲点」とはどのような考え方か。","choices":["すべての打ち手が単独で合理的であるべきという考え","部分的には非合理でも全体では合理性を持つという考え","非合理な打ち手は必ず排除すべきという考え","模倣しやすい打ち手ほど価値があるという考え"],"answer":1,"level":3,"explanation":"直営方式は出店スピードを犠牲にする点で一見非合理だが、他の構成要素と強くつながることで持続的優位の源泉となる、部分の非合理が全体の合理につながる考え方である。"}]},"mkt29":{"title":"センスのよい考えには、「型」がある","quiz":[{"q":"本書がインサイトを定義する2つの条件の組み合わせはどれか。","answer":0,"level":1,"explanation":"インサイトは「人を動かす」ことと「隠れたホンネ」であることの2条件を満たすものと定義される。","choices":["「人を動かす」×「隠れたホンネ」","「多くの人が知る」×「明らかなニーズ」","「話題になる」×「価格の安さ」","「センスがある」×「直感的にひらめく」"]},{"q":"小さな気づきをインサイトへ育てる出世魚モデルは何ステップで構成されるか。","answer":2,"level":1,"explanation":"違和感に気づく、常識を明らかにする、隠れたホンネを問う、仮説の言葉にする、検証してもらう、の5ステップである。","choices":["3ステップ","4ステップ","5ステップ","6ステップ"]},{"q":"出世魚モデルのステップ2で行うことは何か。","answer":1,"level":2,"explanation":"ステップ2では気づきに対する常識・定説を逆算的に確認し、そのアンチテーゼが隠れたホンネの手がかりになる。","choices":["すぐに広告を制作して市場に出す","ターゲットの過半数が正しいと思う常識・定説を逆算的に確認する","競合他社の売上データを集計する","ホンネをそのまま商品名にする"]},{"q":"うまく機能するインサイトが満たす5つの条件に含まれないものはどれか。","answer":3,"level":2,"explanation":"5条件は驚き・発想を拡げる・自分もそう思える・一言で言える・人間らしさであり、価格は含まれない。","choices":["驚きがある","一言で言える","人間らしさがある","価格が最も安い"]},{"q":"スマドリバー渋谷の事例で疑われた「常識」と発見された事実の組み合わせはどれか。","answer":0,"level":3,"explanation":"飲めない人は飲み会がキライという常識を疑い、3分の2は飲み会をキライではないと発見し、決めつけられているという隠れたホンネに到達した。","choices":["飲めない人は飲み会がキライという定説を疑い、3分の2は飲み会をキライではないと判明した","若者は外食をしないという定説を疑い、外食が増えていると判明した","女性は立ち飲みを嫌うという定説を疑い、実は好むと判明した","高齢者はノンアルを飲まないという定説を疑い、実は飲むと判明した"]}]},"mkt30":{"title":"タピオカ屋はどこへいったのか？ 商売の始め方と儲け方がわかるビジネスのカラクリ","quiz":[{"q":"本書が説くタピオカ屋のビジネスモデルの特徴はどれか。","answer":1,"level":1,"explanation":"タピオカ屋は少資金で開業し短期間で利益を回収し、ブームが去れば唐揚げや焼き芋など次のブームへ乗り換える。","choices":["高額な設備投資で長期的にブランドを育てる","イニシャルコストを抑えて短期で回収し、ブームが去れば次のブームへ乗り換える","一つの商品を数十年売り続ける","フランチャイズで全国展開してから撤退する"]},{"q":"立ち飲み屋が若い女性客に選ばれる理由として本書が挙げるものはどれか。","answer":2,"level":1,"explanation":"タイパの良さや誘いやすさに加え、店内が外から見えて安心して入店できることが理由に挙げられている。","choices":["店内が外から見えず落ち着けること","予約が必須で特別感があること","店内が外から見えて安心して入店できること","個室が完備されていること"]},{"q":"麺の硬さや辛さを選べるカスタマイズが生み出す価値はどれに分類されるか。","answer":2,"level":2,"explanation":"カスタマイズできる店は、モノが行き渡った時代に求められる自己表現的価値を提供しリピートにつながる。","choices":["機能的価値","情緒的価値","自己表現的価値","希少的価値"]},{"q":"80円のコロッケを売る精肉店が生き残れる主な理由はどれか。","answer":1,"level":2,"explanation":"小売以外にBtoBの販路を持つことで、生産地域の商圏にとらわれず事業を成長させられる。","choices":["観光客向けの高額商品を扱っているから","焼肉店向け卸などBtoBの収入源を持っているから","全国にチェーン展開しているから","コロッケ以外を売らず集中しているから"]},{"q":"本書が示すBtoC市場とBtoB市場の規模の対比として正しいものはどれか。","answer":0,"level":3,"explanation":"BtoC市場が14兆円なのに対しBtoB市場は420兆円超あり、BtoBの販路は大きな成長余地を持つ。","choices":["BtoCが14兆円に対しBtoBは420兆円超","BtoCが420兆円に対しBtoBは14兆円","両者とも約200兆円で同規模","BtoBはBtoCの半分程度"]}]},"mkt31":{"title":"デジタルマーケティング成功実例100","quiz":[{"q":"メルカリの「売り切れ品」表示が刺激する心理はどれか。","answer":1,"level":1,"explanation":"売り切れ品を可視化することで、もっと早く見ておけばよかったという後悔回避の心理が働き、こまめなアプリチェックにつ ,"共創であり、共体験を見つけメッセージ等のマルチ化をデザインする必要がある","一方的な情報発信を徹底すべき","ターゲットを一つに絞り込むべき"]}]},"mkt33":{"title":"ニセコ化するニッポン","quiz":[{"q":"本書が提唱する「ニセコ化」とは何か。","answer":0,"level":1,"explanation":"ニセコ化とはターゲットを選択し集中的にサービスを提供することで、その場所がテーマパーク化していく現象を指す。","choices":["選択と集中によってその場所がテーマパークのようになっていく現象","積雪量が増えてスキー場が増える現象","地方から人口が流出する現象","物価が全国一律に下がる現象"]},{"q":"ニセコがリゾートとして選択したターゲットはどれか。","answer":1,"level":1,"explanation":"ニセコは富裕層の外国人観光客というターゲットを選択し、外国語の看板など快適な空間作りを徹底した。","choices":["国内の高齢者層","外国人富裕層","若い学生グループ","地元の家族連れ"]},{"q":"スターバックスが行った「選択と集中」の2点として正しいものはどれか。","answer":1,"level":2,"explanation":"スタバはフラペチーノ導入などの商品ラインナップと、安売りしないやや高めの価格設定という2点で選択と集中を行っている。","choices":["立地と営業時間","商品ラインナップと商品価格","内装と店員の制服","広告量とSNS運用"]},{"q":"本書が「韓国テーマパーク」と化したと述べる街はどれか。","answer":2,"level":2,"explanation":"新大久保は韓国好きの人々を満足させる韓国テーマパークと化していると述べられている。","choices":["渋谷","豊洲","新大久保","歌舞伎町"]},{"q":"「選択には排除が伴う」ことを示すMIYASHITA PARKの事例と、本書が示す公共機関の役割の組み合わせはどれか。","answer":1,"level":3,"explanation":"再開発で宮下公園のホームレスが排除された例を挙げ、異なる選択をした複数の空間を用意することが公共機関の役割だとする。","choices":["観光客を排除し、住民専用にすることが役割","ホームレスを排除した例を挙げ、異なる選択をした複数の空間を用意することが役割","若者を排除し、高齢者向けにすることが役割","再開発を全面的に禁止することが役割"]}]},"mkt34":{"title":"ファンダムマーケティング 「今日の売上」と「明日の売上」を両立させる","quiz":[{"q":"本書がファンダムをどのような存在として扱うべきだと説くか。","answer":1,"level":1,"explanation":"ファンダムを消費者として一方的に扱うのではなく、共に世の中を動かす同志としてリスペクトを持って接する必要がある。","choices":["一方的に売り込む消費者","共に世の中を動かす同志","監視すべきクレーマー","無視してよい少数派"]},{"q":"ファンダムマーケティングを一言で表すとどれか。","answer":1,"level":1,"explanation":"エンタメと関わりのない企業がIPとタイアップし、認知から愛着形成まで一気に進める推されるためのマーケティングである。","choices":["値引きで新規客を増やすマーケティング","推されるためのマーケティング","広告量で認知を最大化するマーケティング","海外展開のためのマーケティング"]},{"q":"IP選定で用いる2軸と、狙うべきゾーンの組み合わせとして正しいものはどれか。","answer":0,"level":2,"explanation":"マスかニッチか、可処分精神が高いか低いかの2軸で検討し、ニッチだが可処分精神の高いセグメントマスを狙うのが有効である。","choices":["マスかニッチかと可処分精神の高低の2軸で、ニッチかつ可処分精神の高いセグメントマスを狙う","価格の高低と地域の2軸で、高価格帯を狙う","年齢と性別の2軸で、若年男性を狙う","認知度と好感度の2軸で、認知度最大を狙う"]},{"q":"ファンダムから感謝される企画を生む2つの視点として正しいものはどれか。","answer":1,"level":2,"explanation":"IPの文脈を理解したわかってるね感と、想像を超える組み合わせによるそうきたか感の2つの視点が鍵となる。","choices":["安さ感と速さ感","わかってるね感とそうきたか感","高級感と限定感","定番感と流行感"]},{"q":"本書がファンが喜ぶ組み合わせの事例として挙げるオーディオテクニカの企画はどれか。","answer":1,"level":3,"explanation":"オーディオテクニカは内田真礼・内田雄馬の姉弟共演を実現し、ファンが喜ぶ組み合わせを設計した。","choices":["人気ゲームとのコラボイベント","内田真礼・内田雄馬の姉弟共演の実現","スポーツ選手の起用","海外アーティストの招聘"]}]},"mkt35":{"title":"ファンベース 支持され、愛され、長く売れ続けるために","quiz":[{"q":"本書が説くファンベースの考え方はどれか。","answer":1,"level":1,"explanation":"ファンベースは企業や商品の支持者であるファンを大切にし、中長期を視野に売上や価値の上昇を狙う考え方である。","choices":["新規顧客の獲得だけに全力を注ぐ","既存のファンを大切にし、中長期で売上や価値の上昇を狙う","短期キャンペーンで一気に話題化する","価格競争で市場シェアを奪う"]},{"q":"本書が示すコアファンの割合と売上への寄与として正しいものはどれか。","answer":0,"level":1,"explanation":"コアファンは全体のわずか8％だが売上の46％を、消費量を含めると約90％を支えている。","choices":["全体の約8％のコアファンが売上の46％を支える","全体の約半数が売上の半分を支える","全体の約30％が売上の90％を支える","コアファンの割合と売上に相関はない"]},{"q":"ファンの支持を強化する3つのアプローチはどれか。","answer":1,"level":2,"explanation":"価値自体を高める共感、価値を代替不可能にする愛着、提供元の評判を高める信頼の3つを組み合わせる。","choices":["価格・品質・流通","共感・愛着・信頼","認知・想起・購買","速さ・安さ・便利さ"]},{"q":"テレビCMや単発イベントなど短期キャンペーンの話題化について本書はどう述べるか。","answer":1,"level":2,"explanation":"短期の話題化は効果がすぐ忘れられるため、好意を資産化する明確な設計と全体構築が必要である。","choices":["最も効果的で優先すべき手段だ","効果はすぐ忘れ去られ、中長期のファンベース施策と組み合わせる全体構築が必要だ","話題化さえできれば他は不要だ","中長期施策より確実に資産化できる"]},{"q":"外部のファンベース施策を成功させる土台として本書が重視することはどれか。","answer":0,"level":3,"explanation":"社員全員が創業の志やミッションを共有しファンであることが、外部のファンベース施策を成功させる土台となる。","choices":["社員自身がまず自社や商品のファンであること","広告予算を大幅に増やすこと","競合の施策を模倣すること","新規顧客リストを大量に購入すること"]}]},"mkt36":{"title":"ブランディングの誤解","quiz":[{"q":"本書によれば、購買の決め手となるものはどれか。","answer":1,"level":1,"explanation":"購買の決め手は具体的な便益（買う理由）と、他にない独自性（買わない理由をなくす）であり、好感度だけでは買わない。","choices":["ブランドへの好感度の高さ","商品・サービスの便益と独自性","広告の露出量","有名タレントの起用"]},{"q":"アップルの広告「Think different」について本書が指摘することはどれか。","answer":0,"level":1,"explanation":"この広告は売上に直接貢献したわけではなく、後に世界一のブランドになった結果から後付けで称賛されているにすぎない。","choices":["売上に直接貢献したわけではなく、後の成功から後付けで称賛されている","発表直後に売上を倍増させた","ブランディングだけで世界一になった証拠だ","便益や独自性がなくても売れることを示した"]},{"q":"ブランディングの3つの目的に含まれないものはどれか。","answer":3,"level":2,"explanation":"3つの目的は想起性の確立、情緒的・心理的価値の提供、インナーブランディングであり、価格の最小化は含まれない。","choices":["想起性の確立","情緒的・心理的価値の提供","インナーブランディング","価格の最小化"]},{"q":"本書が事業成果の先行指標として提案するNPIとは何か。","answer":1,"level":2,"explanation":"NPIは次回購入意向を測る指標で、既存顧客内のu-NPIと全体のNPIの両方が高い状態が理想とされる。","choices":["新規顧客の総数","次回購入意向（ネクスト・パーチェス・インテンション）","広告投資利益率","純推奨者比率"]},{"q":"本書がブランディングの誤解を避けるために立ち返るべきだとする発想はどれか。","answer":1,"level":3,"explanation":"マーケティングは顧客への価値の創造であり、誰のために何の価値をという顧客起点の発想に立ち返ることが鍵となる。","choices":["競合より目立つことを最優先する発想","誰のために何の価値を提供したいのかという顧客起点の発想","とにかく認知度を上げる発想","手段としてのバズワードを追う発想"]}]},"mkt37":{"title":"プロセスエコノミー あなたの物語が価値になる","quiz":[{"q":"本書が説くプロセスエコノミーとは何か。","answer":1,"level":1,"explanation":"アウトプットの品質だけでは差がつかない時代に、プロセス自体を公開することで価値を生み出す考え方である。","choices":["完成した製品の品質だけで差別化する経済","なぜ・どうやって至ったかというプロセス自体が価値を生む経済","流通コストを最小化する経済","価格競争で勝ち抜く経済"]},{"q":"プロセスエコノミーの3つのメリットに含まれないものはどれか。","answer":3,"level":1,"explanation":"3つのメリットは事前課金・孤独感の緩和・長期的な応援であり、短期の売上最大化は含まれない。","choices":["アウトプットを出す前から課金できる","制作の孤独感が和らぐ","プロセスから見るファンが長期的に応援してくれる","必ず短期間で売上が最大化する"]},{"q":"本書が説く意識改革の方向として正しいものはどれか。","answer":1,"level":2,"explanation":"完璧な状態で出す正解主義（オーケストラ型）から、状況に応じ修正を繰り返す修正主義（ジャズ型）への転換が必要である。","choices":["修正主義から正解主義へ","正解主義（オーケストラ型）から修正主義（ジャズ型）へ","個人主義から集団主義へ","品質主義から価格主義へ"]},{"q":"情報を隠すことについて本書はどう述べるか。","answer":1,"level":2,"explanation":"情報を隠すこと自体が困難な現代では、最初に旗を立てた人が多くの情報と人間を集め、結果的に最もリッチな情報を得る。","choices":["情報は徹底的に隠すほど有利になる","最初に情報を開示し旗を立てた人こそ多くの情報と人を集められる","情報開示は競合を利するだけだ","情報は完成後にのみ出すべきだ"]},{"q":"プロセスエコノミー実践における差別化の鍵はどれか。","answer":0,"level":3,"explanation":"WhatやHowだけでなく、なぜやるのかというWhyの哲学をファンと共有することが差別化の鍵となる。","choices":["WhatやHowだけでなく、なぜやるのか（Why）という哲学をファンと共有すること","誰よりも安く売ること","アウトプットの完成度だけを追求すること","SNSのフォロワー数を増やすこと"]}]},"mkt38":{"title":"マイノリティデザイン 「弱さ」を生かせる社会をつくろう","quiz":[{"q":"著者が自らを「スポーツ弱者」と位置づけて生み出したものはどれか。","answer":1,"level":1,"explanation":"著者は自らの弱さを起点に、運動が苦手な人も障害者と健常者が対等に楽しめるゆるスポーツを生み出した。","choices":["障害者専用のリハビリ施設","運動が苦手な人でも障害者と健常者が対等に楽しめるゆるスポーツ","プロ向けの競技団体","健常者化を促すトレーニング法"]},{"q":"困難の原因への向き合い方として本書が支持する「社会モデル」はどれか。","answer":1,"level":1,"exp ":1,"explanation":"マーケティングの本質は、どんなお客さまに（WHO）どんなプロダクトで価値をつくるのか（WHAT）に集約される。","choices":["WHENとWHERE","WHOとWHAT","HOWとHOW MUCH","WHYとWHICH"]},{"q":"本書が説く「価値」とは何の組み合わせか。","answer":1,"level":1,"explanation":"価値とは具体的な利益をもたらす便益と、他にはない唯一無二の独自性を、労力込みで総合的に判断したものである。","choices":["価格と品質","便益と独自性","認知と好感","速さと安さ"]},{"q":"本書がビジネスの拡大段階として示す順序はどれか。","answer":1,"level":2,"explanation":"ビジネスは究極のニッチから始まる0→1→10→100→1000の段階を経て拡大していく。","choices":["1→10→100のみ","0→1→10→100→1000","100→10→1の縮小","0→100→1000の飛躍"]},{"q":"本書によれば、HOW（手段）から考えるとどうなるか。","answer":1,"level":2,"explanation":"HOWから考えると樹海にはまり込むが、WHOとWHATを先に明確にすればHOWは自ずと見えてくる。","choices":["最短で成果が出る","マーケティングの樹海にはまり込む","独自性が自動的に高まる","WHOとWHATが不要になる"]},{"q":"本書がマーケティングで究極的にやるべきこととして挙げる2つはどれか。","answer":1,"level":3,"explanation":"新規顧客数の拡大と離反最小化によるリピート促進、そして継続的な便益と独自性の提案による価値創造の2つである。","choices":["広告費の拡大と値下げ","新規顧客拡大・離反最小化と、継続的な便益と独自性の提案による価値創造","SNS運用と口コミ収集","在庫削減と物流効率化"]}]},"mkt41":{"title":"レシピ公開「伊右衛門」と絶対秘密「コカ・コーラ」、どっちが賢い？ 特許・知財の最新常識","quiz":[{"q":"特許出願されたアイデアは本書によればいつ公開されるか。","answer":0,"level":1,"explanation":"取得の可否にかかわらず、出願アイデアは1年半後に公開特許公報を通じて世界中に公開されると定められている。","choices":["出願から1年半後に世界中に公開される","登録が認められるまで永久に非公開","出願と同時に公開される","10年後に国内のみで公開"]},{"q":"本書が特許をたとえた表現はどれか。","answer":1,"level":1,"explanation":"特許は知財に着せた透明な防護服にすぎず、直接的な攻撃は防げても中身は丸見えになる。","choices":["万能の盾","透明な防護服","見えない金庫","永久の城壁"]},{"q":"本書が説くオープン・クローズ戦略の「絶対領域」とは何か。","answer":1,"level":2,"explanation":"オープンにする部分とクローズにする部分を戦略的に最小限に絞り込むことを絶対領域と呼ぶ。","choices":["すべてを特許出願して公開すること","見せてよい部分と真似されたくない部分を戦略的に最小限に絞ること","一切を非公開にして出願しないこと","海外にのみ出願すること"]},{"q":"菓子メーカーが類似品を出した競合との裁判で敗訴した理由はどれか。","answer":1,"level":2,"explanation":"自身が8年前にギフトカタログで先に公にしていたため新規性がないと判断され、あっさり敗訴した。","choices":["出願を怠っていたから","自らギフトカタログに先に掲載しており新規性がないと判断されたから","海外で先に特許を取られていたから","特許料の支払いを忘れたから"]},{"q":"オープン・クローズ戦略の事例として本書が挙げる組み合わせはどれか。","answer":0,"level":3,"explanation":"ポッキーは形状を見せつつ製造設備を非公開にし50年模倣を許さず、伊右衛門は微粉砕製法を出願しつつ他条件を非公開にした。","choices":["ポッキーは形状を見せて製造設備を非公開にし、伊右衛門は微粉砕の製法を出願しつつ他条件を非公開にした","ポッキーは全工程を公開し、伊右衛門は一切
