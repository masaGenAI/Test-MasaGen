      "ai08": {"title":"AIガバナンス入門 リスクマネジメントから社会設計まで","quiz":[{"q":"本書がAIガバナンスの目的として挙げるのはどれか。","choices":["リスクを社会が許容できるギリギリまで抑えつつ恩恵を最大限受容する","AIの利用を全面的に禁止する","AIを完全に野放しにして市場に委ねる","AI開発を国家が独占する"],"answer":0,"explanation":"本書はリスクを社会が許容できる水準まで抑えつつ、その恩恵を最大限受容することを目的とする。","level":1},{"q":"本書によるとAIが持つ特有のリスクはどこにあるか。","choices":["導入コストの高さ","判断の責任所在が分かりにくく説明も難しい点","電力消費の大きさ","処理速度の遅さ"],"answer":1,"explanation":"AIは複雑性ゆえに判断の責任所在が分かりにくく、理由の説明も難しいという特有のリスクを持つ。","level":1},{"q":"本書が説明責任について求める設計はどのようなものか。","choices":["AI開発者だけがすべての責任を負う","利用者のみが責任を負う","バリューチェーンに関わる複数の主体が応分の説明責任を負う","責任は誰も負わなくてよい"],"answer":2,"explanation":"開発者・提供者・利用者などバリューチェーンに関わる複数の主体それぞれが応分の説明責任を負う設計が必要とされる。","level":2},{"q":"本書のガバナンスに対する立場として最も近いのはどれか。","choices":["一切禁止するのでも野放しにするのでもなくバランスをとる","便益を無視してリスクをゼロにする","リスクを一切考えず便益だけを追う","規制は不要と考える"],"answer":0,"explanation":"AIを一切禁止するのでも野放しにするのでもなく、許容可能な水準までリスクを抑えつつ便益を引き出す舵取りを求める。","level":2},{"q":"本書がAI導入を検討する組織に並行して考えるべきとするのは何か。","choices":["最新のハードウェア調達計画","誰が何に責任を持つかというガバナンス設計","広告宣伝の予算配分","オフィスの立地選定"],"answer":1,"explanation":"技術面だけでなく「誰が何に責任を持つか」というガバナンス設計を並行して考える必要があるとまとめている。","level":3}]},
      "ai09": {"title":"AI分析でわかった 仕事ができる人がやっている小さな習慣","quiz":[{"q":"本書によると仕事時間の約45%を占めているのは何か。","choices":["資料作成","会議","メール","移動"],"answer":1,"explanation":"仕事時間の45%が会議に費やされているとデータで示されている。","level":1},{"q":"本書がムダ仕事の削減について有効とする進め方はどれか。","choices":["精神論で意識を高める","ルール化とデータで進める","個人の努力に任せる","罰則を設ける"],"answer":1,"explanation":"ムダ仕事の削減は精神論ではなくルール化とデータで進めると効果が出やすいとまとめている。","level":1},{"q":"本書が挙げる「伝わる資料作りの鉄則」に含まれないものはどれか。","choices":["1画面の文字数は105文字以内","使う色は3色以内","対角線を意識する","フォントは必ず明朝体にする"],"answer":3,"explanation":"鉄則は「105文字以内」「3色以内」「対角線を意識する」の3原則であり、フォント指定は含まれない。","level":2},{"q":"本書がCCメールについて提案しているのはどのような対策か。","choices":["CCを全面的に禁止する","CCに入れる範囲をルールとして明文化する","CCの人数を無制限にする","CCの代わりに電話を使う"],"answer":1,"explanation":"CCに入れる範囲をルールとして明文化すると、忖度による無駄なCC送付を削減できるとする。","level":2},{"q":"本書が「時間通りに終わる会議の作り方」として挙げる2つの工夫はどれか。","choices":["立って行う・資料を配らない","時間を45分に設定する・ファシリテーターを置く","参加人数を2人に絞る・オンラインにする","朝に開催する・昼食をとりながら行う"],"answer":1,"explanation":"「時間を45分に設定する」「ファシリテーターを置く」の2つで雑談で長引く会議を解決できるとする。","level":3}]},
      "ai10": {"title":"AI分析でわかったトップ5%社員の時間術","quiz":[{"q":"本書は何を大量データ分析から明らかにしているか。","choices":["人事評価トップ5%社員に共通する時間の使い方","経営者の年収分布","業界別の残業時間","新入社員の離職率"],"answer":0,"explanation":"本書は人事評価トップ5%の社員に共通する時間の使い方を大量データ分析から明らかにしている。","level":1},{"q":"本書が時間術について示す結論に最も近いのはどれか。","choices":["特別な才能が必要である","再現可能な行動パターンとして真似できる","長時間労働が不可欠である","運の要素が大きい"],"answer":1,"explanation":"時間術は特別な才能ではなく、再現可能な行動パターンとして真似できるとまとめている。","level":1},{"q":"一般社員にトップ5%社員の時間術を実践してもらった結果はどうだったか。","choices":["約2.2万人のうち89%がより成果を残せたと回答した","半数が効果を感じなかった","一部の管理職だけに効果があった","逆に残業が増えた"],"answer":0,"explanation":"一般社員2.2万人が実践した結果、89%が「より成果を残せた」と回答した。","level":2},{"q":"本書によると、頑張っていても評価されない95%社員は何パターンに分類されるか。","choices":["2パターン","3パターン","5パターン","7パターン"],"answer":1,"explanation":"評価されない社員は3つのパターンに分類でき、一方トップ5%社員には6つの特徴があったとされる。","level":2},{"q":"本書が紹介する、5%社員でなくても取り入れられる小さな行動修正の呼称はどれか。","choices":["スモールステップ法","ちょいスイッチABC","5分ルール","タイムボックス術"],"answer":1,"explanation":"5%社員でなくても取り入れられる小さな行動修正「ちょいスイッチABC」で作業時間の短縮を実現できるとする。","level":3}]},
      "ai11": {"title":"AI分析でわかったトップ5%社員の習慣","quiz":[{"q":"本書が5%社員と95%社員を分ける最大の違いとするのはどこか。","choices":["満足の置き所が作業完了か成果か","勤続年数の長さ","保有資格の数","出社時間の早さ"],"answer":0,"explanation":"「作業完了」に満足するか「成果」に満足するかが両者を分ける最大の違いとされる。","level":1},{"q":"本書のデータは何社・約何人の働き方を分析したものか。","choices":["25社・約1万8000人","3社・約500人","100社・約10万人","5社・約2000人"],"answer":0,"explanation":"クライアント企業25社、約1万8000人の働き方をAIと専門家が分析したとされる。","level":1},{"q":"本書によると5%社員は課題にどう向き合うか。","choices":["急いで解決しようとする","真因を探ろうとする","他人に丸投げする","先送りにする"],"answer":1,"explanation":"5%社員は課題に対して「急いで解決」ではなく「真因を探る」向き合い方をするとされる。","level":2},{"q":"本書によると5%社員が意思決定の会議の最後にすることは何か。","choices":["反省点を列挙する","「〇〇をしよう」というレッツの言葉でアクションを確定させる","次回の日程だけ決める","参加者を評価する"],"answer":1,"explanation":"5%社員は会議の最後に「〇〇をしよう」というレッツの言葉でアクションを確定させる傾向がある。","level":2},{"q":"本書が示す成果につながる姿勢として最も近いのはどれか。","choices":["完璧な準備が整うまで動かない","ある程度整った段階で動き出し進めながら修正する","一度決めた計画は変更しない","他者の指示を待ってから動く"],"answer":1,"explanation":"完璧な準備を待つより、ある程度整った段階で動き出し進めながら修正する姿勢が成果につながるとまとめている。","level":3}]},
      "ai12": {"title":"AI分析でわかったトップ5%社員の読書術","quiz":[{"q":"本書によるとトップ5%社員は年平均何冊を読むか。","choices":["約2.4冊","約10冊","約43.2冊","約100冊"],"answer":2,"explanation":"トップ5%社員は年平均43.2冊を読むとされる。","level":1},{"q":"本書が読書の効果を左右するとまとめているのは何か。","choices":["冊数だけ","選書の幅とアウトプットのスピード","読む時間帯","読む場所の静けさ"],"answer":1,"explanation":"読書の効果を左右するのは冊数だけでなく、選書の幅とアウトプットのスピードだとまとめている。","level":1},{"q":"一般のビジネスパーソンの年間平均読書冊数として本書が示すのはどれか。","choices":["年間平均2.4冊","年間平均15冊","年間平均35冊","年間平均43.2冊"],"answer":0,"explanation":"5%社員が年平均43.2冊なのに対し、一般のビジネスパーソンは年間平均2.4冊にとどまるとされる。","level":2},{"q":"本書によると5%社員は5冊のうち何冊を「偶然の出合い」の本にしているか。","choices":["0冊","1冊","2冊","4冊"],"answer":2,"explanation":"5冊のうち2冊はあえて偶然性の高い本を選び、視野の狭まりを防いでいるとされる。","level":2},{"q":"本書によると5%社員の87%が読了後に実践しているのはどれか。","choices":["読み終えてから10分以内にアウトプットする","感想を1週間寝かせてから書く","必ず要約を紙のノートに写す","同じ本を3回読み返す"],"answer":0,"explanation":"5%社員の87%は読み終えてから10分以内にアウトプットし、「3I」の型で効果を最大化している。","level":3}]},
      "ai13": {"title":"AI分析でわかったトップ5％リーダーの習慣","quiz":[{"q":"本書が描く現代の「5%リーダー」像に最も近いのはどれか。","choices":["聴く耳を持ち内省しゆとりを大切にする柔軟な人物","強い統率力で部下を従える人物","感情を出さず淡々と指示する人物","成果だけを追い過程を問わない人物"],"answer":0,"explanation":"5%リーダーは聴く耳を持ち、内省し、ゆとりを大切にする柔軟な人物として描かれる。","level":1},{"q":"本書がリーダーシップの核心とするのはどれか。","choices":["強い統率力","聴く力と柔軟性、内省の習慣","豊富な人脈","高い専門知識"],"answer":1,"explanation":"リーダーシップの核心は強い統率力よりも、聴く力と柔軟性、内省の習慣にあるとまとめている。","level":1},{"q":"本書によると5%リーダーがメンバーと築く関係はどのようなものか。","choices":["上下関係を明確にした指揮命令型","フラットに共感・共創できる関係","競争を促す成果主義型","干渉しない放任型"],"answer":1,"explanation":"5%リーダーは声をかけやすい雰囲気を出し、フラットに共感・共創できる関係を築いているとされる。","level":2},{"q":"本書によると5%リーダーは個人の能力を引き出すだけでなく何に注力するか。","choices":["メンバー同士の組み合わせやシステムづくり","個人ノルマの厳格な管理","外部人材の積極採用","報酬制度の見直し"],"answer":0,"explanation":"個人だけでなくメンバー同士の組み合わせや、やる気がなくても前進できるシステムづくりに注力するとされる。","level":2},{"q":"インタビューで5%リーダーに「人に恵まれている」という言葉が頻出する理由として本書が挙げるのはどれか。","choices":["運がよいことを強調したいから","周囲の声を自分の行動修正に活かす傾聴姿勢の表れ","部下への社交辞令だから","責任を回避したいから"],"answer":1,"explanation":"「人に恵まれている」という言葉の頻出は、周囲の声を自分の行動修正に活かす傾聴姿勢の表れとされる。","level":3}]},
      "ai14": {"title":"AI時代を生き抜くための 仮説脳","quiz":[{"q":"本書がAI時代を生き抜く鍵とする思考法はどれか。","choices":["暗記思考","仮説思考","批判思考","逆算思考"],"answer":1,"explanation":"「もしも〜だったなら？」とシミュレーションする仮説思考こそがAI時代を生き抜く鍵とされる。","level":1},{"q":"本書における「仮説思考」の説明として正しいのはどれか。","choices":["専門家だけが使える高度な技術","誰もが日常的に使っている思考法","AIにしかできない計算処理","過去のデータを暗記する方法"],"answer":1,"explanation":"仮説思考は「もしも〜だったなら？」と予測する、誰もが日常的に使っている思考法と定義される。","level":1},{"q":"本書が示す「究極の仮説を生む3プロセス」の順序として正しいものはどれか。","choices":["実行→仮説の構築→目的の設定","目的の設定→仮説の構築→実行","仮説の構築→実行→目的の設定","目的の設定→実行→仮説の構築"],"answer":1,"explanation":"目的の設定→仮説の構築→実行という3段階を踏むことで精度の高い究極の仮説を導けるとする。","level":2},{"q":"本書が大きな成功と利益を生むとするのはどのような進め方か。","choices":["情報を網羅的に集めてから動く","仮説に基づいた迅速な意思決定と行動","他者の判断を待ってから動く","前例を厳密に踏襲する"],"answer":1,"explanation":"情報を網羅的に集めてから動くのではなく、仮説に基づいた迅速な意思決定と行動が成功と利益を生むとされる。","level":2},{"q":"本書が競争優位につながるとまとめている習慣はどれか。","choices":["完璧な情報収集を終えてから一度だけ動く","仮説を立てて動きながら検証・修正するサイクルを回す","失敗を避けるため慎重に何度も確認する","直感だけで即断即決する"],"answer":1,"explanation":"完璧な情報収集を待たず、仮説を立てて動きながら検証・修正するサイクルを回す習慣が競争優位につながるとまとめている。","level":3}]},
      "ai15": {"title":"ChatGPTの衝撃 AIが教えるAIの使い方","quiz":[{"q":"本書がChatGPTを使いこなすカギとするのは何か。","choices":["プログラミング言語の習得","プロンプト（質問や指示文）の設計力","高性能なパソコンの用意","英語力の向上"],"answer":1,"explanation":"ChatGPTを使いこなすカギは、質問や指示文である「プロンプト」の設計力にあるとされる。","level":1},{"q":"本書はChatGPTをどのようなものと位置づけているか。","choices":["会話型のアプリケーション","検索エンジンの一種","表計算ソフト","画像編集ツール"],"answer":0,"explanation":"ChatGPTは自然言語処理の進化により人間と同じような会話を実現する会話型アプリケーションと位置づけられる。","level":1},{"q":"本書が示す「プロンプト設計の3原則」に含まれないものはどれか。","choices":["明確で具体的な質問をする","質問の文脈を提供する","必要に応じて制約を設ける","できるだけ短い単語だけで指示する"],"answer":3,"explanation":"3原則は「明確で具体的な質問」「文脈の提供」「必要に応じた制約」であり、短い単語だけという原則はない。","level":2},{"q":"本書執筆時点でChatGPTが最も活用できるとされた分野はどれか。","choices":["高度な数式の証明","企画書や議事録、報告書などの構造が明確なビジネス文書作成","リアルタイムの株価予測","精密な画像生成"],"answer":1,"explanation":"当時のChatGPTは企画書・議事録・報告書など構造が明確なビジネス文書の作成が得意領域だったとされる。","level":2},{"q":"本書が使いこなしの近道としてまとめているのはどれか。","choices":["AIの「人格」を理解しプロンプトのワーディングを工夫する","なるべく多くの質問を一度に投げる","毎回同じ定型文を使い続ける","AIの回答をそのまま無修正で使う"],"answer":0,"explanation":"AIの「人格」を理解し、プロンプトのワーディングを工夫することが使いこなしの近道とまとめている。","level":3}]},
      "ai16": {"title":"ChatGPT英語学習術 新AI時代の超独学スキルブック","quiz":[{"q":"本書が生成AIを英語学習に活かす鍵とする3スキルに含まれないものはどれか。","choices":["メタ認知","メタ言語","プロンプトエンジニアリング","タッチタイピング"],"answer":3,"explanation":"鍵となる3スキルはメタ認知・メタ言語・プロンプトエンジニアリングであり、タッチタイピングは含まれない。","level":1},{"q":"本書は生成AIをどのような存在として使うと効果が最大化するとまとめているか。","choices":["答えを教えてくれる先生","自分専用の教材を無限に作れる相棒","採点だけを行う試験官","会話を録音する記録装置"],"answer":1,"explanation":"生成AIは「先生」ではなく「自分専用の教材を無限に作れる相棒」として使うと効果が最大化するとまとめている。","level":1},{"q":"本書における「メタ認知」の説明として正しいのはどれか。","choices":["自分の学習状態を客観視する力","言語について語る力","AIへの指示力","単語を暗記する力"],"answer":0,"explanation":"メタ認知は自分の学習状態を客観視するスキルとして説明されている。","level":2},{"q":"本書によると文法用語やレベル指定などの「メタ言語」を使ってプロンプトを設計すると何ができるか。","choices":["AIの計算速度を上げられる","自分の目的・レベルに合った練習問題や語彙リストを生成できる","翻訳の著作権が保証される","通信量を削減できる"],"answer":1,"explanation":"メタ言語を使ってプロンプトを設計すると、目的・レベルに合った練習問題や語彙リストを生成できるとする。","level":2},{"q":"本書がスピーキング練習や自作英文のチェックに活用できるとするChatGPTの機能はどれか。","choices":["画像生成機能","音声会話機能","表計算連携機能","スケジュール管理機能"],"answer":1,"explanation":"ChatGPTの音声会話機能でロールプレイのスピーキング練習を行い、文法・語法チェックにも活用できるとする。","level":3}]},
      "ai17": {"title":"「そろそろ生成AIを戦力化したい」社長のためのChatGPT経営入門","quiz":[{"q":"本書が生成AIをどのように位置づけるべきとしているか。","choices":["便利なだけのツール","経営者の思考を拡張する「共創パートナー」","一時的な流行","経費削減のための道具"],"answer":1,"explanation":"生成AIは便利なツールではなく、経営者の思考を拡張する「共創パートナー」として位置づけるべきとする。","level":1},{"q":"著者はどのような経歴を持つ人物として紹介されているか。","choices":["文具店からDXカンパニーへ転換し売上を年120%成長させた三代目社長","AIを研究する大学教授","外資系コンサルティング会社の創業者","政府のAI政策担当者"],"answer":0,"explanation":"著者は文具店からDXカンパニーへの業態転換で売上を年120%成長させてきた三代目社長とされる。","level":1},{"q":"本書が経営導入にChatGPTが有効とする理由に含まれないものはどれか。","choices":["使いやすさ","安全機能","外部ツール連携","完全無料であること"],"answer":3,"explanation":"有効な理由は使いやすさ・安全機能・外部ツール連携であり、完全無料という点は挙げられていない。","level":2},{"q":"本書は判断に迷ったとき、AIに何を整理させることを勧めているか。","choices":["社員の勤怠記録","事実・問題点・選択肢・メリット・デメリット","競合他社の株価","会議の議事録の誤字"],"answer":1,"explanation":"事実・問題点・選択肢・メリット・デメリットをAIに整理させることで意思決定の軸が明確になるとする。","level":2},{"q":"本書が理念やトップ人材の思考パターンを組織に浸透させる方法として挙げるのはどれか。","choices":["自社の理念を学習させた「専用AI」を育てる","理念を紙のマニュアルに印刷する","毎朝理念を全員で唱和する","外部講師を招いて研修する"],"answer":0,"explanation":"自社の理念やトップ人材の思考パターンを学習させた「専用AI」を育てることで意思決定の質を組織に浸透させられるとする。","level":3}]},
      "ai18": {"title":"「わか者、ばか者、よそ者」はいちばん役に立つAI時代の創造的思考","quiz":[{"q":"本書によれば、AI時代に人間に残された役割とは何か。","choices":["創造的思考","単純作業の反復","データの暗記","規則の遵守"],"answer":0,"explanation":"AIによる自動化が進んでも人間に残るのは創造的思考という役割だと本書は説く。","level":1},{"q":"本書は創造性についてどのように述べているか。","choices":["生まれ持った才能で変えられない","法則を理解しコツをつかめば誰でも身につくスキル","一部の芸術家だけのもの","偶然にしか生まれない"],"answer":1,"explanation":"創造性は才能ではなく、法則を理解しコツをつかめば誰でも身につけられるスキルだとされる。","level":1},{"q":"創造性発揮のカギとなる3つの視点として挙げられているのは。","choices":["専門家・権威者・年長者","「わか者」「ばか者」「よそ者」","経営者・投資家・研究者","顧客・社員・株主"],"answer":1,"explanation":"既存の枠組みにとらわれない「わか者」「ばか者」「よそ者」の立場が創造性発揮のカギとされる。","level":2},{"q":"本書が勧める、失敗と決めつける前に可能性を探る思考を育てる口癖は。","choices":["「どうせ無理だ」","「でもそれがいい」","「前例がない」","「後で考えよう」"],"answer":1,"explanation":"まず「でもそれがいい」と声に出す習慣が、可能性を探る思考を育てるとされる。","level":2},{"q":"本書が自動化の波の根拠として踏まえている論文は。","choices":["オズボーン准教授の「雇用の未来」","チューリングの「計算機械と知能」","ムーアの「集積回路」論文","ドラッカーの「経営論」"],"answer":0,"explanation":"オズボーン准教授の「雇用の未来」論文が示す自動化の波を踏まえて論じられている。","level":3}]},
      "ai19": {"title":"「超」独学法 AI時代の新しい働き方へ","quiz":[{"q":"本書が社会人にとって効率的だと主張するのは。","choices":["学校に通うこと","独学","資格予備校","集団研修"],"answer":1,"explanation":"社会人にとっては学校に通うよりも独学のほうが効率的だと本書は主張する。","level":1},{"q":"独学がスクールより優れる理由として挙げられるのは。","choices":["費用が完全に無料だから","自分に必要な部分だけを学べるから","教師の質が高いから","仲間と競争できるから"],"answer":1,"explanation":"学校は誰にでも同じ内容を教えるが、独学は自分に必要な部分だけを学べるため効率がよい。","level":1},{"q":"本書が示す独学の始め方3ステップに含まれないものは。","choices":["分からない言葉を検索して調べる","新聞の第3面までの見出しを毎日チェックする","SNSで問題を探す","毎朝1時間の音読を続ける"],"answer":3,"explanation":"始め方3ステップは、言葉を検索、新聞の第3面までの見出しチェック、SNSで問題を探すの3つ。","level":2},{"q":"独学継続に必要な4条件として本書が挙げるものは。","choices":["ハッキリした目標・強いインセンティブ・勉強の楽しさ・時間の確保","高価な教材・専属講師・広い部屋・静けさ","才能・運・人脈・資金","毎日の暗記・テスト・順位・表彰"],"answer":0,"explanation":"継続には目標、インセンティブ、勉強の楽しさの活用、時間の確保の4条件が必要とされる。","level":2},{"q":"本書が説く独学の利点として最も適切なものは。","choices":["必ず短期間で成果が出る","間違った選択をしてもやり直しのコストがかからない","資格が確実に取得できる","誰かに教われる"],"answer":1,"explanation":"間違った選択をしてもやり直しのコストがかからないのが独学の利点だとされる。","level":3}]},
      "ai20": {"title":"いまこそ知りたいＡＩビジネス","quiz":[{"q":"本書がAI導入を頓挫させないために必須だとするものは。","choices":["サンプルデータ分析による「AI診断」","高価なGPUの購入","専門部署の新設","海外企業との提携"],"answer":0,"explanation":"AI導入で失敗しないためにはサンプルデータを分析する「AI診断」が必須だとされる。","level":1},{"q":"著者の石角友愛氏の経歴として本書に記されているのは。","choices":["台湾のデジタル担当政務委員","グーグル本社で機械学習のシニアストラテジスト","現役の医師","MITのMBA取得者"],"answer":1,"explanation":"著者はグーグル本社で機械学習のシニアストラテジストを務めた人物。","level":2},{"q":"マッキンゼーの調査で、AI導入により業績が大きく伸びると予想される業種の割合は。","choices":["約29%","約49%","約69%","約89%"],"answer":2,"explanation":"調査ではAI導入で業績が大きく伸びる業種は全体の69%にのぼるとされる。","level":2},{"q":"人とAIを組み合わせた好例として本書が挙げる企業は。","choices":["米ファッション通販「スティッチフィックス」","動画配信「ネットフリックス」","検索大手「グーグル」","EC大手「アマゾン」"],"answer":0,"explanation":"「スティッチフィックス」はAIと人間のスタイリストを組み合わせて成功した例として挙げられる。","level":3},{"q":"本書が説くAI導入の出発点として最も適切なものは。","choices":["最新技術をとにかく導入すること","自社の課題とデータをまず正しく診断すること","競合他社を模倣すること","大規模な組織改編を行うこと"],"answer":1,"explanation":"AI導入はすごい技術を入れることではなく、自社の課題とデータを正しく診断することから始まる。","level":3}]},
      "ai21": {"title":"やりきる意思決定 生成AIという「人間を超える知性」を従える究極のビジネススキル","quiz":[{"q":"本書が示す「やりきる意思決定」の4ステップの最初は。","choices":["課題の全体像把握","小さな実験","組織のベクトル統一","重要課題の選別"],"answer":0,"explanation":"4ステップは課題の全体像把握から始まり、重要課題の選別、ベクトル統一、小さな実験と続く。","level":1},{"q":"意思決定の第一歩として本書が挙げるのは。","choices":["経営課題をすべて洗い出すこと","予算を確定すること","人員を採用すること","競合を分析すること"],"answer":0,"explanation":"意思決定の第一歩は経営課題をすべて洗い出し、真に重要な課題を特定することとされる。","level":1},{"q":"本書によれば、施策実行をためらう際に見極めるべきことは。","choices":["上司の許可があるかどうか","本当に準備不足か、単なる不安からの先延ばしか","予算が十分かどうか","前例があるかどうか"],"answer":1,"explanation":"準備不足なのか、単なる不安から先延ばしにしているだけかを見極める必要があるとされる。","level":2},{"q":"本書が「やりきる意思決定」の4ステップとして整理している順序は。","choices":["全体像把握→重要課題の選別→ベクトル統一→小さな実験","小さな実験→全体像把握→重要課題の選別→ベクトル統一","重要課題の選別→小さな実験→全体像把握→ベクトル統一","ベクトル統一→全体像把握→小さな実験→重要課題の選別"],"answer":0,"explanation":"課題の全体像把握、重要課題の選別、組織のベクトル統一、小さな実験の順で進める。","level":2},{"q":"本書によれば、意思決定を止めている主因は何であることが多いか。","choices":["情報不足","「不安」","資金不足","人材不足"],"answer":1,"explanation":"意思決定を止めているのは情報不足より「不安」であることが多いとされる。","level":3}]},
      "ai22": {"title":"アナロジア AIの次に来るもの","quiz":[{"q":"本書がデジタルの次に来ると論じるものは。","choices":["アナログ(連続)の復権","量子コンピューティング","完全な自動化","無人化社会"],"answer":0,"explanation":"デジタル(離散)の次に来るのはアナログ(連続)の復権だと本書は論じる。","level":1},{"q":"本書によれば、デジタルとアナログの本質的違いは。","choices":["速度の速さと遅さ","離散的に数えられる量と連続した量","新しさと古さ","高価さと安価さ"],"answer":1,"explanation":"デジタルは離散的に数えられる量を、アナログは連続した量を扱うと説明される。","level":2},{"q":"本書が自然・人間・マシンの関係史を区分する時代の数は。","choices":["3つ","4つ","5つ","7つ"],"answer":1,"explanation":"著者は関係史を4つの時代に区分し、第四の時代でアナログが支配権を取り戻すと見立てる。","level":2},{"q":"本書によれば、テクノロジーが進歩するほど重要性が増すものは。","choices":["個別のアルゴリズム","要素間の関係性を捉えるマッピング","計算速度","データの保存容量"],"answer":1,"explanation":"進歩するほど個別のアルゴリズムより要素間の関係性を捉えるマッピングが重要になるとされる。","level":3},{"q":"本書によれば、人間社会にとって自然な状態はどちらか。","choices":["デジタル","アナログ","どちらでもない","時代による"],"answer":1,"explanation":"人間社会にとって自然な状態はアナログであると本書は述べる。","level":3}]},
      "ai23": {"title":"アフターAI 世界の一流には見えている生成AIの未来地図","quiz":[{"q":"本書によれば、AI変革の波はどのように移行しているか。","choices":["「コパイロット」から「エージェント」へ","「エージェント」から「コパイロット」へ","「ツール」から「玩具」へ","「クラウド」から「オンプレミス」へ"],"answer":0,"explanation":"人をサポートする「コパイロット」から人間と連動する「エージェント」へ移行しているとされる。","level":1},{"q":"本書が日本について位置づけている見方は。","choices":["AIで解決すべき課題が少ない","少子高齢化ゆえにAIで解決すべき課題が多い","AI実装で世界最先端である","AI活用の必要がない"],"answer":1,"explanation":"少子高齢化が進む日本にこそ生成AIで解決すべき課題が多いと位置づけられている。","level":1},{"q":"本書が示す「アフターAIの5つの波」に含まれないものは。","choices":["生成AIの加速的進化","AGI・ASIシンギュラリティー","AIネイティブなスタートアップ","AIハードウェアの国産化"],"answer":3,"explanation":"5つの波は加速的進化、シンギュラリティー、AIネイティブなスタートアップ、BIGTECの動向、既存産業内の競争。","level":2},{"q":"労働者人口が減少する中、個人・企業の付加価値を大きく左右するものは。","choices":["AIエージェントの活用レベル","保有する不動産の量","従業員の平均年齢","本社の立地"],"answer":0,"explanation":"AIエージェントの活用レベルが個人・企業の付加価値を大きく左右する時代になるとされる。","level":2},{"q":"本書が「最大のリスク」と説くものは。","choices":["生成AIをビジネスに実装しないこと","生成AIに投資しすぎること","人員を増やしすぎること","海外展開を急ぐこと"],"answer":0,"explanation":"生成AIをビジネスに実装しないことこそ最大のリスクだと著者は説く。","level":3}]},
      "ai24": {"title":"アフターChatGPT 生成AIが変えた世界の生き残り方","quiz":[{"q":"本書が望ましいとする、当面のAIとの付き合い方は。","choices":["人間が機長、生成AIが副操縦士","生成AIが機長、人間が副操縦士","人間が完全に手を引く","AIを一切使わない"],"answer":0,"explanation":"人間が機長、生成AIが副操縦士という関係性が望ましいとされる。","level":1},{"q":"本書によれば、生成AIの性能が飛躍的に進化する起点となった技術は。","choices":["グーグルの深層学習モデル「トランスフォーマー」","IBMの「ワトソン」","アップルの「Siri」","アマゾンの「Alexa」"],"answer":0,"explanation":"「トランスフォーマー」の発表をきっかけに生成AIの性能は飛躍的に進化したとされる。","level":2},{"q":"生成AIを副操縦士として使う関係で、本書が重要とする習慣は。","choices":["AIに最終判断を委ねる","最終チェックを人間が行いAIとの差分を問う","AIの回答をそのまま採用する","チェックを省略して効率化する"],"answer":1,"explanation":"最終チェックは人間が行い、AIとの差分を問う習慣を持つことが重要とされる。","level":2},{"q":"本書によれば、生成AIとの共存が問われる職業の範囲は。","choices":["クリエイティブ職に限られる","あらゆる職業に共通する","事務職のみ","経営者のみ"],"answer":1,"explanation":"生成AIとの共存はクリエイティブ職に限らず、あらゆる職業に共通する課題とされる。","level":3},{"q":"本書が勧める生成AIの捉え直し方として最も適切なものは。","choices":["自分の仕事を奪うもの","業務の一部を任せる優秀な助手","一時的な流行","娯楽のための道具"],"answer":1,"explanation":"仕事を奪うものではなく、業務の一部を任せる優秀な助手として捉え直す発想が実務的とされる。","level":3}]},
      "ai25": {"title":"オードリー・タン デジタルとAIの未来を語る","quiz":[{"q":"本書によれば、社会をつくるのは誰か。","choices":["人間","AI","政府だけ","デジタル技術"],"answer":0,"explanation":"社会をつくるのは人間であり、AIやデジタル技術は人間をサポートするツールにすぎないとされる。","level":1},{"q":"台湾がロックダウンなしに感染封じ込めに成功した理由として本書が挙げるのは。","choices":["政府と国民の信頼関係のもとでデジタル技術が活用されたから","国境を完全に封鎖したから","強力な罰則を設けたから","偶然の幸運だったから"],"answer":0,"explanation":"政府と国民の信頼関係のもとでデジタル技術が活用されたことが成功の要因とされる。","level":1},{"q":"市民プログラマーによる取り組みの例として本書が挙げるものは。","choices":["「マスクマップ」","「顔認証システム」","「監視カメラ網」","「電子投票」"],"answer":0,"explanation":"市民プログラマーによる「マスクマップ」が必要な情報の共有と拡散の例として挙げられる。","level":2},{"q":"本書が掲げる、デジタル技術の活用で実現できるとする社会の理念は。","choices":["「誰も置き去りにしない」社会","「勝者総取り」の社会","「完全監視」の社会","「無人化」の社会"],"answer":0,"explanation":"デジタル技術をうまく活用すれば「誰も置き去りにしない」社会が実現できるという理念を掲げる。","level":2},{"q":"本書によれば、デジタル化の成否を決めるものは何か。","choices":["技術力そのもの","政府・組織と市民・メンバーの信頼関係の質","投資額の大きさ","人口の規模"],"answer":1,"explanation":"成否を決めるのは技術力そのものより、政府・組織と市民の間の信頼関係の質だとされる。","level":3}]},
      "ai26": {"title":"ディープメディスン AIで思いやりのある医療を!","quiz":[{"q":"本書によれば、AIによる自動化・効率化が進むことで医療において復権するものは。","choices":["人間本来の役割(共感とつながり)","検査機器の数","入院日数","診療報酬"],"answer":0,"explanation":"効率化が進むことで、医療における人間本来の役割である共感とつながりがむしろ復権するとされる。","level":1},{"q":"本書はAIを医師にとってどのような存在として位置づけているか。","choices":["仕事を奪う存在","「時間という贈り物」を与える存在","医師を監視する存在","医師と競争する存在"],"answer":1,"explanation":"AIは医師から仕事を奪うのではなく「時間という贈り物」を与えてくれる存在とされる。","level":1},{"q":"「ディープメディスン」を構成する3要素に含まれないものは。","choices":["深く精緻なデータ","ディープラーニングによる分析","患者と臨床医の共感とつながり","病院経営の効率化"],"answer":3,"explanation":"3要素は精緻なデータ、ディープラーニングによる分析、患者と臨床医の共感とつながり。","level":2},{"q":"本書が示すアメリカの診察時間の現実として正しいものは。","choices":["初診平均12分、再診7分","初診平均30分、再診20分","初診平均5分、再診3分","初診平均60分、再診40分"],"answer":0,"explanation":"アメリカの診察時間は初診平均12分、再診は7分だと本書は示す。","level":2},{"q":"本書が重要とするAI導入の設計思想は。","choices":["効率化そのものを目的とする","生まれた時間を「共感」に再配分する","人員を削減する","診察数を最大化する"],"answer":1,"explanation":"効率化を目的とせず、生まれた時間を人間にしかできない共感に再配分する設計が重要とされる。","level":3}]},
      "ai27": {"title":"リーダーシップ進化論 人類誕生以前から、ＡＩ時代まで","quiz":[{"q":"本書がリーダーシップを捉え直す文脈として最も適切なものは。","choices":["人類誕生以前からAI時代まで一貫した進化の文脈","過去10年のビジネス事例のみ","特定企業の成功談","一国の政治史のみ"],"answer":0,"explanation":"リーダーシップは人類誕生以前からAI時代まで一貫した進化の文脈で捉え直せるとされる。","level":1},{"q":"本書によれば、リーダーが初めて求められるようになるのはどのような環境か。","choices":["組織の行動変化が勝負の行方を左右する環境","何も変化がない平穏な環境","個人が孤立した環境","資金が潤沢な環境"],"answer":0,"explanation":"組織の行動変化が勝負の行方を左右する環境で初めてリーダーが求められるとされる。","level":2},{"q":"本書の「自然発生的リーダー」に関する見方として正しいものは。","choices":["自然に生まれるリーダーが常に最良","自然に生まれるリーダーがよいリーダーとは限らない","リーダーは必ず選挙で選ぶべき","リーダーは不要である"],"answer":1,"explanation":"自然に生まれるリーダーがよいリーダーとは限らず、自己組織化を超克する必要があるとされる。","level":2},{"q":"本書がAI時代のリーダーに求めるものとして述べているのは。","choices":["生態系の主導権をめぐる世界的議論に参加し主導権を握ろうとする姿勢","AIを完全に排除する姿勢","変化を避け現状を維持する姿勢","技術を無視する姿勢"],"answer":0,"explanation":"人間が生態系トップの座をAIに明け渡す可能性がある中、世界的議論に参加し主導権を握る姿勢が求められる。","level":3},{"q":"本書が目指すリーダーシップとして述べているのは。","choices":["自己組織化を超克し真の平和を目指すリーダーシップ","強権による支配","自然発生に任せること","競争の排除"],"answer":0,"explanation":"自己組織化を超克し真の平和を目指すリーダーシップが必要とされる。","level":3}]},
      "ai28": {"title":"一流のマネジャー945人をAI分析してわかった できるリーダーの基本","quiz":[{"q":"本書によれば、メンバーが主体的に行動できるようになるために確保すべきものは。","choices":["心理的安全性","高額な報酬","厳しい罰則","長時間労働"],"answer":0,"explanation":"心理的安全性が確保されると、メンバーは主体的に行動できるようになるとされる。","level":1},{"q":"本書は何人のマネジャーの行動をAIで分析したものか。","choices":["945人","100人","5000人","300人"],"answer":0,"explanation":"著者は一流マネジャー945人の行動をAIで分析して基本原則を体系化した。","level":1},{"q":"チーム内の心理的安全性を高めるために本書が挙げるものは。","choices":["1on1における「5つの対話ルール」","毎日の朝礼","定期的な人事異動","成果主義の徹底"],"answer":0,"explanation":"心理的安全性を高めるには1on1における「5つの対話ルール」を意識するとよいとされる。","level":2},{"q":"本書が挙げる「自走するチームの3要件」に含まれないものは。","choices":["実験と学習を繰り返すこと","必要な助けを適切に求められること","余裕を持って判断できること","上司の指示を忠実に守ること"],"answer":3,"explanation":"3要件は実験と学習の反復、助けを適切に求められること、余裕を持って判断できることの3つ。","level":2},{"q":"本書の調査で、メンバーが自律的に動けない原因の67%を占めるとされたものは。","choices":["リーダーからの指示の出し方","メンバーの能力不足","報酬の低さ","職場環境の悪さ"],"answer":0,"explanation":"メンバーが自律的に動けない原因の67%はリーダーからの指示の出し方にあると判明した。","level":3}]},
      "ai29": {"title":"予測マシンの世紀 ＡＩが駆動する新たな経済","quiz":[{"q":"本書はAIの正体をシンプルに何と捉えているか。","choices":["安価な予測マシン","万能な労働者","高価な計算機","自律的な意思決定者"],"answer":0,"explanation":"本書はAIを「安価な予測マシン」と捉えることでビジネス変革の方法論が見えてくると論じる。","level":1},{"q":"本書を著したのはどのような専門家か。","choices":["3名の起業家","3名の経済学者","3名のエンジニア","3名の弁護士"],"answer":1,"explanation":"本書は経済学者3名によってAIをビジネス変革の視点から論じた一冊である。","level":1},{"q":"予測が安価になったことで価値が高まる「補完財」として挙げられているものは何か。","choices":["人件費と広告費","データやセンサー","土地や建物","特許や商標"],"answer":1,"explanation":"予測が安価になったことで、その材料となるデータやセンサーといった補完財の価値が高まると説く。","level":2},{"q":"本書が示す、決断を構成する6つのタスクの組み合わせとして正しいものはどれか。","choices":["観察・仮説・実験・分析・結論・報告","収集・保存・加工・出力・共有・削除","入力・判断・行動・結果・フィードバック・訓練","計画・実行・評価・改善・記録・共有"],"answer":2,"explanation":"決断は予測だけでなく、入力・判断・行動・結果・フィードバック・訓練という6つのタスクから成るとされる。","level":2},{"q":"本書がAI普及後の社会について指摘する課題はどれか。","choices":["人間の仕事がすべて消滅すること","予測精度が逆に低下すること","エネルギー消費が予測を上回ること","格差の拡大やAIを独占する側とされる側の分断"],"answer":3,"explanation":"AIが普及しても人間の仕事は残るが、格差の拡大やAIを独占する側とされる側の分断が課題になりうるとされる。","level":3}]},
      "ai30": {"title":"先読み！IT×ビジネス講座 画像生成AI","quiz":[{"q":"本書は画像生成AIをどのような技術だと位置づけているか。","choices":["全人類の表現力を底上げする技術","一部の専門家だけの技術","写真を高画質化する技術","文章を要約する技術"],"answer":0,"explanation":"画像生成AIは頭の中のイメージを誰もが簡単に可視化できる、全人類の表現力を底上げする技術とされる。","level":1},{"q":"本書はどのような形式で書かれているか。","choices":["論文形式","対談形式","日記形式","Q&A形式のみ"],"answer":1,"explanation":"インタラクションデザイナーと弁護士の対談形式で解説されている。","level":1},{"q":"本書が画像生成AIの苦手分野として挙げているものはどれか。","choices":["単色の背景を塗ること","短い文章を生成すること","色を反転させること","複数の人やモノを正確に描写すること"],"answer":3,"explanation":"複数の人やモノを正確に描写することや細部の正確な描写が苦手だと指摘される。","level":2},{"q":"本書によれば、自然言語による画像生成がもたらした変化は何か。","choices":["生成速度が大幅に低下した","著作権の問題がすべて解決した","画像生成の民主化が進んだ","印刷技術が不要になった"],"answer":2,"explanation":"プロンプトを指定するだけで誰もが画像を生成でき、創造の領域が開かれる「民主化」が進んだ。","level":2},{"q":"本書が画像生成AIの活用にあたり特に留意を促しているのはどの点か。","choices":["電力コストの高さ","保存容量の不足","著作権が未整備でグレーな部分が多いこと","生成に必要な専門知識の多さ"],"answer":2,"explanation":"画像生成AIに関する法律は未整備な部分も多く、著作権侵害にならないよう留意が必要とされる。","level":3}]},
      "ai31": {"title":"先読み！サイバーセキュリティ 生成AI時代の新たなビジネスリスク","quiz":[{"q":"本書はサイバー攻撃への対策をどのようなものと位置づけているか。","choices":["専門家だけが担うべき業務","もはや必須のリテラシー","一部の大企業だけの課題","任意の追加対策"],"answer":1,"explanation":"インターネットを使うすべての人にとって、サイバー攻撃への対策はもはや必須のリテラシーとされる。","level":1},{"q":"本書が挙げるサイバーセキュリティの三要素の組み合わせはどれか。","choices":["機密性・完全性・可用性","速度・容量・価格","入力・処理・出力","予防・検知・復旧"],"answer":0,"explanation":"サイバーセキュリティは機密性・完全性・可用性の3要素で構成される。","level":1},{"q":"データを人質に身代金を要求する攻撃を何と呼ぶか。","choices":["フィッシング","スパムメール","ランサムウェア","ワーム"],"answer":2,"explanation":"データを人質に身代金を要求する「ランサムウェア」の被害が近年増えているとされる。","level":2},{"q":"本書がフリーWi-Fi利用時の代替手段として推奨しているものはどれか。","choices":["有線LANのみの使用","VPNの完全な無効化","公衆端末の利用","モバイルWi-Fiルーターやテザリング"],"answer":3,"explanation":"フリーWi-Fiは情報が盗まれる恐れがあるため、モバイルWi-Fiルーターやテザリングの利用が推奨される。","level":2},{"q":"本書が生成AI時代のセキュリティについて述べていることはどれか。","choices":["攻撃側もAIを活用するため基本的な衛生管理の重要性が増す","AIの登場で人的対策は不要になった","マルウェアは完全に過去のものになった","フリーWi-Fiの危険性は解消された"],"answer":0,"explanation":"生成AI時代は攻撃側もAIを活用するため、基本的なセキュリティ衛生管理の重要性がむしろ増すとされる。","level":3}]},
      "ai32": {"title":"強いLLMO AI検索で選ばれるためのマーケティングガイド","quiz":[{"q":"本書によればマーケティングの主戦場は何へ移行しているか。","choices":["紙媒体の広告","テレビCM","AIにどう認識させ推薦させるかを競うLLMO","対面営業"],"answer":2,"explanation":"従来のSEOから、AIにどう認識させ推薦させるかを競うLLMOへ主戦場が移行しているとされる。","level":1},{"q":"「LLMO」とは何の最適化を指すか。","choices":["大規模言語モデル最適化","ローカル検索最適化","リンク経路最適化","広告費用最適化"],"answer":0,"explanation":"LLMOは大規模言語モデル最適化(Large Language Model Optimization)を指す。","level":1},{"q":"本書はLLMOを従来のSEOとどう区別しているか。","choices":["検索順位を上げる点で同一である","AIに信頼できる存在として刻まれる取り組みで狙う対象が異なる","広告出稿の一種である","SEOの旧称にすぎない"],"answer":1,"explanation":"LLMOはAIに信頼できる存在として刻まれる取り組みであり、検索順位を上げる従来のSEOとは狙う対象が異なる。","level":2},{"q":"本書が示す、AIに推薦されるための3段階に含まれないものはどれか。","choices":["深く理解される","高く評価される","自信を持って推薦される","安価に配信される"],"answer":3,"explanation":"AIから深く理解され、高く評価され、自信を持って推薦されるという3段階すべてへのアプローチが必要とされる。","level":2},{"q":"著者の所属や背景として本書に記されているものはどれか。","choices":["広告代理店の役員","大学の情報工学教授","SEO支援企業LANYに所属","出版社の編集長"],"answer":2,"explanation":"著者はSEO支援企業LANYに所属し、生成AI検索時代の新しいマーケティング手法を体系的に解説する。","level":3}]},
      "ai33": {"title":"生成AI「戦力化」の教科書","quiz":[{"q":"本書は生成AI(LLM)を何にたとえているか。","choices":["物知りでタフで賢い新入社員","経験豊富な役員","外部の下請け業者","故障しやすい機械"],"answer":0,"explanation":"生成AIは物知りでタフで賢い新入社員であり、会社固有の知識を教え込んで初めて戦力になるとされる。","level":1},{"q":"本書の著者はどのような人物と紹介されているか。","choices":["法律に精通した弁護士","技術と経営の両面に精通する人物","医療分野の研究者","広告業界の出身者"],"answer":1,"explanation":"技術と経営の両面に精通する著者が「AIオンボーディング」という考え方を提示する。","level":1},{"q":"自社固有の知識と業務手順をLLMに教え込み実務で機能させる取り組みを著者は何と呼ぶか。","choices":["ファインチューニング","プロンプトエンジニアリング","AIオンボーディング","ディープラーニング"],"answer":2,"explanation":"自社固有の知識と業務手順をLLMに教え込み実務で機能させる取り組みを著者は「AIオンボーディング」と呼ぶ。","level":2},{"q":"LLMを新入社員にたとえる理由として本書が述べているものはどれか。","choices":["給与を支払う必要があるから","優秀でも入社直後に成果を出すのは難しいのと同様だから","休息が必要だから","すぐに退職してしまうから"],"answer":1,"explanation":"どれほど優秀な人材でも入社直後に成果を出すのは難しいのと同様、LLMも会社特有の知識がなければ成果を発揮できない。","level":2},{"q":"本書によれば、生成AI導入がうまくいかない原因の多くは何か。","choices":["技術力の不足","予算の不足","自社の暗黙知を言語化・構造化できていないこと","AIモデルの性能不足"],"answer":2,"explanation":"導入がうまくいかない原因の多くは技術力ではなく、自社の暗黙知を言語化・構造化できていないことにあるとされる。","level":3}]},
      "ai34": {"title":"生成AIが変える世界を紐解くINFRA MECHANISM -時代を生き残るための7つの戦略-","quiz":[{"q":"本書は生成AIを人類史上初めての何だと位置づけているか。","choices":["知能を広く供給するインフラ","完全自律型のロボット","無限のエネルギー源","国家を統治する制度"],"answer":0,"explanation":"生成AIは人類史上初めて知能を広く供給するインフラであり、水道や電気と同じ普及メカニズムを持つとされる。","level":1},{"q":"本書が抽出した、インフラ普及に共通する構造を何と呼ぶか。","choices":["ネットワーク効果","インフラメカニズム","プラットフォーム戦略","スケールの法則"],"answer":1,"explanation":"水道や電気など多分野を横断し、普及に共通する構造「インフラメカニズム」を抽出している。","level":1},{"q":"本書がインフラメカニズムを導くために横断した分野に含まれないものはどれか。","choices":["水道・電気","鉄道・GPS","プラットフォーム","農業・漁業"],"answer":3,"explanation":"本書は水道・電気・鉄道・GPS・プラットフォームまで横断してインフラメカニズムを抽出している。","level":2},{"q":"本書は生成AIを「知能のインフラ」と呼ぶ理由として何を挙げているか。","choices":["電力消費を増やすから","思考コストを下げ時間や人間関係のあり方まで変容させるから","計算速度を落とすから","一部の専門家だけが使うから"],"answer":1,"explanation":"生成AIは思考コストを下げ、時間・空間の認識や人間関係のあり方までも変容させる知能インフラとされる。","level":2},{"q":"本書が知能インフラを握る主体の影響力について述べていることはどれか。","choices":["徐々に弱まっていく","地域内にとどまる","国家を超える影響力を持つようになる","法律で完全に制御できる"],"answer":2,"explanation":"知能インフラを握る主体は、国家を超える影響力を持つようになっていくとされる。","level":3}]},
      "ai35": {"title":"生成AIで世界はこう変わる","quiz":[{"q":"本書によれば生成AIの影響を最も受けやすいのはどの職種か。","choices":["ホワイトカラー職種","建設現場の作業員","農業従事者","運送ドライバー"],"answer":0,"explanation":"肉体労働は代替されにくい一方、ホワイトカラーの職種は影響を受けやすいとされる。","level":1},{"q":"本書の著者はどのような立場の人物か。","choices":["経営コンサルタント","第一線でAI研究をおこなう研究者","政府の官僚","作家"],"answer":1,"explanation":"第一線でAI研究をおこなう著者が、生成AIを平易な言葉で解説している。","level":1},{"q":"本書が生成AIを技術的にどう定義しているか。","choices":["データを検索して並べ替える技術","ディープラーニングを使い文章・画像・音声などを新たに作り出す技術","人間の脳を物理的に再現する技術","既存の画像を圧縮する技術"],"answer":1,"explanation":"生成AIはディープラーニングを使い、新たに文章・画像・音声などを作り出す人工知能技術の一種と定義される。","level":2},{"q":"仕事が奪われるかを見極めるポイントとして本書が示す対比はどれか。","choices":["正社員型か派遣型か","労働補完型か労働置換型か","国内型か海外型か","対面型か在宅型か"],"answer":1,"explanation":"仕事が奪われるかは「労働補完型」か「労働置換型」かの見極めがポイントとされる。","level":2},{"q":"本書がAIの無断学習について述べている立場はどれか。","choices":["学習を一律に規制すべきだと断言している","是非が問われつつ一律規制の妥当性にも議論があるとする","無断学習は完全に合法だと結論づけている","学習の存在自体を否定している"],"answer":1,"explanation":"無断学習は是非が問われているが、学習自体を一律に規制することの妥当性についても議論があるとされる。","level":3}]},
      "ai36": {"title":"生成AI時代を勝ち抜く事業・組織のつくり方","quiz":[{"q":"本書が主な読者として想定しているのは誰か。","choices":["経営層・事業リーダー","小学生","定年退職者","趣味のプログラマー"],"answer":0,"explanation":"本書は経営層・事業リーダー向けの実務書として書かれている。","level":1},{"q":"本書によれば生成AIの登場で何が大きな差を生み出す時代になったか。","choices":["企業規模の差","活用レベルの差","立地の差","資本金の差"],"answer":1,"explanation":"生成AIの登場によって、個人も企業も活用レベルの差が大きな差を生み出す時代に転換しているとされる。","level":1},{"q":"生成AI領域で成功する事業をつくるために本書が両立を求める2つのデザインはどれか。","choices":["価格のデザインと納期のデザイン","意義のデザインと意味のデザイン","色のデザインと形のデザイン","短期のデザインと長期のデザイン"],"answer":1,"explanation":"社会的な「意義」と利用者にとっての「意味」の両方を設計する必要があるとされる。","level":2},{"q":"本書が示す2040〜2045年の組織観として正しいものはどれか。","choices":["AIは人間の脳の新しいレイヤー的存在になり生成AIネイティブな組織のみが生き残る","AIは完全に廃れて人力に戻る","組織は不要になり個人だけが残る","AIは娯楽用途に限定される"],"answer":0,"explanation":"将来AIは人間の脳の新しいレイヤー的存在になり、生成AIネイティブな組織のみが生き残るという見立てが示される。","level":2},{"q":"本書が警告する、導入を先送りする組織の姿勢はどれか。","choices":["予算が足りないという理由","トップの理解が得られないという理由で先送りすること","人材が多すぎるという理由","技術が古すぎるという理由"],"answer":1,"explanation":"トップの理解が得られないという理由で導入を先送りする組織は、生成AIネイティブな組織との差を急速に広げられるとされる。","level":3}]},
      "ai37": {"title":"生成AI最速仕事術","quiz":[{"q":"本書の著者はどのような愛称で知られているか。","choices":["エクセル兄さん","AI博士","プロンプト先生","データおじさん"],"answer":0,"explanation":"著者は“エクセル兄さん”の愛称で知られる人気講師である。","level":1},{"q":"本書が高品質な成果物を得る鍵とするプロンプトの3要素はどれか。","choices":["長さ・速さ・量","目的・条件・参照情報","色・形・音","過去・現在・未来"],"answer":1,"explanation":"目的・条件・参照情報の3つをバランスよく整理して伝えることが鍵とされる。","level":1},{"q":"本書が作業を半自動化する手段として勧めているものはどれか。","choices":["高価な専用ソフトの導入","何度も使い回せるプロンプトの型を作ること","AIモデルを自作すること","作業をすべて外注すること"],"answer":1,"explanation":"何度も使い回せる「プロンプトの型」を作っておくと作業を半自動化でき効率が向上するとされる。","level":2},{"q":"本書によればプロンプトの型はどのように設計するのがよいか。","choices":["固定部分と可変部分に分けて設計する","毎回すべてゼロから書く","一切変更しないよう固定する","他人のものをそのまま流用する"],"answer":0,"explanation":"型は固定部分と可変部分に分けて設計するとよいとされる。","level":2},{"q":"本書が生成AI活用の生産性を左右するとして推奨する習慣はどれか。","choices":["プロンプトを毎回ゼロから書くこと","業務別に型としてストックしていくこと","AIを使わず手作業に戻すこと","参照情報を省くこと"],"answer":1,"explanation":"プロンプトを毎回ゼロから書くのではなく、業務別に型としてストックしていくことが生産性を左右するとされる。","level":3}]},
      "ai38": {"title":"責任あるAI「AI倫理」戦略ハンドブック","quiz":[{"q":"本書は企業のどの場面でのAI活用における倫理的課題を扱っているか。","choices":["意思決定","製品の配送","オフィスの清掃","社内のレクリエーション"],"answer":0,"explanation":"本書は企業活動における意思決定にAIを活用する際の倫理的課題と方法論を扱う。","level":1},{"q":"本書が提示する方法論の名称はどれか。","choices":["高速なAI","責任あるAI","安価なAI","自律するAI"],"answer":1,"explanation":"本書は倫理的課題に対応する「責任あるAI」という方法論を解説している。","level":1},{"q":"本書が指摘する、生のデータに含まれる問題はどれか。","choices":["データ量が常に不足していること","性別や人種などによる既存の社会格差の構造が含まれること","保存形式が古いこと","更新頻度が高すぎること"],"answer":1,"explanation":"生のデータには既存の社会格差の構造が含まれており、AIの出力がその再生産につながりかねないとされる。","level":2},{"q":"本書によれば「AI支援による意思決定」が助けになる理由はどれか。","choices":["人間は思考のクセによりバイアスのかかった判断をしやすいから","AIは疲れないから","AIの方が計算が速いから","人間の判断が不要になるから"],"answer":0,"explanation":"人間は思考のクセによりバイアスのかかった判断をしてしまいやすく、そこでAI支援が助けになるとされる。","level":2},{"q":"本書が説く「責任あるAI」が社会に対して担保しようとするものはどれか。","choices":["処理速度と低コスト","公平性・透明性","独占と優位性","娯楽性と話題性"],"answer":1,"explanation":"人間の前提によるAI開発を行い示すことで、社会に対して公平性・透明性を担保するのが責任あるAIとされる。","level":3}]},
      "ai39": {"title":"運の技術 AI時代を生きる僕たちに必要なたった1つの武器","quiz":[{"q":"本書は開運の仕組みをどのように捉えているか。","choices":["論理的に説明できるもの","まったくの偶然の産物","神頼みでしか得られないもの","生まれつき決まっているもの"],"answer":0,"explanation":"開運の仕組みは論理的に説明でき、運とは自ら切り開くものとされる。","level":1},{"q":"本書の著者はどのような職業の人物か。","choices":["人気バラエティ番組を手がけてきたプロデューサー","大学教授","小説家","医師"],"answer":0,"explanation":"人気バラエティ番組を手がけてきたプロデューサーが、開運のロジックを解説する。","level":1},{"q":"本書は「運を上げる」ことを何と同義だと定義しているか。","choices":["他人に任せること","何事も自分ごと化すること","運を天に委ねること","支出を増やすこと"],"answer":1,"explanation":"運を上げるとは自分の名前で勝負すること、すなわち何事も自分ごと化することと同義と定義される。","level":2},{"q":"本書が運を高めるために重要とする、外界に対してオープンな思考を何と呼ぶか。","choices":["直線思考","渦巻き思考","収束思考","逆算思考"],"answer":1,"explanation":"外界に対して常にオープンで、無価値に見えるものも取り込む「渦巻き思考」が重要とされる。","level":3},{"q":"本書がバッファ(余白)や遊びの価値として述べていることはどれか。","choices":["予定を隙間なく埋めるほど運がよくなる","偶然の面白い展開を取り込める余地が生まれる","計画の精度が下がるだけである","運とは無関係である"],"answer":1,"explanation":"予定やタスクにバッファや遊びがあるからこそ、偶然の面白い展開を取り込める余地が生まれるとされる。","level":3}]},
      "ai40": {"title":"面倒な仕事が一瞬で片付く生成AIタスク爆速大全","quiz":[{"q":"生成AIから精度の高い回答を引き出す最大の鍵は何か。","choices":["指示文(プロンプト)の質","使用するAIの種類","パソコンの処理速度","質問する時間帯"],"answer":0,"explanation":"曖昧な指示は曖昧な回答しか生まないため、プロンプトの質が鍵とされる。","level":1},{"q":"プロンプト設計の4要素に含まれないものはどれか。","choices":["予算","フォーマット","インストラクション","パラメータ"],"answer":0,"explanation":"4要素はフォーマット・インストラクション・パラメータ・フィードバックであり、予算は含まれない。","level":1},{"q":"業務で生成AIを使うとき重要とされる進め方はどれか。","choices":["まず結論だけ聞く","業務フローを分解した上で指示を出す","一度に全てを丸投げする","AIに任せて確認しない"],"answer":1,"explanation":"業務フローを分解し、求める成果物を明瞭にイメージして対話することが重要とされる。","level":2},{"q":"部門横断の実例として紹介されるのはどれか。","choices":["自動で経理仕訳を承認する","契約書を法的に確定する","人事の面接想定質問リストを作成する","株価を予測する"],"answer":2,"explanation":"候補者の経歴とカルチャーを照らし合わせた面接想定質問リストの作成が例に挙げられる。","level":2},{"q":"この本が勧める生成AI活用の始め方はどれか。","choices":["高価な専用AIを導入する","全部門を一斉に自動化する","外部コンサルに全て委託する","自部門の反復業務を洗い出しプロンプトをテンプレート化する"],"answer":3,"explanation":"活用効果は部門ごとに定型化できるため、反復業務のテンプレート化から始めるとよいとされる。","level":3}]},
      "ai41": {"title":"５０００日後の世界 すべてがＡＩと接続された「ミラーワールド」が訪れる","quiz":[{"q":"本書が次世代プラットフォームになると予測する概念はどれか。","choices":["メタ検索","ミラーワールド","ブロックチェーン","クラウド会計"],"answer":1,"explanation":"現実世界とデジタル世界が重なり合うミラーワールドが、SNSに続く次のプラットフォームになると予測する。","level":1},{"q":"著者ケヴィン・ケリーの経歴として本文に挙げられるのはどれか。","choices":["『WIRED』創刊編集長","大学の言語学教授","証券アナリスト","政府のAI担当大臣"],"answer":0,"explanation":"著者は雑誌『WIRED』の創刊編集長と紹介されている。","level":1},{"q":"ミラーワールドが現実とデジタルを結びつける手段として挙げられるのはどれか。","choices":["紙の地図","スマートグラスやAR","固定電話","郵便"],"answer":1,"explanation":"現実世界がスマートグラスやARを通じてデジタル世界と結びつく未来像が描かれる。","level":2},{"q":"本書が重なって訪れるとする3つの時代に含まれないものはどれか。","choices":["AIの時代","新生物学的な時代","アジアが躍進する時代","宇宙移住の時代"],"answer":3,"explanation":"AIの時代・バイオテクノロジーによる新生物学的な時代・アジアの世紀が重なるとされ、宇宙移住は含まれない。","level":2},{"q":"不確実性が増す世界で最も重要になるスキルとして本書が挙げるのはどれか。","choices":["一つの専門知識を極める","暗記力を高める","学び方を学ぶ","資格を多く取る"],"answer":2,"explanation":"個別の専門知識以上に、どうやって学ぶかを学ぶ汎用スキルが必要になるとされる。","level":3}]},
      "ai42": {"title":"ＡＩに負けない子どもを育てる","quiz":[{"q":"本書がAI時代に必須とする力はどれか。","choices":["計算の速さ","文章を読んで意味を理解する読解力","暗記量","タイピング速度"],"answer":1,"explanation":"AIに負けない人材になるには、文章の意味を理解する読解力が必須とされる。","level":1},{"q":"本書はどの本の続編か。","choices":["『AI vs. 教科書が読めない子どもたち』","『思考力の身につけ方』","『仮説脳』","『問いの設定力』"],"answer":0,"explanation":"本書はベストセラー『AI vs. 教科書が読めない子どもたち』の続編である。","level":1},{"q":"多くの子どもがしているとされる「AI読み」とは何か。","choices":["音読を繰り返す読み方","キーワードの群れで文章を理解しようとする読み方","速読術","図だけを見る読み方"],"answer":1,"explanation":"AIと同じようにキーワードの群れで理解しようとする「AI読み」が読解力不足の一因とされる。","level":2},{"q":"読解力を診断するために開発された指標はどれか。","choices":["IQテスト","RST(リーディングスキルテスト)","偏差値模試","TOEIC"],"answer":1,"explanation":"AIの可能性と限界を知る目的で開発されたRSTが読解力診断の軸となる。","level":2},{"q":"AIが自然言語処理で威力を発揮するための技術的制約として挙げられるのはどれか。","choices":["高性能なGPUが1台あればよい","同じ形式の問題が数千単位で必要","人間の教師が常時監督する","問題が1問あれば足りる"],"answer":1,"explanation":"AIが自然言語処理で威力を発揮するには、同じ形式の問題が数千単位で必要という制約がある。","level":3}]},
      "ai43": {"title":"ＡＩに負けない自分で考える子どもを育てる２１世紀型教育","quiz":[{"q":"本書が転換を訴える教育の方向はどれか。","choices":["20世紀型(丸暗記)から21世紀型(批判的思考)へ","家庭学習から塾へ","文系から理系へ","日本語から英語へ"],"answer":0,"explanation":"丸暗記型の20世紀型教育から、批判的・創造的思考を育てる21世紀型教育への転換を訴える。","level":1},{"q":"本書冒頭で批判的思考の重要性を象徴する言葉を残した人物は誰か。","choices":["ノーベル賞学者・本庶佑氏","発明家エジソン","経営者スティーブ・ジョブズ","数学者ガウス"],"answer":0,"explanation":"教科書が全部正しいと思ったらおしまいという本庶佑氏の言葉が象徴として挙げられる。","level":1},{"q":"20世紀型教育の限界として本書が指摘する点はどれか。","choices":["体力がつかない","丸暗記と正確なアウトプットはAIに太刀打ちできない","費用が高い","英語力が伸びない"],"answer":1,"explanation":"情報の記憶・処理においては丸暗記能力ではAIに太刀打ちできないと指摘される。","level":2},{"q":"三田国際学園が実践する教育手法はどれか。","choices":["反復ドリル型教育","相互通行型教育","通信教育","完全個別自習"],"answer":1,"explanation":"問いに対しグループで議論しプレゼンする相互通行型教育で考える力を鍛えている。","level":2},{"q":"2040年に向けて日本で求められる人材像として本書が挙げるのはどれか。","choices":["AIに使われる人材","AIを使いこなす人材","単純作業に特化した人材","暗記に長けた人材"],"answer":1,"explanation":"少子高齢化が進む日本で求められるのは、AIに使われるのではなくAIを使いこなす人材とされる。","level":3}]},
      "ai44": {"title":"ＡＩに駆逐されない営業力 実践！インサイトセールス","quiz":[{"q":"本書が提唱する新しい営業手法の名称はどれか。","choices":["ソリューションセールス","インサイトセールス","テレアポ営業","ルート営業"],"answer":1,"explanation":"顧客のビジョン実現のための提案を行うインサイトセールスを提唱する。","level":1},{"q":"本書が終わったとする従来の営業スタイルはどれか。","choices":["ソリューション提案の時代","対面営業の時代","電話営業の時代","展示会営業の時代"],"answer":0,"explanation":"冒頭でソリューション提案の時代は終わったと述べている。","level":1},{"q":"提案型・課題解決型営業の限界として指摘される点はどれか。","choices":["顧客と会えない","価格競争・条件競争に陥りやすい","資料が作れない","契約書が複雑になる"],"answer":1,"explanation":"提案型営業だけでは目新しさを出せず、価格・条件競争に陥りやすくAI代替リスクもあると指摘される。","level":2},{"q":"インサイトセールスの核心として傾聴すべき対象はどれか。","choices":["顧客の当面の予算","顧客の経営理念や事業ビジョン","競合他社の価格","業界の平均相場"],"answer":1,"explanation":"顧客の経営理念や事業ビジョンを傾聴し、その実現のための提案を行うのが核心とされる。","level":2},{"q":"経営トップが身を乗り出す提案に必要とされる3つの要素はどれか。","choices":["価格・納期・品質","観点・共感・意思","熱意・根性・気合","数字・図表・実績"],"answer":1,"explanation":"事実や経験に基づく観点・共感・意思をもった傾聴と提案が必要とされる。","level":3}]},
      "ai45": {"title":"ＡＩ時代の人生戦略 「ＳＴＥＡＭ」が最強の武器である","quiz":[{"q":"本書が最強の武器とする素養STEAMは、STEMに何を加えたものか。","choices":["Art(芸術)","Business(経営)","Language(語学)","History(歴史)"],"answer":0,"explanation":"科学・技術・工学・数学(STEM)に芸術(Art)を加えたものがSTEAMである。","level":1},{"q":"本書が予測する仕事への影響はどれか。","choices":["仕事の約半数がAI・ロボットに代替される","全ての仕事がなくなる","仕事は一切変わらない","肉体労働だけが残る"],"answer":0,"explanation":"現代の仕事の約半数はAIやロボットに代替されるが、新しく生まれる仕事もあるとされる。","level":1},{"q":"AI時代に価値を持つ働き方として本書が勧めるのはどれか。","choices":["AIに使われる仕事につく","AIを使う仕事につく側に回る","AIを避けて働く","単純作業を続ける"],"answer":1,"explanation":"代替される側ではなく、AIを使う仕事につく側に回ることが鍵とされる。","level":2},{"q":"STEMにArtを加える理由として述べられるのはどれか。","choices":["美術大学の人気が高いから","テクノロジーと切り離せなくなる時代の武器になるから","芸術のほうが稼げるから","数学が不要になるから"],"answer":1,"explanation":"テクノロジーと切り離せなくなる時代に、Artを加えたSTEAMが武器になるとされる。","level":2},{"q":"STEAM人材の土台として本書が勧める姿勢はどれか。","choices":["まず大学院で専門を極める","資格を大量に取得する","テレビや雑誌・入門書で広く浅く情報に触れる","一つの分野だけに集中する"],"answer":2,"explanation":"著者は日常的にテレビや雑誌、入門書で広く浅く情報に触れる姿勢の重要性を説く。","level":3}]},
      "ai46": {"title":"ＡＩ時代の子育て戦略","quiz":[{"q":"本書が終わったとする子育ての価値観はどれか。","choices":["ガリ勉をして東大をめざす","早寝早起きをする","習い事をさせる","読み聞かせをする"],"answer":0,"explanation":"ガリ勉をして東大をめざす時代は終わり、好きなことにハマる力が強みになるとする。","level":1},{"q":"本書がAI時代に価値を持つとする職業の特徴はどれか。","choices":["転職がしやすい","給料が固定である","資格が不要","出社が不要"],"answer":0,"explanation":"AI時代に価値を持つのは転職がしやすい職業とされ、AIを使う側になるSTEM教育を推奨する。","level":1},{"q":"一流になるために必要な要素として本書が挙げる組み合わせはどれか。","choices":["学歴+人脈","素質+のめり込む力","資金+運","体力+根性"],"answer":1,"explanation":"一流になるには素質だけでなく、のめり込む力が必要とされる。","level":2},{"q":"本書が指摘する「高学歴の親が陥る罠」とはどれか。","choices":["子どもに勉強を教えすぎる","子どもが何かにハマろうとすると阻止してしまう","子どもを放任しすぎる","習い事を増やしすぎる"],"answer":1,"explanation":"高学歴の親ほど、受験勉強をおろそかにして何かにハマろうとする子を阻止しがちで、可能性を狭めるとする。","level":2},{"q":"いい大学の意味が変わる時代に本書が土台として重視することはどれか。","choices":["有名塾に通わせること","偏差値を上げること","子どもが何かに没頭する経験を尊重すること","早期に進路を固定すること"],"answer":2,"explanation":"何かに没頭する経験を尊重することが長期的なキャリアの土台になるとされる。","level":3}]},
      "ai47": {"title":"ＡＩ経営で会社は甦る","quiz":[{"q":"本書はデジタル革命がどこへ広がると述べているか。","choices":["バーチャルな世界のみ","リアルな世界を含む全産業","通信業界だけ","金融業界だけ"],"answer":1,"explanation":"デジタル革命はバーチャルなCの世界から、自動車や介護などリアルなSの世界へ全産業に広がるとする。","level":1},{"q":"本書でいう「Cの世界」の「C」は何を指すか。","choices":["カジュアル","コンピューター","クラウド","カスタマー"],"answer":0,"explanation":"バーチャルなC(カジュアル)の世界と説明されている。","level":1},{"q":"「Sの世界」の特徴として本書が述べるのはどれか。","choices":["スピード重視で質を犠牲にできる","人命に関わり質の犠牲が通用しない","収益を度外視できる","規制がまったくない"],"answer":1,"explanation":"人命に関わるS(シリアス)の世界では、質を犠牲にするやり方は通用しないとされる。","level":2},{"q":"これまでデジタル革命が限られていた領域として挙げられるのはどれか。","choices":["自動車・介護","農業・漁業","コンピューターやAV機器・通信関連","建設・不動産"],"answer":2,"explanation":"デジタル革命はコンピューターやAV機器・通信関連に限られていたが、今後は全産業に及ぶとされる。","level":2},{"q":"リアル産業のデジタル変革を進める際の前提として本書が強調するのはどれか。","choices":["ネットビジネスの成功法則をそのまま適用する","業界特有の作法への理解","スピードを最優先する","組織文化を無視した統合"],"answer":1,"explanation":"ネットの成功法則を持ち込むのではなく、業界特有の作法や組織文化を理解した統合経営が前提とされる。","level":3}]},
      "dx03": {"title":"DX進化論 つながりがリブートされた世界の先","quiz":[{"q":"本書によればネットの本質は何か。","choices":["遠くをつなぐこと","情報を暗号化すること","広告を出すこと","端末を売ること"],"answer":0,"explanation":"ネットの本質は遠くをつなぐこと、AIの本質は多様なものを最適につなぐこととされる。","level":1},{"q":"本書の成り立ちはどれか。","choices":["3人の論客による対談録","単著の自伝","統計データ集","小説"],"answer":0,"explanation":"尾原和啓・宮田裕章・山口周の3人の論客による対談録である。","level":1},{"q":"行動変容の好循環事例として挙げられるDiDiの仕組みはどれか。","choices":["運賃を固定する制度","良い振る舞いをするほど報酬が上がるドライバースコア","車両を無料配布する制度","免許を自動更新する制度"],"answer":1,"explanation":"DiDiのドライバースコアは、安全運転など良い振る舞いをするほど報酬が上がり、信頼関係に変える仕組み。","level":2},{"q":"GDPに代わる豊かさの指標として本書が提示する概念はどれか。","choices":["GNPと物価指数","well-beingやBetter Co-Being","株価と地価","貿易収支"],"answer":1,"explanation":"貨幣中心のGDPに代わり、well-beingや、ともによりよくあることを意味するBetter Co-Beingが提示される。","level":2},{"q":"データガバナンスの課題として本書が必要性を指摘する第三の主体はどれか。","choices":["国家による一元管理","巨大プラットフォーマーによる管理","データコモンズ","個人の完全自己管理"],"answer":2,"explanation":"国家でも巨大プラットフォーマーでもないデータコモンズという第三の主体の必要性が指摘される。","level":3}]},
      "dx04": {"title":"ゆるFIRE 億万長者になりたいわけじゃない私たちの投資生活","quiz":[{"q":"「ゆるFIRE」が目指すものはどれか。","choices":["完全な労働からの引退","無理のない範囲での早期セミリタイア","億万長者になること","海外移住"],"answer":1,"explanation":"完全FIREの厳しい節約を前提とせず、無理のない範囲での早期セミリタイアを目指す。","level":1},{"q":"ゆるFIREの貯蓄率目標はどれか。","choices":["年収の50%","年収の90%","年収の10%","年収の100%"],"answer":0,"explanation":"貯蓄率目標は年収の50%(完全FIREは70%)とされる。","level":1},{"q":"ゆるFIREが採用する取り崩し率はどれか。","choices":["一般的な4%ルール","保守的な2.5%","積極的な8%","取り崩さない"],"answer":1,"explanation":"取り崩し率は4%ルールより保守的な2.5%とし、不足分はゆるい仕事の収入で補う。","level":2},{"q":"本書が「稼ぐ力の基本」として重視するものはどれか。","choices":["副業","本業","投資","節約"],"answer":1,"explanation":"社会保険や退職金の価値を踏まえ、稼ぐ力の基本は本業であり副業は補強とされる。","level":2},{"q":"投資を始める前の準備として本書が勧めることはどれか。","choices":["全資金を投資に回す","生活防衛資金として100万円程度を別枠で確保する","借金をして投資する","保険をすべて解約する"],"answer":1,"explanation":"手持ち資金を全て投資に回さず、生活防衛資金として100万円程度を別枠で確保してから運用を始める。","level":3}]},
      "dx07": {"title":"営業DX 売上増の無限ループを実現する","quiz":[{"q":"本書が定義する営業DXとは何か。","choices":["顧客を起点とする全社変革運動","営業担当の人員削減","電話営業の強化","値引きの自動化"],"answer":0,"explanation":"営業DXは顧客を起点とする全社変革運動であり、特別な能力がなくても成果を出せる体制づくりとされる。","level":1},{"q":"営業DXの2つの効果として挙げられるのはどれか。","choices":["活動の効率化と個人の能力に依存しない体制構築","値上げと在庫削減","広告費削減と店舗拡大","残業増加と採用強化"],"answer":0,"explanation":"営業活動の効率化と、個人の能力に依存しない営業体制の構築が2つの効果とされる。","level":1},{"q":"リード育成の3段階の正しい順序はどれか。","choices":["ナーチャリング→ジェネレーション→クオリフィケーション","ジェネレーション→ナーチャリング→クオリフィケーション","クオリフィケーション→ナーチャリング→ジェネレーション","ジェネレーション→クオリフィケーション→ナーチャリング"],"answer":1,"explanation":"見込み客を集める→購買意欲を高める→購買可能性で格付けする、の順に進む。","level":2},{"q":"高価なMAツール導入を急がず、まず活用を勧められるツールはどれか。","choices":["有料の顧客管理システム","無料のGoogleアナリティクス4(GA4)","高額なAIチャットボット","大型の基幹システム"],"answer":1,"explanation":"月額30万円程度のMAツールを急がず、無料のGA4で改善点を月次で追うところから始めるとよいとされる。","level":2},{"q":"SFAを育てて到達すべき最終段階はどれか。","choices":["報告書","連絡書","情報共有","先行支援"],"answer":3,"explanation":"SFAは報告書→連絡書→計画書→情報共有→先行支援と育て、先行支援段階でAIが次の一手を助言する。","level":3}]},
      "dx08": {"title":"折れない心のつくり方 人生が変わる21日間プログラム","quiz":[{"q":"本書がレジリエンス(折れない心)をどう捉えているか。","choices":["生まれつきの資質","トレーニングで鍛えられるスキル","遺伝で決まるもの","運によるもの"],"answer":1,"explanation":"レジリエンスは生まれつきの資質ではなく、日々のトレーニングで鍛えられるスキルとされる。","level":1},{"q":"本書のプログラムは何日間かけて行う形式か。","choices":["7日間","21日間","100日間","365日間"],"answer":1,"explanation":"3つの観点・全21のポイントを21日間かけて1日1つずつ反復トレーニングする形式。","level":1},{"q":"本書が長期的な幸福を左右する鍵とするものはどれか。","choices":["常に幸せでいること","困難に適切に対処できる力","収入の多さ","人脈の広さ"],"answer":1,"explanation":"人生には幸せでないときがあって当然であり、困難に対処できる力(レジリエンス)こそが鍵とされる。","level":2},{"q":"21のポイントを整理する「3つの観点」に含まれないものはどれか。","choices":["自分","精神","社会","財産"],"answer":3,"explanation":"自分・精神・社会の3観点で構成されており、財産は含まれない。","level":2},{"q":"本書の設計思想として重視されるものはどれか。","choices":["座学中心の知識習得","合図→行動→報酬の習慣化サイクルによる反復練習","一度きりの集中講義","他者との競争"],"answer":1,"explanation":"21のポイントを座学で終わらせず、習慣化サイクルを応用した日々の反復練習で定着させる構成。","level":3}]},
      "dx09": {"title":"経済がわかれば最強! 実は大人も知らないことだらけ","quiz":[{"q":"本書は経済を理解することを何だと述べているか。","choices":["人生の成功率を上げること","単なる暗記作業","専門家だけの領域","無意味なこと"],"answer":0,"explanation":"経済を理解することは人生の成功率を上げることであり、投資判断の土台にもなるとされる。","level":1},{"q":"日本の一人当たりGDPは2000年の世界2位から2021年に何位まで後退したか。","choices":["5位","28位","50位","3位"],"answer":1,"explanation":"2000年の世界2位から2021年には28位まで後退したと述べられる。","level":1},{"q":"本書が説明する日本の年金の構造はどれか。","choices":["1階建て","2階建て","3階建て","5階建て"],"answer":2,"explanation":"国民年金・厚生年金・iDeCoなど個人型確定拠出年金の3階建て構造と説明される。","level":2},{"q":"日本がデフォルトしにくい理由として本書が挙げるのはどれか。","choices":["輸出が多いから","国債が自国通貨(円)建てだから","人口が多いから","金価格が高いから"],"answer":1,"explanation":"ギリシャと異なり日本は自国通貨建て国債のため、理論上は日銀が通貨供給で対応できるとされる。","level":2},{"q":"株式の譲渡益にかかる税率として本書が紹介するのはどれか。","choices":["累進課税で最大55%","一定税率の20.315%","非課税","一律10%"],"answer":1,"explanation":"株式譲渡益には20.315%の一定税率がかかり、累進課税の給与所得より有利になりうる点が紹介される。","level":3}]}
    }

  "strategy": {"themeBookOrder":["strategy01","strategy10","strategy20","strategy30","mgmt01","mgmt10","mgmt20","comp01","comp15","comp30"],"bookQuiz":{"strategy01":{"title":"40代がうまくいく人の戦略書","quiz":[{"q":"本書が生き方・働き方のシフトチェンジを促す対象としているのは何代か。","choices":["20代","30代","40代","60代"],"answer":2,"explanation":"本書は中間管理職の重責と私生活の負荷が重なる40代に向けた指針を示す。","level":1},{"q":"30代までと40代で求められる能力の違いとして本書が挙げるものはどれか。","choices":["与えられた仕事をこなす能力から自ら課題を見つけ生み出す能力へ","専門知識から体力へ","生み出す能力から作業をこなす能力へ","人脈から資格へ"],"answer":0,"explanation":"40代では自ら課題を見つけ生み出す能力や、チームの力を引き出すマネジメント力が問われる。","level":1},{"q":"本書が勧める働き方の転換を正しく表しているのはどれか。","choices":["ギバーからテイカーへ","テイカーからギバーへ","リーダーからフォロワーへ","専門職から管理職へ"],"answer":1,"explanation":"自分の評価ばかり追うテイカーではなく、周囲や社会のために働くギバーへの転換を勧める。","level":2},{"q":"本書がキャリア設計の仮のゴールとして置くよう勧めているのは何か。","choices":["50歳での役員就任","55歳での早期退職","60歳での独立","65歳での再雇用"],"answer":2,"explanation":"60歳で独立するという仮のゴールを置き、そこから逆算して準備することを勧める。","level":2},{"q":"人が生き方を変えられない理由について、著者の指摘はどれか。","choices":["加齢による能力の限界だから","経済的な制約が絶対的だから","変わらないという選択を自らしているに過ぎない","周囲が変化を許さないから"],"answer":2,"explanation":"変われないのは能力の限界ではなく、変わらないという選択を自らしているに過ぎないと指摘する。","level":3}]},"strategy02":{"title":"GAFA next stage","quiz":[{"q":"本書の著者スコット・ギャロウェイの本業に近いのはどれか。","choices":["ニューヨーク大学経営大学院教授","GAFAの現役CEO","投資銀行の頭取","連邦政府の規制当局者"],"answer":0,"explanation":"著者はGAFAという呼称を広めたニューヨーク大学スターン経営大学院の教授である。","level":1},{"q":"パンデミックがGAFAや大手ディスラプターに与えた影響として本書が述べるのはどれか。","choices":["支配力が弱まった","支配力がむしろ強まった","業績に変化はなかった","規制で解体された"],"answer":1,"explanation":"在宅シフトとデジタル依存の加速は規模の経済を持つ強者に有利に働き、支配力はむしろ強まった。","level":1},{"q":"本書がいう消費者の選び方の時代の移行を正しく示すのはどれか。","choices":["プロダクト時代からブランド時代へ","価格時代から品質時代へ","ブランド時代からプロダクト時代へ","実店舗時代から広告時代へ"],"answer":2,"explanation":"消費者が自ら調べ比較するようになり、実質的な製品力で選ばれるプロダクト時代へ転換したとする。","level":2},{"q":"資本主義について本書が指摘する点はどれか。","choices":["富を生まないので廃止すべき","効率的に富を生むが道徳的な歯止めは備わっていない","本来的に倫理基準を内包している","個人の権利を自動的に拡大する"],"answer":1,"explanation":"市場は効率的に富を生むが、それ自体に道徳的な歯止めはないと著者は述べる。","level":2},{"q":"巨大テック企業をめぐり著者が最優先課題として提言するのはどれか。","choices":["巨大企業の権力を強化し規模を拡大する","個人の権利を縮小し企業の裁量を広げる","巨大テック企業の権力を抑制し個人の権利を拡大する","広告規制を撤廃し競争を促す"],"answer":2,"explanation":"著者は巨大テック企業の権力を抑制し、個人の権利を拡大することを最優先課題として提言する。","level":3}]},"strategy03":{"title":"SOLO TIME","quiz":[{"q":"本書がいう「ソロタイム」とは何を指すか。","choices":["ひとりぼっちの時間","大人数での交流の時間","睡眠の時間","仕事に集中する残業時間"],"answer":0,"explanation":"ソロタイムとはひとりぼっちの時間を指し、それを積極的に活用する方法を説く。","level":1},{"q":"本書の著者・名越康文の職業はどれか。","choices":["経営コンサルタント","精神科医","小説家","大学の経済学者"],"answer":1,"explanation":"著者は精神科医であり、メールマガジンの連載を改稿して本書をまとめた。","level":1},{"q":"ソロタイムが緩めるものとして本書が挙げるのはどれか。","choices":["身体の疲労だけ","群れの価値観という無意識の呪縛","金銭への執着だけ","睡眠不足"],"answer":1,"explanation":"ソーシャルタイムの間は群れの慣習や常識に規定されており、ソロタイムはその無意識の呪縛を緩める。","level":2},{"q":"本書は「ソロタイム」の始まりについてどう述べているか。","choices":["特別な旅に出ないと始められない","本を読んでいる時間そのものが既に小さなソロタイムである","退職後でないと持てない","深い瞑想の訓練が前提になる"],"answer":1,"explanation":"本を読んでいる時間そのものが既に小さなソロタイムであり、特別に構える必要はないとする。","level":2},{"q":"ソロタイムを楽しめるようになると起こる逆説的な効果として本書が挙げるのはどれか。","choices":["他人との関わりを完全に断てる","他人への依存から離れることで本当のつながりを取り戻せる","感情が鈍くなり決断できなくなる","群れの常識への依存が強まる"],"answer":1,"explanation":"他人への依存から離れることで、逆説的に他人との本当のつながりや貢献の感覚を取り戻せるとする。","level":3}]},"strategy04":{"title":"Yahoo! JapanのビッグデータとAIが教える21世紀の投資戦略","quiz":[{"q":"本書が株価予測で重要だと強調するのは何か。","choices":["企業業績だけ","投資家の集団心理という空気感","為替レートのみ","政府の金利政策のみ"],"answer":1,"explanation":"相場は業績だけでなく投資家の集団心理という空気感に大きく左右されるとする。","level":1},{"q":"本書の著者・岡田克彦の経歴として本文に沿うのはどれか。","choices":["トレーダー経験を経てビッグデータ研究者に転じた","生まれてからずっと大学教員だった","IT企業を創業した起業家だった","政府の金融規制官だった"],"answer":0,"explanation":"著者は金融機関でのトレーダー経験を経てビッグデータ研究者に転じた人物である。","level":1},{"q":"本書が統計的に確認したと述べる相場の傾向はどれか。","choices":["株価は常に一定である","買われやすくなる季節的傾向が存在する","個別銘柄に傾向はない","夜間のみ株価が上がる"],"answer":1,"explanation":"相場全体や個別銘柄に買われやすくなる季節的傾向、いわゆるモテ期が統計的に確認されたとする。","level":2},{"q":"ビッグデータやAIについて著者が示す見方はどれか。","choices":["確実に未来を当てる魔法の杖である","人間の心理を可視化するための道具であり万能ではない","投資に一切役立たない","人間の判断を完全に不要にする"],"answer":1,"explanation":"ビッグデータやAIは魔法の杖ではなく、人間の心理を可視化する道具であり過信への警鐘を忘れないとする。","level":2},{"q":"長期投資について本書が述べる内容として正しいのはどれか。","choices":["銀行預金の方が明らかに有利である","市場平均を数％上回れば20年で1億円規模の資産形成も非現実的ではない","複利は資産形成に無関係である","短期売買だけが利益を生む"],"answer":1,"explanation":"長期では株式が預金より有利で、市場平均を数％上乗せできれば20年で1億円規模も非現実的ではないとする。","level":3}]},"strategy05":{"title":"エッセンシャル版 マイケル・ポーターの競争戦略","quiz":[{"q":"本書によれば競争の目的は何か。","choices":["ライバルを打ち負かすこと","業界平均を上回る収益性を持続的に確保すること","最大の売上高を得ること","最も安い価格を実現すること"],"answer":1,"explanation":"競争の目的はライバルを打ち負かすことでも最高を目指すことでもなく、持続的な収益性の確保にある。","level":1},{"q":"本書が示す利益の基本方程式はどれか。","choices":["利益＝売上×数量","利益＝価格－コスト","利益＝資産－負債","利益＝収入÷支出"],"answer":1,"explanation":"基本方程式は利益＝価格－コストというシンプルな式に集約されると本書は述べる。","level":2},{"q":"業界の構造と収益性を規定する要因の数を本書は何と呼ぶか。","choices":["三つの成長要因","四つの経営資源","五つの競争要因","七つの習慣"],"answer":2,"explanation":"業界の構造と収益性は既存競合・新規参入・代替品・買い手・売り手という五つの競争要因で規定される。","level":1},{"q":"競争優位の源泉として本書が挙げるのはどれか。","choices":["単一の際立った強み","他社と異なる独自に調整されたバリューチェーン","最も低い人件費","最大の広告予算"],"answer":1,"explanation":"競争優位は他社と異なる独自のバリューチェーンを構築することで生まれ、活動間の組み合わせが模倣困難性の源泉になる。","level":2},{"q":"本書が挙げる優れた戦略の五条件に含まれないのはどれか。","choices":["特徴ある価値提案","他社とのトレードオフ","毎年の戦略の刷新","活動間の適合性"],"answer":2,"explanation":"五条件は価値提案・専用のバリューチェーン・トレードオフ・適合性・継続性であり、毎年の刷新は含まれない。","level":3}]},"strategy06":{"title":"これからの都市ソフト戦略","quiz":[{"q":"人口減少時代の街づくりに本書が必要だとするのは何に基づく戦略か。","choices":["道路や施設のハード拡張","魅力というソフト","人口増加の前提","大規模な補助金"],"answer":1,"explanation":"本書はハードの拡張ではなく、人を惹きつける魅力というソフトに基づく戦略が必要だとする。","level":1},{"q":"本書が提示するコンパクトシティの徒歩圏の目安はどれか。","choices":["400メートル以内","2キロメートル以内","5キロメートル以内","10キロメートル以内"],"answer":0,"explanation":"本書は400メートル以内ですべてが揃う徒歩圏内のコンパクトシティという都市像を提示する。","level":2},{"q":"拡張型都市開発の副作用として本書が挙げるのはどれか。","choices":["都市中心部の空洞化や商店街の衰退","地価の永続的な上昇","農地の急激な増加","人口の一極集中の解消"],"answer":0,"explanation":"無計画な拡張は金太郎飴的な風景を生み、都市中心部の空洞化や商店街の衰退を招いたとする。","level":2},{"q":"本書が提唱する新しい都市のコンセプトを表す言葉はどれか。","choices":["スクラップからビルドへ","ハードからハートへ","地方から都心へ","官から民へ"],"answer":1,"explanation":"著者はハードからハートというコンセプトを掲げ、暮らしやすさや物語性で人を惹きつける発想への転換を説く。","level":1},{"q":"街づくりの成功に不可欠だと本書がいう連携の形はどれか。","choices":["行政のみによる主導","住民のみの自治","行政・住民・民間の三位一体","国と地方の二者協定"],"answer":2,"explanation":"行政・住民・民間の三者が当事者意識を持って連携することが不可欠だとする。","level":3}]},"strategy07":{"title":"つぶれない会社のリアルな経営経理戦略","quiz":[{"q":"本書が警鐘を鳴らす昨今の風潮はどれか。","choices":["経理・管理部門をコストと見なし縮小すること","営業部門を過度に拡大すること","研究開発への投資増加","海外進出の加速"],"answer":0,"explanation":"本書は経理・管理部門をアウトソーシングや縮小の対象と見なす風潮に警鐘を鳴らす。","level":1},{"q":"本書によれば請求書一枚一枚は何の結晶か。","choices":["無駄なコスト","取引先への貢献と感謝","税務当局への義務","経営者の見栄"],"answer":1,"explanation":"請求書一枚一枚は取引先への貢献と感謝の結晶であり、無駄なコストと見なす発想は危険だとする。","level":2},{"q":"潰れる会社と潰れない会社の違いとして本書が挙げるのはどれか。","choices":["社員数の多さ","平時からネガティブな事態を想定した経理戦略の有無","本社ビルの立派さ","広告費の大きさ"],"answer":1,"explanation":"違いは平時から危機を想定した経理戦略を準備しているかどうかにあるとする。","level":2},{"q":"本書が財務戦略について述べる内容はどれか。","choices":["財務戦略だけで経営は維持できる","財務戦略だけでは足りず経理戦略とセットで体力が生まれる","財務戦略は不要である","経理戦略より財務戦略が常に優先する"],"answer":1,"explanation":"資金調達などの財務戦略だけでは足りず、経理戦略とセットで初めて持続的な体力が生まれるとする。","level":1},{"q":"本書が全社員に浸透させるべきだとするものはどれか。","choices":["営業ノルマ意識","経理的マインドセット","コスト削減至上主義","上意下達の徹底"],"answer":1,"explanation":"社員全員が利益という視点で業務を見直せる経理的マインドセットの浸透が好循環を生むとする。","level":3}]},"strategy08":{"title":"なぜ、あの音を聞くと買いたくなるのか","quiz":[{"q":"本書が扱う戦略のテーマはどれか。","choices":["色彩マーケティング","サウンド・マーケティング","香りのマーケティング","価格設定"],"answer":1,"explanation":"本書は音がブランド体験と消費者心理に与える力を解き明かすサウンド・マーケティングを扱う。","level":1},{"q":"本書が豊富な実例として取り上げる代表的な場所はどれか。","choices":["空港の免税店","ディズニーのテーマパーク","証券取引所","大学の図書館"],"answer":1,"explanation":"本書はディズニーのテーマパークをはじめとする豊富な実例を通して音の力を解き明かす。","level":1},{"q":"本書がいう、音や音楽が瞬時に感情を動かし記憶を呼び起こす瞬間を何と呼ぶか。","choices":["ブームモーメント","サイレントタイム","ピークショック","エコーポイント"],"answer":0,"explanation":"ふさわしい音は感情を動かし記憶を呼び起こすブームモーメントを生み、ブランドと消費者を強く結びつける。","level":2},{"q":"広告や接客における声の調子について本書が述べるのはどれか。","choices":["言葉の中身より影響力が小さい","しばしば言葉そのものの内容以上に大きな影響力を持つ","顧客体験に無関係である","音楽があれば不要になる"],"answer":1,"explanation":"声の調子や話し方は、しばしば言葉の内容以上に大きな影響力を持つとする。","level":2},{"q":"本書が理想とする音の設計の考え方はどれか。","choices":["常に大きな音楽を流し続ける","音は単体で機能させ他要素と切り離す","音と静寂のバランスを設計し体験全体を構成する一要素とする","静寂だけを重視し音を排除する"],"answer":2,"explanation":"音は単体でなく、静寂とのバランスを設計し体験全体を構成する一要素として設計されるべきだとする。","level":3}]},"strategy09":{"title":"なぜ戦略で差がつくのか","quiz":[{"q":"本書が指摘する「戦略」という言葉の問題点はどれか。","choices":["難解すぎて誰も使わない","計画や重要なことの同義語として曖昧に使われる","英語圏にしか存在しない","数値でしか表せない"],"answer":1,"explanation":"戦略は計画・目的・ビジョンの同義語や単なる重要なという形容詞として曖昧に使われがちだとする。","level":1},{"q":"本書が示す戦略の定義はどれか。","choices":["目的達成のための資源利用の指針","売上を最大化する計画表","競合を排除する行動計画","組織の理念そのもの"],"answer":0,"explanation":"著者は戦略を目的達成のための資源利用の指針と定義する。","level":2},{"q":"本書によれば戦略に関する問題は突き詰めればどの二点に集約されるか。","choices":["顧客と競合","目的と資源","価格とコスト","時間と場所"],"answer":1,"explanation":"戦略に関するあらゆる問題は突き詰めれば目的と資源の二点に集約されるとする。","level":2},{"q":"資源に巧拙が生じ戦略を持つ意味が生まれる理由として本書が挙げるのはどれか。","choices":["資源が無限だから","資源が有限だから","資源が数値化できないから","資源が誰にも見えないから"],"answer":1,"explanation":"資源は有限だからこそ使い方に巧拙が生じ、そこに戦略を持つ意味が生まれるとする。","level":1},{"q":"戦略の変更について本書が示す原則はどれか。","choices":["判断に迷うたびに頻繁に変えるべき","目的や資源に変化があれば見直すが、いたずらな変更は避ける","一度決めたら決して変えない","毎月見直すのが望ましい"],"answer":1,"explanation":"目的や資源の変化時には見直すが、迷うたびに変更せず上位概念としての一貫性を保つべきとする。","level":3}]},"strategy10":{"title":"ひとり広報の戦略書","quiz":[{"q":"本書がいう「ひとり広報」とは何か。","choices":["広報担当者が自分ひとりしかいない状態","ひとりで起業した経営者","個人事業主全般","広報を外注しない方針"],"answer":0,"explanation":"ひとり広報とは広報担当者が自分ひとりしかいない状態を指す。","level":1},{"q":"ひとり広報が抱える五つの慢性的な不足に含まれるものはどれか。","choices":["資本・設備・在庫・人材・信用","知識・情報・話題・時間・繋がり","価格・品質・納期・保証・実績","土地・建物・機械・車両・工具"],"answer":1,"explanation":"課題は知識・情報・話題・時間・繋がりという五つの不足に集約されるとする。","level":2},{"q":"本書がひとり広報に吹いているとする追い風の背景はどれか。","choices":["広告予算の大幅増加","SNSなど発信手段の民主化","テレビの視聴率上昇","紙媒体の復権"],"answer":1,"explanation":"SNSなど発信手段が民主化され、小さなチームでも大きな声を届けられる環境が整ったとする。","level":1},{"q":"本書の著者・小野茜の立場として本文に沿うのはどれか。","choices":["PR会社の代表であり自らも現役のひとり広報","大企業の広報部長","新聞社の記者","広告代理店の営業"],"answer":0,"explanation":"著者はPR会社の代表であり、自らも現役のひとり広報でもある。","level":2},{"q":"限られたリソースで刺さる話題を作る方法として本書が挙げる三つの視点はどれか。","choices":["予算・人員・時間","媒体・時期・情報","商品・価格・流通","認知・興味・行動"],"answer":1,"explanation":"時代観をつかみ、媒体・時期・情報という三つの視点を掛け合わせることで刺さる話題を作れるとする。","level":3}]},"strategy11":{"title":"オウンドコミュニティ","quiz":[{"q":"本書が次世代のマーケティング手法として提唱するのはどれか。","choices":["インフルエンサーマーケティング","オウンドコミュニティ","マスメディア広告","テレアポ営業"],"answer":1,"explanation":"本書は企業や個人が自ら所有・運営するオウンドコミュニティを次世代の手法として提唱する。","level":1},{"q":"オウンドコミュニティ台頭の背景として本書が挙げるユーザーの居場所の変化はどれか。","choices":["マスメディアへの回帰","コージー・ウェブへのシフト","実店舗への集中","検索エンジンへの依存"],"answer":1,"explanation":"SNSのマスメディア化のなか、ユーザーは親密なコージー・ウェブに居場所を移し始めているとする。","level":2},{"q":"本書が示すオウンドコミュニティの定義に沿うのはどれか。","choices":["他社が運営する広告枠","企業や個人が自ら所有・運営し多方向のコミュニケーションを行う場","検索連動型広告のネットワーク","一方向に情報を配信する仕組み"],"answer":1,"explanation":"オウンドコミュニティは自ら所有・運営し、多方向のコミュニケーションで良質なコンテンツを生む場である。","level":2},{"q":"本書がオウンドコミュニティの設計で重要とする考え方はどれか。","choices":["4P","5 VALUE","3C","SWOT"],"answer":1,"explanation":"設計にはVision・Connect・Interact・Share・Empathyという5 VALUEの考え方が重要だとする。","level":3},{"q":"オウンドコミュニティ運営における運営者の役割として本書が説くのはどれか。","choices":["常に主役として前面に立つ","裏方に徹しファン自身が主役となる場をつくる","発言を厳しく統制する","広告出稿を最優先する"],"answer":1,"explanation":"運営者は裏方に徹し、ファン自身が主役となる場をつくることが成功の鍵だとする。","level":1}]},"strategy12":{"title":"グロービス流 キャリアをつくる技術と戦略","quiz":[{"q":"本書が緩やかな環境変化への警鐘に用いる比喩はどれか。","choices":["井の中の蛙","ゆでガエル","石の上にも三年","泣きっ面に蜂"],"answer":1,"explanation":"徐々に温度が上がる水の中でゆで上がるカエルの比喩で、緩やかな変化に向き合う必要性を説く。","level":1},{"q":"本書の三部構成として正しいのはどれか。","choices":["分析編・戦略立案編・事例編","序論・本論・結論","過去編・現在編・未来編","理論編・演習編・試験編"],"answer":0,"explanation":"本書は分析編・戦略立案編・事例編の三部構成でキャリアの方法論を提示する。","level":2},{"q":"分析編で行うこととして本書が挙げるのはどれか。","choices":["競合他社の財務分析","自分にとって仕事とは何かを掘り下げて分析する","市場規模の推計","上司の評価を予測する"],"answer":1,"explanation":"分析編では、自分にとって仕事とは何か、何を大切に働くかを掘り下げて分析する。","level":2},{"q":"戦略立案編の発想として本書が示すのはどれか。","choices":["過去の実績から積み上げる","なりたい未来から逆算する","他人の指示に従う","現状維持を図る"],"answer":1,"explanation":"戦略立案編では、なりたい未来を描き、そこに到達する方法を未来から逆算して考える。","level":1},{"q":"本書がキャリアについて示す基本的な捉え方はどれか。","choices":["環境の変化に流されるもの","運任せに決まるもの","分析・逆算・学びを通じて主体的につくるもの","上司が決めるもの"],"answer":2,"explanation":"キャリアは流されるものではなく、価値観の分析・未来からの逆算・事例からの学びで主体的につくるものだとする。","level":3}]},"strategy13":{"title":"ササる戦略","quiz":[{"q":"本書がヒットの裏にあると強調するのはどれか。","choices":["優れた商品企画だけ","地道な現場のカイゼンと展開の工夫と n":"本書はランチェスター戦略というフレームワークを通じて同社の強さの秘訣を読み解く。","level":1},{"q":"ジャパネットたかたはもともとどのような店から出発したか。","choices":["東京の大型量販店","長崎の小さなカメラ店","大阪の家電チェーン","通信販売専業の会社"],"answer":1,"explanation":"同社は長崎の小さなカメラ店から出発したと紹介されている。","level":1},{"q":"ランチェスター戦略で「弱者」に有効とされる戦略はどれか。","choices":["ミート（同質化）戦略","差別化戦略","価格破壊戦略","撤退戦略"],"answer":1,"explanation":"弱者には差別化戦略、強者にはミート（同質化）戦略が有効とされる。","level":2},{"q":"同社の最初のターニングポイントとされる出来事はどれか。","choices":["1994年の深夜テレビ番組の開始","全国紙への広告掲載","1990年のNBC長崎放送でのラジオショッピング開始","自社サイトの立ち上げ"],"answer":2,"explanation":"1990年のNBC長崎放送でのラジオショッピング開始が最初のターニングポイントとなった。","level":2},{"q":"ジャパネットたかたが築いた独自ポジショニングの説明として本書に沿うものはどれか。","choices":["徹底した価格訴求のみで勝負する","商品の価値をコンテンツとして語りで伝える","高級ブランドとして希少性を演出する","対面接客を一切排除する"],"answer":1,"explanation":"同社は価格訴求ではなく、商品の価値をコンテンツとして語りで伝える独自ポジショニングを築いた。","level":3}]},"strategy16":{"title":"スタートアップ的人生戦略","quiz":[{"q":"本書が提唱する、自分の人生やキャリアを捉える見方はどれか。","choices":["完成された最終版","永遠のベータ版","使い捨ての試作品","固定された設計図"],"answer":1,"explanation":"本書は自分の人生を永遠のベータ版として捉えるべきだと説く。","level":1},{"q":"本書の著者リード・ホフマンが創業した企業はどれか。","choices":["フェイスブック","リンクトイン","ツイッター","ペイパル"],"answer":1,"explanation":"著者はリンクトイン創業者のリード・ホフマンである。","level":1},{"q":"競争上の強みを築くために噛み合わせるべき「3つの歯車」に含まれるものはどれか。","choices":["資産（強み）","資本金の規模","社歴の長さ","学歴の高さ"],"answer":0,"explanation":"3つの歯車は資産（強み）、大志（志向）、市場環境である。","level":2},{"q":"「ABZプランニング」における「Z」が指すものはどれか。","choices":["現在の主軸となるプラン","現行プランの微調整版","根本的な方向転換案","実行を放棄する案"],"answer":2,"explanation":"Aは現行プラン、Bはその調整版、Zは根本的な方向転換案を並行して持つ発想である。","level":2},{"q":"本書が2012年の著書を全面アップデートする契機として挙げた出来事はどれか。","choices":["リーマンショック","スマートフォンの普及","新型コロナウイルスというブラック・スワンの到来","生成AIの登場"],"answer":2,"explanation":"新型コロナウイルスというブラック・スワンの到来を経て全面的にアップデートされた。","level":3}]},"strategy17":{"title":"ストラテジック・イノベーション 戦略的イノベーターに捧げる10の提言","quiz":[{"q":"本書で新規事業を指す言葉はどれか。","choices":["コアコ","ニューコ","ベンチャー","スピンオフ"],"answer":1,"explanation":"本書は新規事業をニューコ、既存事業をコアコと呼ぶ。","level":1},{"q":"本書は誰に向けた提言をいくつのルールに落とし込んでいるか。","choices":["戦略的イノベーターに捧げる10の提言","起業家に捧げる5つの提言","投資家に捧げる7つの提言","経営者に捧げる3つの提言"],"an ョンを維持する","モチベーションを維持する継続の仕組みを身につける","苦しさを我慢し続ける","毎日長時間だけ勉強する"],"answer":1,"explanation":"意志の力に頼るのではなく継続の仕組みを身につけることが重要で、独学仲間をつくることもその一つである。","level":2},{"q":"本書が根気強さについて示す考え方はどれか。","choices":["根気強さが大事だと精神論で締めくくる","根気強さを支える計画と仕組みそのものをつくる","根気強さは不要だとする","才能があれば根気は要らないとする"],"answer":1,"explanation":"根気強さが大事というだけでは根性論に終わるため、それを支える計画と仕組みをつくることが解決策になる。","level":3}]},"strategy24":{"title":"人を動かすマーケティングの新戦略「行動デザイン」の教科書","quiz":[{"q":"本書が転換を促す発想の方向はどれか。","choices":["行動発想からモノ発想へ","モノ発想から行動発想へ","価格発想から品質発想へ","顧客発想から企業発想へ"],"answer":1,"explanation":"モノから発想するのではなく人の行動から発想する行動デザインへの転換を促す。","level":1},{"q":"本書を著した研究機関はどれか。","choices":["博報堂行動デザイン研究所","電通総研","野村総合研究所","リクルートワークス研究所"],"answer":0,"explanation":"博報堂行動デザイン研究所と國田圭作による一冊である。","level":1},{"q":"本書が行動デザインを考えるうえで有効とする手掛かりはどれか。","choices":["目に見えない人の意識","実際に観察できる人の行動","アンケートの回答","購買履歴の統計のみ"],"answer":1,"explanation":"意識を探るよりも観察できる行動という手掛かりから理由を探るほうが有効とされる。","level":2},{"q":"行動デザインは何ステップで解説されているか。","choices":["3ステップ","6ステップ","10ステップ","4ステップ"],"answer":1,"explanation":"行動デザインは6つのステップに沿って体系的に解説される。","level":2},{"q":"「ビールと紙オムツが一緒に買われる」逸話を本書はどう説明するか。","choices":["店舗の陳列位置が近いから","子育てを手伝う父親が早く帰宅し自宅で飲む行動の変化から","季節要因によるもの","価格の連動によるもの"],"answer":1,"explanation":"子育てを手伝う父親が飲み屋に寄らず早く帰宅し自宅でビールを飲むという行動の変化から説明される。","level":3}]},"strategy25":{"title":"会社を辞めないという選択 会社員として戦略的に生きていく","quiz":[{"q":"本書が示す第三の道とは、会社をどう捉えることか。","choices":["対立すべき相手","チームとして戦略的に活用する場","早く辞めるべき場所","個人が従属する存在"],"answer":1,"explanation":"会社をチームとして戦略的に活用し社会に影響を与える道を第三の道として示す。","level":1},{"q":"本書の著者が経験してきた立場に含まれないものはどれか。","choices":["会社員","社内ベンチャー立ち上げ","起業家","大学教授"],"answer":3,"explanation":"著者は会社員、社内ベンチャー立ち上げ、起業家という立場を経験したと紹介される。","level":1},{"q":"本書が会社の本質として述べる捉え方はどれか。","choices":["個人が競争する場","チーム戦に取り組むための場","利益だけを追う組織","個人の自由を制限する枠"],"answer":1,"explanation":"会社は個人と対立するものではなくチーム戦に取り組むための場だとされる。","level":2},{"q":"成果を最大化するチームづくりについて本書が重視することはどれか。","choices":["同質的なメンバーで固める","異なる性質や視点を持つ人を大事にする","上下関係を厳格にする","個人プレーを推奨する"],"answer":1,"explanation":"異なる性質や視点を持つ人を大事にすることが重要で、同質的なメンバーだけでは視点を取りこぼす。","level":2},{"q":"本書がスタートアップ精神の根本にあると述べるものはどれか。","choices":["短期間で利益を出す意志","社会に変革を起こすという意志","組織を離れて独立する意志","競合を打ち負かす意志"],"answer":1,"explanation":"スタートアップ精神の根本には社会に変革を起こすという意志があるとされる。","level":3}]},"strategy26":{"title":"体力がない人の仕事の戦略","quiz":[{"q":"体力がない人に本書が勧める基本方針はどれか。","choices":["体力をつける努力をする","少しでもラクなやり方を探す","仕事量を無理に増やす","休まず働き続ける"],"answer":1,"explanation":"体力をつけようとするのではなく、少しでもラクなやり方を探す戦略に切り替えるべきだとする。","level":1},{"q":"本書の著者の職業はどれか。","choices":["精神科医","経営コンサルタント","スポーツトレーナー","内科医"],"answer":0,"explanation":"著者は精神科医であり、認知療法の知見も交えて論じている。","level":1},{"q":"本書が示す「手抜き3原則」に含まれるものはどれか。","choices":["ムリして我慢しない","常に全力を出す","苦手なことこそ引き受ける","限界まで頑張る"],"answer":0,"explanation":"手抜き3原則はムリして我慢しない、限界まで頑張らない、嫌なことはやらないである。","level":2},{"q":"本書によれば「心の疲れ」への一番の回復策はどれか。","choices":["長時間の睡眠","自分が好きなことをする","激しい運動","食事量を増やす"],"answer":1,"explanation":"心の疲れには自分が好きなことをするのが一番の回復策になるとされる。","level":2},{"q":"体力不足に悩む人に本書が有効とする心理的アプローチはどれか。","choices":["行動療法","認知療法","精神分析","催眠療法"],"answer":1,"explanation":"思考の偏りを修正する認知療法が有効で、別の視点を持つことで自分を責める思考から抜け出せる。","level":3}]},"strategy27":{"title":"全社戦略がわかる","quiz":[{"level":1,"q":"本書がいう全社戦略とは、誰がどのような視点で考える戦略か。","choices":["単一事業の事業継続を事業部長が考える戦略","経営者や本社が全社的視点で考える戦略","現場担当者が日々の業務改善を積み重ねる戦略","顧客が製品を選ぶ基準を分析する戦略"],"answer":1,"explanation":"複数事業を持つ会社において、経営者や本社が全社的視点で考える戦略が全社戦略であり、個別事業戦略とは本質的に異なるレイヤーの意思決定です。"},{"level":1,"q":"資源配分を各事業部に任せておくと陥りやすいと指摘されるのは何か。","choices":["過剰な全社最適","部分最適の罠","本社機能の肥大化","顧客ニーズの見落とし"],"answer":1,"explanation":"各事業部が自らの最適化を優先すると個別最適に陥りやすく、これを避けるために1つ上の全社的視点が必要になります。"},{"level":2,"q":"事業ポートフォリオ・マネジメントに含まれる意思決定として本書が挙げるのはどれか。","choices":["事業を「まとめる」「分ける」「始める」「やめる」","従業員の給与テーブルを設計する","広告メディアの出稿枠を購入する","製品の店頭価格を毎日調整する"],"answer":0,"explanation":"事業ポートフォリオ・マネジメントは、全社戦略レベルでヒト・モノ・カネを再配分し、事業をまとめる・分ける・始める・やめるという意思決定を行う営みです。"},{"level":2,"q":"本社が考え実践すべきものとして整理された4つの領域に含まれないのはどれか。","choices":["全社機能の戦略検討","事業領域の管理・再編","現場の日次オペレーション代行","監査・評価・企業統治"],"answer":2,"explanation":"本社が担うべきは全社機能の戦略検討・事業領域の管理再編・資源配分・監査評価企業統治の4つで、現場の日次業務代行は含まれません。"},{"level":3,"q":"著者が本書を執筆した問題意識として述べられているのはどれか。","choices":["日本企業には海外展開の事例が不足しているため","経営戦略の教科書の多くが個別事業戦略に終始し全社戦略を正面から扱っていないため","事業部制そのものを廃止すべきだと考えたため","マーケティング理論が戦略論より重要だと考えたため"],"answer":1,"explanation":"著者は、経営戦略の教科書の多くが個別事業戦略に終始し全社戦略を正面から扱っていないという問題意識から、稀有な全社戦略の入門書を執筆しました。"}]},"strategy28":{"title":"戦略「脳」を鍛える BCG流 戦略発想の技術","quiz":[{"level":1,"q":"新しい戦い方を生み出す能力を、BCGでは何と呼んでいるか。","choices":["インサイト","ポジショニング","ベンチマーク","シナジー"],"answer":0,"explanation":"勝てる戦略の構築に必要な頭の使い方と、その結果生まれる新しい視点を、BCGでは「インサイト」と呼びます。"},{"level":1,"q":"著者は、アカデミックな戦略論を学ぶだけではどうなると断言しているか。","choices":["すぐに市場シェアが拡大する","定石・定跡の域を出られずプラスアルファの価値を提供できない","競合の分析が不要になる","感情に訴える提案ができるようになる"],"answer":1,"explanation":"マイケル・ポーターに代表される戦略論を学ぶだけでは定石の域を出られず、プラスアルファの価値は提供できないと著者は断言します。"},{"level":2,"q":"インサイトを成り立たせる2つの要素として挙げられているのはどれか。","choices":["データと直感","スピードとレンズ","論理と感情","規模と速度"],"answer":1,"explanation":"インサイトは「スピード」と「レンズ」という2要素から成り、思考のスピードと人と異なる視点の掛け合わせが新しい戦略を生みます。"},{"level":2,"q":"「スピード」が上がることで得られる効果として本書が述べるのはどれか。","choices":["次々と仮説を打ち立てて実行できる","競合の価格をそのまま模倣できる","定石を暗記しやすくなる","組織の階層が減る"],"answer":0,"explanation":"思考のスピードが上がれば、次々と仮説を打ち立てて実行できるようになると説明されています。"},{"level":3,"q":"既存の戦い方の中で勝ち続けるために本書が求める発想はどれか。","choices":["競合と同じルールで規模を追う","自分が優位となる新しいルールをつくる独自の戦略","戦略論の学習をやめて直感に頼る","価格競争に徹する"],"answer":1,"explanation":"勝ち続けるには自分が優位となる新しいルールをつくる独自の戦略が求められ、既存の戦略論の習得はあくまで出発点に過ぎません。"}]},"strategy29":{"title":"戦略的ストーリー思考入門","quiz":[{"level":1,"q":"本書が「論理だけでは人は動かない」とする理由はどれか。","choices":["論理は理解するのに時間がかかるから","人間は感情の生き物で、固めた論理に感情移入できず腹落ちしないから","論理は記憶に残りやすすぎるから","論理は数字を使わないから"],"answer":1,"explanation":"人間は感情の生き物であり、論理でガチガチに固められた提案には感情移入できず、腹から納得できないと説かれています。"},{"level":1,"q":"仕事がデキる上司の多くに共通する点として本書が指摘するのはどれか。","choices":["ガチガチのロジックで押し切る","意識的か無意識的かを問わずストーリーを語っている","一切の説明を省く","常に多数決で決める"],"answer":1,"explanation":"仕事がデキる上司の多くはロジック一辺倒ではなく、意識的か無意識的かを問わず「ストーリー」を語っている点が共通します。"},{"level":2,"q":"本書がストーリー構築の原則として掲げる数はいくつか。","choices":["3つの原則","5つの原則","9つの原則","12の原則"],"answer":2,"explanation":"本書はストーリーを連続した出来事と捉える、はじまり 知・更新","全社機能の戦略検討","事業領域の管理・再編","四半期ごとの株主優待設計"],"answer":3,"explanation":"4要素は組織ドメインの定義周知更新・全社機能の戦略検討・事業領域の管理再編・監査評価企業統治で、株主優待設計は含まれません。"}]},"strategy37":{"title":"考える。動く。自由になる。15歳からの人生戦略","quiz":[{"level":1,"q":"本書が読者に伝える、自由についての基本的なメッセージはどれか。","choices":["不自由の多くは思い込みに過ぎず、考え行動すれば自由になれる","自由は生まれつき決まっている","自由には多額のお金が必要である","自由は他人が与えてくれるものだ"],"answer":0,"explanation":"「不自由」だと感じることの多くは思い込みに過ぎず、自分の頭で考え自律的に行動することで誰もが自由になれると説かれます。"},{"level":1,"q":"著者が校長として注目を集めた教育改革として述べられているのはどれか。","choices":["宿題廃止・定期テスト廃止","制服の義務化","偏差値ランキングの公表","部活動の全員必修化"],"answer":0,"explanation":"著者は千代田区立麹町中学校長時代に、宿題廃止や定期テスト廃止などの大胆な教育改革を行い注目を集めました。"},{"level":2,"q":"自律心を取り戻すために本書が大切だとする言葉がけはどれか。","choices":["生徒自身の自己決定を促す言葉がけ","正解をすぐ教える言葉がけ","競争を煽る言葉がけ","従順さを求める言葉がけ"],"answer":0,"explanation":"子どもは与えられることに慣れると自律心を失いがちで、生徒自身の自己決定を促す言葉がけが大切だと著者は説きます。"},{"level":2,"q":"合意形成について本書が述べる考え方はどれか。","choices":["すぐ多数決で決めるのは民主主義ではなく、全員がOKになるまで対話を重ねる","最終的には多数決だけが公平である","校長が一人で決めるのがよい","声の大きい人に従うべきだ"],"answer":0,"explanation":"すぐに多数決で決めるのは民主主義ではなく、全員がOKでないなら対話を重ねて合意に至ることが大切で、学校はそのトレーニングの場だとされます。"},{"level":3,"q":"大きな壁に直面したときに重要になると本書がいう「コーピング力」とは何か。","choices":["ストレスやネガティブな感情にうまく対処する力","記憶を丸暗記する力","他人を説得して従わせる力","一人で我慢し続ける力"],"answer":0,"explanation":"コーピング力とは、大きな壁に直面したときのストレスやネガティブな感情にうまく対処する力で、自分で解決できそうかを整理して行動を判断します。"}]},"strategy38":{"title":"課長から部長、そして役員へ 戦略的に出世する技術","quiz":[{"level":1,"q":"本書が企業の異動や昇進をどのようなものとして捉えているか。","choices":["理不尽な人事ではなく合理的なロジックに基づくもの","運と忖度だけで決まるもの","年齢のみで決まるもの","くじ引きで決まるもの"],"answer":0,"explanation":"本書は、企業の異動や昇進は理不尽な人事ではなく合理的なロジックに基づいており、各階層で求められる経営学の知識が異なると説きます。"},{"level":1,"q":"平社員のうちに注力すべきだと本書が述べることはどれか。","choices":["仕事の効率化","役員への根回し","マーケティング理論の実践","組織の再編"],"answer":0,"explanation":"平社員のうちは仕事の効率化に注力し、組織のメカニズムを理解して出世のタイミングを見極めることが重要だとされます。"},{"level":2,"q":"中間管理職の段階で自分自身に適用すべきだと本書が述べる戦略はどれか。","choices":["競争戦略・ドメイン戦略・資源戦略","財務戦略・税務戦略・法務戦略","広報戦略・IR戦略・CSR戦略","撤退戦略・清算戦略・合併戦略"],"answer":0,"explanation":"主任から課長までの中間管理職は、競争戦略・ドメイン戦略・資源戦略を自分自身に適用し、リーダーシップの本質を学ぶべき段階です。"},{"level":2,"q":
