。"},{"q":"ケイパビリティ理論で使われるVRIO分析の4要素の組み合わせとして正しいものは。","choices":["強み・弱み・機会・脅威","価格・品質・流通・宣伝","政治・経済・社会・技術","価値・希少性・模倣困難性・組織"],"answer":3,"level":2,"explanation":"VRIOは価値・希少性・模倣困難性・組織を指し、企業が保有する経営資源・能力を競争優位の源泉として評価する枠組み。"},{"q":"ポジショニング派とケイパビリティ派の対立軸を説明する事例として本書が挙げるのは。","choices":["トヨタ対日産の自動車市場","ゼロックス対キヤノンの複写機市場","アップル対マイクロソフト","コカコーラ対ペプシ"],"answer":1,"level":2,"explanation":"複写機市場で、ゼロックスの特許・チャネル戦略にキヤノンが独自の小型機開発力で挑み逆転した事例で対立軸が説明される。"},{"q":"本書がフレームワークについて述べる内容として正しいものは。","choices":["BCGマトリクスはポーターが考案した","SWOT分析は使えば必ず正解が出る万能ツールである","BCGマトリクス(ヘンダーソン考案)も「ただの整理箱」であり使い方が問われる","フレームワークは暗記さえすれば実務で通用する"],"answer":2,"level":3,"explanation":"SWOT/TOWSやBCGマトリクス(ヘンダーソン考案)も「ただの整理箱」であり、使い方が問われると指摘される。"}]},"mgmt02":{"title":"CX(カスタマー・エクスペリエンス)戦略","quiz":[{"q":"本書がCSとCXを区別する際、CX(顧客体験)が捉えるものは。","choices":["商品単位の合理的な満足度","カスタマー・ジャーニー全体を通じた感情的価値","製造コストの削減幅","株主への配当水準"],"answer":1,"level":1,"explanation":"CSが商品・サービス単位の合理的満足を測るのに対し、CXはなぜそれが欲しいのかという感情的価値をジャーニー全体で捉える。"},{"q":"本書が顧客ロイヤルティの計測指標として挙げるのは。","choices":["NPS(ネット・プロモーター・スコア)","ROE","EPS","PER"],"answer":0,"level":1,"explanation":"NPSは0〜10点で顧客に評価してもらい、推奨者・中立者・批判者に分類して算出する手法である。"},{"q":"シュミットが提唱する5つの経験価値モジュールに含まれないものは。","choices":["感覚的価値(Sense)","情緒的価値(Feel)","経済的価値(Money)","関係的価値(Relate)"],"answer":2,"level":2,"explanation":"5つの経験価値はSense・Feel・Think・Act・Relateであり、経済的価値(Money)はこの枠組みに含まれない。"},{"q":"本書が従来のPDCAに代えて推奨するフレームワークは。","choices":["OODA","STPD(See-Think-Plan-Do)","SWOT","AIDMA"],"answer":1,"level":2,"explanation":"まず現状を見る(See)ことから始めるSTPDを推奨し、机上の計画に陥らないCX改善を目指す。"},{"q":"CX戦略の実践のカギとして挙げられる3つのキーワードとして正しいものは。","choices":["価格・品質・スピード","選択と集中・多角化・撤退","採用・育成・評価","エンパワーメント・クローズド・ループ・トップマネジメント"],"answer":3,"level":3,"explanation":"現場への権限委譲、顧客の声への迅速な対応、トップのコミットメントが実践のカギとされ、チャールズ・シュワブは2004年からCX戦略で業績を回復させた。"}]},"mgmt03":{"title":"KAIKAする経営","quiz":[{"q":"KAIKA経営が前提とする時代背景を表す言葉は。","choices":["VUCA","DX","SDGs","GAFA"],"answer":0,"level":1,"explanation":"変動性・不確実性・複雑性・曖昧性(VUCA)が高まる時代を背景に、KAIKA(開花)経営が提唱される。"},{"q":"KAIKA経営の3要素に含まれるものは。","choices":["株価の最大化","個人のダイナミズム","コスト削減","市場シェア拡大"],"answer":1,"level":1,"explanation":"個人のダイナミズム・組織のダイナミズム・組織の社会性という3要素の同時実現がKAIKA経営の核心である。"},{"q":"本書がPDCAに代わり有効とするループ思考は。","choices":["STPD","PDR","OODA(観察・情勢判断・意思決定・行動)","KPT"],"answer":2,"level":2,"explanation":"急変する市場では計画起点のPDCAでなく、まず観察・情勢判断から始めるOODAループが有効とされる。"},{"q":"JTBグループが自社を再定義したとされる事業領域は。","choices":["交流文化事業","金融事業","不動産事業","製造事業"],"answer":0,"level":2,"explanation":"JTBは「旅行業」から「交流文化事業」へと自社を再定義する「JTB地球いきいきプロジェクト」を展開した。"},{"q":"本書の実践事例の説明として正しいものは。","choices":["日産は都心部でのタクシー事業を展開した","JTBは製造業へ完全転換した","三越伊勢丹はCDP面談で社員のキャリアビジョンを喚起した","三越伊勢丹は全店舗を閉鎖した"],"answer":2,"level":3,"explanation":"三越伊勢丹はCDP面談で社員のキャリアビジョンを喚起し、日産は奥会津でEV移動販売プロジェクトを行った。"}]},"mgmt04":{"title":"「好き嫌い」と経営","quiz":[{"q":"本書が経営者の意思決定の一貫性の源泉とみるものは。","choices":["外的なインセンティブ","「好き嫌い」という内発的なドライバー","政府の規制","株主の要求"],"answer":1,"level":1,"explanation":"良い悪いの合理的判断の奥にある「好き嫌い」という内的論理を、14名の経営者との対談から掘り下げる。"},{"q":"「1番が好き、始末といけずが嫌い」と語った経営者は。","choices":["永守重信(日本電産)","柳井正(ファーストリテイリング)","藤田晋(サイバーエージェント)","出口治明(ライフネット生命)"],"answer":0,"level":1,"explanation":"永守は何でも1番であることを好み、京都商人特有の「始末」の精神と「いけず」を嫌うと語った。"},{"q":"柳井正が持つとされる一貫した好みは。","choices":["ニッチ市場を丁寧に育てること","雑貨的な事業を好むこと","デカい商売を好み、ニッチと雑貨を嫌うこと","管理を徹底すること"],"answer":2,"level":2,"explanation":"柳井は小さくまとまったニッチや雑貨的な事業を嫌い、大きな商売を志向し「管理から大成功は生まれない」という信念を持つ。"},{"q":"「活字と歴史が好き、仕事はどうでもいい」と語ったのは。","choices":["藤田晋","出口治明(ライフネット生命)","永守重信","柳井正"],"answer":1,"level":2,"explanation":"出口は活字と歴史を愛し「仕事は面白く楽しく早く」を信条としつつ、仕事なんかどうでもいいとも語った。"},{"q":"各経営者の「好き嫌い」の説明として正しいものは。","choices":["藤田晋は「今に見てろよ」という原動力を好み、麻雀など勝負事を好む","永守重信は松下幸之助の経営論を理想と絶賛した","柳井正はニッチと雑貨を好んだ","出口治明は歴史を嫌った"],"answer":0,"level":3,"explanation":"藤田は周囲を見返す原動力を好み、ヒップホップや麻雀といった勝負事への嗜好が経営の推進力になっている。"}]},"mgmt05":{"title":"ロレックスの経営史 「ものづくり」から「ゆめづくり」へ","quiz":[{"q":"ロレックスを創業した人物は。","choices":["ハンス・ウィルスドルフ","ジョン・ハント","ピエール=イヴ・ドンゼ","J・ウォルター・トンプソン"],"answer":0,"level":1,"explanation":"1903年、22歳のドイツ人商人ハンス・ウィルスドルフが創業し、独創的な製品として「Rolex」を商標登録した。"},{"q":"本書が挙げるロレックス成功の2つの勝因は。","choices":["大量生産と低価格化","製造と販売の分離、およびJWTとの早期協業","政府補助と関税優遇","M&Aによる規模拡大"],"answer":1,"level":1,"explanation":"製造と販売の分離によりブランド開発に集中でき、JWTとの早期協業で新しい市場を開拓した点が勝因とされる。"},{"q":"ロレックスの二社体制で、ムーブメント製造を担ったのは。","choices":["ジュネーブのロレックス時計","ビエンヌのロレックス製造","ロンドンのJWT","チューリッヒの本社"],"answer":1,"level":2,"explanation":"ムーブメント製造を担う「ロレックス製造」(ビエンヌ)と、組立・販売を担う「ロレックス時計」(ジュネーブ)という二社体制だった。"},{"q":"1947年にロレックスが提携した世界最大の広告会社は。","choices":["サーチ・アンド・サーチ","電通","JWT(J・ウォルター・トンプソン)","オグルヴィ"],"answer":2,"level":2,"explanation":"1947年にJWTと提携し、エベレスト登頂隊のジョン・ハント卿の証言広告など探検家やスポーツ選手の逸話を用いた広告を展開した。"},{"q":"JWTとの協業で確立されたナラティブの変化として正しいものは。","choices":["時計が「権力と自己実現の成功」を表現するアクセサリーへ昇華した","時計が正確な時間を知らせる道具に純化された","時計が安価な日用品として再定義された","時計が投資商品として販売された"],"answer":0,"level":3,"explanation":"1950年代後半には「権力と自己実現の成功」というナラティブが加わり、精密機械から権力を表現するアクセサリーへと昇華した。"}]},"mgmt06":{"title":"すべての働く人のための新しい経営学","quiz":[{"q":"本書がビジネスを捉えるための4要素に含まれないものは。","choices":["ターゲット","バリュー","ブランドロゴ","収益モデル"],"answer":2,"level":1,"explanation":"4要素はターゲット・バリュー・ケイパビリティ・収益モデルであり、ブランドロゴは含まれない。"},{"q":"本書が学習対象を絞ったのはどのレベルか。","choices":["全社レベル","事業レベル","国家レベル","個人レベル"],"answer":1,"level":1,"explanation":"全社レベルを切り捨て、事業部長など多くの人が実際に取り組む事業レベルの理解と実践に特化している。"},{"q":"ターゲットとバリューを決める際に有効とされるフレームワークは。","choices":["STP(セグメンテーション・ターゲティング・ポジショニング)","PPM","5フォース","バランス・スコアカード"],"answer":0,"level":2,"explanation":"STPで顧客を細分化しターゲットとポジショニングを決める。細分化しすぎても大きくしすぎても問題が生じる。"},{"q":"ポーターの「戦略3類型」を本書はどう位置づけるか。","choices":["唯一絶対の正解の戦略である","ターゲットとバリューの組み合わせに過ぎない","収益モデルの計算式である","ケイパビリティの別名である"],"answer":1,"level":2,"explanation":"コストリーダーシップ・差別化・集中の3類型は、ターゲットとバリューの組み合わせに過ぎないと著者は説く。"},{"q":"ケイパビリティとコア・コンピタンスの説明として正しいものは。","choices":["ケイパビリティは資金力のみを指す","コア・コンピタンスは誰でも容易に模倣できる","アマゾンは物流センター投資で持続的競争優位を得た例として挙げられる","ケイパビリティは収益モデルと同義である"],"answer":2,"level":3,"explanation":"ケイパビリティはリソース×オペレーションで、他社が模倣できないコア・コンピタンスが競争優位の源泉。アマゾンの物流投資がその例。"}]},"mgmt07":{"title":"はじめての経営組織論","quiz":[{"q":"本書が出発点とするバーナードによる組織の3つの成立条件は。","choices":["資本・労働・土地","ヒト・モノ・カネ","組織目的・貢献意欲・コミュニケーション","品質・コスト・納期"],"answer":2,"level":1,"explanation":"組織目的・貢献意欲・コミュニケーションを3つの成立条件とし、組織を意思決定のプロセスから捉え直す。"},{"q":"人間の合理性には限界があるとする本書の前提概念は。","choices":["完全合理性","制約された合理性","経済人仮説","期待効用最大化"],"answer":1,"level":1,"explanation":"あらゆる選択肢を網羅的に知ることも結果を正確に予測することもできないという制約された合理性を前提に、調整の仕組みを作る。"},{"q":"本書が説く組織におけるコミュニケーションの本質とは。","choices":["単なる情報の正確な伝達","命令の一方的な伝達","会議の回数を増やすこと","他者の意思決定の前提に変化を加えること"],"answer":3,"level":2,"explanation":"コミュニケーションの本質は情報伝達ではなく、客観的情報だけでなく価値前提も含む他者の前提に変化を加えることにある。"},{"q":"組織と個人の関係を本書はどう捉えるか。","choices":["誘因と貢献のギブ・アンド・テイクの交換関係","支配と服従の一方的関係","完全な利害一致の関係","競争のみの敵対関係"],"answer":0,"level":2,"explanation":"組織が提供する誘因と個人が提供する貢献の交換関係と捉え、貢献意欲を引き出すため目的の関係づけが求められる。"},{"q":"組織ルーティンとイノベーションに関する説明として正しいものは。","choices":["ルーティンは常に固定的で変化しない","遂行的側面では毎回即興的な差異が生まれ、その蓄積が跳躍的変化を生むことがある","イノベーションは現代では重要性を失った","ルーティンには明示的側面しか存在しない"],"answer":1,"level":3,"explanation":"ルーティンには明示的側面と遂行的側面があり、差異のポジティブ・フィードバックの蓄積が跳躍的変化を生むことがある。"}]},"mgmt08":{"title":"世界トップ3の経営思想家による はじめる戦略","quiz":[{"q":"本書は新しいビジネスをどう位置づけているか。","choices":["必ず成功する計画","学びを得るための実験","短期の資金調達手段","既存事業の単なる延長"],"answer":1,"level":1,"explanation":"新規ビジネスは成果があがるか分からない実験であり、学びが第一でコストは二の次という姿勢が重要とされる。"},{"q":"物語の舞台となるウィンザーファームが立ち上げる新規事業は。","choices":["高級アルパカ毛糸ビジネス","観光牧場ビジネス","乳製品ビジネス","精肉ビジネス"],"answer":0,"level":1,"explanation":"経営難のファームがファームコンテストを経て、高級アルパカ毛糸の生産ビジネスを採用する。"},{"q":"実験を行う際の姿勢として本書が説くものは。","choices":["仮説は状況に応じて自由に何度でも変える","論理的な理由がない限り仮説は決して変えず、必ず仮説と結果を比較する","仮説は立てずまず行動する","コストを最優先し学びは後回しにする"],"answer":1,"level":2,"explanation":"仮説を立てて起こりうる事態を想定し、論理的理由がない限り仮説を変えず、必ず仮説と結果を比較することが重要とされる。"},{"q":"アルパカ毛糸の生産にあたりファームが取った対応は。","choices":["従来の羊毛用機械をそのまま流用した","生産を外部に完全に丸投げした","専門家(アルパカのアンドレア)を巻き込み工程を根本から見直した","品質を落として大量生産に踏み切った"],"answer":2,"level":2,"explanation":"従来の羊毛用機械が使えないため、専門家を巻き込んで生産工程を根本から見直した。"},{"q":"本書におけるリーダーの評価基準として正しいものは。","choices":["計画への忠実な実行度","部下の人数の多さ","会議での発言量","実験を通じた学びと成果"],"answer":3,"level":3,"explanation":"リーダーの評価は計画の忠実な実行ではなく、実験を通じた学びと成果であり、学びのスピードを上げることが重視される。"}]},"mgmt09":{"title":"カゴメの人事改革 戦略人事とサステナブル人事による人的資本経営","quiz":[{"q":"本書が人的資本経営の実現に欠かせないとする役職は。","choices":["CHRO(最高人事責任者)","CFO","CTO","COO"],"answer":0,"level":1,"explanation":"戦略人事とサステナブル人事の両立を担うCHROの存在が、人的資本経営に欠かせないとされる。"},{"q":"本書が示す、方向性の異なる2つの人事とは。","choices":["採用人事と教育人事","戦略人事とサステナブル人事","国内人事と海外人事","正社員人事と派遣人事"],"answer":1,"level":1,"explanation":"目的の方向性が異なる戦略人事とサステナブル人事を、安易に一体化させず高度に両立させることが重要とされる。"},{"q":"サステナブル人事の前提となるROCモデルの要素は。","choices":["Risk・Order・Control","Return・Operation・Cost","Respect・Openness・Continuity","Result・Output・Change"],"answer":2,"level":2,"explanation":"サステナブル人事はRespect・Openness・Continuity(ROC)を軸に、地球環境や多様なステークホルダーへの貢献を前提とする。"},{"q":"カゴメがグローバル職務等級制度を導入する際に取ったアプローチは。","choices":["現場の一般社員から先に導入した","役員から導入し、変動報酬比率を20%から50%へ引き上げた","海外拠点を最後に回した","他社制度をそのまま模倣した"],"answer":1,"level":2,"explanation":"10年後のありたい姿から逆算し、役員から評価制度を導入して変動報酬比率を20%から50%へ引き上げ、経営の本気度を可視化した。"},{"q":"「生き方改革」の説明として正しいものは。","choices":["会社視点の「働き方改革」と社員視点の「暮らし方改革」をマッチングさせたもの","労働時間を延ばすための制度","副業を全面禁止する取り組み","海外移住を促す制度"],"answer":0,"level":3,"explanation":"働き方改革と暮らし方改革をマッチングして生き方改革へつなげ、2019年の副業制度やスーパーフレックス、テレワークで総労働時間の短縮も実現した。"}]},"mgmt10":{"title":"ゼロからの経営戦略","quiz":[{"q":"本書は戦略をどのようなものと定義するか。","choices":["何もないところから望ましい現実を生みだす道標","過去の成功事例の再現手法","競合を模倣する手順書","既存理論の暗記"],"answer":0,"level":1,"explanation":"戦略とは常識を疑い背後のメカニズムを掘り下げ、あるべき姿を描いて現実を能動的に創り出す実践的な知的作業とされる。"},{"q":"戦略を立てるうえで本書が最も重要とするものは。","choices":["競合","顧客","株主","政府"],"answer":1,"level":1,"explanation":"戦略で最も重要なのは顧客であり、セグメンテーションを出発点にターゲットへ4P(製品・価格・プロモーション・流通)をフィットさせる。"},{"q":"ストライプインターナショナル創業者・石川康晴の戦略として紹介されるのは。","choices":["「白地の研究」で競合の少ない相手をいち早く見つけ入り込む","大手と真正面から価格競争する","海外市場のみに集中する","M&Aで規模を拡大する"],"answer":0,"level":2,"explanation":"競合の少ない相手をいち早く見つけ入り込む「白地の研究」によって、年商1100億円企業を育てた。"},{"q":"すかいらーくの谷真が行いV字回復を達成した施策は。","choices":["全国一律の新規出店","ロードサイドの需要量に合わせた店舗閉鎖と都市部の新セグメント対応","全店舗の高級化","メニュー数の大幅増加"],"answer":1,"level":2,"explanation":"少子高齢化で郊外型需要が減退する中、需要量に合わせて店舗を閉鎖し都市部の新セグメントにも対応する需要適正化でV字回復した。"},{"q":"TOTOが新築住宅需要の減退に対して行ったこととして正しいものは。","choices":["海外へ生産を全面移転した","新築向け製品のみに一層集中した","事業を縮小し市場から撤退した","政府統計からリモデル事業の成長余地を見出し、ショールームを接点に強化した"],"answer":3,"level":3,"explanation":"政府統計を調べてリモデル事業の成長余地を見出し、ショールームを顧客接点に活用して、リモデルを国内売上の67%を占める柱へ成長させた。"}]},"mgmt11":{"title":"パンチラインの言語学","quiz":[{"q":"本書の著者・川添愛の専門分野は。","choices":["経済学","言語学","心理学","物理学"],"answer":1,"level":1,"explanation":"言語学者の川添愛が、エンタメ8割・言語学2割というスタンスで名ゼリフの言語学的な仕掛けを読み解く。"},{"q":"本書が分析対象とする「パンチライン」とは何か。","choices":["広告のキャッチコピー","政治家の演説","映画・漫画・ドラマの名ゼリフ","法律の条文"],"answer":2,"level":1,"explanation":"人気作品の名ゼリフ(パンチライン)を、音韻・語順・指示詞・敬語表現などの観点から分析する。"},{"q":"『地面師たち』のハリソン山中のセリフで注目される音声学的特徴は。","choices":["「フ」「プ」で始まる両唇音で揃えられている","すべて母音のみで構成されている","外来語を一切含まない","早口言葉になっている"],"answer":0,"level":2,"explanation":"フィジカル・プリミティブ・フェティッシュが両唇音で揃えられ、音声学的にもフィジカルな響きを持つとされる。"},{"q":"『チャーリーとチョコレート工場』の「とびきり甘い人生」という字幕翻訳の巧みさは。","choices":["原文を忠実に直訳した点","原文の否定的なニュアンスが入る余地をなくした点","英語をそのまま字幕に残した点","意味を大きく変えて誤訳した点"],"answer":1,"level":2,"explanation":"“Life had never been sweeter”の否定的なニュアンスを、甘いという味覚表現と「とびきり」に組み替え、否定の余地をなくした巧みな翻訳とされる。"},{"q":"本書の言語学的分析の説明として正しいものは。","choices":["「させていただく」は江戸時代から一般的な表現である","ドラえもんのセリフに指示詞は登場しない","名ゼリフの力は言語学的仕掛けとは無関係である","『タッチ』の「めざせカッちゃん甲子園」は七五調のリズムを持つ"],"answer":3,"level":3,"explanation":"「めざせカッちゃん甲子園」は七五調で、モーラ数が4拍子で読める語呂の良さを持つ。「させていただく」は1990年代から使用が増えた表現である。"}]},"mgmt12":{"title":"プロ経営者・CxOになる人の絶対法則","quiz":[{"q":"本書が示す「第三の経営キャリアの道」とは。","choices":["サラリーマン経営者","起業家","プロ経営者・CxO","個人投資家"],"answer":2,"level":1,"explanation":"サラリーマン経営者・起業家に加え、外部から招聘されるプロ経営者・CxOという第三の道のニーズが高まっている。"},{"q":"CxO(Chief x Officer)を本書は何にたとえているか。","choices":["プロのスポーツ選手","公務員","ボランティア","職人の弟子"],"answer":0,"level":1,"explanation":"プロ経営者は日々トレーニングを重ねて能力を磨き、オファーを受けて活躍する、スポーツ選手のような存在とされる。"},{"q":"経営人材が必要とされる理由として本書が挙げるものは。","choices":["事業承継における後継者不足(企業の2社に1社が悩む)","人件費の削減","海外進出の抑制","株主総会の簡素化"],"answer":0,"level":2,"explanation":"外部環境変化への対応、後継者不足(2社に1社)、M&A増加(年間4000件超)などが経営人材のニーズを押し上げている。"},{"q":"叩き上げで社長になることを本書はどう表現するか。","choices":["確実性の高いキャリア形成法","同期全員と競争して勝ち抜く宝くじのような偶発性を伴う","誰でも到達できる標準ルート","専門性だけで決まる道"],"answer":1,"level":2,"explanation":"叩き上げでの社長就任は宝くじのような偶発性を伴う一方、プロ経営者はより確率の高いキャリア形成法だとされる。"},{"q":"CxOの絶対法則として本書が説くものは。","choices":["経営者と決して対立せず従うこと","専門性を事業と切り離して極めること","経営者の意思決定をサポートし、時に対立してでも直言すること","コンフォートゾーンにとどまり安定を守ること"],"answer":2,"level":3,"explanation":"CxOはナンバー2として経営者の意思決定をサポートし、時に対立してでも直言し、専門性は事業のために存在すると自覚する必要がある。"}]},"mgmt13":{"title":"マッキンゼー ボーダレス時代の経営戦略 2015年新装版","quiz":[{"q":"本書の著者は誰か。","answer":0,"level":1,"explanation":"本書はマッキンゼーの世界のスタッフによるレポート抄訳に、大前研一氏独自の見解を加えた新装版である。","choices":["大前研一","入山章栄","楠木建","稲盛和夫"]},{"q":"本書が挙げる商品化能力を測る4つのポイントに含まれないものはどれか。","answer":2,"level":1,"explanation":"4つのポイントは発売までの時間、市場範囲、製品ラインの種類、外部テクノロジーの取り込み幅であり、社員の平均年齢は含まれない。","choices":["発売までの時間","市場範囲","社員の平均年齢","外部の優れたテクノロジーの取り込み幅"]},{"q":"ボーダレス・マネジメントへの対処で最も重要とされる施策は何か。","answer":1,"level":2,"explanation":"トップも含め社内の各部署に世界の市場や現状に通じた人材を養成することが最も重要な施策とされる。","choices":["国内市場への集中","社内各部署に世界の市場や現状に通じた人材を養成すること","年功序列の徹底","R&D予算の削減"]},{"q":"変革成功の6つの鍵に含まれるものはどれか。","answer":3,"level":2,"explanation":"変革成功の鍵の第一はトップリーダーのコミットメントであり、本書は日本人優先や年功序列などの転換を説く。","choices":["終身雇用の維持","普遍性に乏しい価値観の温存","日本人優先の人事","トップリーダーのコミットメント"]},{"q":"本書が示す理想的なCTOの条件として正しいものはどれか。","answer":0,"level":3,"explanation":"CTOには十分な権限を持たせ、若く好奇心旺盛で現場に近く長期的展望を持つ人物が理想とされる。","choices":["若くて好奇心が旺盛で、イノベーションの現場の近くに身を置き、5〜10年後まで長期的展望を持つ人物","社長業の下請けに徹する人物","短期的な収益のみを追う人物","現場から距離を置く年配の管理者"]}]},"mgmt14":{"title":"世界の経営学者はいま何を考えているのか 知られざるビジネスの知のフロンティア","quiz":[{"q":"本書の著者は誰か。","answer":1,"level":1,"explanation":"著者の入山章栄氏が、世界の経営学の最前線を3つのディシプリンを軸に解説している。","choices":["楠木建","入山章栄","大前研一","佐宗邦威"]},{"q":"本書が挙げるマクロ経営学の3大流派に含まれないものはどれか。","answer":3,"level":1,"explanation":"3大流派は経済学・認知心理学・社会学であり、政治学ディシプリンは挙げられていない。","choices":["経済学ディシプリン","認知心理学ディシプリン","社会学ディシプリン","政治学ディシプリン"]},{"q":"本書によると、持続的な競争優位を実現する企業はアメリカでも全体のどれくらいの割合か。","answer":2,"level":2,"explanation":"持続的な競争優位を実現する企業は全体の2〜5%に過ぎず、優位を保てる期間も短くなっているとされる。","choices":["50〜60%","30〜40%","2〜5%","20〜25%"]},{"q":"両利きの経営における「知の探索」を高める例として本書が挙げるものはどれか。","answer":0,"level":2,"explanation":"3Mの15%ルールやIDEO社の顧客ブレインストーミング文化が、知の →維持→選択"]},{"q":"サクセストラップを免れた例として本書が挙げる企業はどれか。","answer":2,"level":2,"explanation":"深化に偏り探索を怠るサクセストラップを、コダックは免れられず富士フイルムは免れたと対比されている。","choices":["ブロックバスター","コダック","富士フイルム","USAトゥデイの本紙部門"]},{"q":"両利きのリーダーシップを構成する4要素に含まれるものはどれか。","answer":1,"level":3,"explanation":"4要素は戦略的意図・経営陣の関与と保護・両利きのアーキテクチャー・共通のアイデンティティである。","choices":["株主構成の集中化","共通のアイデンティティ","短期利益の最大化","部門間競争の激化"]}]},"mgmt17":{"title":"再起を目指す経営者に贈る 会社の正しい終わらせ方","quiz":[{"q":"本書の著者の職業として正しいものはどれか。","answer":1,"level":1,"explanation":"著者は中小企業診断士・認定事業再生士であり、夫が経営する会社の倒産に自ら立ち会った経験をもとに書いている。","choices":["公認会計士","中小企業診断士・認定事業再生士","弁護士","税理士"]},{"q":"著者が最も避けるべきだと繰り返し訴える選択はどれか。","answer":1,"level":1,"explanation":"会社の傷が深くなる前に責任ある幕引きをすべきで、夜逃げという最悪の選択肢だけは避けるべきだと訴える。","choices":["従業員への説明会","夜逃げ","破産手続き","私的整理"]},{"q":"著者が言う「リバイバル」とは何を指すか。","answer":1,"level":2,"explanation":"従来支援が手薄だった、会社が破綻しても経営者や家族の生活を保障し再起をはかることをリバイバルと呼ぶ。","choices":["会社を売却して利益を得ること","会社が破綻しても経営者や家族の生活を保障し再起をはかること","経営者が引退して隠居すること","海外へ事業を移すこと"]},{"q":"本書における「倒産」の説明として正しいものはどれか。","answer":1,"level":2,"explanation":"倒産は法律的な概念ではなく、経済的に破綻し弁済期の債務を返済できなくなる状態の俗称である。","choices":["明確な法律用語である","経済的に破綻し債務を返済できなくなる状態の俗称である","刑事罰を伴う概念である","黒字企業のみに使われる言葉である"]},{"q":"著者が整理する企業経営の危険度4分類のうち、リバイバルの積極的な指南が必要とされる状態はどれか。","answer":2,"level":3,"explanation":"従来支援は再生成功や再生途上に焦点を当ててきたが、著者は生活を確保して破綻する状態への指南の必要性を説く。","choices":["経営革新などで再生に成功している状態","再生の途上にある状態","再生できないが債権者や家族の生活を確保して破綻する状態","夜逃げのような形で破綻する状態"]}]},"mgmt18":{"title":"使える経営学","quiz":[{"q":"本書が経営学の役立つ最大の理由として挙げるものはどれか。","answer":1,"level":1,"explanation":"経営学は経営持論への固執を防ぎ、他の仮説にも目を向けさせるアンラーニングの道具として使えるとされる。","choices":["正解を直接教えてくれること","固定観念をリセットするアンラーニングを促進すること","名言を提供してくれること","特殊解を提供してくれること"]},{"q":"本書がアンラーニングの型として挙げる4つに含まれないものはどれか。","answer":2,"level":1,"explanation":"4つの型は役割・選択肢・条件・関係性であり、感情は含まれない。","choices":["役割","選択肢","感情","関係性"]},{"q":"ユーザーイノベーションの論理を示す事例として本書が挙げる企業はどれか。","answer":0,"level":2,"explanation":"無印良品のように、ユーザーが企画した商品の方が社員企画より新規性・独自性に富み高業績を生む傾向があるとされる。","choices":["無印良品","3M","IDEO","アマゾン"]},{"q":"社内の 営における「センス」を磨く方法として本書が説くものはどれか。","choices":["理論を体系的に暗記する","資格試験に合格する","事例を読み解き掴み取っていく帰納的な方法","多数決で決める"],"answer":2,"level":1,"explanation":"センスは体系的に教えられるものではなく、優れた戦略の事例を読み解き掴み取っていく帰納的な方法でしか磨けないとされる。"},{"q":"本書が挙げるイノベーションの第一の条件として正しいものはどれか。","choices":["できるかできないかという技術進歩の問題","思いつくかつかないかという問題","資金を集められるかどうか","特許を取得できるかどうか"],"answer":1,"level":2,"explanation":"第一の条件は「できるかできないか」という技術進歩ではなく「思いつくかつかないか」であり、第二の条件は社会にインパクトをもたらすことである。"},{"q":"本書が「アタマが良い」と表現する思考習慣はどれか。","choices":["抽象と具体の往復運動を大きく頻繁に繰り返すこと","常に具体的な数字だけで考えること","抽象論だけを突き詰めること","他人の意見に従うこと"],"answer":0,"level":2,"explanation":"具体を抽象に引き上げ再び具体へ降ろす「抽象と具体の往復運動」を大きく頻繁に繰り返すことが「アタマが良い」ことだと説く。"},{"q":"「会社は誰のものか」といった対立しがちな議論に、本書が引くべきだとする「補助線」は何か。","choices":["株主価値","長期利益","時価総額","従業員満足度"],"answer":1,"level":3,"explanation":"「長期利益」という補助線を引けば、配当・雇用・納税のすべてを同時にハッピーにする道が見えてくるとされる。"}]},"mgmt27":{"title":"経営参謀としての士業戦略 AI時代に求められる仕事","quiz":[{"q":"AI時代に士業が生き残るために転換すべき方向として本書が説くものはどれか。","choices":["作業者から経営参謀へ","参謀から作業者へ","個人事業から法人化へ","国内から海外へ"],"answer":0,"level":1,"explanation":"税務申告書作成のような作業に依存するモデルは立ち行かなくなるため、「作業者」から経営者をサポートする「経営参謀」への転換が生き残りの道とされる。"},{"q":"著者が挙げる、自動化されにくい「人間の仕事」の三大要素の組み合わせとして正しいものはどれか。","choices":["Speed・Cost・Quality","Think・Humanity・Body","Plan・Do・Check","Value・Rarity・Organization"],"answer":1,"level":1,"explanation":"自動化されにくい仕事の三大要素は「Think(思考力・想像力)」「Humanity(人間性)」「Body(物理的実体・法的権利帰属)」であるとされる。"},{"q":"本書が説く「間接的技術的失業」とはどのようなものか。","choices":["新技術の登場で人間が直接不要になること","技術革新による低コスト化で価格競争が激化すること","士業資格が廃止されること","顧客が高齢化して減少すること"],"answer":1,"level":2,"explanation":"間接的技術的失業は、技術革新による低コスト化で価格競争が激化し業界相場が押し下げられる現象を指す。"},{"q":"経営参謀に不可欠なスキルとして本書が挙げる2つはどれか。","choices":["計算力と暗記力","英語力と交渉力","質問力と共感力","営業力と資金力"],"answer":2,"level":2,"explanation":"顧客の課題を引き出す「質問力」と、相手に心を開いてもらう「共感力」が経営参謀に重要なスキルとされる。"},{"q":"本書が示す士業の「第1の基本戦略」として正しいものはどれか。","choices":["自動化されやすい業務を効率化・低コスト化し、相場が下がっても利益が出せる体制を築く","コンサルティング業務をすべて外注する","高単価業務だけに専念し定型業務を完全に廃止する","AI導入を避けて手作業を守る"],"answer":0,"level":3,"explanation":"第1の基本戦略は自動化されやすい業務の効率化・低コスト化を徹底すること、第2は生まれた時間で自動化されにくい高付加価値業務を拡充することである。"}]},"mgmt28":{"title":"経営戦略4.0図鑑","quiz":[{"q":"本書が「戦略4.0」を読み解く4つのビジネスモデルの視点に含まれないものはどれか。","choices":["プラットフォーム","エコシステム","終身雇用","サブスクリプション化"],"answer":2,"level":1,"explanation":"4つのビジネスモデルの視点はプラットフォーム・エコシステム・経済圏・サブスクリプション化であり、終身雇用は含まれない。"},{"q":"本書で紹介される「OMO」の意味として正しいものはどれか。","choices":["Online Merges with Offline","One Market Only","Open Market Operation","Offline Managed Online"],"answer":0,"level":1,"explanation":"OMOは「Online Merges with Offline」の略で、オンラインとオフラインを融合させる打ち手を指す。"},{"q":"企業分析に用いる「ROAマップ」がまとめて表示する2つの指標はどれか。","choices":["株価と配当利回り","売上高営業利益率と総資産回転率","自己資本比率と流動比率","従業員数と店舗数"],"answer":1,"level":2,"explanation":"ROAマップは複数企業の売上高営業利益率と総資産回転率をまとめて表示し、各社の収益体質と資産効率を比較できる。"},{"q":"本書が説く「創発的戦略」の説明として正しいものはどれか。","choices":["事前に綿密に作成される戦略","事業を進めながら軌道修正を重ねて生み出される戦略","競合が採用した戦略を模倣すること","外部コンサルが作成する戦略"],"answer":1,"level":2,"explanation":"戦略には事前作成の「意図的戦略」と、事業を進めながら軌道修正して生み出す「創発的戦略」があり、実際には後者が圧倒的に多いとされる。"},{"q":"ミッション・ビジョン・バリューの三角形のうち、「ミッション」が答える問いはどれか。","choices":["いくら儲けたいか","誰と組みたいか","あなたの会社は何のために存在しているのか","いつまでに達成するか"],"answer":2,"level":3,"explanation":"ミッションは「あなたの会社は何のために存在しているのか」に答えるもので、ビジョンは未来像、バリューは大切にする価値観を示す。"}]},"mgmt29":{"title":"経営戦略としての人的資本開示","quiz":[{"q":"本書が投資家や働き手から高い評価を得る鍵として位置づける開示の姿勢はどれか。","choices":["やっつけ開示","戦略的開示","非開示","最小限開示"],"answer":1,"level":1,"explanation":"人的資本開示を目的ではなく企業価値向上の手段として位置づける「戦略的開示」こそが高い評価を得る鍵とされる。"},{"q":"人的資本開示の国際規格「ISO30414」で定められているメトリックの数はどれか。","choices":["11領域58メトリック","5領域20メトリック","3領域30メトリック","20領域100メトリック"],"answer":0,"level":1,"explanation":"ISO30414ではリーダーシップ・後継者計画・採用・ダイバーシティなど11領域58メトリックが定められている。"},{"q":"本書が示す、S&P500の無形資産比率の2020年時点の水準はどれか。","choices":["17%","50%","90%","30%"],"answer":2,"level":2,"explanation":"S&P500の無形資産比率は1975年の17%から2020年には90%へ拡大したと示されている。"},{"q":"本書が批判する「やっつけ開示」とはどのようなものか。","choices":["開示義務項目だけを最小限の労力で記述するもの","自社の弱みまで詳細に開示するもの","投資家の意見を聞いて改善を重ねるもの","経営ビジョンに紐づけて説明するもの"],"answer":0,"level":2,"explanation":"やっつけ開示は開示義務項目だけを最小限の労力で記述するもので、これでは人的資本経営の質は向上しないとされる。"},{"q":"著者らの3つの提言のうち「中長期的視点」にあたるものはどれか。","choices":["ナラティブな説明","投資対効果を検証する人材版中期計画(人事中計)の策定","HRテクノロジー活用の推進","やっつけ開示の徹底"],"answer":1,"level":3,"explanation":"3つの提言はナラティブな説明、攻めの人事機能強化、そして中長期的視点としての人材版中期計画(人事中計)の策定である。"}]},"mgmt30":{"title":"経営戦略としての異文化適応力","quiz":[{"q":"多国籍チームで成果を出す力である「CQ」は何を意味するか。","choices":["Cultural Intelligence(文化的知能指数)","Company Quality","Communication Quotient","Creative Quality"],"answer":0,"level":1,"explanation":"CQは「Cultural Intelligence(文化的知能指数)」で、多国籍チームで成果を出す力を指す。"},{"q":"ホフステード博士が国民文化の違いをスコア化したモデルは何次元からなるか。","choices":["3次元","6次元","9次元","12次元"],"answer":1,"level":1,"explanation":"権力格差・集団主義対個人主義など6つの評価軸からなる「6次元モデル」で各国文化を0〜100のスコアで表した。"},{"q":"6つの「メンタルイメージ(文化圏)」における日本の位置づけとして正しいものはどれか。","choices":["コンテストに属する","人間ピラミッドに属する","6つのどこにも属さず、1カ国で1つの文化圏を形成する","家族に属する"],"answer":2,"level":2,"explanation":"日本は6つのメンタルイメージのどこにも属さず、1カ国で1つの文化圏を形成している唯一の国とされる。"},{"q":"本書によれば、文化の中核をなすものはどれか。","choices":["目に見える慣行(ふるまい)","幼少期に無意識に形成される価値観","使用する言語","国の法律"],"answer":1,"level":2,"explanation":"文化は目に見える「慣行」と目に見えない「価値観」から構成され、中核をなすのは幼少期に無意識に形成される価値観である。"},{"q":"米英豪加などアングロサクソン諸国が属するメンタルイメージ(文化圏)はどれか。","choices":["ネットワーク","オーガナイザー","太陽系","コンテスト"],"answer":3,"level":3,"explanation":"米英豪加などアングロサクソン諸国は競争を特徴とする「コンテスト」の文化圏に分類される。"}]},"mgmt31":{"title":"経営理念の考え方・つくり方","quiz":[{"q":"本書が説く経営の目的として正しいものはどれか。","choices":["利己ではなく利他","利他ではなく利己","成長ではなく安定","拡大ではなく縮小"],"answer":0,"level":1,"explanation":"経営の目的は「利己」ではなく「利他」であり、会社とは社員を幸せにし社会に貢献するための手段だと説く。"},{"q":"本書の著者・坂上仁志氏が第一人者とされる経営理論はどれか。","choices":["ポーターの競争戦略","ランチェスター戦略","SWOT分析","ブルーオーシャン戦略"],"answer":1,"level":1,"explanation":"著者はランチェスター戦略の第一人者として3000社以上の企業を見てきたと紹介されている。"},{"q":"本書における「経営理念」の定義として正しいものはどれか。","choices":["株主との約束事","信念にまで高まった社長の哲学","社是を短くまとめた標語","行動規範のチェックリスト"],"answer":1,"level":2,"explanation":"経営理念とは「信念にまで高まった社長の哲学」であるとされる。"},{"q":"経営理念の浸透の速さを左右する3つの視点として正しい組み合わせはどれか。","choices":["立場・意志の強さ・社員数","資本金・業種・地域","売上・利益・株価","年齢・学歴・経歴"],"answer":0,"level":2,"explanation":"浸透の速さは、創業者か否かの「立場」、経営者の「意志の強さ」、そして「社員数」の3つの視点によって異なるとされる。"},{"q":"本書が示す、売上30億円以上の企業で経営理念がある会社の割合はどれか。","choices":["47%","60%","76%","90%"],"answer":2,"level":3,"explanation":"売上5億円未満で理念がある会社は47%に留まる一方、30億円以上では76%に理念があり、理念と業績には正比例の関係が見られる。"}]},"mgmt32":{"title":"経営者とは 稲盛和夫とその門下生たち","quiz":[{"q":"稲盛和夫氏が主宰する、中小企業経営者が集う経営塾の名称はどれか。","choices":["盛和塾","松下政経塾","京セラ塾","経営道場"],"answer":0,"level":1,"explanation":"本書は稲盛和夫氏が主宰する経営塾「盛和塾」に集う中小企業経営者7人の証言などを通じて経営者論に迫る。"},{"q":"盛和塾で学んだ経営者たちが、従業員と酒を飲みながら腹を割って話す実践を何と呼ぶか。","choices":["朝礼","コンパ","査定面談","合宿"],"answer":1,"level":1,"explanation":"従業員と酒を飲みながら生き方や働き方を語り合う「コンパ」を通じて従業員の心を統合する実践が紹介されている。"},{"q":"稲盛氏がJAL再建に際して掲げた3つの大義に含まれるものはどれか。","choices":["株価の回復","JALの従業員を守る","海外路線の拡大","機体の刷新"],"answer":1,"level":2,"explanation":"稲盛氏は「日本経済への影響」「JALの従業員を守る」「健全な競争を維持し国民へのサービスを守る」という3つの大義を掲げた。"},{"q":"厳格な計数管理と深遠な理念共有という2つの大命題を両立させるカギは何だとされるか。","choices":["最新の経営手法の導入","経営者個人のストイックな人間性","外部コンサルタントの起用","強力な情報システム"],"answer":1,"level":2,"explanation":"両立のカギは経営手法ではなく、私利私欲を捨て努力を貫く経営者個人のストイックな人間性にあるとされる。"},{"q":"稲盛氏が日本企業低迷の要因として挙げるものはどれか。","choices":["景気の悪化そのもの","資金力の不足","誰にも負けないほど努力する「強い意志」の欠落","技術力の低下"],"answer":2,"level":3,"explanation":"稲盛氏は言い訳をせず景気の良し悪しに関わらず必死に努力する「強い意志」の欠落こそが日本企業低迷の要因だと説く。"}]},"mgmt33":{"title":"経営者のためのリベラルアーツ入門","quiz":[{"q":"自分が知らないことを認める「無知の知」を説いた哲学者は誰か。","choices":["ソクラテス","カント","マルクス","アリストテレス"],"answer":0,"level":1,"explanation":"ソクラテスは「無知の知」によって真理に近づきやすくなると説き、相手に訊いて答えを導かせる「ソクラテスメソッド」でも知られる。"},{"q":"絶対的な価値の形である「イデア」という思想を唱えた哲学者は誰か。","choices":["プラトン","カント","ソクラテス","マルクス"],"answer":0,"level":1,"explanation":"プラトンが唱えた「イデア」は、企業経営における「ビジョン」の方向性や本質を示す言葉に影響を及ぼしているとされる。"},{"q":"アリストテレスが「徳が宿る」と説いた、過不足なく偏らない状態を何と呼ぶか。","choices":["疎外","中庸(メソテース)","定言命法","無知の知"],"answer":1,"level":2,"explanation":"アリストテレスは過不足なく偏らない状態「中庸(メソテース)」の中に徳があり、徳は中庸の追求で成立すると説いた。"},{"q":"カントが重視した、妥協なき絶対的な道徳法則を何と呼ぶか。","choices":["仮言命法","定言命法","剰余価値","イデア"],"answer":1,"level":2,"explanation":"カントは損得勘定的な「仮言命法」ではなく、妥協なき絶対的な道徳法則である「定言命法」を重視した。"},{"q":"本書が指摘する、マルクスの「誤算」とされるものはどれか。","choices":["剰余価値の存在を見落としたこと","資本家の利益を過小評価したこと","中産階級の存在を想定しなかったこと","労働時間を無視したこと"],"answer":2,"level":3,"explanation":"マルクスは労働者が強制労働させられる状態を「疎外」と表現したが、中産階級の存在を想定しなかったことが誤算だったとされる。"}]},"mgmt34":{"title":"職業としてのプロ経営者","quiz":[{"q":"本書が「プロ経営者」を位置づける、キャリアの道としての表現はどれか。","choices":["生え抜き社長の王道","起業家の別名","第3のキャリアの道","定年後の再就職"],"answer":2,"level":1,"explanation":"外部から招かれ企業の成長や再生を請け負う「プロ経営者」は、生え抜きの出世や起業に次ぐ「第3の道」として描かれる。"},{"q":"本書が根拠とした、プロ経営者へのインタビューの人数はどれか。","choices":["10人","50人","100人","31人"],"answer":3,"level":1,"explanation":"本書は31人のプロ経営者へのインタビューをもとに、その実態と地位に至る過程を明らかにしている。"},{"q":"結果が出せなければすぐ解任されるプロ経営者の高額報酬は、何と呼ばれるか。","choices":["Pay at Risk","Base Salary","Fixed Bonus","Stock Grant"],"answer":0,"level":2,"explanation":"結果を出せなければ解任されるため、高い報酬は「リスクに対する報酬(Pay at Risk)」と呼ばれ、オーナー系・ファンド系でその傾向が強い。"},{"q":"31人のインタビューから浮かび上がった、プロ経営者に共通する資質として正しいものはどれか。","choices":["MBA取得が必須である","キャリア上の非連続な試練を乗り越え、内省から学び続ける姿勢","必ずコンサルティング出身である","生え抜きで一社に長く勤めた経験"],"answer":1,"level":2,"explanation":"多くはMBAを必須とせず、キャリア上の非連続な試練を能力をストレッチして乗り越え、内省から学び続ける姿勢が共通していた。"},{"q":"オーナー系企業でプロ経営者が改革を実行する際の鍵とされるものはどれか。","choices":["本社戦略への忠実な実行","投資ファンドの監視","高額なストックオプション","オーナーとの相性や信頼関係"],"answer":3,"level":3,"explanation":"オーナー系企業では経営を全権委任される一方、オーナーとの相性や信頼関係が改革実行の鍵になるとされる。"}]},"comp01":{"title":"50冊のノウハウがこの1冊で！ あらゆるノート本、メモ本を試してみた！ 仕事と勉強にすぐに役立つ「ノート術」大全","quiz":[{"q":"本書が説くノート術の基本的な考え方はどれか。","choices":["一つの万能なノート術ですべての場面に対応する","場面ごとに適したノート術を使い分ける","手帳よりノートを優先して使う","毎日同じフォーマットで書き続ける"],"answer":1,"level":1,"explanation":"一つのノート術ですべてに対応することはできず、場面ごとにふさわしいノート術を使い分けるべきだと著者は説く。"},{"q":"著者は何冊のノート本・メモ本のノウハウを凝縮したとされるか。","choices":["10冊","30冊","50冊","100冊"],"answer":2,"level":1,"explanation":"50冊のノート術・手帳術の書籍から得たノウハウとエッセンスを凝縮している。"},{"q":"考えるときに有効とされるノートの使い方はどれか。","choices":["シンプルに箇条書きで大量に書く","ペンの色を細かく使い分ける","図やイラストで表現する","文章を長く丁寧に綴る"],"answer":0,"level":2,"explanation":"考えるときにはシンプルに箇条書きで大量に書くことが、考えを整理する完成形の一つとされる。"},{"q":"本書が勧めるタスク管理の方法として正しいものはどれか。","choices":["すべてのタスクをノート1冊にまとめる","その日のタスクを5〜6個に絞り付箋に書き出す","10個以上のタスクを毎朝リスト化する","タスクに締切だけを記録する"],"answer":1,"level":2,"explanation":"その日にやるべきタスクを5〜6個に絞り込み付箋に書き出し、最優先タスクを1つ決めて印をつける方法が有効とされる。"},{"q":"ツールについての著者の立場として最も適切なものはどれか。","choices":["必ず紙のノートを使うべきだ","デジタルは効率が悪いので避ける","スケジュール管理はスマホなど別ツールも臨機応変に活用する","付箋は補助的で使う必要はない"],"answer":2,"level":3,"explanation":"ノートだけにこだわらず、スマホや付箋といった別のツールも目的に応じて柔軟に選ぶべきとされる。"}]},"comp02":{"title":"「戦略」大全","quiz":[{"q":"本書がいう優れた戦略の本質はどれか。","choices":["計画を立てたら変更しないこと","計画と予測不可能な現実対応の両立","現実追従だけに徹すること","他社の戦略を模倣すること"],"answer":1,"level":1,"explanation":"優れた戦略とは、明確な意図を持った計画と、目の前の予測不可能な現実への対応をバランスさせるものである。"},{"q":"巻末に掲載されている戦略ツールとして挙げられるものはどれか。","choices":["SWOT分析だけ","ポーターのファイブフォース分析","損益分岐点分析","PPM分析"],"answer":1,"level":1,"explanation":"巻末にはポーターのファイブフォース分析やミンツバーグの意図的戦略と創発的戦略などが掲載されている。"},{"q":"「戦略に関する4つの基本的な質問」に含まれるものはどれか。","choices":["競合は誰か","目標は何か","予算はいくらか","誰に任せるか"],"answer":1,"level":2,"explanation":"4つの質問は、目標は何か、可能なことは何か、目標達成のために何ができるか、計画を修正すべきタイミングはいつか、である。"},{"q":"シンプルな戦略にすることの利点として述べられているものはどれか。","choices":["コストを削減できる","社員が実行に貢献しやすくなる","競合に真似されにくい","策定に時間がかからない"],"answer":1,"level":2,"explanation":"シンプルかつ納得のいく戦略にすれば、社員は実行に貢献しやすくなり全員が情熱を持って取り組むようになる。"},{"q":"本書がいう理想的な戦略計画サイクルとして正しいものはどれか。","choices":["一度立てた戦略を年間固定する","四半期ごとに全面的に作り直す","全体像に時間をかけ年間を通じ4つの質問を検討し続ける","現場に策定を丸ごと委ねる"],"answer":2,"level":3,"explanation":"全体像を描くことに十分な時間をかけたうえで、年間を通じて4つの質問を検討し続けることが理想的とされる。"}]},"comp03":{"title":"ていねいな文章大全 日本語の「伝わらない」を解決する108のヒント","quiz":[{"q":"本書がいう「ていねいな文章」の4条件に含まれないものはどれか。","choices":["正確である","わかりやすい","配慮がある","短くまとまっている"],"answer":3,"level":1,"explanation":"ていねいな文章とは、正確で、わかりやすく、配慮があり、工夫を凝らした文章とされる。短さは条件に含まれない。"},{"q":"各項目に採用されている学習しやすい構成はどれか。","choices":["before/afterの良い例と悪い例の比較","章末の練習問題","用語集による索引","音声解説の付録"],"answer":0,"level":1,"explanation":"各項目にbefore/afterとして良い例と悪い例が比較できるようになっている。"},{"q":"著者の肩書として正しいものはどれか。","choices":["新聞社の元編集長","コピーライター","国立国語研究所教授","小説家"],"answer":2,"level":2,"explanation":"著者は国立国語研究所教授であり日本語のエキスパートである。"},{"q":"「雑な文章」が招きうるリスクとして本書が挙げるものはどれか。","choices":["誤字が増える","予想外の炎上に発展する","文字数が減る","SEOに弱くなる"],"answer":1,"level":2,"explanation":"雑な文章では最後まで読んでもらえず、予想外の炎上に発展するリスクも否定できないとされる。"},{"q":"生成AIについての著者の見方として最も近いものはどれか。","choices":["いずれ人間の文章はすべて不要になる","この人にしか書けない文章は今後も人間から生まれ続ける","AIは論文だけは書けるようになる","文章作成にAIを使うべきではない"],"answer":1,"level":3,"explanation":"生成AIが書く力で人間を上回っても、独創的な小説や論文を書けるとは限らず、この人にしか書けない文章は人間から生み出され続けるとされる。"}]},"comp04":{"title":"みんなのフィードバック大全","quiz":[{"q":"本書が挙げるフィードバックの2種類はどれか。","choices":["肯定と否定","ポジティブフィードバックとギャップフィードバック","口頭と書面","公式と非公式"],"answer":1,"level":1,"explanation":"フィードバックにはポジティブフィードバックとギャップフィードバックの2種類がある。"},{"q":"著者が代表を務めるコンカーは、あるランキングで何年連続1位を獲得したか。","choices":["3年連続","6年連続","9年連続","初の1位"],"answer":1,"level":1,"explanation":"コンカーは「働きがいのある会社」ランキングで6年連続1位を獲得した。"},{"q":"他者からの助言を聞き入れる能力を本書は何と呼ぶか。","choices":["レジリエンス","リテラシー","コーチャビリティ","エンゲージメント"],"answer":2,"level":2,"explanation":"コーチャビリティの高い人は速いペースで成長していくとされる。"},{"q":"フィードバックを行う方向について、本書の立場はどれか。","choices":["上司から部下への一方向のみ","同僚同士に限る","全方向に向けて積極的に行う","経営層だけが行う"],"answer":2,"level":2,"explanation":"フィードバックは上司から部下だけでなく、部下から上司や同僚同士など全方向に積極的に行うべきとされる。"},{"q":"本書のフィードバックの定義について正しいものはどれか。","choices":["ネガティブな指摘のみを指す","ほめることも一種として含む","評価面談だけを指す","上司の専権事項である"],"answer":1,"level":3,"explanation":"フィードバックは弱点や改善点だけでなく強みや長所への気づきも与えるもので、ほめることも一種とされる。"}]},"comp05":{"title":"もっと自分を知って好きになる！ ポジティブ大全","quiz":[{"q":"本書が紹介するストレングスは、いくつのカテゴリで何種類あるか。","choices":["5カテゴリ20種類","7カテゴリ30種類","3カテゴリ15種類","10カテゴリ50種類"],"answer":1,"level":1,"explanation":"ストレングスは全7つのカテゴリ30種類存在するとされる。"},{"q":"7つのカテゴリのうち、著者独自の視点から加えられたものはどれか。","choices":["知恵","勇気","専門性","正義"],"answer":2,"level":1,"explanation":"カテゴリのうち最後の「専門性」は著者独自の視点から加えられたものである。"},{"q":"各ストレングスを解説する4つの視点に含まれるものはどれか。","choices":["価格・入手先","ダークサイドと呼ばれるリスク","歴史的背景","統計データ"],"answer":1,"level":2,"explanation":"各ストレングスは、テクニック、行動、本質的なあり方、そしてダークサイドと呼ばれるリスクの観点から解説される。"},{"q":"本書がネガティブな時代の閉塞感を打開する鍵とするものはどれか。","choices":["自身の強みを知り発揮するポジティブさ","他者との競争","環境を変えること","感情を抑え込むこと"],"answer":0,"level":2,"explanation":"自身の強み＝ストレングスを知り発揮するポジティブさが、閉塞感を打開する鍵とされる。"},{"q":"ネガティブやトラウマについての著者の考えとして正しいものはどれか。","choices":["完全に消
